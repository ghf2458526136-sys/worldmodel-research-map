帧和最近帧，导致较早但仍重要的中程事件无法被后续帧访问。Memory Forcing 在不增大缓存的前提下保留这类历史。", "io": "输入为流式视频生成过程及其固定大小的 KV cache，输出为持续生成的视频帧。摘要未说明具体条件信号。", "steps": ["将定长 KV cache 划分为 sink、archive 和 working 三个区域，以在固定容量内同时容纳不同时间跨度的信息。", "在 archive 区保留多样的中程事件，并在 working 区保留近期运动，以免重要历史随缓存滑动而丢失。", "当绝对时间索引超出训练范围时，在注意力计算时使用 Bank-aware RoPE 重新分配索引，使不同 bank 可区分。", "生成新帧时让注意力访问这些 bank，使后续帧能够利用归档的中程历史，同时维持固定缓存大小。"], "formulas": [{"tex": "\\operatorname{Attn}(q_t,K_t,V_t)=\\operatorname{softmax}\\!\\left(\\frac{\\bigl(R(\\tilde p_q)q_t\\bigr)\\bigl(R(\\tilde{\\mathbf p}_K)K_t\\bigr)^{\\top}}{\\sqrt d}\\right)V_t,\\qquad \\tilde p_i=p_i+\\Delta_{b(i)},\\quad b(i)\\in\\{\\mathrm{sink},\\mathrm{archive},\\mathrm{working}\\}", "caption": "Bank-aware RoPE：在注意力计算时为不同 KV bank 重新分配可区分的位置索引；标准写法，非原文"}, {"tex": "\\mathcal C_t=\\mathcal S_t\\cup\\mathcal A_t\\cup\\mathcal W_t,\\qquad |\\mathcal C_t|=M,\\qquad \\mathbf h_t=\\sum_{b\\in\\{\\mathrm{sink},\\mathrm{archive},\\mathrm{working}\\}}\\operatorname{softmax}\\!\\left(\\frac{q_tK_{t,b}^{\\top}}{\\sqrt d}\\right)V_{t,b}", "caption": "固定容量 KV cache 的 sink/archive/working 分区及跨 bank 注意力聚合；标准写法，非原文"}], "train": "摘要未给训练数据、训练目标和具体训练设置。推理时采用流式生成，在固定大小的 KV cache 中维护 sink、archive 和 working 三个区域，并在注意力时使用 Bank-aware RoPE；摘要未给更具体的推理参数。", "diff": "已有 few-step 系统通常只保留开头帧与最近帧，Memory Forcing 则在相同固定缓存容量内增加专门保存多样中程事件的 archive 区。它还通过 Bank-aware RoPE 处理绝对时间索引越出训练范围的问题。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["分段KV银行", "Bank-aware RoPE", "中程遗忘"], "explain": "想象镜头一路跟着人穿过街巷，几分钟后又回到最初的咖啡馆：人物和场景都该认得出来。可流式视频模型的缓存容量固定，旧画面不断被挤掉，隔久了再回来就容易忘记中程发生过什么。Memory Forcing把缓存分成三段：保留开头的“水槽区”、保存多样旧事件的“归档区”，以及存放眼前画面的“工作区”。绝对时间索引超出范围时，它用Bank-aware RoPE（一种按缓存区重新编码时间位置的方法）让模型分清各段记忆，无须增加缓存。这样，模型既能看当前画面，也能按需取回关键往事。实验中，1.3B模型和Wan2.2-5B都受益；从5秒延长到60秒时性能下降最小，也能复现离开后再返回的场景。", "key_numbers": ["1.3B 与 Wan2.2-5B", "5s→60s 掉点最小", "leave-and-return 可复现"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.11756"], "note": "明确命名并量化\"mid-horizon forgetting\"，把\"只留开头+最近\"这一默认假设的失效点钉死；跨1.3B/5B两规模验证。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 5266, "sx": null}, {"id": "videophy", "title": "VideoPhy", "date": "2024-10-07", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "", "venue": "", "training": "不适用", "status": "速读", "one_liner": "物理合理性评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "detail": {"position": "VideoPhy 被归类为物理合理性评测，关注具身、物理与指令遵循类评测。现有信息未说明其具体要解决的评测问题。", "io": "输入、输出及条件信号均未见明确说明；已知其用途与物理合理性评测有关。", "steps": ["确定评测对象与具体输入形式；现有信息未说明该步骤如何实施。", "进行物理合理性评测；已知信息未说明具体评测流程或判定标准。", "将其归类为具身、物理、指令遵循类的非回溯一致性评测；具体输出形式未说明。"], "formulas": [], "train": "摘要未给", "diff": "已知其属于非回溯一致性评测；现有信息不足以说明与具体已有方法的差别。", "limits": "未见明确说明", "has_abstract": false}, "tags": ["物理常识", "语义遵循"], "explain": "就像看魔术时杯子凭空穿透了桌子，现在很多AI视频画面逼真，细看却常常违反牛顿定律。这篇论文要解决的麻烦，是以往评测只看画面好不好看，发现不了动作是否符合现实规律。作者提出的VideoPhy用了一套物理合理性评测基准，也就是专门测试物体规律的成套考卷，重点检验具身动作与指令遵循。它不做回溯一致性评测，也就是不去回头核对前后帧的历史记忆，仅作为能力评估的辅助参考。这招之所以管用，是因为它避开了画质干扰，直接考察物体受力与运动，能准确测出模型到底懂不懂真实物理。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2406.03520"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "citations": null, "x": 214, "y": 5960, "sx": null}, {"id": "worldmodelbench", "title": "WorldModelBench", "date": "2025-02-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2502.20694", "venue": "", "training": "不适用", "status": "速读", "one_liner": "具身/物理评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "detail": {"position": "WorldModelBench 旨在评估视频生成模型在应用驱动场景中的世界建模能力，重点检验物理规律遵循与指令遵循，而非回溯一致性。它针对一般视频质量基准难以发现的细微世界建模违规进行评测。", "io": "输入是视频生成模型及其生成结果，评测关注结果是否遵循给定指令和物理规律；摘要未说明具体输入格式、条件信号和输出分数形式。输出包括人工标注或自动 judger 对世界建模违规的评估。", "steps": ["设置指令遵循和物理规律遵循等评测维度，以覆盖一般视频质量评测容易忽视的世界建模问题。", "为 14 个前沿模型收集 67K 条人类标注，以形成与人类偏好对齐的评测依据。", "利用高质量人类标注微调 judger，以自动识别视频中的世界建模违规。", "比较 judger 与 GPT-4o 预测违规的准确率，以检验自动评测能力。", "使用 judger 奖励对模型进行对齐训练，以验证奖励优化能否改善世界建模能力。"], "formulas": [], "train": "摘要称使用人类标注微调一个 2B 参数的 judger，并通过最大化该 judger 的奖励进行对齐训练；具体训练数据划分、目标函数、优化器和推理设置摘要未给。", "diff": "相较于只评估一般视频质量的既有基准，WorldModelBench 增加指令遵循和物理规律遵循维度，可检测物体尺寸异常变化等细微违规。它属于具身、物理和指令遵循类评测，不是回溯一致性评测。", "limits": "摘要未见明确说明评测成本、标注覆盖范围及其局限；也未给出评测流程和评分细节。", "has_abstract": true}, "tags": ["物理合理性", "指令遵循"], "explain": "就像你让机械臂推倒桌上的水杯，水往哪流必须当场推演出来，现实里可没有撤销键。很多模型生成的视频看着逼真，但放到具身交互——也就是像机器人那样和物理世界互动时，常常动作走样、违背常理。WorldModelBench搭建了一套专门测试物理规律与指令遵循的考卷，核心是坚持非回溯，也就是推演过程只能单向往前走，绝不给模型倒退修补的机会。这招之所以管用，是因为真实物理世界不可逆，卡死单向因果，才能验出模型是真掌握了规律，还是在蒙混过关。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2502.20694"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "citations": 2, "x": 488, "y": 5960, "sx": null}, {"id": "worldsimbench", "title": "WorldSimBench", "date": "2025-03-24", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "", "venue": "", "training": "不适用", "status": "速读", "one_liner": "具身/物理评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "detail": {"position": "现有信息仅表明 WorldSimBench 被归为具身、物理与指令遵循类评测。它不是非回溯一致性评测，具体要解决的问题未说明。", "io": "输入、输出及条件信号均未说明；现有信息只给出其评测类别。", "steps": ["依据现有说明确认评测类别，以界定其关注范围。", "将其归入具身、物理与指令遵循类评测，避免把它误解为其他类别。", "区分其与非回溯一致性评测；现有信息未提供更具体的评测流程。"], "formulas": [], "train": "摘要未给；训练与推理流程及关键设置均未说明。", "diff": "现有信息将其归类为具身、物理与指令遵循类评测，而非非回溯一致性评测。与其他已有做法的具体差别未说明。", "limits": "未见明确说明", "has_abstract": false}, "tags": ["具身操作", "物理一致"], "explain": "想象指挥机器人在厨房拿玻璃杯，杯子一旦滑落摔碎就没法倒带重来。以往模型在模拟动作时容易穿帮，且现实中的物理交互出错就不可撤销，很难测出连续过程的真实水平。这篇工作提出了WorldSimBench，专门做非回溯一致性评测，也就是不给模型倒退修正的机会，直接看它一镜到底执行连续指令时能不能保持物理逻辑不崩。这招管用就在于真实物理本就不可逆，彻底封死回退偷懒的退路，才能测出模型到底懂不懂物理规律、能不能连贯听懂指挥，为后续研究提供更靠谱的参考。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2410.18072"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "citations": null, "x": 762, "y": 5960, "sx": null}, {"id": "worldscore", "title": "WorldScore", "date": "2025-04-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2504.00983", "venue": "ICCV 2025", "training": "不适用", "status": "速读", "one_liner": "显式相机轨迹的下一场景评测，不测回访", "mechanism": "不涉及记忆机制；3000 例上测 next-scene generation 的可控性/质量/动态，明确不测回访一致性。", "detail": {"position": "WorldScore 构建统一的 world generation benchmark，解决不同生成方法难以在统一设置下比较的问题。它将任务定义为带有显式相机轨迹布局规格的 next-scene generation，不评测回访一致性。", "io": "输入是 next-scene generation 任务及显式相机轨迹布局规格，供不同类型的生成模型生成后续场景。输出是生成的场景结果及其在 controllability、quality 和 dynamics 三方面的评测结果。", "steps": ["整理覆盖多种世界类型的测试样例，以统一的数据集支持不同生成方法的比较。", "将 world generation 设定为 next-scene generation，并提供显式相机轨迹布局规格，以明确场景生成的条件。", "使用 controllability、quality 和 dynamics 三方面的指标评估生成结果，以比较模型在不同能力上的表现。", "在代表性模型上运行评测并汇总结果，以呈现各类方法的优势与挑战。"], "formulas": [], "train": "这是评测基准，摘要未给出模型训练流程或具体推理设置。摘要说明使用 3000 个测试样例评估 19 个代表性模型，覆盖开源和闭源模型。", "diff": "相较于面向单一模型类型的评测，WorldScore 用显式相机轨迹布局规格统一评估 3D、4D 场景生成与视频生成方法。评测聚焦 next-scene generation，不测回访一致性。", "limits": "不评测回访一致性；摘要未见明确说明其他代价与局限。", "has_abstract": true}, "tags": ["相机轨迹", "下一场景打分"], "explain": "想象你推着摄像机拍一镜到底，镜头一直向前推，模型得即时脑补前方的未知画面。过去评测世界模型缺乏统一考卷，很难量化相机移动时画面听不听话。WorldScore做了一套评测基准，在三千个样例上给出明确的相机轨迹，专门考察下一场景生成——也就是按指定镜头走向预测前方新画面的能力。它集中测试生成的可控性、画面质量与动态表现，明确不测回头重访旧地的一致性。这招管用是因为它把考核纯粹锁定在向前看，剔除了记忆机制的干扰，能干净直接地测出模型跟不跟手。", "key_numbers": ["3000 例"], "self_measured": [], "media": ["https://haoyi-duan.github.io/WorldScore/assets/images/control/camera_control/2.jpg", "https://haoyi-duan.github.io/WorldScore/assets/images/overview/dataset_overview.jpg", "https://haoyi-duan.github.io/WorldScore/assets/images/overview/full_screen.png"], "links": ["https://arxiv.org/abs/2504.00983"], "note": "报告只给 arXiv 号与 ICCV 2025，无提交日期。", "parent": null, "link_strength": "", "key": false, "citations": 17, "x": 1036, "y": 5960, "sx": null}, {"id": "loopnav", "title": "LoopNav", "date": "2025-05-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2505.22976", "venue": "", "training": "不适用", "status": "速读", "one_liner": "首个回溯基准，Minecraft 环线轨迹", "mechanism": "不涉及记忆机制；在 Minecraft 环线上测物体级回溯，指标 SGCS。", "detail": {"position": "LoopNav 针对世界模型缺乏长程空间一致性评测与学习数据的问题，提出以 Minecraft 环线导航为核心的数据集和基准。它关注沿路线离开再返回时，场景中的物体级空间关系是否保持一致。", "io": "输入是带有动作信息的 Minecraft 环线导航视频，评测关注返回先前经过的场景时的空间一致性。输出是 Scene Graph Consistency Score，简称 SGCS；动作作为导航条件信号，具体输入格式摘要未给。", "steps": ["在 Minecraft 多种开放世界地点采集环线导航视频及对应动作，为评测提供具有回访结构的长程轨迹数据。", "以环线中的回访场景为评测对象，比较离开后返回时的场景空间信息，以检验长程空间一致性。", "使用 Scene Graph Consistency Score 量化场景图层面的空间一致性，降低像素级变化对评测结果的影响。"], "formulas": [], "train": "摘要未给训练流程、推理流程或关键设置；论文提出的是数据集与基准，摘要未说明具体训练方法。", "diff": "相较于主要强调视觉连贯性或生成质量的既有基准，LoopNav 专门通过环线回访评测长程空间一致性。其 SGCS 面向场景图一致性，并对像素级变化保持不变。", "limits": "摘要未见明确说明。", "has_abstract": true}, "tags": ["环线轨迹", "物体级回溯"], "explain": "就像我们逛公园绕了一大圈，发现半路掉了钥匙得回头去找，以前的研究却没有基准能测出模型能不能顺着原路找回东西。LoopNav 补上了这个缺口，提出首个回溯基准，也就是专门测验模型折返回去定位物体的测试集。它不涉及修改记忆机制，而是在《我的世界》中采集了 250 小时、2000 万帧环线轨迹，在闭合环线上测试物体级回溯，并用 SGCS 也就是目标完成度指标来打分。环形路线让起点终点相连，排除了直行碰运气的侥幸，能真实检验模型是否认得旧地标并精准回头。", "key_numbers": ["250h", "20M 帧"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2505.22976"], "note": "报告只给到月份 2025-05（时间线称『首个回溯基准』）。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 5960, "sx": null}, {"id": "mind", "title": "MIND", "date": "2026-02-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2602.08025", "venue": "", "training": "不适用", "status": "速读", "one_liner": "记忆一致性与动作控制的双轴评测", "mechanism": "不涉及记忆机制；报告只写『双轴』：记忆一致性与动作控制，指标细节未给。", "detail": {"position": "MIND 旨在弥补缺少统一基准来评估 world models 基础能力的问题，重点评测记忆一致性与动作控制。它还考察模型在不同视角和动作空间下的表现。", "io": "输入为视频场景及交互动作条件，包含第一人称和第三人称视角，以及共享或变化的动作空间。输出为 world model 在记忆一致性和动作控制两个维度上的评测结果；具体指标细节摘要未给。", "steps": ["收集并整理多场景视频片段，形成基准数据，以覆盖不同环境和观察视角。", "为场景设置共享或变化的动作空间，包括角色移动速度和相机旋转角度，以测试动作泛化能力。", "在闭环交互评测中输入场景与动作条件，观察模型生成或响应的视觉结果，以评估动作控制。", "跨时间和视角检查模型结果的稳定性与上下文连贯性，以评估记忆一致性。", "提供 MIND-World 作为交互式 Video-to-World 基线，供后续模型进行基准比较。"], "formulas": [], "train": "摘要未给训练数据处理、训练流程、优化方法或推理设置的具体细节；摘要仅说明提出了交互式 Video-to-World 基线 MIND-World。", "diff": "MIND 被介绍为首个开放域、闭环且可重访的 world model 评测基准，并同时评测记忆一致性与动作控制。相比只在单一视角或动作设置下评测，它还覆盖跨视角表现及不同动作空间下的泛化。", "limits": "摘要指出当前 world models 难以维持长期记忆一致性并泛化到不同动作空间；评测成本及其他局限未见明确说明。", "has_abstract": true}, "tags": ["双轴评测", "动作可控"], "explain": "比如你叮嘱助手自己对花生过敏，他嘴上答应得好好的，做饭时却把花生酱端上了桌。现在评估智能体常面临这种麻烦：光看它能不能背出记忆，根本不知道它会不会据此做出对的举动。这篇论文提出了一套叫MIND的评测方案，它设立了双轴，也就是从记忆一致性和动作控制两个维度一起考核。记忆一致性指模型前后说法不冲突、记准事实，动作控制指模型能否把记住的信息落实为具体操作。这招管用在于两手抓，避免了模型像鹦鹉学舌一样只背答案却无法执行，全面测出了记忆到底有没有真正指导行动。", "key_numbers": ["双轴"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.08025"], "note": "只有表格一行，指标名称与数值都缺；无日期。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 5960, "sx": null}, {"id": "r2m-bench", "title": "R2M-Bench", "date": "2026-08-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2608.27328", "venue": "", "training": "不适用", "status": "速读", "one_liner": "300 实例跨 7 模型的回访基准，指标 NMR", "mechanism": "不涉及记忆机制；用同 rollout 校准的 NMR 衡量回溯，覆盖 300 实例、7 个模型。", "detail": {"position": "R2M-Bench 解决回访帧相似度可能被误读为记忆能力的问题，因为相似也可能来自 rollout 变化很少。它用同一 rollout 内的对照估计一般时间稳定性，从而衡量回访特有的一致性。", "io": "输入为参考场景及其 leave-and-return 轨迹帧，评测对象是生成这些轨迹的 action-conditioned video world models。输出包括外观保真度、场景与物体身份、局部几何、持久状态等维度的回访一致性分数，以及 MemoryGain 和 NMR；动作是轨迹的条件信号。", "steps": ["对 rollout 检测离开后返回的时刻，确定每个回访帧对，以形成待评测的回访样本。", "在同一 rollout 中为回访帧对选取 gap-matched non-revisit pair，估计一般时间稳定性，避免把缓慢变化误当作回访记忆。", "再选取 short-range pair 估计短时一致性，为后续归一化提供短时到时间基线的动态范围。", "比较回访对与两类对照对，计算 MemoryGain 和 NMR，以分离回访优势与一般时间稳定性。", "在多个评测维度上汇总分数，并用于比较模型表现及其与人类一致性判断的相关性。"], "formulas": [{"tex": "\\mathrm{MG}=S_{\\mathrm{revisit}}-S_{\\mathrm{baseline}}", "caption": "MemoryGain，表示回访一致性相对 gap-matched 时间基线的一致性优势。"}, {"tex": "\\mathrm{NMR}=\\frac{S_{\\mathrm{revisit}}-S_{\\mathrm{baseline}}}{S_{\\mathrm{short}}-S_{\\mathrm{baseline}}}", "caption": "Normalized Memory Ratio，将回访优势按短时一致性与时间基线之间的动态范围归一化。"}], "train": "这是评测基准，不是摘要所述的模型训练方法。摘要未给训练流程与具体推理设置；摘要说明该基准评测 7 个 action-conditioned video world models。", "diff": "与依赖绝对回访相似度的做法不同，R2M-Bench 同时使用同一 rollout 内的 gap-matched non-revisit pair 和 short-range pair 作相对校准。摘要报告这种校准降低了分数与生成运动之间的相关性，减轻慢动作带来的捷径影响。", "limits": "摘要未明确说明检测回访、构造配对和各评测维度打分的具体实现细节；相对校准依赖同一 rollout 中可用的有效对照样本。", "has_abstract": true}, "tags": ["同rollout校准", "NMR指标"], "explain": "就像我们出门发现忘带钥匙得折返回家拿一样，智能体做任务时也常常需要走回头路，但大家一直没有一把尺子来测它们回头折返的能力。这篇文章做了一个叫 R2M-Bench 的评测基准，覆盖了 300 个任务实例和 7 个模型。它用模型同一次完整执行（也就是 rollout）进行校准，提出了衡量回溯水平的归一化指标 NMR。这招管用在于它完全不涉及额外的记忆机制，而是拿同轨迹自身当对照排除了干扰，公平看清了不同模型在面对复杂环境时自主折返的真实水平。", "key_numbers": ["300 实例", "7 模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.27328"], "note": "报告只在 §5.1 表格给了一行，无日期。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2680, "y": 5960, "sx": null}, {"id": "worldmembench", "title": "WorldMemBench", "date": "2026-10-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2610.19063", "venue": "", "training": "不适用", "status": "精读", "one_liner": "静态保持与动态演化必须分开报的回访基准", "mechanism": "不涉及记忆机制；260 例分静态 200/动态 60，四类轨迹（含多次回访）分别测外观几何与离屏事件演化。", "detail": {"position": "WorldMemBench 旨在评估视频世界模型能否在镜头离开后保持已观察内容，并让世界状态随时间连贯演化。它将静态内容保持与动态事件演化分开测量，诊断模型的世界记忆能力。", "io": "输入是模型生成的视频及基准提供的场景、镜头离开与回访轨迹；条件信号包括初始参考内容和动态事件的预期状态转移。输出是静态与动态记忆评估结果，并报告视频质量和镜头跟随准确度作为补充诊断。", "steps": ["构建 260 个测试案例，分为静态记忆 200 例和动态记忆 60 例，以覆盖内容保持和事件演化两类能力。", "为案例设置四类轨迹，包括受控镜头离开与多次回访，以检验模型在内容不可见期间及重复回访后的记忆表现。", "静态案例将回访内容与固定的初始参考进行比较，分别评估人物身份与外观、物体外观与几何、环境内容与几何。", "动态案例依据离屏事件的预期状态转移评估事件进展与状态持续性，检验世界是否按历史连贯演化。", "汇总外观、几何及事件特定评估，并辅以视频质量和镜头跟随准确度，比较模型表现并分析记忆失效。"], "formulas": [], "train": "摘要未给训练流程与训练设置；该工作描述的是评测基准。摘要未给具体推理设置。", "diff": "该基准不把世界记忆压缩成单一指标，而是区分静态内容保持与动态状态演化，并对两者采用不同参照进行评估。多次回访还可揭示首次回访之后出现的记忆退化。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["静动分测", "多次回访"], "explain": "比如你走出厨房转一圈再回来，桌上的杯子必须原封不动，但灶台上的水可能已经烧开了。以往的评测常把这两类情况混在一块算总分，分不清模型到底哪项不行。这篇工作做了专门测模型回头看能力的评测基准，它不提出记忆算法，而是设计了包含四类轨迹的260个测试例，明确拆分成保持原貌的200个静态场景与发生变化的60个动态场景。这一招之所以灵，是因为它把物体的外观几何与视线之外的离屏事件演化拆开评分，一眼就能看清模型究竟是记不住东西，还是推测不出不在场时的变化。", "key_numbers": ["260 例", "静态 200", "动态 60", "四类轨迹"], "self_measured": [], "media": [], "links": ["https://arxiv.org/html/2610.19063"], "note": "报告只给到月份 2026-10，且仅给 html 链接。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 5960, "sx": null}, {"id": "worldroambench", "title": "WorldRoamBench: An Open-World Benchmark for Long-Horizon Stability of Interactive World Models", "date": "2026-06-30", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2606.31672", "venue": "", "training": "不适用", "status": "速读", "one_liner": "1000+例、10-60秒开放世界长程考卷", "mechanism": "四维各设新指标：逐帧动作指标绕开跨模型语义尺度差、滑窗漂移抓中途非单调坍塌、物理项先过相机与主体跟踪门控、记忆项用过渡段局部3D点云重建加追踪与VLM。", "detail": {"position": "本文提出 WorldRoamBench，用于评估交互式世界模型在长时间连续交互中的稳定性。它关注短时表现无法揭示的动作跟随、视觉稳定、物理合理性与记忆问题。", "io": "输入为自然、城市和室内场景中的测试案例，包含第一人称或第三人称视角，以及持续 10 到 60 秒的 WASD 操作信号；输出为动作、视觉、物理和记忆四个维度的评估结果。物理评估受相机运动与主体跟踪检查门控，记忆评估使用轨迹信息以减轻动作跟随错误的干扰。", "steps": ["构建涵盖多类场景、视角和持续交互时长的测试案例，以覆盖开放世界中的长程行为。", "逐帧计算动作指标，绕开不同模型间语义尺度差异造成的比较困难，并暴露轨迹汇总可能掩盖的动作失败。", "使用滑动窗口评估视觉漂移，以捕捉序列中途出现、且可能非单调变化的视觉坍塌。", "先检查相机运动与主体跟踪，再评估力学、光学和三维一致性，以减少不满足基本跟踪条件时的物理评估混淆。", "按轨迹定位状态过渡，并结合局部三维点云重建、主体跟踪与 VLM 推理评估场景记忆和主体记忆。"], "formulas": [], "train": "这是评测基准；摘要未说明模型训练流程。评估 10 多个开放或闭源模型，使用超过 1000 个测试案例，进行 10 到 60 秒连续 WASD 交互；其余推理设置摘要未给。", "diff": "相较于依赖短时表现或起点与终点对比的评估，本文以逐帧动作指标和滑动窗口漂移度量长程变化。它还通过相机运动与主体跟踪门控物理评估，并以轨迹感知的局部三维重建和追踪加 VLM 推理评估记忆。", "limits": "摘要未见明确说明评测成本、指标实现细节或基准覆盖范围方面的局限。", "has_abstract": true}, "tags": ["滑窗漂移", "点云记忆", "门控物理"], "explain": "想象你在生成的荒野里开车：前几秒路面逼真，几十秒后车却穿墙，转过山头又忘了刚才的营地。WorldRoamBench要解决的，正是互动世界模型短片看着不错、长时间连续游玩却容易失稳，而且不同模型的分数难直接比较的问题。它准备了1000多个、时长10到60秒的开放世界交互任务，测试10多种开源和闭源模型，并从四方面打分：逐帧动作指标看模型是否及时回应操作，避开不同模型语义评分尺度不一；滑动窗口漂移指标沿时间检查画面是否逐渐走样，也能抓住中途突然崩坏；物理评估先确认相机和主体跟踪可靠，再判断运动是否合乎物理；记忆评估则在场景转换处重建局部三维点云，结合跟踪和视觉语言模型检查模型是否记得先前见过的东西。这样既测得久，也能定位失稳发生在哪里。", "key_numbers": ["1000+ 用例", "10-60秒连续交互", "10+ 闭源开源模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.31672"], "note": "测的信号是\"持续性\"：动作跟得住吗、中途会不会塌、物理过不过门控、记忆能不能用局部点云重建对上；结论是最好模型也只到中等分。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 6074, "sx": null}, {"id": "wbench", "title": "WBench: A Comprehensive Multi-turn Benchmark for Interactive Video World Models", "date": "2026-05-25", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2605.25874", "venue": "", "training": "不适用", "status": "速读", "one_liner": "289例1058轮的多轮交互五维评测", "mechanism": "每例给世界设定加多轮交互序列，导航侧统一文本/6-DoF位姿/离散动作三种接口，22个自动子指标由专用视觉模型加LMM合成，全部对齐过人类判断。", "detail": {"position": "WBench 旨在解决交互式视频世界模型缺少统一、全面评测标准的问题。它评估模型在多轮交互中的视频质量、设定遵循、交互遵循、一致性和物理合规性。", "io": "输入是每个测试案例的世界设定与多轮交互序列，导航交互可通过文本、6-DoF 位姿或离散动作输入。输出是模型响应交互生成的视频，以及由自动指标计算的五维评测结果。", "steps": ["构建包含多样场景、风格、主体和视角的案例，并为每例设定世界背景与多轮交互序列，以检验模型跨轮次生成能力。", "纳入导航、主体动作、事件编辑和视角切换四类交互，并统一导航的文本、6-DoF 位姿和离散动作接口，以支持不同原生输入形式的模型评测。", "对模型生成的视频按视频质量、设定遵循、交互遵循、一致性和物理合规性五个维度评估，以覆盖交互式世界模型的关键能力。", "组合专用视觉模型与大型多模态模型构成 22 个自动子指标，并以人类判断验证指标，以评估输出并提供模型诊断依据。", "在 20 个先进模型上运行基准并比较结果，以分析不同模型的优势、弱点与开放挑战。"], "formulas": [], "train": "摘要未给训练流程与关键训练设置。推理时模型根据案例设定和逐轮交互生成视频，再由 22 个自动子指标进行评估；具体推理设置摘要未给。", "diff": "相较于只覆盖部分能力或单轮生成的评测，WBench统一考察五个维度，并以多轮交互案例覆盖四类交互。它还统一导航的三种输入接口，并用经人类判断验证的自动指标评测不同模型。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["多轮交互", "接口统一", "22子指标"], "explain": "想象你在一座虚拟城市里连续问路、转弯、开门：模型不只要生成眼前画面，还得记住此前发生了什么，并对新动作作出合理反应。许多旧评测只看单次生成，难以判断互动是否连贯，也不便比较不同操控方式。WBench设计了289个带世界设定的案例，共1058轮交互，用来评测20个模型；导航统一支持文字、六自由度位姿（位置与朝向）和离散动作三种输入。它用22项自动子指标，从五个方面评价结果，由专用视觉模型和多模态大模型合成评分，并与人类判断对齐。多轮情境能暴露前后矛盾，统一接口让比较更公平，细分指标则把模糊的“表现好”变成可检验的能力。", "key_numbers": ["289 用例", "1058 交互轮", "20个模型", "22子指标"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.25874"], "note": "测画质、设定遵循、交互遵循、一致性、物理合规五维，关键设计是多轮——单轮分数高不代表第二三轮还听话。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 5960, "sx": null}, {"id": "worldmark", "title": "WorldMark: A Unified Benchmark Suite for Interactive Video World Models", "date": "2026-04-23", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2604.21686", "venue": "", "training": "不适用", "status": "速读", "one_liner": "一个WASD适配器统一十个异构模型", "mechanism": "把共享WASD词表翻成各模型原生控制格式，500例同义指令横评；用控制论视角逐轴量方向准确率、方向纯度、响应延迟、运动稳定性，另设记忆与画质套件。", "detail": {"position": "这篇工作解决交互式视频世界模型难以公平比较的问题：不同模型使用不兼容的动作控制格式，现有动作评估也难以刻画模型对指令变化的响应过程。WorldMark 建立统一评测协议，并从控制系统角度评估动作响应，同时评测世界记忆与视觉质量。", "io": "输入是共享 WASD 风格动作指令及标准化测试案例，案例覆盖不同风格、视角和难度；各模型经适配器接收语义一致的控制信号。输出是模型生成的视频，以及逐轴的动作动态指标、世界记忆和视觉质量评测结果。", "steps": ["构建覆盖不同风格、视角和难度的标准化测试案例，以统一测试条件进行横向比较。", "将共享 WASD 词表映射为各模型的原生控制格式，以适配异构模型的动作接口。", "向模型发送标准化动作指令并收集生成结果，以观察世界对交互控制的响应。", "逐轴计算方向准确率、方向纯度、响应延迟和运动稳定性，以区分不同类型的动作跟随表现。", "另行评测世界记忆与视觉质量，以补充动作动态评测并形成综合基准。"], "formulas": [], "train": "这是评测基准工作，摘要未给训练流程、推理参数或关键运行设置。", "diff": "相较于各模型使用不同控制接口的既有做法，WorldMark 以 WASD 共享词表和模型适配器统一动作语义。相较于将动作跟随压缩为轨迹或方向误差的评估方式，它逐轴评估方向准确率、方向纯度、响应延迟和运动稳定性，并结合世界记忆与视觉质量套件。", "limits": "每个新模型需要新增一个适配器。摘要未见明确说明其他代价与局限。", "has_abstract": true}, "tags": ["动作动力学", "逐轴分解", "适配器协议"], "explain": "想象十台游戏角色各拿着不同手柄：你都喊“向前”，它们却可能走偏、迟钝，彼此成绩也难比较。WorldMark要解决的正是视频世界模型控制接口各异、评测不统一的问题。它用WASD这套上下左右方向词作共同语言，再由适配器把指令翻译成每个模型原生的控制格式；新模型只需接一个适配器。研究者用500条同义指令测试10个模型，并从控制论角度——比较命令与实际运动——逐轴衡量方向准确度、动作是否夹带别的方向、响应快慢和运动稳定性，还单独评测记忆与画质。共同入口和同一套测试让横向比较更公平，也让差异更容易定位。", "key_numbers": ["10个模型", "500 用例", "一新模型仅需1个适配器"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2604.21686"], "note": "测的是动作响应曲线本身：最快响应的往往最不稳、画质最好的平移方向准确率垫底、逐轴拆开才看得见\"平移几乎完美但几乎不转\"。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 5960, "sx": null}, {"id": "memobench", "title": "MemoBench: Benchmarking World Modeling in Dynamically Changing Environments", "date": "2026-06-25", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2606.27537", "venue": "", "training": "不适用", "status": "速读", "one_liner": "消失-重现范式专考遮挡期间的变化", "mechanism": "目标先经历物理过程、离开视野、再回来时必须呈更新后的状态；360段有真值片段，四个诊断支柱，自动指标加VQA，专抓\"遮挡期静止场景\"测不出的记忆。", "detail": {"position": "MemoBench 评测视频生成模型能否在目标离开视野期间记住其经历的物理变化，并在目标重现时生成正确的更新状态。它针对只在目标持续可见时评估一致性，或遮挡期间场景保持静止的基准设定。", "io": "输入为包含目标经历物理过程、随后消失并重现的动态场景，以及模型生成的视频结果；摘要未说明具体提示词或条件信号。输出是结合自动指标与 VQA-based assessment 得到的评测结果，用于诊断模型对目标状态变化的记忆一致性。", "steps": ["构建涵盖 synthetic 与 real-world 场景的 ground-truth clips，使评测包含目标在遮挡期间发生变化的情形。", "设置目标经历物理过程、离开视野并再次出现的场景，以检验模型是否保留遮挡期间发生的状态变化。", "让模型生成对应的视频结果，并与 ground-truth clips 所表达的变化状态进行评估。", "结合自动指标与 VQA-based assessment，从四个诊断支柱评估模型表现，以揭示不同方面的记忆一致性问题。"], "formulas": [], "train": "摘要未给训练流程或训练设置。推理与评测方面，摘要说明评估了八个 state-of-the-art 模型，并结合自动指标与 VQA-based assessment；具体推理参数与指标细节摘要未给。", "diff": "不同于主要在目标持续可见时评估一致性的基准，MemoBench要求模型在目标消失期间追踪其经历的变化。它也超越了遮挡期间场景静止的设定，专门评测动态环境中的 disappear-and-reappear 记忆。", "limits": "未见明确说明。", "has_abstract": true}, "tags": ["消失-重现", "状态更新记忆", "有真值片段"], "explain": "想象一个球滚到沙发后：你看不见它时，它可能被踢动；再露面却仍停在原处，说明模型没记住遮挡期间发生了什么。MemoBench要解决的正是视频世界模型的这个麻烦：许多测试里，遮挡时场景静止，模型即使忘了变化也能答对。它用消失—重现测试：物体先经历物理过程，离开视野一段时间，再出现时必须呈现更新后的状态。基准包含360段带真实状态记录的片段，用四个诊断支柱检查模型是否记住变化，并结合自动指标和视觉问答（用问题检验画面理解），评估8个先进模型。让变化发生在看不见的时候，才能测出模型是在记忆世界，还是只根据眼前画面补全视频。", "key_numbers": ["360 段真值clip", "8个SOTA模型", "4个诊断支柱"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.27537"], "note": "信号是\"遮挡期间发生的状态更新能否在重现时对上\"，比只测视野内一致性的基准严格一档；合成加真实混合。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 5960, "sx": null}, {"id": "playworld", "title": "PlayWorld: Benchmarking World Models with Agent Players over Long-Horizon Objectives", "date": "2026-08-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2608.13552", "venue": "", "training": "不适用", "status": "速读", "one_liner": "让agent玩家带长程目标去考世界模型", "mechanism": "派多模态agent玩家按指定长程目标在世界模型里行动，用任务达成替代固定动作序列；171个场景，四维评几何一致、交互保真、视野外演化、认知演化。", "detail": {"position": "PlayWorld 旨在解决不同 video world models 难以公平比较的问题：同一长程目标在不同模型中可能需要不同动作序列，因此固定动作序列评测不适用。它让 Agent Players 通过交互完成指定目标，并据此评估模型表现。", "io": "输入包括当前观察、指定的长程目标，以及 world model 对玩家动作的响应；Agent Player 根据多模态信息选择动作。输出包括交互生成的视频和任务评测结果，评测涵盖四个核心维度及视频质量、可控性指标。", "steps": ["为每个场景指定长程目标，形成 171 个可评测任务，以目标而非固定动作序列定义评测内容。", "将场景观察和目标提供给多模态 Agent Player，使其根据当前交互状态决定下一步行动。", "把 Agent Player 的动作输入 world model，并将模型生成的后续状态反馈给玩家，以持续推进目标任务。", "根据交互过程和生成结果，从几何一致性、交互保真度、视野外演化、认知演化等维度评估模型，并补充视频质量与可控性指标。"], "formulas": [], "train": "摘要未给训练流程或关键训练设置。推理时由多模态 Agent Player 在 world model 中围绕指定长程目标进行交互，再对任务表现和基础能力进行评测。", "diff": "区别于依赖固定动作序列的评测，PlayWorld 以长程目标驱动 Agent Player 与模型交互，允许不同模型通过不同动作路径完成同一目标。它还系统评估几何一致性、交互保真度、视野外演化和认知演化。", "limits": "摘要未见明确的评测代价或方法局限说明；实验指出当前模型在长程交互目标上仍不可靠，尤其难以维持空间一致性和持久状态演化。", "has_abstract": true}, "tags": ["agent玩家", "任务达成率", "视野外演化"], "explain": "想象你让机器人在虚拟小镇里找到钥匙，再用它打开房门。若只检查它能否照着固定动作走，世界模型可能看似合格，却经不起绕路、转身和等待。PlayWorld要解决的正是这种评测失真：它让多模态智能体，也就是能理解图像并采取行动的程序，带着长程目标在模型生成的世界里探索，以任务是否达成取代固定动作序列。基准包含171个场景，评估9个世界模型的几何一致性、交互保真度、视野外演化和认知演化。四个维度分别检查空间是否稳定、动作是否有效、看不见的地方是否合理变化，以及智能体能否据此更新理解。因为玩家会主动探索并追踪目标，这种评测更能检验模型能否支撑持续行动，而非只生成一段好看的画面。", "key_numbers": ["171 场景", "9个世界模型", "4个核心维度"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.13552", "https://github.com/kxding/PlayWorld"], "note": "信号是\"能不能被一个会规划的策略玩到目标\"，把固定动作打分的可比性问题绕开了；结论是长程目标下空间一致与状态持续最不可靠。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2680, "y": 6074, "sx": null}, {"id": "mist", "title": "Execution Before Memory: Diagnosing Memory Failures in Video World Models (MIST)", "date": "2026-10-16", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.23542", "venue": "", "training": "不适用", "status": "速读", "one_liner": "把\"没执行改变\"与\"忘了\"分开诊断", "mechanism": "先让模型在改变被隐藏时布景，之后再要求显形，并卡住提前泄漏；这样低分能定位成\"没执行指令\"而非\"遗忘\"，再用M3-Agent递归改写指令做对照实验。", "detail": {"position": "MIST 旨在区分视频世界模型的记忆失败与指令执行失败，因为模型没有执行场景变化时，后续状态中就没有可供记忆的变化。它通过分离场景设置、变化执行和结果显形来定位瓶颈，并提出 M3-Agent 改善指令执行。", "io": "输入是要求模型生成视频场景及其后续变化的指令，变化在初始布景阶段保持隐藏，并在之后要求模型显形。输出是对变化是否执行以及最后一帧是否呈现结果的评估；过程中控制提前泄漏，作为条件约束。", "steps": ["先让模型根据指令设置场景，同时隐藏待执行的变化，以便建立变化发生前的场景状态。", "控制变化信息在显形阶段前不泄漏，以免模型提前表现出变化、混淆对记忆能力的判断。", "之后要求模型执行并显现变化，检查它是否实际完成了指令要求的状态转移。", "分别评估变化执行与最后一帧结果，避免把未执行变化造成的低分误判为遗忘。", "使用 M3-Agent 递归改写输入指令，观察改写后模型能否执行变化，从执行侧提供对照。"], "formulas": [], "train": "摘要未给出模型训练流程或 M3-Agent 的具体递归改写算法。推理评估按先布景、后要求显形的顺序进行，并控制提前泄漏；M3-Agent 通过递归修改指令细节来促使模型执行请求的变化。", "diff": "已有测试常将场景设置、变化执行和末帧结果合并为一个分数，难以判断低分是否来自遗忘。MIST 将变化执行与其应留下的记忆分开诊断，并用 M3-Agent 检验改进指令表述后模型能否完成变化。", "limits": "摘要未见明确说明评估成本、适用范围或 M3-Agent 递归改写的具体限制。", "has_abstract": true}, "tags": ["执行与记忆解耦", "泄漏控制", "诊断型基准"], "explain": "想象让模型拍一段房间视频：先把红球换成蓝球，最后再让蓝球出现。若结果里没有蓝球，模型可能是忘了，也可能压根没照做；只看成片，难以分清。MIST是一套诊断测试：先要求模型布置场景，却暂时隐藏改变，之后再要求它让改变显形，并阻止它提前露出变化。这样，失败就能更明确地归因于没执行指令，而非遗忘。研究还用M3-Agent——会递归改写指令的智能体——做对照，检验模型是否真能完成改变。结果显示，MIST显形分数提升三倍以上，WRBench T提升26.1%，MBench-T U提升52.7%。", "key_numbers": ["MIST显形分×3以上", "WRBench T +26.1%", "MBench-T U +52.7%"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.23542"], "note": "它同时提出基准与 M3-Agent 方法，引用时要分开；最大贡献是指出很多\"记忆差\"其实是\"指令没执行\"，旧基准的单一分数会误诊。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 6302, "sx": null}, {"id": "worldoracle", "title": "WorldOracle: Benchmarking Action-Conditioned World Models against Real-World Executions", "date": "2026-10-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.18826", "venue": "", "training": "不适用", "status": "速读", "one_liner": "同动作配对真机执行，考动作条件模型", "mechanism": "给同一初始观测与同一低层动作序列，比对预测rollout与真机记录，从物理状态正确性、交互空间对齐、关键交互区保真、多视角动作一致性四维评。", "detail": {"position": "这篇工作提出 WorldOracle，用于评估 action-conditioned world models 是否能在给定动作后复现真实世界中的物理变化与任务状态转移。核心问题是让模型预测 rollout 与配对的真机执行结果进行系统比较。", "io": "输入是相同的初始观测和低层动作序列，条件信号包括初始观测与动作。输出是模型生成的预测 rollout，并与对应的真机记录进行多维度评估。", "steps": ["整理覆盖不同交互动态与具身形态的真实世界训练和评估数据，为模型评测提供真实执行依据。", "构建包含多个长时段片段的评估 episode，并纳入成功与失败执行，以覆盖多样的动作结果和行为分布。", "对每个评测样本向模型提供初始观测与低层动作序列，生成预测 rollout，以便和同条件下的真机执行配对比较。", "从物理状态正确性、交互空间对齐、关键交互区保真和多视角动作一致性四个维度评估预测结果，以刻画模型的不同能力与失效模式。", "在七个代表性 action-conditioned world models 上开展实验，并提供数据集、评估代码与 leaderboard，支持后续比较。"], "formulas": [], "train": "工作重点是构建基准与评估 action-conditioned world models，而非提出新的模型训练方法。摘要提到整理真实世界训练与评估数据，并在七个代表性模型上进行评测；具体训练流程、模型设置与推理细节摘要未给。", "diff": "与缺少配对真机结果或只考察单一指标的评估方式不同，WorldOracle 对相同初始观测和动作序列下的预测 rollout 与真实执行进行对照，并从四个互补维度评估。评估数据还覆盖长时段、多片段以及成功和失败结果。", "limits": "摘要未明确说明基准的计算与数据采集成本、评估指标的具体计算方式，也未说明其适用范围限制。", "has_abstract": true}, "tags": ["真机配对", "动作条件", "操作任务"], "explain": "想象机器人把杯子推向桌边：模型说杯子会滑落，真机却停住了。单看生成视频，很难判断预测是否可信。世界预言机要解决的，正是动作条件世界模型——输入动作、预测后续画面的模型——缺少可靠实测标准的问题。研究者让模型和机器人从同一初始观测出发，执行相同的低层动作序列，再把预测过程与真机录像对照。测试覆盖七个模型，也保留失败执行片段；评估看四件事：物理状态是否正确、交互位置是否对齐、关键接触区域是否保真，以及不同视角下动作是否一致。起点和动作相同，能减少比较中的干扰，让结果更能反映模型预测能力；纳入失败片段，也能检验模型是否呈现真实意外，而不只是生成好看的成功画面。", "key_numbers": ["7个ACWM", "4个评测维度", "含失败执行段"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.18826"], "note": "信号是\"同一动作在真机上会发生什么\"，是少数用真机配对而非仿真当参照的基准；数据集与榜单已放。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 6074, "sx": null}, {"id": "pvbench", "title": "PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level Measurements", "date": "2026-10-19", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.26711", "venue": "", "training": "不适用", "status": "速读", "one_liner": "用物体级6D位姿与守恒残差量化物理", "mechanism": "七个域共46维、600条提示（30%含机械臂/人形/四足/多智能体），可测维度各配专用视觉模型，算出物体6D位姿、米制尺度、法线、运动学与守恒律残差。", "detail": {"position": "PVBench 旨在解决视频生成模型的物理可信度缺乏客观、细粒度测量的问题。它通过物体级测量评估生成视频在几何、运动、动力学和守恒规律等方面的表现。", "io": "输入是 600 条用于 text-to-video 或 image-to-video 的提示及其生成视频，条件信号为文本或图像。输出是覆盖七个域、共 46 个维度的评估结果，其中可测维度包括物体级 6D 位姿、米制尺度、表面法线、运动学量和守恒律残差。", "steps": ["构建覆盖七个评估域的 600 条提示，并纳入多种具身主体，以覆盖不同的物理场景。", "将提示输入 text-to-video 或 image-to-video 模型生成视频，以评估其生成结果的物理可信度。", "对可测维度使用专用视觉模型提取物体级几何与运动信息，以获得可验证的物理测量。", "依据提取结果计算各维度的测量指标，包括运动学量和守恒律残差，以量化视频中的物理表现。", "通过人类评估检验自动指标与人类判断的一致性，并用于评测主流开源和闭源模型。"], "formulas": [], "train": "PVBench 是评测基准，摘要未说明相关模型的训练流程或关键设置。推理评测中，专用视觉模型从生成视频提取物体级测量，并据此评估各维度；自动指标与人类判断的一致性通过人类评估验证。具体推理配置摘要未给。", "diff": "已有基准多依赖粗粒度的视觉语言模型判断，或面向具身世界模型，而非直接评测视频生成。PVBench 对可测物理维度使用专用视觉模型和物体级测量，降低对主观评分的单独依赖。", "limits": "摘要未明确说明计算代价、专用视觉模型的适用范围限制或评测误差来源。", "has_abstract": true}, "tags": ["物体级测量", "守恒残差", "46维指标"], "explain": "想象视频里一个杯子被推下桌：它可能看起来很真实，却在落地后穿过地板，或大小忽然改变。只凭观感打分，很难准确抓出这类物理破绽。PVBench把检查落到物体上：6D位姿就是物体在三维空间的位置和朝向；再测米制尺度、表面法线和运动学，并计算守恒律残差，也就是物理量偏离应有规律的程度。它覆盖七个领域、46个可测维度，配备专用视觉模型，并用600条提示测试，其中30%涉及机械臂、人形、四足或多智能体。逐项测量能把“看着不对”变成可比较的数值，也让评测更容易定位视频生成在哪种物理规律上出错。", "key_numbers": ["600 条提示", "30% 含具身智能体", "46维 / 7域"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.26711"], "note": "明确要摆脱主观打分：能算的维度全部落成可验证数值（6D位姿、米制尺度、法线、守恒残差），并做了自动指标与人工判断的一致性验证。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 6416, "sx": null}, {"id": "orbia", "title": "Orbia: Do Generated Videos Form a Consistent 3D World?", "date": "2026-10-14", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.20693", "venue": "", "training": "不适用", "status": "速读", "one_liner": "回头再看：生成的视频是否同一个3D世界", "mechanism": "用带标注锚点的720个实例与六种探索-重访协议，比重访未见区域与首次生成、跨视角深度与特征对应、区域尺度一致、留出高斯重渲染，判3D自一致与内容持久。", "detail": {"position": "Orbia 研究视频生成模型在探索与重访过程中，生成画面是否持续对应同一个 3D 世界。它提供系统化基准，评估输入场景是否被保留、模型新生成的内容是否持久，以及不同视角是否符合 3D 自一致性。", "io": "输入是场景与交互探索和重访过程，模型可由文本、动作或相机条件驱动。输出是针对外观、几何、空间稳定性、生成内容持久性和 3D 自一致性的评估结果。", "steps": ["汇集公开数据集、自采场景和仿真场景，构建带有注册 RGB-D 参考与标注锚点的数据实例，以便对生成结果进行参照评估。", "按六种探索与重访协议控制场景交互，并记录模型在探索和返回场景时生成的视图，以测试短期及长期一致性。", "将重访时输入图像中未出现区域的生成结果与其首次观测比较，以衡量模型是否保留自己创建的内容。", "利用跨视角深度与特征对应、区域尺度一致性及留出 Gaussian 渲染，检查不同视图能否描述同一个 3D 场景。", "结合参考图像与标注锚点评估外观、几何和空间稳定性，并在多种模型上运行基准以诊断一致性问题。"], "formulas": [], "train": "摘要未说明训练流程；评测覆盖 27 个文本、动作和相机条件模型，并通过 native-interface adapters 接入。摘要未给出推理时的关键参数设置。", "diff": "已有基准通常只评估部分几何属性，或用 vision-language models 判断记忆与一致性。Orbia 通过受控探索与重访，联合评估输入保留、生成内容持久性和 3D 自一致性，并纳入长时间尺度测试。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["重访一致性", "3D自一致", "高斯重渲染"], "explain": "想象你在一段生成视频里走进房间，转身离开，再回来：桌上的杯子还在原处吗？许多视频看起来连贯，却可能在镜头转开后悄悄改写场景，难以判断它们是否真的维持同一个三维世界。Orbia用720个带有位置标记的场景实例，测试27个模型，并设计六种“探索后重访”的过程，让模型生成离开前后的画面。它比较重访区域与第一次生成的内容，也检查不同视角下的深度和图像特征是否对得上、区域大小是否稳定；最后把未参与测试的三维高斯场景重新渲染，检验能否还原画面。三维高斯是一种用许多带颜色与形状的空间点表示场景的方法。这些检查分别追问物体有没有变、空间关系是否一致、场景能否重建，因此比只看单段视频是否逼真，更能揭示生成内容能否持久且自洽。", "key_numbers": ["720 实例", "27个模型", "6种探索-重访协议"], "self_measured": [], "media": ["https://orbia-bench.github.io/assets/nus.png"], "links": ["https://arxiv.org/abs/2610.20693"], "note": "测两个不同信号：模型自己造出来的内容回头还在不在（content persistence），以及多视角是否描述同一场景（3D self-consistency），长分钟级探索才算过关。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 6188, "sx": null}, {"id": "pawbench", "title": "PAWBench: How Far Are We from Probabilistically Aligned World Modeling?", "date": "2026-08-27", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2608.27345", "venue": "", "training": "不适用", "status": "速读", "one_liner": "同一观测与动作，重复采样的分布对不对", "mechanism": "提出\"概率对齐\"：世界模型要复现同一初始观测与动作下多种合法演化的分布，而非单条轨迹可信；PAWEval把多次rollout转成行为经验分布再与参考比对。", "detail": {"position": "本文研究视频生成模型作为世界模型时，能否在相同初始观测与动作下复现多种合法物理演化及其概率分布。为此，论文提出概率对齐这一分布层面的评估目标，并构建 PAWBench 与 PAWEval。", "io": "输入是初始观测和动作条件，模型据此生成多次视频 rollout。PAWEval 将 rollout 转为可能物理行为的经验分布，并与参考分布比较；摘要未说明具体行为表示方式。", "steps": ["将世界模型的评估目标从单条视频的合理性扩展到同一条件下的行为分布，以检验模型是否捕捉了多种合法演化。", "构建包含不同物理情景的 PAWBench，为评估视频生成模型提供测试场景和参考行为分布。", "在相同初始观测与动作条件下重复生成视频 rollout，以收集模型对可能演化的采样结果。", "使用 PAWEval 将多次 rollout 转化为行为经验分布，并与参考分布比较，从而评估概率对齐程度。", "在多个系统上进行评测，并进一步考察语言提示、初始噪声采样和模型训练能否改变预测分布。"], "formulas": [{"tex": "\\hat{p}_{M}(b\\mid o_0,a_{0:T-1})=\\frac{1}{N}\\sum_{i=1}^{N}\\mathbf{1}\\!\\left[f(\\tau_i)=b\\right],\\qquad \\tau_i\\sim M(\\cdot\\mid o_0,a_{0:T-1})", "caption": "将相同初始观测与动作下的多次视频 rollout 转换为行为经验分布；标准写法，非原文"}, {"tex": "\\mathrm{PAWEval}(M)=\\mathcal{D}\\!\\left(\\hat{p}_{M}(b\\mid o_0,a_{0:T-1}),\\,p_{\\mathrm{ref}}(b\\mid o_0,a_{0:T-1})\\right)", "caption": "比较模型行为经验分布与参考行为分布以衡量概率对齐程度；标准写法，非原文"}], "train": "摘要未给出模型训练流程或具体设置。推理评估通过固定条件下的重复视频生成收集 rollout，再由 PAWEval 转为行为经验分布并与参考分布比较。", "diff": "已有评估主要关注单条视频是否合理，本文则检验重复生成能否恢复正确的行为范围及其概率分布。论文将视频生成模型视为随机采样器，并以分布层面的概率对齐作为评估目标。", "limits": "摘要指出，在 50 个情景和 11 个系统中，没有模型能持续匹配参考概率并恢复有效行为范围；摘要未见对评测代价或其他局限的明确说明。", "has_abstract": true}, "tags": ["概率对齐", "分布级评测", "随机采样"], "explain": "想象桌上的球被轻轻推了一下：它可能滚向不同方向，也可能碰到杯子后弹开。世界模型若只生成一段看起来合理的视频，仍可能把这些结果的概率猜错。PAWBench关注的正是这个麻烦：同一初始画面和动作，模型多次生成的结果，是否像真实世界那样分布。论文把这种要求称为概率对齐，也就是不仅看单条轨迹像不像，还看各种可能结果出现得是否合适。评测方法PAWEval会反复运行模型，把生成结果汇成行为经验分布，再与参考分布比较。多次采样能检查模型是否漏掉可能性，或把某种结果生成得过多。测试覆盖50个场景、11个系统，却没有一个能稳定对齐。", "key_numbers": ["50 个场景", "11个系统", "无一稳定对齐"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.27345"], "note": "测的是\"同一条件下多次生成的分布形状\"，与所有单视频合理性基准正交；结论是现有系统连方向都没对上，别急着谈记忆。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2680, "y": 6188, "sx": null}], "lanes": [{"name": "框架层", "color": "#7c5cff", "top": 26, "height": 672, "plotW": 2470, "count": 15, "years": [{"x": 200, "label": "2025"}, {"x": 1296, "label": "2026"}], "branches": [{"name": "闭源产品", "y": 60, "count": 8}, {"name": "", "y": 314, "count": 4}, {"name": "符号状态", "y": 568, "count": 3}]}, {"name": "代码世界模型", "color": "#7A4E2D", "top": 720, "height": 1154, "plotW": 1374, "count": 14, "years": [{"x": 200, "label": "2026"}], "branches": [{"name": "神经渲染器", "y": 754, "count": 5}, {"name": "代码定状态", "y": 1008, "count": 4}, {"name": "可执行评测", "y": 1262, "count": 4}, {"name": "Agent 环境", "y": 1744, "count": 1}]}, {"name": "位置时间寻址", "color": "#2f6feb", "top": 1896, "height": 812, "plotW": 3018, "count": 18, "years": [{"x": 200, "label": "2023"}, {"x": 474, "label": "2025"}, {"x": 1296, "label": "2026"}], "branches": [{"name": "锚 sink", "y": 1930, "count": 7}, {"name": "重排位置", "y": 2070, "count": 7}, {"name": "实体挂载", "y": 2324, "count": 3}, {"name": "距离分层", "y": 2578, "count": 1}]}, {"name": "几何位姿寻址", "color": "#0E7C86", "top": 2730, "height": 900, "plotW": 3018, "count": 25, "years": [{"x": 200, "label": "2025"}, {"x": 1022, "label": "2026"}], "branches": [{"name": "显式几何库", "y": 2764, "count": 10}, {"name": "容量管理", "y": 3018, "count": 4}, {"name": "位姿视锥", "y": 3158, "count": 11}]}, {"name": "内容学习寻址", "color": "#e0891a", "top": 3652, "height": 558, "plotW": 1648, "count": 11, "years": [{"x": 200, "label": "2025"}, {"x": 474, "label": "2026"}], "branches": [{"name": "学习路由", "y": 3686, "count": 7}, {"name": "外部检索库", "y": 3940, "count": 3}, {"name": "理解模型管理", "y": 4080, "count": 1}]}, {"name": "参数化记忆", "color": "#b5459b", "top": 4232, "height": 838, "plotW": 1922, "count": 9, "years": [{"x": 200, "label": "2025"}, {"x": 748, "label": "2026"}], "branches": [{"name": "测试时训练", "y": 4266, "count": 5}, {"name": "递归状态", "y": 4520, "count": 1}, {"name": "专家组合", "y": 4660, "count": 1}, {"name": "", "y": 4800, "count": 1}, {"name": "写权重", "y": 4940, "count": 1}]}, {"name": "训练侧", "color": "#5f6b7a", "top": 5092, "height": 812, "plotW": 2470, "count": 14, "years": [{"x": 200, "label": "2024"}, {"x": 474, "label": "2025"}, {"x": 1296, "label": "2026"}], "branches": [{"name": "", "y": 5126, "count": 1}, {"name": "恒定上下文", "y": 5266, "count": 4}, {"name": "因果蒸馏", "y": 5406, "count": 6}, {"name": "三段训练", "y": 5660, "count": 3}]}, {"name": "评测基准", "color": "#8a94a6", "top": 5926, "height": 620, "plotW": 3018, "count": 18, "years": [{"x": 200, "label": "2024"}, {"x": 474, "label": "2025"}, {"x": 1570, "label": "2026"}], "branches": [{"name": "", "y": 5960, "count": 18}]}], "width": 3302, "height": 6598, "labelW": 214, "plotW": 2100, "card": {"w": 248, "h": 100}, "badge": {"需训": "#d0326b", "免训": "#0f9d76", "推理期技巧": "#c2740e", "不适用": "#6b7280"}, "init": {"scale": 1.0, "tx": 8, "ty": 8}, "prefix": ""};
const svg = document.getElementById("svg"), vp = document.getElementById("vp"),
  stage = document.getElementById("stage"), panel = document.getElementById("panel");
let scale = 1, tx = 0, ty = 0, anim = 0;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), cs = s => clamp(s, .12, 3);
const PANEL_W = () => panel.classList.contains("open") ? panel.offsetWidth : 0;
const byId = {}, cards = {}, links = {}, kids = {}, stickies = [];
DATA.nodes.forEach(n => {
  byId[n.id] = n;
  n.hay = [n.title, n.mechanism, n.one_liner, n.lane, n.branch, (n.tags||[]).join(" "), n.explain].join(" ").toLowerCase();
});
DATA.nodes.forEach(n => { if(n.parent && byId[n.parent]) (kids[n.parent] = kids[n.parent] || []).push(n.id); });

function el(tag, attrs, parent){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const [k,v] of Object.entries(attrs || {})) if(v != null) n.setAttribute(k, v);
  (parent || vp).appendChild(n); return n;
}

/* ---------- 引用量炫光：0-4 不发光，5+ 分 4 档 ---------- */
const GLOW_TIERS = [
  {ring:2.0, pad:3.5, halo:7,  badge:"#5F79C4"},   // 1-4
  {ring:3.0, pad:4.0, halo:10, badge:"#4A5FE0"},   // 5-15
  {ring:4.5, pad:4.5, halo:14, badge:"#7C3AED"},   // 16-40
  {ring:6.0, pad:5.0, halo:18, badge:"#B06500"},   // 41+
];
function citeTier(c){
  // 档位贴合本数据集：124 篇里 99 篇是 0（2026 年新论文），最高 47
  if(c == null || !isFinite(c) || c < 1) return 0;
  if(c < 5) return 1;
  if(c < 16) return 2;
  if(c < 41) return 3;
  return 4;
}
/* 光晕沉到卡面之下：只在卡片外沿溢出，卡内毛玻璃/文字不被着色 */
function drawGlow(g, n){
  const t = citeTier(n.citations);
  if(!t) return;
  const T = GLOW_TIERS[t - 1], w = DATA.card.w, h = DATA.card.h, pad = T.pad + T.ring / 2;
  const gl = el("g", {class:"glow g" + t}, g);
  el("rect", {class:"halo", x:-pad, y:-pad, width:w + pad*2, height:h + pad*2,
    rx:16 + pad, "stroke-width":T.halo}, gl);
  el("rect", {class:"ring", x:-pad, y:-pad, width:w + pad*2, height:h + pad*2,
    rx:16 + pad, "stroke-width":T.ring}, gl);
  g.insertBefore(gl, g.firstChild);
  const c = n.citations, num = c >= 1000 ? (c/1000).toFixed(c >= 10000 ? 0 : 1) + "k" : String(c);
  const b = el("text", {class:"cite-badge", x:w - 11, y:h - 13, "text-anchor":"end", fill:T.badge}, g);
  b.textContent = "\u00d7" + num;
}

/* ---------- 相机 ---------- */
function apply(){
  const w = svg.clientWidth, h = svg.clientHeight, m = 120;
  tx = clamp(tx, m - DATA.width*scale, Math.max(24, (w - DATA.width*scale)/2)); ty = clamp(ty, m - DATA.height*scale, Math.max(14, (h - DATA.height*scale)/2));
  vp.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
  stick(); drawMini();
}
function flyTo(ns, ntx, nty, dur){
  cancelAnimationFrame(anim);
  const s0 = scale, x0 = tx, y0 = ty, t0 = performance.now(); dur = dur || 560;
  (function step(now){
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - k, 3);
    scale = s0 + (ns - s0)*e; tx = x0 + (ntx - x0)*e; ty = y0 + (nty - y0)*e; apply();
    if(k < 1) anim = requestAnimationFrame(step);
  })(t0);
}
function zoomAt(mx, my, ns){ ns = cs(ns); tx = mx - (mx - tx)*(ns/scale); ty = my - (my - ty)*(ns/scale); scale = ns; apply(); }
function zoomBtn(k){ cancelAnimationFrame(anim); const w = svg.clientWidth - PANEL_W(); zoomAt(w/2, svg.clientHeight/2, scale*k); }
function fitAll(){
  const w = svg.clientWidth, h = svg.clientHeight, s = Math.min((w-60)/DATA.width, (h-40)/DATA.height, 1.2);
  flyTo(s, Math.max(16, (w - DATA.width*s)/2), 14);
}
function resetView(now){ const i = DATA.init; now ? (scale = i.scale, tx = i.tx, ty = i.ty, apply()) : flyTo(i.scale, i.tx, i.ty); }
function focusNode(n){
  const w = svg.clientWidth - PANEL_W(), h = svg.clientHeight, ns = cs(Math.max(scale, .85));
  const cx = (DATA.labelW*ns + w)/2;   // 让出左侧固定标签列
  flyTo(ns, cx - (n.x + DATA.card.w/2)*ns, h/2 - (n.y + DATA.card.h/2)*ns);
}
function focusLane(l){
  const w = svg.clientWidth - PANEL_W(), h = svg.clientHeight;
  const s = cs(Math.min((w-50)/(DATA.labelW + l.plotW + 32), (h-40)/(l.height+20), 1));
  flyTo(s, 20 - 8*s, 20 - (l.top - 10)*s);
}

/* ---------- 吸附标签：随镜头滑进可视区 ---------- */
function mkSticky(parent, kind, lane, extra){
  const g = el("g", {class:"stk"}, parent);
  return {g, kind, lane, ...extra};
}
function finishSticky(s){
  const bb = s.g.getBBox(); s.bb = bb;
  el("rect", {class:"lbg", x:bb.x-9, y:bb.y-5, width:bb.width+18, height:bb.height+10, rx:10}, s.g);
  s.g.insertBefore(s.g.lastChild, s.g.firstChild);
  stickies.push(s);
}
function stick(){
  const L = -tx/scale, T = -ty/scale, px = 16/scale, py = 14/scale, laneX = {};
  for(const s of stickies){
    const l = s.lane, R = DATA.labelW + l.plotW + 32 - 10, B = l.top + l.height - 10, bb = s.bb;
    let dx = 0, dy = 0, anchor = L + px;
    if(s.kind === "year") anchor = Math.max(anchor, laneX[l.name] + DATA.labelW - 36);
    dx = clamp(anchor - bb.x, 0, Math.max(0, (s.right || R) - (bb.x + bb.width) ));
    if(s.kind !== "branch") dy = clamp(T + py - bb.y, 0, Math.max(0, B - (bb.y + bb.height)));
    if(s.kind === "lane") { laneX[l.name] = bb.x + dx; l.dy = dy; }
    if(s.kind === "year") dy = l.dy || 0;
    s.g.setAttribute("transform", `translate(${dx},${dy})`);
    s.g.classList.toggle("stuck", dx > 1 || dy > 1);
  }
}

/* ---------- 构建 ---------- */
function build(){
  const laneColor = {}; DATA.lanes.forEach(l => laneColor[l.name] = l.color);
  DATA.lanes.forEach((l, li) => {
    el("rect", {class:"lane-box", x:8, y:l.top-10, width:DATA.labelW + l.plotW + 24, height:l.height+8, rx:20,
      fill: li % 2 ? "var(--band-b)" : "var(--band-a)"});
    el("rect", {x:9, y:l.top-6, width:5, height:l.height-4, rx:2.5, fill:l.color, opacity:.9});
    l.years.forEach(y => el("line", {class:"year-sep", x1:y.x, y1:l.top-2, x2:y.x, y2:l.top+l.height-6}));
    l.branches.forEach(b => {
      const baseY = b.y + DATA.card.h + 16;
      el("line", {class:"axis-line", x1:DATA.labelW-14, y1:baseY, x2:DATA.labelW + l.plotW - 10, y2:baseY});
    });
  });
  DATA.nodes.forEach(n => {
    if(n.sx == null) return;
    const x1 = n.sx, y1 = n.sy, x2 = n.x, y2 = n.y + DATA.card.h/2, mid = (x1 + x2)/2;
    const path = el("path", {d:`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`, class: n.cross ? "link cross" : "link"});
    const dot = el("circle", {cx:x1, cy:y1, r:2.6, class:"link-dot"});
    links[n.id] = {path, dot};
    links[n.id].show = v => { path.style.display = dot.style.display = v ? "" : "none"; };
  });
  DATA.nodes.forEach(n => {
    const g = el("g", {class:"card", "data-id":n.id, transform:`translate(${n.x},${n.y})`}); cards[n.id] = g;
    el("title", {}, g).textContent = n.one_liner || n.title;
    el("rect", {class:"bg", width:DATA.card.w, height:DATA.card.h, rx:16}, g);
    drawGlow(g, n);   // 引用量分档炫光（原手选 n.key 名单已废）
    el("rect", {class:"stripe", width:5, height:DATA.card.h-16, x:1.5, y:8, fill:laneColor[n.lane] || "#888", rx:2.5, opacity:.9}, g);
    const FREE = {"免训":"免训", "推理期技巧":"推理期"};
    const tagList = (FREE[n.training] ? [{t:FREE[n.training], free:true}] : []).concat((n.tags || []).map(t => ({t, free:false})));
    let xRight = DATA.card.w - 10;
    tagList.slice(0, 3).forEach(o => {
      const w = o.t.length*10.5 + 12; if(xRight - w < 12) return;
      el("rect", {x:xRight-w, y:9, width:w, height:17, rx:8, fill:o.free ? "#0E9F6E" : (laneColor[n.lane] || "#6b7280"), opacity:o.free ? 1 : .12}, g);
      el("text", {x:xRight-w+6, y:21.5, class:"tag-t", fill:o.free ? "#fff" : (laneColor[n.lane] || "#6b7280")}, g).textContent = o.t;
      xRight -= w + 5;
    });
    const t1 = el("text", {class:"t-title", x:15, y:50}, g); t1.textContent = n.title;
    while(t1.textContent.length > 4 && t1.getComputedTextLength() > DATA.card.w - 24) t1.textContent = t1.textContent.slice(0, -2) + "…";
    el("text", {class:"t-date", x:15, y:DATA.card.h-14}, g).textContent =
      n.date.slice(0, 7) + (n.precision === "month" || n.precision === "unknown" ? "" : "-" + n.date.slice(8, 10));
    g.addEventListener("click", ev => { ev.stopPropagation(); if(moved < 6) openPanel(n); });
    g.addEventListener("mouseenter", () => { hoverId = n.id; refresh(); });
    g.addEventListener("mouseleave", () => { hoverId = null; refresh(); });
  });
  // 标签层放最上面，吸附时才不会被卡片盖住
  const lab = el("g", {id:"labels"});
  DATA.lanes.forEach(l => {
    const s = mkSticky(lab, "lane", l);
    el("text", {class:"lane-name", x:26, y:l.top+16, fill:l.color}, s.g).textContent = l.name;
    el("text", {class:"lane-count", x:26, y:l.top+34}, s.g).textContent = l.count + " 篇";
    finishSticky(s);
    l.branches.forEach(b => { if(!b.name) return;
      const t = mkSticky(lab, "branch", l);
      el("circle", {cx:30, cy:b.y+30, r:3.4, fill:l.color, opacity:.75}, t.g);
      el("text", {class:"branch", x:40, y:b.y+34}, t.g).textContent = b.name;
      finishSticky(t);
    });
    l.years.forEach((y, i) => {
      const t = mkSticky(lab, "year", l, {right: (l.years[i+1] ? l.years[i+1].x : DATA.labelW + l.plotW + 22) - 8});
      el("text", {class:"year-label", x:y.x+6, y:l.top+16, fill:l.color}, t.g).textContent = y.label;
      finishSticky(t);
    });
  });
}

/* ---------- 状态：高亮脉络 / 搜索 / 图例 / 播放 ---------- */
let activeId = null, hoverId = null, q = "", reveal = null; const hidden = new Set();
function related(id){
  const s = new Set([id]); let c = id;
  while(byId[c] && byId[c].parent && byId[byId[c].parent]){ c = byId[c].parent; s.add(c); }
  const st = [id]; while(st.length){ (kids[st.pop()] || []).forEach(k => { s.add(k); st.push(k); }); }
  return s;
}
function refresh(){
  const f = reveal ? null : (hoverId || activeId), rel = f ? related(f) : null; let hit = 0;
  DATA.nodes.forEach(n => {
    const c = cards[n.id], hide = hidden.has(n.lane), match = !q || n.hay.includes(q);
    c.style.display = hide ? "none" : ""; if(match && !hide) hit++;
    c.classList.toggle("dim", !match);
    c.classList.toggle("faint", !!rel && !rel.has(n.id));
    c.classList.toggle("future", !!reveal && !reveal.has(n.id));
    c.classList.toggle("active", n.id === activeId);
    const lk = links[n.id]; if(!lk) return;
    const p = byId[n.parent], gone = hide || hidden.has(p.lane) || (reveal && !(reveal.has(n.id) && reveal.has(p.id)));
    lk.show(!gone);
    const on = !!rel && rel.has(n.id) && rel.has(p.id);
    lk.path.classList.toggle("on", on);
    lk.path.classList.toggle("faint", (!!rel && !on) || (!!q && !(match && p.hay.includes(q))));
  });
  document.getElementById("qc").textContent = q ? hit + " 篇匹配" : "";
}
function setActive(n){
  activeId = n ? n.id : null; refresh();
  try{ history.replaceState(null, "", n ? "#" + n.id : location.pathname + location.search); }catch(e){}
}
function closePanel(){ panel.classList.remove("open"); document.body.classList.remove("panel-open"); setActive(null); }
function openPanel(n){
  setActive(n);
  panel.querySelector("#phead .t").textContent = n.title;
  const meta = [n.date, n.precision === "month" ? "日期只到月" : "", n.training, n.status, n.lane + " / " + (n.branch || "主支")]
    .filter(Boolean).join(" · ");
  panel.querySelector("#phead .m").textContent = meta;

  const b = document.getElementById("pbody");
  b.innerHTML = "";
  const add = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; b.appendChild(d); };
  if(n.explain){
    const btn = document.createElement("button");
    btn.className = "xbtn";
    btn.textContent = "▶ 直白讲解";
    const box = document.createElement("div");
    box.className = "explain";
    box.textContent = n.explain;
    box.style.display = "none";
    btn.onclick = () => {
      const open = box.style.display !== "none";
      box.style.display = open ? "none" : "block";
      btn.textContent = open ? "▶ 直白讲解" : "▼ 收起讲解";
    };
    b.appendChild(btn);
    b.appendChild(box);
  }
  if(n.one_liner){ add("lab", "一句话"); add("p", n.one_liner); }
  if(n.detail){ window.renderDetail(b, n.detail); }
  else if(n.mechanism){ add("lab", "机制"); add("p", n.mechanism); }
  if(n.key_numbers && n.key_numbers.length){
    add("lab", "关键数字");
    const c = document.createElement("div"); c.className = "chips";
    n.key_numbers.forEach(k => { const s = document.createElement("span"); s.className = "chip"; s.textContent = k; c.appendChild(s); });
    b.appendChild(c);
  }
  if(n.self_measured && n.self_measured.length){
    add("lab", "我们自测（非论文指标）");
    const c = document.createElement("div"); c.className = "chips";
    n.self_measured.forEach(k => { const s = document.createElement("span"); s.className = "chip self"; s.textContent = k; c.appendChild(s); });
    b.appendChild(c);
  }
  if(n.media && n.media.length){
    add("lab", "素材");
    n.media.forEach(m => {
      const src = DATA.prefix + m;
      if(/\.(mp4|webm|mov)$/i.test(m)){
        const v = document.createElement("video");
        v.src = src; v.controls = true; v.muted = true; v.playsInline = true; v.preload = "metadata";
        b.appendChild(v);
      } else {
        const img = document.createElement("img"); img.src = src; img.loading = "lazy";
        b.appendChild(img);
      }
    });
  }
  if(n.links && n.links.length){
    add("lab", "链接");
    n.links.forEach(u => { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.textContent = u; b.appendChild(a); b.appendChild(document.createElement("br")); });
  }
  if(n.note){ add("lab", "备注"); add("p", n.note); }
  panel.classList.add("open"); document.body.classList.add("panel-open"); focusNode(n); b.scrollTop = 0;
}

document.getElementById("pclose").onclick = closePanel;

/* ---------- 输入：拖拽 / 双指缩放 / 滚轮 ---------- */
const ptrs = new Map(); let moved = 0, pinch0 = null;
svg.addEventListener("pointerdown", ev => {
  if(ev.pointerType === "mouse" && ev.button !== 0) return;
  cancelAnimationFrame(anim); ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if(ptrs.size === 1) moved = 0;
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = {d:Math.hypot(a.x-b.x, a.y-b.y), s:scale}; }
  stage.classList.add("drag");
});
window.addEventListener("pointermove", ev => {
  const p = ptrs.get(ev.pointerId); if(!p) return;
  const dx = ev.clientX - p.x, dy = ev.clientY - p.y; p.x = ev.clientX; p.y = ev.clientY;
  if(ptrs.size === 1){ moved += Math.abs(dx) + Math.abs(dy); tx += dx; ty += dy; apply(); }
  else if(pinch0){
    const [a, b] = [...ptrs.values()], r = svg.getBoundingClientRect(); moved = 99;
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, pinch0.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch0.d);
  }
});
const endPtr = ev => { ptrs.delete(ev.pointerId); if(ptrs.size < 2) pinch0 = null; if(!ptrs.size) stage.classList.remove("drag"); };
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
svg.addEventListener("click", ev => { if(!ev.target.closest(".card") && moved < 6 && panel.classList.contains("open")) closePanel(); });
svg.addEventListener("wheel", ev => {
  ev.preventDefault(); cancelAnimationFrame(anim);
  if(ev.ctrlKey || ev.metaKey){            // 触控板捏合 / Ctrl+滚轮 = 缩放
    const r = svg.getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, scale * Math.exp(-ev.deltaY * (Math.abs(ev.deltaY) > 40 ? .0016 : .01)));
  } else {                                  // 普通滚轮 / 双指滑动 = 平移
    const sw = ev.shiftKey && !ev.deltaX; tx -= sw ? ev.deltaY : ev.deltaX; ty -= sw ? 0 : ev.deltaY; apply();
  }
}, {passive:false});
svg.addEventListener("dblclick", ev => { if(!ev.target.closest(".card")) fitAll(); });
zin.onclick = () => zoomBtn(1.25); zout.onclick = () => zoomBtn(1/1.25);
zreset.onclick = () => resetView(); zfit.onclick = fitAll;

/* ---------- 搜索 / 图例 / 键盘 ---------- */
const qi = document.getElementById("q");
qi.addEventListener("input", () => { q = qi.value.trim().toLowerCase(); refresh(); });
qi.addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ const n = DATA.nodes.find(x => !hidden.has(x.lane) && (!q || x.hay.includes(q))); if(n) { setActive(n); focusNode(n); } }
  if(ev.key === "Escape"){ qi.value = ""; q = ""; refresh(); qi.blur(); }
});
const legend = document.getElementById("legend"), hd = document.createElement("div"), rows = document.createElement("div");
hd.className = "hd"; hd.innerHTML = "路线导航 <span>−</span>"; legend.append(hd, rows);
hd.onclick = () => { const c = rows.style.display === "none"; rows.style.display = c ? "" : "none"; hd.lastChild.textContent = c ? "−" : "+"; };
DATA.lanes.forEach(l => {
  const row = document.createElement("div"); row.className = "row"; row.title = "点名称飞到该路线；点圆点显示/隐藏";
  row.innerHTML = `<i style="background:${l.color}"></i><span>${l.name}</span><span class="n">${l.count}</span>`;
  row.querySelector("i").onclick = ev => { ev.stopPropagation();
    hidden.has(l.name) ? hidden.delete(l.name) : hidden.add(l.name); row.classList.toggle("off", hidden.has(l.name)); refresh(); };
  row.onclick = () => { hidden.delete(l.name); row.classList.remove("off"); refresh(); focusLane(l); };
  rows.appendChild(row);
});
const laneOrder = n => DATA.nodes.filter(x => x.lane === n.lane).sort((a, b) => a.date.localeCompare(b.date));
window.addEventListener("keydown", ev => {
  if(ev.target.tagName === "INPUT") return;
  if(ev.key === "/"){ ev.preventDefault(); qi.focus(); }
  else if(ev.key === "Escape"){ timer ? stopPlay() : closePanel(); }
  else if((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && activeId){
    const l = laneOrder(byId[activeId]), i = l.findIndex(x => x.id === activeId) + (ev.key === "ArrowRight" ? 1 : -1);
    if(l[i]){ ev.preventDefault(); openPanel(l[i]); }
  }
});

/* ---------- 缩略导航 ---------- */
const mini = document.getElementById("mini"), MW = 150, MH = Math.round(MW * DATA.height / DATA.width);
const msvg = el("svg", {viewBox:`0 0 ${DATA.width} ${DATA.height}`, width:MW, height:MH}, mini);
DATA.lanes.forEach(l => el("rect", {x:8, y:l.top-10, width:DATA.labelW + l.plotW + 24, height:l.height+8, fill:l.color, opacity:.14, rx:30}, msvg));
DATA.nodes.forEach(n => el("rect", {x:n.x, y:n.y, width:DATA.card.w, height:DATA.card.h, fill:(DATA.lanes.find(l => l.name === n.lane) || {}).color, opacity:.8, rx:14}, msvg));
const vr = el("rect", {class:"vr", rx:10}, msvg);
function drawMini(){
  const w = svg.clientWidth, h = svg.clientHeight;
  vr.setAttribute("x", -tx/scale); vr.setAttribute("y", -ty/scale); vr.setAttribute("width", w/scale); vr.setAttribute("height", h/scale);
}
let mdrag = false;
const miniGo = ev => { const r = msvg.getBoundingClientRect(), w = svg.clientWidth - PANEL_W();
  tx = w/2 - (ev.clientX - r.left)/r.width*DATA.width*scale; ty = svg.clientHeight/2 - (ev.clientY - r.top)/r.height*DATA.height*scale; apply(); };
mini.addEventListener("pointerdown", ev => { cancelAnimationFrame(anim); mdrag = true; miniGo(ev); ev.stopPropagation(); });
window.addEventListener("pointermove", ev => { if(mdrag) miniGo(ev); });
window.addEventListener("pointerup", () => mdrag = false);

/* ---------- 按时间播放：镜头跟随、逐个亮起 ---------- */
let timer = null; const playBtn = document.getElementById("play"), toast = document.getElementById("toast");
function stopPlay(){ clearInterval(timer); timer = null; reveal = null; playBtn.textContent = "按时间播放"; toast.classList.remove("on"); refresh(); }
playBtn.onclick = () => {
  if(timer){ stopPlay(); return; }
  const order = DATA.nodes.filter(n => !hidden.has(n.lane)).sort((a, b) => a.date.localeCompare(b.date));
  closePanel(); reveal = new Set(); playBtn.textContent = "■ 停止"; let i = 0;
  const step = () => {
    if(i >= order.length){ const last = order[order.length-1]; stopPlay(); setActive(last); return; }
    const n = order[i++]; reveal.add(n.id); setActive(n); focusNode(n);
    toast.textContent = `${n.date.slice(0, 7)} · ${n.title}　${i}/${order.length}`; toast.classList.add("on");
  };
  step(); timer = setInterval(step, 1300);
};

build(); resetView(true); refresh();
const h0 = decodeURIComponent(location.hash.slice(1));
if(byId[h0]) setTimeout(() => openPanel(byId[h0]), 60);
</script>

/* panel_detail.js — 详情面板「机制详解」折叠块
 *
 * 用法：  renderDetail(document.getElementById("pbody"), n.detail)
 * 可选依赖：window.katex（缺失时公式退回 <code> 原文，不报错）
 * 全局污染：只挂 window.renderDetail 一个函数
 */
(function (global) {
  "use strict";

  var SECTIONS = [
    { key: "position", label: "定位",           type: "text" },
    { key: "io",       label: "输入输出",        type: "text" },
    { key: "steps",    label: "做法步骤",        type: "steps" },
    { key: "formulas", label: "关键公式",        type: "formulas" },
    { key: "train",    label: "训练与推理",      type: "text" },
    { key: "diff",     label: "与已有做法的差别", type: "text" },
    { key: "limits",   label: "代价与局限",      type: "text" }
  ];

  var pending = [];   // katex 尚未就绪时先记下节点，load 后再升级

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }

  function textOf(v) {
    return typeof v === "string" ? v.trim() : "";
  }

  function stepList(v) {
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var i = 0; i < v.length; i++) {
      var s = textOf(v[i]);
      if (s) out.push(s);
    }
    return out;
  }

  function formulaList(v) {
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var i = 0; i < v.length; i++) {
      var f = v[i], tex = "", cap = "";
      if (typeof f === "string") {
        tex = f.trim();
      } else if (f && typeof f === "object") {
        tex = textOf(f.tex);
        cap = textOf(f.caption);
      }
      if (tex) out.push({ tex: tex, caption: cap });
    }
    return out;
  }

  /* ---------- 公式：katex 优先，<code> 兜底 ---------- */

  function fallback(node, tex) {
    node.textContent = "";
    node.appendChild(el("code", "pd-code", tex));
    node.setAttribute("data-tex", tex);
    pending.push({ node: node, tex: tex });
  }

  function typeset(node, tex) {
    var k = global.katex;
    if (k && typeof k.render === "function") {
      try {
        node.textContent = "";
        k.render(tex, node, { displayMode: true, throwOnError: false });
        node.removeAttribute("data-tex");
        return true;
      } catch (e) {
        /* 落到 fallback，不让单个坏式拖垮整块 */
      }
    }
    fallback(node, tex);
    return false;
  }

  function upgrade() {
    var k = global.katex;
    if (!k || typeof k.render !== "function") return;
    var rest = [];
    for (var i = 0; i < pending.length; i++) {
      var it = pending[i];
      if (!it.node || !it.node.isConnected) continue;
      if (!typeset(it.node, it.tex)) rest.push(it);
    }
    pending = rest;
  }

  if (!global.katex && typeof global.addEventListener === "function") {
    global.addEventListener("load", upgrade, { once: true });
  }

  /* ---------- 各节渲染 ---------- */

  function renderText(sec, value) {
    var t = textOf(value);
    if (!t) return false;
    sec.appendChild(el("p", "pd-p", t));
    return true;
  }

  function renderSteps(sec, value) {
    var steps = stepList(value);
    if (!steps.length) return false;
    var ol = el("ol", "pd-steps");
    for (var i = 0; i < steps.length; i++) {
      var li = el("li", "pd-step");
      var num = el("span", "pd-num", String(i + 1));
      num.setAttribute("aria-hidden", "true");
      li.appendChild(num);
      li.appendChild(el("span", "pd-step-text", steps[i]));
      ol.appendChild(li);
    }
    sec.appendChild(ol);
    return true;
  }

  function renderFormulas(sec, value) {
    var list = formulaList(value);
    if (!list.length) return false;
    for (var i = 0; i < list.length; i++) {
      var fig = el("figure", "pd-fig");
      var box = el("div", "pd-tex");
      typeset(box, list[i].tex);
      fig.appendChild(box);
      if (list[i].caption) fig.appendChild(el("figcaption", "pd-cap", list[i].caption));
      sec.appendChild(fig);
    }
    return true;
  }

  /* ---------- 主入口 ---------- */

  function renderDetail(container, detail) {
    if (!container || !detail || typeof detail !== "object") return null;

    var wrap = el("div", "pd");
    var body = el("div", "pd-body");
    var bodyId = "pd-body-" + Math.random().toString(36).slice(2, 8);
    body.id = bodyId;
    body.hidden = true;

    var filled = 0;
    for (var i = 0; i < SECTIONS.length; i++) {
      var cfg = SECTIONS[i];
      var sec = el("section", "pd-sec");
      var ok;
      if (cfg.type === "steps")          ok = renderSteps(sec, detail[cfg.key]);
      else if (cfg.type === "formulas")  ok = renderFormulas(sec, detail[cfg.key]);
      else                               ok = renderText(sec, detail[cfg.key]);
      if (!ok) continue;
      var h = el("h4", "pd-h", cfg.label);
      sec.insertBefore(h, sec.firstChild);
      body.appendChild(sec);
      filled++;
    }

    // 没取到摘要时给个来源提示，别让人以为是论文原文
    if (detail.has_abstract === false && filled) {
      body.appendChild(el("p", "pd-note", "该条未取到 arXiv 摘要，以上依据已知机制摘要整理"));
    }

    if (!filled) return null;

    var btn = el("button", "pd-toggle", "▶ 机制详解");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", bodyId);

    btn.onclick = function () {
      var wasOpen = !body.hidden;
      body.hidden = wasOpen;
      btn.textContent = wasOpen ? "▶ 机制详解" : "▼ 机制详解";
      btn.setAttribute("aria-expanded", wasOpen ? "false" : "true");
      btn.classList.toggle("on", !wasOpen);
      if (!wasOpen) upgrade();
    };

    wrap.appendChild(btn);
    wrap.appendChild(body);
    container.appendChild(wrap);
    return wrap;
  }

  global.renderDetail = renderDetail;
})(window);
</script>
</body>
