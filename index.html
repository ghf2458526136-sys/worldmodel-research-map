arxiv.org/abs/2606.02553"], "note": "只给到月份 2026-07；training=需训指检索器需训练；官方未提供演示片段。", "parent": null, "link_strength": "", "key": false, "x": 1036, "y": 3712, "sx": null}, {"id": "mosaichunk", "title": "MosaiChunk", "date": "2026-10-01", "precision": "month", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2610.02153", "venue": "", "training": "免训", "status": "精读", "one_liner": "学习路由器挑时空块 KV 拼成马赛克上下文", "mechanism": "历史切成时空小块各留 KV，生成时由轻量路由器判断需要哪几块并拼接；推理主干完全冻结。", "tags": ["时空块KV", "学习路由器"], "explain": "就像看监控抓小偷，我们不用把几十个小时的录像全倒进脑子，只要挑出关键的几个画面拼在一起看。这篇论文解决的具体麻烦，正是大模型处理长视频时，保留所有历史会让显存直接撑爆。它用的招数是把历史切成许多时空小块，各自保留KV，也就是模型算好的记忆缓存；生成回答时，由一个轻量路由器，即专门负责筛选的小网络，判断需要哪几块并拼成马赛克上下文。这招管用在于推理主干完全冻结，既不用重新训练也不破坏原有能力，只把最核心的信息精准拼接起来，大幅减轻了显存负担。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.02153"], "note": "training=免训指主干冻结、仅训路由器；矩阵将其放在『几何/位姿』行并标『学习路由』，寻址实际由学习路由器决定，lane 存疑；自带 RememBench 未单列；只给到月份 2026-10。", "parent": "longlive-rag", "link_strength": "dotted", "key": false, "x": 1584, "y": 3458, "sx": 1284, "sy": 3762.0, "cross": false}, {"id": "smi", "title": "SMI", "date": "2026-10-01", "precision": "month", "lane": "内容学习寻址", "branch": "理解模型管理", "arxiv": "2610.02521", "venue": "", "training": "免训", "status": "精读", "one_liner": "多模态大模型管记忆的增删与检索", "mechanism": "四个原子操作串成管理流程：空间聚类、簇内稀疏化、动作感知检索、可靠性过滤；生成器一行代码不改。", "tags": ["四原子操作", "大模型管记忆"], "explain": "想象机器人把沿途拍的照片全塞进抽屉，翻找时不仅头疼还经常拿错。SMI解决的就是多模态大模型面对海量连续画面时，记忆臃肿且难以调用的麻烦。它的做法是完全不改生成器代码，用一套管理流程串联四个原子操作，也就是不可分割的基础动作：按位置归拢画面的空间聚类、同堆剔除重复的簇内稀疏化、结合当前行为翻找的动作感知检索，以及排除杂质的可靠性过滤。它管用是因为从源头挤干了画面水分，找记忆时又有动作意图带路，不用动原模型就能轻松提取干净高效的经验。", "key_numbers": ["四个原子操作"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.02521"], "note": "只给到月份 2026-10；报告提醒每次管理都要调用大模型，开销与延迟高。", "parent": "longlive-rag", "link_strength": "dotted", "key": false, "x": 1584, "y": 3852, "sx": 1284, "sy": 3762.0, "cross": false}, {"id": "moc", "title": "Mixture of Contexts for Long Video Generation", "date": "2025-08-28", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2508.21058", "venue": "", "training": "需训", "status": "速读", "one_liner": "长视频当内部检索，query自选chunk", "mechanism": "可学稀疏路由：每个query挑少数信息量大的历史chunk，加caption与局部窗必选锚，因果约束禁闭环。", "tags": ["稀疏路由", "chunk检索", "近线性扩展"], "explain": "想象模型要接着拍一段一分钟的追逐戏：主角的外套、街道布局和动作节奏都得记住，但把前面每一帧都塞回模型，既昂贵又容易被无关画面干扰。它把已经生成的长视频当作内部检索库。当前要生成的内容会形成查询，也就是向历史寻找所需信息的问题；可学习的稀疏路由会为每个查询挑出少数最有用的历史片段。描述全局语义的字幕信息和紧邻当前画面的局部窗口，则被固定为必选锚点，保证人物身份与近处动作不断裂；因果约束还禁止读取未来，避免信息泄漏和循环依赖。这样，模型只看相关记忆而非整段历史，既能维持分钟级视频中的人物、动作和场景一致性，也让计算量随检索规模近似线性增长。", "key_numbers": ["摘要未给具体数值，称可保身份/动作/场景达分钟级", "效率随检索近线性"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2508.21058"], "note": "这条泳道的理论源头之一：把「记忆」重述为 query 到 chunk 的内部检索并让它可学，与 LongLive-RAG 的外部库路线形成对照（MoC 无外部存储、路由在注意力里）。", "parent": null, "link_strength": "", "key": false, "x": 214, "y": 3458, "sx": null}, {"id": "omnimem", "title": "OmniMem: Scalable and Adaptive Memory Retrieval for Long Video Generation", "date": "2026-05-28", "precision": "day", "lane": "内容学习寻址", "branch": "外部检索库", "arxiv": "2605.30519", "venue": "", "training": "推理期技巧", "status": "速读", "one_liner": "在历史KV上做全范围稀疏检索", "mechanism": "对历史KV做稀疏块检索：自适应窗排除把局部窗剔出候选，query共享选择降开销，各头散取非连续块。", "tags": ["稀疏KV检索", "全范围记忆", "显存可控"], "explain": "想象模型在拍一部长镜头：它既要记住眼前几帧，也要从几分钟前的动作里找回一件道具。视频越长，历史键值缓存（KV，保存过往画面特征的记忆）越大，逐项读取会拖慢生成、占用显存，固定局部窗口又容易漏掉远处线索。OmniMem对全部历史KV做稀疏块检索：先用自适应窗口排除已被局部覆盖的区域，避免重复搜索；再让相近查询共享候选选择，减少计算；最后允许不同注意力头各自抽取不连续的关键块。这样既保留近处细节，又能跳着找远处相关内容，用较少访问换来更长的记忆范围。实验中动态度提升52.3%，显存占用仍与强基线相当，说明它兼顾了长视频生成的效率与连贯性。", "key_numbers": ["动态度 +52.3%", "显存占用与强基线相当"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.30519"], "note": "明确以「截断/隐式压缩都丢失显式可查历史」立论，把历史 KV 当可检索外部库；与 MosaicChunk 的区别是它不重组压缩块，而是保留原始 KV 块做稀疏选择。", "parent": null, "link_strength": "", "key": false, "x": 488, "y": 3712, "sx": null}, {"id": "memlearner", "title": "MemLearner: Learning to Query Context memory for Video World Models", "date": "2026-06-30", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2606.31734", "venue": "", "training": "需训", "status": "速读", "one_liner": "用query token学会问上下文", "mechanism": "以query token桥接上下文与待预测token，让生成模型自身视觉先验承担检索；配遮挡/动态数据集。", "tags": ["可学检索", "query token", "世界模型记忆"], "explain": "想象你在看一段街景视频：汽车被大树挡住几帧后，模型还得判断它会从哪里出现。麻烦在于，传统视频世界模型常把很长的历史画面一股脑送进生成器，既难找到真正有用的线索，也容易被遮挡和剧烈运动干扰。MemLearner让模型学会用查询令牌（query token，一小段专门用来提问上下文的表示）主动读取记忆。它把这些令牌放在历史上下文与待预测视频令牌之间，由生成模型已有的视觉先验决定该问什么、从哪里取信息，而不是依赖单独的检索模块。这样，模型能抓住目标的外观、运动和遮挡前后的关系，再生成未来画面。作者还用遮挡和动态场景数据集检验这一能力，结果显示它在两类困难环境中都显著优于先前世界模型。", "key_numbers": ["摘要未给具体数值，称在遮挡与动态场景显著优于先前世界模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.31734"], "note": "直接对标「规则式上下文帧检索在遮挡/动态物体下不泛化」，是学习路由分支对 LongLive-RAG 式固定检索的正面替代；注意它面向 action-conditioned 世界模型而非纯 T2V。", "parent": null, "link_strength": "", "key": false, "x": 762, "y": 3572, "sx": null}, {"id": "slotmemory", "title": "SlotMemory: Object-Centric KV Memory for Streaming Long-Video Generation", "date": "2026-05-29", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2605.31033", "venue": "", "training": "需训", "status": "速读", "one_liner": "按是什么而非何时组织KV槽", "mechanism": "把KV流形拆成离散可复用语义槽，用槽作路由地址存取KV token，实现实体级持久与prompt感知检索。", "tags": ["语义槽", "实体持久", "KV寻址"], "explain": "想象镜头连续拍一只红伞：走过几条街、隔了很久再出现，它仍该是同一把伞。长视频生成却常把记忆按时间堆进缓存，越拍越难检索，还容易让物体变样、前后动作对不上。SlotMemory把键值记忆（模型用来存取信息的内部缓存）按“是什么”而非“何时发生”整理：把相似内容归入可复用的语义槽，再用槽作地址存取对应片段，并依据提示词检索。这样，物体能跨镜头保留特征，相关记忆也更容易被找回。在Wan2.1-T2V-1.3B上，60秒交互叙事质量得分为81.61，动态一致性相对提升22.8%。", "key_numbers": ["60 秒交互叙事质量分 81.61", "动态一致性相对提升 22.8%", "Wan2.1-T2V-1.3B 骨干"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.31033", "https://tj12323.github.io/SlotMemory/"], "note": "摘要自述把记忆抽象从「何时」转到「是什么」，即显式反对时间坐标寻址 → 落内容学习寻址；但「槽位作为地址」也可读成实体挂载，若你按实现归位置时间寻址亦说得通，故 confidence 降为 medium。同月还有一篇 SlotMem（2607.15772，角色可寻址内部记忆），机制更偏角色 slot 写入/读取，我未重复收录以免同类堆叠。", "parent": null, "link_strength": "", "key": false, "x": 488, "y": 3458, "sx": null}, {"id": "tethercache", "title": "TetherCache: Stabilizing Autoregressive Long-Form Video Generation with Gated Recall and Trusted Alignment", "date": "2026-06-11", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2606.13035", "venue": "", "training": "免训", "status": "速读", "one_liner": "门控召回远帧，再对齐回可信分布", "mechanism": "缓存分sink/memory/recent；GRAB用注意力相关度乘时间多样性选远帧，TAME把召回token统计对齐可信分布。", "tags": ["门控召回", "记忆编辑", "免训插拔"], "explain": "想象摄像机不停拍一段四分钟的视频：生成得越久，画面越容易偏离开头，人物和场景慢慢变样。TetherCache要解决的正是这种长视频的质量漂移。它把过去的画面分成固定锚点、记忆片段和近期片段，既留住开头的重要信息，也保留眼前变化。生成新画面时，GRAB会从远处挑选值得回看的帧：既看它们与当前内容是否相关，也避免只挑时间上挤在一起的画面。随后，TAME把这些回忆信息调整到模型更可靠的分布，减少旧画面带来的干扰。一个负责选对回忆，一个负责让回忆用得稳，因此能减缓越生成越跑偏。实验中，生成240秒视频的质量漂移从7.84降至1.33；在30秒、60秒和240秒时，效果也都优于Self-Forcing基线。", "key_numbers": ["240s 生成质量漂移 7.84 → 1.33", "30s/60s/240s 均优于 Self-Forcing 基线"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.13035"], "note": "召回打分是「注意力相关度 × 时间多样性」的显式评分而非学习路由网络，严格说介于规则与学习之间；我按「按内容打分取历史」归学习路由，若你要求纯学习策略可降级为不入库。它的独特处是同时处理「取错」和「取到但已被污染」。", "parent": null, "link_strength": "", "key": false, "x": 762, "y": 3458, "sx": null}, {"id": "layerrecall", "title": "LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation", "date": "2026-08-28", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2608.28460", "venue": "", "training": "需训", "status": "速读", "one_liner": "先判哪层要记忆，只往那层注KV", "mechanism": "以当前帧为条件的层选择路由，检索历史K/V只注入记忆敏感层；用跨时域预测匹配监督该路由。", "tags": ["层选择路由", "KV注入位置", "预测空间监督"], "explain": "想象镜头从客厅切到厨房，人物又走回来：长视频生成常会忘掉衣着、位置等细节，前后画面接不上。LayerRecall像个分拣员，不把所有历史都塞回模型，而是看当前帧，判断哪些网络层最需要记忆，再只向这些层注入历史的键和值（KV，即注意力计算用来读取信息的缓存）。它还用跨时段预测匹配来训练路由：让模型学会哪些层的记忆有助于保持后续画面一致。这样既留住关键线索，也避免无关历史干扰。论文在100条多镜头提示词及MemoBench、MovieBench综合评测中表现最佳，VBench-Long成绩不降，推理开销也几乎可忽略。", "key_numbers": ["100 条多镜头 prompt", "MemoBench / MovieBench 综合最佳，VBench-Long 不掉", "推理开销可忽略"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.28460"], "note": "关键论点「访问到 ≠ 用得上」，把检索拆成 what（取什么）与 where（注入哪层）两问；这是本泳道里唯一把「路由目的地」当一等公民的，与 MemLearner 只学 query 形成互补。", "parent": null, "link_strength": "", "key": false, "x": 1310, "y": 3458, "sx": null}, {"id": "weave-forcing", "title": "Weave Forcing: Compositional Memory Routing for Interactive Long Video Generation", "date": "2026-10-02", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2610.03510", "venue": "", "training": "免训", "status": "速读", "one_liner": "LLM拆prompt，按角色背景分路取记忆", "mechanism": "LLM语义槽路由把prompt拆成角色与背景各选参考；对比注意力图做掩码编织只露出相关KV；自适应RoPE。", "tags": ["组合式路由", "掩码记忆编织", "免训"], "explain": "想象你在拍一段可互动的长镜头：同一只猫穿过厨房、花园和雨夜街道，观众随时改一句提示词，猫不能变脸，场景也不能串台。长视频生成的麻烦正是如此：模型要从很长的历史记忆里同时维持角色和背景，容易拿错信息，导致主体漂移、环境混乱或画质下降。Weave Forcing先让大语言模型（LLM，负责理解文字的模型）把提示词拆成“角色、背景”等语义槽，再为每个槽选择对应参考记忆。接着用对比注意力图定位真正相关的记忆区域，生成掩码，把无关的键值（KV，即注意力读取的记忆内容）挡住，只编织需要的信息；自适应旋转位置编码（RoPE，让模型感知时空位置）再随镜头变化调整位置关系。这样不同内容各走各的记忆通道，减少互相污染，既保持跨镜头的角色与环境连续性，也不牺牲画质。", "key_numbers": ["摘要未给具体数值，称跨镜头主体/背景一致性提升且画质不降"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.03510"], "note": "针对「整段 prompt 检索会忽略各组分不同参考需求」，把检索粒度从镜头级下到组分级（角色/背景），是 MosaicChunk 之后检索粒度细化的代表；末尾那段覆盖率自适应 RoPE 说明它仍需位置侧兜底。", "parent": null, "link_strength": "", "key": false, "x": 1584, "y": 3572, "sx": null}, {"id": "reel", "title": "REEL: Learning to Retrieve, Evaluate, and Evolve Visual Memory for Any Long-Horizon Multi-Shot Video Generation", "date": "2026-10-12", "precision": "day", "lane": "内容学习寻址", "branch": "外部检索库", "arxiv": "2610.16632", "venue": "", "training": "需训", "status": "速读", "one_liner": "训一个跨生成器的记忆策略", "mechanism": "统一工具接口下用SFT+GRPO训记忆规划器，学检索参考、补缺失证据、更新记忆；适配器转各家条件输入。", "tags": ["记忆策略智能体", "GRPO", "跨生成器"], "explain": "想象拍一部几十镜头的电影：主角换个镜头就变脸、换衣服，场景也接不上。问题在于视频生成器会忘记前文，固定检索又常找不到真正有用的参考。REEL训练一个记忆规划器：它判断当前镜头缺什么，检索相关画面，主动补充缺失证据，再把结果写回记忆。训练先用监督微调（SFT，模仿示范），再用群体相对策略优化（GRPO，按生成效果奖励更好的规划）；适配器把统一接口的记忆转换成不同生成器的条件输入。于是学到的是可迁移的记忆管理，而非某个模型的技巧。ST-Bench一致性在JoyAI-Echo 1.5、MiniMax H3上提升15.1%、20.7%；REEL-Bench Core-100提升2.41、8.32，使用REEL-SFT-4k和REEL-RL-1k数据集。", "key_numbers": ["ST-Bench 跨镜头一致性 +15.1%（JoyAI-Echo 1.5）/ +20.7%（MiniMax H3）", "REEL-Bench Core-100 +2.41 / +8.32", "REEL-SFT-4k + REEL-RL-1k 两个数据集"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.16632"], "note": "把记忆管理从「生成器内部机制」抽成外挂可训练策略，与理解模型管理分支的 agent 化路线同源；与 LongLive-RAG 的区别是它不只检索，还能补拍缺失证据并回写记忆，且对黑盒生成器通用。", "parent": null, "link_strength": "", "key": false, "x": 1584, "y": 3712, "sx": null}, {"id": "world-t3", "title": "World-T3", "date": "2026-10-01", "precision": "month", "lane": "参数化记忆", "branch": "", "arxiv": "2610.17434", "venue": "", "training": "需训", "status": "精读", "one_liner": "把世界状态写进快权重，按位姿直接取特征", "mechanism": "测试时训练：用递归最小二乘持续更新一小部分快权重，单步常数开销；读取按当前相机位姿从快权重取场景特征，不看历史帧。", "tags": ["快权重TTT", "位姿取特征"], "explain": "就像机器人逛房间，如果走一步就得翻一遍所有旧照片，时间一长就会卡死。World-T3解决的就是频繁回看历史帧导致计算爆炸的麻烦。它在测试时训练中引入像速记便签一样能临时改动的快权重，用递归最小二乘持续更新这一小撮参数把场景存进去；读取时按当前相机位姿直接从快权重取特征，不再依赖历史帧。由于单步开销恒定，在B200上跑1280×704能达20.6帧，PSNR从13.52提至18.31分贝，旋转误差也由3.344度压到1.075度。", "key_numbers": ["1280×704", "20.6FPS（B200）", "PSNR 13.52→18.31dB", "旋转误差 3.344°→1.075°"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.17434"], "note": "报告指出摘要未说明 PSNR 基线是哪个配置，引用须注明；只给到月份 2026-10；站点资产 404，无演示。", "parent": null, "link_strength": "", "key": false, "x": 1858, "y": 4572, "sx": null}, {"id": "spatial-ttt", "title": "Spatial-TTT", "date": "2026-03-12", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2603.12255", "venue": "", "training": "训练+测试时训练", "status": "速读", "one_liner": "fast weights 组织空间证据", "mechanism": "用 TTT 更新部分参数承载长程空间证据；大块更新并行+滑窗注意力；3D 时空卷积做空间预测，稠密 3D 描述数据引导写入。", "tags": ["快权记忆", "大块更新", "空间预测"], "explain": "想象机器人看着一段长视频：杯子被人拿起、移到桌角，模型得记住它的位置，才能判断接下来会怎样。普通方法难以留住远处画面的空间线索，若反复处理全部历史，计算又很费。Spatial-TTT用“快速权重”存证据：一部分模型参数会随视频输入更新，像一本可改写的记事本。它把大块更新并行处理，再用滑动窗口注意力聚焦近期画面；三维时空卷积从连续画面中预测空间变化，稠密三维描述数据则帮助挑选该写入的线索。这样既能保留长程空间信息，也能控制计算量，在视频空间基准上达到当前最佳表现；摘要未给出具体分数。", "key_numbers": ["视频空间基准SOTA", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.12255", "https://liuff19.github.io/Spatial-TTT"], "note": "参数化记忆泳道里最贴\"空间结构化写入\"的一篇；关键问题是条目间的空间组织方式（3D 卷积 + 稠密描述监督）。", "parent": null, "link_strength": "", "key": false, "x": 762, "y": 4152, "sx": null}, {"id": "loger", "title": "LoGeR", "date": "2026-03-03", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2603.03269", "venue": "", "training": "训练", "status": "速读", "one_liner": "参数化TTT锚全局坐标防漂移", "mechanism": "分块处理，块内用双向先验；跨块靠混合记忆——参数化 TTT 记忆锚定全局坐标系防尺度漂移，滑窗注意力保未压缩上下文做高精对齐。", "tags": ["TTT记忆", "坐标锚定", "混合记忆"], "explain": "想象一台摄像机沿着很长的走廊前进：每一步位置只差一点，走到尽头却可能把尺度和方向都估偏。长视频模型也有这类麻烦，逐段预测会累积误差，短视频训练又难以支撑数千帧推理。LoGeR把视频切成小块，在每块内部利用前后画面共同判断运动；块与块之间则混合两种记忆：参数化的测试时训练记忆像地图基准，持续锚定全局坐标、抑制尺度漂移；滑动窗口注意力保留最近、未压缩的画面，帮助精细对齐。一个管整体，一个管细节，因此模型可用128帧训练、推理数千帧；在KITTI数据集上，估计轨迹与真实轨迹的误差降低74%，还处理了19,000帧序列。", "key_numbers": ["128帧训练→数千帧推理", "KITTI ATE -74%", "19k 帧序列"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.03269"], "note": "3D 重建而非视频生成，但\"参数化记忆负责全局锚、滑窗负责局部精度\"的分工可直接搬到长视频记忆设计。", "parent": null, "link_strength": "", "key": false, "x": 762, "y": 4038, "sx": null}, {"id": "mem3r", "title": "Mem3R", "date": "2026-04-08", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2604.07279", "venue": "", "training": "训练", "status": "速读", "one_liner": "跟踪用fast-weight，建图用显式状态", "mechanism": "相机跟踪用 MLP 形式的 fast-weight 记忆经 TTT 在线更新，几何建图用显式定长 token 状态，把跟踪与建图解耦，缓解压缩记忆的漂移与遗忘。", "tags": ["跟踪建图解耦", "定长状态", "显存恒定"], "explain": "想象机器人在陌生楼道里边走边画地图：走得越久，越容易忘记先前看过什么，位置也会慢慢偏掉。Mem3R要解决的正是长视频中的定位漂移和记忆遗忘。它把两件事分开做：相机跟踪靠快速权重记忆，也就是能随新画面在线调整的轻量网络；几何建图则保留固定长度的显式状态，直接存下场景结构。在线调整采用测试时训练（TTT），让记忆随着视频更新。这样，跟踪能灵活适应新画面，地图又不必挤进易压缩、易遗忘的记忆里，两者互相牵制的问题因此减轻。论文报告，模型参数从7.93亿降到6.44亿，绝对轨迹误差降低39%，并能处理500到1000帧的视频。", "key_numbers": ["793M→644M 参数", "ATE -39%", "500-1000 帧"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2604.07279", "https://lck666666.github.io/Mem3R/"], "note": "给出\"哪类信息适合写权重（位姿）、哪类适合显式存（几何）\"的直接证据，对我们的记忆分工很有说服力。", "parent": null, "link_strength": "", "key": false, "x": 1036, "y": 4038, "sx": null}, {"id": "mit3", "title": "MIT^3 - Memory Internalization via Test-Time Training", "date": "2026-10-17", "precision": "day", "lane": "参数化记忆", "branch": "写权重", "arxiv": "2610.26910", "venue": "", "training": "测试时训练", "status": "速读", "one_liner": "把整段长视频写进每视频适配参数", "mechanism": "因果追踪测每层对视频问答的因果记忆效用，据此选写入位置；视觉记忆蒸馏让纯文本记忆复现相关片段引起的表示变化，实现无视频输入问答。", "tags": ["参数化记忆", "因果追踪", "蒸馏"], "explain": "想象看完一部长片，合上屏幕后还要回答某个小细节：普通模型得反复翻找视频，片段太长时容易漏掉线索。MIT³让模型针对每段视频做一次测试时训练，把整段视频的信息写进专属参数。它先用因果追踪——观察改变某层记忆会怎样影响回答——找出最值得存信息的位置；再用视觉记忆蒸馏，把视频片段带来的表示变化转成纯文本记忆。这样，模型不必再看视频，也能凭这份记忆回答问题。关键在于它不是平均记住所有画面，而是把对回答真正有用的线索写进合适的层。", "key_numbers": ["LVBench/LongVideoBench/Video-MME", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.26910"], "note": "长视频理解而非生成，泳道归属为\"写权重\"范式的边界案例；但\"写哪里（哪层）+ 怎么写（蒸馏表示变化）\"两个问题对 World-T3 类工作是直接补强。", "parent": null, "link_strength": "", "key": false, "x": 1858, "y": 4712, "sx": null}, {"id": "rad", "title": "Recurrent Autoregressive Diffusion (RAD)", "date": "2025-11-17", "precision": "day", "lane": "参数化记忆", "branch": "递归状态", "arxiv": "2511.12940", "venue": "", "training": "训练", "status": "速读", "one_liner": "DiT 层内插 LSTM 当全局记忆", "mechanism": "每个 DiT 层注意力后接 LSTM 递归块做记忆更新与取回，重叠滑窗全注意力保局部细节，训练推理无 gap；LSTM 表现约等于 TTT/Mamba2。", "tags": ["递归状态", "固定预算", "滑窗"], "explain": "想象镜头在迷宫里不断前进：转过几个弯后，模型若忘了入口在哪，就很难生成连贯的后续画面。RAD要解决的正是视频越长、记忆越容易丢的问题。它在DiT（一种逐步生成图像的网络）的每层注意力后加入LSTM（一种能反复写入和读取信息的记忆模块），边生成边更新全局记忆；同时用彼此重叠的滑动窗口处理邻近画面，保住局部细节。这样，远处的经历靠记忆传递，眼前的内容靠注意力衔接，训练和推理也无需留下间隙。在Memory Maze和Minecraft任务中，LSTM方案表现与TTT、Mamba2这两种记忆方法大致相当。", "key_numbers": ["Memory Maze / Minecraft", "LSTM≈TTT≈Mamba2"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2511.12940"], "note": "便宜的参数化记忆基线——若 LSTM 状态已够，复杂的 TTT 写入未必划算，是我们做消融时的下限对照。", "parent": null, "link_strength": "", "key": false, "x": 488, "y": 4292, "sx": null}, {"id": "onstm", "title": "Online Neural Space Time Memory (NSTM)", "date": "2026-07-16", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2607.15271", "venue": "", "training": "测试时训练", "status": "速读", "one_liner": "TTT 记忆更新与应用频率解耦", "mechanism": "视频内容高度冗余，故记忆按周期更新、逐帧施加，跨视角注意力管形变；加辅助 Memory Loss 强制内化历史、权重缓存正则防灾难漂移。", "tags": ["更新解耦", "权重缓存", "动态场景"], "explain": "想象一台摄像机连续拍摄一间屋子：画面每秒变化，但桌椅位置大多没变。若模型每帧都重建记忆，既耗时又容易忘掉远处的过去；若不更新，又跟不上物体移动。在线神经时空记忆让记忆更新与使用分开：用测试时训练（TTT）按周期吸收新内容，却逐帧调用记忆。视频冗余让较少更新也能覆盖多数新信息，跨视角注意力则帮助模型对齐不同画面中的形变。辅助记忆损失促使模型把历史写进记忆，权重缓存正则则限制更新幅度，避免学新内容时破坏旧知识。实验显示，它能让记忆保持分钟级，并以摊销后的实时速度处理视频。", "key_numbers": ["分钟级记忆持久", "摊销实时速度"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2607.15271", "https://nst-mem.github.io"], "note": "动态新视角合成为任务，不直接是长视频世界模型；但\"更新频率 vs 施加频率\"解耦是 TTT 记忆落地的关键工程点，泳道归属存疑故标 low。", "parent": null, "link_strength": "", "key": false, "x": 1584, "y": 4038, "sx": null}, {"id": "zo3t", "title": "Zo3T", "date": "2025-09-08", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2509.06723", "venue": "", "training": "免训", "status": "速读", "one_liner": "测试时LoRA让视频贴合相机轨迹", "mechanism": "3D 感知运动投影用推断深度推透视正确仿射，去噪中动态注入并优化临时 LoRA 适配被操纵 latent，区域特征一致性损失约束，配 guidance 场校正。", "tags": ["临时LoRA", "轨迹控制", "零样本"], "explain": "想象让一段视频里的镜头沿着弯曲轨迹绕过桌上的茶杯：普通视频生成模型可能让镜头动了，杯子却变形、漂移，或前后画面接不上。Zo3T要解决的正是相机运动与场景运动难以协调的问题。它先根据模型推断的深度，把相机轨迹投影成符合透视的画面变换；再在逐步去噪生成视频时，把变换动态施加到潜在表示，也就是压缩后的画面特征上。与此同时，它临时优化低秩适配器（LoRA，一种轻量的模型参数补丁），让生成内容贴合变换后的表示，并用区域特征一致性损失约束同一物体别在镜头运动中走样。最后，指导场会修正生成方向。这样既能跟随指定镜头运动，也尽量保住场景结构；方法无需额外训练，但摘要未给出量化指标。", "key_numbers": ["零样本", "摘要未给指标"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2509.06723"], "note": "单段轨迹控制的 I2V，无长程历史回溯；收进来只因它是\"位姿条件 × 测试时训练\"最早的一批样本，可作方法拼装参考。", "parent": null, "link_strength": "", "key": false, "x": 214, "y": 4038, "sx": null}, {"id": "comoe", "title": "Composition of Memory Experts", "date": "2026-05-12", "precision": "day", "lane": "参数化记忆", "branch": "专家组合", "arxiv": "2605.18813", "venue": "", "training": "训练+测试时微调", "status": "速读", "one_liner": "短期/长期/空间三记忆专家组合", "mechanism": "用对比式 product-of-experts 组合异构记忆：短期专家抓局部动态，长期专家经轻量测试时微调把情节历史写进外部扩散权重，空间专家保几何一致。", "tags": ["专家组合", "测试时微调", "情节记忆"], "explain": "想象镜头跟着一个人穿过房间：刚才移开的椅子不能突然复位，门的位置也不能漂移。视频世界模型要预测后续画面，却常难同时记住眼前动作、较早发生的事和场景几何。《Composition of Memory Experts》把记忆拆成三位专家：短期专家捕捉局部动态，长期专家通过轻量的测试时微调，把情节历史写入外部扩散模型的权重；空间专家则维持几何一致。它用对比式“专家乘积”组合这些记忆——可理解为让不同专家的判断相互约束、共同支持合理预测。这样，模型既能跟上动作，又不易忘掉旧事或弄乱空间。论文发表于 ICLR 2026。", "key_numbers": ["ICLR 2026"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.18813"], "note": "面向机器人/规划的扩散世界模型，无项目页；机制描述取自摘要，未读正文，故 low。亮点是把\"写进权重的情节记忆\"当成可组合的一个专家而非唯一记忆。", "parent": null, "link_strength": "", "key": false, "x": 1310, "y": 4432, "sx": null}, {"id": "causvid", "title": "CausVid", "date": "2024-12-01", "precision": "month", "lane": "训练侧", "branch": "", "arxiv": "2412.07772", "venue": "", "training": "需训", "status": "速读", "one_liner": "因果蒸馏，Self-Forcing 的早期版本", "mechanism": "报告只有一句：与 Self-Forcing 同一思路的早期版本，属因果蒸馏路线。", "tags": ["DMD蒸馏", "因果注意力"], "explain": "以往生成视频就像冲洗胶卷，必须等整卷拍完统一洗出来，根本没法像直播那样边拍边看。CausVid在2024年12月要解决的就是这种生成延迟过高、无法实时流式输出的麻烦。它用了一招叫因果蒸馏，也就是让只能看前文的单向模型去临摹通览全片的大模型。这招之所以管用，是因为大模型掌握着全局连贯的规律，把经验传授过去后，单向模型顺着时间逐帧推演时就不会越走越崩，既做到了开水龙头般的即时出帧，又稳住了画面质感。", "key_numbers": ["2024-12"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2412.07772"], "note": "报告只给到月份 2024-12。", "parent": null, "link_strength": "", "key": false, "x": 214, "y": 4898, "sx": null}, {"id": "framepack", "title": "FramePack", "date": "2025-04-01", "precision": "month", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2504.12626", "venue": "", "training": "需训", "status": "速读", "one_liner": "恒定上下文按帧重要性打包，越旧压得越狠", "mechanism": "喂给模型的上下文体积恒定，历史按帧重要性打包压缩；另配反漂移采样抑制误差累积。", "tags": ["重要性打包", "反漂移采样"], "explain": "长视频生成就像用一本页数固定的笔记本去记长途旅行，画面越堆越多，显存随时会爆。这篇论文解决的就是长视频生成中历史帧越积越多、显存吃不消的麻烦。它的做法是把上下文，也就是模型每次能参考的历史信息总量锁死，按照重要性把旧帧打包压缩，时间越久远压得越狠；同时搭配反漂移采样，即一种抑制误差累积、防止画面越来越变形的纠偏方法。这招管用是因为远景历史只要保留粗略轮廓就能稳住连贯性，省下算力留给近处细节，最终实现了把 13B 模型塞进 6GB 显存里流畅运行。", "key_numbers": ["13B", "6GB 显存"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2504.12626"], "note": "报告只给到月份 2025-04；lane 依矩阵『重要性打包』归内容/学习，报告未述具体检索键。", "parent": null, "link_strength": "", "key": false, "x": 488, "y": 5038, "sx": null}, {"id": "self-forcing", "title": "Self-Forcing", "date": "2025-06-01", "precision": "month", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2506.08009", "venue": "", "training": "需训", "status": "速读", "one_liner": "用自生成历史蒸馏，治 exposure bias", "mechanism": "不改记忆结构：学生自己 rollout 出带误差的历史，教师对这段自生成历史打分蒸馏，让模型习惯自己的错误。", "tags": ["学生自rollout", "教师蒸馏"], "explain": "就像学骑车如果总有人在后面扶着，一旦松手你只要车把稍稍晃一下就会直接摔倒。模型平时训练都喂标准答案，实际生成时只能依赖上一句输出，前面一错就会步步错，这种训练和实战脱节的问题叫暴露偏差。这篇论文的招数是让学生模型自己往下写，生成一段带毛病的作答历史，再让更厉害的教师模型针对这段有错的历史教它打分，也就是用好模型带差模型的知识蒸馏。这招管用是因为它不改动模型结构，直接让模型提前习惯自己的失误并在犯错语境里学会顺势纠偏，独立推理时就不会因为微小失误而全盘崩溃了。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2506.08009"], "note": "报告未给日期，仅列于 §3.6 与参考文献。", "parent": "causvid", "link_strength": "solid", "key": false, "x": 762, "y": 5178, "sx": 462, "sy": 4948.0, "cross": false}, {"id": "longlive", "title": "LongLive", "date": "2025-09-01", "precision": "month", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2509.22622", "venue": "", "training": "需训", "status": "速读", "one_liner": "自回归+少步采样做实时长视频", "mechanism": "把自回归生成与少步采样结合，靠 KV 重算和帧级注意力维持长程一致；报告未描述记忆检索结构。", "tags": ["少步采样", "KV重算"], "explain": "想象你在开一场AI实时视频直播，镜头得一边飞快出图，一边保证播了半天主角的脸和衣服完全不变。以往生成长视频要么太慢做不到实时，要么时间一长画面就崩坏走样。LongLive把少步采样和自回归结合起来，前者指用极少的计算步数快速画图，后者指像接龙一样按时间逐帧推导。这招管用是因为少步骤压低了耗时，同时靠帧级注意力让新帧精准对照历史画面，配合重新计算历史特征的KV重算，让后续内容始终锚定前文，在极速生成中稳住了长期连贯性。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2509.22622"], "note": "与 LongLive-RAG（2606.02553）同名不同物，勿混；报告只给了一句描述。", "parent": "self-forcing", "link_strength": "solid", "key": false, "x": 1036, "y": 5178, "sx": 1010, "sy": 5228.0, "cross": false}, {"id": "solarwm", "title": "SolarWM", "date": "2026-09-01", "precision": "month", "lane": "训练侧", "branch": "三段训练", "arxiv": "2609.02886", "venue": "", "training": "需训", "status": "速读", "one_liner": "三段式训练把 5s 训练推到 60min 长程", "mechanism": "只讲训练流程：双向适应→teacher-forced 自回归→DMD 蒸馏；相机条件用 fused-PRoPE，记忆结构未描述。", "tags": ["三段式训练", "fused-PRoPE"], "explain": "就像教新手开车，如果平时只练五秒起步，直接让他上一小时高速，车子很快就会失控撞墙。以前模型在 1.43M clips、约 25TB 数据上只练 5 秒，推到长程就会彻底崩溃。SolarWM 在 5B 到 33B 规模上提出三段式训练：先做双向适应，即让前后帧互相参考打底；再做教师强制自回归，也就是拿真实画面纠偏学预测；最后用 DMD 蒸馏，即把慢速去噪压缩为一步出图的加速法，结合融合位置编码输入相机位姿。这种阶梯式进阶彻底控制了误差累积，稳稳把 5 秒短片推到了 60 分钟长程。", "key_numbers": ["5B–33B", "5s", "60min", "1.43M clips", "约 25TB"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.02886"], "note": "§2 表列为可跑模型、§3.6 又归训练侧，lane 按 §3.6 填；报告只给到月份 2026-09。", "parent": null, "link_strength": "", "key": false, "x": 2132, "y": 5432, "sx": null}, {"id": "honeycomb", "title": "Honeycomb", "date": "2026-09-01", "precision": "month", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2609.37690", "venue": "", "training": "需训", "status": "速读", "one_liner": "恒定容量槽位＋显式锚点的代表", "mechanism": "报告只在 L3『恒定槽位』与趋势 4『恒定容量+显式锚点』两处点名，未述寻址键与读写细节。", "tags": ["恒定槽位", "显式锚点"], "explain": "这就像把随手乱堆的杂物箱，换成了一排贴着固定门牌的储物柜。模型处理长内容时，记忆往往会随文本变长而无休止膨胀，导致资源吃紧且难以定位。Honeycomb 的做法是采用恒定容量槽位和显式锚点。这里的恒定容量槽位，指不论输入多长都大小固定的记忆格子；显式锚点则像是在序列里立起清晰可见的参照标桩。这招之所以管用，在于锁死槽位容量能把内存开销控制在确定边界内，而明确的锚点给模型提供了可靠的对照坐标，防止信息在压缩中丢失相对位置。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.37690"], "note": "摘要级；lane 无报告依据（L3 表头写『按位置或几何寻址』），存疑；只给到月份 2026-09。", "parent": null, "link_strength": "", "key": false, "x": 2132, "y": 5038, "sx": null}, {"id": "causal-forcing", "title": "Causal Forcing: Autoregressive Diffusion Distillation Done Right for High-Quality Real-Time Interactive Video Generation", "date": "2026-02-02", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2602.02214", "venue": "", "training": "需训", "status": "速读", "one_liner": "用自回归教师补掉SF的架构错配", "mechanism": "指出Self-Forcing拿双向教师做ODE初始化与单向学生不匹配，改用自回归教师做ODE初始化，再走同一套DMD，把因果蒸馏的理论缺口补上。", "tags": ["因果蒸馏", "教师学生一致", "DMD"], "explain": "想象你边玩游戏边转动镜头，画面必须立刻接住你的动作，不能偷看未来再补帧。Self-Forcing 是一种自回归视频生成方法：每次只根据已有画面预测下一段；麻烦在于，它用能同时看前后画面的教师来初始化生成轨迹，学生却只能看过去，学到的起步方式与实际生成不一致。Causal Forcing 改用同样按时间顺序生成的教师来初始化轨迹，再用分布匹配蒸馏（DMD，让学生生成结果贴近教师）训练。教师和学生因此沿着相同的因果路径学习，弥补了蒸馏中的架构错配。实验中，动态程度提升19.3%，视觉奖励提升8.7%，指令遵循提升16.7%。", "key_numbers": ["Dynamic Degree +19.3%", "VisionReward +8.7%", "Instruction Following +16.7%"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.02214", "https://github.com/thu-ml/Causal-Forcing", "https://thu-ml.github.io/CausalForcing.github.io/"], "note": "现在已是minWM、Astronex等框架的默认蒸馏配方，可视为因果蒸馏支的\"更正基线\"，优先级应高于清单里只做速读的 Self-Forcing。", "parent": null, "link_strength": "", "key": false, "x": 1310, "y": 5178, "sx": null}, {"id": "context-forcing", "title": "Context Forcing: Consistent Autoregressive Video Generation with Long-Context Forcing", "date": "2026-02-05", "precision": "day", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2602.06028", "venue": "", "training": "需训", "status": "速读", "one_liner": "教师也看全程历史，学生才能长一致", "mechanism": "让教师同样拿到完整生成历史以消掉监督错配，再把线性增长的上下文改成Slow-Fast记忆架构压视觉冗余，使超长时长训练可算，有效上下文超20秒。", "tags": ["长上下文教师", "Slow-Fast记忆", "监督错配"], "explain": "想象一段不断延续的长镜头：人物放下杯子，几十秒后杯子仍该在原处。视频模型逐步预测后续画面，时间一长容易忘记细节、动作前后矛盾；若训练时教师只看短片段，学生却要面对完整历史，指导就会错位。Context Forcing让教师和学生都读取截至当前的完整生成历史，消除这种监督错配。可历史越长，处理成本越高，于是论文用慢快记忆架构压缩视觉冗余：快记忆保留近期变化，慢记忆概括较久远内容。这样既让指导贴近实际生成，也控制计算开销，有效上下文超过20秒，是LongLive和Infinite-RoPE的2到10倍。", "key_numbers": ["有效上下文>20秒", "比LongLive/Infinite-RoPE长2-10倍"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.06028"], "note": "与 Self-Forcing 的差别是\"教师的视野\"而非\"学生的步数\"，正好补上清单里恒定上下文支只有 FramePack/Honeycomb 的空档。", "parent": null, "link_strength": "", "key": false, "x": 1310, "y": 5038, "sx": null}, {"id": "longforcing", "title": "LongForcing: Scaling Temporal Manifold Matching for Long-Horizon World Models", "date": "2026-10-13", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2610.18289", "venue": "", "training": "需训", "status": "速读", "one_liner": "把监督拉到学生的长自rollout上", "mechanism": "保留短程teacher-forcing与因果ODE蒸馏两段，第三段把realscore教师换成双向长程教师，直接监督学生的长自rollout，不改架构也不加推理开销。", "tags": ["长程教师", "分布匹配", "时间轴扩监督"], "explain": "像让学生先照着范例画几笔，再独自画完整幅长卷：短视频里画得像，不代表连续生成很久也不走样。长时生成的麻烦正是误差会一帧帧累积，训练时看真实画面、生成时却要接着自己的结果往下画。LongForcing保留两步训练：先用真实画面教短程生成，再用因果常微分方程蒸馏，让学生学会逐步生成。随后，它把真实评分教师换成能看前后画面的长程教师，直接纠正学生自己生成的长视频。这样训练目标更贴近实际使用，能压住长期漂移；不改模型架构，也不增加推理开销。结果，VBench画质得分达85.52，WorldRoamBench上60秒动作分提高23.9分，并压力测试到24小时连续生成。", "key_numbers": ["VBench Quality 85.52", "WorldRoamBench 60s 动作分+23.9", "压力测到24小时rollout"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.18289", "https://github.com/Fantasy-AMAP/LongForcing"], "note": "与 LongTake 同月、都在动\"第三段教师\"，但 LongForcing 只换教师、LongTake 改初始化，可对照读。", "parent": null, "link_strength": "", "key": false, "x": 2406, "y": 5178, "sx": null}, {"id": "forgewm", "title": "ForgeWM: Progressive Causal Training for Few-Step Action-Conditioned Video World Models", "date": "2026-08-14", "precision": "day", "lane": "训练侧", "branch": "三段训练", "arxiv": "2608.14022", "venue": "", "training": "需训", "status": "速读", "one_liner": "四段渐进因果训练换1/2/4步预算", "mechanism": "领域适配→因果teacher-forcing→因果一致性蒸馏→on-policy DMD四段递进，产出1/2/4步专用学生；另给\"一步先出草稿、回放时再去噪精修\"的双路部署。", "tags": ["渐进因果训练", "预算专用学生", "回放精修"], "explain": "想象机器人在仓库里转弯：世界模型要预演它按下指令后的画面，采样步数越多越慢，步数骤减又容易让视频失真。ForgeWM要解决的正是速度与画质难两全。它先适配目标领域，再用因果教师强制训练，让模型只依据过去预测未来；接着蒸馏因果一致性，使少步预测仍与多步结果对齐；最后用在策略分布匹配，让学生在自己生成的画面上继续变好。四阶段训练产出专用的1、2、4步模型。因果约束贴近真实生成顺序，逐步蒸馏也减少压缩误差，因此少步仍能保住质量。部署时还可先一步出草稿，回放时再去噪精修，效果约等于4步生成；比从噪声重新生成，精修快近3倍。", "key_numbers": ["1/2/4 步三档", "回放精修≈4步质量", "比从噪声重生近3倍"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.14022"], "note": "key_numbers 里的\"3倍\"指与经验轨迹更接近（reference LPIPS 最低），原文表述为 roughly three times closer；动作条件版三段训练的代表。", "parent": null, "link_strength": "", "key": false, "x": 1858, "y": 5432, "sx": null}, {"id": "causal-rcm", "title": "Causal-rCM: A Unified Teacher-Forcing and Self-Forcing Open Recipe for Autoregressive Video Diffusion", "date": "2026-06-24", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2606.25473", "venue": "", "training": "需训", "status": "速读", "one_liner": "TF连续时间CM初始化+SF的DMD精修", "mechanism": "把因果蒸馏拆成两段：teacher-forcing连续时间一致性模型做初始化，self-forcing的反向散度DMD做精修；自研mask JVP核支持sCM/MeanFlow，收敛快一个量级。", "tags": ["连续时间CM", "JVP内核", "开源配方"], "explain": "想象一台边看前几帧、边续写后续画面的机器：训练时若总能看到完整答案，真正逐帧生成时却要靠自己接龙，画面就容易跑偏；直接训练它独立接龙，又很难学得快。Causal-rCM把训练拆成两段：先用教师强制，让模型在参考答案引导下学习连续时间的一致性，也就是不同生成时刻的结果彼此协调；再用自我强制，让模型按实际接龙方式生成，并通过分布匹配蒸馏（DMD）修正生成结果与目标分布的差距。作者还设计了处理因果遮罩的快速求导内核，支持两类一致性训练方法，大幅缩短计算时间。这样先打基础、再贴近真实生成精修，既减少训练和推理之间的落差，也加快收敛。模型仅用合成数据训练，生成视频只需两步，在VBench文生视频评测中得分84.63，收敛速度提升约十倍。", "key_numbers": ["2步 VBench-T2V 84.63", "收敛快10×", "纯合成数据"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.25473"], "note": "唯一明确给出\"TF-CM 是 SF-DMD 最佳初始化\"这一实验结论的论文，把三段训练里第一段该怎么选讲清楚了；作者还把配方套到 Cosmos 3 上做成动作条件交互世界模型。", "parent": null, "link_strength": "", "key": false, "x": 1584, "y": 5178, "sx": null}, {"id": "longtake", "title": "LongTake: Learning to Sustain Dynamics in Long-Horizon Video Generation", "date": "2026-09-29", "precision": "day", "lane": "训练侧", "branch": "三段训练", "arxiv": "2609.38562", "venue": "", "training": "需训", "status": "速读", "one_liner": "长程TF初始化替掉中间少步蒸馏", "mechanism": "用长真值前缀把直接监督推过训练视界，让模型学会维持动态与画质；该初始化直接对接DMD、省掉中间少步蒸馏，再用Hybrid DMD把监督延到self-rollout后段。", "tags": ["长程TF初始化", "Hybrid DMD", "动态度"], "explain": "想象镜头跟着滑板少年穿过街区：短片里动作流畅，时间一长，人物可能变形，画面也会变糊。LongTake要解决的正是长视频越生成越失真的问题。它先用真实视频的长前缀训练模型，并把这种逐帧依据真实历史学习的方式称为教师强制；监督因此能越过原有训练视界，让模型学会持续保持动作和画质。这个初始化可直接接入分布匹配蒸馏，即让生成结果贴近真实视频分布，无须先做中间的少步蒸馏。随后，混合式蒸馏再把监督延伸到模型自己生成的后续片段。结果显示，模型可自回滚生成30秒或60秒视频，并在动态感与美感的权衡上达到更好的前沿。", "key_numbers": ["30s/60s self-rollout", "无中间少步蒸馏", "动态度-美学Pareto前沿"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.38562"], "note": "核心反直觉点：长程TF初始化本身就够用，中间少步蒸馏段可以砍掉，训练流水线因此短一环。", "parent": null, "link_strength": "", "key": false, "x": 2132, "y": 5546, "sx": null}, {"id": "glance-forcing", "title": "Glance Forcing: Making Bidirectional Diffusion Autoregressive at a Glance", "date": "2026-10-14", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2610.20220", "venue": "", "training": "需训", "status": "速读", "one_liner": "按噪声区间拆两个专家做少步蒸馏", "mechanism": "高噪段管布局与运动、低噪段管纹理，两段曲率与优化行为不同，单学生必然互相干扰；故拆成慢/快双专家各配目标、教师全冻，只需一条PF-ODE轨迹。", "tags": ["双专家蒸馏", "噪声分区", "教师冻结"], "explain": "想象画师先铺出整段视频的动作草图，再补上衣料纹理：前者要看远处布局，后者要盯住细节。双向扩散能同时看整段视频，却不擅长逐段快速生成；把它蒸馏成少步模型时，单个学生还得兼顾两种任务，容易互相干扰。Glance Forcing按噪声区间分工：高噪声阶段由慢专家把握布局和运动，低噪声阶段由快专家补足纹理。因为两段生成轨迹的弯曲程度和训练方式不同，拆开学习更合适。训练时教师保持冻结，只需一条概率流常微分方程轨迹——一种把生成过程写成连续确定路径的方式。结果是少步生成仍保质量，VBench得分从84.04升到84.22。", "key_numbers": ["VBench 84.04→84.22", "单条ODE轨迹", "教师冻结"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.20220"], "note": "顺带给出一个可迁移结论：PF-ODE蒸馏主要拉直轨迹几何，分布质量是后面分布匹配那一步单独决定的。", "parent": null, "link_strength": "", "key": false, "x": 2406, "y": 5292, "sx": null}, {"id": "memory-forcing-train", "title": "Memory Forcing: Attendable Mid-Horizon History for Streaming Video Generation", "date": "2026-10-08", "precision": "day", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2610.11756", "venue": "", "training": "需训", "status": "速读", "one_liner": "固定缓存里塞进中程历史银行", "mechanism": "把定长KV切成sink/archive/working三段，归档区专门留多样中程事件；绝对时间索引越界后用Bank-aware RoPE在注意力时重编索引，使各bank可区分，缓存不加。", "tags": ["分段KV银行", "Bank-aware RoPE", "中程遗忘"], "explain": "想象镜头一路跟着人穿过街巷，几分钟后又回到最初的咖啡馆：人物和场景都该认得出来。可流式视频模型的缓存容量固定，旧画面不断被挤掉，隔久了再回来就容易忘记中程发生过什么。Memory Forcing把缓存分成三段：保留开头的“水槽区”、保存多样旧事件的“归档区”，以及存放眼前画面的“工作区”。绝对时间索引超出范围时，它用Bank-aware RoPE（一种按缓存区重新编码时间位置的方法）让模型分清各段记忆，无须增加缓存。这样，模型既能看当前画面，也能按需取回关键往事。实验中，1.3B模型和Wan2.2-5B都受益；从5秒延长到60秒时性能下降最小，也能复现离开后再返回的场景。", "key_numbers": ["1.3B 与 Wan2.2-5B", "5s→60s 掉点最小", "leave-and-return 可复现"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.11756"], "note": "明确命名并量化\"mid-horizon forgetting\"，把\"只留开头+最近\"这一默认假设的失效点钉死；跨1.3B/5B两规模验证。", "parent": null, "link_strength": "", "key": false, "x": 2406, "y": 5038, "sx": null}, {"id": "videophy", "title": "VideoPhy", "date": "2024-10-07", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "", "venue": "", "training": "不适用", "status": "速读", "one_liner": "物理合理性评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "tags": ["物理常识", "语义遵循"], "explain": "就像看魔术时杯子凭空穿透了桌子，现在很多AI视频画面逼真，细看却常常违反牛顿定律。这篇论文要解决的麻烦，是以往评测只看画面好不好看，发现不了动作是否符合现实规律。作者提出的VideoPhy用了一套物理合理性评测基准，也就是专门测试物体规律的成套考卷，重点检验具身动作与指令遵循。它不做回溯一致性评测，也就是不去回头核对前后帧的历史记忆，仅作为能力评估的辅助参考。这招之所以管用，是因为它避开了画质干扰，直接考察物体受力与运动，能准确测出模型到底懂不懂真实物理。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2406.03520"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "x": 214, "y": 5732, "sx": null}, {"id": "worldmodelbench", "title": "WorldModelBench", "date": "2025-02-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2502.20694", "venue": "", "training": "不适用", "status": "速读", "one_liner": "具身/物理评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "tags": ["物理合理性", "指令遵循"], "explain": "就像你让机械臂推倒桌上的水杯，水往哪流必须当场推演出来，现实里可没有撤销键。很多模型生成的视频看着逼真，但放到具身交互——也就是像机器人那样和物理世界互动时，常常动作走样、违背常理。WorldModelBench搭建了一套专门测试物理规律与指令遵循的考卷，核心是坚持非回溯，也就是推演过程只能单向往前走，绝不给模型倒退修补的机会。这招之所以管用，是因为真实物理世界不可逆，卡死单向因果，才能验出模型是真掌握了规律，还是在蒙混过关。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2502.20694"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "x": 488, "y": 5732, "sx": null}, {"id": "worldsimbench", "title": "WorldSimBench", "date": "2025-03-24", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "", "venue": "", "training": "不适用", "status": "速读", "one_liner": "具身/物理评测，非回溯，辅助参考", "mechanism": "报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。", "tags": ["具身操作", "物理一致"], "explain": "想象指挥机器人在厨房拿玻璃杯，杯子一旦滑落摔碎就没法倒带重来。以往模型在模拟动作时容易穿帮，且现实中的物理交互出错就不可撤销，很难测出连续过程的真实水平。这篇工作提出了WorldSimBench，专门做非回溯一致性评测，也就是不给模型倒退修正的机会，直接看它一镜到底执行连续指令时能不能保持物理逻辑不崩。这招管用就在于真实物理本就不可逆，彻底封死回退偷懒的退路，才能测出模型到底懂不懂物理规律、能不能连贯听懂指挥，为后续研究提供更靠谱的参考。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2410.18072"], "note": "只有名字和归类，无 arXiv 号、无日期、无指标。", "parent": null, "link_strength": "", "key": false, "x": 762, "y": 5732, "sx": null}, {"id": "worldscore", "title": "WorldScore", "date": "2025-04-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2504.00983", "venue": "ICCV 2025", "training": "不适用", "status": "速读", "one_liner": "显式相机轨迹的下一场景评测，不测回访", "mechanism": "不涉及记忆机制；3000 例上测 next-scene generation 的可控性/质量/动态，明确不测回访一致性。", "tags": ["相机轨迹", "下一场景打分"], "explain": "想象你推着摄像机拍一镜到底，镜头一直向前推，模型得即时脑补前方的未知画面。过去评测世界模型缺乏统一考卷，很难量化相机移动时画面听不听话。WorldScore做了一套评测基准，在三千个样例上给出明确的相机轨迹，专门考察下一场景生成——也就是按指定镜头走向预测前方新画面的能力。它集中测试生成的可控性、画面质量与动态表现，明确不测回头重访旧地的一致性。这招管用是因为它把考核纯粹锁定在向前看，剔除了记忆机制的干扰，能干净直接地测出模型跟不跟手。", "key_numbers": ["3000 例"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2504.00983"], "note": "报告只给 arXiv 号与 ICCV 2025，无提交日期。", "parent": null, "link_strength": "", "key": false, "x": 1036, "y": 5732, "sx": null}, {"id": "loopnav", "title": "LoopNav", "date": "2025-05-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2505.22976", "venue": "", "training": "不适用", "status": "速读", "one_liner": "首个回溯基准，Minecraft 环线轨迹", "mechanism": "不涉及记忆机制；在 Minecraft 环线上测物体级回溯，指标 SGCS。", "tags": ["环线轨迹", "物体级回溯"], "explain": "就像我们逛公园绕了一大圈，发现半路掉了钥匙得回头去找，以前的研究却没有基准能测出模型能不能顺着原路找回东西。LoopNav 补上了这个缺口，提出首个回溯基准，也就是专门测验模型折返回去定位物体的测试集。它不涉及修改记忆机制，而是在《我的世界》中采集了 250 小时、2000 万帧环线轨迹，在闭合环线上测试物体级回溯，并用 SGCS 也就是目标完成度指标来打分。环形路线让起点终点相连，排除了直行碰运气的侥幸，能真实检验模型是否认得旧地标并精准回头。", "key_numbers": ["250h", "20M 帧"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2505.22976"], "note": "报告只给到月份 2025-05（时间线称『首个回溯基准』）。", "parent": null, "link_strength": "", "key": false, "x": 1310, "y": 5732, "sx": null}, {"id": "mind", "title": "MIND", "date": "2026-02-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2602.08025", "venue": "", "training": "不适用", "status": "速读", "one_liner": "记忆一致性与动作控制的双轴评测", "mechanism": "不涉及记忆机制；报告只写『双轴』：记忆一致性与动作控制，指标细节未给。", "tags": ["双轴评测", "动作可控"], "explain": "比如你叮嘱助手自己对花生过敏，他嘴上答应得好好的，做饭时却把花生酱端上了桌。现在评估智能体常面临这种麻烦：光看它能不能背出记忆，根本不知道它会不会据此做出对的举动。这篇论文提出了一套叫MIND的评测方案，它设立了双轴，也就是从记忆一致性和动作控制两个维度一起考核。记忆一致性指模型前后说法不冲突、记准事实，动作控制指模型能否把记住的信息落实为具体操作。这招管用在于两手抓，避免了模型像鹦鹉学舌一样只背答案却无法执行，全面测出了记忆到底有没有真正指导行动。", "key_numbers": ["双轴"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.08025"], "note": "只有表格一行，指标名称与数值都缺；无日期。", "parent": null, "link_strength": "", "key": false, "x": 1584, "y": 5732, "sx": null}, {"id": "r2m-bench", "title": "R2M-Bench", "date": "2026-08-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2608.27328", "venue": "", "training": "不适用", "status": "速读", "one_liner": "300 实例跨 7 模型的回访基准，指标 NMR", "mechanism": "不涉及记忆机制；用同 rollout 校准的 NMR 衡量回溯，覆盖 300 实例、7 个模型。", "tags": ["同rollout校准", "NMR指标"], "explain": "就像我们出门发现忘带钥匙得折返回家拿一样，智能体做任务时也常常需要走回头路，但大家一直没有一把尺子来测它们回头折返的能力。这篇文章做了一个叫 R2M-Bench 的评测基准，覆盖了 300 个任务实例和 7 个模型。它用模型同一次完整执行（也就是 rollout）进行校准，提出了衡量回溯水平的归一化指标 NMR。这招管用在于它完全不涉及额外的记忆机制，而是拿同轨迹自身当对照排除了干扰，公平看清了不同模型在面对复杂环境时自主折返的真实水平。", "key_numbers": ["300 实例", "7 模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.27328"], "note": "报告只在 §5.1 表格给了一行，无日期。", "parent": null, "link_strength": "", "key": false, "x": 2680, "y": 5732, "sx": null}, {"id": "worldmembench", "title": "WorldMemBench", "date": "2026-10-01", "precision": "month", "lane": "评测基准", "branch": "", "arxiv": "2610.19063", "venue": "", "training": "不适用", "status": "精读", "one_liner": "静态保持与动态演化必须分开报的回访基准", "mechanism": "不涉及记忆机制；260 例分静态 200/动态 60，四类轨迹（含多次回访）分别测外观几何与离屏事件演化。", "tags": ["静动分测", "多次回访"], "explain": "比如你走出厨房转一圈再回来，桌上的杯子必须原封不动，但灶台上的水可能已经烧开了。以往的评测常把这两类情况混在一块算总分，分不清模型到底哪项不行。这篇工作做了专门测模型回头看能力的评测基准，它不提出记忆算法，而是设计了包含四类轨迹的260个测试例，明确拆分成保持原貌的200个静态场景与发生变化的60个动态场景。这一招之所以灵，是因为它把物体的外观几何与视线之外的离屏事件演化拆开评分，一眼就能看清模型究竟是记不住东西，还是推测不出不在场时的变化。", "key_numbers": ["260 例", "静态 200", "动态 60", "四类轨迹"], "self_measured": [], "media": [], "links": ["https://arxiv.org/html/2610.19063"], "note": "报告只给到月份 2026-10，且仅给 html 链接。", "parent": null, "link_strength": "", "key": false, "x": 2954, "y": 5732, "sx": null}, {"id": "worldroambench", "title": "WorldRoamBench: An Open-World Benchmark for Long-Horizon Stability of Interactive World Models", "date": "2026-06-30", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2606.31672", "venue": "", "training": "不适用", "status": "速读", "one_liner": "1000+例、10-60秒开放世界长程考卷", "mechanism": "四维各设新指标：逐帧动作指标绕开跨模型语义尺度差、滑窗漂移抓中途非单调坍塌、物理项先过相机与主体跟踪门控、记忆项用过渡段局部3D点云重建加追踪与VLM。", "tags": ["滑窗漂移", "点云记忆", "门控物理"], "explain": "想象你在生成的荒野里开车：前几秒路面逼真，几十秒后车却穿墙，转过山头又忘了刚才的营地。WorldRoamBench要解决的，正是互动世界模型短片看着不错、长时间连续游玩却容易失稳，而且不同模型的分数难直接比较的问题。它准备了1000多个、时长10到60秒的开放世界交互任务，测试10多种开源和闭源模型，并从四方面打分：逐帧动作指标看模型是否及时回应操作，避开不同模型语义评分尺度不一；滑动窗口漂移指标沿时间检查画面是否逐渐走样，也能抓住中途突然崩坏；物理评估先确认相机和主体跟踪可靠，再判断运动是否合乎物理；记忆评估则在场景转换处重建局部三维点云，结合跟踪和视觉语言模型检查模型是否记得先前见过的东西。这样既测得久，也能定位失稳发生在哪里。", "key_numbers": ["1000+ 用例", "10-60秒连续交互", "10+ 闭源开源模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.31672"], "note": "测的信号是\"持续性\"：动作跟得住吗、中途会不会塌、物理过不过门控、记忆能不能用局部点云重建对上；结论是最好模型也只到中等分。", "parent": null, "link_strength": "", "key": false, "x": 2406, "y": 5846, "sx": null}, {"id": "wbench", "title": "WBench: A Comprehensive Multi-turn Benchmark for Interactive Video World Models", "date": "2026-05-25", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2605.25874", "venue": "", "training": "不适用", "status": "速读", "one_liner": "289例1058轮的多轮交互五维评测", "mechanism": "每例给世界设定加多轮交互序列，导航侧统一文本/6-DoF位姿/离散动作三种接口，22个自动子指标由专用视觉模型加LMM合成，全部对齐过人类判断。", "tags": ["多轮交互", "接口统一", "22子指标"], "explain": "想象你在一座虚拟城市里连续问路、转弯、开门：模型不只要生成眼前画面，还得记住此前发生了什么，并对新动作作出合理反应。许多旧评测只看单次生成，难以判断互动是否连贯，也不便比较不同操控方式。WBench设计了289个带世界设定的案例，共1058轮交互，用来评测20个模型；导航统一支持文字、六自由度位姿（位置与朝向）和离散动作三种输入。它用22项自动子指标，从五个方面评价结果，由专用视觉模型和多模态大模型合成评分，并与人类判断对齐。多轮情境能暴露前后矛盾，统一接口让比较更公平，细分指标则把模糊的“表现好”变成可检验的能力。", "key_numbers": ["289 用例", "1058 交互轮", "20个模型", "22子指标"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.25874"], "note": "测画质、设定遵循、交互遵循、一致性、物理合规五维，关键设计是多轮——单轮分数高不代表第二三轮还听话。", "parent": null, "link_strength": "", "key": false, "x": 2132, "y": 5732, "sx": null}, {"id": "worldmark", "title": "WorldMark: A Unified Benchmark Suite for Interactive Video World Models", "date": "2026-04-23", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2604.21686", "venue": "", "training": "不适用", "status": "速读", "one_liner": "一个WASD适配器统一十个异构模型", "mechanism": "把共享WASD词表翻成各模型原生控制格式，500例同义指令横评；用控制论视角逐轴量方向准确率、方向纯度、响应延迟、运动稳定性，另设记忆与画质套件。", "tags": ["动作动力学", "逐轴分解", "适配器协议"], "explain": "想象十台游戏角色各拿着不同手柄：你都喊“向前”，它们却可能走偏、迟钝，彼此成绩也难比较。WorldMark要解决的正是视频世界模型控制接口各异、评测不统一的问题。它用WASD这套上下左右方向词作共同语言，再由适配器把指令翻译成每个模型原生的控制格式；新模型只需接一个适配器。研究者用500条同义指令测试10个模型，并从控制论角度——比较命令与实际运动——逐轴衡量方向准确度、动作是否夹带别的方向、响应快慢和运动稳定性，还单独评测记忆与画质。共同入口和同一套测试让横向比较更公平，也让差异更容易定位。", "key_numbers": ["10个模型", "500 用例", "一新模型仅需1个适配器"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2604.21686"], "note": "测的是动作响应曲线本身：最快响应的往往最不稳、画质最好的平移方向准确率垫底、逐轴拆开才看得见\"平移几乎完美但几乎不转\"。", "parent": null, "link_strength": "", "key": false, "x": 1858, "y": 5732, "sx": null}, {"id": "memobench", "title": "MemoBench: Benchmarking World Modeling in Dynamically Changing Environments", "date": "2026-06-25", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2606.27537", "venue": "", "training": "不适用", "status": "速读", "one_liner": "消失-重现范式专考遮挡期间的变化", "mechanism": "目标先经历物理过程、离开视野、再回来时必须呈更新后的状态；360段有真值片段，四个诊断支柱，自动指标加VQA，专抓\"遮挡期静止场景\"测不出的记忆。", "tags": ["消失-重现", "状态更新记忆", "有真值片段"], "explain": "想象一个球滚到沙发后：你看不见它时，它可能被踢动；再露面却仍停在原处，说明模型没记住遮挡期间发生了什么。MemoBench要解决的正是视频世界模型的这个麻烦：许多测试里，遮挡时场景静止，模型即使忘了变化也能答对。它用消失—重现测试：物体先经历物理过程，离开视野一段时间，再出现时必须呈现更新后的状态。基准包含360段带真实状态记录的片段，用四个诊断支柱检查模型是否记住变化，并结合自动指标和视觉问答（用问题检验画面理解），评估8个先进模型。让变化发生在看不见的时候，才能测出模型是在记忆世界，还是只根据眼前画面补全视频。", "key_numbers": ["360 段真值clip", "8个SOTA模型", "4个诊断支柱"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.27537"], "note": "信号是\"遮挡期间发生的状态更新能否在重现时对上\"，比只测视野内一致性的基准严格一档；合成加真实混合。", "parent": null, "link_strength": "", "key": false, "x": 2406, "y": 5732, "sx": null}, {"id": "playworld", "title": "PlayWorld: Benchmarking World Models with Agent Players over Long-Horizon Objectives", "date": "2026-08-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2608.13552", "venue": "", "training": "不适用", "status": "速读", "one_liner": "让agent玩家带长程目标去考世界模型", "mechanism": "派多模态agent玩家按指定长程目标在世界模型里行动，用任务达成替代固定动作序列；171个场景，四维评几何一致、交互保真、视野外演化、认知演化。", "tags": ["agent玩家", "任务达成率", "视野外演化"], "explain": "想象你让机器人在虚拟小镇里找到钥匙，再用它打开房门。若只检查它能否照着固定动作走，世界模型可能看似合格，却经不起绕路、转身和等待。PlayWorld要解决的正是这种评测失真：它让多模态智能体，也就是能理解图像并采取行动的程序，带着长程目标在模型生成的世界里探索，以任务是否达成取代固定动作序列。基准包含171个场景，评估9个世界模型的几何一致性、交互保真度、视野外演化和认知演化。四个维度分别检查空间是否稳定、动作是否有效、看不见的地方是否合理变化，以及智能体能否据此更新理解。因为玩家会主动探索并追踪目标，这种评测更能检验模型能否支撑持续行动，而非只生成一段好看的画面。", "key_numbers": ["171 场景", "9个世界模型", "4个核心维度"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.13552", "https://github.com/kxding/PlayWorld"], "note": "信号是\"能不能被一个会规划的策略玩到目标\"，把固定动作打分的可比性问题绕开了；结论是长程目标下空间一致与状态持续最不可靠。", "parent": null, "link_strength": "", "key": false, "x": 2680, "y": 5846, "sx": null}, {"id": "mist", "title": "Execution Before Memory: Diagnosing Memory Failures in Video World Models (MIST)", "date": "2026-10-16", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.23542", "venue": "", "training": "不适用", "status": "速读", "one_liner": "把\"没执行改变\"与\"忘了\"分开诊断", "mechanism": "先让模型在改变被隐藏时布景，之后再要求显形，并卡住提前泄漏；这样低分能定位成\"没执行指令\"而非\"遗忘\"，再用M3-Agent递归改写指令做对照实验。", "tags": ["执行与记忆解耦", "泄漏控制", "诊断型基准"], "explain": "想象让模型拍一段房间视频：先把红球换成蓝球，最后再让蓝球出现。若结果里没有蓝球，模型可能是忘了，也可能压根没照做；只看成片，难以分清。MIST是一套诊断测试：先要求模型布置场景，却暂时隐藏改变，之后再要求它让改变显形，并阻止它提前露出变化。这样，失败就能更明确地归因于没执行指令，而非遗忘。研究还用M3-Agent——会递归改写指令的智能体——做对照，检验模型是否真能完成改变。结果显示，MIST显形分数提升三倍以上，WRBench T提升26.1%，MBench-T U提升52.7%。", "key_numbers": ["MIST显形分×3以上", "WRBench T +26.1%", "MBench-T U +52.7%"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.23542"], "note": "它同时提出基准与 M3-Agent 方法，引用时要分开；最大贡献是指出很多\"记忆差\"其实是\"指令没执行\"，旧基准的单一分数会误诊。", "parent": null, "link_strength": "", "key": false, "x": 2954, "y": 6074, "sx": null}, {"id": "worldoracle", "title": "WorldOracle: Benchmarking Action-Conditioned World Models against Real-World Executions", "date": "2026-10-13", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.18826", "venue": "", "training": "不适用", "status": "速读", "one_liner": "同动作配对真机执行，考动作条件模型", "mechanism": "给同一初始观测与同一低层动作序列，比对预测rollout与真机记录，从物理状态正确性、交互空间对齐、关键交互区保真、多视角动作一致性四维评。", "tags": ["真机配对", "动作条件", "操作任务"], "explain": "想象机器人把杯子推向桌边：模型说杯子会滑落，真机却停住了。单看生成视频，很难判断预测是否可信。世界预言机要解决的，正是动作条件世界模型——输入动作、预测后续画面的模型——缺少可靠实测标准的问题。研究者让模型和机器人从同一初始观测出发，执行相同的低层动作序列，再把预测过程与真机录像对照。测试覆盖七个模型，也保留失败执行片段；评估看四件事：物理状态是否正确、交互位置是否对齐、关键接触区域是否保真，以及不同视角下动作是否一致。起点和动作相同，能减少比较中的干扰，让结果更能反映模型预测能力；纳入失败片段，也能检验模型是否呈现真实意外，而不只是生成好看的成功画面。", "key_numbers": ["7个ACWM", "4个评测维度", "含失败执行段"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.18826"], "note": "信号是\"同一动作在真机上会发生什么\"，是少数用真机配对而非仿真当参照的基准；数据集与榜单已放。", "parent": null, "link_strength": "", "key": false, "x": 2954, "y": 5846, "sx": null}, {"id": "pvbench", "title": "PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level Measurements", "date": "2026-10-19", "precision": "day", "lane": "评测基准", "branch": "", "arxiv": "2610.26711", "venue": "", "training": "不适用", "status": "速读", "one_liner": "用物体级6D位姿与守恒残差量化物理", "mechanism": "七个域共46维、600条提示（30%含机械臂/人形/四足/多智能体），可测维度各配专用视觉模型，算出物体6D位姿、米制尺度、法线、运动学与守恒律残差。", "tags": ["物体级测量", "守恒残差", "46维指标"], "explain": "想象视频里一个杯子被推下桌：它可能看起来很真实，却在落地后穿过地板，或大小忽然改变。只凭观感打分，很难准确抓出这类物理破绽。PVBench把检查落到物体上：6D位姿就是物体在三维空间的位置和朝向；再测米制尺度、表面法线和运动学，并计算守恒律残差 const svg = document.getElementById("svg"), vp = document.getElementById("vp"),
  stage = document.getElementById("stage"), panel = document.getElementById("panel");
let scale = 1, tx = 0, ty = 0, anim = 0;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), cs = s => clamp(s, .12, 3);
const PANEL_W = () => panel.classList.contains("open") ? panel.offsetWidth : 0;
const byId = {}, cards = {}, links = {}, kids = {}, stickies = [];
DATA.nodes.forEach(n => {
  byId[n.id] = n;
  n.hay = [n.title, n.mechanism, n.one_liner, n.lane, n.branch, (n.tags||[]).join(" "), n.explain].join(" ").toLowerCase();
});
DATA.nodes.forEach(n => { if(n.parent && byId[n.parent]) (kids[n.parent] = kids[n.parent] || []).push(n.id); });

function el(tag, attrs, parent){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const [k,v] of Object.entries(attrs || {})) if(v != null) n.setAttribute(k, v);
  (parent || vp).appendChild(n); return n;
}

/* ---------- 相机 ---------- */
function apply(){
  const w = svg.clientWidth, h = svg.clientHeight, m = 120;
  tx = clamp(tx, m - DATA.width*scale, Math.max(24, (w - DATA.width*scale)/2)); ty = clamp(ty, m - DATA.height*scale, Math.max(14, (h - DATA.height*scale)/2));
  vp.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
  stick(); drawMini();
}
function flyTo(ns, ntx, nty, dur){
  cancelAnimationFrame(anim);
  const s0 = scale, x0 = tx, y0 = ty, t0 = performance.now(); dur = dur || 560;
  (function step(now){
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - k, 3);
    scale = s0 + (ns - s0)*e; tx = x0 + (ntx - x0)*e; ty = y0 + (nty - y0)*e; apply();
    if(k < 1) anim = requestAnimationFrame(step);
  })(t0);
}
function zoomAt(mx, my, ns){ ns = cs(ns); tx = mx - (mx - tx)*(ns/scale); ty = my - (my - ty)*(ns/scale); scale = ns; apply(); }
function zoomBtn(k){ cancelAnimationFrame(anim); const w = svg.clientWidth - PANEL_W(); zoomAt(w/2, svg.clientHeight/2, scale*k); }
function fitAll(){
  const w = svg.clientWidth, h = svg.clientHeight, s = Math.min((w-60)/DATA.width, (h-40)/DATA.height, 1.2);
  flyTo(s, Math.max(16, (w - DATA.width*s)/2), 14);
}
function resetView(now){ const i = DATA.init; now ? (scale = i.scale, tx = i.tx, ty = i.ty, apply()) : flyTo(i.scale, i.tx, i.ty); }
function focusNode(n){
  const w = svg.clientWidth - PANEL_W(), h = svg.clientHeight, ns = cs(Math.max(scale, .85));
  const cx = (DATA.labelW*ns + w)/2;   // 让出左侧固定标签列
  flyTo(ns, cx - (n.x + DATA.card.w/2)*ns, h/2 - (n.y + DATA.card.h/2)*ns);
}
function focusLane(l){
  const w = svg.clientWidth - PANEL_W(), h = svg.clientHeight;
  const s = cs(Math.min((w-50)/(DATA.labelW + l.plotW + 32), (h-40)/(l.height+20), 1));
  flyTo(s, 20 - 8*s, 20 - (l.top - 10)*s);
}

/* ---------- 吸附标签：随镜头滑进可视区 ---------- */
function mkSticky(parent, kind, lane, extra){
  const g = el("g", {class:"stk"}, parent);
  return {g, kind, lane, ...extra};
}
function finishSticky(s){
  const bb = s.g.getBBox(); s.bb = bb;
  el("rect", {class:"lbg", x:bb.x-9, y:bb.y-5, width:bb.width+18, height:bb.height+10, rx:10}, s.g);
  s.g.insertBefore(s.g.lastChild, s.g.firstChild);
  stickies.push(s);
}
function stick(){
  const L = -tx/scale, T = -ty/scale, px = 16/scale, py = 14/scale, laneX = {};
  for(const s of stickies){
    const l = s.lane, R = DATA.labelW + l.plotW + 32 - 10, B = l.top + l.height - 10, bb = s.bb;
    let dx = 0, dy = 0, anchor = L + px;
    if(s.kind === "year") anchor = Math.max(anchor, laneX[l.name] + DATA.labelW - 36);
    dx = clamp(anchor - bb.x, 0, Math.max(0, (s.right || R) - (bb.x + bb.width) ));
    if(s.kind !== "branch") dy = clamp(T + py - bb.y, 0, Math.max(0, B - (bb.y + bb.height)));
    if(s.kind === "lane") { laneX[l.name] = bb.x + dx; l.dy = dy; }
    if(s.kind === "year") dy = l.dy || 0;
    s.g.setAttribute("transform", `translate(${dx},${dy})`);
    s.g.classList.toggle("stuck", dx > 1 || dy > 1);
  }
}

function build(){
  const laneColor = {}; DATA.lanes.forEach(l => laneColor[l.name] = l.color);
  DATA.lanes.forEach((l, li) => {
    el("rect", {class:"lane-box", x:8, y:l.top-10, width:DATA.labelW + l.plotW + 24, height:l.height+8, rx:20,
      fill: li % 2 ? "var(--band-b)" : "var(--band-a)"});
    el("rect", {x:9, y:l.top-6, width:5, height:l.height-4, rx:2.5, fill:l.color, opacity:.9});
    l.years.forEach(y => el("line", {class:"year-sep", x1:y.x, y1:l.top-2, x2:y.x, y2:l.top+l.height-6}));
    l.branches.forEach(b => {
      const baseY = b.y + DATA.card.h + 16;
      el("line", {class:"axis-line", x1:DATA.labelW-14, y1:baseY, x2:DATA.labelW + l.plotW - 10, y2:baseY});
    });
  });
  DATA.nodes.forEach(n => {
    if(n.sx == null) return;
    const x1 = n.sx, y1 = n.sy, x2 = n.x, y2 = n.y + DATA.card.h/2, mid = (x1 + x2)/2;
    const path = el("path", {d:`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`, class: n.cross ? "link cross" : "link"});
    const dot = el("circle", {cx:x1, cy:y1, r:2.6, class:"link-dot"});
    links[n.id] = {path, dot};
    links[n.id].show = v => { path.style.display = dot.style.display = v ? "" : "none"; };
  });
  DATA.nodes.forEach(n => {
    const g = el("g", {class:"card", "data-id":n.id, transform:`translate(${n.x},${n.y})`}); cards[n.id] = g;
    el("title", {}, g).textContent = n.one_liner || n.title;
    el("rect", {class:"bg", width:DATA.card.w, height:DATA.card.h, rx:16}, g);
    if(n.key) el("rect", {class:"keyring", x:-4, y:-4, width:DATA.card.w+8, height:DATA.card.h+8, rx:19,
      fill:"none", stroke:laneColor[n.lane] || "#333", "stroke-width":2.4}, g);
    el("rect", {class:"stripe", width:5, height:DATA.card.h-16, x:1.5, y:8, fill:laneColor[n.lane] || "#888", rx:2.5, opacity:.9}, g);
    const FREE = {"免训":"免训", "推理期技巧":"推理期"};
    const tagList = (FREE[n.training] ? [{t:FREE[n.training], free:true}] : []).concat((n.tags || []).map(t => ({t, free:false})));
    let xRight = DATA.card.w - 10;
    tagList.slice(0, 3).forEach(o => {
      const w = o.t.length*10.5 + 12; if(xRight - w < 12) return;
      el("rect", {x:xRight-w, y:9, width:w, height:17, rx:8, fill:o.free ? "#0E9F6E" : (laneColor[n.lane] || "#6b7280"), opacity:o.free ? 1 : .12}, g);
      el("text", {x:xRight-w+6, y:21.5, class:"tag-t", fill:o.free ? "#fff" : (laneColor[n.lane] || "#6b7280")}, g).textContent = o.t;
      xRight -= w + 5;
    });
    const t1 = el("text", {class:"t-title", x:15, y:50}, g); t1.textContent = n.title;
    while(t1.textContent.length > 4 && t1.getComputedTextLength() > DATA.card.w - 24) t1.textContent = t1.textContent.slice(0, -2) + "…";
    el("text", {class:"t-date", x:15, y:DATA.card.h-14}, g).textContent =
      n.date.slice(0, 7) + (n.precision === "month" || n.precision === "unknown" ? "" : "-" + n.date.slice(8, 10));
    g.addEventListener("click", ev => { ev.stopPropagation(); if(moved < 6) openPanel(n); });
    g.addEventListener("mouseenter", () => { hoverId = n.id; refresh(); });
    g.addEventListener("mouseleave", () => { hoverId = null; refresh(); });
  });
  // 标签层放最上面，吸附时才不会被卡片盖住
  const lab = el("g", {id:"labels"});
  DATA.lanes.forEach(l => {
    const s = mkSticky(lab, "lane", l);
    el("text", {class:"lane-name", x:26, y:l.top+16, fill:l.color}, s.g).textContent = l.name;
    el("text", {class:"lane-count", x:26, y:l.top+34}, s.g).textContent = l.count + " 篇";
    finishSticky(s);
    l.branches.forEach(b => { if(!b.name) return;
      const t = mkSticky(lab, "branch", l);
      el("circle", {cx:30, cy:b.y+30, r:3.4, fill:l.color, opacity:.75}, t.g);
      el("text", {class:"branch", x:40, y:b.y+34}, t.g).textContent = b.name;
      finishSticky(t);
    });
    l.years.forEach((y, i) => {
      const t = mkSticky(lab, "year", l, {right: (l.years[i+1] ? l.years[i+1].x : DATA.labelW + l.plotW + 22) - 8});
      el("text", {class:"year-label", x:y.x+6, y:l.top+16, fill:l.color}, t.g).textContent = y.label;
      finishSticky(t);
    });
  });
}

/* ---------- 状态：高亮脉络 / 搜索 / 图例 / 播放 ---------- */
let activeId = null, hoverId = null, q = "", reveal = null; const hidden = new Set();
function related(id){
  const s = new Set([id]); let c = id;
  while(byId[c] && byId[c].parent && byId[byId[c].parent]){ c = byId[c].parent; s.add(c); }
  const st = [id]; while(st.length){ (kids[st.pop()] || []).forEach(k => { s.add(k); st.push(k); }); }
  return s;
}
function refresh(){
  const f = reveal ? null : (hoverId || activeId), rel = f ? related(f) : null; let hit = 0;
  DATA.nodes.forEach(n => {
    const c = cards[n.id], hide = hidden.has(n.lane), match = !q || n.hay.includes(q);
    c.style.display = hide ? "none" : ""; if(match && !hide) hit++;
    c.classList.toggle("dim", !match);
    c.classList.toggle("faint", !!rel && !rel.has(n.id));
    c.classList.toggle("future", !!reveal && !reveal.has(n.id));
    c.classList.toggle("active", n.id === activeId);
    const lk = links[n.id]; if(!lk) return;
    const p = byId[n.parent], gone = hide || hidden.has(p.lane) || (reveal && !(reveal.has(n.id) && reveal.has(p.id)));
    lk.show(!gone);
    const on = !!rel && rel.has(n.id) && rel.has(p.id);
    lk.path.classList.toggle("on", on);
    lk.path.classList.toggle("faint", (!!rel && !on) || (!!q && !(match && p.hay.includes(q))));
  });
  document.getElementById("qc").textContent = q ? hit + " 篇匹配" : "";
}
function setActive(n){
  activeId = n ? n.id : null; refresh();
  try{ history.replaceState(null, "", n ? "#" + n.id : location.pathname + location.search); }catch(e){}
}
function closePanel(){ panel.classList.remove("open"); document.body.classList.remove("panel-open"); setActive(null); }
function openPanel(n){
  setActive(n);
  panel.querySelector("#phead .t").textContent = n.title;
  const meta = [n.date, n.precision === "month" ? "日期只到月" : "", n.training, n.status, n.lane + " / " + (n.branch || "主支")]
    .filter(Boolean).join(" · ");
  panel.querySelector("#phead .m").textContent = meta;

  const b = document.getElementById("pbody");
  b.innerHTML = "";
  const add = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; b.appendChild(d); };
  if(n.explain){
    const btn = document.createElement("button");
    btn.className = "xbtn";
    btn.textContent = "▶ 直白讲解";
    const box = document.createElement("div");
    box.className = "explain";
    box.textContent = n.explain;
    box.style.display = "none";
    btn.onclick = () => {
      const open = box.style.display !== "none";
      box.style.display = open ? "none" : "block";
      btn.textContent = open ? "▶ 直白讲解" : "▼ 收起讲解";
    };
    b.appendChild(btn);
    b.appendChild(box);
  }
  if(n.one_liner){ add("lab", "一句话"); add("p", n.one_liner); }
  if(n.mechanism){ add("lab", "机制"); add("p", n.mechanism); }
  if(n.key_numbers && n.key_numbers.length){
    add("lab", "关键数字");
    const c = document.createElement("div"); c.className = "chips";
    n.key_numbers.forEach(k => { const s = document.createElement("span"); s.className = "chip"; s.textContent = k; c.appendChild(s); });
    b.appendChild(c);
  }
  if(n.self_measured && n.self_measured.length){
    add("lab", "我们自测（非论文指标）");
    const c = document.createElement("div"); c.className = "chips";
    n.self_measured.forEach(k => { const s = document.createElement("span"); s.className = "chip self"; s.textContent = k; c.appendChild(s); });
    b.appendChild(c);
  }
  if(n.media && n.media.length){
    add("lab", "素材");
    n.media.forEach(m => {
      const src = DATA.prefix + m;
      if(/\.(mp4|webm|mov)$/i.test(m)){
        const v = document.createElement("video");
        v.src = src; v.controls = true; v.muted = true; v.playsInline = true; v.preload = "metadata";
        b.appendChild(v);
      } else {
        const img = document.createElement("img"); img.src = src; img.loading = "lazy";
        b.appendChild(img);
      }
    });
  }
  if(n.links && n.links.length){
    add("lab", "链接");
    n.links.forEach(u => { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.textContent = u; b.appendChild(a); b.appendChild(document.createElement("br")); });
  }
  if(n.note){ add("lab", "备注"); add("p", n.note); }
  panel.classList.add("open"); document.body.classList.add("panel-open"); focusNode(n); b.scrollTop = 0;
}

document.getElementById("pclose").onclick = closePanel;

/* ---------- 输入：拖拽 / 双指缩放 / 滚轮 ---------- */
const ptrs = new Map(); let moved = 0, pinch0 = null;
svg.addEventListener("pointerdown", ev => {
  if(ev.pointerType === "mouse" && ev.button !== 0) return;
  cancelAnimationFrame(anim); ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if(ptrs.size === 1) moved = 0;
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = {d:Math.hypot(a.x-b.x, a.y-b.y), s:scale}; }
  stage.classList.add("drag");
});
window.addEventListener("pointermove", ev => {
  const p = ptrs.get(ev.pointerId); if(!p) return;
  const dx = ev.clientX - p.x, dy = ev.clientY - p.y; p.x = ev.clientX; p.y = ev.clientY;
  if(ptrs.size === 1){ moved += Math.abs(dx) + Math.abs(dy); tx += dx; ty += dy; apply(); }
  else if(pinch0){
    const [a, b] = [...ptrs.values()], r = svg.getBoundingClientRect(); moved = 99;
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, pinch0.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch0.d);
  }
});
const endPtr = ev => { ptrs.delete(ev.pointerId); if(ptrs.size < 2) pinch0 = null; if(!ptrs.size) stage.classList.remove("drag"); };
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
svg.addEventListener("click", ev => { if(!ev.target.closest(".card") && moved < 6 && panel.classList.contains("open")) closePanel(); });
svg.addEventListener("wheel", ev => {
  ev.preventDefault(); cancelAnimationFrame(anim);
  if(ev.ctrlKey || ev.metaKey){            // 触控板捏合 / Ctrl+滚轮 = 缩放
    const r = svg.getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, scale * Math.exp(-ev.deltaY * (Math.abs(ev.deltaY) > 40 ? .0016 : .01)));
  } else {                                  // 普通滚轮 / 双指滑动 = 平移
    const sw = ev.shiftKey && !ev.deltaX; tx -= sw ? ev.deltaY : ev.deltaX; ty -= sw ? 0 : ev.deltaY; apply();
  }
}, {passive:false});
svg.addEventListener("dblclick", ev => { if(!ev.target.closest(".card")) fitAll(); });
zin.onclick = () => zoomBtn(1.25); zout.onclick = () => zoomBtn(1/1.25);
zreset.onclick = () => resetView(); zfit.onclick = fitAll;

/* ---------- 搜索 / 图例 / 键盘 ---------- */
const qi = document.getElementById("q");
qi.addEventListener("input", () => { q = qi.value.trim().toLowerCase(); refresh(); });
qi.addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ const n = DATA.nodes.find(x => !hidden.has(x.lane) && (!q || x.hay.includes(q))); if(n) { setActive(n); focusNode(n); } }
  if(ev.key === "Escape"){ qi.value = ""; q = ""; refresh(); qi.blur(); }
});
const legend = document.getElementById("legend"), hd = document.createElement("div"), rows = document.createElement("div");
hd.className = "hd"; hd.innerHTML = "路线导航 <span>−</span>"; legend.append(hd, rows);
hd.onclick = () => { const c = rows.style.display === "none"; rows.style.display = c ? "" : "none"; hd.lastChild.textContent = c ? "−" : "+"; };
DATA.lanes.forEach(l => {
  const row = document.createElement("div"); row.className = "row"; row.title = "点名称飞到该路线；点圆点显示/隐藏";
  row.innerHTML = `<i style="background:${l.color}"></i><span>${l.name}</span><span class="n">${l.count}</span>`;
  row.querySelector("i").onclick = ev => { ev.stopPropagation();
    hidden.has(l.name) ? hidden.delete(l.name) : hidden.add(l.name); row.classList.toggle("off", hidden.has(l.name)); refresh(); };
  row.onclick = () => { hidden.delete(l.name); row.classList.remove("off"); refresh(); focusLane(l); };
  rows.appendChild(row);
});
const laneOrder = n => DATA.nodes.filter(x => x.lane === n.lane).sort((a, b) => a.date.localeCompare(b.date));
window.addEventListener("keydown", ev => {
  if(ev.target.tagName === "INPUT") return;
  if(ev.key === "/"){ ev.preventDefault(); qi.focus(); }
  else if(ev.key === "Escape"){ timer ? stopPlay() : closePanel(); }
  else if((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && activeId){
    const l = laneOrder(byId[activeId]), i = l.findIndex(x => x.id === activeId) + (ev.key === "ArrowRight" ? 1 : -1);
    if(l[i]){ ev.preventDefault(); openPanel(l[i]); }
  }
});

/* ---------- 缩略导航 ---------- */
const mini = document.getElementById("mini"), MW = 150, MH = Math.round(MW * DATA.height / DATA.width);
const msvg = el("svg", {viewBox:`0 0 ${DATA.width} ${DATA.height}`, width:MW, height:MH}, mini);
DATA.lanes.forEach(l => el("rect", {x:8, y:l.top-10, width:DATA.labelW + l.plotW + 24, height:l.height+8, fill:l.color, opacity:.14, rx:30}, msvg));
DATA.nodes.forEach(n => el("rect", {x:n.x, y:n.y, width:DATA.card.w, height:DATA.card.h, fill:(DATA.lanes.find(l => l.name === n.lane) || {}).color, opacity:.8, rx:14}, msvg));
const vr = el("rect", {class:"vr", rx:10}, msvg);
function drawMini(){
  const w = svg.clientWidth, h = svg.clientHeight;
  vr.setAttribute("x", -tx/scale); vr.setAttribute("y", -ty/scale); vr.setAttribute("width", w/scale); vr.setAttribute("height", h/scale);
}
let mdrag = false;
const miniGo = ev => { const r = msvg.getBoundingClientRect(), w = svg.clientWidth - PANEL_W();
  tx = w/2 - (ev.clientX - r.left)/r.width*DATA.width*scale; ty = svg.clientHeight/2 - (ev.clientY - r.top)/r.height*DATA.height*scale; apply(); };
mini.addEventListener("pointerdown", ev => { cancelAnimationFrame(anim); mdrag = true; miniGo(ev); ev.stopPropagation(); });
window.addEventListener("pointermove", ev => { if(mdrag) miniGo(ev); });
window.addEventListener("pointerup", () => mdrag = false);

/* ---------- 按时间播放：镜头跟随、逐个亮起 ---------- */
let timer = null; const playBtn = document.getElementById("play"), toast = document.getElementById("toast");
function stopPlay(){ clearInterval(timer); timer = null; reveal = null; playBtn.textContent = "按时间播放"; toast.classList.remove("on"); refresh(); }
playBtn.onclick = () => {
  if(timer){ stopPlay(); return; }
  const order = DATA.nodes.filter(n => !hidden.has(n.lane)).sort((a, b) => a.date.localeCompare(b.date));
  closePanel(); reveal = new Set(); playBtn.textContent = "■ 停止"; let i = 0;
  const step = () => {
    if(i >= order.length){ const last = order[order.length-1]; stopPlay(); setActive(last); return; }
    const n = order[i++]; reveal.add(n.id); setActive(n); focusNode(n);
    toast.textContent = `${n.date.slice(0, 7)} · ${n.title}　${i}/${order.length}`; toast.classList.add("on");
  };
  step(); timer = setInterval(step, 1300);
};

build(); resetView(true); refresh();
const h0 = decodeURIComponent(location.hash.slice(1));
if(byId[h0]) setTimeout(() => openPanel(byId[h0]), 60);
</script>
