姿，也就是相机的位置与朝向；动作标签则被简化成三种状态，减少位姿噪声带来的误导。这样，模型能省下记忆空间，又不必依赖不可靠的坐标。再用包含密集重访的30分钟数据微调，让模型练习回到旧场景、接上先前经历，最终把生成延伸到1000帧以上。", "key_numbers": ["1000+ 帧", "30 分钟重访微调集"], "self_measured": [], "media": ["https://rq-wu.github.io/projects/infinite-world/assets/videos/teaser.mp4", "https://rq-wu.github.io/projects/infinite-world/assets/videos/82_A_street_in_a_fantasy_city_whe_button.mp4"], "links": ["https://arxiv.org/abs/2602.02393"], "note": "明确回避显式几何先验（真实视频位姿噪声大），用固定预算压缩替代 3D 库，是容量管理分支的强基线。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 3018, "sx": null}, {"id": "decmem", "title": "DecMem", "date": "2026-05-29", "precision": "day", "lane": "几何位姿寻址", "branch": "容量管理", "arxiv": "2605.31336", "venue": "", "training": "训练", "status": "速读", "one_liner": "稀疏全局+锚定局部解耦记忆", "mechanism": "指出朴素可学习记忆的两病（算力、注意力弥散），拆成稀疏全局记忆做细粒度历史访问与锚定局部记忆稳外推，超显式 3D 与粗帧级隐式两类基线。", "detail": {"position": "本文针对长时程视频生成中细粒度时空一致性难以维持的问题，提出 DecMem，以支持分钟级、可控且一致的世界生成。", "io": "输入为用于生成的历史视频信息及控制条件，具体输入形式和条件信号类型摘要未给出；输出为具有长时程时空一致性的视频。", "steps": ["分析朴素可学习记忆在长时程外推中的计算低效与注意力弥散问题，为记忆结构解耦提供依据。", "构建 Sparse Global Memory，以稀疏方式访问全局历史，兼顾历史信息的细粒度检索与计算效率。", "构建 Anchored Local Memory，通过锚定局部记忆稳定外推并维持生成质量。", "在视频生成中结合两类记忆，以支持长时程的可控生成与时空一致性。"], "formulas": [{"tex": "\\operatorname{SGM}(q_t)=\\sum_{i\\in\\operatorname{TopK}(s_{t,i})}\\frac{\\exp(s_{t,i})}{\\sum_{j\\in\\operatorname{TopK}(s_{t,j})}\\exp(s_{t,j})}\\,v_i,\\qquad s_{t,i}=\\frac{q_t^{\\top}k_i}{\\sqrt{d}}", "caption": "稀疏全局记忆的 Top-K 检索与注意力聚合；标准写法，非原文"}, {"tex": "\\operatorname{ALM}(q_t)=\\operatorname{Attn}\\!\\left(q_t,\\,[K_{a};K_{t-w:t-1}],\\,[V_{a};V_{t-w:t-1}]\\right)", "caption": "锚定局部记忆结合锚点与近期窗口进行局部注意力；标准写法，非原文"}], "train": "摘要未给出训练流程、推理流程及关键设置。", "diff": "DecMem 将记忆解耦为 Sparse Global Memory 和 Anchored Local Memory，分别面向高效访问全局历史与稳定高质量外推。相较显式 3D 记忆和粗帧级隐式建模，也针对朴素可学习记忆的计算低效与注意力弥散进行设计。", "limits": "摘要未见明确说明 DecMem 的代价与局限。", "has_abstract": true}, "tags": ["解耦记忆", "注意力弥散", "稀疏全局"], "explain": "想象模型要续写一段几分钟的视频：既得翻遍漫长历史找细节，又不能让旧信息挤成一团，导致未来画面漂移。朴素的可学习记忆把两件事都压在一起，既耗算力，也容易让注意力分散。DecMem把记忆拆成两种：稀疏全局记忆像索引，按需访问细粒度历史；锚定局部记忆像眼前的参照物，稳住后续画面的外推。两者分工后，模型既能回看关键细节，又不丢当前变化的方向，因此更适合生成分钟级长视频。论文还在两类基线上验证：直接表示三维场景的显式方法，以及用粗略帧级特征记忆的隐式方法。", "key_numbers": ["分钟级长视频"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.31336", "https://jeffreyyzh.github.io/DecMem-Page"], "note": "其\"注意力弥散\"分析可直接引用来论证为何纯注意力式历史路由在长程会退化。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 3018, "sx": null}, {"id": "memory-forcing", "title": "Memory Forcing", "date": "2025-10-03", "precision": "day", "lane": "几何位姿寻址", "branch": "容量管理", "arxiv": "2510.03198", "venue": "", "training": "训练", "status": "速读", "one_liner": "几何索引空间记忆+训练课程", "mechanism": "点→帧检索把当前可见点映射回源帧取历史，增量维护显式 3D cache；混合训练让探索靠时序记忆、重访靠空间记忆，链式前向训练扩大位姿变化。", "detail": {"position": "Memory Forcing 解决自回归视频扩散模型在长序列游戏生成中难以同时保持新场景生成质量与重访区域空间一致性的问题。它通过几何索引的空间记忆及配套训练策略，让模型在探索与重访时利用不同记忆。", "io": "输入包括当前可见内容与历史信息，历史信息可来自有限上下文中的时序记忆和几何索引的空间记忆；输出为自回归生成的视频内容。具体控制信号及其表示方式摘要未给。", "steps": ["从生成过程中的观测增量构建并更新显式 3D cache，为后续重访提供空间信息。", "将当前可见点映射到其源帧，并检索对应历史帧，使模型能获取与当前视野相关的记忆。", "通过 Hybrid Training 设置探索和重访等不同 gameplay regimes，引导模型探索时依赖时序记忆、重访时结合空间记忆。", "通过 Chained Forward Training 进行模型 rollout，使链式预测产生更大的位姿变化，从而训练模型利用空间记忆维持一致性。", "在自回归生成中结合当前上下文与检索到的空间记忆，并持续更新 3D cache，以支持长序列生成。"], "formulas": [{"tex": "\\mathcal{R}_t=\\operatorname{TopK}_{(\\mathbf{X}_i,\\,f_i)\\in\\mathcal{C}_{t-1}}\\left(-\\lVert\\mathbf{X}_t-\\mathbf{X}_i\\rVert_2^2\\right),\\qquad \\widetilde{\\mathbf{h}}_t=\\operatorname{Attn}\\!\\left(Q(\\mathbf{h}_t),K(\\mathcal{R}_t),V(\\mathcal{R}_t)\\right)", "caption": "根据当前可见 3D 点从显式空间记忆中检索相关源帧，并通过注意力聚合历史记忆；标准写法，非原文"}, {"tex": "\\mathcal{C}_t=\\mathcal{C}_{t-1}\\cup\\left\\{\\left(\\mathbf{X}_{t,k},\\,f_t,\\,\\mathbf{z}_{t,k}\\right)\\right\\}_{k\\in\\mathcal{V}_t},\\qquad \\mathbf{X}_{t,k}=\\Pi^{-1}\\!\\left(\\mathbf{u}_{t,k},d_{t,k};\\,\\mathbf{T}_t\\right)", "caption": "由当前观测的增量深度与位姿反投影得到世界坐标，并持续更新显式 3D cache；标准写法，非原文"}], "train": "训练包括 Hybrid Training 和 Chained Forward Training：前者让模型适应探索与重访时不同的记忆使用方式，后者将模型 rollout 接入自回归训练，并利用链式预测形成更大的位姿变化。推理时通过 Point-to-Frame Retrieval 检索历史，并通过 Incremental 3D Reconstruction 维护和更新显式 3D cache。具体损失函数、训练数据、超参数及推理设置摘要未给。", "diff": "相较于仅依赖时序记忆的方法，Memory Forcing 使用几何索引的空间记忆增强重访时的一致性；相较于直接加入空间记忆的做法，它通过 Hybrid Training 区分探索与重访，并用 Chained Forward Training 鼓励模型在位姿变化时有效利用空间记忆。", "limits": "摘要指出空间记忆可能使模型过度依赖不足的空间上下文，从而损害新场景生成质量；Hybrid Training 用于应对这一权衡。具体计算开销、适用边界及其他局限未见明确说明。", "has_abstract": true}, "tags": ["点帧检索", "3D缓存", "训练课程"], "explain": "想象你在 Minecraft 里绕过一座山，又从另一侧走回村庄：如果模型忘了先前看见的房屋位置，重访时画面就可能对不上。Memory Forcing要解决的正是长视频生成中的空间遗忘，让世界在探索和回头时保持连贯。它把看见过的场景存进可增量更新的三维记忆库；几何索引就是按空间位置查找记忆。当前画面中的点能映射回它曾出现的源帧，模型便可取回那段历史。训练时，探索阶段主要依靠连续画面记忆，重访阶段则练习调用空间记忆；链式前向训练还逐步拉大视角变化。这样模型既能接续眼前运动，也能认出旧地方。论文在 Minecraft 场景中测试，摘要未给出帧数。", "key_numbers": ["Minecraft 场景", "摘要未给帧数"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2510.03198"], "note": "少见的\"训练课程 + 记忆分工\"设计，解释了空间记忆在探索段反而拖累生成质量这一现象，对我们做混合策略有参考。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 3018, "sx": null}, {"id": "longlive-rag", "title": "LongLive-RAG", "date": "2026-07-01", "precision": "month", "lane": "内容学习寻址", "branch": "外部检索库", "arxiv": "2606.02553", "venue": "", "training": "需训", "status": "精读", "one_liner": "历史画面进外部库，按内容而非时空检索", "mechanism": "历史画面写进外部库，用内容检索；WTD 损失让检索器认变化不认长相，同物异貌算同一件、异貌相似物要区分。", "detail": {"position": "LongLive-RAG 解决自回归视频扩散进行长视频生成时，滑动窗口中的误差会沿生成轨迹累积并导致身份漂移的问题。它将已生成的 latent 历史作为可检索记忆，让生成过程能够利用非局部上下文。", "io": "输入是当前生成块的 query embedding 和此前生成的 latent 历史，输出是自回归生成的后续视频块。生成块以检索到的相关历史 latent 作为条件信号，而不只依赖最近窗口。", "steps": ["将此前生成的 latent 写入动态历史库，以便后续生成能够访问已离开当前窗口的内容。", "为当前待生成块构造 query embedding，并在历史库中按内容检索相关 latent，以获得非局部上下文。", "将检索到的历史 latent 用作当前块生成的条件，降低对可能已累积误差的近期窗口的单一依赖。", "训练检索表征时使用 Window Temporal Delta Loss，抑制局部冗余相似性并鼓励 embedding 捕捉有意义的时间变化。"], "formulas": [{"tex": "\\mathcal{I}_t=\\operatorname{TopK}_{i\\in\\mathcal{M}_t}\\,\\frac{q_t^{\\top}k_i}{\\|q_t\\|\\,\\|k_i\\|}", "caption": "按当前块的 query embedding 与历史库键向量的余弦相似度检索 Top-K 历史 latent；标准写法，非原文"}], "train": "摘要提到使用 Window Temporal Delta Loss 训练检索表征，但未提供训练数据、损失具体形式或关键训练设置。推理时逐块生成，将已生成 latent 保存在动态历史库中，并在每个新块生成前检索相关历史 latent；检索增加的开销相对生成较小。", "diff": "已有方法常用 sliding-window attention，只基于近期窗口继续生成；LongLive-RAG 将自生成 latent 历史变为可按内容检索的记忆，并用检索结果提供非局部上下文。摘要称其为开放式自回归长视频生成中首个将自生成 latent 历史建模为内容寻址检索记忆的方法。", "limits": "检索会带来额外开销，摘要称其相对生成较小，但未给出具体量化。其他局限未见明确说明。", "has_abstract": true}, "tags": ["外部向量库", "内容检索", "WTD判别损失"], "explain": "就像让人回想两分钟前视频里的一把钥匙，时间太久脑子装不下容易忘。这篇论文要解决长视频里久远信息记不住的麻烦，做法是把历史画面实时存入外部库，需要时根据画面内容直接翻找，而不是按时间死板翻看。为了找得准，他们用了一种叫WTD损失的训练规则，用来教模型认本质变化而非表面长相，让换了角度的同一物体被认出、长相接近的不同物体被区分。整个流程在120s长度下额外开销约490毫秒，其中编码约480毫秒、检索仅约10毫秒，高效调出了关键记忆。", "key_numbers": ["120s", "约 490 毫秒（额外开销）", "约 10 毫秒（检索）", "约 480 毫秒（编码）"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.02553"], "note": "只给到月份 2026-07；training=需训指检索器需训练；官方未提供演示片段。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1036, "y": 3940, "sx": null}, {"id": "mosaichunk", "title": "MosaiChunk", "date": "2026-10-01", "precision": "month", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2610.02153", "venue": "", "training": "免训", "status": "精读", "one_liner": "学习路由器挑时空块 KV 拼成马赛克上下文", "mechanism": "历史切成时空小块各留 KV，生成时由轻量路由器判断需要哪几块并拼接；推理主干完全冻结。", "detail": {"position": "MosaiChunk 解决长时程自回归视频生成中，历史内容超出有限上下文后，物体或场景再次出现时细节难以保持的问题。它通过检索历史视觉信息提升重访内容的一致性。", "io": "输入包括当前生成所需的文本提示或相机条件，以及历史时空块保存的 KV；输出是延续生成的视频。生成器利用路由器选出的历史 KV，且推理时生成器保持冻结。", "steps": ["将历史视频划分为空间与时间上的小块并保存各块的 KV，以便后续访问细粒度历史视觉信息。", "轻量路由器根据当前生成需求，从历史块中选择要保留的 KV，并遵守固定的活动记忆预算，以控制可用上下文规模。", "将选中的非连续历史 KV 拼接成时空马赛克上下文，并与当前生成条件一起输入冻结的视频生成器，以延续视频并恢复相关细节。"], "formulas": [{"tex": "\\mathcal{S}_t=\\operatorname{TopK}_{\\mathcal{I}\\subseteq\\{1,\\ldots,N\\},\\,\\sum_{i\\in\\mathcal{I}}c_i\\le B}\\sum_{i\\in\\mathcal{I}}s(q_t,h_i)", "caption": "在固定活动记忆预算下选择历史块；标准写法，非原文"}, {"tex": "(K_t^{\\mathrm{mos}},V_t^{\\mathrm{mos}})=\\operatorname{Concat}_{i\\in\\mathcal{S}_t}(K_i,V_i)", "caption": "将选中的历史块 KV 拼接为时空马赛克上下文；标准写法，非原文"}], "train": "训练时保持视频生成器冻结，仅学习轻量路由器来决定固定活动记忆预算下纳入马赛克的历史区块。推理时选择历史 KV 并拼接后交给冻结生成器；具体训练目标、优化细节及预算数值摘要未给。", "diff": "不同于滑动窗口只保留近期上下文，也不同于整块检索，MosaiChunk 可从不连续的历史时空区块中选择 KV 并组合成马赛克。它不微调生成器，而是学习轻量路由器，并在匹配记忆预算下评估重访一致性。", "limits": "需要保存历史区块的 KV，并进行路由选择与拼接；其具体存储和计算代价、路由器局限及其他限制未见明确说明。", "has_abstract": true}, "tags": ["时空块KV", "学习路由器"], "explain": "就像看监控抓小偷，我们不用把几十个小时的录像全倒进脑子，只要挑出关键的几个画面拼在一起看。这篇论文解决的具体麻烦，正是大模型处理长视频时，保留所有历史会让显存直接撑爆。它用的招数是把历史切成许多时空小块，各自保留KV，也就是模型算好的记忆缓存；生成回答时，由一个轻量路由器，即专门负责筛选的小网络，判断需要哪几块并拼成马赛克上下文。这招管用在于推理主干完全冻结，既不用重新训练也不破坏原有能力，只把最核心的信息精准拼接起来，大幅减轻了显存负担。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.02153"], "note": "training=免训指主干冻结、仅训路由器；矩阵将其放在『几何/位姿』行并标『学习路由』，寻址实际由学习路由器决定，lane 存疑；自带 RememBench 未单列；只给到月份 2026-10。", "parent": "longlive-rag", "link_strength": "dotted", "key": false, "citations": 0, "x": 1584, "y": 3686, "sx": 1284, "sy": 3990.0, "cross": false}, {"id": "smi", "title": "SMI", "date": "2026-10-01", "precision": "month", "lane": "内容学习寻址", "branch": "理解模型管理", "arxiv": "2610.02521", "venue": "", "training": "免训", "status": "精读", "one_liner": "多模态大模型管记忆的增删与检索", "mechanism": "四个原子操作串成管理流程：空间聚类、簇内稀疏化、动作感知检索、可靠性过滤；生成器一行代码不改。", "detail": {"position": "SMI 解决长视频 world model 中记忆序列变长、结构复杂后，长程空间上下文难以管理的问题。它用多模态理解模型系统化管理空间记忆，以提升生成稳定性和空间一致性。", "io": "输入是历史记忆序列及当前用户动作，动作作为检索相关记忆的条件信号。输出是经过管理的记忆，供原有生成器使用；生成器本身无需修改。", "steps": ["按空间关系对记忆进行空间聚类，将相关内容组织成簇，以形成更有结构的空间上下文。", "在每个簇内进行稀疏化，减少冗余记忆，以控制记忆规模。", "依据当前动作进行动作感知检索，选取与后续生成相关的记忆，以保留任务所需上下文。", "进行可靠性过滤，筛除不可靠记忆，以降低其对生成稳定性和空间一致性的影响。"], "formulas": [{"tex": "s(m_i,a_t)=\\operatorname{sim}\\bigl(f_m(m_i),f_a(a_t)\\bigr),\\qquad \\mathcal{M}_t^{\\mathrm{ret}}=\\operatorname{TopK}_{m_i\\in\\mathcal{M}}s(m_i,a_t)", "caption": "动作感知记忆检索的标准写法，非原文"}, {"tex": "\\mathcal{M}_t^{\\mathrm{keep}}=\\{m_i\\in\\mathcal{M}_t^{\\mathrm{ret}}:r(m_i)\\geq\\tau\\}", "caption": "基于可靠性分数阈值过滤记忆的标准写法，非原文"}], "train": "摘要未给出训练流程与关键设置。推理时由多模态理解模型执行记忆管理，再将管理后的记忆交给原有生成器；生成器无需修改。", "diff": "不同于未系统化处理长程空间记忆的做法，SMI 将空间聚类、簇内稀疏化、动作感知检索和可靠性过滤整合为记忆管理流程。它把多模态理解模型用于记忆管理，而不改动生成器。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["四原子操作", "大模型管记忆"], "explain": "想象机器人把沿途拍的照片全塞进抽屉，翻找时不仅头疼还经常拿错。SMI解决的就是多模态大模型面对海量连续画面时，记忆臃肿且难以调用的麻烦。它的做法是完全不改生成器代码，用一套管理流程串联四个原子操作，也就是不可分割的基础动作：按位置归拢画面的空间聚类、同堆剔除重复的簇内稀疏化、结合当前行为翻找的动作感知检索，以及排除杂质的可靠性过滤。它管用是因为从源头挤干了画面水分，找记忆时又有动作意图带路，不用动原模型就能轻松提取干净高效的经验。", "key_numbers": ["四个原子操作"], "self_measured": [], "media": ["https://spatial-memory-intelligence.github.io/assets/teaser.png"], "links": ["https://arxiv.org/abs/2610.02521"], "note": "只给到月份 2026-10；报告提醒每次管理都要调用大模型，开销与延迟高。", "parent": "longlive-rag", "link_strength": "dotted", "key": false, "citations": 0, "x": 1584, "y": 4080, "sx": 1284, "sy": 3990.0, "cross": false}, {"id": "moc", "title": "Mixture of Contexts for Long Video Generation", "date": "2025-08-28", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2508.21058", "venue": "", "training": "需训", "status": "速读", "one_liner": "长视频当内部检索，query自选chunk", "mechanism": "可学稀疏路由：每个query挑少数信息量大的历史chunk，加caption与局部窗必选锚，因果约束禁闭环。", "detail": {"position": "这篇工作将长视频生成中的长期记忆问题重新表述为模型内部的信息检索问题。它提出 Mixture of Contexts，旨在降低长序列 self-attention 的计算与内存开销，同时保留跨长时间范围的身份、动作和场景一致性。", "io": "输入是生成过程中的 query、caption 和可供检索的历史视频上下文，输出是长视频内容。caption 与局部时间窗口作为必选条件信号，query 还会因果地检索少量历史 chunk。", "steps": ["将长视频历史划分为 chunks，使模型能以片段为单位检索远距离上下文，而不必对全部历史执行密集 attention。", "根据每个 query 学习路由并选择少量有信息量的历史 chunks，把计算集中到可能影响当前生成的内容上。", "将 caption 和局部窗口作为必选锚点加入检索结果，以保留文本条件和邻近时间上下文。", "施加因果路由约束，避免检索未来内容或形成 loop closures，从而支持按时间顺序生成。", "随着数据扩展逐步稀疏化路由，使模型在减少计算的同时学习检索显著历史并维持长程一致性。"], "formulas": [{"tex": "\\mathcal{I}(q_t)=\\mathcal{A}_{\\mathrm{cap}}\\cup\\mathcal{A}_{\\mathrm{local}}(t)\\cup\\operatorname{TopK}_{\\,c_i<t}\\left(\\frac{q_t^{\\top}k_i}{\\sqrt{d}}\\right),\\qquad r_{t,i}=\\frac{q_t^{\\top}k_i}{\\sqrt{d}}", "caption": "标准写法，非原文：基于 query–chunk 相似度的稀疏历史检索，并加入 caption、局部窗口锚点及因果约束。"}, {"tex": "o_t=\\operatorname{softmax}\\left(\\frac{q_tK_{\\mathcal{I}(q_t)}^{\\top}}{\\sqrt{d}}\\right)V_{\\mathcal{I}(q_t)}", "caption": "标准写法，非原文：仅在检索到的历史 chunks 与必选锚点上执行注意力聚合，以降低长序列 attention 的计算与内存开销。"}], "train": "训练时扩展数据规模并逐步稀疏化路由。推理时由 query 动态检索少量历史 chunks，并结合 caption 与局部窗口生成；具体训练目标、路由实现细节及推理设置摘要未给。", "diff": "不同于对长序列执行密集 self-attention 的做法，MoC 将上下文访问作为可学习的稀疏检索与路由问题。每个 query 动态选择历史 chunks，同时保留 caption、局部窗口锚点并施加因果约束。", "limits": "摘要指出密集 self-attention 的二次计算成本会使长序列的内存与计算难以承受，但未见明确说明 MoC 的具体适用边界、失败模式或其他局限。", "has_abstract": true}, "tags": ["稀疏路由", "chunk检索", "近线性扩展"], "explain": "想象模型要接着拍一段一分钟的追逐戏：主角的外套、街道布局和动作节奏都得记住，但把前面每一帧都塞回模型，既昂贵又容易被无关画面干扰。它把已经生成的长视频当作内部检索库。当前要生成的内容会形成查询，也就是向历史寻找所需信息的问题；可学习的稀疏路由会为每个查询挑出少数最有用的历史片段。描述全局语义的字幕信息和紧邻当前画面的局部窗口，则被固定为必选锚点，保证人物身份与近处动作不断裂；因果约束还禁止读取未来，避免信息泄漏和循环依赖。这样，模型只看相关记忆而非整段历史，既能维持分钟级视频中的人物、动作和场景一致性，也让计算量随检索规模近似线性增长。", "key_numbers": ["摘要未给具体数值，称可保身份/动作/场景达分钟级", "效率随检索近线性"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2508.21058"], "note": "这条泳道的理论源头之一：把「记忆」重述为 query 到 chunk 的内部检索并让它可学，与 LongLive-RAG 的外部库路线形成对照（MoC 无外部存储、路由在注意力里）。", "parent": null, "link_strength": "", "key": false, "citations": 1, "x": 214, "y": 3686, "sx": null}, {"id": "omnimem", "title": "OmniMem: Scalable and Adaptive Memory Retrieval for Long Video Generation", "date": "2026-05-28", "precision": "day", "lane": "内容学习寻址", "branch": "外部检索库", "arxiv": "2605.30519", "venue": "", "training": "推理期技巧", "status": "速读", "one_liner": "在历史KV上做全范围稀疏检索", "mechanism": "对历史KV做稀疏块检索：自适应窗排除把局部窗剔出候选，query共享选择降开销，各头散取非连续块。", "detail": {"position": "OmniMem 解决长视频自回归生成中历史 KV cache 持续增长、反复访问成本高，以及截断或隐式压缩会丢失与当前查询相关的历史细节的问题。它在完整历史范围内进行稀疏 KV 检索，以保留对相关历史信息的显式访问。", "io": "输入是当前查询以及已生成视频块形成的历史 KV cache，当前查询作为检索信号。输出是供注意力计算使用的稀疏历史 KV 块，并用于后续视频块生成。", "steps": ["根据当前查询确定历史 KV 块的选择，并在可用长程历史足够时排除局部窗口候选，以减少局部偏置并将稀疏预算留给长程信息。", "采用 Query-Shared KV Selection 共享跨查询的选择结果，以降低不同查询选择差异带来的访问开销。", "各注意力头按自身选择模式散取非连续 KV 块，避免将不同头的选择扩展成庞大的统一 KV 缓冲区。", "将检索到的历史 KV 用于当前块的注意力计算，支持自回归视频生成继续扩展。"], "formulas": [{"tex": "\\mathcal{C}_t=\\{b:\\ b\\notin\\mathcal{W}_t\\},\\qquad \\mathcal{S}_t=\\operatorname{TopK}_{b\\in\\mathcal{C}_t}\\,s(Q_t,K_b)", "caption": "自适应排除局部窗口后，按查询与历史 KV 块的相关性选择稀疏历史块；标准写法，非原文"}, {"tex": "\\operatorname{Attn}_h(Q_t)=\\operatorname{softmax}\\!\\left(\\frac{Q_tK_{\\mathcal{S}_t,h}^{\\top}}{\\sqrt{d_h}}\\right)V_{\\mathcal{S}_t,h}", "caption": "各注意力头从选中的非连续历史 KV 块中读取信息并计算当前注意力；标准写法，非原文"}], "train": "摘要未给训练流程或训练设置。推理时对自回归生成过程中累积的历史 KV cache 执行稀疏检索，并将检索结果用于后续视频块生成；关键参数设置摘要未给。", "diff": "相较于截断 KV cache 或将其压缩为隐式记忆，OmniMem 保留对完整历史 KV 的显式稀疏访问。它通过 Adaptive Window Exclusion、Query-Shared KV Selection 和 Per-Head Scattered KV Access 分别应对局部偏置与 Union Explosion。", "limits": "稀疏检索仍需访问历史 KV，具体计算开销及其随视频长度的变化摘要未给；实验称内存使用与基线相当，但未见明确说明其他局限。", "has_abstract": true}, "tags": ["稀疏KV检索", "全范围记忆", "显存可控"], "explain": "想象模型在拍一部长镜头：它既要记住眼前几帧，也要从几分钟前的动作里找回一件道具。视频越长，历史键值缓存（KV，保存过往画面特征的记忆）越大，逐项读取会拖慢生成、占用显存，固定局部窗口又容易漏掉远处线索。OmniMem对全部历史KV做稀疏块检索：先用自适应窗口排除已被局部覆盖的区域，避免重复搜索；再让相近查询共享候选选择，减少计算；最后允许不同注意力头各自抽取不连续的关键块。这样既保留近处细节，又能跳着找远处相关内容，用较少访问换来更长的记忆范围。实验中动态度提升52.3%，显存占用仍与强基线相当，说明它兼顾了长视频生成的效率与连贯性。", "key_numbers": ["动态度 +52.3%", "显存占用与强基线相当"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.30519"], "note": "明确以「截断/隐式压缩都丢失显式可查历史」立论，把历史 KV 当可检索外部库；与 MosaicChunk 的区别是它不重组压缩块，而是保留原始 KV 块做稀疏选择。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 488, "y": 3940, "sx": null}, {"id": "memlearner", "title": "MemLearner: Learning to Query Context memory for Video World Models", "date": "2026-06-30", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2606.31734", "venue": "", "training": "需训", "status": "速读", "one_liner": "用query token学会问上下文", "mechanism": "以query token桥接上下文与待预测token，让生成模型自身视觉先验承担检索；配遮挡/动态数据集。", "detail": {"position": "MemLearner 解决 Video World Models 在长时生成中因缺乏记忆而出现的场景不一致问题，尤其关注场景遮挡和动态物体带来的上下文检索困难。它学习如何查询历史上下文，以改善未来视频预测中的场景记忆。", "io": "输入包括历史视频帧和用户动作等条件信号，模型输出未来视频状态。query token 用于从上下文中提取与预测相关的信息，并桥接上下文 token 与待预测 token。", "steps": ["收集包含场景遮挡和动态物体的长视频数据，并结合相机位姿标注及未标注真实视频进行训练，为学习上下文查询提供数据基础。", "在预测过程中引入 query token，使其面向历史上下文进行查询，以适应场景遮挡和动态变化下的记忆需求。", "利用视频生成模型自身的视觉先验，将查询得到的上下文信息与待预测 token 联系起来，从而生成更一致的未来视频状态。", "采用面向训练和推理的高效策略使用该查询机制，以改善长时生成中的场景一致性和记忆表现。"], "formulas": [{"tex": "A_{q\\leftarrow h}=\\operatorname{softmax}\\!\\left(\\frac{Q_qK_h^{\\top}}{\\sqrt{d}}\\right),\\qquad \\widetilde{H}=A_{q\\leftarrow h}V_h", "caption": "标准写法，非原文：query token 对历史上下文进行注意力检索并聚合记忆信息。"}, {"tex": "\\widehat{Z}=\\operatorname{softmax}\\!\\left(\\frac{Q_zK_{\\widetilde{H}}^{\\top}}{\\sqrt{d}}\\right)V_{\\widetilde{H}}", "caption": "标准写法，非原文：将检索得到的上下文记忆与待预测视频 token 关联，用于生成更一致的未来状态。"}], "train": "训练使用带相机位姿标注的渲染视频与未标注真实世界视频，并采用多数据集训练策略。摘要提到高效训练与推理策略，但未说明具体目标函数、数据规模或实现细节。", "diff": "已有方法主要使用规则式上下文帧检索，难以适应场景遮挡和动态物体。MemLearner 通过学习 query token 来查询上下文，并利用视频生成模型自身的预训练视觉先验，而非从头训练额外模块。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["可学检索", "query token", "世界模型记忆"], "explain": "想象你在看一段街景视频：汽车被大树挡住几帧后，模型还得判断它会从哪里出现。麻烦在于，传统视频世界模型常把很长的历史画面一股脑送进生成器，既难找到真正有用的线索，也容易被遮挡和剧烈运动干扰。MemLearner让模型学会用查询令牌（query token，一小段专门用来提问上下文的表示）主动读取记忆。它把这些令牌放在历史上下文与待预测视频令牌之间，由生成模型已有的视觉先验决定该问什么、从哪里取信息，而不是依赖单独的检索模块。这样，模型能抓住目标的外观、运动和遮挡前后的关系，再生成未来画面。作者还用遮挡和动态场景数据集检验这一能力，结果显示它在两类困难环境中都显著优于先前世界模型。", "key_numbers": ["摘要未给具体数值，称在遮挡与动态场景显著优于先前世界模型"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.31734"], "note": "直接对标「规则式上下文帧检索在遮挡/动态物体下不泛化」，是学习路由分支对 LongLive-RAG 式固定检索的正面替代；注意它面向 action-conditioned 世界模型而非纯 T2V。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 3800, "sx": null}, {"id": "slotmemory", "title": "SlotMemory: Object-Centric KV Memory for Streaming Long-Video Generation", "date": "2026-05-29", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2605.31033", "venue": "", "training": "需训", "status": "速读", "one_liner": "按是什么而非何时组织KV槽", "mechanism": "把KV流形拆成离散可复用语义槽，用槽作路由地址存取KV token，实现实体级持久与prompt感知检索。", "detail": {"position": "论文针对 streaming video generation 中以原始帧、片段或未聚类 token 组织历史记忆，导致实体离开画面或 prompt 切换时身份漂移、语义不一致的问题。它提出以语义对象为中心组织 KV memory，支持长时程实体持久性与按 prompt 检索。", "io": "输入是 streaming video generation 的生成上下文、历史 KV token 与 prompt；输出是连续生成的视频内容。prompt 可在生成过程中切换，历史记忆用于在后续生成中维持实体与语义一致性。", "steps": ["从 transformer 的 KV 表示中提取可复用的语义结构，将记忆组织目标从事件发生的时间转向所表示的内容，以减少仅按时间存储带来的实体关联断裂。", "把 KV manifold 分解为离散语义槽，使相似或相关的表示能够通过共享槽位进行组织。", "将语义槽作为 routing address，索引并存储高保真 KV token，以便实体离开画面后仍可保留其相关记忆。", "生成后续视频时依据语义槽检索历史 KV，并结合当前 prompt 选择相关记忆，以支持跨时间和 prompt 转换的语义一致性。"], "formulas": [{"tex": "a_{ij}=\\operatorname{softmax}_{j}\\!\\left(-\\frac{\\lVert z_i-c_j\\rVert_2^2}{\\tau}\\right)", "caption": "将 KV 表示 z_i 按与语义槽中心 c_j 的距离分配到槽位；标准写法，非原文"}, {"tex": "r_j=\\operatorname{softmax}_{j}\\!\\left(\\frac{q(p)^{\\mathsf T}e_j}{\\sqrt{d}}\\right),\\qquad \\hat{v}=\\sum_j r_j\\,\\operatorname{Attn}\\!\\left(q,\\mathcal{M}_j\\right)", "caption": "依据当前 prompt p 对语义槽打分，并聚合对应槽中存储的 KV 记忆；标准写法，非原文"}], "train": "摘要未给训练目标、训练数据与具体训练流程。推理时采用 streaming video generation，并通过语义槽索引和检索历史 KV；摘要报告在 Wan2.1-T2V-1.3B backbone 上评估 60 秒 interactive narratives，质量分数为 81.61，dynamic consistency 相对最强既有 streaming baseline 提升 22.8%。", "diff": "既有方法通常按时间组织历史内容，例如存储原始帧、片段或未聚类 token；SlotMemory 改为按语义对象组织 KV，并以离散槽位作为检索地址。其核心区别是强调语义结构与实体级记忆，而非单纯增加原始时间上下文容量。", "limits": "摘要未明确说明计算与存储开销、槽位构造细节、适用场景边界或局限。", "has_abstract": true}, "tags": ["语义槽", "实体持久", "KV寻址"], "explain": "想象镜头连续拍一只红伞：走过几条街、隔了很久再出现，它仍该是同一把伞。长视频生成却常把记忆按时间堆进缓存，越拍越难检索，还容易让物体变样、前后动作对不上。SlotMemory把键值记忆（模型用来存取信息的内部缓存）按“是什么”而非“何时发生”整理：把相似内容归入可复用的语义槽，再用槽作地址存取对应片段，并依据提示词检索。这样，物体能跨镜头保留特征，相关记忆也更容易被找回。在Wan2.1-T2V-1.3B上，60秒交互叙事质量得分为81.61，动态一致性相对提升22.8%。", "key_numbers": ["60 秒交互叙事质量分 81.61", "动态一致性相对提升 22.8%", "Wan2.1-T2V-1.3B 骨干"], "self_measured": [], "media": ["https://tj12323.github.io/SlotMemory/static/videos/60s-1.mp4", "https://tj12323.github.io/SlotMemory/static/videos/60s-2.mp4"], "links": ["https://arxiv.org/abs/2605.31033", "https://tj12323.github.io/SlotMemory/"], "note": "摘要自述把记忆抽象从「何时」转到「是什么」，即显式反对时间坐标寻址 → 落内容学习寻址；但「槽位作为地址」也可读成实体挂载，若你按实现归位置时间寻址亦说得通，故 confidence 降为 medium。同月还有一篇 SlotMem（2607.15772，角色可寻址内部记忆），机制更偏角色 slot 写入/读取，我未重复收录以免同类堆叠。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 488, "y": 3686, "sx": null}, {"id": "tethercache", "title": "TetherCache: Stabilizing Autoregressive Long-Form Video Generation with Gated Recall and Trusted Alignment", "date": "2026-06-11", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2606.13035", "venue": "", "training": "免训", "status": "速读", "one_liner": "门控召回远帧，再对齐回可信分布", "mechanism": "缓存分sink/memory/recent；GRAB用注意力相关度乘时间多样性选远帧，TAME把召回token统计对齐可信分布。", "detail": {"position": "这篇论文解决自回归视频扩展到长时生成时的历史缓存受限和误差累积问题，后者会造成视觉伪影、质量下降与时间漂移。TetherCache 旨在固定缓存预算下稳定长视频生成。", "io": "输入是自回归视频扩散生成过程中已有的历史帧特征与当前生成上下文，输出是经缓存管理和记忆编辑后用于后续生成的上下文。条件信号包括注意力相关度、帧的时间多样性，以及可信上下文的统计分布。", "steps": ["将缓存划分为 sink、memory 和 recent 区域，以便在预算受限时分别保留锚点、长程信息和近期上下文。", "用 GRAB 综合注意力相关度与时间多样性，从历史帧中选择远程记忆，以保留有用且覆盖时间范围较广的信息。", "将选出的记忆帧作为召回内容，并通过 TAME 轻量编辑其 token，使统计特征对齐可信上下文分布，以减轻漂移历史特征的污染。", "将整理后的缓存上下文用于后续自回归视频扩散生成，以降低长时生成中的质量退化和时间漂移。"], "formulas": [{"tex": "s_i=\\operatorname{Rel}(i)\\cdot\\operatorname{Div}(i),\\qquad \\operatorname{Rel}(i)=\\frac{1}{|\\mathcal{Q}|}\\sum_{q\\in\\mathcal{Q}}\\operatorname{Attn}(q,i),\\qquad \\operatorname{Div}(i)=\\min_{j\\in\\mathcal{M}}\\lvert t_i-t_j\\rvert", "caption": "GRAB 的远程记忆检索打分：结合历史帧的注意力相关度与相对已选记忆的时间多样性；标准写法，非原文"}, {"tex": "\\widetilde{h}_i=\\gamma\\odot\\frac{h_i-\\mu_{\\mathrm{mem}}}{\\sigma_{\\mathrm{mem}}+\\epsilon}\\odot\\sigma_{\\mathrm{trust}}+\\mu_{\\mathrm{trust}}", "caption": "TAME 的可信上下文统计对齐：将召回 token 的均值和方差对齐到可信上下文分布；标准写法，非原文"}], "train": "TetherCache 是 training-free、plug-and-play 的缓存管理策略，建立在 Self-Forcing 上；通过 GRAB 和 TAME 在推理时管理缓存与编辑召回记忆。摘要未给出具体推理参数或实现设置。", "diff": "相较于仅依赖近期上下文或直接复用历史特征的做法，TetherCache 在固定缓存预算下同时进行带注意力与时间多样性权衡的远帧召回，以及召回 token 的可信分布对齐。它不通过训练新模型来处理漂移。", "limits": "仍受固定缓存预算约束，无法保留完整历史；摘要未见明确说明额外计算代价、适用边界或其他局限。", "has_abstract": true}, "tags": ["门控召回", "记忆编辑", "免训插拔"], "explain": "想象摄像机不停拍一段四分钟的视频：生成得越久，画面越容易偏离开头，人物和场景慢慢变样。TetherCache要解决的正是这种长视频的质量漂移。它把过去的画面分成固定锚点、记忆片段和近期片段，既留住开头的重要信息，也保留眼前变化。生成新画面时，GRAB会从远处挑选值得回看的帧：既看它们与当前内容是否相关，也避免只挑时间上挤在一起的画面。随后，TAME把这些回忆信息调整到模型更可靠的分布，减少旧画面带来的干扰。一个负责选对回忆，一个负责让回忆用得稳，因此能减缓越生成越跑偏。实验中，生成240秒视频的质量漂移从7.84降至1.33；在30秒、60秒和240秒时，效果也都优于Self-Forcing基线。", "key_numbers": ["240s 生成质量漂移 7.84 → 1.33", "30s/60s/240s 均优于 Self-Forcing 基线"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.13035"], "note": "召回打分是「注意力相关度 × 时间多样性」的显式评分而非学习路由网络，严格说介于规则与学习之间；我按「按内容打分取历史」归学习路由，若你要求纯学习策略可降级为不入库。它的独特处是同时处理「取错」和「取到但已被污染」。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 3686, "sx": null}, {"id": "layerrecall", "title": "LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation", "date": "2026-08-28", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2608.28460", "venue": "", "training": "需训", "status": "速读", "one_liner": "先判哪层要记忆，只往那层注KV", "mechanism": "以当前帧为条件的层选择路由，检索历史K/V只注入记忆敏感层；用跨时域预测匹配监督该路由。", "detail": {"position": "LayerRecall 解决长视频分块生成时，近期上下文缓存会遗忘远处历史线索、导致重复出现的主体或属性不一致的问题。它不仅检索历史信息，还决定在哪些 DiT 层使用这些信息。", "io": "输入包括当前生成状态、近期上下文和可检索的历史 K/V 状态；输出是结合历史线索生成的视频块。当前状态作为路由条件，用于选择记忆敏感层并检索相关历史。", "steps": ["根据当前生成状态判断哪些 backbone 层对记忆敏感，以适配不同层对当前、近期和远距离上下文的偏好。", "依据当前状态从历史中检索相关 K/V 状态，以找回再次出现的主体、物体、场景或属性线索。", "仅将检索到的 K/V 注入选定的记忆敏感层，并让其他层保留局部注意力，以增强长程一致性而不干扰局部连续性。", "训练时用 Cross-Horizon Prediction Matching 让有长上下文的参考预测监督受限记忆路由器，以减少对高质量长视频和显式记忆分配标签的依赖。"], "formulas": [{"tex": "\\tilde{h}_{t}^{(\\ell)}=h_{t}^{(\\ell)}+g_{t}^{(\\ell)}\\,\\operatorname{Attn}\\!\\left(Q_{t}^{(\\ell)},K_{\\mathcal{R}_t}^{(\\ell)},V_{\\mathcal{R}_t}^{(\\ell)}\\right),\\qquad g_{t}^{(\\ell)}=\\sigma\\!\\left(f_{\\ell}(s_t)\\right)", "caption": "标准写法，非原文；表示根据当前生成状态选择记忆敏感层，并仅在这些层注入检索到的历史 K/V。"}, {"tex": "\\mathcal{L}_{\\mathrm{CHPM}}=\\sum_{t,\\ell}\\left\\|\\hat{y}_{t,\\ell}^{\\mathrm{router}}-\\operatorname{sg}\\!\\left(\\hat{y}_{t,\\ell}^{\\mathrm{long}}\\right)\\right\\|_2^2", "caption": "标准写法，非原文；跨时域预测匹配损失，用长上下文参考预测监督受限记忆路由器。"}], "train": "训练时，Cross-Horizon Prediction Matching 使用 privileged long-context reference 在预测空间监督 bounded-memory router；具体损失形式和训练设置摘要未给。推理时按当前状态选择记忆敏感层，检索历史 K/V 并仅注入这些层，其他层继续处理局部上下文。", "diff": "相比仅提供非局部历史访问的记忆机制，LayerRecall 同时决定检索什么历史信息以及在哪些层使用它。它还通过跨时域预测匹配训练路由器，而非依赖显式记忆分配标签。", "limits": "摘要称推理开销可忽略，但未见明确说明其他代价与局限。", "has_abstract": true}, "tags": ["层选择路由", "KV注入位置", "预测空间监督"], "explain": "想象镜头从客厅切到厨房，人物又走回来：长视频生成常会忘掉衣着、位置等细节，前后画面接不上。LayerRecall像个分拣员，不把所有历史都塞回模型，而是看当前帧，判断哪些网络层最需要记忆，再只向这些层注入历史的键和值（KV，即注意力计算用来读取信息的缓存）。它还用跨时段预测匹配来训练路由：让模型学会哪些层的记忆有助于保持后续画面一致。这样既留住关键线索，也避免无关历史干扰。论文在100条多镜头提示词及MemoBench、MovieBench综合评测中表现最佳，VBench-Long成绩不降，推理开销也几乎可忽略。", "key_numbers": ["100 条多镜头 prompt", "MemoBench / MovieBench 综合最佳，VBench-Long 不掉", "推理开销可忽略"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.28460"], "note": "关键论点「访问到 ≠ 用得上」，把检索拆成 what（取什么）与 where（注入哪层）两问；这是本泳道里唯一把「路由目的地」当一等公民的，与 MemLearner 只学 query 形成互补。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 3686, "sx": null}, {"id": "weave-forcing", "title": "Weave Forcing: Compositional Memory Routing for Interactive Long Video Generation", "date": "2026-10-02", "precision": "day", "lane": "内容学习寻址", "branch": "学习路由", "arxiv": "2610.03510", "venue": "", "training": "免训", "status": "速读", "one_liner": "LLM拆prompt，按角色背景分路取记忆", "mechanism": "LLM语义槽路由把prompt拆成角色与背景各选参考；对比注意力图做掩码编织只露出相关KV；自适应RoPE。", "detail": {"position": "Weave Forcing 解决交互式长视频生成中跨镜头复用角色与背景记忆的问题，尤其针对新镜头需要组合不同历史镜头元素的情况。它旨在避免整段提示词检索遗漏组件需求，以及混合全部历史记忆引入无关内容。", "io": "输入是当前用户提示词与历史镜头压缩后的 KV 记忆，输出是具有跨镜头角色和背景一致性的当前视频镜头。条件信号包括 LLM 提取的角色与背景语义槽、为各槽选出的历史参考、语义掩码，以及参考覆盖程度。", "steps": ["用 LLM 将当前提示词拆成角色和背景语义槽，并分别选择匹配的历史参考，以满足不同组件各自的记忆需求。", "根据语义槽构造对比注意力图并生成精细语义掩码，以定位历史记忆中与当前组件相关的内容。", "通过 masked memory weaving 从压缩历史 KV 记忆中选择性开放相关 token，以引导当前镜头生成并抑制无关视觉内容。", "根据参考对当前内容的覆盖程度调整 temporal offsets 和记忆保留，以减轻不完整参考靠近当前生成时产生的视觉伪影。"], "formulas": [{"tex": "\\mathbf{Y}=\\operatorname{softmax}\\!\\left(\\frac{\\mathbf{Q}\\mathbf{K}_{\\mathrm{mem}}^{\\top}}{\\sqrt{d}}+\\log(\\mathbf{M}+\\varepsilon)\\right)\\mathbf{V}_{\\mathrm{mem}},\\qquad \\mathbf{M}=\\mathbb{1}\\!\\left[\\mathbf{A}_{\\mathrm{cmp}}\\geq\\tau\\right]", "caption": "标准写法，非原文：基于语义槽对比注意力图构造掩码，并对压缩历史 KV 进行 masked memory weaving，只聚合与当前角色或背景组件相关的记忆 token。"}, {"tex": "\\widetilde{\\mathbf{K}}_{t}=\\operatorname{RoPE}\\!\\left(\\mathbf{K}_{t},\\,t+\\Delta_{t}\\right),\\qquad \\Delta_{t}=\\Delta_{\\max}(1-c_{t}),\\qquad g_{t}=\\sigma\\!\\left(\\alpha(c_{t}-\\tau_{c})\\right)", "caption": "标准写法，非原文：根据历史参考对当前内容的覆盖度 c_t 自适应调整 temporal offset，并通过门控 g_t 调节记忆保留强度。"}], "train": "该框架为 training-free。推理时依次进行语义槽路由、历史参考选择、掩码记忆编织和 coverage adaptive RoPE 调整，再生成当前镜头；具体模型设置与参数摘要未给。", "diff": "不同于整段提示词检索，Weave Forcing 按角色和背景语义槽分别选择历史参考。它还通过掩码选择性访问压缩 KV 记忆，并按参考覆盖程度调整 RoPE 与记忆保留，而不是直接合并全部历史记忆。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["组合式路由", "掩码记忆编织", "免训"], "explain": "想象你在拍一段可互动的长镜头：同一只猫穿过厨房、花园和雨夜街道，观众随时改一句提示词，猫不能变脸，场景也不能串台。长视频生成的麻烦正是如此：模型要从很长的历史记忆里同时维持角色和背景，容易拿错信息，导致主体漂移、环境混乱或画质下降。Weave Forcing先让大语言模型（LLM，负责理解文字的模型）把提示词拆成“角色、背景”等语义槽，再为每个槽选择对应参考记忆。接着用对比注意力图定位真正相关的记忆区域，生成掩码，把无关的键值（KV，即注意力读取的记忆内容）挡住，只编织需要的信息；自适应旋转位置编码（RoPE，让模型感知时空位置）再随镜头变化调整位置关系。这样不同内容各走各的记忆通道，减少互相污染，既保持跨镜头的角色与环境连续性，也不牺牲画质。", "key_numbers": ["摘要未给具体数值，称跨镜头主体/背景一致性提升且画质不降"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.03510"], "note": "针对「整段 prompt 检索会忽略各组分不同参考需求」，把检索粒度从镜头级下到组分级（角色/背景），是 MosaicChunk 之后检索粒度细化的代表；末尾那段覆盖率自适应 RoPE 说明它仍需位置侧兜底。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 3800, "sx": null}, {"id": "reel", "title": "REEL: Learning to Retrieve, Evaluate, and Evolve Visual Memory for Any Long-Horizon Multi-Shot Video Generation", "date": "2026-10-12", "precision": "day", "lane": "内容学习寻址", "branch": "外部检索库", "arxiv": "2610.16632", "venue": "", "training": "需训", "status": "速读", "one_liner": "训一个跨生成器的记忆策略", "mechanism": "统一工具接口下用SFT+GRPO训记忆规划器，学检索参考、补缺失证据、更新记忆；适配器转各家条件输入。", "detail": {"position": "REEL 解决长视频多镜头生成中的跨镜头视觉一致性问题，重点是让记忆策略不依赖特定生成器，同时支持用户控制。", "io": "输入包括用户文本请求、已有持久视觉记忆，以及可能按时间提供的参考图像；输出是检索、生成或更新视觉证据的计划，经适配器转为后端生成器支持的条件输入，以指导视频镜头生成。", "steps": ["通过统一工具接口接收请求和当前记忆，使规划器能以一致方式操作不同后端的视觉证据。", "规划器检索相关参考；若证据缺失，则创建所需视觉证据，以支持镜头生成与跨镜头一致性。", "规划器根据生成结果更新持久记忆，使后续镜头能利用此前积累的证据。", "后端专用适配器将证据计划转换为各生成器支持的条件输入，再由生成器生成镜头。"], "formulas": [{"tex": "\\mathcal{J}_{\\mathrm{GRPO}}(\\theta)=\\mathbb{E}\\!\\left[\\frac{1}{G}\\sum_{i=1}^{G}\\min\\!\\left(r_i(\\theta)\\hat A_i,\\operatorname{clip}\\big(r_i(\\theta),1-\\epsilon,1+\\epsilon\\big)\\hat A_i\\right)-\\beta D_{\\mathrm{KL}}\\!\\left(\\pi_{\\theta}\\|\\pi_{\\mathrm{ref}}\\right)\\right],\\quad r_i(\\theta)=\\frac{\\pi_{\\theta}(o_i\\mid x)}{\\pi_{\\mathrm{old}}(o_i\\mid x)}", "caption": "标准写法，非原文；GRPO 规划器策略优化目标，适用于训练记忆规划器"}], "train": "训练分为三阶段：先用 REEL-SFT-4k 进行 supervised fine-tuning，再用 REEL-RL-1k 进行 single-shot GRPO，最后进行 multi-shot GRPO。多镜头阶段在连续镜头间传递策略生成的记忆，使后续结果能够影响前序参考选择和记忆更新。推理时由 REEL 规划证据操作，再由适配器转换为目标生成器的条件输入；具体优化目标与推理细节摘要未给。", "diff": "已有代表性多镜头系统通常将记忆绑定到特定生成器接口，或依赖预定义的 agent 工作流。REEL 则独立训练面向跨镜头目标的通用记忆策略，并通过适配器支持不同黑盒生成器。", "limits": "摘要未见明确说明计算代价、数据构建成本或适用范围限制。", "has_abstract": true}, "tags": ["记忆策略智能体", "GRPO", "跨生成器"], "explain": "想象拍一部几十镜头的电影：主角换个镜头就变脸、换衣服，场景也接不上。问题在于视频生成器会忘记前文，固定检索又常找不到真正有用的参考。REEL训练一个记忆规划器：它判断当前镜头缺什么，检索相关画面，主动补充缺失证据，再把结果写回记忆。训练先用监督微调（SFT，模仿示范），再用群体相对策略优化（GRPO，按生成效果奖励更好的规划）；适配器把统一接口的记忆转换成不同生成器的条件输入。于是学到的是可迁移的记忆管理，而非某个模型的技巧。ST-Bench一致性在JoyAI-Echo 1.5、MiniMax H3上提升15.1%、20.7%；REEL-Bench Core-100提升2.41、8.32，使用REEL-SFT-4k和REEL-RL-1k数据集。", "key_numbers": ["ST-Bench 跨镜头一致性 +15.1%（JoyAI-Echo 1.5）/ +20.7%（MiniMax H3）", "REEL-Bench Core-100 +2.41 / +8.32", "REEL-SFT-4k + REEL-RL-1k 两个数据集"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.16632"], "note": "把记忆管理从「生成器内部机制」抽成外挂可训练策略，与理解模型管理分支的 agent 化路线同源；与 LongLive-RAG 的区别是它不只检索，还能补拍缺失证据并回写记忆，且对黑盒生成器通用。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 3940, "sx": null}, {"id": "world-t3", "title": "World-T3", "date": "2026-10-01", "precision": "month", "lane": "参数化记忆", "branch": "", "arxiv": "2610.17434", "venue": "", "training": "需训", "status": "精读", "one_liner": "把世界状态写进快权重，按位姿直接取特征", "mechanism": "测试时训练：用递归最小二乘持续更新一小部分快权重，单步常数开销；读取按当前相机位姿从快权重取场景特征，不看历史帧。", "detail": {"position": "World-T3 解决长时程视频生成中，模型离开当前上下文后难以记住已观察场景、导致再次访问时画面不一致的问题。它将过去观察整合进测试时更新的快权重记忆，并按相机位姿读取场景特征。", "io": "输入是用于生成视频的条件，以及相机位姿信号；模型输出随相机运动变化的视频帧。生成时用新观察更新记忆，并依据当前相机位姿从记忆中读取特征。", "steps": ["从当前观察中提取视觉特征，并与相机位姿关联，为后续按位姿检索提供索引。", "用递归最小二乘规则在线更新一小部分快权重，将新特征吸收到记忆中，以持续整合已观察场景。", "根据当前相机位姿从快权重状态读取场景特征，而不依赖历史帧作为检索上下文，以支持长时程重访一致性。", "将自回归模型通过 dual-teacher distribution matching 蒸馏为 few-step generator，以加快交互式视频生成。"], "formulas": [{"tex": "K_t=\\frac{P_{t-1}x_t}{\\lambda+x_t^{\\top}P_{t-1}x_t},\\qquad W_t=W_{t-1}+(y_t-W_{t-1}x_t)K_t^{\\top},\\qquad P_t=\\lambda^{-1}\\left(P_{t-1}-K_tx_t^{\\top}P_{t-1}\\right)", "caption": "递归最小二乘在线更新快权重记忆；标准写法，非原文"}, {"tex": "\\alpha_i(p_t)=\\frac{\\exp\\!\\left(q(p_t)^{\\top}k_i/\\sqrt d\\right)}{\\sum_j\\exp\\!\\left(q(p_t)^{\\top}k_j/\\sqrt d\\right)},\\qquad z_t=\\sum_i\\alpha_i(p_t)v_i", "caption": "根据当前相机位姿检索并聚合快权重中的场景特征；标准写法，非原文"}], "train": "记忆在测试时通过递归最小二乘规则在线更新；摘要称模型还通过 dual-teacher distribution matching 将自回归模型蒸馏为 few-step generator。递归最小二乘的具体形式、训练数据、教师设置及其他训练细节摘要未给。", "diff": "已有自回归方法往往隐式依靠生成模型自身保留历史信息，可能出现超出活动上下文后的空间记忆衰减。World-T3 将观察写入快权重，并按相机位姿读取特征，使存储与每步计算不随生成时长增长。", "limits": "生成依赖相机位姿条件；摘要未见明确说明其余代价与局限，也未给出记忆更新和蒸馏的具体设置。", "has_abstract": true}, "tags": ["快权重TTT", "位姿取特征"], "explain": "就像机器人逛房间，如果走一步就得翻一遍所有旧照片，时间一长就会卡死。World-T3解决的就是频繁回看历史帧导致计算爆炸的麻烦。它在测试时训练中引入像速记便签一样能临时改动的快权重，用递归最小二乘持续更新这一小撮参数把场景存进去；读取时按当前相机位姿直接从快权重取特征，不再依赖历史帧。由于单步开销恒定，在B200上跑1280×704能达20.6帧，PSNR从13.52提至18.31分贝，旋转误差也由3.344度压到1.075度。", "key_numbers": ["1280×704", "20.6FPS（B200）", "PSNR 13.52→18.31dB", "旋转误差 3.344°→1.075°"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.17434"], "note": "报告指出摘要未说明 PSNR 基线是哪个配置，引用须注明；只给到月份 2026-10；站点资产 404，无演示。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 4800, "sx": null}, {"id": "spatial-ttt", "title": "Spatial-TTT", "date": "2026-03-12", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2603.12255", "venue": "", "training": "训练+测试时训练", "status": "速读", "one_liner": "fast weights 组织空间证据", "mechanism": "用 TTT 更新部分参数承载长程空间证据；大块更新并行+滑窗注意力；3D 时空卷积做空间预测，稠密 3D 描述数据引导写入。", "detail": {"position": "Spatial-TTT 解决长视频流中如何持续选择、组织并保留 3D 空间证据的问题，目标是提升长时程视频空间理解能力。其重点不是单纯扩大上下文窗口，而是让模型通过 test-time training 持续更新部分参数。", "io": "输入是连续的视频帧；模型输出用于空间理解的空间证据或预测，具体任务输出形式摘要未说明。稠密 3D 空间描述用于引导空间信息写入，摘要未说明推理时是否需要额外条件信号。", "steps": ["将视频帧送入混合架构，并通过滑动窗口注意力处理局部时序信息，以控制长视频处理开销。", "按大块并行更新 TTT 层中的 fast weights，使其逐步承载和组织跨较长时间范围的空间证据。", "在 TTT 层加入基于 3D 时空卷积的空间预测机制，促使模型学习帧间几何对应关系与时间连续性。", "利用稠密 3D 空间描述数据引导 fast weights 的更新，使全局 3D 空间信号得到结构化记忆。"], "formulas": [{"tex": "W_{t+1}^{\\mathrm{fast}}=W_t^{\\mathrm{fast}}-\\eta\\nabla_{W_t^{\\mathrm{fast}}}\\mathcal{L}_{\\mathrm{3D}}\\!\\left(\\operatorname{Conv3D}(X_{t-k:t};W_t^{\\mathrm{fast}}),\\,Y_{t-k:t}^{\\mathrm{3D}}\\right)", "caption": "标准写法，非原文：通过 3D 时空预测损失在测试时递归更新 fast weights，使其持续写入长程空间证据。"}, {"tex": "\\mathcal{L}_{\\mathrm{3D}}=\\frac{1}{|\\Omega|}\\sum_{(x,y,z)\\in\\Omega}\\left\\|\\hat{S}_{t}(x,y,z)-S_{t}^{\\mathrm{3D}}(x,y,z)\\right\\|_{2}^{2}", "caption": "标准写法，非原文：利用稠密 3D 空间描述监督时空卷积预测结果，约束帧间几何对应关系与时间连续性。"}], "train": "摘要说明构建了稠密 3D 空间描述数据，用于引导模型更新 fast weights；未给出训练目标、优化细节或关键超参数。推理时面向视频流处理，采用滑动窗口注意力与大块并行 TTT 更新；具体更新频率和推理设置摘要未给。", "diff": "相较于仅依赖更长上下文窗口的做法，Spatial-TTT 通过 test-time training 更新部分参数来保留长程空间证据。它还结合大块并行更新、滑动窗口注意力、3D 时空空间预测机制及稠密 3D 描述数据来组织空间信息。", "limits": "摘要未见明确说明计算与显存代价、长时间运行时 fast weights 的管理方式，以及稠密 3D 描述数据的构建成本。", "has_abstract": true}, "tags": ["快权记忆", "大块更新", "空间预测"], "explain": "想象机器人看着一段长视频：杯子被人拿起、移到桌角，模型得记住它的位置，才能判断接下来会怎样。普通方法难以留住远处画面的空间线索，若反复处理全部历史，计算又很费。Spatial-TTT用“快速权重”存证据：一部分模型参数会随视频输入更新，像一本可改写的记事本。它把大块更新并行处理，再用滑动窗口注意力聚焦近期画面；三维时空卷积从连续画面中预测空间变化，稠密三维描述数据则帮助挑选该写入的线索。这样既能保留长程空间信息，也能控制计算量，在视频空间基准上达到当前最佳表现；摘要未给出具体分数。", "key_numbers": ["视频空间基准SOTA", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.12255", "https://liuff19.github.io/Spatial-TTT"], "note": "参数化记忆泳道里最贴\"空间结构化写入\"的一篇；关键问题是条目间的空间组织方式（3D 卷积 + 稠密描述监督）。", "parent": null, "link_strength": "", "key": false, "citations": 1, "x": 762, "y": 4380, "sx": null}, {"id": "loger", "title": "LoGeR", "date": "2026-03-03", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2603.03269", "venue": "", "training": "训练", "status": "速读", "one_liner": "参数化TTT锚全局坐标防漂移", "mechanism": "分块处理，块内用双向先验；跨块靠混合记忆——参数化 TTT 记忆锚定全局坐标系防尺度漂移，滑窗注意力保未压缩上下文做高精对齐。", "detail": {"position": "LoGeR 旨在解决 feedforward 几何基础模型处理分钟级长视频时，二次注意力复杂度或循环设计有效记忆有限所造成的扩展瓶颈。目标是在无需后处理优化的情况下，实现长序列稠密 3D 重建，并保持跨片段的全局一致性。", "io": "输入是按时间顺序的视频流，摘要未说明其他条件信号。输出是视频序列的稠密 3D 重建结果，要求在长时间跨度上保持全局坐标与尺度一致。", "steps": ["将视频流切分为多个 chunk，以分块方式处理长序列，避免直接对整段视频进行高开销的全局注意力计算。", "在每个 chunk 内利用强双向先验进行重建，以获得高保真的局部几何推理结果。", "跨 chunk 使用参数化 Test-Time Training 记忆锚定全局坐标系，以抑制尺度漂移。", "同时使用 Sliding Window Attention 保留未压缩的邻近上下文，以提高相邻 chunk 间的对齐精度。", "结合局部重建与混合记忆逐块处理后续视频，使模型能将训练于短序列的能力推广到更长推理序列。"], "formulas": [{"tex": "\\theta_t=\\theta_{t-1}-\\eta\\nabla_{\\theta}\\mathcal{L}_{\\mathrm{TTT}}(\\theta_{t-1};x_t)", "caption": "参数化测试时记忆的梯度更新；标准写法，非原文"}, {"tex": "\\operatorname{Attn}(q_i,K,V)=\\operatorname{softmax}\\!\\left(\\frac{q_iK_{\\mathcal{N}(i)}^{\\top}}{\\sqrt{d_k}}\\right)V_{\\mathcal{N}(i)},\\quad \\mathcal{N}(i)=\\{j:|i-j|\\le w\\}", "caption": "滑动窗口注意力聚合邻近上下文；标准写法，非原文"}], "train": "模型在长度为 128 帧的序列上训练；推理时可泛化到数千帧。摘要未给出训练损失、优化器、批量大小或具体推理设置。评测包括标准基准和重新利用的 VBR 数据集，后者包含最长 19k 帧的序列。", "diff": "相较于依赖全局注意力或有限循环记忆的既有方法，LoGeR 以分块处理结合参数化 TTT 记忆和非参数化 Sliding Window Attention，分别维护全局坐标稳定性与局部精细对齐。摘要报告其在 KITTI 上的 ATE 相较先前 feedforward 方法降低超过 74%。", "limits": "摘要未见明确说明计算、显存或运行时间代价，也未说明在不同场景或数据分布下的局限。", "has_abstract": true}, "tags": ["TTT记忆", "坐标锚定", "混合记忆"], "explain": "想象一台摄像机沿着很长的走廊前进：每一步位置只差一点，走到尽头却可能把尺度和方向都估偏。长视频模型也有这类麻烦，逐段预测会累积误差，短视频训练又难以支撑数千帧推理。LoGeR把视频切成小块，在每块内部利用前后画面共同判断运动；块与块之间则混合两种记忆：参数化的测试时训练记忆像地图基准，持续锚定全局坐标、抑制尺度漂移；滑动窗口注意力保留最近、未压缩的画面，帮助精细对齐。一个管整体，一个管细节，因此模型可用128帧训练、推理数千帧；在KITTI数据集上，估计轨迹与真实轨迹的误差降低74%，还处理了19,000帧序列。", "key_numbers": ["128帧训练→数千帧推理", "KITTI ATE -74%", "19k 帧序列"], "self_measured": [], "media": ["https://LoGeR-project.github.io/files/loger_teaser_vid.mp4", "https://LoGeR-project.github.io/files/loger_teaser_vid_lowres.mp4"], "links": ["https://arxiv.org/abs/2603.03269"], "note": "3D 重建而非视频生成，但\"参数化记忆负责全局锚、滑窗负责局部精度\"的分工可直接搬到长视频记忆设计。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 4266, "sx": null}, {"id": "mem3r", "title": "Mem3R", "date": "2026-04-08", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2604.07279", "venue": "", "training": "训练", "status": "速读", "one_liner": "跟踪用fast-weight，建图用显式状态", "mechanism": "相机跟踪用 MLP 形式的 fast-weight 记忆经 TTT 在线更新，几何建图用显式定长 token 状态，把跟踪与建图解耦，缓解压缩记忆的漂移与遗忘。", "detail": {"position": "Mem3R 解决长视觉流中的流式 3D 感知问题，重点缓解循环模型在长序列中因压缩记忆容量有限而产生的相机漂移与时间遗忘。它通过将相机跟踪与几何建图分开处理，提升长序列上的时间一致性。", "io": "输入是连续视觉帧，输出包括相机跟踪结果与几何重建表示；摘要未提及额外条件信号。", "steps": ["接收连续视觉帧并进行流式处理，以支持长序列上的增量 3D 感知。", "用轻量 MLP 形式的 fast-weight memory 跟踪相机，并通过 Test-Time Training 在线更新，以改善跟踪的时间一致性。", "用显式的定长 token 状态维护几何建图信息，以保留地图表示并控制状态规模。", "将跟踪记忆与建图状态分开更新，以缓解漂移累积和长期遗忘。"], "formulas": [{"tex": "\\theta_t=\\theta_{t-1}-\\eta\\nabla_{\\theta}\\mathcal{L}_{\\mathrm{TTT}}\\!\\left(f_{\\theta_{t-1}}(x_t),x_t\\right)", "caption": "标准写法，非原文：利用当前帧的测试时训练损失在线更新相机跟踪 MLP 的 fast weights。"}, {"tex": "M_t=\\operatorname{Update}(M_{t-1},z_t),\\qquad |M_t|=K", "caption": "标准写法，非原文：将当前帧特征写入定长几何地图 token 状态，状态规模保持为 K。"}], "train": "摘要称 fast-weight MLP 在推理时通过 Test-Time Training 在线更新；未提供训练流程、损失函数或其他关键训练设置。", "diff": "相较于 CUT3R，Mem3R 将相机跟踪的隐式 fast-weight memory 与几何建图的显式定长 token 状态解耦。摘要称其长序列表现更好，模型参数量从 793M 降至 644M，并可结合 TTT3R 等状态更新策略。", "limits": "摘要未见明确说明具体局限；模型采用固定大小状态，并报告保持恒定 GPU 内存使用量和相近推理吞吐。", "has_abstract": true}, "tags": ["跟踪建图解耦", "定长状态", "显存恒定"], "explain": "想象机器人在陌生楼道里边走边画地图：走得越久，越容易忘记先前看过什么，位置也会慢慢偏掉。Mem3R要解决的正是长视频中的定位漂移和记忆遗忘。它把两件事分开做：相机跟踪靠快速权重记忆，也就是能随新画面在线调整的轻量网络；几何建图则保留固定长度的显式状态，直接存下场景结构。在线调整采用测试时训练（TTT），让记忆随着视频更新。这样，跟踪能灵活适应新画面，地图又不必挤进易压缩、易遗忘的记忆里，两者互相牵制的问题因此减轻。论文报告，模型参数从7.93亿降到6.44亿，绝对轨迹误差降低39%，并能处理500到1000帧的视频。", "key_numbers": ["793M→644M 参数", "ATE -39%", "500-1000 帧"], "self_measured": [], "media": ["https://lck666666.github.io/Mem3R/static/videos/mem3r_video2.mp4", "https://lck666666.github.io/Mem3R/static/videos/stanford_arch_fixed.mp4"], "links": ["https://arxiv.org/abs/2604.07279", "https://lck666666.github.io/Mem3R/"], "note": "给出\"哪类信息适合写权重（位姿）、哪类适合显式存（几何）\"的直接证据，对我们的记忆分工很有说服力。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1036, "y": 4266, "sx": null}, {"id": "mit3", "title": "MIT^3 - Memory Internalization via Test-Time Training", "date": "2026-10-17", "precision": "day", "lane": "参数化记忆", "branch": "写权重", "arxiv": "2610.26910", "venue": "", "training": "测试时训练", "status": "速读", "one_liner": "把整段长视频写进每视频适配参数", "mechanism": "因果追踪测每层对视频问答的因果记忆效用，据此选写入位置；视觉记忆蒸馏让纯文本记忆复现相关片段引起的表示变化，实现无视频输入问答。", "detail": {"position": "MIT^3 解决长视频问答中每次提问都需重新编码视频或检索视觉证据的问题。它将单个视频内化为紧凑的、视频专属的适配参数，使模型之后可在不输入视频的情况下回答问题。", "io": "输入是待适配的长视频，以及用于适配的紧凑多尺度监督和相关视频片段。输出是该视频专属的自适应参数；推理时输入文本问题，由模型在无视频输入的条件下生成答案。", "steps": ["对视频构建紧凑多尺度监督，以较少的合成样本提供视频问答适配信号。", "通过因果追踪测量各模型层对视频问答的因果记忆效用，以确定哪些层适合写入该视频知识。", "针对选定层进行视频专属适配，将视频知识写入紧凑的自适应参数。", "进行视觉记忆蒸馏，使纯文本记忆复现相关视频片段引起的表示变化，以保留文本监督未能直接表达的视觉证据。", "推理时仅提供文本问题并使用适配参数生成答案，从而无需再次输入视频。"], "formulas": [{"tex": "U_l=\\mathbb{E}_{(v,q,a)}\\left[\\log p(a\\mid q;\\theta,\\,h_l\\leftarrow h_l^{\\mathrm{video}})-\\log p(a\\mid q;\\theta,\\,h_l\\leftarrow h_l^{\\mathrm{base}})\\right]", "caption": "标准写法，非原文：通过比较第 l 层注入视频记忆表征与基线表征时的答案对数概率，衡量该层的因果记忆效用。"}, {"tex": "\\mathcal{L}_{\\mathrm{distill}}=\\mathbb{E}_{(v,q)}\\left\\|\\Delta h_{\\mathrm{text}}(q)-\\Delta h_{\\mathrm{video}}(v,q)\\right\\|_2^2", "caption": "标准写法，非原文：蒸馏损失，使纯文本记忆引起的表示变化 \\Delta h_{\\mathrm{text}} 逼近相关视频片段引起的表示变化 \\Delta h_{\\mathrm{video}}。"}], "train": "训练按视频进行适配，使用紧凑多尺度监督、因果追踪选层和视觉记忆蒸馏；推理时以视频专属适配参数支持纯文本问答。优化目标、具体损失、模型配置及其他训练细节摘要未给。", "diff": "已有参数化视频记忆方法主要依赖合成文本，并采用固定的适配配置。MIT^3 根据视频问答中的因果记忆效用选择写入层，并通过视觉记忆蒸馏保留视频片段对表示的影响。", "limits": "摘要未见明确说明额外计算代价、适用边界或失败情形；方法需针对每个视频进行适配。", "has_abstract": true}, "tags": ["参数化记忆", "因果追踪", "蒸馏"], "explain": "想象看完一部长片，合上屏幕后还要回答某个小细节：普通模型得反复翻找视频，片段太长时容易漏掉线索。MIT³让模型针对每段视频做一次测试时训练，把整段视频的信息写进专属参数。它先用因果追踪——观察改变某层记忆会怎样影响回答——找出最值得存信息的位置；再用视觉记忆蒸馏，把视频片段带来的表示变化转成纯文本记忆。这样，模型不必再看视频，也能凭这份记忆回答问题。关键在于它不是平均记住所有画面，而是把对回答真正有用的线索写进合适的层。", "key_numbers": ["LVBench/LongVideoBench/Video-MME", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.26910"], "note": "长视频理解而非生成，泳道归属为\"写权重\"范式的边界案例；但\"写哪里（哪层）+ 怎么写（蒸馏表示变化）\"两个问题对 World-T3 类工作是直接补强。", "parent": null, "link_strength": "", "key": false, "citations": null, "x": 1858, "y": 4940, "sx": null}, {"id": "rad", "title": "Recurrent Autoregressive Diffusion (RAD)", "date": "2025-11-17", "precision": "day", "lane": "参数化记忆", "branch": "递归状态", "arxiv": "2511.12940", "venue": "", "training": "训练", "status": "速读", "one_liner": "DiT 层内插 LSTM 当全局记忆", "mechanism": "每个 DiT 层注意力后接 LSTM 递归块做记忆更新与取回，重叠滑窗全注意力保局部细节，训练推理无 gap；LSTM 表现约等于 TTT/Mamba2。", "detail": {"position": "RAD 面向超长视频自回归生成，解决滑动窗口之外的历史信息难以保留和检索，进而造成遗忘与时空不一致的问题。它在固定记忆预算下结合全局历史记忆与局部细节建模。", "io": "输入输出是视频生成所需的具体张量形式及条件信号，摘要未给。方法用于自回归视频生成，并通过重叠滑动窗口处理局部视频内容、通过递归记忆利用历史信息。", "steps": ["将视频生成建模为自回归过程，并以重叠滑动窗口组织局部内容，使相邻窗口保留重叠区域。", "在 DiT 每层的 attention 后接入 LSTM 递归块，对历史信息进行记忆更新与取回，以支持窗口之外的长期依赖。", "对重叠窗口使用 full attention，保留窗口内及相邻窗口衔接处的时空细节。", "结合递归全局记忆与局部 attention 生成后续视频内容，避免训练与推理流程不一致。"], "formulas": [{"tex": "\\begin{aligned} i_t&=\\sigma(W_i x_t+U_i h_{t-1}+b_i),\\quad f_t=\\sigma(W_f x_t+U_f h_{t-1}+b_f),\\\\ o_t&=\\sigma(W_o x_t+U_o h_{t-1}+b_o),\\quad \\tilde c_t=\\tanh(W_c x_t+U_c h_{t-1}+b_c),\\\\ c_t&=f_t\\odot c_{t-1}+i_t\\odot\\tilde c_t,\\quad h_t=o_t\\odot\\tanh(c_t)\\end{aligned}", "caption": "LSTM 递归记忆的更新与取回；标准写法，非原文"}], "train": "摘要称该框架没有训练与推理 gap，但未说明训练数据处理、损失函数、优化设置或具体训练和推理步骤；相关细节摘要未给。", "diff": "相较于仅用滑动窗口 attention 的方法，RAD 在每个 DiT 层的 attention 后加入 LSTM，以固定记忆预算保留和检索长期历史。相较于已有 diffusion-RNN 方法，它结合重叠窗口上的 full attention，并称可避免训练与推理 gap；LSTM 表现与 TTT、Mamba2 等 RNN 块相当。", "limits": "摘要未见明确说明方法的局限或计算代价。", "has_abstract": true}, "tags": ["递归状态", "固定预算", "滑窗"], "explain": "想象镜头在迷宫里不断前进：转过几个弯后，模型若忘了入口在哪，就很难生成连贯的后续画面。RAD要解决的正是视频越长、记忆越容易丢的问题。它在DiT（一种逐步生成图像的网络）的每层注意力后加入LSTM（一种能反复写入和读取信息的记忆模块），边生成边更新全局记忆；同时用彼此重叠的滑动窗口处理邻近画面，保住局部细节。这样，远处的经历靠记忆传递，眼前的内容靠注意力衔接，训练和推理也无需留下间隙。在Memory Maze和Minecraft任务中，LSTM方案表现与TTT、Mamba2这两种记忆方法大致相当。", "key_numbers": ["Memory Maze / Minecraft", "LSTM≈TTT≈Mamba2"], "self_measured": [], "media": ["https://yeyutaihan.github.io/recurrent-autoregressive-diffusion/videos/chunk_mamba/000000.mp4", "https://yeyutaihan.github.io/recurrent-autoregressive-diffusion/videos/chunk_ttt/000000.mp4"], "links": ["https://arxiv.org/abs/2511.12940"], "note": "便宜的参数化记忆基线——若 LSTM 状态已够，复杂的 TTT 写入未必划算，是我们做消融时的下限对照。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 488, "y": 4520, "sx": null}, {"id": "onstm", "title": "Online Neural Space Time Memory (NSTM)", "date": "2026-07-16", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2607.15271", "venue": "", "training": "测试时训练", "status": "速读", "one_liner": "TTT 记忆更新与应用频率解耦", "mechanism": "视频内容高度冗余，故记忆按周期更新、逐帧施加，跨视角注意力管形变；加辅助 Memory Loss 强制内化历史、权重缓存正则防灾难漂移。", "detail": {"position": "这篇工作解决动态场景在线新视角合成中的长时记忆与实时计算之间的矛盾。它希望在遮挡区域暂时不可见时仍能利用历史信息重建，同时降低逐帧更新记忆的开销。", "io": "输入是多视角流式视频，输出是在线新视角合成结果。当前帧与历史记忆用于逐帧应用记忆，目标视角等具体条件信号摘要未给。", "steps": ["接收多视角流式视频并维护场景记忆，以便为后续帧保留历史信息。", "逐帧将记忆应用于当前内容，并通过 cross-view attention 处理先前记忆状态与当前帧之间的形变。", "利用视频内容冗余，按周期而非逐帧执行基于 Test-Time Training 的记忆更新，以减少计算开销。", "加入辅助 Memory Loss，促使模型持续内化场景历史，从而支持对暂时遮挡区域的重建。", "采用 Memory Caching 约束活动权重，降低长上下文中的灾难性漂移。"], "formulas": [{"tex": "\\theta_m^{(t+1)}=\\theta_m^{(t)}-\\eta\\nabla_{\\theta_m}\\left(\\mathcal{L}_{\\mathrm{recon}}+\\lambda\\mathcal{L}_{\\mathrm{mem}}+\\gamma\\lVert\\theta_m-\\theta_{\\mathrm{cache}}\\rVert_2^2\\right)", "caption": "标准写法，非原文：周期性测试时训练更新记忆，并用历史记忆损失与缓存权重约束减少漂移。"}, {"tex": "\\operatorname{Attn}(Q,K,V)=\\operatorname{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{d}}\\right)V", "caption": "标准写法，非原文：跨视角注意力聚合当前帧与先前记忆的信息，以处理视角变化和形变。"}], "train": "摘要未给具体训练流程、周期设置或损失函数形式。推理时逐帧应用记忆，并周期性执行记忆更新；摘要称其在分钟级记忆持续能力下达到摊销实时速度。", "diff": "标准 Test-Time Training 模型通常每帧都进行基于梯度的记忆更新；本文将记忆更新与记忆应用解耦，改为周期更新、逐帧应用。另以 Memory Loss 和 Memory Caching 增强历史内化并抑制权重漂移。", "limits": "摘要指出记忆更新开销高且长上下文中可能不稳定，但提出的方法未消除周期更新本身的计算成本。具体适用边界与局限未见明确说明。", "has_abstract": true}, "tags": ["更新解耦", "权重缓存", "动态场景"], "explain": "想象一台摄像机连续拍摄一间屋子：画面每秒变化，但桌椅位置大多没变。若模型每帧都重建记忆，既耗时又容易忘掉远处的过去；若不更新，又跟不上物体移动。在线神经时空记忆让记忆更新与使用分开：用测试时训练（TTT）按周期吸收新内容，却逐帧调用记忆。视频冗余让较少更新也能覆盖多数新信息，跨视角注意力则帮助模型对齐不同画面中的形变。辅助记忆损失促使模型把历史写进记忆，权重缓存正则则限制更新幅度，避免学新内容时破坏旧知识。实验显示，它能让记忆保持分钟级，并以摊销后的实时速度处理视频。", "key_numbers": ["分钟级记忆持久", "摊销实时速度"], "self_measured": [], "media": ["https://nst-mem.github.io/videos/hero_combined.mp4"], "links": ["https://arxiv.org/abs/2607.15271", "https://nst-mem.github.io"], "note": "动态新视角合成为任务，不直接是长视频世界模型；但\"更新频率 vs 施加频率\"解耦是 TTT 记忆落地的关键工程点，泳道归属存疑故标 low。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 4266, "sx": null}, {"id": "zo3t", "title": "Zo3T", "date": "2025-09-08", "precision": "day", "lane": "参数化记忆", "branch": "测试时训练", "arxiv": "2509.06723", "venue": "", "training": "免训", "status": "速读", "one_liner": "测试时LoRA让视频贴合相机轨迹", "mechanism": "3D 感知运动投影用推断深度推透视正确仿射，去噪中动态注入并优化临时 LoRA 适配被操纵 latent，区域特征一致性损失约束，配 guidance 场校正。", "detail": {"position": "Zo3T 解决图像到视频生成中，生成视频难以准确遵循用户指定运动轨迹的问题。它针对忽略 3D 透视和操纵 latent 与网络噪声预测不匹配所导致的不真实运动及生成失真。", "io": "输入是待生成视频的图像和用户指定的运动轨迹，输出是遵循该轨迹的视频。条件信号包括从场景推断的深度以及轨迹约束。", "steps": ["推断场景深度，并据此为目标区域计算考虑透视的仿射变换，使轨迹运动更符合 3D 几何。", "在去噪过程中按轨迹操纵 latent，并动态注入临时 LoRA 适配器，使网络表示能够适应操纵后的 latent。", "使用区域特征一致性损失联合约束 latent 与 LoRA 更新，以推动目标区域遵循运动轨迹并保持生成保真度。", "通过一步前瞻优化条件 guidance field，校正去噪演化路径，使生成过程更有效地朝目标轨迹推进。"], "formulas": [{"tex": "\\mathbf{p}'=\\pi\\!\\left(\\mathbf{K}\\left(\\mathbf{K}^{-1}\\tilde{\\mathbf{p}}+\\frac{\\Delta\\mathbf{X}}{D(\\mathbf{p})}\\right)\\right)", "caption": "标准写法，非原文：利用估计深度将图像点反投影到 3D、施加运动并重新投影，以体现透视的运动映射。"}, {"tex": "\\min_{\\{\\mathbf{z}_t\\},\\{\\Delta\\theta_t\\}}\\sum_t\\left\\|\\phi_R\\!\\left(\\mathcal{D}(\\mathbf{z}_t;\\theta+\\Delta\\theta_t)\\right)-\\mathcal{W}_{A_t}\\!\\left[\\phi_R\\!\\left(\\mathcal{D}(\\mathbf{z}_t;\\theta+\\Delta\\theta_t)\\right)\\right]\\right\\|_2^2", "caption": "标准写法，非原文：区域特征一致性目标，联合优化去噪 latent 与临时 LoRA 参数，使目标区域特征符合轨迹对应的变换。"}], "train": "这是 zero-shot test-time-training 框架，不依赖针对稀缺标注数据进行预先微调；推理时在去噪过程中与 latent 状态共同优化临时 LoRA。区域特征一致性损失和 guidance 场的一步前瞻校正用于约束生成；具体优化器、步数及其他关键设置摘要未给。", "diff": "相比依赖稀缺标注数据进行计算密集型微调的方法，Zo3T 在测试时动态优化临时 LoRA。相比仅在 latent 空间控制轨迹的零样本方法，它结合深度感知的透视投影、网络适配和 guidance 场校正，以缓解运动不真实及 latent 与噪声预测失配。", "limits": "摘要未见明确说明。", "has_abstract": true}, "tags": ["临时LoRA", "轨迹控制", "零样本"], "explain": "想象让一段视频里的镜头沿着弯曲轨迹绕过桌上的茶杯：普通视频生成模型可能让镜头动了，杯子却变形、漂移，或前后画面接不上。Zo3T要解决的正是相机运动与场景运动难以协调的问题。它先根据模型推断的深度，把相机轨迹投影成符合透视的画面变换；再在逐步去噪生成视频时，把变换动态施加到潜在表示，也就是压缩后的画面特征上。与此同时，它临时优化低秩适配器（LoRA，一种轻量的模型参数补丁），让生成内容贴合变换后的表示，并用区域特征一致性损失约束同一物体别在镜头运动中走样。最后，指导场会修正生成方向。这样既能跟随指定镜头运动，也尽量保住场景结构；方法无需额外训练，但摘要未给出量化指标。", "key_numbers": ["零样本", "摘要未给指标"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2509.06723"], "note": "单段轨迹控制的 I2V，无长程历史回溯；收进来只因它是\"位姿条件 × 测试时训练\"最早的一批样本，可作方法拼装参考。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 214, "y": 4266, "sx": null}, {"id": "comoe", "title": "Composition of Memory Experts", "date": "2026-05-12", "precision": "day", "lane": "参数化记忆", "branch": "专家组合", "arxiv": "2605.18813", "venue": "", "training": "训练+测试时微调", "status": "速读", "one_liner": "短期/长期/空间三记忆专家组合", "mechanism": "用对比式 product-of-experts 组合异构记忆：短期专家抓局部动态，长期专家经轻量测试时微调把情节历史写进外部扩散权重，空间专家保几何一致。", "detail": {"position": "这篇论文要解决世界模型中的记忆权衡：Transformer 保留局部细节但注意力开销随上下文增长，循环与状态空间模型更高效却可能损失历史细节。论文组合不同记忆专家，以提升长上下文下未来预测与过去观测的一致性。", "io": "输入是过去的观测，输出是与这些观测一致的未来预测。条件信号包括历史观测；摘要未说明空间专家使用的具体条件输入。", "steps": ["从历史观测提取短期信息，由短期记忆专家捕捉细粒度局部动态，以保留近期变化。", "对历史情节进行轻量测试时微调，将长期记忆写入外部扩散权重，以支持对过去观测的回忆。", "由空间长期记忆专家约束几何与空间一致性，以减少预测中的空间不连贯。", "通过对比式 product-of-experts 组合三类专家的作用，以整合互补记忆并生成一致的未来预测。"], "formulas": [{"tex": "p(y\\mid x)=\\frac{1}{Z(x)}\\,p_{\\mathrm{short}}(y\\mid x)\\,p_{\\mathrm{long}}(y\\mid x)\\,p_{\\mathrm{space}}(y\\mid x)", "caption": "标准写法，非原文：以 product-of-experts 形式组合短期、长期与空间记忆专家的预测。"}], "train": "摘要未给出完整训练流程、损失函数或推理设置；摘要提到长期记忆通过轻量测试时微调写入外部扩散权重。", "diff": "不同于依赖单一架构承担全部记忆功能的方法，本文以对比式 product-of-experts 组合异构记忆模型。其设计同时覆盖局部动态、情节历史回忆和空间一致性，目标是在扩展上下文时避免二次注意力开销。", "limits": "摘要未见明确说明具体计算代价、测试时微调开销及方法局限。", "has_abstract": true}, "tags": ["专家组合", "测试时微调", "情节记忆"], "explain": "想象镜头跟着一个人穿过房间：刚才移开的椅子不能突然复位，门的位置也不能漂移。视频世界模型要预测后续画面，却常难同时记住眼前动作、较早发生的事和场景几何。《Composition of Memory Experts》把记忆拆成三位专家：短期专家捕捉局部动态，长期专家通过轻量的测试时微调，把情节历史写入外部扩散模型的权重；空间专家则维持几何一致。它用对比式“专家乘积”组合这些记忆——可理解为让不同专家的判断相互约束、共同支持合理预测。这样，模型既能跟上动作，又不易忘掉旧事或弄乱空间。论文发表于 ICLR 2026。", "key_numbers": ["ICLR 2026"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.18813"], "note": "面向机器人/规划的扩散世界模型，无项目页；机制描述取自摘要，未读正文，故 low。亮点是把\"写进权重的情节记忆\"当成可组合的一个专家而非唯一记忆。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 4660, "sx": null}, {"id": "causvid", "title": "CausVid", "date": "2024-12-01", "precision": "month", "lane": "训练侧", "branch": "", "arxiv": "2412.07772", "venue": "", "training": "需训", "status": "速读", "one_liner": "因果蒸馏，Self-Forcing 的早期版本", "mechanism": "报告只有一句：与 Self-Forcing 同一思路的早期版本，属因果蒸馏路线。", "detail": {"position": "CausVid 解决视频扩散模型依赖双向注意力、难以逐帧交互生成的问题，并通过蒸馏降低生成延迟。它属于因果蒸馏路线，也是 Self-Forcing 的早期版本。", "io": "输入可包含文本提示，以及用于 video-to-video 或 image-to-video 的视频或图像条件；摘要未说明具体输入格式。输出为可流式生成的视频帧，并支持动态提示。", "steps": ["将预训练的双向 diffusion transformer 适配为 autoregressive transformer，使生成当前帧时无需处理未来帧。", "用教师模型的 ODE trajectories 初始化学生模型，以支持稳定的蒸馏训练。", "将 50-step diffusion teacher 蒸馏为 4-step generator，以减少每次生成所需的推理步数。", "采用 asymmetric distillation，由双向 teacher 监督因果 student，以缓解自回归生成中的误差累积。", "推理时通过 KV caching 流式生成视频，并将模型用于 video-to-video、image-to-video 和动态提示。"], "formulas": [{"tex": "\\operatorname{Attn}(Q,K,V)_i=\\sum_{j\\le i}\\operatorname{softmax}_{j}\\!\\left(\\frac{Q_iK_j^{\\top}}{\\sqrt{d}}\\right)V_j", "caption": "因果注意力：生成第 i 帧时只聚合当前及此前帧的信息；标准写法，非原文"}, {"tex": "\\mathcal{L}_{\\mathrm{distill}}=\\mathbb{E}_{z,t}\\left[\\left\\|f_{\\theta}^{\\mathrm{causal}}(z_t,t)-f_{\\mathrm{teacher}}^{\\mathrm{bidirectional}}(z_t,t)\\right\\|_2^2\\right]", "caption": "双向教师监督因果学生的蒸馏目标示意；标准写法，非原文"}], "train": "训练时将预训练双向模型适配为因果自回归模型，再以教师 ODE trajectories 初始化学生，并用双向 teacher 对因果 student 进行 asymmetric distillation，将 50 步教师蒸馏为 4 步生成器。推理时采用 KV caching 逐帧流式生成；摘要报告单 GPU 上达到 9.4 FPS。", "diff": "不同于需要双向处理整段序列的视频扩散模型，CausVid 采用因果自回归生成，可在生成过程中逐帧输出。其关键训练设计是用双向 teacher 蒸馏因果 student，并结合 ODE 轨迹初始化来支持稳定训练和缓解误差累积。", "limits": "摘要未明确说明训练和推理的资源代价、适用分辨率或具体画质局限；自回归生成中的误差累积是其需要处理的问题。", "has_abstract": true}, "tags": ["DMD蒸馏", "因果注意力"], "explain": "以往生成视频就像冲洗胶卷，必须等整卷拍完统一洗出来，根本没法像直播那样边拍边看。CausVid在2024年12月要解决的就是这种生成延迟过高、无法实时流式输出的麻烦。它用了一招叫因果蒸馏，也就是让只能看前文的单向模型去临摹通览全片的大模型。这招之所以管用，是因为大模型掌握着全局连贯的规律，把经验传授过去后，单向模型顺着时间逐帧推演时就不会越走越崩，既做到了开水龙头般的即时出帧，又稳住了画面质感。", "key_numbers": ["2024-12"], "self_measured": [], "media": ["https://causvid.github.io/images/methods.jpg", "https://causvid.github.io/images/preference.jpg", "https://causvid.github.io/images/radar.jpg"], "links": ["https://arxiv.org/abs/2412.07772"], "note": "报告只给到月份 2024-12。", "parent": null, "link_strength": "", "key": false, "citations": 47, "x": 214, "y": 5126, "sx": null}, {"id": "framepack", "title": "FramePack", "date": "2025-04-01", "precision": "month", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2504.12626", "venue": "", "training": "需训", "status": "速读", "one_liner": "恒定上下文按帧重要性打包，越旧压得越狠", "mechanism": "喂给模型的上下文体积恒定，历史按帧重要性打包压缩；另配反漂移采样抑制误差累积。", "detail": {"position": "FramePack 针对视频生成中固定上下文长度限制了可利用历史帧数，以及长序列预测容易累积误差的问题。它按帧重要性压缩历史上下文，并配合反漂移方法支持更长的视频生成。", "io": "输入是历史视频帧及其重要性排序，输出是下一帧或下一段视频。上下文作为条件信号；摘要提到的帧重要性依据包括时间接近性、特征相似度或混合指标。", "steps": ["计算历史帧的重要性，以确定哪些帧应保留较长上下文。", "在恒定上下文长度内按重要性打包历史帧，让重要帧占用较长上下文、较不重要的帧压缩得更多，从而容纳更多历史信息。", "将打包后的上下文输入 next-frame 或 next-frame-section 预测模型，生成后续视频内容。", "通过预先确立端点、调整采样顺序和离散历史表示等反漂移方法，抑制观察偏差导致的误差累积。"], "formulas": [{"tex": "\\sum_{i=1}^{T} b_i=B,\\qquad b_i=B\\frac{s_i}{\\sum_{j=1}^{T}s_j}", "caption": "标准写法，非原文：在固定上下文预算 B 下，按帧重要性分配各历史帧的 token 预算 b_i。"}, {"tex": "\\tilde{z}_{1:T}=\\operatorname{Concat}_{i=1}^{T}\\!\\left(\\mathcal{C}_{b_i}(z_i)\\right)", "caption": "标准写法，非原文：将每帧历史表示 z_i 压缩到分配的预算 b_i，再拼接为固定长度上下文。"}], "train": "摘要称可用 FramePack 微调已有视频 diffusion 模型，并通过消融实验验证反漂移方法在单向视频流式生成和双向视频生成中的效果。训练与推理可利用更大的批量或数千帧上下文；具体训练配置和推理参数摘要未给。", "diff": "与不区分帧重要性地处理历史上下文的做法不同，FramePack 在固定上下文长度内按重要性分配压缩程度。它还加入多种反漂移方法，以缓解长序列生成中的误差累积。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["重要性打包", "反漂移采样"], "explain": "长视频生成就像用一本页数固定的笔记本去记长途旅行，画面越堆越多，显存随时会爆。这篇论文解决的就是长视频生成中历史帧越积越多、显存吃不消的麻烦。它的做法是把上下文，也就是模型每次能参考的历史信息总量锁死，按照重要性把旧帧打包压缩，时间越久远压得越狠；同时搭配反漂移采样，即一种抑制误差累积、防止画面越来越变形的纠偏方法。这招管用是因为远景历史只要保留粗略轮廓就能稳住连贯性，省下算力留给近处细节，最终实现了把 13B 模型塞进 6GB 显存里流畅运行。", "key_numbers": ["13B", "6GB 显存"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2504.12626"], "note": "报告只给到月份 2025-04；lane 依矩阵『重要性打包』归内容/学习，报告未述具体检索键。", "parent": null, "link_strength": "", "key": false, "citations": 7, "x": 488, "y": 5266, "sx": null}, {"id": "self-forcing", "title": "Self-Forcing", "date": "2025-06-01", "precision": "month", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2506.08009", "venue": "", "training": "需训", "status": "速读", "one_liner": "用自生成历史蒸馏，治 exposure bias", "mechanism": "不改记忆结构：学生自己 rollout 出带误差的历史，教师对这段自生成历史打分蒸馏，让模型习惯自己的错误。", "detail": {"position": "Self Forcing 旨在缓解自回归视频扩散模型的 exposure bias：训练时使用真实历史，推理时却必须依赖模型自己生成且可能带误差的历史。它让模型在自生成上下文中接受视频级监督，以提高整段生成序列的质量。", "io": "输入是视频生成所需的条件信号及扩散过程中的噪声，摘要未具体说明条件信号的类型。模型逐帧生成视频，并将此前自生成的帧作为后续帧的上下文。", "steps": ["使用 few-step diffusion 模型逐帧生成视频，以较少去噪步骤控制自回归 rollout 的计算成本。", "训练时通过 KV caching 保存生成历史，并将模型自己的输出作为后续帧的条件，使训练上下文贴近推理时的实际情况。", "对自生成历史上的整段视频进行视频级监督，并通过教师对该历史评分蒸馏，使模型学习在带误差的上下文中生成。", "使用 stochastic gradient truncation 限制反向传播开销，在训练效率与性能之间取得平衡。", "推理时通过 rolling KV cache 复用历史状态，支持高效的自回归视频外推与流式生成。"], "formulas": [{"tex": "\\hat{x}_{1:T}=G_\\theta(z_{1:T};\\hat{x}_{<1:T}),\\qquad \\hat{x}_t=G_\\theta(z_t;\\hat{x}_{<t})", "caption": "标准写法，非原文；表示学生逐帧自回归 rollout，并将自己的历史输出作为后续帧条件"}, {"tex": "\\nabla_\\theta L_{\\mathrm{DMD}}=\\mathbb{E}_{t,\\epsilon}\\!\\left[\\left(s_{\\mathrm{student}}(x_t,t)-s_{\\mathrm{teacher}}(x_t,t)\\right)\\frac{\\partial \\hat{x}_{1:T}}{\\partial\\theta}\\right],\\quad x_t=\\alpha_t\\hat{x}_{1:T}+\\sigma_t\\epsilon", "caption": "标准写法，非原文；在学生自生成视频上用教师与学生的噪声分数差进行分布匹配蒸馏"}], "train": "训练采用 few-step diffusion、自回归 rollout 和 KV caching，使每帧依赖此前自生成的输出；使用视频级整体损失，并采用 stochastic gradient truncation 控制计算成本。推理使用 rolling KV cache 进行自回归视频外推。摘要报告单 GPU 上可实现亚秒延迟的实时流式生成，但未给出具体训练超参数。", "diff": "不同于基于真实上下文帧预测未来帧的做法，Self Forcing 在训练中使用模型自己的生成历史作为条件，并以视频级整体监督评估生成序列，而非只依赖逐帧目标。", "limits": "方法引入自回归 rollout 和视频级监督，训练需兼顾计算开销；摘要称 stochastic gradient truncation 用于平衡成本与性能，但未见明确说明其他代价或局限。", "has_abstract": true}, "tags": ["学生自rollout", "教师蒸馏"], "explain": "就像学骑车如果总有人在后面扶着，一旦松手你只要车把稍稍晃一下就会直接摔倒。模型平时训练都喂标准答案，实际生成时只能依赖上一句输出，前面一错就会步步错，这种训练和实战脱节的问题叫暴露偏差。这篇论文的招数是让学生模型自己往下写，生成一段带毛病的作答历史，再让更厉害的教师模型针对这段有错的历史教它打分，也就是用好模型带差模型的知识蒸馏。这招管用是因为它不改动模型结构，直接让模型提前习惯自己的失误并在犯错语境里学会顺势纠偏，独立推理时就不会因为微小失误而全盘崩溃了。", "key_numbers": [], "self_measured": [], "media": ["https://self-forcing.github.io/static/results.png", "https://self-forcing.github.io/static/teaser.jpg", "https://self-forcing.github.io/static/videos/30s/0006.mp4"], "links": ["https://arxiv.org/abs/2506.08009"], "note": "报告未给日期，仅列于 §3.6 与参考文献。", "parent": "causvid", "link_strength": "solid", "key": false, "citations": 42, "x": 762, "y": 5406, "sx": 462, "sy": 5176.0, "cross": false}, {"id": "longlive", "title": "LongLive", "date": "2025-09-01", "precision": "month", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2509.22622", "venue": "", "training": "需训", "status": "速读", "one_liner": "自回归+少步采样做实时长视频", "mechanism": "把自回归生成与少步采样结合，靠 KV 重算和帧级注意力维持长程一致；报告未描述记忆检索结构。", "detail": {"position": "LongLive 面向实时、交互式长视频生成，旨在兼顾生成效率、长视频质量，以及用户在生成过程中切换提示词时的连贯性。它采用因果帧级自回归设计，并以少步采样支持快速生成。", "io": "输入包括初始文本提示词，以及生成过程中流式输入或切换的提示词。输出是按帧自回归生成的视频，支持最长 240 秒。", "steps": ["以因果帧级自回归方式生成视频帧，使模型能够使用 KV caching 加速推理。", "用户输入新提示词时通过 KV-recache 刷新缓存状态，使生成内容平滑适应提示词切换。", "训练时采用 streaming long tuning，让模型学习长视频生成，并使训练与推理都面向长序列。", "推理时结合短窗口注意力与帧级 attention sink，在加速生成的同时保留长程一致性。"], "formulas": [{"tex": "p(x_{1:T}\\mid c_{1:T})=\\prod_{t=1}^{T}p(x_t\\mid x_{<t},c_{\\le t})", "caption": "标准写法，非原文；表示因果自回归地逐帧生成视频"}, {"tex": "\\operatorname{Attn}(Q_t,K,V)=\\operatorname{softmax}\\!\\left(\\frac{Q_t[K_{\\mathrm{sink}};K_{t-W+1:t}]^{\\top}}{\\sqrt{d_k}}\\right)[V_{\\mathrm{sink}};V_{t-W+1:t}]", "caption": "标准写法，非原文；表示结合帧级 attention sink 与短窗口上下文的注意力聚合"}], "train": "将 1.3B 参数的短视频模型微调至分钟级视频生成，使用 streaming long tuning；摘要报告该过程耗时 32 GPU-days。推理采用帧级自回归生成，支持少步采样，并可进行 INT8 量化；单张 NVIDIA H100 上报告 20.7 FPS，最长支持 240 秒视频。", "diff": "相较于依赖双向注意力的 Diffusion 和 Diffusion-Forcing 方法，LongLive 使用因果帧级自回归以支持 KV caching。相较于常见的长序列自回归生成，它通过 KV-recache、streaming long tuning，以及短窗口注意力配合帧级 attention sink，应对提示词切换和长程一致性问题。", "limits": "摘要未见明确说明方法局限；INT8 推理会带来轻微质量损失。", "has_abstract": true}, "tags": ["少步采样", "KV重算"], "explain": "想象你在开一场AI实时视频直播，镜头得一边飞快出图，一边保证播了半天主角的脸和衣服完全不变。以往生成长视频要么太慢做不到实时，要么时间一长画面就崩坏走样。LongLive把少步采样和自回归结合起来，前者指用极少的计算步数快速画图，后者指像接龙一样按时间逐帧推导。这招管用是因为少步骤压低了耗时，同时靠帧级注意力让新帧精准对照历史画面，配合重新计算历史特征的KV重算，让后续内容始终锚定前文，在极速生成中稳住了长期连贯性。", "key_numbers": [], "self_measured": [], "media": ["https://github.com/NVlabs/LongLive/raw/main/LongLive-Plug/assets/readme/method.png", "https://github.com/NVlabs/LongLive/raw/main/LongLive-Plug/assets/readme/overview-first-frame.png", "https://github.com/NVlabs/LongLive/raw/main/LongLive1.0/assets/video-first-frame.png"], "links": ["https://arxiv.org/abs/2509.22622"], "note": "与 LongLive-RAG（2606.02553）同名不同物，勿混；报告只给了一句描述。", "parent": "self-forcing", "link_strength": "solid", "key": false, "citations": 0, "x": 1036, "y": 5406, "sx": 1010, "sy": 5456.0, "cross": false}, {"id": "solarwm", "title": "SolarWM", "date": "2026-09-01", "precision": "month", "lane": "训练侧", "branch": "三段训练", "arxiv": "2609.02886", "venue": "", "training": "需训", "status": "速读", "one_liner": "三段式训练把 5s 训练推到 60min 长程", "mechanism": "只讲训练流程：双向适应→teacher-forced 自回归→DMD 蒸馏；相机条件用 fused-PRoPE，记忆结构未描述。", "detail": {"position": "SolarWM 解决异构数据集与不同视频生成骨干难以统一处理的问题，目标是构建可复现、可扩展的交互式视频世界模型基础。其核心是统一数据处理与训练接口，并让模型保留各自骨干的原生表示和目标。", "io": "输入包括视频观察、metric camera geometry 与 captions 等数据，推理时以视频观察和相机条件驱动生成。输出是支持交互的因果视频模型，可进行分钟到小时级的长程 rollout。", "steps": ["将 10 个数据集的片段整理为帧对齐的统一数据契约，纳入视觉观察、metric camera geometry、captions、质量元数据、筛选决策和数据来源，以统一异构监督。", "通过可重配置的数据引擎解耦各数据源处理与训练混合，并使用共享相机条件接口接入不同视频骨干，以支持一致的数据构建和比较。", "对骨干进行双向适应，并以 fused-PRoPE 提供相机条件，使模型适配世界模型任务并保留原生表示与训练目标。", "进行 teacher-forced 自回归初始化，把模型训练为因果生成形式，为交互式 rollout 做准备。", "使用 distribution matching distillation 蒸馏模型，使仅在 5s 序列上训练的模型支持分钟到小时级长程生成。"], "formulas": [{"tex": "\\nabla_\\theta L_{\\mathrm{DMD}}=\\mathbb{E}_{c,z,t}\\!\\left[w(t)\\bigl(s_{\\mathrm{student}}(x_t,t,c)-s_{\\mathrm{target}}(x_t,t,c)\\bigr)\\nabla_\\theta x_\\theta\\right]", "caption": "分布匹配蒸馏的标准梯度写法，非原文；以学生分布与目标分布的 score 差异更新生成器"}], "train": "训练采用三阶段流程：双向适应、teacher-forced 自回归初始化、distribution matching distillation。统一相机条件、训练和推理接口下实例化了 4 个 5B–33B 模型，基于 Wan2.2、LTX-2.5 和 MiniMax-H3，并保留各骨干的原生表示与目标。模型在 5s 序列上训练后，可进行分钟到小时级 rollout；更具体的训练超参数与推理设置摘要未给。", "diff": "相较于直接混合异构数据或为每个模型单独实现训练流程，SolarWM 使用统一的数据契约和共享接口，同时保留不同骨干的原生表示与目标。它还以三阶段训练流程将短序列训练扩展到长程因果生成。", "limits": "摘要未报告训练与推理的计算成本、各模型效果差异或长程 rollout 的具体质量指标；记忆结构也未描述。", "has_abstract": true}, "tags": ["三段式训练", "fused-PRoPE"], "explain": "就像教新手开车，如果平时只练五秒起步，直接让他上一小时高速，车子很快就会失控撞墙。以前模型在 1.43M clips、约 25TB 数据上只练 5 秒，推到长程就会彻底崩溃。SolarWM 在 5B 到 33B 规模上提出三段式训练：先做双向适应，即让前后帧互相参考打底；再做教师强制自回归，也就是拿真实画面纠偏学预测；最后用 DMD 蒸馏，即把慢速去噪压缩为一步出图的加速法，结合融合位置编码输入相机位姿。这种阶梯式进阶彻底控制了误差累积，稳稳把 5 秒短片推到了 60 分钟长程。", "key_numbers": ["5B–33B", "5s", "60min", "1.43M clips", "约 25TB"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.02886"], "note": "§2 表列为可跑模型、§3.6 又归训练侧，lane 按 §3.6 填；报告只给到月份 2026-09。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 5660, "sx": null}, {"id": "honeycomb", "title": "Honeycomb", "date": "2026-09-01", "precision": "month", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2609.37690", "venue": "", "training": "需训", "status": "速读", "one_liner": "恒定容量槽位＋显式锚点的代表", "mechanism": "报告只在 L3『恒定槽位』与趋势 4『恒定容量+显式锚点』两处点名，未述寻址键与读写细节。", "detail": {"position": "Honeycomb 解决长时视频生成中场景记忆随生成过程不断增长、难以维持固定存储开销的问题。它用固定大小的 HexMemory 保存空间与时空特征，以支持后续生成时对场景的持续记忆和重访一致性。", "io": "输入是当前新生成的视频 chunk 和已有的 HexMemory；输出是更新后的 HexMemory，以及 reader 检索出的 latents，用于条件化后续视频生成。摘要未说明其他条件信号。", "steps": ["Feed-forward writer 只处理当前新 chunk，将其映射为新的 plane 特征，以避免反复处理完整历史。", "当空间覆盖范围或时间范围扩展时，对已有 planes 进行 warp 并保持其维度不变，以在固定容量内对齐记忆。", "将 warp 后的旧 planes 与新特征进行 confidence-weighted pooling，并通过 learned residual correction 融合信息，以更新记忆。", "Reader 从更新后的 HexMemory 检索 latents，作为条件信号输入后续视频生成，以维持场景一致性。"], "formulas": [{"tex": "\\widetilde{M}_t=\\frac{c_o\\odot\\mathcal{W}(M_{t-1})+c_n\\odot F_t}{c_o+c_n+\\varepsilon},\\qquad M_t=\\widetilde{M}_t+R_\\theta\\!\\left(\\widetilde{M}_t,\\mathcal{W}(M_{t-1}),F_t\\right)", "caption": "标准写法，非原文：以置信度加权融合 warp 后的旧记忆与当前 chunk 特征，再经 learned residual correction 更新固定容量记忆。"}], "train": "摘要未给训练流程与关键设置。推理时，writer 处理新 chunk 并更新 HexMemory，reader 从记忆中检索 latents 以条件化后续生成。", "diff": "相较于累积 RGB observations 或 latent features 的空间记忆，HexMemory 用固定大小的低秩表示存储特征，由六个空间与时空 planes 组成，存储量在生成期间保持恒定。它还通过 warp、confidence-weighted pooling 和 learned residual correction 融合新旧记忆；摘要未说明寻址键或显式锚点的具体实现。", "limits": "摘要未见明确说明具体代价与局限；记忆更新依赖对已有 planes 的 warp 和融合，但其误差影响与适用边界未给出。", "has_abstract": true}, "tags": ["恒定槽位", "显式锚点"], "explain": "这就像把随手乱堆的杂物箱，换成了一排贴着固定门牌的储物柜。模型处理长内容时，记忆往往会随文本变长而无休止膨胀，导致资源吃紧且难以定位。Honeycomb 的做法是采用恒定容量槽位和显式锚点。这里的恒定容量槽位，指不论输入多长都大小固定的记忆格子；显式锚点则像是在序列里立起清晰可见的参照标桩。这招之所以管用，在于锁死槽位容量能把内存开销控制在确定边界内，而明确的锚点给模型提供了可靠的对照坐标，防止信息在压缩中丢失相对位置。", "key_numbers": [], "self_measured": [], "media": ["https://jackswl.github.io/honeycomb/resources/revisit/living_honeycomb.mp4", "https://jackswl.github.io/honeycomb/resources/revisit/living_spatia.mp4"], "links": ["https://arxiv.org/abs/2609.37690"], "note": "摘要级；lane 无报告依据（L3 表头写『按位置或几何寻址』），存疑；只给到月份 2026-09。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 5266, "sx": null}, {"id": "causal-forcing", "title": "Causal Forcing: Autoregressive Diffusion Distillation Done Right for High-Quality Real-Time Interactive Video Generation", "date": "2026-02-02", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2602.02214", "venue": "", "training": "需训", "status": "速读", "one_liner": "用自回归教师补掉SF的架构错配", "mechanism": "指出Self-Forcing拿双向教师做ODE初始化与单向学生不匹配，改用自回归教师做ODE初始化，再走同一套DMD，把因果蒸馏的理论缺口补上。", "detail": {"position": "本文解决将预训练双向视频 diffusion model 蒸馏为少步自回归模型时的架构错配问题。作者指出，直接用双向教师进行 ODE 初始化不满足逐帧可逆映射条件，可能导致性能下降。", "io": "任务输入、条件信号及其具体表示摘要未说明；方法面向交互式视频生成。输出是少步自回归视频生成模型生成的视频。", "steps": ["以自回归教师进行 ODE 初始化，使初始化教师与自回归学生的因果架构匹配，从而弥补双向教师初始化带来的理论缺口。", "将初始化后的模型作为自回归学生，避免把不满足逐帧 injectivity 条件的双向教师流映射强行用于学生初始化。", "对学生应用与 Self Forcing 相同的 DMD 蒸馏流程，以训练少步自回归视频生成模型。"], "formulas": [{"tex": "p_\\theta(x_{1:T}\\mid c)=\\prod_{i=1}^{T}p_\\theta(x_i\\mid x_{<i},c)", "caption": "自回归视频生成的因果分解；标准写法，非原文"}, {"tex": "\\nabla_\\theta L_{\\mathrm{DMD}}=\\mathbb{E}_{t,z,c}\\!\\left[w(t)\\bigl(s_{\\mathrm{fake}}(x_t,t,c)-s_{\\mathrm{real}}(x_t,t,c)\\bigr)\\frac{\\partial x_\\theta}{\\partial\\theta}\\right]", "caption": "DMD 蒸馏的分布匹配梯度；标准写法，非原文"}], "train": "训练先用自回归教师进行 ODE 初始化，再采用 Self Forcing 中相同的 DMD 流程。推理目标是少步自回归实时交互式视频生成；具体训练配置与推理设置摘要未给。", "diff": "Self Forcing 使用双向教师做 ODE 初始化，而本文改用自回归教师，使教师与学生的因果架构相匹配。之后仍沿用 Self Forcing 的 DMD 流程。", "limits": "摘要未见明确说明方法的计算代价、局限或适用范围。", "has_abstract": true}, "tags": ["因果蒸馏", "教师学生一致", "DMD"], "explain": "想象你边玩游戏边转动镜头，画面必须立刻接住你的动作，不能偷看未来再补帧。Self-Forcing 是一种自回归视频生成方法：每次只根据已有画面预测下一段；麻烦在于，它用能同时看前后画面的教师来初始化生成轨迹，学生却只能看过去，学到的起步方式与实际生成不一致。Causal Forcing 改用同样按时间顺序生成的教师来初始化轨迹，再用分布匹配蒸馏（DMD，让学生生成结果贴近教师）训练。教师和学生因此沿着相同的因果路径学习，弥补了蒸馏中的架构错配。实验中，动态程度提升19.3%，视觉奖励提升8.7%，指令遵循提升16.7%。", "key_numbers": ["Dynamic Degree +19.3%", "VisionReward +8.7%", "Instruction Following +16.7%"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.02214", "https://github.com/thu-ml/Causal-Forcing", "https://thu-ml.github.io/CausalForcing.github.io/"], "note": "现在已是minWM、Astronex等框架的默认蒸馏配方，可视为因果蒸馏支的\"更正基线\"，优先级应高于清单里只做速读的 Self-Forcing。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 5406, "sx": null}, {"id": "context-forcing", "title": "Context Forcing: Consistent Autoregressive Video Generation with Long-Context Forcing", "date": "2026-02-05", "precision": "day", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2602.06028", "venue": "", "training": "需训", "status": "速读", "one_liner": "教师也看全程历史，学生才能长一致", "mechanism": "让教师同样拿到完整生成历史以消掉监督错配，再把线性增长的上下文改成Slow-Fast记忆架构压视觉冗余，使超长时长训练可算，有效上下文超20秒。", "detail": {"position": "本文针对长视频自回归生成中的长程一致性不足，尤其是短上下文教师无法监督学生学习全局时间依赖的问题。目标是让模型在较长生成过程中保持跨时间的一致性。", "io": "输入为视频生成所需条件及生成历史，具体条件信号摘要未说明；输出为自回归生成的长视频。", "steps": ["让教师访问完整生成历史，为学生提供包含长程依赖的监督，以消除师生上下文不匹配。", "训练具备长上下文能力的学生，使其依据完整历史进行长程视频生成。", "将线性增长的视觉上下文组织为 Slow-Fast Memory，减少冗余并控制超长时长下的计算开销。"], "formulas": [{"tex": "\\mathcal{L}_{\\mathrm{distill}}=D_{\\mathrm{KL}}\\!\\left(p_{\\theta}(x_{t+1:t+K}\\mid x_{\\le t})\\,\\middle\\|\\,p_{\\mathrm{T}}(x_{t+1:t+K}\\mid x_{\\le t})\\right)", "caption": "标准写法，非原文；表示学生与教师在相同完整历史上下文下，对后续视频片段分布进行蒸馏。"}, {"tex": "M_t=\\operatorname{Concat}\\!\\left(\\operatorname{Pool}(x_{\\le t-r}),\\;x_{t-r+1:t}\\right)", "caption": "标准写法，非原文；表示 Slow-Fast 记忆将较早历史压缩为慢记忆，并保留最近片段作为快记忆。"}], "train": "训练时使用长上下文教师监督长上下文学生，并通过 Slow-Fast Memory 管理上下文；摘要未给出具体损失函数、训练配置及推理流程细节。", "diff": "已有流式调优方法通常让短上下文教师监督长上下文学生，教师因看不到长期历史而造成监督错配。Context Forcing 让教师也访问完整生成历史，并用 Slow-Fast Memory 支持更长上下文。", "limits": "摘要指出超长时长需要上下文管理以降低计算开销；其他明确局限未见说明。", "has_abstract": true}, "tags": ["长上下文教师", "Slow-Fast记忆", "监督错配"], "explain": "想象一段不断延续的长镜头：人物放下杯子，几十秒后杯子仍该在原处。视频模型逐步预测后续画面，时间一长容易忘记细节、动作前后矛盾；若训练时教师只看短片段，学生却要面对完整历史，指导就会错位。Context Forcing让教师和学生都读取截至当前的完整生成历史，消除这种监督错配。可历史越长，处理成本越高，于是论文用慢快记忆架构压缩视觉冗余：快记忆保留近期变化，慢记忆概括较久远内容。这样既让指导贴近实际生成，也控制计算开销，有效上下文超过20秒，是LongLive和Infinite-RoPE的2到10倍。", "key_numbers": ["有效上下文>20秒", "比LongLive/Infinite-RoPE长2-10倍"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.06028"], "note": "与 Self-Forcing 的差别是\"教师的视野\"而非\"学生的步数\"，正好补上清单里恒定上下文支只有 FramePack/Honeycomb 的空档。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 5266, "sx": null}, {"id": "longforcing", "title": "LongForcing: Scaling Temporal Manifold Matching for Long-Horizon World Models", "date": "2026-10-13", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2610.18289", "venue": "", "training": "需训", "status": "速读", "one_liner": "把监督拉到学生的长自rollout上", "mechanism": "保留短程teacher-forcing与因果ODE蒸馏两段，第三段把realscore教师换成双向长程教师，直接监督学生的长自rollout，不改架构也不加推理开销。", "detail": {"position": "这篇研究自回归视频扩散模型在超出训练窗口进行长程 rollout 时出现的渐进漂移，包括画质下降、运动不一致和物体身份丢失。核心问题是短程蒸馏缺少对后续 rollout 状态的直接监督。", "io": "输入包括文本条件的视频生成输入，或动作条件的交互式世界模型输入；条件信号分别是文本或动作。输出是生成的视频或长程世界 rollout。", "steps": ["先进行短程 teacher-forcing，使学生模型学习短窗口内的生成行为，为后续蒸馏建立基础。", "再进行因果 ODE 蒸馏，保留短程因果生成能力，使学生适用于自回归 rollout。", "最后让学生生成扩展时域的自 rollout，并由双向长程教师进行 distribution matching，以直接监督短程训练未覆盖的后续状态。"], "formulas": [{"tex": "\\nabla_\\theta \\mathcal{L}_{\\mathrm{long}}=\\mathbb{E}_{x_0\\sim p_\\theta^{\\mathrm{roll}},\\,t,\\,\\epsilon}\\!\\left[w(t)\\bigl(s_\\theta(x_t,t)-s_{\\mathrm{bi}}(x_t,t)\\bigr)\\frac{\\partial x_0}{\\partial\\theta}\\right],\\qquad x_t=\\alpha_t x_0+\\sigma_t\\epsilon", "caption": "长程 rollout 的分布匹配蒸馏梯度，以双向长程教师的 score 监督学生；标准写法，非原文"}], "train": "训练保留短程 teacher-forcing 和因果 ODE-distillation 两阶段；最终 distribution-matching 阶段将 realscore teacher 替换为扩展时域的双向教师，用其监督学生的长程自 rollout。摘要未给具体训练超参数。推理时不修改学生架构，也不增加推理开销。", "diff": "已有短程蒸馏主要匹配短窗口分布，未必能约束长程行为。LongForcing 将教师监督扩展到学生的长程自 rollout，并在最终 distribution-matching 阶段使用双向长程教师。", "limits": "摘要未见明确说明训练代价与方法局限；推理阶段不增加开销。", "has_abstract": true}, "tags": ["长程教师", "分布匹配", "时间轴扩监督"], "explain": "像让学生先照着范例画几笔，再独自画完整幅长卷：短视频里画得像，不代表连续生成很久也不走样。长时生成的麻烦正是误差会一帧帧累积，训练时看真实画面、生成时却要接着自己的结果往下画。LongForcing保留两步训练：先用真实画面教短程生成，再用因果常微分方程蒸馏，让学生学会逐步生成。随后，它把真实评分教师换成能看前后画面的长程教师，直接纠正学生自己生成的长视频。这样训练目标更贴近实际使用，能压住长期漂移；不改模型架构，也不增加推理开销。结果，VBench画质得分达85.52，WorldRoamBench上60秒动作分提高23.9分，并压力测试到24小时连续生成。", "key_numbers": ["VBench Quality 85.52", "WorldRoamBench 60s 动作分+23.9", "压力测到24小时rollout"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.18289", "https://github.com/Fantasy-AMAP/LongForcing"], "note": "与 LongTake 同月、都在动\"第三段教师\"，但 LongForcing 只换教师、LongTake 改初始化，可对照读。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 5406, "sx": null}, {"id": "forgewm", "title": "ForgeWM: Progressive Causal Training for Few-Step Action-Conditioned Video World Models", "date": "2026-08-14", "precision": "day", "lane": "训练侧", "branch": "三段训练", "arxiv": "2608.14022", "venue": "", "training": "需训", "status": "速读", "one_liner": "四段渐进因果训练换1/2/4步预算", "mechanism": "领域适配→因果teacher-forcing→因果一致性蒸馏→on-policy DMD四段递进，产出1/2/4步专用学生；另给\"一步先出草稿、回放时再去噪精修\"的双路部署。", "detail": {"position": "这篇论文要解决动作条件视频世界模型的低延迟因果生成问题，重点是让键盘离散状态与鼠标连续运动在压缩后的潜变量时间块中保持对齐。它将双向动作条件视频生成器逐步转为适用于交互的少步世界模型。", "io": "输入是视频上下文与游戏原生动作控制信号，包括键盘状态、鼠标运动或 gamepad 控制；动作作为条件信号与视频潜变量时间块对齐。输出是受动作控制的未来视频，学生模型分别针对 1、2、4 步去噪预算进行专门化。", "steps": ["先对双向动作条件视频生成器进行领域适配，使模型适应目标游戏及其轨迹数据。", "再进行 teacher-forced 因果训练，让模型按因果顺序利用历史上下文和动作生成视频，以建立自回归生成能力。", "随后进行因果一致性蒸馏，使因果学生的生成结果与教师模型保持一致，适配压缩后的因果生成过程。", "最后使用双向教师进行 on-policy distribution matching，让学生在自身生成分布上训练，降低自回归 rollout 时的分布偏移。", "部署时提供 1、2、4 步预算专用学生；还可让一步学生先生成并保存草稿，在回放阶段对草稿重新加噪并精修。"], "formulas": [{"tex": "\\mathcal{L}_{\\mathrm{TF}}(\\theta)=\\mathbb{E}_{(z_{1:T},a_{1:T})}\\!\\left[\\sum_{t=1}^{T}-\\log p_{\\theta}(z_t\\mid z_{<t},a_{\\le t})\\right]", "caption": "标准写法，非原文：基于历史潜变量与动作的因果 teacher-forcing 训练目标"}, {"tex": "\\nabla_{\\theta}\\mathcal{L}_{\\mathrm{DMD}}=\\mathbb{E}_{\\epsilon,t}\\!\\left[\\bigl(s_{\\mathrm{fake}}(x_t,t)-s_{\\mathrm{teacher}}(x_t,t)\\bigr)\\frac{\\partial x_{\\theta}}{\\partial\\theta}\\right]", "caption": "标准写法，非原文：on-policy 分布匹配中，利用学生与教师的 score 差异更新学生"}], "train": "训练按领域适配、teacher-forced 因果训练、因果一致性蒸馏、on-policy distribution matching 四阶段递进，得到稳态去噪预算为 1、2、4 步的学生。摘要未给出损失函数、数据规模、模型结构等细节。推理时可直接用少步学生生成，也可采用双路部署：交互时优先输出一步草稿，回放时再对已保存草稿去噪精修；摘要报告精修质量可匹配四步参考，同时比从噪声重新生成更接近已体验轨迹。", "diff": "与仅将因果蒸馏用于少步视频合成的做法不同，ForgeWM 将动作对齐和自回归分布偏移纳入渐进训练流程，并通过 on-policy distribution matching 使用双向教师训练学生。它还提供草稿复用的回放时精修路径，而不只是在交互时重新生成。", "limits": "摘要未见明确说明方法局限、训练成本或部署资源需求。", "has_abstract": true}, "tags": ["渐进因果训练", "预算专用学生", "回放精修"], "explain": "想象机器人在仓库里转弯：世界模型要预演它按下指令后的画面，采样步数越多越慢，步数骤减又容易让视频失真。ForgeWM要解决的正是速度与画质难两全。它先适配目标领域，再用因果教师强制训练，让模型只依据过去预测未来；接着蒸馏因果一致性，使少步预测仍与多步结果对齐；最后用在策略分布匹配，让学生在自己生成的画面上继续变好。四阶段训练产出专用的1、2、4步模型。因果约束贴近真实生成顺序，逐步蒸馏也减少压缩误差，因此少步仍能保住质量。部署时还可先一步出草稿，回放时再去噪精修，效果约等于4步生成；比从噪声重新生成，精修快近3倍。", "key_numbers": ["1/2/4 步三档", "回放精修≈4步质量", "比从噪声重生近3倍"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2608.14022"], "note": "key_numbers 里的\"3倍\"指与经验轨迹更接近（reference LPIPS 最低），原文表述为 roughly three times closer；动作条件版三段训练的代表。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 5660, "sx": null}, {"id": "causal-rcm", "title": "Causal-rCM: A Unified Teacher-Forcing and Self-Forcing Open Recipe for Autoregressive Video Diffusion", "date": "2026-06-24", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2606.25473", "venue": "", "training": "需训", "status": "速读", "one_liner": "TF连续时间CM初始化+SF的DMD精修", "mechanism": "把因果蒸馏拆成两段：teacher-forcing连续时间一致性模型做初始化，self-forcing的反向散度DMD做精修；自研mask JVP核支持sCM/MeanFlow，收敛快一个量级。", "detail": {"position": "本文研究如何将扩散蒸馏用于因果自回归视频生成，使模型能以少量采样步进行流式生成，并支持交互式世界建模。核心思路是先用 Teacher-Forcing 连续时间一致性模型初始化，再用 Self-Forcing 的 DMD 精修。", "io": "输入为生成条件，摘要明确涉及文本到视频以及动作条件生成；具体输入表示未说明。输出为按帧或按块流式生成的视频，或动作条件下的交互式世界模型生成结果。", "steps": ["采用 Teacher-Forcing 训练因果连续时间一致性模型，以离线前向散度学习作为初始化。", "使用自定义 mask 的 FlashAttention-2 JVP kernel 支持 sCM 或 MeanFlow 训练，以加速连续时间一致性模型收敛。", "将初始化后的模型交给 Self-Forcing 阶段，在模型自身生成轨迹上用 DMD 做反向散度精修，以改善自回归生成表现。", "将统一训练配方用于帧式和块式因果视频生成，并扩展到动作条件世界模型。"], "formulas": [{"tex": "\\mathcal{L}_{\\mathrm{TF}}(\\theta)=\\mathbb{E}_{x_0,t,\\Delta t,\\,c_{\\le k}}\\left[\\left\\|f_\\theta(x_t,t,c_{\\le k})-\\operatorname{sg}\\!\\left(f_{\\bar\\theta}(x_{t-\\Delta t},t-\\Delta t,c_{\\le k})\\right)\\right\\|_2^2\\right]", "caption": "Teacher-Forcing 阶段的连续时间一致性蒸馏损失，用于初始化因果一致性模型；标准写法，非原文"}, {"tex": "\\nabla_\\theta\\mathcal{L}_{\\mathrm{SF\\text{-}DMD}}=\\mathbb{E}_{x_t\\sim p_\\theta^{\\mathrm{roll}},\\,t}\\left[w(t)\\left(s_\\theta(x_t,t)-s_{\\mathrm{T}}(x_t,t)\\right)^{\\!\\top}\\frac{\\partial x_t}{\\partial\\theta}\\right]", "caption": "Self-Forcing 阶段在模型自身滚动生成轨迹上进行的 DMD 反向散度精修，匹配学生与教师的扩散分数；标准写法，非原文"}], "train": "训练分为 Teacher-Forcing 连续时间一致性模型初始化和 Self-Forcing DMD 精修两阶段。摘要称训练仅使用合成数据，并报告自研 JVP kernel 相比离散时间 CM 收敛快 10 倍；推理可用 1 或 2 步采样，Wan2.1-1.3B 的 2 步因果模型取得 VBench-T2V 84.63。其他训练细节摘要未给。", "diff": "相较于单独使用一致性模型或 DMD，本文将 Teacher-Forcing 的前向散度训练与 Self-Forcing 的反向散度精修结合，并将其用于自回归视频扩散。另以自定义 mask 的 FlashAttention-2 JVP kernel 实现连续时间 CM 训练，摘要称其较离散时间 CM 收敛更快。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["连续时间CM", "JVP内核", "开源配方"], "explain": "想象一台边看前几帧、边续写后续画面的机器：训练时若总能看到完整答案，真正逐帧生成时却要靠自己接龙，画面就容易跑偏；直接训练它独立接龙，又很难学得快。Causal-rCM把训练拆成两段：先用教师强制，让模型在参考答案引导下学习连续时间的一致性，也就是不同生成时刻的结果彼此协调；再用自我强制，让模型按实际接龙方式生成，并通过分布匹配蒸馏（DMD）修正生成结果与目标分布的差距。作者还设计了处理因果遮罩的快速求导内核，支持两类一致性训练方法，大幅缩短计算时间。这样先打基础、再贴近真实生成精修，既减少训练和推理之间的落差，也加快收敛。模型仅用合成数据训练，生成视频只需两步，在VBench文生视频评测中得分84.63，收敛速度提升约十倍。", "key_numbers": ["2步 VBench-T2V 84.63", "收敛快10×", "纯合成数据"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.25473"], "note": "唯一明确给出\"TF-CM 是 SF-DMD 最佳初始化\"这一实验结论的论文，把三段训练里第一段该怎么选讲清楚了；作者还把配方套到 Cosmos 3 上做成动作条件交互世界模型。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 5406, "sx": null}, {"id": "longtake", "title": "LongTake: Learning to Sustain Dynamics in Long-Horizon Video Generation", "date": "2026-09-29", "precision": "day", "lane": "训练侧", "branch": "三段训练", "arxiv": "2609.38562", "venue": "", "training": "需训", "status": "速读", "one_liner": "长程TF初始化替掉中间少步蒸馏", "mechanism": "用长真值前缀把直接监督推过训练视界，让模型学会维持动态与画质；该初始化直接对接DMD、省掉中间少步蒸馏，再用Hybrid DMD把监督延到self-rollout后段。", "detail": {"position": "本文解决 autoregressive 视频扩散模型在长时间生成中逐渐静止或画质下降的问题。核心思路是用长视频监督模型学习如何在长时段内持续演化场景动态。", "io": "训练时输入真实长视频的长帧前缀，模型据此预测后续帧；生成时以视频前缀为条件进行 autoregressive rollout，输出长时段视频。摘要未说明额外的文本或其他条件信号。", "steps": ["从整理后的真实长视频构造长前缀与后续帧训练样本，以延长直接监督覆盖的时间范围。", "进行 Long-Horizon Teacher Forcing，让模型依据长真值前缀预测后续帧，以学习持续动态并维持画质。", "将该阶段得到的初始化直接用于 DMD，在 student self-rollout 下进行分布匹配蒸馏，以省去标准流程中的中间少步蒸馏。", "使用 Hybrid DMD 将监督延伸到 self-rollout 的较后帧，同时保留初始窗口的双向联合监督，以加强长程生成监督。"], "formulas": [{"tex": "\\mathcal{L}_{\\mathrm{LHTF}}(\\theta)=\\mathbb{E}_{\\mathbf{x}_{0:T},\\,\\tau,\\,t,\\,\\boldsymbol{\\epsilon}}\\left[\\left\\|\\boldsymbol{\\epsilon}-\\boldsymbol{\\epsilon}_{\\theta}\\left(\\mathbf{x}_{t}^{\\tau:\\tau+K-1};\\,\\mathbf{x}_{0:\\tau-1}^{\\mathrm{gt}}\\right)\\right\\|_{2}^{2}\\right]", "caption": "Long-Horizon Teacher Forcing：使用长真值前缀条件化未来视频片段的扩散噪声预测损失；标准写法，非原文"}, {"tex": "\\mathcal{L}_{\\mathrm{Hybrid\\text{-}DMD}}=\\mathbb{E}\\left[\\sum_{k=1}^{L}w_k\\,\\ell_{\\mathrm{joint\\text{-}DMD}}\\!\\left(\\hat{\\mathbf{x}}_{k}^{\\mathrm{TF}},\\mathbf{x}_{k}^{\\mathrm{gt}}\\right)+\\sum_{k=L+1}^{T}w_k\\,\\ell_{\\mathrm{DMD}}\\!\\left(\\hat{\\mathbf{x}}_{k}^{\\mathrm{roll}}\\right)\\right]", "caption": "Hybrid DMD：初始窗口保留真值前缀下的联合监督，并将DMD监督延伸到student self-rollout的后续帧；标准写法，非原文"}], "train": "训练分为 Long-Horizon TF 与 DMD 两阶段，后者直接承接长程 TF 初始化，不经过中间少步蒸馏。摘要提到在相同的五秒 DMD 训练设置下进行比较，并说明 Hybrid DMD 的监督同时覆盖初始窗口与 self-rollout 后续帧；更具体的训练超参数未给出。推理采用 autoregressive 长时段 rollout，评估包含 30 秒与 60 秒生成。", "diff": "相较于依赖短视频 TF 初始化并经过中间少步蒸馏的标准流程，LongTake 用长真值前缀扩展直接监督，并将所得初始化直接对接 DMD。Hybrid DMD 还把监督延伸到 self-rollout 后段，同时保留初始窗口的双向联合监督。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["长程TF初始化", "Hybrid DMD", "动态度"], "explain": "想象镜头跟着滑板少年穿过街区：短片里动作流畅，时间一长，人物可能变形，画面也会变糊。LongTake要解决的正是长视频越生成越失真的问题。它先用真实视频的长前缀训练模型，并把这种逐帧依据真实历史学习的方式称为教师强制；监督因此能越过原有训练视界，让模型学会持续保持动作和画质。这个初始化可直接接入分布匹配蒸馏，即让生成结果贴近真实视频分布，无须先做中间的少步蒸馏。随后，混合式蒸馏再把监督延伸到模型自己生成的后续片段。结果显示，模型可自回滚生成30秒或60秒视频，并在动态感与美感的权衡上达到更好的前沿。", "key_numbers": ["30s/60s self-rollout", "无中间少步蒸馏", "动态度-美学Pareto前沿"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.38562"], "note": "核心反直觉点：长程TF初始化本身就够用，中间少步蒸馏段可以砍掉，训练流水线因此短一环。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 5774, "sx": null}, {"id": "glance-forcing", "title": "Glance Forcing: Making Bidirectional Diffusion Autoregressive at a Glance", "date": "2026-10-14", "precision": "day", "lane": "训练侧", "branch": "因果蒸馏", "arxiv": "2610.20220", "venue": "", "training": "需训", "status": "速读", "one_liner": "按噪声区间拆两个专家做少步蒸馏", "mechanism": "高噪段管布局与运动、低噪段管纹理，两段曲率与优化行为不同，单学生必然互相干扰；故拆成慢/快双专家各配目标、教师全冻，只需一条PF-ODE轨迹。", "detail": {"position": "本文解决将双向 diffusion model 转成因果少步 autoregressive 视频生成模型时，PF-ODE 轨迹采集成本过高，以及极少轨迹监督导致生成质量崩塌的问题。核心思路是按噪声区间拆分去噪过程，以减轻不同阶段联合拟合造成的表示干扰。", "io": "输入为视频生成过程中的噪声状态及其条件信号，输出为因果 autoregressive 生成的视频；摘要未明确条件信号的具体形式。方法使用冻结的预训练双向 diffusion teacher 提供轨迹监督。", "steps": ["从冻结 teacher 采集 PF-ODE 去噪轨迹，并将监督压缩到单条轨迹，以大幅降低轨迹采集成本。", "按噪声区间拆分去噪过程：高噪阶段交由 slow expert 处理语义布局与运动，低噪阶段交由 fast expert 处理细节纹理，以避免单一学生模型同时拟合两种不同的轨迹几何。", "为两个 expert 配置各自对应阶段的训练目标，先通过 PF-ODE distillation 调整少步轨迹几何，再通过 distribution matching 改善生成分布质量。", "推理时由 slow 与 fast expert 分段完成去噪，生成因果 autoregressive 视频；摘要未给出具体调度方式。"], "formulas": [{"tex": "\\mathcal{L}_{\\mathrm{PF}}^{(e)}=\\mathbb{E}_{(x_t,t)\\sim\\tau_{\\mathrm{teacher}}}\\left[\\left\\|v_{\\theta_e}(x_t,t)-v_{\\mathrm{teacher}}(x_t,t)\\right\\|_2^2\\right],\\quad e\\in\\{\\mathrm{slow},\\mathrm{fast}\\}", "caption": "标准写法，非原文：在教师 PF-ODE 轨迹上对各阶段专家进行速度场蒸馏。"}, {"tex": "v_{\\theta}(x_t,t)=\\begin{cases}v_{\\theta_{\\mathrm{slow}}}(x_t,t),&t\\in\\mathcal{T}_{\\mathrm{high}}\\\\v_{\\theta_{\\mathrm{fast}}}(x_t,t),&t\\in\\mathcal{T}_{\\mathrm{low}}\\end{cases}", "caption": "标准写法，非原文：按高噪与低噪区间切换慢、快专家。"}], "train": "训练时冻结预训练 teacher，以 PF-ODE 轨迹监督两个分阶段 expert；摘要称仅需一条轨迹，轨迹采集成本约为一张 A100 GPU 运行一小时。PF-ODE distillation 主要使少步轨迹几何更直，后续 distribution-matching 阶段独立提升分布质量。推理采用 slow/fast expert 分段去噪，具体步数、损失形式及调度细节摘要未给。", "diff": "已有方法通常将双向 diffusion model 蒸馏为因果少步学生，并依赖大量离线 PF-ODE 轨迹；Glance Forcing 则用单条轨迹监督，并将高、低噪阶段拆给不同 expert、分别配置目标。该方法还区分轨迹几何优化与分布质量优化的作用，并保持 teacher 完全冻结。", "limits": "摘要未见明确说明适用范围、推理开销或失败情形；方法仍需 PF-ODE 轨迹采集及训练两个 expert，具体训练和推理成本未给。", "has_abstract": true}, "tags": ["双专家蒸馏", "噪声分区", "教师冻结"], "explain": "想象画师先铺出整段视频的动作草图，再补上衣料纹理：前者要看远处布局，后者要盯住细节。双向扩散能同时看整段视频，却不擅长逐段快速生成；把它蒸馏成少步模型时，单个学生还得兼顾两种任务，容易互相干扰。Glance Forcing按噪声区间分工：高噪声阶段由慢专家把握布局和运动，低噪声阶段由快专家补足纹理。因为两段生成轨迹的弯曲程度和训练方式不同，拆开学习更合适。训练时教师保持冻结，只需一条概率流常微分方程轨迹——一种把生成过程写成连续确定路径的方式。结果是少步生成仍保质量，VBench得分从84.04升到84.22。", "key_numbers": ["VBench 84.04→84.22", "单条ODE轨迹", "教师冻结"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.20220"], "note": "顺带给出一个可迁移结论：PF-ODE蒸馏主要拉直轨迹几何，分布质量是后面分布匹配那一步单独决定的。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 5520, "sx": null}, {"id": "memory-forcing-train", "title": "Memory Forcing: Attendable Mid-Horizon History for Streaming Video Generation", "date": "2026-10-08", "precision": "day", "lane": "训练侧", "branch": "恒定上下文", "arxiv": "2610.11756", "venue": "", "training": "需训", "status": "速读", "one_liner": "固定缓存里塞进中程历史银行", "mechanism": "把定长KV切成sink/archive/working三段，归档区专门留多样中程事件；绝对时间索引越界后用Bank-aware RoPE在注意力时重编索引，使各bank可区分，缓存不加。", "detail": {"position": "本文解决流式视频生成中的 mid-horizon forgetting：固定大小的 KV cache 通常只保留开头
