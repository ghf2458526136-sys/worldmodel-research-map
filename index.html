: true}, "tags": ["摘要槽压缩", "位置重写"], "explain": "就像把上百页旧笔记浓缩成几张便签夹在书前，翻阅时页码却全乱了套。大模型也面临这种麻烦：为了省显存，它需要用摘要槽把冗长历史压缩进键值缓存——也就是模型暂存上文信息的记事本，但压缩后原本标明词语先后顺序的位置编码就会失真。MemRoPE 走的是记忆结合位置重写路线，直接对压缩后的记忆重新分配位置坐标。这招管用在于，它既把庞大历史打包进紧凑的记忆槽节省了空间，又靠重写位置帮模型捋顺了时间线，在查阅压缩记忆时依然能分清先后因果。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.12513"], "note": "同上，来自 §3.6 合并提及 + §12 历史文献；L2 级归属来自 §1.3 表格。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 2070, "sx": null}, {"id": "matrix-game-3", "title": "Matrix-Game 3.0", "date": "2026-04-01", "precision": "month", "lane": "位置时间寻址", "branch": "锚 sink", "arxiv": "2604.08995", "venue": "", "training": "需训", "status": "精读", "one_liner": "边玩边生成的 5B 交互世界模型", "mechanism": "按位姿与视野重叠挑历史帧，用 Plücker 编码相机相对几何；首帧 latent 作持久 sink，误差 δ 下一轮按 γ 注入。", "detail": {"position": "Matrix-Game 3.0 面向需要长时序一致性与实时交互的世界模型生成，目标是在高分辨率下持续生成可交互视频。它通过记忆增强和推理加速，缓解长视频生成中的记忆不足与速度受限问题。", "io": "输入为交互过程中的动作、提示及相机位姿等条件信号，模型据此生成后续视频帧。生成时可检索历史帧作为记忆，并利用相机相对几何信息维持跨时间一致性。", "steps": ["构建融合 Unreal Engine 合成数据、AAA 游戏自动采集数据和真实视频增强的 Video-Pose-Action-Prompt 数据，以规模化提供带动作与位姿条件的训练样本。", "训练模型预测生成残差，并在训练中重新注入不完美的生成帧，使模型学会修正自身误差，提升长时序生成稳定性。", "依据相机位姿和视野重叠检索历史帧，再用 Plücker 编码相机相对几何并注入记忆，以增强长时空一致性；首帧 latent 作为持久 sink 保留。", "采用基于 Distribution Matching Distillation 的多段自回归蒸馏，并结合模型量化与 VAE decoder 剪枝，以降低推理开销、支持实时生成。"], "formulas": [{"tex": "\\mathcal{M}_t=\\operatorname{TopK}_{i<t}\\,s\\!\\left((T_t,T_i),\\,\\operatorname{Overlap}(V_t,V_i)\\right)", "caption": "按相机位姿与视野重叠检索历史帧的标准写法，非原文"}, {"tex": "z_{t+1}^{\\mathrm{in}}=z_{t+1}+\\gamma\\,\\delta_t", "caption": "将生成误差按系数 γ 注入下一轮状态的标准写法，非原文"}], "train": "训练数据为 Video-Pose-Action-Prompt 四元组；长时序训练通过预测残差和重新注入不完美生成帧实现自校正，并使用相机感知的记忆检索与注入。推理采用多段自回归蒸馏，结合模型量化和 VAE decoder 剪枝。摘要报告 5B 模型可在 720p 下最高达到 40 FPS，扩展至 2x14B 可提升生成质量、动态表现与泛化能力。", "diff": "相较于仅依赖当前上下文生成的交互视频方法，本文结合相机感知的历史帧记忆与训练时自校正，面向分钟级长序列维持一致性。它还将多段自回归蒸馏、量化和 VAE decoder 剪枝结合，用于高分辨率实时推理。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["首帧sink", "Plücker几何", "误差回注"], "explain": "想象你在玩游戏探索房间，一转身刚才的桌椅全走样了，这篇论文解决的就是交互世界模型在边玩边生成时画面容易漂移变形的麻烦。团队的做法是按视角重叠挑选历史帧，用 Plücker 编码这种把空间光线位置与方向统一打包的几何工具记录机位变化；同时把首帧 latent，也就是初始画面的特征压缩向量，固定为长期记忆锚点，并将上一轮生成的误差按比例注入下一轮修正。这套机制管用在它让模型转动视角时能严密对齐几何空间，不让预测偏差滚雪球累积，从而在低延迟下维持了画面的长程一致。", "key_numbers": ["5B", "2×14B", "720p 40FPS", "约 5.2 倍加速", "15s 1080p/30fps"], "self_measured": [], "media": ["demos/MatrixGame3/teaser.mp4"], "links": ["https://arxiv.org/abs/2604.08995"], "note": "报告只给到月份 2026-04；FPS 为宣传口径，需多卡 DiT。", "parent": "rolling-forcing", "link_strength": "dashed", "key": false, "citations": 0, "x": 2132, "y": 1930, "sx": 736, "sy": 1980.0, "cross": false}, {"id": "echo-forcing", "title": "Echo-Forcing", "date": "2026-05-01", "precision": "month", "lane": "位置时间寻址", "branch": "实体挂载", "arxiv": "2605.16003", "venue": "", "training": "需训", "status": "速读", "one_liner": "组内 Echo 系列：记忆加位置重写路线", "mechanism": "报告未展开，只归入组内『记忆+位置重写』路线，细节另开笔记。", "detail": {"position": "Echo-Forcing 面向交互式长视频生成，解决提示词切换时旧场景污染新场景、响应延迟，以及历史场景难以召回的问题。它将历史 KV 状态按功能拆分，并支持在有限缓存预算下处理场景切换与回忆。", "io": "输入为视频生成提示词及生成过程中积累的历史 KV 状态，提示词可发生切换；输出为支持平滑过渡、硬切和长程场景召回的长视频。", "steps": ["将历史 KV 状态划分为稳定锚点、压缩历史和近期窗口，并在 relative RoPE 下管理它们，以区分长期场景信息与近期动态。", "把历史场景压缩为具有空间结构的 Scene Recall Frames，并表示为 KV，以便后续提示词需要时召回旧场景。", "根据新旧场景的差异自适应衰减冲突 token，以减少过时背景对新提示词的干扰。", "在有界缓存预算下组合稳定锚点、压缩历史、近期窗口与召回信息，生成视频并支持不同类型的场景切换。"], "formulas": [{"tex": "\\operatorname{Attn}(Q,K,V)=\\operatorname{softmax}\\!\\left(\\frac{(R(p_Q)Q)(R(p_K)K)^\\top}{\\sqrt{d}}\\right)V,\\qquad (K,V)=\\operatorname{Concat}\\bigl((K,V)_{\\mathrm{anchor}},(K,V)_{\\mathrm{compressed}},(K,V)_{\\mathrm{recent}},(K,V)_{\\mathrm{recall}}\\bigr)", "caption": "标准写法，非原文：对不同功能的历史 KV 记忆拼接，并在注意力中施加 RoPE 位置编码。"}], "train": "方法为 training-free，无需训练；推理时通过分层管理历史 KV、构造 Scene Recall Frames，并依据场景差异衰减冲突 token。摘要未给出具体推理参数或实现设置。", "diff": "既有 training-free 长视频优化主要针对单一提示词下的稳定延展，并用同一缓存策略处理稳定锚点和近期动态。Echo-Forcing 将历史记忆分层、支持空间结构化的场景召回，并依据新旧场景差异调整遗忘。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["实体挂载", "记忆位置重写"], "explain": "就像看长篇小说时随手夹的书签被风吹乱，导致翻到后面完全搞不清前因后果一样，模型在处理长上下文时很容易遗忘前面的内容，还会把先后次序搞混。这篇工作解决的就是上下文丢失和位置混乱的麻烦。它采用组内经典的记忆加位置重写路线，所谓位置重写，通俗讲就是给保留下来的历史记忆重新编排准确的顺序编号。这招之所以管用，是因为它一边把过去的信息妥善留存，一边理顺了它们与当前输入的相对位置，让模型既看得见旧记忆，又不会被错乱的顺序带偏。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.16003"], "note": "同上，来自 §3.6 的合并提及 + §12 参考文献，报告无独立描述。", "parent": "rolling-forcing", "link_strength": "dashed", "key": false, "citations": 0, "x": 2406, "y": 2324, "sx": 736, "sy": 1980.0, "cross": false}, {"id": "echo-infinity", "title": "Echo-Infinity", "date": "2026-06-01", "precision": "month", "lane": "位置时间寻址", "branch": "实体挂载", "arxiv": "2606.04527", "venue": "", "training": "需训", "status": "速读", "one_liner": "组内 Echo 系列：记忆加位置重写路线", "mechanism": "报告未展开，只归入组内『记忆+位置重写』路线，细节另开笔记；本组 EchoActive 的 r_sink 与 Rolling Forcing 相似。", "detail": {"position": "Echo-Infinity 面向自回归视频生成中历史长度不断增长、有限缓存难以保留长期信息的问题，目标是在计算成本恒定的条件下支持任意长度的视频生成。它通过可学习的演化记忆和相对时间位置重写，降低长期生成中的信息损失与误差累积。", "io": "输入为自回归生成所需的局部视频帧、历史记忆状态及生成条件；具体条件信号未说明。输出为逐帧生成的视频，以及随历史更新的记忆状态。", "steps": ["模型在局部窗口内自回归生成视频帧，以局部上下文维持当前生成的连贯性。", "当旧帧从局部窗口中移出时，使用 Memory Query 通过注意力读取这些历史信息，并通过门控机制更新记忆，以抽象和压缩被移出的内容。", "将更新后的记忆作为后续生成的历史信息，使记忆随生成过程演化，并以恒定计算成本支持任意长度历史。", "使用 Unified Relative RoPE Recipe 重设时间位置：sink 帧从位置 0 开始，最新帧的位置不超过模型预训练的最大时间 RoPE 位置，以缓解有限位置范围及训练推理位置差异。", "将 Memory Query 与视频 DiT 端到端优化，使其形成可泛化的生成先验；仅使用优化后的初始记忆状态时也可改善生成质量。"], "formulas": [{"tex": "r_t=\\operatorname{softmax}\\!\\left(\\frac{Q_tK_{\\mathrm{old}}^{\\top}}{\\sqrt{d}}\\right)V_{\\mathrm{old}}", "caption": "标准写法，非原文；Memory Query 对移出局部窗口的历史信息进行注意力检索"}, {"tex": "M_t=g_t\\odot\\widetilde{M}_t+(1-g_t)\\odot M_{t-1},\\qquad g_t=\\sigma\\!\\left(W_g[\\widetilde{M}_t;M_{t-1}]\\right)", "caption": "标准写法，非原文；通过门控融合新压缩的历史信息与既有记忆"}], "train": "Memory Query 与视频 DiT 端到端联合优化。训练和推理均采用 Unified Relative RoPE Recipe，使 sink 帧从位置 0 开始，并限制最新帧位置不超过 DiT 预训练的最大时间 RoPE 位置。其余训练数据、损失函数及具体推理设置摘要未给。", "diff": "相较于预设 KV-cache 调度、固定比例启发式压缩和推理时 RoPE 调整，Echo-Infinity 使用可学习的 Memory Query，并在历史帧移出局部窗口时通过注意力和门控更新记忆。它还统一重设相对 RoPE 位置，避免依赖有限缓存窗口，并减小训练与推理的位置外推差异。", "limits": "摘要未见明确说明方法的额外代价与局限；其记忆压缩仍可能涉及历史信息取舍，但摘要未提供相关误差或成本分析。", "has_abstract": true}, "tags": ["r_sink复用", "实体记忆"], "explain": "就像读一本无限长的书，如果书签用光了页码，前面的内容又塞爆了脑袋，模型就会彻底乱套。这篇要解决的正是大模型处理超长文本时前文装不下且位置编号失效的麻烦。它走的是咱们组典型的记忆加位置重写路线，也就是把前面的重要信息压缩成额外记忆，再把新输入内容的位置编号重写拉回合理区间。这招之所以管用，是因为记忆结构帮模型保住了远距离的关键信息，而位置重写抹掉了过大页码带来的混乱，让模型在不爆显存也不迷失相对顺序的情况下一直读下去。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.04527"], "note": "报告只在 §3.6 以『Echo 系列（2606.04527 / 2605.16003 / 2603.12513）』合并提及一句，三条的拆分依 §12 参考文献对应关系。", "parent": "rolling-forcing", "link_strength": "dashed", "key": false, "citations": 0, "x": 2680, "y": 2324, "sx": 736, "sy": 1980.0, "cross": false}, {"id": "memactive", "title": "MemActive", "date": "2026-06-01", "precision": "day", "lane": "位置时间寻址", "branch": "实体挂载", "arxiv": "", "venue": "MIPG 2026", "training": "免训", "status": "速读", "one_liner": "组内工作，最接近实体级视觉记忆", "mechanism": "报告只有一句：最接近实体级，但只在冻结生成器上验证，细节未公开。", "detail": {"position": "MemActive 被描述为与实体级视觉记忆最接近的工作。现有信息不足以明确其具体要解决的问题。", "io": "输入、输出及条件信号均未公开。", "steps": ["现有信息未说明输入如何进入方法，因此无法确定数据流起点。", "现有信息未说明如何构建或使用实体级视觉记忆。", "现有信息未说明如何从记忆生成输出，也未公开完整处理流程。"], "formulas": [], "train": "报告称该方法只在冻结生成器上验证。训练与推理流程及其他关键设置未公开。", "diff": "报告称 MemActive 最接近实体级视觉记忆，但未提供足够细节以比较其与已有做法的具体差异。", "limits": "报告只明确提及在冻结生成器上验证；计算代价及其他局限未见明确说明。", "has_abstract": false}, "tags": ["冻结生成器", "实体级读写"], "explain": "想象你让画师画同一只橘猫在不同房间打滚，画着画着猫的花纹就全变了。传统生成模型经常遇到这种记不住物体的问题，而咱们组的 MemActive 想要解决的就是画面里特定物体总在变形的麻烦。它提出了最接近实体级的视觉记忆，也就是让模型像人类一样把特定物体当成独立对象牢牢记住。这招之所以管用，是因为团队把它接入到了冻结的生成器上，不用大费周章重训绘图底座，就能帮模型锁定特定实体的样貌。虽然具体细节还没有公开，但这套验证直接证明了独立实体记忆的可行性。", "key_numbers": [], "self_measured": [], "media": [], "links": [], "note": "疑似概念名：检索后未找到同名论文，只找到 MemAct(2610.17640, 空间理解) 与 MemLearner(2606.31734)。待 MenG 确认是否指某一篇或应删除", "parent": "echo-infinity", "link_strength": "dotted", "key": false, "citations": null, "x": 2680, "y": 2438, "sx": 2928, "sy": 2374.0, "cross": false}, {"id": "worldtrace", "title": "WorldTrace", "date": "2026-08-01", "precision": "month", "lane": "位置时间寻址", "branch": "重排位置", "arxiv": "2608.07408", "venue": "NeurIPS 2026", "training": "需训", "status": "精读", "one_liner": "记忆失效首因是地址失效，只重写位置不改内容", "mechanism": "按槽序号分配分布内虚拟位置 t_s=q−(L_attn−1−s)；Field 存淘汰帧 key 的分组均值，Landmark 按余弦阈值存原帧。", "detail": {"position": "WorldTrace 解决交互式视频世界模型在长时序 rollout 中无法可靠检索早期视觉记忆的问题。它将失效归因于 RoPE 时间位置超出训练分布造成的地址失效，并在不改写记忆内容的前提下为压缩槽分配分布内虚拟位置。", "io": "输入是交互式视频生成过程中产生的帧及其 KV cache，输出是可供后续生成检索的压缩视觉记忆。条件信号包括模型注意力范围内的槽序号，以及 Landmark 方法用于检测场景转变的余弦相似度阈值；摘要未说明其他条件信号。", "steps": ["从 KV cache 中保留当前注意力范围内的内容，并为压缩记忆槽按槽序号分配分布内虚拟位置，以避免长时序 RoPE 地址偏移超出训练范围。", "对被淘汰帧的 key 做分组均值，形成 WorldTrace-Field 记忆，以压缩历史并维持时间连贯性。", "检测场景转变，并按余弦相似度阈值选择需要保存的原帧，形成 WorldTrace-Landmark 记忆，以支持离开后重访场景时的情节回忆。", "在后续 rollout 中通过可寻址的压缩 cache 检索相关视觉记忆，支持长时序生成中的视觉持续性。"], "formulas": [{"tex": "t_s=q-(L_{\\mathrm{attn}}-1-s)", "caption": "按压缩槽序号 s 为记忆槽分配分布内虚拟位置，其中 q 和注意力范围参数 L_{\\mathrm{attn}} 的具体定义摘要未给。"}], "train": "WorldTrace 是 training-free 框架，无需重新训练。推理时在生成过程中维护并压缩 KV cache，为记忆槽分配虚拟位置；Field 采用被淘汰帧 key 的分组均值，Landmark 在检测到场景转变时存储原帧。其他推理设置摘要未给。", "diff": "与直接延长 RoPE 时间位置或在已旋转的 RoPE 空间中压缩 cache 的做法不同，WorldTrace 将记忆槽重新映射到分布内虚拟位置，并避免把位置相位不兼容的内容直接平均。它还分别提供面向时间连贯性的 Field 和面向场景重访的 Landmark。", "limits": "摘要未见明确说明计算与存储代价、阈值选择方式及适用模型范围。", "has_abstract": true}, "tags": ["槽位重编号", "Field分组均值", "Landmark原帧"], "explain": "就像在图书馆查旧档案，资料本身没坏，但页码太大超出了目录索引，导致管理员根本查不到。这篇论文发现模型处理三千帧长视频时，记忆失效的首因不是特征内容坏了，而是位置编码也就是标记时间先后的门牌号失效越界。它的招数是只重写位置不改内容：在槽位也就是缓存格里，为历史分配模型见过的虚拟门牌号；同时用Field保存淘汰帧均值作为背景概要，用Landmark按余弦阈值留住关键原帧。这招管用在于把越界地址拉回了安全区间，既不破坏原始特征，又能让模型稳稳认出长期记忆。", "key_numbers": ["3000 帧", "640×352@10fps", "25s（Centroid 黑段）", "N_s 个槽"], "self_measured": ["35s"], "media": ["demos/WorldTrace/aba_side_by_side.mp4", "demos/WorldTrace/field_compare_35s.png", "demos/WorldTrace/field_ours.mp4"], "links": ["https://arxiv.org/abs/2608.07408"], "note": "只给到月份 2026-08；同论文自带基准 LoopBench/LoopMem（TempSSIM、PAC）未单列条目；§3.0 称 demos/WorldTrace 共 9 段，报告只点名 3 个文件。", "parent": "worldplay", "link_strength": "dotted", "key": true, "citations": 0, "x": 2954, "y": 2070, "sx": 1284, "sy": 2120.0, "cross": false}, {"id": "infinite-rope", "title": "Infinity-RoPE: Action-Controllable Infinite Video Generation Emerges From Autoregressive Self-Rollout", "date": "2025-11-25", "precision": "day", "lane": "位置时间寻址", "branch": "重排位置", "arxiv": "2511.20649", "venue": "", "training": "免训", "status": "速读", "one_liner": "时间轴改成移动局部系，破RoPE长度上限", "mechanism": "新块按基模型最大帧距相对旋转、旧块反向旋转，消掉固定时间位置；KV Flush只留sink与末帧。", "detail": {"position": "论文针对自回归视频扩散模型的固定时间位置编码限制、长程生成中动作提示响应迟缓，以及单次生成流难以实现不连续镜头切换的问题。提出无需训练的推理框架，以支持超出基模型时间位置上限的连续生成、细粒度动作控制和多镜头切换。", "io": "输入是自回归视频扩散模型、文本提示及生成过程中提供的动作或场景切换控制信号，生成时还使用已有 latent 与 KV cache。输出是可持续延长的视频生成流，并可响应新的控制提示及执行镜头切换；具体输入格式摘要未给。", "steps": ["将新生成的 latent 块相对于基模型最大帧距进行 RoPE 旋转，并将已有块反向旋转以保持相对时间几何，从而摆脱固定时间位置上限。", "基于更新后的时间编码进行自回归生成，逐块扩展视频，使生成能够延伸至基模型原有时间位置范围之外。", "需要提高新提示的响应速度时执行 KV Flush，仅保留 global sink 与最后生成的 latent 帧，以减少历史缓存对当前控制的影响。", "需要场景跳转时使用 RoPE Cut，在时间 RoPE 坐标中引入受控不连续性，以便在同一生成流中实现镜头切换。"], "formulas": [{"tex": "\\tilde{z}_i=\\begin{cases}R(\\Delta_{\\max})z_i,&z_i\\text{ belongs to the new block},\\\\R(-\\Delta_{\\max})z_i,&z_i\\text{ belongs to an existing block},\\end{cases}", "caption": "Infinity-RoPE 的位置重编码：新块按基模型最大帧距旋转，已有块反向旋转。"}, {"tex": "\\mathcal{K}_{\\mathrm{flush}}=\\mathcal{K}_{\\mathrm{sink}}\\cup\\mathcal{K}_{\\mathrm{last}}", "caption": "KV Flush：清除历史缓存，仅保留 global sink 与最后生成的 latent 帧。"}], "train": "这是 training-free 的 inference-time 框架，不需要额外训练。推理时组合使用 Block-Relativistic RoPE、KV Flush 与 RoPE Cut；其余模型配置和具体推理参数摘要未给。", "diff": "不同于受基模型固定 3D-RoPE 时间位置范围约束的生成方式，Block-Relativistic RoPE 通过移动局部参考系调整新旧块的相对时间编码。框架还通过 KV Flush 提升提示响应，并通过 RoPE Cut 支持单次生成流中的不连续场景切换。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["相对位置", "无限rollout", "转场控制"], "explain": "想象一台摄影机边走边拍：每生成一小段视频，就接着上一段继续拍，还要听从“向左转”或“挥手”等动作指令。普通自回归模型逐帧续写时，旋转位置编码（RoPE，用角度表示帧与帧的相对位置）会随时间越积越长，超过训练时的长度上限，画面便容易抖动、遗忘或失控。Infinity-RoPE把时间轴改成移动的局部坐标：新视频块按基模型能处理的最大帧距做相对旋转，旧块则反向旋转，把不断增长的绝对时间抵消掉。它还使用KV Flush，即清理注意力缓存，只保留开头的“锚点帧”和最新一帧，既保留全局参照，又避免记忆无限膨胀。三项改动都发生在推理阶段，无需额外训练，却能稳定生成无限长、可控动作的视频，VBench总分超过以往自回归模型。", "key_numbers": ["摘要未给具体数值，仅称 VBench 总分稳定超过先前 AR 模型", "三个组件全为推理期改动，无额外训练"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2511.20649"], "note": "纯位置编号手术（相对化+反向旋转+断点），不引入任何检索或学习模块，是「重排位置」分支最标准的样本；与 MemRoPE 的区别是 MemRoPE 靠演化记忆 token 携带远期信息，这里靠坐标系本身移动。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 2070, "sx": null}, {"id": "deep-forcing", "title": "Deep Forcing: Training-Free Long Video Generation with Deep Sink and Participative Compression", "date": "2025-12-04", "precision": "day", "lane": "位置时间寻址", "branch": "锚 sink", "arxiv": "2512.05081", "venue": "", "training": "免训", "status": "速读", "one_liner": "窗口一半给sink，并把sink相位对齐当下", "mechanism": "滑窗一半配额留给持久sink token并把其时间RoPE相位重对齐当下；另一半按近期注意力重要性剪KV。", "detail": {"position": "该方法针对自回归视频扩散在长时生成中出现的时间重复、漂移和运动减速，以及直接使用 attention sink 导致的画质下降与运动停滞。它通过免训练的 KV cache 管理，稳定长程上下文并减少历史误差累积。", "io": "输入为自回归视频扩散过程中的当前生成状态与滑动窗口内的 KV cache，输出为持续生成的视频帧及更新后的 cache。条件信号包括视频生成过程原有的条件；摘要未说明其具体形式。", "steps": ["将滑动窗口的一半配额分配给持久 sink token，为长时生成保留稳定的全局上下文。", "把 sink token 的 temporal RoPE 相位重对齐到当前时间线，避免其位置编码与持续推进的生成时间脱节。", "对窗口另一半中的历史 KV 按近期注意力参与重要性进行筛选，保留仍参与近期注意力的 token。", "丢弃冗余或已退化的历史 KV，减少误差累积，并继续自回归生成后续视频帧。"], "formulas": [{"tex": "K_{s}^{\\mathrm{aligned}}=R(\\tau_{\\mathrm{now}})R(\\tau_s)^{-1}K_s", "caption": "将持久 sink token 的时间 RoPE 相位重对齐到当前时间；标准写法，非原文"}, {"tex": "I_i=\\sum_{q\\in\\mathcal{Q}_{\\mathrm{recent}}}\\sum_h A_{q,i}^{(h)},\\qquad \\mathcal{K}_{\\mathrm{keep}}=\\operatorname{TopK}_{i\\in\\mathcal{K}_{\\mathrm{hist}}}(I_i)", "caption": "按近期注意力参与度给历史 KV 打分并筛选保留项；标准写法，非原文"}], "train": "无需 fine-tuning，属于 training-free 方法；推理时在自回归视频生成过程中实施 Deep Sink 与 Participative Compression 管理 KV cache，并保持实时生成。其他训练流程和关键设置摘要未给。", "diff": "不同于直接套用 StreamingLLM-style attention sinks，Deep Sink 将半个滑窗配额留给持久 sink，并将其 temporal RoPE 相位重对齐到当前时间线。Participative Compression 则按近期注意力参与情况剪除 KV，而非仅依赖固定窗口截断；全程无需微调。", "limits": "摘要未见明确说明计算与显存代价、适用模型范围及失败情形。", "has_abstract": true}, "tags": ["深sink", "RoPE相位对齐", "免训KV管理"], "explain": "想象摄像机沿着小路持续拍摄：模型只学过5秒，却要稳定生成60秒以上；若不断滚动新画面，旧信息被挤出，人物身份、镜头运动和场景布局就会漂移，这正是长视频生成的麻烦。Deep Forcing把窗口一分为二：一半名额长期保留持久性“汇聚 token”，它们像记忆锚点，负责吸收注意力、维持生成稳定；同时把这些 token 的时间旋转位置编码（用时间相位表示位置）重新对齐到当前时刻，避免记忆因时间错位失效。另一半名额则根据近期注意力的重要性剪掉不关键的键值缓存，也就是模型保存的历史信息。这样既保住全局连续性，又把计算集中在眼前最有用的内容上，不增加训练，仍保持实时速度，实现约12倍外推，动态稳定性明显优于RollingForcing。", "key_numbers": ["12x 外推（5s 训练 → 60s+ 生成）", "保持实时生成速度", "动态度显著优于 RollingForcing"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2512.05081"], "note": "明确说「照搬 StreamingLLM 式 sink 会导致保真度下降与运动停滞」，正是锚 sink 分支的自我修正节点；同时做 sink 数量（Deep）与 sink 相位（RoPE 重对齐）两件事，所以和 anchor-forcing 有重叠但更早、更纯粹地讲 sink 配额。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1036, "y": 1930, "sx": null}, {"id": "rolling-sink", "title": "Rolling Sink: Bridging Limited-Horizon Training and Open-Ended Testing in Autoregressive Video Diffusion", "date": "2026-02-08", "precision": "day", "lane": "位置时间寻址", "branch": "锚 sink", "arxiv": "2602.07775", "venue": "", "training": "免训", "status": "速读", "one_liner": "把推理期缓存拉回训练内的稳定行为", "mechanism": "固定预算内恢复低漂移内容、滑动时间索引与演化语义，加一段近期上下文；以cache-behavior mismatch立论。", "detail": {"position": "论文针对 Self Forcing 系列自回归视频扩散模型在超出训练片段长度后质量退化的问题，将其归因于训练与开放式推理时缓存行为不匹配。Rolling Sink 在推理时调整缓存策略，使缓存行为更接近训练范围内的稳定状态。", "io": "输入是自回归视频扩散模型及其逐块生成过程，后续块依赖先前生成块形成的缓存；输出是可持续滚动生成的视频块。模型原有条件信号未在摘要中具体说明，已知的上下文信号是此前生成的视频块。", "steps": ["在模型固定缓存预算内设计联合缓存策略，以缓解训练内缓存与开放式推理缓存之间的行为偏移。", "保留低漂移内容并滑动时间索引，使缓存尽量维持训练范围内稳定的内容与时间行为。", "采用 Rolling Semantics schedule 处理随生成推进而变化的语义，避免缓存内容僵化。", "在缓存中保留少量近期上下文，使新生成的视频块仍能利用最近的运动与内容信息。"], "formulas": [{"tex": "\\mathcal{C}_t=\\operatorname{TopK}_{i\\in\\mathcal{C}_{t-1}\\cup\\mathcal{B}_t}\\!\\left(-\\delta_i^{(t)}\\right)\\;\\cup\\;\\mathcal{B}_t^{\\mathrm{recent}},\\qquad \\delta_i^{(t)}=\\left\\|\\mathbf{h}_i^{(t)}-\\mathbf{h}_i^{(t-1)}\\right\\|_2,\\qquad |\\mathcal{C}_t|\\le M", "caption": "在固定缓存预算内选择低漂移内容并保留一段近期上下文；标准写法，非原文"}, {"tex": "\\operatorname{Attn}_t=\\operatorname{softmax}\\!\\left(\\frac{\\mathbf{Q}_t[\\mathbf{K}_{\\mathcal{C}_t}]^{\\top}}{\\sqrt d}+\\mathbf{B}(\\tilde{\\tau}_{\\mathcal{C}_t})\\right)\\mathbf{V}_{\\mathcal{C}_t},\\qquad \\tilde{\\tau}_i=\\tau_i-\\Delta_t", "caption": "对滚动缓存执行注意力，并通过滑动时间索引与随生成推进的语义位置保持缓存行为稳定；标准写法，非原文"}], "train": "Rolling Sink 是 training-free 的推理期缓存策略，不改变模型训练流程。实验使用在 5 秒视频上训练的 Self Forcing 和 Causal Forcing 基础模型；在相同推理设置下评估 1 分钟和 5 分钟生成，并展示 30 分钟定性生成。其余具体缓存参数与设置摘要未给。", "diff": "论文的核心不是提出 attention sink 或 temporal re-indexing 这些已有机制，而是以 cache-behavior mismatch 解释长时生成退化，并将相关机制与 Rolling Semantics schedule 组合成固定预算内的联合缓存策略。", "limits": "摘要报告吞吐量变化约为 0.56%，GPU 内存保持恒定。验证覆盖 1 分钟和 5 分钟评测，并展示 30 分钟定性结果；作者明确不声称任意时长都能保证质量。", "has_abstract": true}, "tags": ["缓存域偏移", "滑动时间索引", "推理期策略"], "explain": "想象一台摄像机边走边拍：它每次只看眼前几秒，却要连续拍上半小时。训练时，模型只学短片段；测试时却要不断把自己生成的内容塞回缓存，越滚越久，画面容易漂移、人物和场景逐渐失真。这篇论文把问题归因于缓存行为不匹配，即训练时见到的缓存状态与推理时真实经历的状态不同。它在固定显存预算内，恢复漂移较小的内容，滑动时间索引，让语义随视频演化，再补入一段近期上下文，使训练主动模拟长时间推理。这样模型学会如何处理不断变旧、变化的缓存，因而更稳定。实验中吞吐仅变化约0.56%；在1分钟和5分钟 rollout（连续生成过程）上，VBench-Long平均排名最佳；即使测试长度达到训练时长的360倍，也能生成30分钟视频，显存保持恒定。", "key_numbers": ["吞吐变化约 0.56%", "1/5 分钟 rollout 上 VBench-Long 平均排名最佳", "30 分钟 rollout = 360x 训练时长", "显存恒定"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.07775", "https://rolling-sink.github.io/"], "note": "作者自承 sink 与 temporal re-indexing 都是已有机制，其贡献是「不匹配」这一诊断 + 联合有界缓存策略 + Rolling Semantics 调度。属于位置时间寻址的原因是把时间索引当可调度对象（滑动而非单调增长）。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 1930, "sx": null}, {"id": "lol", "title": "LoL: Longer than Longer, Scaling Video Generation to Hour", "date": "2026-01-23", "precision": "day", "lane": "位置时间寻址", "branch": "重排位置", "arxiv": "2601.16914", "venue": "", "training": "免训", "status": "速读", "one_liner": "多头RoPE抖动打散sink崩塌", "mechanism": "诊断sink-collapse源于RoPE周期与多头同质化，推理期给各头加不同RoPE抖动，打散头间同质化。", "detail": {"position": "这篇论文解决自回归长视频生成中的长期一致性下降与 sink-collapse 问题，即生成内容反复回到 sink frame，造成场景突变和循环运动。核心目标是在保持生成质量的同时，实现实时、流式和近似无限长度的视频生成。", "io": "输入是自回归视频生成过程中的历史视频上下文、sink frames 与 RoPE 位置编码。输出是持续生成的视频帧序列，并通过多头 RoPE jitter 缓解长时间生成中的内容回退与周期性崩塌。", "steps": ["在长视频自回归生成中引入 sink frames 以维持注意力稳定性，但识别其可能导致内容反复回到 sink frame 的 sink-collapse。", "分析 RoPE 的周期结构与 multi-head attention 的头间同质化之间的冲突，将其作为 sink-collapse 的主要来源。", "在推理阶段为不同 attention head 注入不同的 RoPE jitter，打散各头对位置关系的同步响应。", "利用被打散的头间注意力模式继续进行流式自回归生成，从而抑制场景重置与循环运动并减缓长期质量衰减。", "在无需额外训练的条件下评估实时、流式和长时长生成能力，包括最长达 12 小时的连续视频生成。"], "formulas": [{"tex": "\\widetilde{p}_{t,h}=p_t+\\delta_{t,h},\\qquad \\operatorname{Attn}_h(Q,K,V)=\\operatorname{softmax}\\!\\left(\\frac{\\operatorname{RoPE}(Q_h,\\widetilde{p}_{q,h})\\operatorname{RoPE}(K_h,\\widetilde{p}_{k,h})^{\\top}}{\\sqrt{d_h}}\\right)V_h", "caption": "标准写法，非原文：为不同注意力头注入独立的 RoPE 位置抖动，并据此计算注意力聚合，以打散头间同步的位置响应。"}], "train": "该方法是 training-free 方法，在推理阶段对不同 attention head 施加多头 RoPE jitter，不需要额外训练。摘要未给出 jitter 的具体形式、幅度、调度方式、模型配置或完整推理设置。", "diff": "相较于依赖 attention sink frames 缓解性能衰减的已有方法，该方法进一步针对 sink frames 引发的 sink-collapse 进行处理。相较于改变模型训练的方案，它通过推理期的 multi-head RoPE jitter 打散头间同质化，并支持实时、流式和长时长生成。", "limits": "摘要未报告额外计算开销、jitter 超参数敏感性、适用模型范围或失败案例。方法主要缓解 sink-collapse，长期生成中的全部质量衰减是否都能消除仍未明确说明。", "has_abstract": true}, "tags": ["RoPE抖动", "sink崩塌", "免训"], "explain": "想象摄像机不停拍一条街：几分钟后画面糊成一团，人物和镜头不断重复，继续生成只会更坏。LoL解决的正是视频世界模型长时间生成时的 sink-collapse：注意力逐渐挤到少数位置，画面失去变化和连贯性。作者发现，旋转位置编码（RoPE，把位置信息写进注意力计算）有周期性，多头注意力里的各个头又越来越相似，长序列下便容易同步塌缩。于是他们不改训练，只在推理时给不同注意力头加入不同强度的RoPE抖动，让各头的周期和关注位置错开。头间不再同步，注意力就不易挤向同一个汇点，模型能持续利用更丰富的历史信息，减少重复和崩坏，连续生成最长可达12小时视频。", "key_numbers": ["连续生成 12 小时视频", "推理期改动，无训练"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2601.16914"], "note": "少见地把失败机理归到「RoPE 周期性 × 多头」而不是容量，属于位置编码本身的手术；和 worldtrace 的区别是它不改锚点集合，只改各头的频率相位。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 2070, "sx": null}, {"id": "flex", "title": "Train Short, Inference Long: Training-free Horizon Extension for Autoregressive Video Generation", "date": "2026-02-15", "precision": "day", "lane": "位置时间寻址", "branch": "重排位置", "arxiv": "2602.14027", "venue": "", "training": "免训", "status": "速读", "one_liner": "频域调制RoPE，短训长推", "mechanism": "对欠训低频分量插值、高频外推以保多尺度判别性；配反相噪声采样与仅推理期sink锚定全局结构。", "detail": {"position": "这篇论文针对自回归视频扩散模型在生成长度超过训练视野时误差累积、时间质量显著退化的问题。它提出无需训练的推理期框架 FLEX，以改善长时视频的时间稳定性和动态表现。", "io": "输入是现有自回归视频扩散模型的常规推理输入与条件信号，具体条件形式摘要未给。输出是超出模型训练视野的长视频。", "steps": ["在推理时对 3D positional embeddings 中的 RoPE 频率进行 Frequency-aware RoPE Modulation，对欠训练的低频分量插值、对高频分量外推，以适应更长时间范围并保留多尺度时间判别性。", "在噪声采样中加入 Antiphase Noise Sampling，注入高频动态先验，以缓解缺少动态先验导致的长视频运动退化。", "加入仅推理期的 Inference-only Attention Sink，为生成过程提供全局结构锚点，以帮助长时生成维持整体一致性。", "将上述改动作为 plug-and-play 组件接入现有推理流程，生成超出训练时长的视频，无需对模型进行训练或微调。"], "formulas": [{"tex": "\\theta_{t,j}^{\\mathrm{FLEX}}=\\begin{cases}\\theta_{t,j}^{\\mathrm{train}}/s_j,&j\\in\\mathcal{L},\\\\ s_j\\theta_{t,j}^{\\mathrm{train}},&j\\in\\mathcal{H},\\end{cases}", "caption": "频率感知 RoPE 调制：对低频分量插值、对高频分量外推；标准写法，非原文"}, {"tex": "\\widetilde{\\epsilon}_t=\\epsilon_t+\\lambda\\bigl(\\epsilon_t-\\epsilon_{t-1}\\bigr)", "caption": "反相噪声采样的差分高频动态先验；标准写法，非原文"}], "train": "FLEX 是 training-free 的推理期方法，不需要额外训练。推理时调制 RoPE 频率，并结合 Antiphase Noise Sampling 与 Inference-only Attention Sink；摘要未给具体参数设置和实现细节。", "diff": "不同于通过长视频微调扩展生成视野，FLEX 在推理阶段直接调整位置频率处理、噪声采样和注意力锚定。其核心是按频率区别处理 RoPE 分量，并与动态先验和全局结构约束配合。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["频域重参数", "RoPE插值外推", "即插即用"], "explain": "想象一台只练过拍摄 5 秒短片的摄像机，却要连续拍完 1 分钟：画面可能越拍越糊，人物和场景也会漂移。这篇论文解决的正是自回归视频模型“短训长推”的失稳麻烦：不重新微调模型，而是在推理时改造 RoPE——一种把位置信息注入注意力、让模型知道帧序的编码。作者按频率拆解位置变化，对训练不足的低频部分做插值，让长期结构延续；对高频部分做外推，保留动作和纹理的多尺度辨别力。再配合反相噪声采样，减少逐帧误差累积，并用只在推理期加入的 sink 锚定全局结构，防止场景越生成越偏。结果是，短训练模型可外推 6 倍生成 30 秒视频，超过现有最佳方法；外推 12 倍生成 60 秒，追平专门训练的长视频基线，还把 LongLive 推到 4 分钟。", "key_numbers": ["6x 外推（30s）超过 SOTA", "12x（60s）追平长视频微调基线", "把 LongLive 推到 4 分钟"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.14027", "https://ga-lee.github.io/FLEX_demo"], "note": "把「位置外推失败」归因为 3D 位置嵌入的谱偏置，直接改 RoPE 各频段行为，是重排位置分支里唯一走频域解释的；与 infinite-rope 的差异是它不移动参考系，只重加权频段。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 2070, "sx": null}, {"id": "anchor-forcing", "title": "Anchor Forcing: Anchor Memory and Tri-Region RoPE for Interactive Streaming Video Diffusion", "date": "2026-03-12", "precision": "day", "lane": "位置时间寻址", "branch": "重排位置", "arxiv": "2603.13405", "venue": "", "training": "需训", "status": "速读", "one_liner": "三区RoPE加锚缓存，治换prompt掉画质", "mechanism": "KV存进anchor cache，换prompt时热启动re-cache；三区RoPE各给参考原点，再蒸馏回预训练有界区间。", "detail": {"position": "这篇工作研究交互式长视频生成中切换 prompt 后画质下降，以及长时间生成时运动逐渐减弱的问题。它提出 Anchor Forcing，通过改进缓存维护和 RoPE 位置编码来保留语义线索、近期视觉线索与运动先验。", "io": "输入是用于流式视频扩散生成的 prompt，以及按时间推进的视频生成状态；交互过程中可以切换 prompt。输出是响应 prompt 切换并持续生成的长视频，条件信号包括当前 prompt、anchor cache 中的 KV 状态和近期 latent 线索。", "steps": ["生成过程中将 KV states 存入 anchor caches，以保留可供后续生成使用的语义上下文。", "发生 prompt 切换时，从 anchor caches 热启动 re-cache，减少切换边界处语义上下文与近期 latent 线索的丢失。", "对流式时间位置采用 tri-region RoPE，并为不同区域设置参考原点，以协调持续增长的时间索引与预训练模型的有界 RoPE 区间。", "通过 RoPE re-alignment distillation 对齐位置编码分布，以更好保留预训练运动先验和长程运动表现。", "继续进行流式视频生成，并在交互设置下评估感知质量与运动指标。"], "formulas": [{"tex": "\\mathbf{H}_t=\\operatorname{softmax}\\!\\left(\\frac{\\mathbf{Q}_t[\\mathbf{K}_t;\\mathbf{K}_{A}]^{\\top}}{\\sqrt{d}}\\right)[\\mathbf{V}_t;\\mathbf{V}_{A}],\\qquad (\\mathbf{K}_{A},\\mathbf{V}_{A})\\leftarrow\\operatorname{ReCache}(\\mathbf{K}_{A},\\mathbf{V}_{A};\\,\\text{prompt switch})", "caption": "利用 anchor cache 参与注意力聚合，并在 prompt 切换时热启动缓存重构；标准写法，非原文"}, {"tex": "\\tilde{p}(p)=o_r+\\frac{p-b_r}{s_r},\\quad p\\in\\mathcal{R}_r,\\ r\\in\\{1,2,3\\},\\qquad \\mathcal{L}_{\\mathrm{RoPE}}=\\sum_{p}\\left\\|\\operatorname{RoPE}(\\mathbf{x}_p,\\tilde{p}(p))-\\operatorname{RoPE}(\\mathbf{x}_p,\\operatorname{clip}(p,0,M))\\right\\|_2^2", "caption": "将三类时间区域分别映射到带参考原点的有界位置区间，并通过蒸馏对齐预训练 RoPE 分布；标准写法，非原文"}], "train": "训练阶段使用 RoPE re-alignment distillation，使流式时间位置与预训练 backbone 的有界 RoPE 区间相协调。推理阶段在生成中维护 anchor caches，并在 prompt 切换时以其 KV states 热启动 re-cache。蒸馏配置、缓存大小及其他关键设置摘要未给。", "diff": "已有流式方法通常在每次 prompt 切换时重新维护 rolling KV cache，难以同时保留语义上下文与近期 latent 线索；Anchor Forcing 改用 anchor-guided re-cache。它还以 tri-region RoPE 和 RoPE re-alignment distillation 应对无界时间索引造成的位置分布偏移。", "limits": "摘要未见明确说明具体计算与存储开销、适用范围或失败情形。", "has_abstract": true}, "tags": ["锚缓存", "三区RoPE", "换prompt交互"], "explain": "想象你正看着一段直播生成的视频：女孩原本在海边奔跑，你把提示词改成雨夜街头，场景虽立刻变化，画面却突然变糊，动作也抖起来。麻烦在于，流式视频扩散模型只保留短暂上下文，换提示词后旧画面的视觉记忆难以接上。Anchor Forcing把历史注意力中的键值信息存进锚缓存，改词时用它热启动并重新缓存，让新内容接着旧记忆生成。它再用三区旋转位置编码（RoPE，一种让模型感知时空顺序的坐标方式），给参考、当前生成和过渡区域分别设原点；通过蒸馏把新位置关系压回预训练模型熟悉的范围。这样既减少位置错乱，又保持运动连贯，感知质量和运动指标都优于流式基线。", "key_numbers": ["摘要未给具体数值，仅称感知质量与运动指标优于流式基线", "需要 RoPE 重对齐蒸馏"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.13405", "https://github.com/vivoCameraResearch/Anchor-Forcing"], "note": "同时踩「锚」与「重排位置」两条，但主矛盾是无界时间索引 vs 预训练有界 RoPE → 判重排位置；与 grounded-forcing 的双参考 RoPE 注入是同期同族，区别是它把分区与 prompt 切换绑定。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 2184, "sx": null}, {"id": "packforcing", "title": "PackForcing: Short Video Training Suffices for Long Video Sampling and Long Context Inference", "date": "2026-03-26", "precision": "day", "lane": "位置时间寻址", "branch": "锚 sink", "arxiv": "2603.25730", "venue": "", "training": "需训", "status": "速读", "one_liner": "三段KV缓存，丢块后补RoPE相位", "mechanism": "KV分sink全分辨率、mid走3D卷积+低分辨率VAE重编码32x并top-k选、recent全分辨率；补位置缺口。", "detail": {"position": "针对自回归视频扩散模型生成长视频时 KV-cache 随时间线性增长、内容重复和误差累积的问题，PackForcing 通过分层压缩与筛选历史上下文来控制缓存规模并维持长程一致性。", "io": "输入为自回归视频生成过程中的历史帧及当前生成上下文，输出为持续生成的视频帧。具体条件信号摘要未给。", "steps": ["将历史上下文划分为 sink、mid 和 recent 三类，以分别保留全局锚点、压缩中段历史和维护近期连贯性。", "对 sink 和 recent 保留全分辨率 token，以维持全局语义锚点与局部时间连贯性。", "对 mid token 使用融合 progressive 3D convolutions 与低分辨率 VAE 重编码的双分支网络压缩，以减少时空 token 数量。", "对压缩后的 mid token 动态执行 top-k 选择，以在缓存规模受限时保留重要历史信息。", "对丢弃 token 后产生的位置间隔使用 continuous Temporal RoPE Adjustment 重新对齐，以减少位置错位对时间建模的影响。"], "formulas": [{"tex": "\\mathcal{K}_t=\\mathcal{K}_{\\mathrm{sink}}\\cup\\operatorname{TopK}_k\\!\\left(\\mathcal{C}_{32}(\\mathcal{K}_{\\mathrm{mid}});s\\right)\\cup\\mathcal{K}_{\\mathrm{recent}},\\quad \\mathcal{V}_t=\\mathcal{V}_{\\mathrm{sink}}\\cup\\operatorname{TopK}_k\\!\\left(\\mathcal{C}_{32}(\\mathcal{V}_{\\mathrm{mid}});s\\right)\\cup\\mathcal{V}_{\\mathrm{recent}}", "caption": "标准写法，非原文：对 mid 历史进行 32 倍压缩并按重要性分数 s 选取 top-k，同时保留 sink 与 recent 的全分辨率 KV。"}], "train": "摘要称模型可零样本运行，也可仅用 5 秒视频片段训练；未给出训练目标、优化器或其他训练设置。推理时采用三段 KV-cache 与动态 mid-token 选择，摘要报告可在单张 H200 GPU 上生成 2 分钟、832×480、16 FPS 视频，KV-cache 为 4 GB。", "diff": "相较于不区分历史重要性或仅做统一缓存压缩的做法，PackForcing 将上下文分为 sink、mid、recent，并针对中段历史压缩与筛选，同时通过 Temporal RoPE Adjustment 处理丢块带来的位置缺口。该设计使短视频监督也能支持长视频采样与长上下文推理。", "limits": "摘要未见明确说明方法在不同视频内容、分辨率或硬件条件下的局限，也未提供压缩质量与计算开销的详细分析。", "has_abstract": true}, "tags": ["三段KV", "时空压缩", "位置缺口补齐"], "explain": "想象摄像机连续拍两分钟：若每帧记忆都留下，显存很快塞满；若删掉旧记忆，画面又容易忘事、跳变。PackForcing解决短视频训练难以支持长视频生成和长上下文推理的问题。它把注意力缓存（保存过往画面特征的记忆）分三段：开头帧与最近帧保留高清；中间帧经三维卷积和低分辨率变分自编码器压缩32倍，再挑重要片段留下。删帧造成的位置空缺，则补上旋转位置编码的相位，避免时间错乱。这样既保住开头与眼前细节，又用关键中段维持连贯。实验可将5秒训练外推到120秒，缓存仅4GB；单张H200能生成两分钟、832×480、每秒16帧视频，时间一致性26.07、动态度56.25。", "key_numbers": ["24x 外推（5s→120s）", "KV 仅 4GB", "2 分钟 832x480 @16FPS 单卡 H200", "时间一致性 26.07 / 动态度 56.25"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.25730", "https://github.com/ShandaAI/PackForcing"], "note": "结构上是 sink+recent 的扩容版（多了会丢块的 mid 区），所以落锚 sink；真正的位置手术是丢块后的 RoPE 相位补洞，这点和 rolling-sink 的滑动索引互补。", "parent": null, "link_strength": "", "key": false, "citations": 1, "x": 1858, "y": 1930, "sx": null}, {"id": "dysink", "title": "DySink: Dynamic Frame Sinks for Autoregressive Long Video Generation", "date": "2026-05-20", "precision": "day", "lane": "位置时间寻址", "branch": "锚 sink", "arxiv": "2605.21028", "venue": "", "training": "免训", "status": "速读", "one_liner": "sink帧不固定，按视觉相关度动态换", "mechanism": "维护紧凑记忆库按当前状态检索相关历史帧作动态sink；加门过滤头间共识过高结果防崩塌。", "detail": {"position": "这篇论文针对自回归长视频生成中固定保留早期 sink 帧、却丢弃可能更相关的中间历史的问题。它提出 DySink，按当前视觉状态动态选择历史帧作为 sink，并过滤可能导致 sink collapse 的检索结果。", "io": "输入是自回归视频生成过程中的当前视觉状态和紧凑记忆库中的历史帧，输出是用于生成的动态 frame sinks。条件信号包括当前视觉状态与历史帧的视觉相关度，以及检索结果中的头间注意力共识程度。", "steps": ["维护紧凑的历史帧记忆库，以便在有限缓存下保留可供后续检索的上下文。", "根据当前视觉状态检索视觉相关的历史帧，将其选作动态 frame sinks，以适应内容随时间发生的变化。", "检查检索上下文是否出现过高的头间共识，并通过 sink anomaly gate 过滤异常结果，以降低 sink collapse 风险。", "将筛选后的动态 sinks 与局部窗口上下文用于自回归生成，以兼顾短期连续性和长程信息。"], "formulas": [{"tex": "s_i=\\frac{q_t^{\\top}m_i}{\\lVert q_t\\rVert_2\\lVert m_i\\rVert_2},\\qquad \\mathcal{R}_t=\\operatorname{TopK}_{i\\in\\mathcal{M}}(s_i)", "caption": "按当前视觉状态与记忆帧的余弦相似度检索相关历史帧；标准写法，非原文"}, {"tex": "C(\\mathcal{R}_t)=\\frac{2}{H(H-1)}\\sum_{h<h'}\\operatorname{sim}(a_h,a_{h'}),\\qquad g_t=\\mathbb{1}[C(\\mathcal{R}_t)<\\tau]", "caption": "以注意力头间共识度构造异常门控，高共识时过滤检索结果以降低 sink collapse 风险；标准写法，非原文"}], "train": "摘要未给训练流程和具体推理设置。摘要说明推理时采用紧凑记忆库、相关帧检索和 sink anomaly gate；实验评估了 50 至 100 秒视频。", "diff": "传统做法固定保留早期帧作为长程 sink，DySink 则依据当前视觉状态动态检索历史帧。它还加入 sink anomaly gate，过滤头间共识过高的检索上下文。", "limits": "摘要未见明确说明计算与存储代价，也未说明方法在不同任务、模型或视频长度上的适用边界。", "has_abstract": true}, "tags": ["动态sink", "检索式锚点", "sink异常门"], "explain": "想象摄像机边走边拍一场长达一分钟的追车戏：如果始终盯着开场那几帧，后面的画面就会越来越像，甚至陷入重复。自回归视频生成也有类似麻烦：模型逐帧生成时，历史信息不断累积，长视频容易时间漂移、细节崩塌。DySink把用于稳定后续生成的参考画面称为“sink帧”，但不再固定它们，而是维护一个紧凑记忆库，根据当前画面状态检索最相关的历史帧，动态更换sink。它还加入门过滤器，抑制不同注意力头给出过度一致的结果，避免模型被单一模式锁死。这样既保留了真正有用的上下文，又减少无关旧画面的干扰，因此在50到100秒视频上，时间连贯性优于自回归基线，同时文本对齐和单帧画质仍具竞争力。", "key_numbers": ["50–100 秒视频上时间质量最优（对比 AR 基线）", "文本对齐与单帧质量保持竞争力"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.21028", "https://github.com/yebo0216best/DySink"], "note": "混合体：选择靠内容检索，但作用点是「谁占据 sink 槽位」，即位置配额分配，故放位置时间寻址的锚 sink；若你的分类更看重检索手段，可移入内容学习寻址的外部检索库。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 1930, "sx": null}, {"id": "fadem", "title": "FadeMem: Distance-Aware Memory Consolidation for Autoregressive Video Diffusion", "date": "2026-06-09", "precision": "day", "lane": "位置时间寻址", "branch": "距离分层", "arxiv": "2606.10671", "venue": "", "training": "免训", "status": "速读", "one_liner": "近密远疏，按时间距离幂律合并KV", "mechanism": "新历史细粒度插入，旧相邻条目按幂律时间分配逐步合并，单缓存内形成近密远疏层级，不改架构。", "detail": {"position": "FadeMem 解决自回归视频生成中历史 KV cache 随视频长度增长、难以在固定缓存预算下保留长程信息的问题。它按时间距离组织并合并历史 KV，以兼顾近处细节与远处场景结构和身份信息。", "io": "输入是自回归视频生成过程中产生的历史 KV blocks，以及新生成的历史条目；输出是在固定缓存预算内更新后的分层 KV memory，供后续生成使用。摘要未说明具体条件信号。", "steps": ["将新产生的历史以细粒度条目插入缓存，保留近期内容的细节，因为近处信息仍有较高时序相关性。", "根据条目间的时间距离安排缓存层级，使近处条目更密、远处条目更疏，因为细节与场景结构的时间衰减速度不同。", "按幂律时间分配逐步合并较旧的相邻条目，压缩远程历史并控制缓存规模，同时尽量保留长期有用的信息。"], "formulas": [{"tex": "\\widetilde{K}_{a:b}=\\frac{\\sum_{i=a}^{b}w_iK_i}{\\sum_{i=a}^{b}w_i},\\qquad \\widetilde{V}_{a:b}=\\frac{\\sum_{i=a}^{b}w_iV_i}{\\sum_{i=a}^{b}w_i}", "caption": "标准写法，非原文：将相邻的历史 KV 条目按权重合并，以压缩远程历史并保留其平均信息"}, {"tex": "\\Delta(t)=c\\,(t+\\epsilon)^{\\alpha},\\qquad \\text{merge adjacent entries when their temporal spacing reaches }\\Delta(t)", "caption": "标准写法，非原文：用幂律增长的合并间隔构造近密远疏的缓存层级"}], "train": "推理时在自回归生成过程中更新和合并 KV memory，不需改动模型架构。摘要提到轻量适配可进一步增强运动动态与视觉保真度，但训练流程和关键设置未给。", "diff": "不同于 local window、sink tokens 或压缩记忆状态等通常为历史不同部分分配固定角色的方法，FadeMem 在单一缓存内依据时间距离渐进合并历史条目。其时间分配遵循幂律，使缓存呈现近密远疏的层级结构。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["幂律时间分配", "KV合并", "有界缓存"], "explain": "想象摄像机一直拍下去，桌上却只有一本固定厚度的日记：新画面不断写入，旧画面若全留着，记忆很快塞满；若随手删，又会忘掉故事。视频扩散模型生成长视频时也有这个麻烦：它要缓存过去的信息，供后续画面参考，这些缓存叫键值缓存，长度会随时间增长。FadeMem像整理日记一样，新历史细致记下，旧的相邻条目则按与当前时刻的距离，依幂律逐步合并。于是同一份缓存里，近处记录密、远处记录疏，且无需改动模型架构。它管用，是因为刚发生的动作通常更需要细节，久远内容则可用更粗略的摘要维持连贯。同等缓存预算下，它支持生成数分钟到数小时的视频，并降低峰值显存。", "key_numbers": ["同预算下支持多分钟到小时级生成", "匹配 KV 预算时降低峰值显存"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.10671"], "note": "新建分支「距离分层」：它反对给历史各部分分配固定角色（sink/窗口），改由时间距离决定分辨率与合并度，既非锚点集合也非 RoPE 手术，但与两者同属「用时间坐标决定可读性」。若不想新建分支，最接近锚 sink。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2680, "y": 2578, "sx": null}, {"id": "gen3c", "title": "GEN3C", "date": "2025-03-18", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "", "venue": "", "training": "需训", "status": "速读", "one_liner": "L4 显式几何缓存的代表工作", "mechanism": "报告只在记忆形态表与矩阵中把它列为显式几何缓存代表，未给方法细节。", "detail": {"position": "依据现有信息，GEN3C 被列为 L4 显式几何缓存的代表工作。可用材料未说明它具体解决的问题。", "io": "输入、输出及条件信号在现有材料中均未说明。", "steps": ["现有材料仅将 GEN3C 归为显式几何缓存方法，具体输入数据及处理方式未说明。", "显式几何缓存的构建与使用过程未说明。", "输出形式及生成流程未说明。"], "formulas": [{"tex": "\\mathbf{X}=\\mathbf{T}_{w\\leftarrow c}\\left(D(\\mathbf{p})\\mathbf{K}^{-1}\\tilde{\\mathbf{p}}\\right),\\qquad \\tilde{\\mathbf{p}}'\\sim\\mathbf{K}\\mathbf{T}_{c'\\leftarrow w}\\mathbf{X}", "caption": "由深度与相机参数将像素反投影到三维，并投影到目标视角；标准写法，非原文"}], "train": "摘要未给", "diff": "现有材料只提供其作为显式几何缓存代表这一分类，未说明相较已有做法的具体差别。", "limits": "未见明确说明", "has_abstract": false}, "tags": ["深度点云缓存", "相机条件"], "explain": "就像在陌生迷宫里走路，如果每走一步都要把走过的拐角重新丈量一遍，不仅费时而且极易迷路。GEN3C 要解决的就是移动感知中重复计算空间结构且容易丢失真实形变的问题。它的核心招数是显式几何缓存，也就是直接把周围看过的三维实体形状像搭积木一样清清楚楚存下来，而不是压缩成让人看不懂的抽象代数特征。这招之所以管用，是因为直接保留了真实世界的三维坐标骨架，后续感知需要时能直接拿来复用，既省去了重复推算的开销，又能让系统牢牢锚定真实空间，不会因遮挡而丢失几何位置。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2503.03751"], "note": "只有名字，无 arXiv 号、无日期、无描述。", "parent": "vmem", "link_strength": "dashed", "key": false, "citations": null, "x": 214, "y": 2764, "sx": 1010, "sy": 2928.0, "cross": false}, {"id": "vmem", "title": "VMem", "date": "2025-10-01", "precision": "month", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2506.18903", "venue": "ICCV 2025 (highlight)", "training": "免训", "status": "精读", "one_liner": "索引建在三维表面上，按位姿查历史视图", "mechanism": "存 surfel（位置、法线、半径、看过它的帧号 I_k）；读时把 surfel 投影到虚拟低清屏、逐像素直方图投票取 top-K 视图。", "detail": {"position": "VMem 解决视频生成器在交互式探索环境时难以长期保持场景一致性的问题。它用几何索引检索相关历史视图，避免依赖不断累积误差的三维重建或过短的上下文窗口。", "io": "输入包括已存储的历史视图及其 surfel 几何信息，以及生成新视图时的相机位姿条件。输出是筛选出的相关历史视图，供视频生成器生成与场景一致的新视图。", "steps": ["从历史视图中提取 surfel，并记录其位置、法线、半径及观测到它的帧号，以建立基于三维表面的记忆索引。", "根据待生成视图的相机位姿，将相关 surfel 投影到虚拟低分辨率屏幕，以估计它们对当前视角的关联。", "对屏幕像素上的帧号进行直方图投票并选出 top-K 历史视图，以集中检索与当前视角最相关的记忆。", "将检索到的历史视图作为生成上下文，以较低的上下文计算成本生成新视图并维持场景连贯性。"], "formulas": [{"tex": "\\mathbf{u}_s=\\Pi\\!\\left(T_{cw}\\mathbf{p}_s\\right),\\qquad H(k)=\\sum_{\\mathbf{u}\\in\\Omega}\\sum_{s:\\,\\mathbf{u}_s=\\mathbf{u}}\\mathbf{1}[k\\in I_s]", "caption": "将 surfel 投影到虚拟屏幕，并按其观测帧号对屏幕像素进行直方图投票；标准写法，非原文"}, {"tex": "\\mathcal{K}=\\operatorname{TopK}_{k}\\,H(k)", "caption": "按投票分数选取最相关的 top-K 历史视图；标准写法，非原文"}], "train": "训练流程与关键设置摘要未给。推理时依据相机位姿进行 surfel 投影和逐像素帧号直方图投票，检索 top-K 历史视图作为生成上下文。", "diff": "与逐步外绘二维视图并累积重建三维几何的做法不同，VMem 直接以 surfel 建立历史视图的几何索引。与使用短上下文窗口的视频生成器不同，它按当前视角检索相关历史视图，并避免将全部历史视图都作为上下文。", "limits": "摘要指出使用全部历史视图作为上下文计算成本较高，VMem 通过相关视图检索降低成本；未见明确说明其他局限。", "has_abstract": true}, "tags": ["Surfel索引", "渲染投票"], "explain": "想象你在大房子里到处拍照，现在要从新角度作画，最头疼的就是从成百上千张旧照片里找出哪几张拍到了眼前的桌角。VMem解决的就是检索参考视角太慢的麻烦。它的招数是把索引直接贴在三维表面：在场景中铺设叫面元（带朝向的微小圆盘）的单元，记下看过它的历史帧号。查询时把视野内的面元投影到虚拟低清屏幕上，让每个像素投票选出得票最高的前几个视图。这招管用在于把全局盲搜变成了局部的几何投票，直接排除视线遮挡，不用遍历无关历史，换来约12倍提速。", "key_numbers": ["K=4", "K=17", "约 12 倍提速", "4.2 秒/帧（4090）", "α=0.2"], "self_measured": ["6s 768×576", "59.6s 1280×720"], "media": ["demos/VMem/pair_demo.mp4", "demos/VMem/onemin_720p.mp4"], "links": ["https://arxiv.org/abs/2506.18903"], "note": "报告只给到月份 2025-10，未给提交日；training=免训依 §11『VMem（插件）』与矩阵『免训插件』。", "parent": null, "link_strength": "", "key": true, "citations": 0, "x": 762, "y": 2878, "sx": null}, {"id": "spmem", "title": "spmem", "date": "2025-06-01", "precision": "month", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2506.05284", "venue": "", "training": "需训", "status": "速读", "one_liner": "显式几何缓存，强依赖深度估计", "mechanism": "报告未述具体读写；在 L4 显式几何缓存一行，并被列为『几何依赖、动态场景下失效』的代表。", "detail": {"position": "SPMEM 针对自回归视频 world models 的有限时间上下文导致重访场景时遗忘既有环境、难以保持长期一致性的问题。它引入几何支撑的长期空间记忆，以帮助模型在重访时恢复先前生成的场景信息。", "io": "输入包括视频生成上下文以及动作等控制信号，例如 camera movements、text prompts；模型输出后续视频帧。框架还使用长期空间记忆存储和检索场景信息，具体信号格式摘要未给。", "steps": ["根据生成过程构建显式的几何空间记忆，以便将场景信息保存在有限时间上下文之外。", "在场景需要重访时从长期空间记忆中检索相关信息，以缓解模型对先前环境的遗忘。", "将检索到的记忆与当前上下文及控制信号结合，用于生成后续视频帧并提升场景一致性。", "使用包含显式 3D memory 机制的定制数据集训练和评估 world models，以检验长期记忆带来的效果。"], "formulas": [{"tex": "r_t=\\sum_{i=1}^{N}\\frac{\\exp\\!\\left(-\\|p_t-p_i\\|_2^2/\\tau\\right)}{\\sum_{j=1}^{N}\\exp\\!\\left(-\\|p_t-p_j\\|_2^2/\\tau\\right)}\\,m_i", "caption": "标准写法，非原文：按空间位置距离对长期几何记忆加权检索；原文具体检索打分未述。"}], "train": "摘要提到使用定制数据集训练和评估带显式 3D memory 机制的 world models；具体训练目标、数据规模与关键设置摘要未给。推理时通过长期空间记忆的存储与检索辅助自回归视频生成，具体读写流程摘要未给。", "diff": "与仅依赖有限时间上下文的生成方式不同，SPMEM 显式维护几何支撑的长期空间记忆，并在生成时检索记忆以支持场景重访。已知机制概括指出其为显式几何缓存，并强依赖深度估计。", "limits": "几何记忆强依赖深度估计；动态场景下可能失效。摘要未见更具体的计算代价或失败条件说明。", "has_abstract": true}, "tags": ["深度反投影", "几何缓存"], "explain": "就像在房间里给家具画速写，如果每次眨眼都要重新用尺子量一遍每个柜子的距离，效率会特别低。这篇论文想解决模型重复推算三维空间深度的开销问题。它提出的招数是显式几何缓存，也就是直接在物理空间里建一个带坐标的记忆本，把估计出来的物体形状与距离存进去。这招管用是因为后续观察同一位置时，模型可以直接翻看之前存好的空间坐标，省掉了重复推测几何的时间。不过它强依赖深度测量的准确度，在动态物体移动的场景下这套缓存容易失效。", "key_numbers": [], "self_measured": [], "media": ["https://spmem.github.io/static/images/data.jpg", "https://spmem.github.io/static/images/teaser.jpg", "https://spmem.github.io/static/videos/demo_page.mp4"], "links": ["https://arxiv.org/abs/2506.05284"], "note": "仅摘要级【摘】；报告只在 §1.3、§1.2 失效机制、§8.4 三处提及名字。", "parent": "vmem", "link_strength": "dashed", "key": false, "citations": 6, "x": 488, "y": 2764, "sx": 1010, "sy": 2928.0, "cross": false}, {"id": "lingbot-world", "title": "LingBot-World", "date": "2026-01-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2601.20540", "venue": "", "training": "需训", "status": "速读", "one_liner": "蚂蚁灵波 A14B 相机可控 10 分钟世界模型", "mechanism": "报告只给规模与时长（A14B、Cam/Act 控制、10min@16FPS 480p），未描述记忆读写方式。", "detail": {"position": "LingBot-World 旨在把视频生成模型发展为可交互的世界模拟器，在多种视觉风格和环境中生成具有稳健动态、长期上下文一致性的视频。", "io": "输入包含相机控制 Cam 和动作控制 Act 等条件信号，输出为受控的连续视频。已知配置支持 480p、16 FPS 和最长 10 分钟的生成。", "steps": ["以视频生成作为基础构建世界模拟器，以便生成环境中的连续视觉内容。", "接收 Cam 和 Act 控制信号，以支持对生成过程的实时交互控制。", "持续生成后续视频帧，以维持长时间生成中的上下文一致性。", "面向现实、科学和卡通等不同环境生成内容，以覆盖多种应用场景。"], "formulas": [], "train": "训练数据、目标函数和训练流程摘要未给。已知模型规模为 A14B；推理支持 Cam 和 Act 控制，最长 10 分钟、480p、16 FPS，摘要称生成 16 帧时延低于 1 秒。", "diff": "相较于仅生成短视频的做法，LingBot-World 强调分钟级生成、长时上下文一致性和实时交互。该项目开放代码与模型，旨在缩小开源方案与闭源技术之间的差距。", "limits": "摘要未说明训练数据来源、记忆机制、硬件需求及不同场景下的性能边界，未见明确说明。", "has_abstract": true}, "tags": ["双通道控制", "长时程生成"], "explain": "想象你在开放世界游戏里推开门走了一圈再回头，屋里的桌椅却莫名其妙变形消失了。以前的世界模型，也就是能像游戏引擎一样根据操作实时推演画面的AI，往往跑几秒就会崩溃遗忘。蚂蚁灵波直接将模型扩展到140亿参数的A14B规模，并引入相机位姿与动作控制。虽然报告并未透露具体的记忆读写机制，但这招管用在于超大规模参数能死死锁住长序列的时空一致性，成功做到了在16FPS、480p下连续推演长达10min，让长时视角交互不再穿帮。", "key_numbers": ["A14B", "10min", "16FPS@480p"], "self_measured": [], "media": ["https://mdn.alipayobjects.com/huamei_u94ywh/afts/img/M40ASpFi9icAAAAAQCAAAAgADkxfAQFr/original.png", "https://mdn.alipayobjects.com/huamei_u94ywh/afts/img/OWOnSJW7mOQAAAAAgFAAAAgADkxfAQFr/original.png", "https://mdn.alipayobjects.com/huamei_u94ywh/afts/img/TiIlTLkPTg8AAAAAQBAAAAgADkxfAQFr/original.png"], "links": ["https://arxiv.org/abs/2601.20540"], "note": "lane 暂定，报告无记忆机制描述；§8 提及其自述仅支持单智能体、不支持物体交互；无提交日期。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1036, "y": 3158, "sx": null}, {"id": "sana-wm", "title": "SANA-WM", "date": "2026-05-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2605.15178", "venue": "", "training": "需训", "status": "速读", "one_liner": "2.6B 单卡可跑的 6-DoF 长视频世界模型", "mechanism": "报告未描述其记忆读写机制；只给 6-DoF 相机控制、60s@720p 生成，以及自带的 SANA-WM-Bench 回访评测。", "detail": {"position": "SANA-WM 旨在以较低的模型规模和推理成本生成长时、高保真视频，并让生成内容遵循精确的相机运动。它面向分钟级世界建模，重点处理长上下文建模、6-DoF 相机控制和长视频一致性。", "io": "输入包括用于生成视频的条件信号，其中相机轨迹作为 6-DoF 控制信号；摘要未具体说明其他输入形式。输出为最高 720p、最长 60 秒的视频。", "steps": ["从公开视频中提取 metric-scale 6-DoF 相机位姿，形成时空一致的动作标签，以提供相机运动监督。", "使用 frame-wise Gated DeltaNet 与 softmax attention 构成 Hybrid Linear Attention，以更节省内存地建模长上下文。", "通过 Dual-Branch Camera Control 将 6-DoF 轨迹条件用于生成过程，以提高相机运动的遵循精度。", "先生成 stage-1 视频，再由 long-video refiner 进行细化，以改善长序列的视觉质量与一致性。", "使用 SANA-WM-Bench 评估动作遵循表现，并比较长视频生成质量与效率。"], "formulas": [], "train": "训练数据约为 213K 个带 metric-scale 位姿监督的公开视频片段；训练耗时 15 天，使用 64 张 H100。推理时生成 60 秒视频可在单张 GPU 上完成；蒸馏版本经 NVFP4 量化后可部署于单张 RTX 5090，并以 34 秒对 60 秒 720p 视频去噪。摘要未给出优化器、损失函数和训练阶段的具体设置。", "diff": "相较于摘要提及的既有开源基线，SANA-WM 将 frame-wise Gated DeltaNet 与 softmax attention 结合，并采用双分支相机控制、长视频细化和 metric-scale 位姿标注。摘要报告其动作遵循更强，并以 36 倍吞吐率达到可比的视觉质量。", "limits": "训练仍需 64 张 H100 和 15 天；摘要未见明确说明长视频生成的其他资源代价、适用场景限制或失败模式。", "has_abstract": true}, "tags": ["6-DoF相机", "自带回访集"], "explain": "想象你在玩游戏，绕着街区走一圈再转头原路返回，刚才路过的房子却凭空变了样。以往视频世界模型——也就是能模拟真实物理环境的AI系统——要么算力要求太高单卡带不动，要么漫游久了回头看就穿帮。SANA-WM把模型做到了只有2.6B参数，单张5090显卡就能运行，并引入6自由度相机控制，也就是让视角能在三维空间里自由位移和转头。这招管用在于它大幅压低了计算门槛，通过严格的相机位姿引导和专门的回访评测，让单卡也能在60秒高清长视频里稳住空间一致性。", "key_numbers": ["2.6B", "60s@720p", "34s/条（量化，单卡 5090）", "24.1 条/小时", "51.1GB", "80 场景×2", "961 帧@16fps"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2605.15178"], "note": "报告只给到月份 2026-05（§1.5 时间线），无首次提交日；lane 为暂定，报告未说明寻址方式；§2 明确『相机控制精度数据待补』。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2132, "y": 3158, "sx": null}, {"id": "dreamx-world", "title": "DreamX-World", "date": "2026-06-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2606.16993", "venue": "", "training": "需训", "status": "速读", "one_liner": "高德 5B 键鼠+PRoPE 可跑世界模型", "mechanism": "报告未描述记忆机制；控制侧为键鼠动作加 PRoPE 相机条件，约 1 分钟 704×1280@16FPS，MIT 许可。", "detail": {"position": "DreamX-World 旨在把文本或图像条件的视频生成扩展为可控的长时程交互式世界模型，支持相机导航、重访已观察区域和按提示触发事件。它重点处理自回归分段生成中的相机控制、历史场景延续与风格色彩漂移问题。", "io": "输入包括文本或图像条件、相机与键鼠动作，以及可组合的事件指令；相机条件用于控制视角和导航。输出是跨多个生成片段的交互式视频。", "steps": ["整合 Unreal Engine 渲染、带动作的游戏录屏和恢复了相机几何的真实视频，构建覆盖多种视觉域且包含相机信息的训练数据。", "采用 E-PRoPE 将投影相机几何编码融入空间降采样 token 的注意力计算，以较低开销保留相机控制能力。", "通过 causal forcing 将双向视频生成器转换为少步自回归模型，并用 DMD-style distillation 和长时程 rollout 训练适应连续生成。", "使用模型自生成的长时程上下文进行训练，减少分段生成时累积的风格和色彩漂移；通过基于相机几何的检索取回早先视图，并以 residual recycling 降低记忆潜变量误差的影响。", "加入 Event Instruction Tuning 学习可组合事件控制，再用 reinforcement learning alignment 恢复蒸馏后的相机控制与视觉质量。"], "formulas": [{"tex": "\\nabla_{\\theta} L_{\\mathrm{DMD}}=\\mathbb{E}_{x_t,t}\\left[w(t)\\left(s_{\\mathrm{real}}(x_t,t)-s_{\\mathrm{fake}}(x_t,t)\\right)\\frac{\\partial x_{\\theta}}{\\partial\\theta}\\right]", "caption": "DMD 式蒸馏的标准梯度写法，非原文；用于将生成器分布推向真实数据分布。"}], "train": "训练使用混合数据，并结合 causal forcing、DMD-style distillation、自生成长时程上下文训练、Event Instruction Tuning 和 reinforcement learning alignment。推理采用少步自回归生成；实现侧使用 mixed-precision DiT、residual reuse、75% 剪枝的 VAE 解码和异步 pipeline parallelism，在八张 RTX 5090 GPU 上最高达到 16 FPS。", "diff": "相较于直接自回归生成或单纯视频生成，DreamX-World 将投影相机几何纳入降采样 token 的注意力，并专门训练模型在自身生成的长历史上持续生成。它还结合相机几何检索的场景记忆与事件指令控制，以支持重访和可组合事件。", "limits": "最高 16 FPS 的报告结果依赖八张 RTX 5090 GPU 及多项推理优化，计算资源代价较高。摘要未明确说明记忆检索的容量、长时程效果边界或其他局限。", "has_abstract": true}, "tags": ["PRoPE条件", "键鼠动作"], "explain": "就像你在玩第一人称游戏时按键推摇杆甩鼠标，生成的画面很容易穿帮漂移，以前的世界模型很难把玩家键鼠操作和精准镜头轨迹绑在一起。高德开源的 DreamX-World 做了个 5B 参数的可运行模型，核心是在键鼠指令外引入了 PRoPE 相机条件，也就是一种把镜头旋转与位移直接喂给模型注意力的位置编码。这招管用是因为它给画面生成加上了物理视角准心，让场景严格顺着视点演化不走样，能以每秒 16 帧稳定跑出约一分钟的高清交互漫游。", "key_numbers": ["5B", "~1min", "704×1280 16FPS", "5s@720p 26s/40G", "~40GB"], "self_measured": [], "media": ["https://amap-ml.github.io/DreamX_World/assets/demo_videos/long_video/long_02.mp4"], "links": ["https://arxiv.org/abs/2606.16993"], "note": "报告未给提交日期；lane 依『PRoPE 相机条件』推断，非报告明述。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 3158, "sx": null}, {"id": "mirage", "title": "Mirage", "date": "2026-06-01", "precision": "month", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2606.09828", "venue": "", "training": "需训", "status": "速读", "one_liner": "存 latent 缓存而非几何，介于 L2/L3", "mechanism": "报告只有一句：存的是 latent 缓存，不是显式几何，归档在 L2 与 L3 之间。", "detail": {"position": "Mirage 解决视频世界模型跨帧生成时难以保持 3D 空间一致性的问题。它将场景信息持久存储在 diffusion latent 空间中，避免显式 RGB 点云记忆带来的计算开销与信息损失。", "io": "输入包括待存入记忆的 latent tokens，以及用于 3D 回投的 depth 信息；查询时根据目标视角合成对应的 latent 表示。摘要未明确列出相机参数等条件信号，也未具体说明最终输出格式。", "steps": ["将场景的 diffusion latent tokens 与 depth 对齐，为后续空间定位提供特征和深度信息。", "通过 depth-guided back-projection 将 latent tokens 提升到 3D，并写入持久化的 latent spatial memory，以保留场景信息而不经过 RGB 重建。", "根据查询视角从 latent spatial memory 中提取相关场景信息，并通过 direct latent-space warping 合成新视角的 latent 表示。", "利用合成的 latent 表示支持视频生成，从而维持跨帧空间一致性并减少重复渲染与 VAE encoding。"], "formulas": [{"tex": "\\mathbf{X}_t(u)=\\mathbf{T}_{w\\leftarrow c,t}\\left(D_t(u)\\mathbf{K}^{-1}\\tilde{u}\\right),\\qquad \\mathcal{M}_t=\\mathcal{M}_{t-1}\\cup\\{(\\mathbf{X}_t(u),\\mathbf{z}_t(u))\\}_u", "caption": "标准写法，非原文：用深度将 diffusion latent token 反投影到场景坐标，并写入持久化 latent spatial memory。"}, {"tex": "\\tilde{\\mathbf{z}}_q(u)=\\mathbf{z}_{\\mathcal{M}}\\!\\left(\\pi\\!\\left(\\mathbf{K}\\mathbf{T}_{c_q\\leftarrow w}\\mathbf{X}\\right)\\right)", "caption": "标准写法，非原文：将记忆中的 latent 特征按查询相机视角投影并采样，形成新视角的 latent 表示。"}], "train": "训练流程与关键设置摘要未给。推理时构建 latent spatial memory，并通过直接在 latent 空间中变形来查询和合成新视角；具体实现参数摘要未给。", "diff": "既有显式 3D 基线通常在 RGB 空间构建点云记忆，需要反复渲染和 VAE encoding，且像素空间往返会损失 learned latent representation 的特征。Mirage 直接缓存 latent tokens，并在 latent 空间中完成空间记忆查询与视角合成。", "limits": "摘要未见明确说明方法局限；其记忆构建依赖 depth-guided back-projection，但摘要未讨论深度信息误差的影响。", "has_abstract": true}, "tags": ["latent缓存", "非几何中介"], "explain": "就像出门做家具不想随身背着沉重完整的木质骨架，带一份折叠好的轻便尺寸图最省力。以往系统直接缓存展开的显式几何结构，体积过大容易造成存储和传输堵塞。Mirage 的解法是不存庞大的几何实体，改存 latent 缓存，也就是模型抽取出的紧凑特征这种中间状态，并把位置放在芯片高速缓存 L2 和 L3 之间。这种设计避开了显式几何的膨胀开销，同时卡在两级缓存之间，既不像塞在顶层那样撑爆空间，又比去下层读取更快，兼顾了体积与访问效率。", "key_numbers": [], "self_measured": [], "media": ["https://microsoft.github.io/LatentSpatialMemory/assets/figures/concept_hd.png", "https://microsoft.github.io/LatentSpatialMemory/assets/figures/efficiency.png", "https://microsoft.github.io/LatentSpatialMemory/assets/figures/pipeline_hd.png"], "links": ["https://arxiv.org/abs/2606.09828"], "note": "摘要级；lane 依『latent 缓存』暂定，报告未述寻址方式；无日期。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 2764, "sx": null}, {"id": "captain-safari", "title": "Captain Safari", "date": "2026-06-15", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2511.22815", "venue": "CVPR 2026", "training": "需训", "status": "速读", "one_liner": "带 retriever 的几何记忆，走外部库", "mechanism": "报告只在矩阵里标它用 retriever 从外部库取历史，与几何寻址配套，未述细节。", "detail": {"position": "Captain Safari 面向给定相机轨迹生成长时程、具备 3D 一致性且可交互探索的视频，重点应对激进 6-DoF 运动和复杂户外场景下的几何失稳与轨迹偏离。论文还构建 OpenSafari，用于评测高动态无人机视频中的相机控制生成。", "io": "输入是用户控制的相机轨迹，方法还使用持久化世界记忆中的信息作为条件信号。输出是沿目标轨迹生成的视频。", "steps": ["维护动态局部世界记忆，以保留生成过程中可供后续访问的场景信息，从而支持长程几何一致性。", "根据当前相机位姿从世界记忆中检索位姿对齐的 world tokens，以取得与当前观察位置相关的信息。", "将检索到的 tokens 用于条件化视频生成，使生成内容与相机轨迹及已有场景结构相协调。", "沿给定轨迹持续执行检索与生成，以支持具有挑战性的相机运动并减少轨迹偏离。"], "formulas": [{"tex": "q_t=f_{\\mathrm{pose}}(\\xi_t),\\qquad \\alpha_{t,i}=\\operatorname{softmax}_i\\!\\left(\\frac{q_t^{\\top}k_i}{\\sqrt{d}}\\right),\\qquad r_t=\\sum_{i\\in\\mathcal{M}_t}\\alpha_{t,i}v_i", "caption": "标准写法，非原文：根据当前相机位姿对动态世界记忆中的 world tokens 进行检索并加权聚合。"}, {"tex": "\\hat{x}_{t+1}=G(x_t,\\xi_t,r_t),\\qquad \\mathcal{M}_{t+1}=\\operatorname{Update}\\!\\left(\\mathcal{M}_t,\\hat{x}_{t+1},\\xi_t\\right)", "caption": "标准写法，非原文：利用检索到的位姿对齐记忆条件化视频生成，并将新生成的场景信息递归写回动态局部世界记忆。"}], "train": "摘要未给出训练流程、模型训练设置或优化细节。推理时根据相机轨迹维护动态局部记忆，检索位姿对齐的 world tokens，并以其条件化视频生成。", "diff": "与缺少持久场景记忆或难以执行激进相机运动的相机控制生成方法相比，Captain Safari 使用 retriever 从持久化世界记忆中检索位姿对齐的 tokens，再用于条件化生成。摘要报告其在视频质量、3D 一致性和轨迹跟随方面优于相机控制基线。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["retriever检索", "几何配套"], "explain": "就像出远门不把所有行李全背身上，而是把大件存进储物柜，用时按小票去取。Captain Safari 解决的就是智能体历史记忆负担过重、难以兼顾全局的麻烦。它给几何记忆配了一个检索器，也就是一个根据线索从外部资料库调取历史的提取工具。这个工具与几何寻址——即按照空间几何位置定位记忆的方式——相互配套。它管用在把历史经验外包给外部库，既轻量又能精准召回，使 MEt3R 指标改善了 0.0013。原报告只在矩阵中标注了该设计，具体实现细节并未展开。", "key_numbers": ["0.0013（MEt3R 改善）"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2511.22815", "https://johnson111788.github.io/open-safari/"], "note": "CVPR 2026；项目页 open-safari；用位姿对齐的 world token 检索做长程 3D 一致", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 2878, "sx": null}, {"id": "octworld", "title": "OctWorld", "date": "2026-09-01", "precision": "month", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2609.03919", "venue": "", "training": "需训", "status": "速读", "one_liner": "L4 显式几何缓存类长视频世界模型", "mechanism": "报告只把它列入 L4 显式几何缓存（与 GEN3C、spmem 同类），未述读写细节；该类依赖深度估计。", "detail": {"position": "OctWorld 面向长距离、广视角的相机路径生成，解决生成场景在回访已见区域时难以保持空间一致性的问题。它通过持久化 3D 几何记忆，支持从单张图像自回归生成可探索的场景视频。", "io": "输入为单张图像和用户指定的相机轨迹，生成沿轨迹展开的视频。相机轨迹是条件信号；生成过程还使用视觉观测及其对应的深度图构建和更新 3D 记忆。", "steps": ["以单张图像为起点，按照用户指定的相机轨迹逐步生成视觉观测，以形成沿路径延展的场景视频。", "为生成的视觉观测获取对应深度图，并将观测与深度信息用于构建场景的几何和外观记忆。", "将新观测通过 TSDF fusion 融合到动态稀疏八叉树 OctMap 中，以渐进扩展全局 3D 表示。", "根据图像证据自适应调整八叉树空间分辨率，以在不同场景尺度下保留细节并控制记忆开销。", "在后续生成中利用持久化的空间记忆应对已生成区域的回访，以提升长程视频的空间一致性。"], "formulas": [{"tex": "D_t(v)=\\frac{W_{t-1}(v)D_{t-1}(v)+w_t(v)d_t(v)}{W_{t-1}(v)+w_t(v)},\\qquad W_t(v)=W_{t-1}(v)+w_t(v)", "caption": "标准写法，非原文：利用新观测的有符号距离 d_t(v) 对体素 v 的 TSDF 几何记忆进行加权融合。"}, {"tex": "\\operatorname{split}(v)=\\mathbf{1}\\!\\left[\\operatorname{Var}_{x\\in v}\\bigl(d(x)\\bigr)>\\tau_{\\mathrm{geom}}\\ \\lor\\ \\operatorname{Var}_{x\\in v}\\bigl(I(x)\\bigr)>\\tau_{\\mathrm{app}}\\right]", "caption": "标准写法，非原文：依据局部几何或外观证据的变化，自适应细分八叉树节点以保留细节并控制记忆开销。"}], "train": "摘要未给出训练流程、损失函数或关键训练设置。推理时从单张图像出发，沿用户指定的相机轨迹进行稳定自回归生成，并渐进更新 OctMap；具体记忆读写细节摘要未给。", "diff": "关键差别是使用 TSDF fusion 与空间分辨率自适应的动态稀疏八叉树构建持久化 3D 记忆，而非点式缓存或固定分辨率 TSDF 体。摘要报告该设计在长程空间一致性和记忆开销方面有优势。", "limits": "该类显式几何缓存依赖深度估计，深度误差可能影响几何记忆；摘要未明确说明深度获取方式、计算代价及其他局限。", "has_abstract": true}, "tags": ["显式几何缓存", "深度依赖"], "explain": "就像你在虚拟房间里漫步，一回头却发现身后的门变形甚至消失了，长视频世界模型在漫游生成时常有前后空间错乱的麻烦。OctWorld 用的招数是显式几何缓存，也就是通过深度估计——估算物体离镜头有多远——把看过的三维结构像建档一样实实在在地存起来。这招管用，是因为它不再单靠模型去硬背模糊的二维画面，而是用真实的三维几何做底子；后续镜头不管怎么兜圈子回头，画面都能对照存好的空间骨架来画，场景自然不会变形穿帮。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2609.03919"], "note": "仅摘要级【摘】，引用前须核对；只给到月份 2026-09；training=需训为按 L4 类推断。", "parent": "vmem", "link_strength": "dashed", "key": false, "citations": 0, "x": 2680, "y": 2764, "sx": 1010, "sy": 2928.0, "cross": false}, {"id": "smart", "title": "SMART", "date": "2026-10-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2610.19257", "venue": "", "training": "需训", "status": "精读", "one_liner": "按空间槽召回：写用观测相机，读用渲染相机", "mechanism": "槽位数固定；写入按观测相机定归属、读取按当前渲染相机定取哪些槽；每份记忆附置信度，由 DiT 决定信多少。", "detail": {"position": "SMART 解决长时视频生成中的记忆矛盾：记忆需要容量有界以支持持续生成，又要能在相机重返旧地点时找回相关观察。它用空间寻址的槽位记忆实现位置相关的召回，而不依赖记忆新旧。", "io": "输入包括观察到的视频内容及其观测相机信息，以及生成时的渲染相机信息；输出是由 chunk-causal diffusion transformer 生成的视频内容。观测相机用于写入寻址，渲染相机用于读取寻址，读取结果及其置信度作为生成条件。", "steps": ["将记忆组织为固定数量的槽位并以递归方式更新，使存储容量保持有界。", "依据观测相机为新观察选择写入槽位，使记忆归属与观察到的空间区域相关。", "依据当前渲染相机查询相关槽位，使召回取决于视角间的空间关系而非时间间隔。", "为读取到的记忆估计置信度，并将内容与置信度提供给生成模型，使模型能够判断何时信任记忆。", "由 chunk-causal diffusion transformer 结合检索内容和自身生成先验生成视频块，使记忆不足以支持的位置仍可由模型生成。"], "formulas": [{"tex": "a_k(q)=\\frac{\\exp\\!\\left(-\\|p(q)-\\mu_k\\|_2^2/(2\\sigma^2)\\right)}{\\sum_{j=1}^{K}\\exp\\!\\left(-\\|p(q)-\\mu_j\\|_2^2/(2\\sigma^2)\\right)},\\qquad \\widetilde M(q)=\\sum_{k=1}^{K}a_k(q)M_k", "caption": "按当前相机位置对固定槽位进行空间寻址并聚合记忆；标准写法，非原文"}], "train": "摘要未给训练目标、训练数据细节或具体训练流程。推理时按渲染相机读取记忆，将检索内容及置信度交给 chunk-causal diffusion transformer；摘要称其在长轨迹上可超出训练时长保持高保真召回，并保持常数记忆与每步开销。", "diff": "相比基于重建的记忆，SMART 不构建显式 3D 表示，也不维护持续增长的缓存。相比固定大小的递归记忆，其召回由相机所指向的空间区域寻址，而不是随时间推移衰减。", "limits": "摘要未见明确说明具体局限；其方案依赖观测相机与渲染相机信息来寻址记忆。", "has_abstract": true}, "tags": ["观测相机写", "渲染相机读", "置信度门控"], "explain": "想象你在大房子里边走边拍，如果把沿途画面按时间硬塞在一起，生成长达256帧视频时模型就会把位置记混。SMART要解决的就是漫游时空间记忆混乱的麻烦。它的招数是按固定槽位存记忆，也就是把场景划成几个固定的虚拟储物格；写入时按当时的观测相机机位存进对应格子里，生成时按当前渲染相机位置定向翻找，且每条记忆都带置信度，由负责生成画面的DiT扩散网络决定采信多少。这招管用是因为它打破了死板的时间顺序，让调取记忆直接锁定空间位置，转回原处就能精准对齐。", "key_numbers": ["256 帧"], "self_measured": ["帧 418", "52.25s", "79.6s", "100.7s", "95s", "39.05dB", "34.53dB", "28.67dB", "帧 240", "19.37dB", "16.60dB", "14.73dB", "188s", "54.6s 1024×256", "226s 1024×256"], "media": ["demos/SMART/still_grid_4x2.png", "demos/SMART/return_4up.mp4", "demos/SMART/diff_2up.mp4", "demos/SMART/maze_gt.mp4", "demos/SMART/maze_ours.mp4", "demos/SMART/maze_dfot.mp4", "demos/SMART/maze_causal_FAIL.mp4", "demos/SMART/mc_still_4up_188.png", "demos/SMART/mc_4up.mp4"], "links": ["https://arxiv.org/abs/2610.19257"], "note": "所有 PSNR 都是报告作者在官方 demo 视频上自算，非论文指标（报告明确禁止当论文表格引用）；只给到月份 2026-10。", "parent": "vmem", "link_strength": "dotted", "key": true, "citations": 0, "x": 2954, "y": 3386, "sx": 1010, "sy": 2928.0, "cross": false}, {"id": "velox", "title": "Velox", "date": "2026-10-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2610.22311", "venue": "", "training": "免训", "status": "精读", "one_liner": "视锥 slab 裁注意力，只算几何重叠的历史", "mechanism": "把当前相机视锥切成若干几何 slab，用它们判断哪些历史片段有空间交集；命中的才进注意力，其余跳过。", "detail": {"position": "Velox 解决 chunked video diffusion 在长时交互生成中因 KV cache 随 rollout 增长而导致注意力和生成逐渐变慢的问题。它根据流式几何关系选择历史上下文，以减少需要计算的注意力。", "io": "输入包括当前视频块的相机视锥、历史块及模型为各层得到的 block importance。输出是供注意力计算使用的历史 block 路由；相机几何与深度提供条件信号。", "steps": ["将历史块表示为带深度区间的 camera frustum slabs，以建立历史内容的空间范围。", "通过 recency-priority multiwarp 获取当前块的深度，用于判断当前视锥区域与历史 slabs 的对应关系。", "对几何覆盖充分的区域，利用 frustum slab overlap 软调节各层的模型派生 block importance，以保留空间相关的历史上下文。", "对几何未覆盖的区域，沿用模型派生的路由而不加入几何偏置，避免缺少几何对应时强行筛选。", "按固定 token-block 粒度执行路由，使筛选结果适配 FlashAttention 风格的分块执行，并减少随 rollout 增长的注意力计算。"], "formulas": [{"tex": "O_{ij}=\\frac{\\operatorname{Vol}(C_i\\cap H_j)}{\\operatorname{Vol}(C_i)}", "caption": "标准写法，非原文：计算当前视锥 slab \\(C_i\\) 与历史 slab \\(H_j\\) 的归一化空间重叠度。"}, {"tex": "\\tilde{s}_{\\ell j}=s_{\\ell j}+\\lambda\\,\\mathbf{1}[i]\\;O_{ij},\\qquad \\mathcal{R}_{\\ell}=\\operatorname{TopK}_{j}(\\tilde{s}_{\\ell j})", "caption": "标准写法，非原文：用几何重叠度软调节模型派生的重要性分数，并按分数选择历史块；无几何覆盖时不加几何偏置。"}], "train": "Velox 是 training-free 方法，无需训练。推理时异步构建 frustum slabs，并与 denoising 在同一张 H200 上并行；摘要报告在 chunk 48 时 attention 加速 4.36 倍、denoising 加速 2.43 倍。", "diff": "不同于让后续块持续读取不断增长的 KV cache，Velox 使用 frustum slab 几何对应关系进行 region-level context selection，并以软方式调节模型派生的重要性。几何未覆盖区域仍使用原有模型路由，不施加几何偏置。", "limits": "摘要未见明确说明方法的局限或额外代价。", "has_abstract": true}, "tags": ["视锥slab", "几何重叠筛选"], "explain": "想象你拿着相机在房间转圈拍摄，如果每生成新的一帧，都要把身后看不见的旧画面翻出来算一遍关联，计算量会直接卡死。Velox解决的就是这种冗余开销。它把相机的视锥——也就是镜头能看到的锥形视野空间——横切成若干被称为slab的几何薄层，用它们判断哪些历史片段在三维里存在空间交集。只有交集命中的内容才进入注意力计算，其余全部跳过。因为视线外的死角本就无需交互，这种几何裁切在chunk 48下让注意力加速约4.36倍，整体去噪加速约2.43倍，而WBench精度仅损失0.15分。", "key_numbers": ["0.15 分（WBench 精度损失）", "约 4.36 倍（chunk 48 注意力加速）", "约 2.43 倍（整体去噪加速）"], "self_measured": [], "media": ["https://media.velox-world.com/velox/videos/thumbs/clip_01.jpg"], "links": ["https://arxiv.org/abs/2610.22311"], "note": "只给到月份 2026-10；报告称官方交互 demo 无 mp4 可下载。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 3500, "sx": null}, {"id": "hla-wm", "title": "HLA-WM", "date": "2026-10-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2610.05739", "venue": "", "training": "需训", "status": "精读", "one_liner": "混合线性注意力 + 几何引导的分块检索历史", "mechanism": "GDN 类线性注意力承担长序列大部分计算，softmax 只留精确交互；历史按空间关系分块，只取相关块进上下文。", "detail": {"position": "HLA-WM 旨在缓解 Gated DeltaNet 在长时间视频生成中对遥远但相关场景的渐进式遗忘，同时保留线性注意力的低内存优势。它通过几何引导的历史分块检索，补充固定大小 recurrent state 难以长期保留特定场景信息的问题。", "io": "输入是自回归视频生成过程中的历史信息、当前查询以及相机几何信息。输出是按当前查询重组的 recurrent state，供生成器用于后续视频生成与场景回访。", "steps": ["利用 Gated DeltaNet 处理长序列的大部分信息，并将历史按块整理，以避免完整保存不断增长的 KV cache。", "依据相机几何关系从历史块中检索与当前场景相关的内容，以找回可能被后续状态更新削弱的远距信息。", "缓存 Gated DeltaNet 的分块仿射转移摘要，以紧凑形式保留各历史块对状态转移的影响。", "根据当前查询重组检索块的转移摘要，计算 query-specific recurrent state，并用于后续视频生成。"], "formulas": [{"tex": "\\mathcal{R}_t=\\operatorname{TopK}_{c}\\,s\\!\\left(g_t,g_c\\right)", "caption": "按当前场景与历史块的几何关系检索相关块；标准写法，非原文"}, {"tex": "S_t^{(c)}=A_cS_{t-1}^{(c)}+b_c,\\qquad S_t^{\\mathrm{ret}}=\\left(\\prod_{c\\in\\mathcal{R}_t} A_c\\right)S_0+\\sum_{c\\in\\mathcal{R}_t}\\left(\\prod_{j>c}A_j\\right)b_c", "caption": "以仿射转移摘要重组检索块，得到 query-specific recurrent state；标准写法，非原文"}], "train": "HLA-WM 是 training-free 方法，无需额外训练。推理时缓存分块转移摘要，按相机几何检索相关历史块并重组 recurrent state；摘要未给出更具体的实现设置。", "diff": "相较于完整保留生成历史的 softmax attention，HLA-WM 用紧凑的分块摘要和选择性检索降低历史状态内存开销；相较于仅依赖固定大小 Gated DeltaNet state 的线性注意力，它能按几何关系重新访问相关历史。摘要报告在 60 秒上下文下，历史状态内存相较完整 KV caching 减少 12 倍，推理吞吐最多下降 1.6%。", "limits": "推理吞吐最多下降 1.6%。摘要未见对几何检索适用条件、失败情形或其他局限的明确说明。", "has_abstract": true}, "tags": ["线性注意力", "几何分块检索"], "explain": "想象自动驾驶车在街区兜风，想根据几十秒前的旧画面预测未来，把所有看过的帧全塞给模型会直接撑爆显卡。HLA-WM 专门解决这种长序列下世界模型算力吃紧的麻烦。它用了混合注意力，也就是让省显存的线性计算挑大梁，只把精密计算留给关键局部；再配合几何分块检索，按真实空间位置把历史画面打包，只挑眼前相关的块放进内存。这招甩掉了无用画面的死记硬背，把记忆开销砍到十二分之一，旋转误差降低28.5%，稳稳撑住一分钟高清长序列。", "key_numbers": ["旋转误差 −28.5%", "记忆开销 1/12", "60s 1280×704@16fps"], "self_measured": ["PSNR +0.74dB"], "media": ["demos/HLAWM/refiner_ours.mp4", "demos/HLAWM/refiner_baseline_FAIL.mp4"], "links": ["https://arxiv.org/abs/2610.05739"], "note": "数字是相对其自身基线，报告强调不可跨论文横比；只给到月份 2026-10。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2954, "y": 3158, "sx": null}, {"id": "l2r", "title": "L2R", "date": "2026-10-01", "precision": "month", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2610.11444", "venue": "", "training": "需训", "status": "精读", "one_liner": "把检索学进模型，靠 3D 重可见性触发", "mechanism": "历史存在模型持久状态里；相机条件门决定取什么，3D 重可见性信号决定何时取，平时不做检索。", "detail": {"position": "L2R 解决视频 world model 在长时程生成中容易发生场景漂移、重访区域时难以保持一致的问题。它把历史内容检索纳入模型自身的生成过程，而不是依赖外部 memory system。", "io": "输入是已有场景上下文与 camera trajectory，输出是与相机轨迹相对应的可探索场景视频。相机信号用于决定检索什么，3D re-visibility 信号用于训练检索触发器决定何时检索；摘要称生成时不需要额外的 3D 条件。", "steps": ["将历史上下文保存在模型的 persistent internal state 中，使其成为生成过程内部可访问的记忆。", "根据当前 camera trajectory，通过 camera-conditioned retrieval gate 从内部状态中选择相关历史信息，以确定检索什么。", "使用由 3D re-visibility 信号监督的 retrieval trigger 判断先前观察到的内容是否重新进入当前视野，以确定何时检索。", "触发时将选出的历史信息纳入视频生成；未触发时保留现有上下文，从而减少不必要的检索并改善重访区域的一致性。"], "formulas": [{"tex": "\\alpha_{t,i}=\\operatorname{softmax}_i\\!\\left(\\frac{q(c_t)^{\\top}k(m_i)}{\\sqrt{d}}\\right),\\qquad r_t=\\sum_i\\alpha_{t,i}v(m_i)", "caption": "相机条件检索：根据当前相机轨迹对持久状态中的历史记忆打分并聚合；标准写法，非原文"}, {"tex": "z_t=\\mathbb{1}[s_{\\mathrm{rev}}(c_t,\\mathcal{H}_{<t})>\\tau],\\qquad h_t^{\\mathrm{ctx}}=z_t r_t+(1-z_t)h_{t-1}^{\\mathrm{ctx}}", "caption": "由 3D 重可见性信号触发检索，并在未触发时保留现有上下文；标准写法，非原文"}], "train": "摘要说明使用 3D re-visibility signal 监督 retrieval trigger，并以 camera-conditioned retrieval gate 控制历史信息选择；未提供具体损失函数、训练数据、优化设置或训练与推理的完整流程细节。摘要称方法不需要外部 memory bank，生成时也不需要额外的 3D 条件。", "diff": "已有方法通常在模型外部设置 memory system，显式检索先前观察到的内容；L2R 则利用模型的 persistent internal state，并将检索的时机与内容选择纳入模型生成过程。这样无需单独的外部检索通路或 memory bank。", "limits": "摘要未见明确说明计算代价、内部状态容量限制或适用范围等局限。", "has_abstract": true}, "tags": ["重可见性触发", "模型内检索"], "explain": "就像在陌生大楼里巡逻，如果每走一步都把之前的巡检录像翻看一遍，脑子早晚卡死，但不翻又容易认不出走回了原地。L2R 解决的就是空间感知建模时，频繁翻看历史太耗算力、扔掉历史又容易遗忘的麻烦。它把走过的历史存在模型内部的持久状态里，平时完全不检索；只有收到 3D 重可见性——也就是镜头重新拍到曾去过的位置这一信号时才触发查阅，再由相机条件门——一个按当前视角挑记忆的开关——决定提取哪些内容。这样省去了每一步多余的计算开销，又能在故地重游时把关键记忆精准补齐。", "key_numbers": [], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2610.11444"], "note": "矩阵标注『3D 重可见性触发 → 偏几何』，lane 在内容/学习与几何/位姿之间存疑；只给到月份 2026-10。", "parent": "longlive-rag", "link_strength": "dotted", "key": false, "citations": 0, "x": 2954, "y": 3272, "sx": 1284, "sy": 3990.0, "cross": true}, {"id": "keepsake", "title": "Keepsake", "date": "2026-10-05", "precision": "day", "lane": "几何位姿寻址", "branch": "容量管理", "arxiv": "2610.06588", "venue": "", "training": "免训", "status": "精读", "one_liner": "按『有没有替代视图』决定留哪帧、扔哪帧", "mechanism": "给保留帧和新帧建 pose–appearance 图，用替代视图数量与最像替代品的相似度评估留存价值；只改写入与淘汰策略。", "detail": {"position": "Keepsake 解决长时程 camera-controlled video generation 中固定容量空间记忆如何随生成历史变化而持续更新的问题。它根据记忆帧当前拥有的替代视图来判断哪些帧可淘汰，以维持场景一致性。", "io": "输入是记忆库中保留的观测帧与新生成的观测帧，以及相应的 camera pose 和视觉外观信息；条件包括固定记忆容量。输出是更新后的持久记忆库，供原有生成系统使用。", "steps": ["汇集记忆库中保留的观测帧和新生成的观测帧，以便在同一候选集合中重新评估记忆价值。", "根据 camera pose 接近程度与视觉相似度构建 pose–appearance 图，以表示候选观测之间的替代关系。", "结合强替代视图的数量与最相似替代视图的相似度评估留存优先级，以识别替代支持较少、较难舍弃的观测。", "在固定容量约束下保留优先级较高的观测并淘汰高度可替代的观测，以持续更新记忆库。"], "formulas": [{"tex": "s_{ij}=\\mathbf{1}[d_{\\mathrm{pose}}(p_i,p_j)\\leq\\tau_p]\\,\\operatorname{sim}(a_i,a_j),\\qquad r_i=\\alpha\\sum_{j\\ne i}\\mathbf{1}[s_{ij}\\geq\\tau_s]+\\beta\\max_{j\\ne i}s_{ij}", "caption": "标准写法，非原文：以 pose 接近且外观相似的候选帧作为替代视图，并用替代视图数量和最相似替代视图的相似度衡量可替代性。"}, {"tex": "\\mathcal{M}_{t+1}=\\operatorname{TopK}_{i\\in\\mathcal{M}_t\\cup\\mathcal{N}_t}(-r_i)", "caption": "标准写法，非原文：在保留帧与新帧组成的候选集合中，固定容量保留可替代性较低、留存价值较高的观测。"}], "train": "Keepsake 是 training-free 的在线控制器，不需要训练。推理时仅调整持久记忆的写入与淘汰策略；host generator、denoising schedule 和 retrieval rule 保持不变。摘要未给出更具体的推理设置。", "diff": "Full-history 方法保留所有生成观测，存储与检索成本随历史增长；selective-construction 方法则一次性决定是否保留观测，之后不再调整。Keepsake 按当前记忆库中的替代关系在线重估观测价值，并在固定容量下淘汰可替代性高的帧。", "limits": "摘要未见明确说明代价与局限。", "has_abstract": true}, "tags": ["替代视图打分", "固定容量淘汰"], "explain": "就像你在景区拍了上千张照片但手机空间告急，同一个景点连拍十张就是纯粹浪费。在长视频处理中显存有限，最怕存下一堆重复视角却漏掉关键死角。Keepsake 只改造了帧的写入与淘汰策略。它给新旧帧建立位姿外观图，也就是把相机机位和画面长相连成网络，计算某帧有没有替代视角、替补有多像。这招管用是因为它精准扔掉随时有替补的帧，死守不可替代的视角。面对 180 秒轨迹的 5397 帧，它仅保留 32 帧，衡量视频质量的 FVD 指标就降低了 35.1%。", "key_numbers": ["180 秒轨迹", "5397 帧", "保留 32 帧", "FVD 降低 35.1%"], "self_measured": [], "media": [], "links": ["https://arxiv.org/html/2610.06588"], "note": "FVD 降幅是固定容量比较下的画质指标，不是回访事件成绩（报告明确口径）；日期来自报告正文括号，是全篇唯一带日的条目之一。", "parent": null, "link_strength": "", "key": true, "citations": 0, "x": 2954, "y": 3018, "sx": null}, {"id": "gear", "title": "Geometry as Address (GEAR)", "date": "2026-09-28", "precision": "day", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2609.34722", "venue": "", "training": "训练", "status": "待精读", "one_liner": "几何只负责寻址，注意力决定取什么", "mechanism": "历史不融成全局 3D 只留帧 latent；每帧几何建 token 级对应，GCA 把命中特征注入目标 patch，octree 剔遮挡伪对应。", "detail": {"position": "GEAR 解决长时程、受相机轨迹控制的视频生成中，历史内容难以高效检索以及全局 3D 记忆融合会累积几何误差的问题。其核心是让几何提供视觉记忆的读取地址，由注意力决定恢复哪些内容。", "io": "输入为历史帧 latent、每帧几何信息和目标视角下的噪声视频 patch，输出为符合相机控制且能与历史内容保持一致的视频。相机轨迹提供目标视角条件，几何对应关系与可见性证据用于引导历史特征检索。", "steps": ["将历史观察保留为各帧 latent，而不融合成持久全局 3D 表示，以避免融合过程中的误差累积。", "利用各帧几何信息建立历史帧与目标视图之间的 token 级对应，以确定目标 patch 应读取的历史位置。", "通过 Invisible Octree 累积可见性证据并排除几何上看似匹配但实际被遮挡的对应，以减少错误检索。", "在去噪过程中用 Geometric Correspondence Attention 将匹配的历史特征选择性注入目标 patch，以恢复相关视觉内容并保持跨视角一致性。"], "formulas": [{"tex": "\\mathbf{y}_p=\\mathbf{x}_p+\\sum_{(i,u)\\in\\mathcal{C}(p)}\\operatorname{softmax}_{(i,u)\\in\\mathcal{C}(p)}\\!\\left(\\frac{(W_Q\\mathbf{x}_p)^\\top(W_K\\mathbf{h}_{i,u})}{\\sqrt{d}}\\right)W_V\\mathbf{h}_{i,u}", "caption": "标准写法，非原文：GCA 根据查询 patch 与几何对应的历史 token 的注意力分数，选择性聚合历史特征；\\(\\mathcal{C}(p)\\) 表示通过可见性筛选的对应集合。"}], "train": "摘要未给训练数据、损失函数或训练设置。推理时在去噪目标 patch 的过程中，依据几何对应检索历史特征，并由 Invisible Octree 过滤遮挡对应；具体采样与关键参数摘要未给。", "diff": "与隐式搜索历史上下文的方法相比，GEAR 用几何显式建立 token 级读取地址。与将历史重建并融合进持久全局 3D 记忆的方法相比，它保留帧 latent，仅用逐帧几何路由注意力，从而避免全局融合造成的持续误差累积。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["令牌寻址", "位姿对应", "遮挡剔除"], "explain": "想象镜头绕着一张桌子转：生成新画面时，模型得记住旧镜头里桌上的杯子，却不能把所有历史画面硬揉成一张庞大的三维地图。GEAR要解决的正是长视频里记忆难保存、遮挡又容易认错的问题。它把每帧压成潜在表示，也就是精简的画面记忆；再用几何信息为新旧画面中的小块内容配对。几何引导注意力（GCA）是一种按需取信息的机制：几何只指出可能对应的位置，模型再决定取哪些特征，注入当前画面对应区域。八叉树则像层层划分空间的格子，用来剔除被遮挡造成的假配对。这种分工避免了维护完整三维世界的负担，也让模型能借用真正相关的旧信息，支持分钟级视频生成。摘要未提供帧数或量化指标。", "key_numbers": ["分钟级视频生成", "摘要未给帧数/指标"], "self_measured": [], "media": ["https://zju3dv.github.io/geometry-as-address/material/Motivation/motivation.mp4", "https://zju3dv.github.io/geometry-as-address/material/Methods/vis_method.mp4"], "links": ["https://arxiv.org/abs/2609.34722", "https://zju3dv.github.io/geometry-as-address/"], "note": "主线最直接对标：camera trajectory 条件 + 可回溯空间记忆，且明确反对把几何当\"解释\"、只当\"地址\"，正好避开全局融合误差累积（与我们主线假设同构）。建议优先精读。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2680, "y": 3158, "sx": null}, {"id": "lyra2", "title": "Lyra 2.0 - Explorable Generative 3D Worlds", "date": "2026-04-14", "precision": "day", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2604.13036", "venue": "", "training": "训练", "status": "速读", "one_liner": "逐帧几何仅做信息路由，治空间遗忘", "mechanism": "维护逐帧 3D 几何只用于检索相关历史帧并与目标视角建稠密对应，外观交给生成先验；另用自增强劣质历史训练纠时间漂移，再微调前馈重建出 3D。", "detail": {"position": "本文要解决长视角轨迹下生成式 3D 场景构建中的空间遗忘与时间漂移问题，使生成视频在大范围探索和地点重访时仍保持 3D 一致性。目标是进一步从长程生成视频中恢复可实时渲染和仿真的 3D 场景。", "io": "输入为场景探索过程中的目标相机视角序列及生成历史，目标相机视角作为条件信号。输出为长程、具 3D 一致性的生成视频，并通过前馈重建模型恢复 3D 场景。", "steps": ["为生成历史中的各帧维护 3D 几何，以便在目标视角到来时定位相关历史信息。", "依据几何检索相关历史帧，并建立历史帧与目标视角之间的稠密对应，以缓解重访区域时因空间遗忘造成的结构幻觉。", "将检索和对应结果用于信息路由，而由生成先验合成目标视角的外观，避免把几何表示当作外观生成来源。", "使用模型自身生成且带有退化的历史进行自增强训练，使模型学会纠正累积误差而非延续时间漂移。", "用长程生成视频微调前馈 3D 重建模型，以恢复适用于实时渲染和仿真的场景几何与表示。"], "formulas": [{"tex": "s_i(q)=\\frac{1}{|\\mathcal{P}_i|}\\sum_{\\mathbf{X}\\in\\mathcal{P}_i}\\mathbf{1}\\!\\left[\\pi_q(\\mathbf{X})\\in\\Omega_q\\right]", "caption": "依据历史帧几何与目标视锥的投影重叠度进行检索的标准写法，非原文"}, {"tex": "\\mathcal{L}_{\\mathrm{self}}=-\\mathbb{E}_{(H,V),\\,\\widetilde{H}\\sim\\mathcal{D}(H)}\\left[\\log p_\\theta(V\\mid\\widetilde{H},q)\\right]", "caption": "用退化历史训练模型生成目标视角、以纠正时间漂移的标准写法，非原文"}], "train": "训练时使用自增强历史，让模型接触自身退化输出并学习纠正时间漂移；再用长程生成视频微调前馈重建模型。推理时按目标相机视角检索相关历史帧并建立稠密对应，由生成先验合成外观；具体网络结构、损失函数和训练设置摘要未给。", "diff": "不同于仅依赖有限时间上下文的长视频生成方法，Lyra 2.0 用逐帧 3D 几何检索历史信息并建立稠密对应，但不以几何直接决定外观。它还通过自增强历史训练模型纠正自身输出中的漂移，并将长程视频用于微调前馈 3D 重建。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["信息路由", "漂移纠正", "大场景重访"], "explain": "想象你让模型在一座房子里边走边拍：走远再回到厨房，它可能把门窗位置记错，画面接不上，这就是长视频生成中的空间遗忘。Lyra 2.0不让几何负责画得逼真，而把每帧的三维结构当作地图索引：按当前视角找回相关旧帧，再建立稠密对应，也就是逐处匹配新旧画面的位置；外观则交给生成先验补全。它还用自增强得到的劣质历史片段训练模型纠正时间漂移，并微调前馈重建模块恢复三维。这样，几何帮模型找对看过哪里，生成模型专心画好细节，因此更能在长轨迹中重访地点并保持空间一致。论文摘要未给出具体指标。", "key_numbers": ["长轨迹+位置重访", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2604.13036", "https://research.nvidia.com/labs/sil/projects/lyra2/"], "note": "与 GEAR 同期且思路同构（几何只管 routing、外观交给生成先验），是工业侧独立验证；区别在 Lyra 2.0 用自增强历史专治 temporal drifting，GEAR 用 octree 治遮挡伪对应。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1858, "y": 3158, "sx": null}, {"id": "ucm", "title": "UCM - Unified Modeling of Camera Control and Memory", "date": "2026-02-26", "precision": "day", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2602.22960", "venue": "", "training": "训练", "status": "速读", "one_liner": "位姿编码扭曲统一相机控制与记忆", "mechanism": "时间感知位置编码按目标位姿 warp 历史帧特征，把重访取历史与相机控制并到同一条件通道；双流 DiT 降开销，点云渲染造重访数据。", "detail": {"position": "UCM 解决视频生成世界模型重访场景时长期内容不一致，以及难以按用户输入精确控制相机的问题。它通过统一建模历史记忆与相机控制，面向高保真交互式视频生成。", "io": "输入包括单目视频、历史帧特征和目标相机位姿等条件信号，输出为受相机控制且保持场景一致的生成视频。摘要未给出完整输入格式及具体条件编码方式。", "steps": ["利用点云渲染模拟对场景的再次访问，并据此整理训练数据，以构造包含重访情况的监督样本。", "将历史帧特征与目标相机位姿作为生成条件，使模型能够利用已有场景内容并响应相机控制。", "按目标位姿对时间感知位置编码进行 warp，将重访时的历史信息与相机控制合入同一条件通道，以建立空间对应关系。", "通过双流 Diffusion Transformer 处理条件与生成过程，以降低计算开销并生成高保真视频。"], "formulas": [{"tex": "\\widetilde{\\mathbf F}_{\\mathrm{hist}}=\\mathcal W(\\mathbf F_{\\mathrm{hist}};\\mathbf T_{\\mathrm{hist}},\\mathbf T_{\\mathrm{target}}),\\qquad \\mathbf C=\\operatorname{Concat}(\\widetilde{\\mathbf F}_{\\mathrm{hist}},\\mathbf E_{\\mathrm{pose}}(\\mathbf T_{\\mathrm{target}}))", "caption": "标准写法，非原文：按目标相机位姿 warp 历史特征，并与目标位姿编码合并为生成条件。"}], "train": "训练数据由点云渲染模拟场景重访的策略构造，覆盖超过 500K 个单目视频。模型采用双流 Diffusion Transformer。推理时以历史帧信息和目标相机位姿为条件生成视频；优化器、损失函数、训练细节及推理参数摘要未给。", "diff": "不同于依赖显式 3D 重建、在无界场景中灵活性受限的方法，UCM 以时间感知位置编码 warp 建立历史帧与目标位姿的对应。不同于仅直接复用先前生成帧而缺少显式空间对应的方法，它将长期记忆与精确相机控制统一到同一条件通道。", "limits": "摘要指出相关既有路线存在灵活性、细粒度结构保持或可控性方面的困难，但未见对 UCM 自身代价与局限的明确说明。", "has_abstract": true}, "tags": ["编码扭曲", "相机控制", "双流DiT"], "explain": "想象镜头绕屋一圈后回到门口：模型既要按要求转动镜头，又得记得门口原来的样子，常常顾此失彼。UCM把相机控制和历史记忆放进同一条条件通道：位姿，也就是相机的位置与朝向，会用时间感知的位置编码来扭曲历史画面特征，让模型按当前视角取回对应记忆。这样，转镜头和认旧景不再是两套互不相干的任务。双流扩散变换器让这套处理更省计算；点云渲染则从三维场景生成重访画面，补足训练数据。模型还利用50万多段单目视频学习，让控制更稳、重访更连贯。", "key_numbers": ["50万+单目视频"], "self_measured": [], "media": ["https://humanaigc.github.io/ucm-webpage/video/demo/0001_gen.mp4", "https://humanaigc.github.io/ucm-webpage/video/demo/0002_gen.mp4"], "links": ["https://arxiv.org/abs/2602.22960", "https://humanaigc.github.io/ucm-webpage/"], "note": "与 VMem/SMART 路线对照：不重建显式几何，把位姿差异写进位置编码做 warp，属\"位姿视锥\"分支的轻量解。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 3158, "sx": null}, {"id": "anchorweave", "title": "AnchorWeave", "date": "2026-02-16", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2602.14941", "venue": "", "training": "训练", "status": "速读", "one_liner": "弃全局融合，改检索多块局部几何", "mechanism": "单块全局记忆必然把位姿/深度误差融成噪声几何；改为按目标轨迹做覆盖率驱动的局部记忆检索，再用多锚编织控制器在生成中调和对齐误差。", "detail": {"position": "AnchorWeave 解决 camera-controllable video generation 在长时间跨度下难以保持空间世界一致性的问题。它避免将多视角几何融合成可能含噪的全局记忆，转而使用多个局部几何记忆并在生成时协调它们。", "io": "输入包括历史视频形成的局部几何记忆和目标相机轨迹，输出为受相机控制的视频。生成时的条件信号包括按目标轨迹检索的局部记忆，以及多锚编织控制器对这些记忆的整合结果。", "steps": ["从历史多视角信息构建多个局部几何记忆，而不将它们融合为单一全局场景，以避免位姿和深度误差累积成噪声几何。", "根据目标相机轨迹进行覆盖率驱动的局部记忆检索，以选出与生成路径相关的记忆。", "将检索到的多个局部记忆交给多锚编织控制器，以在生成过程中调和不同视角间的几何不一致。", "依据这些局部几何条件生成受相机控制的视频，以改善长时段场景一致性并维持视觉质量。"], "formulas": [{"tex": "C(M_i,\\tau)=\\frac{1}{T}\\sum_{t=1}^{T}\\mathbf{1}\\left[\\mathrm{vis}(M_i,t)\\right],\\qquad \\mathcal{R}(\\tau)=\\operatorname{TopK}_{M_i} C(M_i,\\tau)", "caption": "按目标相机轨迹计算局部记忆覆盖率并检索 Top-K；标准写法，非原文"}, {"tex": "\\alpha_{t,i}=\\operatorname{softmax}_{i}\\!\\left(\\frac{q_t^{\\top}k_i}{\\sqrt{d}}+\\lambda C(M_i,\\tau)\\right),\\qquad z_t=\\sum_{M_i\\in\\mathcal{R}(\\tau)}\\alpha_{t,i}v_i", "caption": "生成时按内容相关性与轨迹覆盖率加权协调多个局部锚点；标准写法，非原文"}], "train": "摘要未给训练流程、推理细节或关键设置。", "diff": "已有 memory-based 方法通常从融合后的全局 3D 场景渲染 anchor videos，再以其条件化生成；AnchorWeave 改为检索多个局部几何记忆，并通过多锚控制器在生成时协调它们。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["局部记忆", "覆盖率检索", "多锚融合"], "explain": "想象摄像机沿着街道前进：若把所有旧画面硬压进一张地图，位置和远近估错一点，街景就会糊成彼此打架的几何。AnchorWeave要解决的，正是视频生成时记忆越多、场景结构反而越不可靠的问题。它不再做一份包打天下的全局记忆，而是沿着目标镜头轨迹，挑出能覆盖当前视野的局部记忆块；“覆盖率驱动”就是优先取能补足眼前区域的信息。生成时，多锚编织控制器再把这些记忆块当作多个参照点，逐步调和它们的位置对齐误差。这样既不必让一处错误污染整张场景，也能让不同画面共享的结构彼此衔接。论文发表于ECCV 2026。", "key_numbers": ["ECCV 2026"], "self_measured": [], "media": ["https://zhangyuejoslin.github.io/images/anchorweaver_teaser.mp4", "https://zunwang1.github.io/AnchorWeave/long_videos/alley.mp4"], "links": ["https://arxiv.org/abs/2602.14941", "https://zunwang1.github.io/AnchorWeave"], "note": "直接给\"全局 3D 融合会累积跨视角不对齐\"的反证，可作为我们放弃持久全局表示的依据之一。", "parent": null, "link_strength": "", "key": false, "citations": 1, "x": 1310, "y": 2764, "sx": null}, {"id": "worldstereo", "title": "WorldStereo", "date": "2026-03-02", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2603.02049", "venue": "", "training": "微调", "status": "速读", "one_liner": "增量点云+空间立体记忆双模块", "mechanism": "全局几何记忆用增量更新点云注入粗结构先验并锁相机；空间立体记忆用 3D 对应约束注意力感受野，从记忆库取细粒度细节，生成结果可直接重建 3D。", "detail": {"position": "WorldStereo 旨在解决 Video Diffusion Models 生成视频难以精确控制相机、且不同视角内容不一致，因而难以重建一致 3D 场景的问题。它通过几何记忆模块连接相机引导视频生成与 3D 重建。", "io": "输入可从透视图像或全景图像开始，并以相机轨迹作为控制信号。输出是在相机控制下生成的多视角一致视频，可用于高质量 3D 场景重建。", "steps": ["根据输入图像和相机轨迹建立全局几何记忆，并增量更新点云，以提供粗结构先验并精确控制相机。", "将点云等几何信息用于生成过程，减少视角变化时场景结构与内容的不一致。", "通过空间立体记忆中的 3D 对应关系约束注意力感受野，使模型从记忆库检索细粒度细节。", "生成受相机轨迹控制且多视角一致的视频，并据此进行 3D 重建。"], "formulas": [{"tex": "\\mathcal{P}_t=\\operatorname{Fuse}\\!\\left(\\mathcal{P}_{t-1},\\operatorname{BackProj}(I_t,\\mathbf{T}_t,D_t)\\right)", "caption": "标准写法，非原文：利用当前图像、相机位姿与深度反投影结果增量更新全局几何记忆中的点云。"}, {"tex": "\\mathbf{A}_{ij}=\\operatorname{softmax}_j\\!\\left(\\frac{\\mathbf{q}_i\\mathbf{k}_j^{\\top}}{\\sqrt{d}}+\\log\\mathbf{1}\\!\\left[\\lVert\\mathbf{x}_i-\\mathbf{x}_j\\rVert<\\epsilon\\right]\\right),\\qquad \\mathbf{y}_i=\\sum_j\\mathbf{A}_{ij}\\mathbf{v}_j", "caption": "标准写法，非原文：利用记忆中三维对应点约束注意力感受野，并从空间立体记忆检索细粒度特征。"}], "train": "摘要称 WorldStereo 采用 flexible control branch，利用经过 distribution matching distillation 的 VDM backbone，无需 joint training。具体训练数据、损失函数及推理参数摘要未给。", "diff": "相较于缺少几何记忆、难以保证跨视角一致性的生成方法，WorldStereo 同时使用增量点云进行全局几何控制，并用 3D 对应关系约束空间立体记忆中的注意力。其控制分支可利用蒸馏后的 VDM backbone，无需联合训练。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["增量点云", "立体记忆", "可重建"], "explain": "想象镜头沿着房间缓缓前进：门的位置不能忽左忽右，墙上的纹理也不能每转一次就变样。视频世界模型常会丢失这种空间连续性，画面看着连贯，重建成三维时却可能对不上。WorldStereo把透视图或全景图输入后，分别维护两种记忆：全局几何记忆用增量点云，也就是逐步累积的三维点，保存场景轮廓并约束相机位置；空间立体记忆则用三维对应关系限制注意力，让模型从记忆库取回细节。前者稳住大结构，后者补足局部纹理，因此生成画面既更一致，也能直接重建为三维场景。", "key_numbers": ["透视/全景图输入", "摘要未给帧数"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2603.02049"], "note": "走\"生成即可重建\"路线，与 GEN3C 同族但记忆拆成粗点云+细立体两级；training=微调为摘要\"基于蒸馏 VDM 主干、无需联合训练\"的推断。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1584, "y": 2764, "sx": null}, {"id": "evoworld", "title": "EvoWorld", "date": "2025-10-01", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2510.01183", "venue": "", "training": "训练", "status": "速读", "one_liner": "全景生成+演进式显式3D记忆", "mechanism": "先出帧，再用前馈即插即用 transformer 增量演进 3D 重建，把重建几何重投影到目标视角作条件；建含闭环检测的长程基准。", "detail": {"position": "EvoWorld 解决从单张全景图出发进行长时程环境探索时，生成视频容易出现空间不一致的问题。它将全景视频生成与不断演进的显式 3D 记忆结合，以维持跨视角和长轨迹的场景一致性。", "io": "输入是一张全景图，输出是面向未来视角的全景视频帧。生成过程使用细粒度视角控制，并以演进式 3D 重建的几何重投影作为空间条件信号。", "steps": ["以输入全景图为起点，使用带细粒度视角控制的视频生成器生成未来帧，为后续探索提供视频内容。", "根据生成的帧，使用前馈 plug-and-play transformer 增量演进场景的 3D 重建，以维护随探索更新的显式空间记忆。", "将演进式 3D 重建的几何投影到目标视角，形成空间条件并用于合成后续未来帧，以提升视觉真实感和几何一致性。", "在合成新帧后继续更新 3D 记忆，使其支持长轨迹探索及闭环场景的一致性评估。"], "formulas": [{"tex": "\\hat{V}_{t+1:t+K}=G_{\\theta}\\!\\left(V_{0:t},\\,\\Pi(M_t,\\,\\mathcal{C}_{t+1:t+K})\\right)", "caption": "利用当前显式 3D 记忆投影得到的空间条件，生成目标视角下的未来视频帧；标准写法，非原文"}, {"tex": "M_{t+1}=\\operatorname{Update}\\!\\left(M_t,\\operatorname{Lift}\\!\\left(\\hat{V}_{t+1:t+K},D_{t+1:t+K},\\mathcal{C}_{t+1:t+K}\\right)\\right)", "caption": "将生成帧及其深度信息反投影到世界坐标并增量更新显式 3D 记忆；标准写法，非原文"}], "train": "摘要未给训练流程、损失函数或关键训练设置。推理时先生成未来帧，再演进 3D 重建，并将重建几何重投影为后续视频合成的条件信号。", "diff": "区别于仅合成视频的既有方法，EvoWorld 将演进式显式 3D 重建作为视频生成的空间引导，并通过几何重投影为目标视角提供空间线索。论文还提出覆盖合成户外环境、Habitat 室内场景和真实场景的长程探索基准，强调闭环检测与空间连贯性。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["全景生成", "演进重建", "闭环检测"], "explain": "想象你站在一间屋子的中央，先拍下一张全景图，再让镜头一路转动。只靠逐帧生成，墙角和门的位置可能慢慢跑偏，走回原处时，房间也未必还像原来。EvoWorld从单张全景图出发，先生成新画面，再用前馈式即插即用变换器逐步更新三维重建，也就是场景的空间几何记忆；随后把记忆投影到下一视角，作为生成条件。这样每一帧都能借用已有的空间信息，减少长视频里的几何漂移。论文还建立了长程评测集，加入闭环检测，即判断镜头是否回到曾经到过的位置，用来检验模型能否认出并保持场景一致。", "key_numbers": ["单张全景图输入", "含闭环检测的评测集"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2510.01183", "https://github.com/JiahaoPlus/EvoWorld"], "note": "有开源代码与闭环评测，可作几何泳道\"重访一致性\"实验参照。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 762, "y": 2764, "sx": null}, {"id": "geo-context", "title": "Geometry-as-context", "date": "2026-02-25", "precision": "day", "lane": "几何位姿寻址", "branch": "显式几何库", "arxiv": "2602.21929", "venue": "", "training": "训练", "status": "速读", "one_liner": "3D几何当上下文训进生成器", "mechanism": "自回归相机控制生成器交替估计当前视角几何、重建并渲染新视角图；训练时把几何图与 RGB 混编成序列并随机丢弃几何，推理只出 RGB，另加相机门控注意力。", "detail": {"position": "本文研究沿相机轨迹生成与三维场景一致的视频，目标是减少已有方法因中间结果错误、非可微流程及模型分离而累积的误差。核心思路是将场景几何作为生成过程中的上下文。", "io": "输入是文本上下文和相机轨迹，模型在生成过程中还使用当前视角的几何信息。输出包括用于三维重建的几何估计，以及由场景渲染并修复的新视角 RGB 图像；推理时目标是生成 RGB 图像。", "steps": ["根据当前视角和相机条件估计重建所需的几何，以便构建场景的三维表示。", "利用估计的几何重建三维场景，并按相机轨迹模拟新视角图像，以获得符合目标视角的场景内容。", "恢复渲染得到的新视角图像，减轻渲染结果与生成图像之间的差异。", "将几何估计和新视角图像生成作为自回归循环中的交替任务，并通过 camera gated attention 强化模型对相机位姿的利用。"], "formulas": [{"tex": "G_t = f_{\\mathrm{geo}}(I_{<t}, c_{\\le t}),\\quad \\tilde I_t = \\mathcal{R}(G_{\\le t}, c_t),\\quad I_t = f_{\\mathrm{rgb}}(\\tilde I_t, c_t)", "caption": "标准写法，非原文；表示自回归生成中交替估计几何、按当前相机位姿渲染新视角并生成 RGB 图像。"}], "train": "训练时以文本上下文指定生成几何图像或 RGB 图像，并将文本、图像与几何交错组成序列；训练中随机丢弃几何上下文，使模型推理时能够只生成 RGB。推理时使用自回归相机控制生成器，迭代估计当前视角几何并模拟、恢复新视角图像。摘要未给具体损失函数或训练配置。", "diff": "不同于依赖外部记忆的生成方法，也不同于迭代进行三维重建与修复的流程，本文在同一个自回归相机控制生成框架中交替处理几何估计和新视角生成。它通过几何上下文和 camera gated attention 提升场景一致性与相机控制能力。", "limits": "未见明确说明", "has_abstract": true}, "tags": ["几何上下文", "相机门控", "往返轨迹"], "explain": "想象镜头绕桌上的茶壶转一圈，转回原位时壶嘴却变了方向，桌面纹理也对不上；视频生成器常难既听懂相机怎么动，又让场景在新视角下保持一致。Geometry-as-context把三维几何——描述物体位置与形状的空间线索——当作生成上下文：模型随相机移动，交替估计当前视角的几何，再据此重建、渲染新视角图像。训练时，它把几何图和RGB图像（红、绿、蓝三色画面）混成序列，并随机拿掉几何，让模型学会借助几何、又不依赖显式几何；推理时只生成图像。相机门控注意力会按镜头运动筛选信息。空间结构因此能约束外观变化，减少视角漂移。论文发表于CVPR 2026，并用镜头先离开、再返回的往返轨迹检验模型能否认出同一场景。", "key_numbers": ["CVPR 2026", "往返（forth-and-back）轨迹"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2602.21929"], "note": "把几何当\"中间上下文 token\"而非外部库，是显式几何库与上下文两条路的缝合；已验证往返轨迹场景。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 1310, "y": 2878, "sx": null}, {"id": "gim-world", "title": "GIM-World: Geometry-Aware Implicit Memory for Video World Models", "date": "2026-06-01", "precision": "day", "lane": "几何位姿寻址", "branch": "位姿视锥", "arxiv": "2606.02436", "venue": "", "training": "训练", "status": "速读", "one_liner": "隐式记忆令牌可被相机位姿查询", "mechanism": "轻量 transformer 把变长历史压成定长记忆令牌；训练时用相机可查询几何头从冻结基础模型蒸馏 3D 结构进令牌，信息引导剪枝控编码成本，教师推理时丢弃。", "detail": {"position": "这篇工作解决视频 world model 在长时序 rollout 中，历史观测离开上下文窗口后难以保留场景信息的问题。它重点让压缩后的隐式记忆保留跨视角 3D 几何，从而提升长期几何与视觉一致性。", "io": "输入是变长的视频历史，记忆可由相机位姿查询几何信息。输出是固定大小的 memory tokens，供视频 world model 在长时序生成中使用；摘要未说明其他条件信号。", "steps": ["将变长历史输入轻量 transformer encoder，压缩为固定大小的 memory tokens，以控制记忆表示的规模。", "训练时使用 camera-queryable geometry head，从冻结 foundation model 蒸馏 3D 场景结构到记忆令牌，以增强跨视角几何信息。", "随历史增长应用 information-guided pruning，筛除信息贡献较低的内容，以控制编码成本。", "推理时移除 geometry teacher，保留轻量记忆模块供 world model 使用，以降低部署负担。"], "formulas": [{"tex": "M_t = \\operatorname{Enc}_{\\theta}(H_{\\le t}) \\in \\mathbb{R}^{K \\times d}", "caption": "将变长历史压缩为固定数量的记忆令牌；标准写法，非原文"}, {"tex": "\\mathcal{L}_{\\mathrm{geo}} = \\mathbb{E}_{c}\\!\\left[\\left\\|G_{\\phi}(M_t,c)-G_{\\mathrm{teacher}}(H_{\\le t},c)\\right\\|_2^2\\right]", "caption": "以相机查询几何头匹配冻结基础模型提供的几何监督；标准写法，非原文"}], "train": "训练时由轻量 transformer 将历史压缩为固定大小令牌，并通过 camera-queryable geometry head 将冻结 foundation model 提供的 3D 结构蒸馏进记忆；information-guided pruning 用于限制历史增长时的编码成本。推理时丢弃 geometry teacher。摘要未给具体损失函数、训练数据设置或超参数。", "diff": "相比显式保存帧或在线 3D 重建的记忆方式，它采用紧凑的隐式记忆，避免直接依赖启发式检索或重建结果。相比既有隐式记忆，它显式约束令牌编码跨视角场景几何，并使几何信息可由相机位姿查询。", "limits": "摘要未见明确说明方法局限；训练阶段需要冻结 foundation model 和几何头，具体计算代价未给出。", "has_abstract": true}, "tags": ["隐式记忆", "相机查询", "几何蒸馏"], "explain": "机器人走进房间，转身后还要知道桌子在身后，而不只是记得画面。视频世界模型把漫长历史压缩成有限状态，普通压缩容易丢掉物体间的空间关系，令新视角预测失准。GIM-World用轻量Transformer（一种整合序列信息的网络）把变长历史压成定长记忆令牌；训练时，几何头按相机位姿（位置与朝向）查询令牌，并让它们模仿参数固定的基础模型提供的三维结构。信息引导剪枝优先保留有用内容，降低编码成本；推理时，教师模型可以丢弃，不增加额外负担。这样，记忆既紧凑，又能按视角找回几何线索。论文在MIND基准上评测，摘要未给具体数值。", "key_numbers": ["MIND 基准", "摘要未给具体数值"], "self_measured": [], "media": [], "links": ["https://arxiv.org/abs/2606.02436", "https://gim-world.github.io/"], "note": "折中路线：记忆是隐式定长令牌，但被显式约束成可被位姿查询——正是\"参数化\"与\"几何\"两泳道的交叉点。", "parent": null, "link_strength": "", "key": false, "citations": 0, "x": 2406, "y": 3272, "sx": null}, {"id": "infinite-world", "title": "Infinite-World", "date": "2026-02-02", "precision": "day", "lane": "几何位姿寻址", "branch": "容量管理", "arxiv": "2602.02393", "venue": "", "training": "训练", "status": "速读", "one_liner": "无位姿层级压缩记忆撑到千帧", "mechanism": "层级无位姿记忆压缩器递归把历史 latent 蒸馏进固定预算并与主干联合优化；动作标签做三态离散化抗噪声位姿；再用 30 分钟重访密集集微调激活闭环。", "detail": {"position": "Infinite-World 解决真实复杂环境视频中的长时视觉记忆与交互一致性问题，目标是在超过 1000 帧的序列中保持视觉连贯。它针对真实视频位姿估计噪声和视角重访稀少导致的训练困难，避免依赖显式几何先验。", "io": "输入为真实环境视频及连续运动信息，模型将历史视频编码为 latent，并利用动作信号作为条件生成后续视觉内容。输出为可交互的未来视觉帧；动作条件经不确定性感知标注后离散化。", "steps": ["将历史视频编码为 latent，并由 Hierarchical Pose-free Memory Compressor 递归压缩历史 latent 到固定预算，以控制长序列记忆成本。", "将压缩记忆与生成主干联合优化，使模型能够依据远距离历史生成内容，同时不依赖显式几何先验。", "对连续运动进行不确定性感知的三态动作标注，降低噪声轨迹对确定性动作空间的污染，以提升动作响应学习的鲁棒性。", "使用紧凑的 30 分钟重访密集数据集进行微调，以激活模型的长程闭环能力。"], "formulas": [{"tex": "M_t = \\mathcal{C}_{\\theta}(M_{t-1}, Z_t), \\qquad M_t \\in \\mathbb{R}^{B \\times d}", "caption": "历史 latent 的递归压缩与固定预算记忆更新；标准写法，非原文"}, {"tex": "a_t = \\begin{cases} -1, & \\Delta_t < -\\tau \\\\ 0, & |\\Delta_t| \\leq \\tau \\\\ +1, & \\Delta_t > \\tau \\end{cases}", "caption": "基于阈值将运动变化离散为三态动作标签；标准写法，非原文"}], "train": "训练时将记忆压缩器与生成主干联合优化，并以不确定性感知的三态动作标签利用原始视频数据；之后使用 30 分钟重访密集数据集微调。推理时通过固定预算的层级记忆支持长程生成，具体推理算法和其他训练设置摘要未给。", "diff": "不同于依赖干净合成数据、准确位姿或显式几何先验的做法，Infinite-World 面向含噪真实视频，通过无位姿层级记忆压缩和三态动作标注处理长程记忆与动作监督问题。它还用重访密集微调激活闭环能力。", "limits": "摘要未见明确说明具体计算代价、适用范围限制或失败情形；固定预算记忆压缩旨在限制计算成本，但摘要未给出预算大小或开销数据。", "has_abstract": true}, "tags": ["无位姿", "固定预算", "层级压缩"], "explain": "想象你边走边拍一段很长的探险录像：走过的地方越来越多，脑子却不能无限扩容；若忘了先前场景，回头时就认不出路。Infinite-World 要解决的正是视频世界模型记忆有限、难以持续生成并重访场景的麻烦。它用层级记忆压缩器，把过去的潜在表示——模型内部对画面的精简编码——一层层蒸馏进固定容量的记忆，并与生成主干一起训练。记忆不依赖精确位
