name: link-check

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 检查外链
        continue-on-error: true
        run: python scripts/check_links.py --json link-report.json | tee summary.txt
      - name: 汇总并开/更新 issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let bad = [];
            try { bad = JSON.parse(fs.readFileSync('link-report.json', 'utf8')); } catch (e) {}
            const summary = fs.existsSync('summary.txt') ? fs.readFileSync('summary.txt', 'utf8') : '';
            if (!bad.length) {
              const openClean = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'link-check', per_page: 20,
              });
              for (const it of openClean.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: it.number,
                  body: '本轮体检全部通过，自动关闭。',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: it.number, state: 'closed',
                });
              }
              core.info('全部链接正常');
              return;
            }
            const title = `链接体检：${bad.length} 条失效`;
            const rows = bad.slice(0, 80).map(b => `| \`${b.id}\` | ${b.status} | ${b.url} |`).join('\n');
            const body = [
              `自动体检发现 **${bad.length}** 条外链或素材打不开。`,
              '',
              '| 论文 | 状态 | 链接 |',
              '| --- | ---: | --- |',
              rows,
              '',
              bad.length > 80 ? `（只列前 80 条，完整报告见 Actions 运行日志）` : '',
              '',
              '<details><summary>原始输出</summary>',
              '',
              '```',
              summary.slice(0, 4000),
              '```',
              '</details>',
              '',
              '处理方式：坏链就换新地址或删掉；连续两轮还坏的，直接在 yaml 里移除。',
            ].filter(Boolean).join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'link-check', per_page: 20,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `本轮体检：**${bad.length}** 条失效\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['link-check'],
              });
            }
