  links:
  - https://arxiv.org/abs/2605.30263
  - https://github.com/shengshu-ai/minWM
  note: 少见的"工程参数都给你"的框架论文：相机轨迹质量、控制训练步数、最小batch三组ablation，复现价值高于方法新颖度。
  arxiv: '2605.30263'
  explain: 想象你按下方向键，小车应立刻转弯，街景也要连贯变化；普通视频生成往往太慢，也未必听得懂动作，难以实时互动。minWM把双向视频模型微调到能响应相机控制，再用Causal
    Forcing——把模型训练、蒸馏成按时间逐段生成的因果模型——制成少步自回归生成器。它结合自回归训练、因果常微分方程或一致性蒸馏，以及非对称分布匹配蒸馏，目标是在加快生成的同时保住画面质量与控制能力。框架模块可替换，也能迁移已有世界模型；论文用Wan2.1-1.3B和HY1.5-TI2V-8B验证，并比较了最小批量设置。这样既借用视频模型的画面能力，也让画面更快跟上动作。
  detail:
    position: 这篇工作解决如何把已有视频扩散基础模型转化为可控、因果且低延迟的实时交互视频世界模型。它提供覆盖数据构建、训练、蒸馏和流式推理的开源全栈框架。
    io: 输入包括已有的 T2V 或 TI2V 视频基础模型、训练数据，以及用于控制生成的相机信号；推理时模型根据条件逐步生成视频片段。输出是可进行低延迟自回归
      rollout 的交互视频。
    steps:
    - 构建或适配训练数据，为后续学习相机控制和视频生成提供数据基础。
    - 对双向视频扩散模型进行相机控制微调，使生成结果能够响应相机条件。
    - 进行 AR diffusion 训练，将双向生成模型转为因果自回归生成，以支持逐步 rollout。
    - 使用 causal ODE 或 causal consistency distillation，并结合 asymmetric DMD，将模型蒸馏为少步生成器，以降低推理延迟。
    - 通过流式推理生成交互视频，并可将框架用于适配已有世界模型、数据分布和延迟目标。
    formulas:
    - tex: \mathcal{L}_{\mathrm{AR}}(\theta)=-\mathbb{E}_{(x_{1:T},a_{1:T})}\left[\sum_{t=1}^{T-1}\log
        p_{\theta}\left(x_{t+1}\mid x_{\le t},a_{\le t+1}\right)\right]
      caption: 标准写法，非原文：以历史视频帧和相机动作作为因果条件，训练自回归世界模型逐步生成下一帧。
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{x,c}\left[\left\|f_{\mathrm{student}}(x,c)-\operatorname{stopgrad}\left(f_{\mathrm{teacher}}(x,c)\right)\right\|_{2}^{2}\right]+\lambda\,\mathcal{L}_{\mathrm{DMD}}
      caption: 标准写法，非原文：通过因果一致性/ODE教师与非对称DMD，将多步双向扩散教师蒸馏为少步因果生成器。
    train: 训练流程包括数据构建、相机控制微调、AR diffusion 训练，以及 causal ODE 或 causal consistency distillation
      和 asymmetric DMD。框架在 Wan2.1-T2V-1.3B 与 HY1.5-TI2V-8B 等骨干上实例化，覆盖 cross-attention
      条件注入和 MMDiT 架构；摘要未给出具体训练超参数。推理采用少步自回归生成和流式 rollout；摘要未给出具体步数或延迟数值。
    diff: 不同于只关注视频生成质量的双向视频扩散模型，minWM 提供从相机控制微调到因果自回归训练、蒸馏和流式推理的端到端方案。它还强调模块化扩展，可适配不同骨干及已有世界模型。
    limits: 摘要未提供具体算力、训练成本、延迟或生成质量数据；其效果与适用范围可能受训练数据、骨干架构和蒸馏配置影响，但摘要未明确说明。
    has_abstract: true
- id: helixworld
  title: 'HelixWorld: A Real-Time Interactive Audio-Visual World Model'
  date: '2026-09-29'
  lane: 框架层
  branch: ''
  training: 需训
  status: 速读
  one_liner: 首个实时视听双模态交互世界模型
  mechanism: 用真立体声加米制位姿数据预训练6-DoF与动作条件双向教师，再以在线轨迹蒸馏蒸成少步流式学生，画面与相机锚定空间声场同步演化，24FPS单卡。
  tags:
  - 空间音频
  - 视听联合蒸馏
  - 6-DoF
  key_numbers:
  - 24FPS 单卡
  - HelixBench
  media: []
  links:
  - https://arxiv.org/abs/2609.38123
  note: 全图其余节点全是纯视觉，这条补上"声场随视角变化"这一被忽略的一致性维度，配套 HelixBench 也一并提出。
  arxiv: '2609.38123'
  explain: 想象你戴着耳机走进一间虚拟房间：转动视角时，画面变了，脚步声也该从新的方向传来。许多世界模型只能生成视频，或让声音与画面各自变化，难以实时回应动作、保持空间一致。HelixWorld要解决的正是这道断层：它先用真实立体声和带米制位姿的数据训练教师模型；位姿就是相机的位置与朝向，六自由度还包括三维移动和转动。教师学习按动作双向生成，再通过在线轨迹蒸馏，把生成过程压缩成少步流式学生。这样既保留复杂的视听变化，又能边交互边输出；相机位置锚定空间声场，让声音方向随画面同步改变。论文报告它可在单张显卡上达到每秒24帧，并用HelixBench评测交互能力。
  detail:
    position: 这篇工作要解决交互式世界模型只生成视觉、缺少同步声音的问题。它提出实时视听世界模型，使画面与相机锚定的空间立体声随用户交互共同演化。
    io: 输入包括用户动作和 6-DoF 相机轨迹，训练数据还包含真实立体声与米制相机位姿。输出是实时生成的视觉场景与相机视角对应的空间立体声。
    steps:
    - 构建包含真实立体声和米制相机位姿的高保真视听数据集，为视觉与空间声学的联合学习提供对齐数据。
    - 用 6-DoF 相机轨迹和用户动作条件预训练双向 teacher，以学习视听场景随视点和交互变化的动态。
    - 通过在线轨迹蒸馏将 teacher 转为少步流式 student，以降低因果交互的推理延迟。
    - 在交互推理时同步生成画面和相机锚定的空间声场，以支持实时视听联合演化。
    formulas:
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{t,\mathbf{z}_t,\mathbf{c}}\left[\left\|\mathbf{v}_{\mathrm{student}}(\mathbf{z}_t,t,\mathbf{c})-\mathbf{v}_{\mathrm{teacher}}(\mathbf{z}_t,t,\mathbf{c})\right\|_2^2\right]
      caption: 以教师预测监督学生的视听联合去噪/流场；标准写法，非原文
    train: 先在真实立体声和米制相机位姿数据上预训练由 6-DoF 相机轨迹与用户动作条件化的双向 teacher，再用在线轨迹蒸馏训练少步流式 student。推理采用因果流式生成，摘要报告单
      GPU 上达到 24 FPS；其他训练超参数和推理设置摘要未给。
    diff: 已有交互式世界模型主要生成视觉内容，忽略声音；HelixWorld 将真实立体声与视觉场景联合生成，并要求声场随相机运动保持空间一致。它通过在线轨迹蒸馏实现低延迟因果交互，并提出
      HelixBench 评估动态视点下的空间声学一致性。
    limits: 摘要未见明确说明计算与数据构建代价、适用场景边界或失败模式。
    has_abstract: true
- id: worldroambench
  title: 'WorldRoamBench: An Open-World Benchmark for Long-Horizon Stability of Interactive
    World Models'
  date: '2026-06-30'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 1000+例、10-60秒开放世界长程考卷
  mechanism: 四维各设新指标：逐帧动作指标绕开跨模型语义尺度差、滑窗漂移抓中途非单调坍塌、物理项先过相机与主体跟踪门控、记忆项用过渡段局部3D点云重建加追踪与VLM。
  tags:
  - 滑窗漂移
  - 点云记忆
  - 门控物理
  key_numbers:
  - 1000+ 用例
  - 10-60秒连续交互
  - 10+ 闭源开源模型
  media: []
  links:
  - https://arxiv.org/abs/2606.31672
  note: 测的信号是"持续性"：动作跟得住吗、中途会不会塌、物理过不过门控、记忆能不能用局部点云重建对上；结论是最好模型也只到中等分。
  arxiv: '2606.31672'
  explain: 想象你在生成的荒野里开车：前几秒路面逼真，几十秒后车却穿墙，转过山头又忘了刚才的营地。WorldRoamBench要解决的，正是互动世界模型短片看着不错、长时间连续游玩却容易失稳，而且不同模型的分数难直接比较的问题。它准备了1000多个、时长10到60秒的开放世界交互任务，测试10多种开源和闭源模型，并从四方面打分：逐帧动作指标看模型是否及时回应操作，避开不同模型语义评分尺度不一；滑动窗口漂移指标沿时间检查画面是否逐渐走样，也能抓住中途突然崩坏；物理评估先确认相机和主体跟踪可靠，再判断运动是否合乎物理；记忆评估则在场景转换处重建局部三维点云，结合跟踪和视觉语言模型检查模型是否记得先前见过的东西。这样既测得久，也能定位失稳发生在哪里。
  detail:
    position: 本文提出 WorldRoamBench，用于评估交互式世界模型在长时间连续交互中的稳定性。它关注短时表现无法揭示的动作跟随、视觉稳定、物理合理性与记忆问题。
    io: 输入为自然、城市和室内场景中的测试案例，包含第一人称或第三人称视角，以及持续 10 到 60 秒的 WASD 操作信号；输出为动作、视觉、物理和记忆四个维度的评估结果。物理评估受相机运动与主体跟踪检查门控，记忆评估使用轨迹信息以减轻动作跟随错误的干扰。
    steps:
    - 构建涵盖多类场景、视角和持续交互时长的测试案例，以覆盖开放世界中的长程行为。
    - 逐帧计算动作指标，绕开不同模型间语义尺度差异造成的比较困难，并暴露轨迹汇总可能掩盖的动作失败。
    - 使用滑动窗口评估视觉漂移，以捕捉序列中途出现、且可能非单调变化的视觉坍塌。
    - 先检查相机运动与主体跟踪，再评估力学、光学和三维一致性，以减少不满足基本跟踪条件时的物理评估混淆。
    - 按轨迹定位状态过渡，并结合局部三维点云重建、主体跟踪与 VLM 推理评估场景记忆和主体记忆。
    formulas: []
    train: 这是评测基准；摘要未说明模型训练流程。评估 10 多个开放或闭源模型，使用超过 1000 个测试案例，进行 10 到 60 秒连续 WASD
      交互；其余推理设置摘要未给。
    diff: 相较于依赖短时表现或起点与终点对比的评估，本文以逐帧动作指标和滑动窗口漂移度量长程变化。它还通过相机运动与主体跟踪门控物理评估，并以轨迹感知的局部三维重建和追踪加
      VLM 推理评估记忆。
    limits: 摘要未见明确说明评测成本、指标实现细节或基准覆盖范围方面的局限。
    has_abstract: true
- id: wbench
  title: 'WBench: A Comprehensive Multi-turn Benchmark for Interactive Video World
    Models'
  date: '2026-05-25'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 289例1058轮的多轮交互五维评测
  mechanism: 每例给世界设定加多轮交互序列，导航侧统一文本/6-DoF位姿/离散动作三种接口，22个自动子指标由专用视觉模型加LMM合成，全部对齐过人类判断。
  tags:
  - 多轮交互
  - 接口统一
  - 22子指标
  key_numbers:
  - 289 用例
  - 1058 交互轮
  - 20个模型
  - 22子指标
  media: []
  links:
  - https://arxiv.org/abs/2605.25874
  note: 测画质、设定遵循、交互遵循、一致性、物理合规五维，关键设计是多轮——单轮分数高不代表第二三轮还听话。
  arxiv: '2605.25874'
  explain: 想象你在一座虚拟城市里连续问路、转弯、开门：模型不只要生成眼前画面，还得记住此前发生了什么，并对新动作作出合理反应。许多旧评测只看单次生成，难以判断互动是否连贯，也不便比较不同操控方式。WBench设计了289个带世界设定的案例，共1058轮交互，用来评测20个模型；导航统一支持文字、六自由度位姿（位置与朝向）和离散动作三种输入。它用22项自动子指标，从五个方面评价结果，由专用视觉模型和多模态大模型合成评分，并与人类判断对齐。多轮情境能暴露前后矛盾，统一接口让比较更公平，细分指标则把模糊的“表现好”变成可检验的能力。
  detail:
    position: WBench 旨在解决交互式视频世界模型缺少统一、全面评测标准的问题。它评估模型在多轮交互中的视频质量、设定遵循、交互遵循、一致性和物理合规性。
    io: 输入是每个测试案例的世界设定与多轮交互序列，导航交互可通过文本、6-DoF 位姿或离散动作输入。输出是模型响应交互生成的视频，以及由自动指标计算的五维评测结果。
    steps:
    - 构建包含多样场景、风格、主体和视角的案例，并为每例设定世界背景与多轮交互序列，以检验模型跨轮次生成能力。
    - 纳入导航、主体动作、事件编辑和视角切换四类交互，并统一导航的文本、6-DoF 位姿和离散动作接口，以支持不同原生输入形式的模型评测。
    - 对模型生成的视频按视频质量、设定遵循、交互遵循、一致性和物理合规性五个维度评估，以覆盖交互式世界模型的关键能力。
    - 组合专用视觉模型与大型多模态模型构成 22 个自动子指标，并以人类判断验证指标，以评估输出并提供模型诊断依据。
    - 在 20 个先进模型上运行基准并比较结果，以分析不同模型的优势、弱点与开放挑战。
    formulas: []
    train: 摘要未给训练流程与关键训练设置。推理时模型根据案例设定和逐轮交互生成视频，再由 22 个自动子指标进行评估；具体推理设置摘要未给。
    diff: 相较于只覆盖部分能力或单轮生成的评测，WBench统一考察五个维度，并以多轮交互案例覆盖四类交互。它还统一导航的三种输入接口，并用经人类判断验证的自动指标评测不同模型。
    limits: 未见明确说明
    has_abstract: true
- id: worldmark
  title: 'WorldMark: A Unified Benchmark Suite for Interactive Video World Models'
  date: '2026-04-23'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 一个WASD适配器统一十个异构模型
  mechanism: 把共享WASD词表翻成各模型原生控制格式，500例同义指令横评；用控制论视角逐轴量方向准确率、方向纯度、响应延迟、运动稳定性，另设记忆与画质套件。
  tags:
  - 动作动力学
  - 逐轴分解
  - 适配器协议
  key_numbers:
  - 10个模型
  - 500 用例
  - 一新模型仅需1个适配器
  media: []
  links:
  - https://arxiv.org/abs/2604.21686
  note: 测的是动作响应曲线本身：最快响应的往往最不稳、画质最好的平移方向准确率垫底、逐轴拆开才看得见"平移几乎完美但几乎不转"。
  arxiv: '2604.21686'
  explain: 想象十台游戏角色各拿着不同手柄：你都喊“向前”，它们却可能走偏、迟钝，彼此成绩也难比较。WorldMark要解决的正是视频世界模型控制接口各异、评测不统一的问题。它用WASD这套上下左右方向词作共同语言，再由适配器把指令翻译成每个模型原生的控制格式；新模型只需接一个适配器。研究者用500条同义指令测试10个模型，并从控制论角度——比较命令与实际运动——逐轴衡量方向准确度、动作是否夹带别的方向、响应快慢和运动稳定性，还单独评测记忆与画质。共同入口和同一套测试让横向比较更公平，也让差异更容易定位。
  detail:
    position: 这篇工作解决交互式视频世界模型难以公平比较的问题：不同模型使用不兼容的动作控制格式，现有动作评估也难以刻画模型对指令变化的响应过程。WorldMark
      建立统一评测协议，并从控制系统角度评估动作响应，同时评测世界记忆与视觉质量。
    io: 输入是共享 WASD 风格动作指令及标准化测试案例，案例覆盖不同风格、视角和难度；各模型经适配器接收语义一致的控制信号。输出是模型生成的视频，以及逐轴的动作动态指标、世界记忆和视觉质量评测结果。
    steps:
    - 构建覆盖不同风格、视角和难度的标准化测试案例，以统一测试条件进行横向比较。
    - 将共享 WASD 词表映射为各模型的原生控制格式，以适配异构模型的动作接口。
    - 向模型发送标准化动作指令并收集生成结果，以观察世界对交互控制的响应。
    - 逐轴计算方向准确率、方向纯度、响应延迟和运动稳定性，以区分不同类型的动作跟随表现。
    - 另行评测世界记忆与视觉质量，以补充动作动态评测并形成综合基准。
    formulas: []
    train: 这是评测基准工作，摘要未给训练流程、推理参数或关键运行设置。
    diff: 相较于各模型使用不同控制接口的既有做法，WorldMark 以 WASD 共享词表和模型适配器统一动作语义。相较于将动作跟随压缩为轨迹或方向误差的评估方式，它逐轴评估方向准确率、方向纯度、响应延迟和运动稳定性，并结合世界记忆与视觉质量套件。
    limits: 每个新模型需要新增一个适配器。摘要未见明确说明其他代价与局限。
    has_abstract: true
- id: memobench
