  one_liner: 2.6B 单卡可跑的 6-DoF 长视频世界模型
  mechanism: 报告未描述其记忆读写机制；只给 6-DoF 相机控制、60s@720p 生成，以及自带的 SANA-WM-Bench 回访评测。
  key_numbers:
  - 2.6B
  - 60s@720p
  - 34s/条（量化，单卡 5090）
  - 24.1 条/小时
  - 51.1GB
  - 80 场景×2
