  training: 需训
  status: 速读
  one_liner: 高德 5B 键鼠+PRoPE 可跑世界模型
  mechanism: 报告未描述记忆机制；控制侧为键鼠动作加 PRoPE 相机条件，约 1 分钟 704×1280@16FPS，MIT 许可。
  key_numbers:
  - 5B
  - ~1min
  - 704×1280 16FPS
  - 5s@720p 26s/40G
  - ~40GB
  self_measured: []
  media:
  - https://amap-ml.github.io/DreamX_World/assets/demo_videos/long_video/long_02.mp4
  links:
  - https://arxiv.org/abs/2606.16993
  note: 报告未给提交日期；lane 依『PRoPE 相机条件』推断，非报告明述。
  tags:
  - PRoPE条件
  - 键鼠动作
  explain: 就像你在玩第一人称游戏时按键推摇杆甩鼠标，生成的画面很容易穿帮漂移，以前的世界模型很难把玩家键鼠操作和精准镜头轨迹绑在一起。高德开源的 DreamX-World
    做了个 5B 参数的可运行模型，核心是在键鼠指令外引入了 PRoPE 相机条件，也就是一种把镜头旋转与位移直接喂给模型注意力的位置编码。这招管用是因为它给画面生成加上了物理视角准心，让场景严格顺着视点演化不走样，能以每秒
    16 帧稳定跑出约一分钟的高清交互漫游。
  detail:
    position: DreamX-World 旨在把文本或图像条件的视频生成扩展为可控的长时程交互式世界模型，支持相机导航、重访已观察区域和按提示触发事件。它重点处理自回归分段生成中的相机控制、历史场景延续与风格色彩漂移问题。
    io: 输入包括文本或图像条件、相机与键鼠动作，以及可组合的事件指令；相机条件用于控制视角和导航。输出是跨多个生成片段的交互式视频。
    steps:
    - 整合 Unreal Engine 渲染、带动作的游戏录屏和恢复了相机几何的真实视频，构建覆盖多种视觉域且包含相机信息的训练数据。
    - 采用 E-PRoPE 将投影相机几何编码融入空间降采样 token 的注意力计算，以较低开销保留相机控制能力。
    - 通过 causal forcing 将双向视频生成器转换为少步自回归模型，并用 DMD-style distillation 和长时程 rollout
      训练适应连续生成。
    - 使用模型自生成的长时程上下文进行训练，减少分段生成时累积的风格和色彩漂移；通过基于相机几何的检索取回早先视图，并以 residual recycling
      降低记忆潜变量误差的影响。
    - 加入 Event Instruction Tuning 学习可组合事件控制，再用 reinforcement learning alignment 恢复蒸馏后的相机控制与视觉质量。
    formulas:
    - tex: \nabla_{\theta} L_{\mathrm{DMD}}=\mathbb{E}_{x_t,t}\left[w(t)\left(s_{\mathrm{real}}(x_t,t)-s_{\mathrm{fake}}(x_t,t)\right)\frac{\partial
        x_{\theta}}{\partial\theta}\right]
      caption: DMD 式蒸馏的标准梯度写法，非原文；用于将生成器分布推向真实数据分布。
    train: 训练使用混合数据，并结合 causal forcing、DMD-style distillation、自生成长时程上下文训练、Event Instruction
      Tuning 和 reinforcement learning alignment。推理采用少步自回归生成；实现侧使用 mixed-precision
      DiT、residual reuse、75% 剪枝的 VAE 解码和异步 pipeline parallelism，在八张 RTX 5090 GPU 上最高达到
      16 FPS。
    diff: 相较于直接自回归生成或单纯视频生成，DreamX-World 将投影相机几何纳入降采样 token 的注意力，并专门训练模型在自身生成的长历史上持续生成。它还结合相机几何检索的场景记忆与事件指令控制，以支持重访和可组合事件。
    limits: 最高 16 FPS 的报告结果依赖八张 RTX 5090 GPU 及多项推理优化，计算资源代价较高。摘要未明确说明记忆检索的容量、长时程效果边界或其他局限。
    has_abstract: true
- id: mirage
  title: Mirage
  date: '2026-06-01'
  precision: month
  arxiv: '2606.09828'
  venue: ''
  lane: 几何位姿寻址
  branch: 显式几何库
  parent: null
  link_strength: null
  training: 需训
  status: 速读
  one_liner: 存 latent 缓存而非几何，介于 L2/L3
  mechanism: 报告只有一句：存的是 latent 缓存，不是显式几何，归档在 L2 与 L3 之间。
  key_numbers: []
  self_measured: []
  media:
  - https://microsoft.github.io/LatentSpatialMemory/assets/figures/concept_hd.png
  - https://microsoft.github.io/LatentSpatialMemory/assets/figures/efficiency.png
  - https://microsoft.github.io/LatentSpatialMemory/assets/figures/pipeline_hd.png
  links:
  - https://arxiv.org/abs/2606.09828
  note: 摘要级；lane 依『latent 缓存』暂定，报告未述寻址方式；无日期。
  tags:
  - latent缓存
  - 非几何中介
  explain: 就像出门做家具不想随身背着沉重完整的木质骨架，带一份折叠好的轻便尺寸图最省力。以往系统直接缓存展开的显式几何结构，体积过大容易造成存储和传输堵塞。Mirage
    的解法是不存庞大的几何实体，改存 latent 缓存，也就是模型抽取出的紧凑特征这种中间状态，并把位置放在芯片高速缓存 L2 和 L3 之间。这种设计避开了显式几何的膨胀开销，同时卡在两级缓存之间，既不像塞在顶层那样撑爆空间，又比去下层读取更快，兼顾了体积与访问效率。
  detail:
    position: Mirage 解决视频世界模型跨帧生成时难以保持 3D 空间一致性的问题。它将场景信息持久存储在 diffusion latent 空间中，避免显式
      RGB 点云记忆带来的计算开销与信息损失。
    io: 输入包括待存入记忆的 latent tokens，以及用于 3D 回投的 depth 信息；查询时根据目标视角合成对应的 latent 表示。摘要未明确列出相机参数等条件信号，也未具体说明最终输出格式。
    steps:
    - 将场景的 diffusion latent tokens 与 depth 对齐，为后续空间定位提供特征和深度信息。
    - 通过 depth-guided back-projection 将 latent tokens 提升到 3D，并写入持久化的 latent spatial
      memory，以保留场景信息而不经过 RGB 重建。
    - 根据查询视角从 latent spatial memory 中提取相关场景信息，并通过 direct latent-space warping 合成新视角的
      latent 表示。
    - 利用合成的 latent 表示支持视频生成，从而维持跨帧空间一致性并减少重复渲染与 VAE encoding。
    formulas:
    - tex: \mathbf{X}_t(u)=\mathbf{T}_{w\leftarrow c,t}\left(D_t(u)\mathbf{K}^{-1}\tilde{u}\right),\qquad
        \mathcal{M}_t=\mathcal{M}_{t-1}\cup\{(\mathbf{X}_t(u),\mathbf{z}_t(u))\}_u
      caption: 标准写法，非原文：用深度将 diffusion latent token 反投影到场景坐标，并写入持久化 latent spatial
        memory。
    - tex: \tilde{\mathbf{z}}_q(u)=\mathbf{z}_{\mathcal{M}}\!\left(\pi\!\left(\mathbf{K}\mathbf{T}_{c_q\leftarrow
        w}\mathbf{X}\right)\right)
      caption: 标准写法，非原文：将记忆中的 latent 特征按查询相机视角投影并采样，形成新视角的 latent 表示。
    train: 训练流程与关键设置摘要未给。推理时构建 latent spatial memory，并通过直接在 latent 空间中变形来查询和合成新视角；具体实现参数摘要未给。
    diff: 既有显式 3D 基线通常在 RGB 空间构建点云记忆，需要反复渲染和 VAE encoding，且像素空间往返会损失 learned latent
      representation 的特征。Mirage 直接缓存 latent tokens，并在 latent 空间中完成空间记忆查询与视角合成。
    limits: 摘要未见明确说明方法局限；其记忆构建依赖 depth-guided back-projection，但摘要未讨论深度信息误差的影响。
    has_abstract: true
- id: captain-safari
  title: Captain Safari
  date: '2026-06-15'
  precision: day
  arxiv: '2511.22815'
  venue: CVPR 2026
  lane: 几何位姿寻址
  branch: 显式几何库
