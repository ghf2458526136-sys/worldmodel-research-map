  note: 报告只给到月份 2026-05（§1.5 时间线），无首次提交日；lane 为暂定，报告未说明寻址方式；§2 明确『相机控制精度数据待补』。
  tags:
  - 6-DoF相机
  - 自带回访集
  explain: 想象你在玩游戏，绕着街区走一圈再转头原路返回，刚才路过的房子却凭空变了样。以往视频世界模型——也就是能模拟真实物理环境的AI系统——要么算力要求太高单卡带不动，要么漫游久了回头看就穿帮。SANA-WM把模型做到了只有2.6B参数，单张5090显卡就能运行，并引入6自由度相机控制，也就是让视角能在三维空间里自由位移和转头。这招管用在于它大幅压低了计算门槛，通过严格的相机位姿引导和专门的回访评测，让单卡也能在60秒高清长视频里稳住空间一致性。
  detail:
    position: SANA-WM 旨在以较低的模型规模和推理成本生成长时、高保真视频，并让生成内容遵循精确的相机运动。它面向分钟级世界建模，重点处理长上下文建模、6-DoF
      相机控制和长视频一致性。
    io: 输入包括用于生成视频的条件信号，其中相机轨迹作为 6-DoF 控制信号；摘要未具体说明其他输入形式。输出为最高 720p、最长 60 秒的视频。
    steps:
    - 从公开视频中提取 metric-scale 6-DoF 相机位姿，形成时空一致的动作标签，以提供相机运动监督。
    - 使用 frame-wise Gated DeltaNet 与 softmax attention 构成 Hybrid Linear Attention，以更节省内存地建模长上下文。
    - 通过 Dual-Branch Camera Control 将 6-DoF 轨迹条件用于生成过程，以提高相机运动的遵循精度。
    - 先生成 stage-1 视频，再由 long-video refiner 进行细化，以改善长序列的视觉质量与一致性。
    - 使用 SANA-WM-Bench 评估动作遵循表现，并比较长视频生成质量与效率。
    formulas: []
    train: 训练数据约为 213K 个带 metric-scale 位姿监督的公开视频片段；训练耗时 15 天，使用 64 张 H100。推理时生成 60
      秒视频可在单张 GPU 上完成；蒸馏版本经 NVFP4 量化后可部署于单张 RTX 5090，并以 34 秒对 60 秒 720p 视频去噪。摘要未给出优化器、损失函数和训练阶段的具体设置。
    diff: 相较于摘要提及的既有开源基线，SANA-WM 将 frame-wise Gated DeltaNet 与 softmax attention 结合，并采用双分支相机控制、长视频细化和
      metric-scale 位姿标注。摘要报告其动作遵循更强，并以 36 倍吞吐率达到可比的视觉质量。
    limits: 训练仍需 64 张 H100 和 15 天；摘要未见明确说明长视频生成的其他资源代价、适用场景限制或失败模式。
    has_abstract: true
- id: echo-infinity
  title: Echo-Infinity
  date: '2026-06-01'
  precision: month
  arxiv: '2606.04527'
  venue: ''
  lane: 位置时间寻址
  branch: 实体挂载
  parent: rolling-forcing
  link_strength: dashed
  training: 需训
  status: 速读
  one_liner: 组内 Echo 系列：记忆加位置重写路线
  mechanism: 报告未展开，只归入组内『记忆+位置重写』路线，细节另开笔记；本组 EchoActive 的 r_sink 与 Rolling Forcing
    相似。
  key_numbers: []
  self_measured: []
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2606.04527
  note: 报告只在 §3.6 以『Echo 系列（2606.04527 / 2605.16003 / 2603.12513）』合并提及一句，三条的拆分依 §12
    参考文献对应关系。
  tags:
  - r_sink复用
  - 实体记忆
  explain: 就像读一本无限长的书，如果书签用光了页码，前面的内容又塞爆了脑袋，模型就会彻底乱套。这篇要解决的正是大模型处理超长文本时前文装不下且位置编号失效的麻烦。它走的是咱们组典型的记忆加位置重写路线，也就是把前面的重要信息压缩成额外记忆，再把新输入内容的位置编号重写拉回合理区间。这招之所以管用，是因为记忆结构帮模型保住了远距离的关键信息，而位置重写抹掉了过大页码带来的混乱，让模型在不爆显存也不迷失相对顺序的情况下一直读下去。
  detail:
    position: Echo-Infinity 面向自回归视频生成中历史长度不断增长、有限缓存难以保留长期信息的问题，目标是在计算成本恒定的条件下支持任意长度的视频生成。它通过可学习的演化记忆和相对时间位置重写，降低长期生成中的信息损失与误差累积。
    io: 输入为自回归生成所需的局部视频帧、历史记忆状态及生成条件；具体条件信号未说明。输出为逐帧生成的视频，以及随历史更新的记忆状态。
    steps:
    - 模型在局部窗口内自回归生成视频帧，以局部上下文维持当前生成的连贯性。
    - 当旧帧从局部窗口中移出时，使用 Memory Query 通过注意力读取这些历史信息，并通过门控机制更新记忆，以抽象和压缩被移出的内容。
    - 将更新后的记忆作为后续生成的历史信息，使记忆随生成过程演化，并以恒定计算成本支持任意长度历史。
    - 使用 Unified Relative RoPE Recipe 重设时间位置：sink 帧从位置 0 开始，最新帧的位置不超过模型预训练的最大时间 RoPE
      位置，以缓解有限位置范围及训练推理位置差异。
    - 将 Memory Query 与视频 DiT 端到端优化，使其形成可泛化的生成先验；仅使用优化后的初始记忆状态时也可改善生成质量。
    formulas:
    - tex: r_t=\operatorname{softmax}\!\left(\frac{Q_tK_{\mathrm{old}}^{\top}}{\sqrt{d}}\right)V_{\mathrm{old}}
      caption: 标准写法，非原文；Memory Query 对移出局部窗口的历史信息进行注意力检索
    - tex: M_t=g_t\odot\widetilde{M}_t+(1-g_t)\odot M_{t-1},\qquad g_t=\sigma\!\left(W_g[\widetilde{M}_t;M_{t-1}]\right)
      caption: 标准写法，非原文；通过门控融合新压缩的历史信息与既有记忆
    train: Memory Query 与视频 DiT 端到端联合优化。训练和推理均采用 Unified Relative RoPE Recipe，使 sink
      帧从位置 0 开始，并限制最新帧位置不超过 DiT 预训练的最大时间 RoPE 位置。其余训练数据、损失函数及具体推理设置摘要未给。
    diff: 相较于预设 KV-cache 调度、固定比例启发式压缩和推理时 RoPE 调整，Echo-Infinity 使用可学习的 Memory Query，并在历史帧移出局部窗口时通过注意力和门控更新记忆。它还统一重设相对
      RoPE 位置，避免依赖有限缓存窗口，并减小训练与推理的位置外推差异。
    limits: 摘要未见明确说明方法的额外代价与局限；其记忆压缩仍可能涉及历史信息取舍，但摘要未提供相关误差或成本分析。
    has_abstract: true
