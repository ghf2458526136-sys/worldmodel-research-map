  one_liner: 具身/物理评测，非回溯，辅助参考
  mechanism: 报告只在 §5.3 归类一句：具身、物理、指令遵循类评测，非回溯一致性评测。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2502.20694
  note: 只有名字和归类，无 arXiv 号、无日期、无指标。
  tags:
  - 物理合理性
  - 指令遵循
  explain: 就像你让机械臂推倒桌上的水杯，水往哪流必须当场推演出来，现实里可没有撤销键。很多模型生成的视频看着逼真，但放到具身交互——也就是像机器人那样和物理世界互动时，常常动作走样、违背常理。WorldModelBench搭建了一套专门测试物理规律与指令遵循的考卷，核心是坚持非回溯，也就是推演过程只能单向往前走，绝不给模型倒退修补的机会。这招之所以管用，是因为真实物理世界不可逆，卡死单向因果，才能验出模型是真掌握了规律，还是在蒙混过关。
  detail:
    position: WorldModelBench 旨在评估视频生成模型在应用驱动场景中的世界建模能力，重点检验物理规律遵循与指令遵循，而非回溯一致性。它针对一般视频质量基准难以发现的细微世界建模违规进行评测。
    io: 输入是视频生成模型及其生成结果，评测关注结果是否遵循给定指令和物理规律；摘要未说明具体输入格式、条件信号和输出分数形式。输出包括人工标注或自动 judger
      对世界建模违规的评估。
    steps:
    - 设置指令遵循和物理规律遵循等评测维度，以覆盖一般视频质量评测容易忽视的世界建模问题。
    - 为 14 个前沿模型收集 67K 条人类标注，以形成与人类偏好对齐的评测依据。
    - 利用高质量人类标注微调 judger，以自动识别视频中的世界建模违规。
    - 比较 judger 与 GPT-4o 预测违规的准确率，以检验自动评测能力。
    - 使用 judger 奖励对模型进行对齐训练，以验证奖励优化能否改善世界建模能力。
    formulas: []
    train: 摘要称使用人类标注微调一个 2B 参数的 judger，并通过最大化该 judger 的奖励进行对齐训练；具体训练数据划分、目标函数、优化器和推理设置摘要未给。
    diff: 相较于只评估一般视频质量的既有基准，WorldModelBench 增加指令遵循和物理规律遵循维度，可检测物体尺寸异常变化等细微违规。它属于具身、物理和指令遵循类评测，不是回溯一致性评测。
    limits: 摘要未见明确说明评测成本、标注覆盖范围及其局限；也未给出评测流程和评分细节。
    has_abstract: true
