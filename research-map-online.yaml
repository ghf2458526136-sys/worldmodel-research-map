    train: 摘要提到使用定制数据集训练和评估带显式 3D memory 机制的 world models；具体训练目标、数据规模与关键设置摘要未给。推理时通过长期空间记忆的存储与检索辅助自回归视频生成，具体读写流程摘要未给。
