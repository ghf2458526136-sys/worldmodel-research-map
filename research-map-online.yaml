  explain: 玩赛车游戏时如果想让AI凭空造出一条能开进去的赛道，以往模型只能吐出看着逼真、一碰就碎的平面布景。世界模型也就是让计算机模拟物理环境的技术，痛点在于很难生成能交互的真三维资产。腾讯开源的HY-World
    2.0作为WorldPlay的后继版本，把造世界拆成流水线：先由文本或图片生成全景图与规划路径，再由多视角画面还原出完整三维几何。这招之所以管用，是因为把视觉生成与空间建模拆开来做，既保住了画面逼真度，又能直接导入游戏引擎供角色实时走动与物理碰撞。
  detail:
    position: HY-World 2.0 旨在从多种输入生成或重建可交互的 3D 世界，是 WorldPlay 的后继开源世界模型系列。它既支持从文本或单张图像生成可导航场景，也支持从多视图图像或视频重建
