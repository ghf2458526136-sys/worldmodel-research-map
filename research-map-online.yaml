  explain: 就像拍电影换个机位桌上的杯子就瞬移了一样，多镜头视频生成最大的麻烦就是前后镜头容易穿帮。ATAS的招数是把拍片重构成维护真实沙盘的过程：先将剧本编译成包含场景、相机、时段与空间锚点（即空间参考标记）的镜头请求，再建两份记忆管住全场，场景记忆存静态点云（即三维坐标构成的立体骨架），事件记忆按场次时间存动态影像与点云。这招管用是因为画面必须通过成片审查、重建注册和状态准入这三关写回，只有对齐的数据才能沉淀为持久状态，让后续所有机位都对着同一份沙盘拍，前后自然不会打架。
  key: true
  detail:
    position: ATAS 解决长篇 agentic video generation 中跨镜头的空间与时间一致性问题，尤其是非连续镜头对场景重访和历史事件重现的需求。它将拍摄流程组织为带持久世界状态的镜头生成与记忆更新流程。
    io: 输入是 screenplay，输出是按镜头生成的视频片段及最终视频。条件信号包括镜头请求中的 location、camera 和 event-time
      引用，以及从 scene memory 与 event memory 检索到的相关证据。
    steps:
    - 将 screenplay 编译为带有明确场景、空间锚点、相机和事件时刻引用的 shot requests，以便每个镜头能够指向共享的空间与时间状态。
    - 根据镜头请求从 scene memory 检索静态几何证据，并从按 scene、event、time 索引的 event memory 检索动态观测，以支持场景重访和事件重现。
    - 将检索证据与镜头请求提供给视频生成器生成片段，以提升不同镜头之间的空间和时间一致性。
    - 生成后重建并注册片段，将其作为候选观测；只有通过 review 和 state checks 后才更新记忆，以避免未接受的观测污染持久状态。
    - 将影片交付与记忆准入分开处理，使片段交付不依赖该观测是否被记忆系统接受。
    formulas: []
    train: 摘要未给出训练流程或关键训练设置。推理时，ATAS 编译剧本、检索记忆证据、生成片段，并在 review 与 state checks 通过后重建注册片段及更新记忆。
    diff: 与仅在镜头间传递 prompts 或近期帧的做法不同，ATAS 使用共享的静态场景几何记忆和按事件与时间索引的动态记忆。它还在生成后验证观测再更新记忆，并将影片交付与记忆准入解耦。
    limits: 未见明确说明
    has_abstract: true
