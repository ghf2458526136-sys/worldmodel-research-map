  branch: 神经渲染器
  one_liner: 语义图流实时驱动 H3，8 卡每步 218ms
  mechanism: 代码游戏引擎每物理步输出约 13 类对象语义图，MiniMax-H3 流式 DMD 两步去噪按 chunk 渲成 1080p，语义条件做三级
    guidance 拟合省掉 CFG
  tags:
  - 语义图流
  - 两步流式
  training: 需训
  status: 精读
  key_numbers:
  - 218ms/step (8×GB200)
  - VAE 解码 23.8ms
  - 1080p 71s 带声
  - 3.67× 加速
  links:
  - https://nvlabs.github.io/Sana/Sol-Engine/StreamRender-H3/
  note: 项目页不是 arXiv；只在赛车单场景验证，引用需同时引 Sol-Engine
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: month
  explain: 想象一辆赛车在游戏世界里飞驰：引擎每走一步，不必先画完整画面，只需告诉模型车、道路、树木和碰撞位置。StreamRender-H3要解决的麻烦是，视频模型直接生成1080p画面既慢，又难保持物体连续运动。它让代码游戏引擎每个物理步输出约13类对象的语义图，也就是标明各物体类别和位置的结构化地图；MiniMax-H3再以流式方式，按视频块进行两步去噪渲染。语义条件采用三级引导拟合，提前学会引导效果，因此省掉传统分类器自由引导（CFG）的额外计算。这样，低成本的结构信息负责“世界怎么变”，模型负责“画面长什么样”，既稳又快：8张GB200上每步218毫秒，VAE解码仅23.8毫秒，1080p带声音视频可达71秒，速度提升3.67倍。
  detail:
    position: 该方法试图让代码驱动的游戏世界能够实时生成高分辨率视频，同时保留对象语义与场景动态的一致性。它用语义图流连接游戏引擎与视频生成模型。
    io: 输入是代码游戏引擎按物理步产生的约 13 类对象语义图流，输出是按 chunk 渲染的 1080p 视频。语义图作为条件信号，引导 MiniMax-H3
      生成与游戏对象及状态对应的画面。
    steps:
    - 代码游戏引擎逐个物理步输出对象语义图，以提供实时更新的场景与对象信息。
    - 将语义图流送入 MiniMax-H3，作为视频生成的条件信号，以便生成画面跟随游戏世界变化。
    - MiniMax-H3 采用流式 DMD 两步去噪逐个 chunk 渲染视频，以支持连续生成并控制推理开销。
    - 通过拟合三级 guidance 实现语义条件引导，以省去推理时的 CFG。
    formulas:
    - tex: \nabla_{\theta} L_{\mathrm{DMD}}=\mathbb{E}_{t,\epsilon,c}\left[w(t)\left(s_{\mathrm{fake}}(x_t,t,c)-s_{\mathrm{real}}(x_t,t,c)\right)\frac{\partial
        x_{\theta}}{\partial\theta}\right]
      caption: DMD 分布匹配蒸馏的标准梯度写法，非原文；用于说明生成器如何依据真假分布的 score 差异更新。
    train: 已知机制说明了流式 DMD 两步去噪、按 chunk 渲染，以及通过拟合三级 guidance 省去 CFG；训练数据、损失函数与具体训练设置摘要未给。已知推理性能为
      8 卡每步 218ms。
    diff: 该方法以代码游戏引擎输出的实时语义图流驱动视频生成，而不是仅依赖文本等静态条件。它还通过拟合三级 guidance 来省去 CFG，并采用两步流式
      DMD 按 chunk 渲染。
    limits: 已知推理设置需要 8 卡，且每步耗时 218ms；其他计算代价、适用范围与局限未见明确说明。
    has_abstract: false
- id: sol-engine
  title: 'Sol Video Inference Engine: Agent-Native Full-Stack Acceleration'
  arxiv: '2606.23743'
  date: '2026-06-21'
  lane: 代码世界模型
  branch: 神经渲染器
  one_liner: StreamRender 背后的推理加速框架
  mechanism: 面向 agent 调用视频模型的全栈加速：KV cache ring buffer、固定 chunk 形状捕获成 CUDA graph 重放、条件
    guidance 折叠
  tags:
  - 推理加速
  - CUDA graph
  training: 不适用
  status: 速读
  key_numbers: []
  links:
  - https://arxiv.org/abs/2606.23743
  note: StreamRender-H3 的工程底座，本身不是世界模型
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象一个智能体边看视频边追问：每次提问都要模型接着生成，反复搬运历史信息、启动计算，像每走一步都重新铺路。Sol 是 StreamRender
    背后的推理加速框架，针对的正是这种频繁调用带来的等待与开销。它用环形缓冲区管理 KV cache，也就是模型保存的历史计算结果，让新内容接上旧内容时少做重复工作；再把固定长度的视频片段预先捕获为
    CUDA graph，即可重复执行的计算流程，减少每次启动的调度负担；还折叠条件引导计算，避免重复执行相近步骤。这些优化覆盖数据管理、执行调度和模型计算，因此更适合智能体连续调用视频模型。论文没有给出具体加速数字。
  detail:
    position: 针对视频扩散模型推理成本高、加速方案难以跨模型、硬件和推理配置迁移的问题，提出面向特定部署目标的 agentic、training-free
      全栈加速框架。框架通过并行优化与组合多种加速技术，兼顾端到端速度和生成质量。
    io: 输入是由模型、硬件平台和 serving 配置定义的部署目标，以及用于视频生成的条件信号；输出是经加速的视频扩散推理实现和生成视频。摘要未具体列出条件信号类型。
    steps:
    - 针对部署目标并行调用 skill agents，分别优化 cache、sparse attention、token pruning、quantization
      和 kernel fusion，因为模型、硬件与配置会改变各技术的实际收益。
    - 在推理执行中使用 KV cache ring buffer 复用历史计算，并折叠 conditional guidance，以减少重复计算。
    - 将执行切分为固定形状的 chunks 并捕获为 CUDA graph 后重放，以降低重复执行开销。
    - 由 agent integrator 组合各项优化，形成适配该部署目标的全局加速栈，避免单项优化彼此孤立。
    - 由 human validator 检查生成质量并反馈调整，确保加速后质量仍接近原始水平。
    formulas: []
    train: 框架为 training-free，不需要训练新模型；推理侧由 agents 针对具体模型、硬件和 serving 配置优化并组合加速技术，再由
      human validator 提供生成质量反馈。摘要未给出具体采样设置、量化格式或缓存参数。
    diff: 不同于依赖固定加速配方的做法，该框架针对每个部署目标并行优化多种技术，再由 integrator 组合成全局加速栈。其重点是 agent 驱动的实例级优化，而非假设某种加速策略可直接迁移到其他模型和硬件。
    limits: 优化效果具有实例依赖性，需要针对部署目标进行调优并由人检查生成质量；摘要未见明确说明优化耗时、人工反馈成本及各项技术的兼容性限制。
    has_abstract: true
- id: streaming-code-wm
  title: streaming-code-world-model (community impl)
  arxiv: ''
  date: '2026-09-01'
  lane: 代码世界模型
  branch: 神经渲染器
  one_liner: 社区版流式 CodeWM：17 帧一块，因果注意力
  mechanism: 每块约 17 帧/5 latent，causal attention 加滑动 KV cache，RoPE 时间位置重映射，diffusion/self-forcing
    蒸馏；proxy 仍是深度加语义 ID
  tags:
  - 因果流式
  - RoPE重映射
  training: 需训
  status: 速读
  key_numbers:
  - 17 帧/chunk
  - 5 latent
  links:
  - https://github.com/TingtingLiao/streaming-code-world-model
  note: 仅公开仓库，非论文；状态以仓库为准
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: month
  explain: 想象摄像机边走边拍：模型得一边生成眼前画面，一边记住刚才发生了什么，还不能等整段视频拍完。这个社区版流式 CodeWM 要解决的，正是长视频生成慢、占用不断累积，也难以因果地接续的问题。它每次处理约
    17 帧，压成 5 个潜变量，也就是更紧凑的画面表示；因果注意力只让当前块看过去，滑动 KV 缓存则保存并复用近期计算。RoPE 时间位置重映射会调整帧的位置编码，让分块后时间顺序仍连贯；扩散与自我强制蒸馏则让模型练习边生成边续写。这样既能控制记忆开销，也更适合实时延展。训练时还用深度和语义
    ID 作为代理信号，帮助模型把空间结构与内容对应起来。
  detail:
    position: 该方法面向流式视频生成，重点是在逐块生成时利用因果注意力和滑动 KV cache 处理时间上下文。社区实现保留以深度和语义 ID 为 proxy
      的表示。
    io: 输入包含流式视频块及深度、语义 ID 等 proxy 信号；输出为逐块生成的视频内容。其他条件信号的定义摘要未给。
    steps:
    - 将视频按约 17 帧或 5 个 latent 划分为块，以块为单位组织流式生成。
    - 对当前块使用 causal attention，使生成依赖已有上下文而不访问未来信息。
    - 通过滑动 KV cache 保存并复用历史注意力状态，以支持连续处理视频块。
    - 对 RoPE 时间位置进行重映射，使块式生成中的时间位置信息与缓存上下文相适配。
    - 使用 diffusion 与 self-forcing distillation 训练或蒸馏模型，并以深度和语义 ID 作为 proxy 表示。
    formulas:
    - tex: \mathbf{K}_t=\operatorname{Tail}_W([\mathbf{K}_{t-1};\mathbf{k}_t]),\quad
        \mathbf{V}_t=\operatorname{Tail}_W([\mathbf{V}_{t-1};\mathbf{v}_t])
      caption: 滑动 KV cache 的更新与窗口截断；标准写法，非原文
    - tex: \mathbf{y}_t=\operatorname{softmax}\!\left(\frac{\mathbf{q}_t\mathbf{K}_t^{\mathsf
        T}}{\sqrt{d}}+\mathbf{M}_{\mathrm{causal}}\right)\mathbf{V}_t
      caption: 基于缓存上下文的因果注意力聚合；标准写法，非原文
    train: 已知机制涉及 diffusion 与 self-forcing distillation；块大小约为 17 帧或 5 个 latent，并使用
      causal attention、滑动 KV cache 和 RoPE 时间位置重映射。具体训练目标、数据、推理采样流程及其他超参数摘要未给。
    diff: 相较于不按块处理的生成方式，该实现采用因果块式生成，并用滑动 KV cache 延续历史上下文。其 proxy 仍是深度加语义 ID。
    limits: 未见明确说明
    has_abstract: false
