  note: FVD 降幅是固定容量比较下的画质指标，不是回访事件成绩（报告明确口径）；日期来自报告正文括号，是全篇唯一带日的条目之一。
  tags:
  - 替代视图打分
  - 固定容量淘汰
  explain: 就像你在景区拍了上千张照片但手机空间告急，同一个景点连拍十张就是纯粹浪费。在长视频处理中显存有限，最怕存下一堆重复视角却漏掉关键死角。Keepsake
    只改造了帧的写入与淘汰策略。它给新旧帧建立位姿外观图，也就是把相机机位和画面长相连成网络，计算某帧有没有替代视角、替补有多像。这招管用是因为它精准扔掉随时有替补的帧，死守不可替代的视角。面对
    180 秒轨迹的 5397 帧，它仅保留 32 帧，衡量视频质量的 FVD 指标就降低了 35.1%。
  key: true
  detail:
    position: Keepsake 解决长时程 camera-controlled video generation 中固定容量空间记忆如何随生成历史变化而持续更新的问题。它根据记忆帧当前拥有的替代视图来判断哪些帧可淘汰，以维持场景一致性。
    io: 输入是记忆库中保留的观测帧与新生成的观测帧，以及相应的 camera pose 和视觉外观信息；条件包括固定记忆容量。输出是更新后的持久记忆库，供原有生成系统使用。
    steps:
    - 汇集记忆库中保留的观测帧和新生成的观测帧，以便在同一候选集合中重新评估记忆价值。
    - 根据 camera pose 接近程度与视觉相似度构建 pose–appearance 图，以表示候选观测之间的替代关系。
    - 结合强替代视图的数量与最相似替代视图的相似度评估留存优先级，以识别替代支持较少、较难舍弃的观测。
    - 在固定容量约束下保留优先级较高的观测并淘汰高度可替代的观测，以持续更新记忆库。
    formulas:
    - tex: s_{ij}=\mathbf{1}[d_{\mathrm{pose}}(p_i,p_j)\leq\tau_p]\,\operatorname{sim}(a_i,a_j),\qquad
        r_i=\alpha\sum_{j\ne i}\mathbf{1}[s_{ij}\geq\tau_s]+\beta\max_{j\ne i}s_{ij}
      caption: 标准写法，非原文：以 pose 接近且外观相似的候选帧作为替代视图，并用替代视图数量和最相似替代视图的相似度衡量可替代性。
    - tex: \mathcal{M}_{t+1}=\operatorname{TopK}_{i\in\mathcal{M}_t\cup\mathcal{N}_t}(-r_i)
      caption: 标准写法，非原文：在保留帧与新帧组成的候选集合中，固定容量保留可替代性较低、留存价值较高的观测。
    train: Keepsake 是 training-free 的在线控制器，不需要训练。推理时仅调整持久记忆的写入与淘汰策略；host generator、denoising
      schedule 和 retrieval rule 保持不变。摘要未给出更具体的推理设置。
    diff: Full-history 方法保留所有生成观测，存储与检索成本随历史增长；selective-construction 方法则一次性决定是否保留观测，之后不再调整。Keepsake
      按当前记忆库中的替代关系在线重估观测价值，并在固定容量下淘汰可替代性高的帧。
    limits: 摘要未见明确说明代价与局限。
    has_abstract: true
