- id: rolling-forcing
  title: Rolling Forcing
  date: '2025-09-01'
  precision: month
  arxiv: '2509.25161'
  venue: ICLR 2026
  lane: 位置时间寻址
  branch: 锚 sink
  parent: streamingllm
  link_strength: dotted
  training: 需训
  status: 精读
  one_liner: 固定 sink 相对距离，窗口内多帧联合去噪
  mechanism: 缓存去掉 RoPE 前的 sink key，生成时旋转到 i−L_tem−L_glo 区间；窗口内多帧 latent 联合去噪，左端逐帧输出。
  key_numbers:
  - 1.3B
  - 832×480 16FPS
  - 多分钟
  self_measured: []
  media:
  - https://kunhao-liu.github.io/Rolling_Forcing_Webpage/videos/transition/action0.mp4
  - https://kunhao-liu.github.io/Rolling_Forcing_Webpage/videos/transition/action1.mp4
  - https://kunhao-liu.github.io/Rolling_Forcing_Webpage/videos/transition/action2.mp4
  links:
  - https://arxiv.org/abs/2509.25161
  note: 报告中出现两次（§3.1 方法、§3.6 训练侧），已合并为一条；只给到月份 2025-09；官方仓库 404，无演示片段。
  tags:
  - Sink锚
  - Pre-RoPE缓存
  - 多帧联合去噪
  explain: 生成长视频就像拉着卷轴连续作画，画到后面容易弄丢开头的基准线导致画面崩坏。这篇论文要解决滑动窗口生成多分钟视频时注意力漂移走样。他们让窗口内多帧潜变量（即模型压缩的画面数据）联合去噪并逐帧输出，同时固定注意力汇元（即稳定全局的基准锚点）与当前帧的相对距离。做法是先缓存去掉旋转位置编码（即时间标记）的汇元特征，生成时再旋转到固定相对区间。这招管用是因为锚点距离始终落在训练过的安全范围内，杜绝了位置混乱，让
    1.3B 模型能稳定生成 832×480、16FPS 的多分钟视频。
  key: true
  detail:
    position: Rolling Forcing 针对流式长视频生成中的误差随时间累积、导致长时段视频质量和时序一致性下降的问题。它通过窗口内多帧联合去噪和
      attention sink，面向低延迟的长视频流生成。
    io: 输入为待去噪的多帧 latent 窗口及生成过程中的上下文状态；输出为按顺序流式输出的视频帧。上下文包括初始帧的 sink key-value 状态和自生成历史；摘要未说明具体文本或其他条件信号。
    steps:
    - 缓存初始帧去掉 RoPE 的 sink key，并在后续生成时按固定相对位置将其旋转到 i−L_tem−L_glo 区间，作为长程全局上下文锚点以增强一致性。
    - 构造包含多帧 latent 的去噪窗口，并为窗口中的帧设置逐渐增加的噪声水平，以联合去噪替代逐帧迭代采样，从而放松相邻帧间的严格因果依赖并抑制误差传播。
    - 对窗口中的多帧 latent 同时执行去噪，并利用 sink 上下文和生成历史提供长程信息，以维持局部连续性与全局一致性。
    - 从窗口左端逐帧输出已生成帧，并沿时间推进窗口，使生成能够持续进行。
    - 训练时在非重叠窗口上进行扩展去噪窗口的少步蒸馏，并以自生成历史为条件缓解 exposure bias。
    formulas:
    - tex: \widetilde{K}_{\mathrm{sink}}^{(i)}=\operatorname{RoPE}_{\,i-L_{\mathrm{tem}}-L_{\mathrm{glo}}}\!\left(K_{\mathrm{sink}}^{\mathrm{raw}}\right)
      caption: 将缓存的未施加 RoPE 的 sink key 在后续第 i 步重编码到固定的长程相对位置；标准写法，非原文
    - tex: \left(\widehat{z}_{i}^{\,0},\ldots,\widehat{z}_{i+L_{w}-1}^{\,0}\right)=D_{\theta}\!\left(z_{i}^{\,\tau_{0}},\ldots,z_{i+L_{w}-1}^{\,\tau_{L_{w}-1}};\,\mathcal{C}_{\mathrm{sink}},\mathcal{H}_{<i}\right),\quad
        \tau_{0}<\cdots<\tau_{L_{w}-1},\qquad \text{output }\widehat{z}_{i}^{\,0}\text{
        and roll the window}
      caption: 对具有递增噪声水平的多帧 latent 窗口进行联合去噪，并从窗口左端逐帧输出；标准写法，非原文
    train: 训练采用针对扩展去噪窗口的少步蒸馏算法，在非重叠窗口上训练，并通过以自生成历史为条件来缓解 exposure bias。推理时缓存初始帧去掉
      RoPE 的 sink key，在生成过程中将其旋转到 i−L_tem−L_glo 区间；对窗口内多帧 latent 联合去噪，再从左端逐帧输出。摘要未给出具体训练损失、窗口长度或去噪步数。
    diff: 相较于逐帧迭代采样，Rolling Forcing 在窗口内联合去噪多个具有不同噪声水平的帧，以减弱严格相邻因果依赖造成的误差累积。它还将 attention
      sink 用于长时段生成，并通过固定相对位置保留初始帧的全局上下文。
    limits: 摘要未明确说明该方法的计算与显存代价、窗口大小选择、对不同场景或条件信号的适用范围及潜在失败情况。
    has_abstract: true
- id: longlive
  title: LongLive
  date: '2025-09-01'
  precision: month
  arxiv: '2509.22622'
  venue: ''
  lane: 训练侧
  branch: 因果蒸馏
  parent: self-forcing
  link_strength: solid
  training: 需训
  status: 速读
  one_liner: 自回归+少步采样做实时长视频
  mechanism: 把自回归生成与少步采样结合，靠 KV 重算和帧级注意力维持长程一致；报告未描述记忆检索结构。
  key_numbers: []
  self_measured: []
  media:
  - https://github.com/NVlabs/LongLive/raw/main/LongLive-Plug/assets/readme/method.png
  - https://github.com/NVlabs/LongLive/raw/main/LongLive-Plug/assets/readme/overview-first-frame.png
  - https://github.com/NVlabs/LongLive/raw/main/LongLive1.0/assets/video-first-frame.png
  links:
  - https://arxiv.org/abs/2509.22622
  note: 与 LongLive-RAG（2606.02553）同名不同物，勿混；报告只给了一句描述。
  tags:
  - 少步采样
  - KV重算
  explain: 想象你在开一场AI实时视频直播，镜头得一边飞快出图，一边保证播了半天主角的脸和衣服完全不变。以往生成长视频要么太慢做不到实时，要么时间一长画面就崩坏走样。LongLive把少步采样和自回归结合起来，前者指用极少的计算步数快速画图，后者指像接龙一样按时间逐帧推导。这招管用是因为少步骤压低了耗时，同时靠帧级注意力让新帧精准对照历史画面，配合重新计算历史特征的KV重算，让后续内容始终锚定前文，在极速生成中稳住了长期连贯性。
  detail:
    position: LongLive 面向实时、交互式长视频生成，旨在兼顾生成效率、长视频质量，以及用户在生成过程中切换提示词时的连贯性。它采用因果帧级自回归设计，并以少步采样支持快速生成。
    io: 输入包括初始文本提示词，以及生成过程中流式输入或切换的提示词。输出是按帧自回归生成的视频，支持最长 240 秒。
    steps:
    - 以因果帧级自回归方式生成视频帧，使模型能够使用 KV caching 加速推理。
    - 用户输入新提示词时通过 KV-recache 刷新缓存状态，使生成内容平滑适应提示词切换。
    - 训练时采用 streaming long tuning，让模型学习长视频生成，并使训练与推理都面向长序列。
    - 推理时结合短窗口注意力与帧级 attention sink，在加速生成的同时保留长程一致性。
    formulas:
    - tex: p(x_{1:T}\mid c_{1:T})=\prod_{t=1}^{T}p(x_t\mid x_{<t},c_{\le t})
      caption: 标准写法，非原文；表示因果自回归地逐帧生成视频
    - tex: \operatorname{Attn}(Q_t,K,V)=\operatorname{softmax}\!\left(\frac{Q_t[K_{\mathrm{sink}};K_{t-W+1:t}]^{\top}}{\sqrt{d_k}}\right)[V_{\mathrm{sink}};V_{t-W+1:t}]
      caption: 标准写法，非原文；表示结合帧级 attention sink 与短窗口上下文的注意力聚合
    train: 将 1.3B 参数的短视频模型微调至分钟级视频生成，使用 streaming long tuning；摘要报告该过程耗时 32 GPU-days。推理采用帧级自回归生成，支持少步采样，并可进行
      INT8 量化；单张 NVIDIA H100 上报告 20.7 FPS，最长支持 240 秒视频。
    diff: 相较于依赖双向注意力的 Diffusion 和 Diffusion-Forcing 方法，LongLive 使用因果帧级自回归以支持 KV caching。相较于常见的长序列自回归生成，它通过
      KV-recache、streaming long tuning，以及短窗口注意力配合帧级 attention sink，应对提示词切换和长程一致性问题。
    limits: 摘要未见明确说明方法局限；INT8 推理会带来轻微质量损失。
    has_abstract: true
