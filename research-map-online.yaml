  note: 与已收 codewm-brain 同属"逻辑外置"路线，但状态载体是agent而非可执行代码；世界模型侧冻结，收益来自导演层。
  arxiv: '2609.25652'
  explain: 想象玩家把骑士放进一座城堡，规定巨龙每三次喷火后必须露出破绽。若只让视频模型续写画面，它可能画得精彩，却忘了规则，甚至让巨龙突然瞬移。GameDirector要解决的正是玩法逻辑和画面生成混在一起、难以稳定控制的问题。它让智能导演读取当前画面，更新游戏状态、指挥非玩家角色，并强制执行玩家设定的规则；再把导演的决定写成提示词，交给视频世界模型生成下一段画面。前者像裁判和战术教练，后者专心把场景演出来。这样分工，规则不必寄托在模型每次生成时都“记得”，画面也不必承担决策任务。论文在三款游戏中测试，Boss动作质量提升39.9%。
  detail:
    position: GameDirector 解决端到端游戏世界模型难以精确执行健康值、技能、战斗规则和终止条件等明确机制的问题。它将规则驱动的 gameplay
      logic 与视觉渲染分开，以兼顾一致的游戏规则和玩家配置灵活性。
    io: 输入包括玩家定义的角色、状态与规则，以及视频世界模型生成的视觉观察。输出包括更新后的游戏状态、NPC 战术动作和用于引导视频世界模型渲染的文本提示词；玩家配置作为条件信号。
    steps:
    - 接收玩家配置的角色、初始状态与游戏规则，以明确设定需要遵守的 gameplay 机制。
    - 读取视频世界模型提供的视觉观察并更新游戏状态，以跟踪当前局势并形成规则执行依据。
    - 依据状态与规则决定 NPC 的战术行为，以使角色行动符合当前游戏机制。
    - 强制执行健康值、技能、战斗及终止等配置规则，以保证状态转移一致。
    - 将状态与行动决策转换为文本提示词并交给视频世界模型，以渲染符合决策的后续画面。
    formulas: []
    train: 摘要称实验使用自动 gameplay agent 收集的数据，并在三款游戏上进行评估；未说明具体训练流程、模型结构或关键训练设置。推理时，GameDirector
      根据视觉观察更新状态、控制 NPC 并执行规则，再将决策转成提示词交由视频世界模型渲染。
    diff: 已有端到端游戏世界模型通常从像素级监督中联合建模感知、记忆、状态转移与渲染，难以可靠保证明确规则。GameDirector 将规则逻辑外置，由
      agent 负责状态与决策，将视频世界模型限定为视觉渲染模块。
    limits: 未见明确说明
    has_abstract: true
- id: causal-forcing
  title: 'Causal Forcing: Autoregressive Diffusion Distillation Done Right for High-Quality
    Real-Time Interactive Video Generation'
  date: '2026-02-02'
  lane: 训练侧
  branch: 因果蒸馏
  training: 需训
  status: 速读
  one_liner: 用自回归教师补掉SF的架构错配
  mechanism: 指出Self-Forcing拿双向教师做ODE初始化与单向学生不匹配，改用自回归教师做ODE初始化，再走同一套DMD，把因果蒸馏的理论缺口补上。
  tags:
  - 因果蒸馏
  - 教师学生一致
  - DMD
  key_numbers:
  - Dynamic Degree +19.3%
  - VisionReward +8.7%
  - Instruction Following +16.7%
  media: []
  links:
  - https://arxiv.org/abs/2602.02214
  - https://github.com/thu-ml/Causal-Forcing
  - https://thu-ml.github.io/CausalForcing.github.io/
  note: 现在已是minWM、Astronex等框架的默认蒸馏配方，可视为因果蒸馏支的"更正基线"，优先级应高于清单里只做速读的 Self-Forcing。
  arxiv: '2602.02214'
  explain: 想象你边玩游戏边转动镜头，画面必须立刻接住你的动作，不能偷看未来再补帧。Self-Forcing 是一种自回归视频生成方法：每次只根据已有画面预测下一段；麻烦在于，它用能同时看前后画面的教师来初始化生成轨迹，学生却只能看过去，学到的起步方式与实际生成不一致。Causal
    Forcing 改用同样按时间顺序生成的教师来初始化轨迹，再用分布匹配蒸馏（DMD，让学生生成结果贴近教师）训练。教师和学生因此沿着相同的因果路径学习，弥补了蒸馏中的架构错配。实验中，动态程度提升19.3%，视觉奖励提升8.7%，指令遵循提升16.7%。
  detail:
    position: 本文解决将预训练双向视频 diffusion model 蒸馏为少步自回归模型时的架构错配问题。作者指出，直接用双向教师进行 ODE 初始化不满足逐帧可逆映射条件，可能导致性能下降。
    io: 任务输入、条件信号及其具体表示摘要未说明；方法面向交互式视频生成。输出是少步自回归视频生成模型生成的视频。
    steps:
    - 以自回归教师进行 ODE 初始化，使初始化教师与自回归学生的因果架构匹配，从而弥补双向教师初始化带来的理论缺口。
    - 将初始化后的模型作为自回归学生，避免把不满足逐帧 injectivity 条件的双向教师流映射强行用于学生初始化。
    - 对学生应用与 Self Forcing 相同的 DMD 蒸馏流程，以训练少步自回归视频生成模型。
    formulas:
    - tex: p_\theta(x_{1:T}\mid c)=\prod_{i=1}^{T}p_\theta(x_i\mid x_{<i},c)
      caption: 自回归视频生成的因果分解；标准写法，非原文
    - tex: \nabla_\theta L_{\mathrm{DMD}}=\mathbb{E}_{t,z,c}\!\left[w(t)\bigl(s_{\mathrm{fake}}(x_t,t,c)-s_{\mathrm{real}}(x_t,t,c)\bigr)\frac{\partial
        x_\theta}{\partial\theta}\right]
      caption: DMD 蒸馏的分布匹配梯度；标准写法，非原文
    train: 训练先用自回归教师进行 ODE 初始化，再采用 Self Forcing 中相同的 DMD 流程。推理目标是少步自回归实时交互式视频生成；具体训练配置与推理设置摘要未给。
    diff: Self Forcing 使用双向教师做 ODE 初始化，而本文改用自回归教师，使教师与学生的因果架构相匹配。之后仍沿用 Self Forcing
      的 DMD 流程。
    limits: 摘要未见明确说明方法的计算代价、局限或适用范围。
    has_abstract: true
- id: context-forcing
  title: 'Context Forcing: Consistent Autoregressive Video Generation with Long-Context
    Forcing'
  date: '2026-02-05'
  lane: 训练侧
  branch: 恒定上下文
  training: 需训
  status: 速读
  one_liner: 教师也看全程历史，学生才能长一致
  mechanism: 让教师同样拿到完整生成历史以消掉监督错配，再把线性增长的上下文改成Slow-Fast记忆架构压视觉冗余，使超长时长训练可算，有效上下文超20秒。
  tags:
  - 长上下文教师
  - Slow-Fast记忆
  - 监督错配
  key_numbers:
  - 有效上下文>20秒
  - 比LongLive/Infinite-RoPE长2-10倍
  media: []
  links:
  - https://arxiv.org/abs/2602.06028
  note: 与 Self-Forcing 的差别是"教师的视野"而非"学生的步数"，正好补上清单里恒定上下文支只有 FramePack/Honeycomb 的空档。
  arxiv: '2602.06028'
  explain: 想象一段不断延续的长镜头：人物放下杯子，几十秒后杯子仍该在原处。视频模型逐步预测后续画面，时间一长容易忘记细节、动作前后矛盾；若训练时教师只看短片段，学生却要面对完整历史，指导就会错位。Context
    Forcing让教师和学生都读取截至当前的完整生成历史，消除这种监督错配。可历史越长，处理成本越高，于是论文用慢快记忆架构压缩视觉冗余：快记忆保留近期变化，慢记忆概括较久远内容。这样既让指导贴近实际生成，也控制计算开销，有效上下文超过20秒，是LongLive和Infinite-RoPE的2到10倍。
  detail:
    position: 本文针对长视频自回归生成中的长程一致性不足，尤其是短上下文教师无法监督学生学习全局时间依赖的问题。目标是让模型在较长生成过程中保持跨时间的一致性。
    io: 输入为视频生成所需条件及生成历史，具体条件信号摘要未说明；输出为自回归生成的长视频。
    steps:
    - 让教师访问完整生成历史，为学生提供包含长程依赖的监督，以消除师生上下文不匹配。
    - 训练具备长上下文能力的学生，使其依据完整历史进行长程视频生成。
    - 将线性增长的视觉上下文组织为 Slow-Fast Memory，减少冗余并控制超长时长下的计算开销。
    formulas:
    - tex: \mathcal{L}_{\mathrm{distill}}=D_{\mathrm{KL}}\!\left(p_{\theta}(x_{t+1:t+K}\mid
        x_{\le t})\,\middle\|\,p_{\mathrm{T}}(x_{t+1:t+K}\mid x_{\le t})\right)
      caption: 标准写法，非原文；表示学生与教师在相同完整历史上下文下，对后续视频片段分布进行蒸馏。
    - tex: M_t=\operatorname{Concat}\!\left(\operatorname{Pool}(x_{\le t-r}),\;x_{t-r+1:t}\right)
      caption: 标准写法，非原文；表示 Slow-Fast 记忆将较早历史压缩为慢记忆，并保留最近片段作为快记忆。
    train: 训练时使用长上下文教师监督长上下文学生，并通过 Slow-Fast Memory 管理上下文；摘要未给出具体损失函数、训练配置及推理流程细节。
    diff: 已有流式调优方法通常让短上下文教师监督长上下文学生，教师因看不到长期历史而造成监督错配。Context Forcing 让教师也访问完整生成历史，并用
      Slow-Fast Memory 支持更长上下文。
    limits: 摘要指出超长时长需要上下文管理以降低计算开销；其他明确局限未见说明。
    has_abstract: true
- id: longforcing
  title: 'LongForcing: Scaling Temporal Manifold Matching for Long-Horizon World Models'
  date: '2026-10-13'
  lane: 训练侧
  branch: 因果蒸馏
  training: 需训
  status: 速读
  one_liner: 把监督拉到学生的长自rollout上
  mechanism: 保留短程teacher-forcing与因果ODE蒸馏两段，第三段把realscore教师换成双向长程教师，直接监督学生的长自rollout，不改架构也不加推理开销。
  tags:
  - 长程教师
  - 分布匹配
  - 时间轴扩监督
  key_numbers:
  - VBench Quality 85.52
  - WorldRoamBench 60s 动作分+23.9
  - 压力测到24小时rollout
  media: []
  links:
  - https://arxiv.org/abs/2610.18289
  - https://github.com/Fantasy-AMAP/LongForcing
  note: 与 LongTake 同月、都在动"第三段教师"，但 LongForcing 只换教师、LongTake 改初始化，可对照读。
  arxiv: '2610.18289'
  explain: 像让学生先照着范例画几笔，再独自画完整幅长卷：短视频里画得像，不代表连续生成很久也不走样。长时生成的麻烦正是误差会一帧帧累积，训练时看真实画面、生成时却要接着自己的结果往下画。LongForcing保留两步训练：先用真实画面教短程生成，再用因果常微分方程蒸馏，让学生学会逐步生成。随后，它把真实评分教师换成能看前后画面的长程教师，直接纠正学生自己生成的长视频。这样训练目标更贴近实际使用，能压住长期漂移；不改模型架构，也不增加推理开销。结果，VBench画质得分达85.52，WorldRoamBench上60秒动作分提高23.9分，并压力测试到24小时连续生成。
  detail:
    position: 这篇研究自回归视频扩散模型在超出训练窗口进行长程 rollout 时出现的渐进漂移，包括画质下降、运动不一致和物体身份丢失。核心问题是短程蒸馏缺少对后续
      rollout 状态的直接监督。
    io: 输入包括文本条件的视频生成输入，或动作条件的交互式世界模型输入；条件信号分别是文本或动作。输出是生成的视频或长程世界 rollout。
    steps:
    - 先进行短程 teacher-forcing，使学生模型学习短窗口内的生成行为，为后续蒸馏建立基础。
    - 再进行因果 ODE 蒸馏，保留短程因果生成能力，使学生适用于自回归 rollout。
    - 最后让学生生成扩展时域的自 rollout，并由双向长程教师进行 distribution matching，以直接监督短程训练未覆盖的后续状态。
    formulas:
    - tex: \nabla_\theta \mathcal{L}_{\mathrm{long}}=\mathbb{E}_{x_0\sim p_\theta^{\mathrm{roll}},\,t,\,\epsilon}\!\left[w(t)\bigl(s_\theta(x_t,t)-s_{\mathrm{bi}}(x_t,t)\bigr)\frac{\partial
        x_0}{\partial\theta}\right],\qquad x_t=\alpha_t x_0+\sigma_t\epsilon
      caption: 长程 rollout 的分布匹配蒸馏梯度，以双向长程教师的 score 监督学生；标准写法，非原文
    train: 训练保留短程 teacher-forcing 和因果 ODE-distillation 两阶段；最终 distribution-matching
      阶段将 realscore teacher 替换为扩展时域的双向教师，用其监督学生的长程自 rollout。摘要未给具体训练超参数。推理时不修改学生架构，也不增加推理开销。
    diff: 已有短程蒸馏主要匹配短窗口分布，未必能约束长程行为。LongForcing 将教师监督扩展到学生的长程自 rollout，并在最终 distribution-matching
      阶段使用双向长程教师。
    limits: 摘要未见明确说明训练代价与方法局限；推理阶段不增加开销。
    has_abstract: true
- id: forgewm
  title: 'ForgeWM: Progressive Causal Training for Few-Step Action-Conditioned Video
    World Models'
  date: '2026-08-14'
  lane: 训练侧
  branch: 三段训练
  training: 需训
  status: 速读
  one_liner: 四段渐进因果训练换1/2/4步预算
  mechanism: 领域适配→因果teacher-forcing→因果一致性蒸馏→on-policy DMD四段递进，产出1/2/4步专用学生；另给"一步先出草稿、回放时再去噪精修"的双路部署。
  tags:
  - 渐进因果训练
  - 预算专用学生
  - 回放精修
  key_numbers:
  - 1/2/4 步三档
  - 回放精修≈4步质量
  - 比从噪声重生近3倍
  media: []
  links:
  - https://arxiv.org/abs/2608.14022
  note: key_numbers 里的"3倍"指与经验轨迹更接近（reference LPIPS 最低），原文表述为 roughly three times
    closer；动作条件版三段训练的代表。
  arxiv: '2608.14022'
  explain: 想象机器人在仓库里转弯：世界模型要预演它按下指令后的画面，采样步数越多越慢，步数骤减又容易让视频失真。ForgeWM要解决的正是速度与画质难两全。它先适配目标领域，再用因果教师强制训练，让模型只依据过去预测未来；接着蒸馏因果一致性，使少步预测仍与多步结果对齐；最后用在策略分布匹配，让学生在自己生成的画面上继续变好。四阶段训练产出专用的1、2、4步模型。因果约束贴近真实生成顺序，逐步蒸馏也减少压缩误差，因此少步仍能保住质量。部署时还可先一步出草稿，回放时再去噪精修，效果约等于4步生成；比从噪声重新生成，精修快近3倍。
  detail:
    position: 这篇论文要解决动作条件视频世界模型的低延迟因果生成问题，重点是让键盘离散状态与鼠标连续运动在压缩后的潜变量时间块中保持对齐。它将双向动作条件视频生成器逐步转为适用于交互的少步世界模型。
    io: 输入是视频上下文与游戏原生动作控制信号，包括键盘状态、鼠标运动或 gamepad 控制；动作作为条件信号与视频潜变量时间块对齐。输出是受动作控制的未来视频，学生模型分别针对
      1、2、4 步去噪预算进行专门化。
    steps:
    - 先对双向动作条件视频生成器进行领域适配，使模型适应目标游戏及其轨迹数据。
    - 再进行 teacher-forced 因果训练，让模型按因果顺序利用历史上下文和动作生成视频，以建立自回归生成能力。
    - 随后进行因果一致性蒸馏，使因果学生的生成结果与教师模型保持一致，适配压缩后的因果生成过程。
    - 最后使用双向教师进行 on-policy distribution matching，让学生在自身生成分布上训练，降低自回归 rollout 时的分布偏移。
    - 部署时提供 1、2、4 步预算专用学生；还可让一步学生先生成并保存草稿，在回放阶段对草稿重新加噪并精修。
    formulas:
    - tex: \mathcal{L}_{\mathrm{TF}}(\theta)=\mathbb{E}_{(z_{1:T},a_{1:T})}\!\left[\sum_{t=1}^{T}-\log
        p_{\theta}(z_t\mid z_{<t},a_{\le t})\right]
      caption: 标准写法，非原文：基于历史潜变量与动作的因果 teacher-forcing 训练目标
    - tex: \nabla_{\theta}\mathcal{L}_{\mathrm{DMD}}=\mathbb{E}_{\epsilon,t}\!\left[\bigl(s_{\mathrm{fake}}(x_t,t)-s_{\mathrm{teacher}}(x_t,t)\bigr)\frac{\partial
        x_{\theta}}{\partial\theta}\right]
      caption: 标准写法，非原文：on-policy 分布匹配中，利用学生与教师的 score 差异更新学生
    train: 训练按领域适配、teacher-forced 因果训练、因果一致性蒸馏、on-policy distribution matching 四阶段递进，得到稳态去噪预算为
      1、2、4 步的学生。摘要未给出损失函数、数据规模、模型结构等细节。推理时可直接用少步学生生成，也可采用双路部署：交互时优先输出一步草稿，回放时再对已保存草稿去噪精修；摘要报告精修质量可匹配四步参考，同时比从噪声重新生成更接近已体验轨迹。
    diff: 与仅将因果蒸馏用于少步视频合成的做法不同，ForgeWM 将动作对齐和自回归分布偏移纳入渐进训练流程，并通过 on-policy distribution
      matching 使用双向教师训练学生。它还提供草稿复用的回放时精修路径，而不只是在交互时重新生成。
    limits: 摘要未见明确说明方法局限、训练成本或部署资源需求。
    has_abstract: true
- id: causal-rcm
  title: 'Causal-rCM: A Unified Teacher-Forcing and Self-Forcing Open Recipe for Autoregressive
    Video Diffusion'
  date: '2026-06-24'
  lane: 训练侧
  branch: 因果蒸馏
  training: 需训
  status: 速读
  one_liner: TF连续时间CM初始化+SF的DMD精修
  mechanism: 把因果蒸馏拆成两段：teacher-forcing连续时间一致性模型做初始化，self-forcing的反向散度DMD做精修；自研mask
    JVP核支持sCM/MeanFlow，收敛快一个量级。
  tags:
  - 连续时间CM
  - JVP内核
  - 开源配方
  key_numbers:
  - 2步 VBench-T2V 84.63
  - 收敛快10×
  - 纯合成数据
  media: []
  links:
  - https://arxiv.org/abs/2606.25473
  note: 唯一明确给出"TF-CM 是 SF-DMD 最佳初始化"这一实验结论的论文，把三段训练里第一段该怎么选讲清楚了；作者还把配方套到 Cosmos 3
    上做成动作条件交互世界模型。
  arxiv: '2606.25473'
  explain: 想象一台边看前几帧、边续写后续画面的机器：训练时若总能看到完整答案，真正逐帧生成时却要靠自己接龙，画面就容易跑偏；直接训练它独立接龙，又很难学得快。Causal-rCM把训练拆成两段：先用教师强制，让模型在参考答案引导下学习连续时间的一致性，也就是不同生成时刻的结果彼此协调；再用自我强制，让模型按实际接龙方式生成，并通过分布匹配蒸馏（DMD）修正生成结果与目标分布的差距。作者还设计了处理因果遮罩的快速求导内核，支持两类一致性训练方法，大幅缩短计算时间。这样先打基础、再贴近真实生成精修，既减少训练和推理之间的落差，也加快收敛。模型仅用合成数据训练，生成视频只需两步，在VBench文生视频评测中得分84.63，收敛速度提升约十倍。
  detail:
    position: 本文研究如何将扩散蒸馏用于因果自回归视频生成，使模型能以少量采样步进行流式生成，并支持交互式世界建模。核心思路是先用 Teacher-Forcing
      连续时间一致性模型初始化，再用 Self-Forcing 的 DMD 精修。
    io: 输入为生成条件，摘要明确涉及文本到视频以及动作条件生成；具体输入表示未说明。输出为按帧或按块流式生成的视频，或动作条件下的交互式世界模型生成结果。
    steps:
    - 采用 Teacher-Forcing 训练因果连续时间一致性模型，以离线前向散度学习作为初始化。
    - 使用自定义 mask 的 FlashAttention-2 JVP kernel 支持 sCM 或 MeanFlow 训练，以加速连续时间一致性模型收敛。
    - 将初始化后的模型交给 Self-Forcing 阶段，在模型自身生成轨迹上用 DMD 做反向散度精修，以改善自回归生成表现。
    - 将统一训练配方用于帧式和块式因果视频生成，并扩展到动作条件世界模型。
    formulas:
    - tex: \mathcal{L}_{\mathrm{TF}}(\theta)=\mathbb{E}_{x_0,t,\Delta t,\,c_{\le k}}\left[\left\|f_\theta(x_t,t,c_{\le
        k})-\operatorname{sg}\!\left(f_{\bar\theta}(x_{t-\Delta t},t-\Delta t,c_{\le
        k})\right)\right\|_2^2\right]
      caption: Teacher-Forcing 阶段的连续时间一致性蒸馏损失，用于初始化因果一致性模型；标准写法，非原文
    - tex: \nabla_\theta\mathcal{L}_{\mathrm{SF\text{-}DMD}}=\mathbb{E}_{x_t\sim p_\theta^{\mathrm{roll}},\,t}\left[w(t)\left(s_\theta(x_t,t)-s_{\mathrm{T}}(x_t,t)\right)^{\!\top}\frac{\partial
        x_t}{\partial\theta}\right]
      caption: Self-Forcing 阶段在模型自身滚动生成轨迹上进行的 DMD 反向散度精修，匹配学生与教师的扩散分数；标准写法，非原文
    train: 训练分为 Teacher-Forcing 连续时间一致性模型初始化和 Self-Forcing DMD 精修两阶段。摘要称训练仅使用合成数据，并报告自研
      JVP kernel 相比离散时间 CM 收敛快 10 倍；推理可用 1 或 2 步采样，Wan2.1-1.3B 的 2 步因果模型取得 VBench-T2V
      84.63。其他训练细节摘要未给。
    diff: 相较于单独使用一致性模型或 DMD，本文将 Teacher-Forcing 的前向散度训练与 Self-Forcing 的反向散度精修结合，并将其用于自回归视频扩散。另以自定义
      mask 的 FlashAttention-2 JVP kernel 实现连续时间 CM 训练，摘要称其较离散时间 CM 收敛更快。
    limits: 未见明确说明
    has_abstract: true
- id: longtake
  title: 'LongTake: Learning to Sustain Dynamics in Long-Horizon Video Generation'
  date: '2026-09-29'
  lane: 训练侧
  branch: 三段训练
  training: 需训
  status: 速读
  one_liner: 长程TF初始化替掉中间少步蒸馏
  mechanism: 用长真值前缀把直接监督推过训练视界，让模型学会维持动态与画质；该初始化直接对接DMD、省掉中间少步蒸馏，再用Hybrid DMD把监督延到self-rollout后段。
  tags:
  - 长程TF初始化
  - Hybrid DMD
  - 动态度
  key_numbers:
  - 30s/60s self-rollout
  - 无中间少步蒸馏
  - 动态度-美学Pareto前沿
  media: []
  links:
  - https://arxiv.org/abs/2609.38562
  note: 核心反直觉点：长程TF初始化本身就够用，中间少步蒸馏段可以砍掉，训练流水线因此短一环。
  arxiv: '2609.38562'
  explain: 想象镜头跟着滑板少年穿过街区：短片里动作流畅，时间一长，人物可能变形，画面也会变糊。LongTake要解决的正是长视频越生成越失真的问题。它先用真实视频的长前缀训练模型，并把这种逐帧依据真实历史学习的方式称为教师强制；监督因此能越过原有训练视界，让模型学会持续保持动作和画质。这个初始化可直接接入分布匹配蒸馏，即让生成结果贴近真实视频分布，无须先做中间的少步蒸馏。随后，混合式蒸馏再把监督延伸到模型自己生成的后续片段。结果显示，模型可自回滚生成30秒或60秒视频，并在动态感与美感的权衡上达到更好的前沿。
  detail:
    position: 本文解决 autoregressive 视频扩散模型在长时间生成中逐渐静止或画质下降的问题。核心思路是用长视频监督模型学习如何在长时段内持续演化场景动态。
    io: 训练时输入真实长视频的长帧前缀，模型据此预测后续帧；生成时以视频前缀为条件进行 autoregressive rollout，输出长时段视频。摘要未说明额外的文本或其他条件信号。
    steps:
    - 从整理后的真实长视频构造长前缀与后续帧训练样本，以延长直接监督覆盖的时间范围。
    - 进行 Long-Horizon Teacher Forcing，让模型依据长真值前缀预测后续帧，以学习持续动态并维持画质。
    - 将该阶段得到的初始化直接用于 DMD，在 student self-rollout 下进行分布匹配蒸馏，以省去标准流程中的中间少步蒸馏。
    - 使用 Hybrid DMD 将监督延伸到 self-rollout 的较后帧，同时保留初始窗口的双向联合监督，以加强长程生成监督。
    formulas:
    - tex: \mathcal{L}_{\mathrm{LHTF}}(\theta)=\mathbb{E}_{\mathbf{x}_{0:T},\,\tau,\,t,\,\boldsymbol{\epsilon}}\left[\left\|\boldsymbol{\epsilon}-\boldsymbol{\epsilon}_{\theta}\left(\mathbf{x}_{t}^{\tau:\tau+K-1};\,\mathbf{x}_{0:\tau-1}^{\mathrm{gt}}\right)\right\|_{2}^{2}\right]
      caption: Long-Horizon Teacher Forcing：使用长真值前缀条件化未来视频片段的扩散噪声预测损失；标准写法，非原文
    - tex: \mathcal{L}_{\mathrm{Hybrid\text{-}DMD}}=\mathbb{E}\left[\sum_{k=1}^{L}w_k\,\ell_{\mathrm{joint\text{-}DMD}}\!\left(\hat{\mathbf{x}}_{k}^{\mathrm{TF}},\mathbf{x}_{k}^{\mathrm{gt}}\right)+\sum_{k=L+1}^{T}w_k\,\ell_{\mathrm{DMD}}\!\left(\hat{\mathbf{x}}_{k}^{\mathrm{roll}}\right)\right]
      caption: Hybrid DMD：初始窗口保留真值前缀下的联合监督，并将DMD监督延伸到student self-rollout的后续帧；标准写法，非原文
    train: 训练分为 Long-Horizon TF 与 DMD 两阶段，后者直接承接长程 TF 初始化，不经过中间少步蒸馏。摘要提到在相同的五秒 DMD
      训练设置下进行比较，并说明 Hybrid DMD 的监督同时覆盖初始窗口与 self-rollout 后续帧；更具体的训练超参数未给出。推理采用 autoregressive
      长时段 rollout，评估包含 30 秒与 60 秒生成。
    diff: 相较于依赖短视频 TF 初始化并经过中间少步蒸馏的标准流程，LongTake 用长真值前缀扩展直接监督，并将所得初始化直接对接 DMD。Hybrid
      DMD 还把监督延伸到 self-rollout 后段，同时保留初始窗口的双向联合监督。
    limits: 未见明确说明
    has_abstract: true
- id: glance-forcing
  title: 'Glance Forcing: Making Bidirectional Diffusion Autoregressive at a Glance'
  date: '2026-10-14'
  lane: 训练侧
  branch: 因果蒸馏
  training: 需训
  status: 速读
  one_liner: 按噪声区间拆两个专家做少步蒸馏
  mechanism: 高噪段管布局与运动、低噪段管纹理，两段曲率与优化行为不同，单学生必然互相干扰；故拆成慢/快双专家各配目标、教师全冻，只需一条PF-ODE轨迹。
  tags:
  - 双专家蒸馏
  - 噪声分区
  - 教师冻结
  key_numbers:
  - VBench 84.04→84.22
  - 单条ODE轨迹
  - 教师冻结
  media: []
  links:
  - https://arxiv.org/abs/2610.20220
  note: 顺带给出一个可迁移结论：PF-ODE蒸馏主要拉直轨迹几何，分布质量是后面分布匹配那一步单独决定的。
  arxiv: '2610.20220'
  explain: 想象画师先铺出整段视频的动作草图，再补上衣料纹理：前者要看远处布局，后者要盯住细节。双向扩散能同时看整段视频，却不擅长逐段快速生成；把它蒸馏成少步模型时，单个学生还得兼顾两种任务，容易互相干扰。Glance
    Forcing按噪声区间分工：高噪声阶段由慢专家把握布局和运动，低噪声阶段由快专家补足纹理。因为两段生成轨迹的弯曲程度和训练方式不同，拆开学习更合适。训练时教师保持冻结，只需一条概率流常微分方程轨迹——一种把生成过程写成连续确定路径的方式。结果是少步生成仍保质量，VBench得分从84.04升到84.22。
  detail:
    position: 本文解决将双向 diffusion model 转成因果少步 autoregressive 视频生成模型时，PF-ODE 轨迹采集成本过高，以及极少轨迹监督导致生成质量崩塌的问题。核心思路是按噪声区间拆分去噪过程，以减轻不同阶段联合拟合造成的表示干扰。
    io: 输入为视频生成过程中的噪声状态及其条件信号，输出为因果 autoregressive 生成的视频；摘要未明确条件信号的具体形式。方法使用冻结的预训练双向
      diffusion teacher 提供轨迹监督。
    steps:
    - 从冻结 teacher 采集 PF-ODE 去噪轨迹，并将监督压缩到单条轨迹，以大幅降低轨迹采集成本。
    - 按噪声区间拆分去噪过程：高噪阶段交由 slow expert 处理语义布局与运动，低噪阶段交由 fast expert 处理细节纹理，以避免单一学生模型同时拟合两种不同的轨迹几何。
    - 为两个 expert 配置各自对应阶段的训练目标，先通过 PF-ODE distillation 调整少步轨迹几何，再通过 distribution matching
      改善生成分布质量。
    - 推理时由 slow 与 fast expert 分段完成去噪，生成因果 autoregressive 视频；摘要未给出具体调度方式。
    formulas:
    - tex: \mathcal{L}_{\mathrm{PF}}^{(e)}=\mathbb{E}_{(x_t,t)\sim\tau_{\mathrm{teacher}}}\left[\left\|v_{\theta_e}(x_t,t)-v_{\mathrm{teacher}}(x_t,t)\right\|_2^2\right],\quad
        e\in\{\mathrm{slow},\mathrm{fast}\}
      caption: 标准写法，非原文：在教师 PF-ODE 轨迹上对各阶段专家进行速度场蒸馏。
    - tex: v_{\theta}(x_t,t)=\begin{cases}v_{\theta_{\mathrm{slow}}}(x_t,t),&t\in\mathcal{T}_{\mathrm{high}}\\v_{\theta_{\mathrm{fast}}}(x_t,t),&t\in\mathcal{T}_{\mathrm{low}}\end{cases}
      caption: 标准写法，非原文：按高噪与低噪区间切换慢、快专家。
    train: 训练时冻结预训练 teacher，以 PF-ODE 轨迹监督两个分阶段 expert；摘要称仅需一条轨迹，轨迹采集成本约为一张 A100 GPU
      运行一小时。PF-ODE distillation 主要使少步轨迹几何更直，后续 distribution-matching 阶段独立提升分布质量。推理采用
      slow/fast expert 分段去噪，具体步数、损失形式及调度细节摘要未给。
    diff: 已有方法通常将双向 diffusion model 蒸馏为因果少步学生，并依赖大量离线 PF-ODE 轨迹；Glance Forcing 则用单条轨迹监督，并将高、低噪阶段拆给不同
      expert、分别配置目标。该方法还区分轨迹几何优化与分布质量优化的作用，并保持 teacher 完全冻结。
    limits: 摘要未见明确说明适用范围、推理开销或失败情形；方法仍需 PF-ODE 轨迹采集及训练两个 expert，具体训练和推理成本未给。
    has_abstract: true
- id: astronex-world
  title: 'Astronex-World 1.0: Real-Time Interactive World Model Foundation'
  date: '2026-09-17'
  lane: 框架层
  branch: ''
  training: 需训
  status: 速读
  one_liner: 开源可控世界基座，单卡24fps流式
  mechanism: Wan2.2-5B上PRoPE注入相机内外参、64维动作流逐层调制；五段训练做双向控→块因果→少步蒸馏→混域恢复→非对称DMD，832x480@24fps。
  tags:
  - 相机动作控制
  - 块因果KV
  - 五段训练
  key_numbers:
  - 832x480@24fps
  - 64维动作流
  - 五阶段训练
  - 2×L20 48G 可训
  media: []
  links:
  - https://arxiv.org/abs/2609.20034
  note: 摘要自称 open controllable foundation；五阶段含"蒸馏少步学生"，与训练侧三段训练是同一套思路的工程化落地。
  arxiv: '2609.20034'
  explain: 想象你操纵一辆小车穿过街道：转向、加速时，画面得立刻跟着变，还要保持前后连贯。普通视频生成更像一次性拍片，难以实时响应动作，也不容易遵守镜头位置。Astronex-World
    1.0以Wan2.2-5B为底座，用PRoPE把相机内外参——镜头如何成像、相机处于何处——注入模型，再用64维动作流逐层调节生成。训练分五段：先学双向控制，再改为按时间块生成，随后蒸馏成少步推理，并恢复混合场景，最后用非对称DMD压缩生成过程。这样既保留动作与视角约束，又减少等待，可流式生成832×480、每秒24帧；训练需两张48G
    L20。
  detail:
    position: 这篇工作要解决可控视频世界模型难以同时支持相机运动、连续动作控制、文本事件插入和持续实时生成的问题。它提出开源的 Astronex-World
      1.0，面向交互式视觉状态预测。
    io: 输入可以是文本提示或初始图像，并可提供与帧对齐的相机轨迹、连续动作、embodiment 标识，以及指定 rollout 位置的文本事件。输出是随条件信号变化的未来视频帧。
    steps:
    - 以 Wan2.2-TI2V-5B 为视频生成先验，建立双向相机与动作控制能力，以便模型根据上下文学习视觉状态变化。
    - 通过 PRoPE 注入相机内参和外参，并用 64 维动作流调制每个 Transformer 层，使生成过程响应相机和动作条件。
    - 将骨干网络转换为带 block-causal attention 和跨块 KV caching 的因果模型，以支持持续生成和流式推理。
    - 蒸馏出少步生成学生模型，再恢复混合域动态，以兼顾推理效率和不同场景下的动态表现。
    - 应用非对称 DMD 与 DMD2 分布匹配，进一步调整生成分布；模型还支持在 rollout 指定位置插入文本事件。
    formulas:
    - tex: \operatorname{Attn}(Q,K,V;C)=\operatorname{softmax}\!\left(\frac{(Q R_Q(C))(K
        R_K(C))^{\mathsf T}}{\sqrt{d}}\right)V
      caption: 相机条件化的位置重编码与注意力聚合；标准写法，非原文
    - tex: h_{\ell+1}=h_{\ell}+F_{\ell}\!\left(\operatorname{Mod}(h_{\ell},a_{\ell})\right)
      caption: 动作流调制 Transformer 层状态的抽象形式；标准写法，非原文
    train: 训练分五阶段：双向相机与动作控制、转换为块因果生成、少步学生蒸馏、混合域动态恢复、非对称 DMD 与 DMD2 分布匹配。摘要称五个训练阶段均使用两张
      NVIDIA L20 48 GB GPU。因果模型生成分辨率为 832x480、帧率为 24 fps，并可在单张 GPU 上实时流式运行。摘要未给出各阶段的数据构成、损失函数细节或训练时长。
    diff: 相较于仅进行视频生成的模型，该方法将相机内外参和逐层动作调制作为控制接口，并支持指定位置的文本事件。它同时提供双向全上下文生成与带块因果注意力和跨块
      KV 缓存的持续生成模型。
    limits: 训练需要两张 NVIDIA L20 48 GB GPU；摘要未见明确说明数据来源、控制精度、长时生成稳定性及不同硬件上的推理代价。
    has_abstract: true
- id: minwm
  title: 'minWM: A Full-Stack Open-Source Framework for Real-Time Interactive Video
    World Models'
  date: '2026-05-28'
  lane: 框架层
  branch: ''
  training: 需训
