  arxiv: '2606.27537'
  explain: 想象一个球滚到沙发后：你看不见它时，它可能被踢动；再露面却仍停在原处，说明模型没记住遮挡期间发生了什么。MemoBench要解决的正是视频世界模型的这个麻烦：许多测试里，遮挡时场景静止，模型即使忘了变化也能答对。它用消失—重现测试：物体先经历物理过程，离开视野一段时间，再出现时必须呈现更新后的状态。基准包含360段带真实状态记录的片段，用四个诊断支柱检查模型是否记住变化，并结合自动指标和视觉问答（用问题检验画面理解），评估8个先进模型。让变化发生在看不见的时候，才能测出模型是在记忆世界，还是只根据眼前画面补全视频。
  detail:
    position: MemoBench 评测视频生成模型能否在目标离开视野期间记住其经历的物理变化，并在目标重现时生成正确的更新状态。它针对只在目标持续可见时评估一致性，或遮挡期间场景保持静止的基准设定。
    io: 输入为包含目标经历物理过程、随后消失并重现的动态场景，以及模型生成的视频结果；摘要未说明具体提示词或条件信号。输出是结合自动指标与 VQA-based
      assessment 得到的评测结果，用于诊断模型对目标状态变化的记忆一致性。
    steps:
    - 构建涵盖 synthetic 与 real-world 场景的 ground-truth clips，使评测包含目标在遮挡期间发生变化的情形。
    - 设置目标经历物理过程、离开视野并再次出现的场景，以检验模型是否保留遮挡期间发生的状态变化。
    - 让模型生成对应的视频结果，并与 ground-truth clips 所表达的变化状态进行评估。
    - 结合自动指标与 VQA-based assessment，从四个诊断支柱评估模型表现，以揭示不同方面的记忆一致性问题。
    formulas: []
    train: 摘要未给训练流程或训练设置。推理与评测方面，摘要说明评估了八个 state-of-the-art 模型，并结合自动指标与 VQA-based
      assessment；具体推理参数与指标细节摘要未给。
    diff: 不同于主要在目标持续可见时评估一致性的基准，MemoBench要求模型在目标消失期间追踪其经历的变化。它也超越了遮挡期间场景静止的设定，专门评测动态环境中的
      disappear-and-reappear 记忆。
    limits: 未见明确说明。
    has_abstract: true
- id: playworld
  title: 'PlayWorld: Benchmarking World Models with Agent Players over Long-Horizon
    Objectives'
  date: '2026-08-13'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 让agent玩家带长程目标去考世界模型
  mechanism: 派多模态agent玩家按指定长程目标在世界模型里行动，用任务达成替代固定动作序列；171个场景，四维评几何一致、交互保真、视野外演化、认知演化。
  tags:
  - agent玩家
  - 任务达成率
  - 视野外演化
  key_numbers:
  - 171 场景
  - 9个世界模型
  - 4个核心维度
  media: []
  links:
  - https://arxiv.org/abs/2608.13552
  - https://github.com/kxding/PlayWorld
  note: 信号是"能不能被一个会规划的策略玩到目标"，把固定动作打分的可比性问题绕开了；结论是长程目标下空间一致与状态持续最不可靠。
  arxiv: '2608.13552'
  explain: 想象你让机器人在虚拟小镇里找到钥匙，再用它打开房门。若只检查它能否照着固定动作走，世界模型可能看似合格，却经不起绕路、转身和等待。PlayWorld要解决的正是这种评测失真：它让多模态智能体，也就是能理解图像并采取行动的程序，带着长程目标在模型生成的世界里探索，以任务是否达成取代固定动作序列。基准包含171个场景，评估9个世界模型的几何一致性、交互保真度、视野外演化和认知演化。四个维度分别检查空间是否稳定、动作是否有效、看不见的地方是否合理变化，以及智能体能否据此更新理解。因为玩家会主动探索并追踪目标，这种评测更能检验模型能否支撑持续行动，而非只生成一段好看的画面。
  detail:
    position: PlayWorld 旨在解决不同 video world models 难以公平比较的问题：同一长程目标在不同模型中可能需要不同动作序列，因此固定动作序列评测不适用。它让
      Agent Players 通过交互完成指定目标，并据此评估模型表现。
    io: 输入包括当前观察、指定的长程目标，以及 world model 对玩家动作的响应；Agent Player 根据多模态信息选择动作。输出包括交互生成的视频和任务评测结果，评测涵盖四个核心维度及视频质量、可控性指标。
    steps:
    - 为每个场景指定长程目标，形成 171 个可评测任务，以目标而非固定动作序列定义评测内容。
    - 将场景观察和目标提供给多模态 Agent Player，使其根据当前交互状态决定下一步行动。
    - 把 Agent Player 的动作输入 world model，并将模型生成的后续状态反馈给玩家，以持续推进目标任务。
    - 根据交互过程和生成结果，从几何一致性、交互保真度、视野外演化、认知演化等维度评估模型，并补充视频质量与可控性指标。
    formulas: []
    train: 摘要未给训练流程或关键训练设置。推理时由多模态 Agent Player 在 world model 中围绕指定长程目标进行交互，再对任务表现和基础能力进行评测。
    diff: 区别于依赖固定动作序列的评测，PlayWorld 以长程目标驱动 Agent Player 与模型交互，允许不同模型通过不同动作路径完成同一目标。它还系统评估几何一致性、交互保真度、视野外演化和认知演化。
    limits: 摘要未见明确的评测代价或方法局限说明；实验指出当前模型在长程交互目标上仍不可靠，尤其难以维持空间一致性和持久状态演化。
    has_abstract: true
- id: mist
  title: 'Execution Before Memory: Diagnosing Memory Failures in Video World Models
    (MIST)'
  date: '2026-10-16'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 把"没执行改变"与"忘了"分开诊断
  mechanism: 先让模型在改变被隐藏时布景，之后再要求显形，并卡住提前泄漏；这样低分能定位成"没执行指令"而非"遗忘"，再用M3-Agent递归改写指令做对照实验。
  tags:
  - 执行与记忆解耦
  - 泄漏控制
  - 诊断型基准
  key_numbers:
  - MIST显形分×3以上
  - WRBench T +26.1%
  - MBench-T U +52.7%
  media: []
  links:
  - https://arxiv.org/abs/2610.23542
  note: 它同时提出基准与 M3-Agent 方法，引用时要分开；最大贡献是指出很多"记忆差"其实是"指令没执行"，旧基准的单一分数会误诊。
  arxiv: '2610.23542'
  explain: 想象让模型拍一段房间视频：先把红球换成蓝球，最后再让蓝球出现。若结果里没有蓝球，模型可能是忘了，也可能压根没照做；只看成片，难以分清。MIST是一套诊断测试：先要求模型布置场景，却暂时隐藏改变，之后再要求它让改变显形，并阻止它提前露出变化。这样，失败就能更明确地归因于没执行指令，而非遗忘。研究还用M3-Agent——会递归改写指令的智能体——做对照，检验模型是否真能完成改变。结果显示，MIST显形分数提升三倍以上，WRBench
    T提升26.1%，MBench-T U提升52.7%。
  detail:
    position: MIST 旨在区分视频世界模型的记忆失败与指令执行失败，因为模型没有执行场景变化时，后续状态中就没有可供记忆的变化。它通过分离场景设置、变化执行和结果显形来定位瓶颈，并提出
      M3-Agent 改善指令执行。
    io: 输入是要求模型生成视频场景及其后续变化的指令，变化在初始布景阶段保持隐藏，并在之后要求模型显形。输出是对变化是否执行以及最后一帧是否呈现结果的评估；过程中控制提前泄漏，作为条件约束。
    steps:
    - 先让模型根据指令设置场景，同时隐藏待执行的变化，以便建立变化发生前的场景状态。
    - 控制变化信息在显形阶段前不泄漏，以免模型提前表现出变化、混淆对记忆能力的判断。
    - 之后要求模型执行并显现变化，检查它是否实际完成了指令要求的状态转移。
    - 分别评估变化执行与最后一帧结果，避免把未执行变化造成的低分误判为遗忘。
    - 使用 M3-Agent 递归改写输入指令，观察改写后模型能否执行变化，从执行侧提供对照。
    formulas: []
    train: 摘要未给出模型训练流程或 M3-Agent 的具体递归改写算法。推理评估按先布景、后要求显形的顺序进行，并控制提前泄漏；M3-Agent 通过递归修改指令细节来促使模型执行请求的变化。
    diff: 已有测试常将场景设置、变化执行和末帧结果合并为一个分数，难以判断低分是否来自遗忘。MIST 将变化执行与其应留下的记忆分开诊断，并用 M3-Agent
      检验改进指令表述后模型能否完成变化。
    limits: 摘要未见明确说明评估成本、适用范围或 M3-Agent 递归改写的具体限制。
    has_abstract: true
- id: worldoracle
  title: 'WorldOracle: Benchmarking Action-Conditioned World Models against Real-World
    Executions'
  date: '2026-10-13'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 同动作配对真机执行，考动作条件模型
  mechanism: 给同一初始观测与同一低层动作序列，比对预测rollout与真机记录，从物理状态正确性、交互空间对齐、关键交互区保真、多视角动作一致性四维评。
  tags:
  - 真机配对
  - 动作条件
  - 操作任务
  key_numbers:
  - 7个ACWM
  - 4个评测维度
  - 含失败执行段
  media: []
  links:
  - https://arxiv.org/abs/2610.18826
  note: 信号是"同一动作在真机上会发生什么"，是少数用真机配对而非仿真当参照的基准；数据集与榜单已放。
  arxiv: '2610.18826'
  explain: 想象机器人把杯子推向桌边：模型说杯子会滑落，真机却停住了。单看生成视频，很难判断预测是否可信。世界预言机要解决的，正是动作条件世界模型——输入动作、预测后续画面的模型——缺少可靠实测标准的问题。研究者让模型和机器人从同一初始观测出发，执行相同的低层动作序列，再把预测过程与真机录像对照。测试覆盖七个模型，也保留失败执行片段；评估看四件事：物理状态是否正确、交互位置是否对齐、关键接触区域是否保真，以及不同视角下动作是否一致。起点和动作相同，能减少比较中的干扰，让结果更能反映模型预测能力；纳入失败片段，也能检验模型是否呈现真实意外，而不只是生成好看的成功画面。
  detail:
    position: 这篇工作提出 WorldOracle，用于评估 action-conditioned world models 是否能在给定动作后复现真实世界中的物理变化与任务状态转移。核心问题是让模型预测
      rollout 与配对的真机执行结果进行系统比较。
    io: 输入是相同的初始观测和低层动作序列，条件信号包括初始观测与动作。输出是模型生成的预测 rollout，并与对应的真机记录进行多维度评估。
    steps:
    - 整理覆盖不同交互动态与具身形态的真实世界训练和评估数据，为模型评测提供真实执行依据。
    - 构建包含多个长时段片段的评估 episode，并纳入成功与失败执行，以覆盖多样的动作结果和行为分布。
    - 对每个评测样本向模型提供初始观测与低层动作序列，生成预测 rollout，以便和同条件下的真机执行配对比较。
    - 从物理状态正确性、交互空间对齐、关键交互区保真和多视角动作一致性四个维度评估预测结果，以刻画模型的不同能力与失效模式。
    - 在七个代表性 action-conditioned world models 上开展实验，并提供数据集、评估代码与 leaderboard，支持后续比较。
    formulas: []
    train: 工作重点是构建基准与评估 action-conditioned world models，而非提出新的模型训练方法。摘要提到整理真实世界训练与评估数据，并在七个代表性模型上进行评测；具体训练流程、模型设置与推理细节摘要未给。
    diff: 与缺少配对真机结果或只考察单一指标的评估方式不同，WorldOracle 对相同初始观测和动作序列下的预测 rollout 与真实执行进行对照，并从四个互补维度评估。评估数据还覆盖长时段、多片段以及成功和失败结果。
    limits: 摘要未明确说明基准的计算与数据采集成本、评估指标的具体计算方式，也未说明其适用范围限制。
    has_abstract: true
- id: pvbench
  title: 'PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level
    Measurements'
  date: '2026-10-19'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 用物体级6D位姿与守恒残差量化物理
  mechanism: 七个域共46维、600条提示（30%含机械臂/人形/四足/多智能体），可测维度各配专用视觉模型，算出物体6D位姿、米制尺度、法线、运动学与守恒律残差。
  tags:
  - 物体级测量
  - 守恒残差
  - 46维指标
  key_numbers:
  - 600 条提示
  - 30% 含具身智能体
  - 46维 / 7域
  media: []
  links:
  - https://arxiv.org/abs/2610.26711
  note: 明确要摆脱主观打分：能算的维度全部落成可验证数值（6D位姿、米制尺度、法线、守恒残差），并做了自动指标与人工判断的一致性验证。
  arxiv: '2610.26711'
  explain: 想象视频里一个杯子被推下桌：它可能看起来很真实，却在落地后穿过地板，或大小忽然改变。只凭观感打分，很难准确抓出这类物理破绽。PVBench把检查落到物体上：6D位姿就是物体在三维空间的位置和朝向；再测米制尺度、表面法线和运动学，并计算守恒律残差，也就是物理量偏离应有规律的程度。它覆盖七个领域、46个可测维度，配备专用视觉模型，并用600条提示测试，其中30%涉及机械臂、人形、四足或多智能体。逐项测量能把“看着不对”变成可比较的数值，也让评测更容易定位视频生成在哪种物理规律上出错。
  detail:
    position: PVBench 旨在解决视频生成模型的物理可信度缺乏客观、细粒度测量的问题。它通过物体级测量评估生成视频在几何、运动、动力学和守恒规律等方面的表现。
    io: 输入是 600 条用于 text-to-video 或 image-to-video 的提示及其生成视频，条件信号为文本或图像。输出是覆盖七个域、共
      46 个维度的评估结果，其中可测维度包括物体级 6D 位姿、米制尺度、表面法线、运动学量和守恒律残差。
    steps:
    - 构建覆盖七个评估域的 600 条提示，并纳入多种具身主体，以覆盖不同的物理场景。
    - 将提示输入 text-to-video 或 image-to-video 模型生成视频，以评估其生成结果的物理可信度。
    - 对可测维度使用专用视觉模型提取物体级几何与运动信息，以获得可验证的物理测量。
    - 依据提取结果计算各维度的测量指标，包括运动学量和守恒律残差，以量化视频中的物理表现。
    - 通过人类评估检验自动指标与人类判断的一致性，并用于评测主流开源和闭源模型。
    formulas: []
    train: PVBench 是评测基准，摘要未说明相关模型的训练流程或关键设置。推理评测中，专用视觉模型从生成视频提取物体级测量，并据此评估各维度；自动指标与人类判断的一致性通过人类评估验证。具体推理配置摘要未给。
    diff: 已有基准多依赖粗粒度的视觉语言模型判断，或面向具身世界模型，而非直接评测视频生成。PVBench 对可测物理维度使用专用视觉模型和物体级测量，降低对主观评分的单独依赖。
    limits: 摘要未明确说明计算代价、专用视觉模型的适用范围限制或评测误差来源。
    has_abstract: true
- id: orbia
  title: 'Orbia: Do Generated Videos Form a Consistent 3D World?'
  date: '2026-10-14'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 回头再看：生成的视频是否同一个3D世界
  mechanism: 用带标注锚点的720个实例与六种探索-重访协议，比重访未见区域与首次生成、跨视角深度与特征对应、区域尺度一致、留出高斯重渲染，判3D自一致与内容持久。
  tags:
  - 重访一致性
  - 3D自一致
  - 高斯重渲染
  key_numbers:
  - 720 实例
  - 27个模型
  - 6种探索-重访协议
  media:
  - https://orbia-bench.github.io/assets/nus.png
  links:
  - https://arxiv.org/abs/2610.20693
  note: 测两个不同信号：模型自己造出来的内容回头还在不在（content persistence），以及多视角是否描述同一场景（3D self-consistency），长分钟级探索才算过关。
  arxiv: '2610.20693'
  explain: 想象你在一段生成视频里走进房间，转身离开，再回来：桌上的杯子还在原处吗？许多视频看起来连贯，却可能在镜头转开后悄悄改写场景，难以判断它们是否真的维持同一个三维世界。Orbia用720个带有位置标记的场景实例，测试27个模型，并设计六种“探索后重访”的过程，让模型生成离开前后的画面。它比较重访区域与第一次生成的内容，也检查不同视角下的深度和图像特征是否对得上、区域大小是否稳定；最后把未参与测试的三维高斯场景重新渲染，检验能否还原画面。三维高斯是一种用许多带颜色与形状的空间点表示场景的方法。这些检查分别追问物体有没有变、空间关系是否一致、场景能否重建，因此比只看单段视频是否逼真，更能揭示生成内容能否持久且自洽。
  detail:
    position: Orbia 研究视频生成模型在探索与重访过程中，生成画面是否持续对应同一个 3D 世界。它提供系统化基准，评估输入场景是否被保留、模型新生成的内容是否持久，以及不同视角是否符合
      3D 自一致性。
    io: 输入是场景与交互探索和重访过程，模型可由文本、动作或相机条件驱动。输出是针对外观、几何、空间稳定性、生成内容持久性和 3D 自一致性的评估结果。
    steps:
    - 汇集公开数据集、自采场景和仿真场景，构建带有注册 RGB-D 参考与标注锚点的数据实例，以便对生成结果进行参照评估。
    - 按六种探索与重访协议控制场景交互，并记录模型在探索和返回场景时生成的视图，以测试短期及长期一致性。
    - 将重访时输入图像中未出现区域的生成结果与其首次观测比较，以衡量模型是否保留自己创建的内容。
    - 利用跨视角深度与特征对应、区域尺度一致性及留出 Gaussian 渲染，检查不同视图能否描述同一个 3D 场景。
    - 结合参考图像与标注锚点评估外观、几何和空间稳定性，并在多种模型上运行基准以诊断一致性问题。
    formulas: []
    train: 摘要未说明训练流程；评测覆盖 27 个文本、动作和相机条件模型，并通过 native-interface adapters 接入。摘要未给出推理时的关键参数设置。
    diff: 已有基准通常只评估部分几何属性，或用 vision-language models 判断记忆与一致性。Orbia 通过受控探索与重访，联合评估输入保留、生成内容持久性和
      3D 自一致性，并纳入长时间尺度测试。
    limits: 未见明确说明
    has_abstract: true
- id: pawbench
  title: 'PAWBench: How Far Are We from Probabilistically Aligned World Modeling?'
  date: '2026-08-27'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 同一观测与动作，重复采样的分布对不对
  mechanism: 提出"概率对齐"：世界模型要复现同一初始观测与动作下多种合法演化的分布，而非单条轨迹可信；PAWEval把多次rollout转成行为经验分布再与参考比对。
  tags:
  - 概率对齐
  - 分布级评测
  - 随机采样
  key_numbers:
  - 50 个场景
  - 11个系统
  - 无一稳定对齐
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2608.27345
  note: 测的是"同一条件下多次生成的分布形状"，与所有单视频合理性基准正交；结论是现有系统连方向都没对上，别急着谈记忆。
  arxiv: '2608.27345'
  explain: 想象桌上的球被轻轻推了一下：它可能滚向不同方向，也可能碰到杯子后弹开。世界模型若只生成一段看起来合理的视频，仍可能把这些结果的概率猜错。PAWBench关注的正是这个麻烦：同一初始画面和动作，模型多次生成的结果，是否像真实世界那样分布。论文把这种要求称为概率对齐，也就是不仅看单条轨迹像不像，还看各种可能结果出现得是否合适。评测方法PAWEval会反复运行模型，把生成结果汇成行为经验分布，再与参考分布比较。多次采样能检查模型是否漏掉可能性，或把某种结果生成得过多。测试覆盖50个场景、11个系统，却没有一个能稳定对齐。
  detail:
    position: 本文研究视频生成模型作为世界模型时，能否在相同初始观测与动作下复现多种合法物理演化及其概率分布。为此，论文提出概率对齐这一分布层面的评估目标，并构建
      PAWBench 与 PAWEval。
    io: 输入是初始观测和动作条件，模型据此生成多次视频 rollout。PAWEval 将 rollout 转为可能物理行为的经验分布，并与参考分布比较；摘要未说明具体行为表示方式。
    steps:
    - 将世界模型的评估目标从单条视频的合理性扩展到同一条件下的行为分布，以检验模型是否捕捉了多种合法演化。
    - 构建包含不同物理情景的 PAWBench，为评估视频生成模型提供测试场景和参考行为分布。
    - 在相同初始观测与动作条件下重复生成视频 rollout，以收集模型对可能演化的采样结果。
    - 使用 PAWEval 将多次 rollout 转化为行为经验分布，并与参考分布比较，从而评估概率对齐程度。
    - 在多个系统上进行评测，并进一步考察语言提示、初始噪声采样和模型训练能否改变预测分布。
    formulas:
    - tex: \hat{p}_{M}(b\mid o_0,a_{0:T-1})=\frac{1}{N}\sum_{i=1}^{N}\mathbf{1}\!\left[f(\tau_i)=b\right],\qquad
        \tau_i\sim M(\cdot\mid o_0,a_{0:T-1})
      caption: 将相同初始观测与动作下的多次视频 rollout 转换为行为经验分布；标准写法，非原文
    - tex: \mathrm{PAWEval}(M)=\mathcal{D}\!\left(\hat{p}_{M}(b\mid o_0,a_{0:T-1}),\,p_{\mathrm{ref}}(b\mid
        o_0,a_{0:T-1})\right)
      caption: 比较模型行为经验分布与参考行为分布以衡量概率对齐程度；标准写法，非原文
    train: 摘要未给出模型训练流程或具体设置。推理评估通过固定条件下的重复视频生成收集 rollout，再由 PAWEval 转为行为经验分布并与参考分布比较。
    diff: 已有评估主要关注单条视频是否合理，本文则检验重复生成能否恢复正确的行为范围及其概率分布。论文将视频生成模型视为随机采样器，并以分布层面的概率对齐作为评估目标。
    limits: 摘要指出，在 50 个情景和 11 个系统中，没有模型能持续匹配参考概率并恢复有效行为范围；摘要未见对评测代价或其他局限的明确说明。
    has_abstract: true
- id: memory-forcing-train
  title: 'Memory Forcing: Attendable Mid-Horizon History for Streaming Video Generation'
  arxiv: '2610.11756'
  date: '2026-10-08'
  lane: 训练侧
  branch: 恒定上下文
  one_liner: 固定缓存里塞进中程历史银行
  mechanism: 把定长KV切成sink/archive/working三段，归档区专门留多样中程事件；绝对时间索引越界后用Bank-aware RoPE在注意力时重编索引，使各bank可区分，缓存不加。
  tags:
  - 分段KV银行
  - Bank-aware RoPE
  - 中程遗忘
  training: 需训
  status: 速读
  key_numbers:
  - 1.3B 与 Wan2.2-5B
  - 5s→60s 掉点最小
  - leave-and-return 可复现
  links:
  - https://arxiv.org/abs/2610.11756
  note: 明确命名并量化"mid-horizon forgetting"，把"只留开头+最近"这一默认假设的失效点钉死；跨1.3B/5B两规模验证。
  explain: 想象镜头一路跟着人穿过街巷，几分钟后又回到最初的咖啡馆：人物和场景都该认得出来。可流式视频模型的缓存容量固定，旧画面不断被挤掉，隔久了再回来就容易忘记中程发生过什么。Memory
    Forcing把缓存分成三段：保留开头的“水槽区”、保存多样旧事件的“归档区”，以及存放眼前画面的“工作区”。绝对时间索引超出范围时，它用Bank-aware
    RoPE（一种按缓存区重新编码时间位置的方法）让模型分清各段记忆，无须增加缓存。这样，模型既能看当前画面，也能按需取回关键往事。实验中，1.3B模型和Wan2.2-5B都受益；从5秒延长到60秒时性能下降最小，也能复现离开后再返回的场景。
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  detail:
    position: 本文解决流式视频生成中的 mid-horizon forgetting：固定大小的 KV cache 通常只保留开头帧和最近帧，导致较早但仍重要的中程事件无法被后续帧访问。Memory
      Forcing 在不增大缓存的前提下保留这类历史。
    io: 输入为流式视频生成过程及其固定大小的 KV cache，输出为持续生成的视频帧。摘要未说明具体条件信号。
    steps:
    - 将定长 KV cache 划分为 sink、archive 和 working 三个区域，以在固定容量内同时容纳不同时间跨度的信息。
    - 在 archive 区保留多样的中程事件，并在 working 区保留近期运动，以免重要历史随缓存滑动而丢失。
    - 当绝对时间索引超出训练范围时，在注意力计算时使用 Bank-aware RoPE 重新分配索引，使不同 bank 可区分。
    - 生成新帧时让注意力访问这些 bank，使后续帧能够利用归档的中程历史，同时维持固定缓存大小。
    formulas:
    - tex: \operatorname{Attn}(q_t,K_t,V_t)=\operatorname{softmax}\!\left(\frac{\bigl(R(\tilde
        p_q)q_t\bigr)\bigl(R(\tilde{\mathbf p}_K)K_t\bigr)^{\top}}{\sqrt d}\right)V_t,\qquad
        \tilde p_i=p_i+\Delta_{b(i)},\quad b(i)\in\{\mathrm{sink},\mathrm{archive},\mathrm{working}\}
      caption: Bank-aware RoPE：在注意力计算时为不同 KV bank 重新分配可区分的位置索引；标准写法，非原文
    - tex: \mathcal C_t=\mathcal S_t\cup\mathcal A_t\cup\mathcal W_t,\qquad |\mathcal
        C_t|=M,\qquad \mathbf h_t=\sum_{b\in\{\mathrm{sink},\mathrm{archive},\mathrm{working}\}}\operatorname{softmax}\!\left(\frac{q_tK_{t,b}^{\top}}{\sqrt
        d}\right)V_{t,b}
      caption: 固定容量 KV cache 的 sink/archive/working 分区及跨 bank 注意力聚合；标准写法，非原文
    train: 摘要未给训练数据、训练目标和具体训练设置。推理时采用流式生成，在固定大小的 KV cache 中维护 sink、archive 和 working
      三个区域，并在注意力时使用 Bank-aware RoPE；摘要未给更具体的推理参数。
    diff: 已有 few-step 系统通常只保留开头帧与最近帧，Memory Forcing 则在相同固定缓存容量内增加专门保存多样中程事件的 archive
      区。它还通过 Bank-aware RoPE 处理绝对时间索引越出训练范围的问题。
    limits: 未见明确说明
    has_abstract: true
- id: solarrenderer
  title: 'SolarRenderer: Few-Step Generative Reference Rendering'
  arxiv: '2610.28630'
  date: '2026-10-01'
  precision: month
  venue: Technical Report (Show Lab)
  lane: 代码世界模型
  branch: 神经渲染器
  parent: streamrender-h3
  link_strength: 同底座与同分工
  training: 需训
  status: 速读
  one_liner: 任意结构输进来，四步渲成实拍
  mechanism: control LoRA 教冻结的 MiniMax-H3 跟结构视频；少步 LoRA 带结构引导后训压到四步；block-causal 版按块出流
  tags:
  - 结构条件渲染
  - 四步LoRA
  - 未见结构泛化
  key_numbers:
  - 4 步（对比 50 步 12.3×）
  - 16 种结构，11 种训练未见
  - 208 例泛化基准
  - 53 段同分布测试
  - 136,289 训练片段
  - 4 个 LoRA（控制/四步 × 全片/流式）
  explain: 想象把摄像机轨迹、深度图或边缘骨架交给模型，它要四次“落笔”就生成连贯的实拍画面。SolarRenderer解决的是结构难跟、生成要反复采样、视频难实时流出的麻烦。它先训练控制LoRA（只增加少量参数的适配器），让冻结的MiniMax-H3跟随结构视频；再用结构引导训练少步LoRA，把50步压到4步，快12.3倍。先学会对齐“骨架—画面”，再压缩采样，所以控制和质量都能保住。流式版本采用block-causal机制（按块生成，只依赖当前及过去块）。模型用136,289段片段训练，覆盖16种结构，含11种未见结构，并在208例泛化基准、53段同分布测试上验证；四个LoRA覆盖控制/四步与全片/流式。
  detail:
    position: 把游戏引擎或 agent 产出的结构（点云、骨架、线框、深度、法线、体素、遮挡掩码等）直接渲成写实视频，让「谁定布局」和「谁定外观」彻底分开。
    io: 输入是一段结构视频（逐帧的几何/骨架/掩码信号）加一张参考图和一句文本；输出是同布局、同运动、同机位的写实视频。结构只编码布局与相机，纹理光照全部交给渲染器。
    steps:
    - 在冻结的 MiniMax-H3 上加 control LoRA，训练它把结构视频当条件通道读进去，参考图决定这一条片子的世界长什么样。
    - 用结构引导对少步 LoRA 做后训练，把采样步数从 50 压到 4，同时要求结构一致性不退化。
    - 同一套 LoRA 再训一个 block-causal 变体：按块生成、只看向过去，用于流式出画面。
    - 推理时结构从引擎/agent 来，参考图取第一帧，四步出片；流式版本按块推进。
    formulas:
    - tex: \mathcal{L}_{\mathrm{ctrl}}=\mathbb{E}_{t,\epsilon}\left\|\epsilon-\epsilon_{\theta+\Delta
        W_{\mathrm{ctrl}}}\left(z_t,t,c_{\mathrm{ref}},c_{\mathrm{struct}}\right)\right\|^{2}
      caption: 控制 LoRA 的训练目标：冻结主干 θ，只学增量 ΔW，让去噪网络同时吃参考图和结构条件。（标准写法，非原文逐字）
    - tex: \mathcal{L}_{\mathrm{few}}=\mathbb{E}_{t}\left\|v_{\theta+\Delta W_{\mathrm{few}}}(z_t,t)-v_{\mathrm{teacher}}^{\mathrm{sg}}(z_t,t)\right\|^{2}
      caption: 少步 LoRA 的蒸馏目标：以 50 步教师的速度场为目标（sg 表示不回传梯度），把 4 步学生的轨迹拉到教师轨迹上。（标准写法，非原文逐字）
    train: 136,289 条训练片段（公开 57,738 条带视频）；共 4 个 LoRA：控制与四步各一套，全片与因果流式各一套。
    diff: 和 StreamRender-H3 同底座同分工，但把「什么结构都能吃」做成主目标：16 种结构里 11 种训练时没见过，仍能渲染；HelixWorld/AlayaRenderer
      类工作通常只针对 G-buffer 或语义图一种条件。
    limits: 仍是 MiniMax-H3 这个量级的主干，四步也只是采样步数压缩，不是换小模型；结构视频本身要有正确的布局和相机，结构错了它不会纠正。
    has_abstract: true
  media:
  - https://enderfga.cn/SolarRenderer/media/film/solarrenderer-film.mp4
  - https://enderfga.cn/SolarRenderer/media/realtime/games.mp4
  - https://enderfga.cn/SolarRenderer/media/realtime/characters.mp4
  - https://enderfga.cn/SolarRenderer/media/hero/gb-castle__photoreal.mp4
  links:
  - https://arxiv.org/abs/2610.28630
  - https://enderfga.cn/SolarRenderer
  - https://github.com/Enderfga/SolarRenderer
  - https://huggingface.co/Enderfga/SolarRenderer
  - https://huggingface.co/datasets/Enderfga/SolarRenderer-Data
  confidence: high
  note: Show Lab（Mike Zheng Shou 组）Guian Fang 等；Elo 用 gemini-3.8-flash 当裁判、每对交换顺序判两次，另有真人盲测同向。泛化基准
    208 例、同分布 53 段均开源。
