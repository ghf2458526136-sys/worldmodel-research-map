    - 围绕训练数据开展工作，以支持物理 AI 相关用途。
    - 面向仿真场景使用该模型，而非将其定位为流式交互生成系统。
    formulas: []
    train: 摘要未给。
    diff: 已知定位侧重物理 AI 的训练数据与仿真。它不是流式交互生成方法。
