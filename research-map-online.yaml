- id: alaya-renderer-flash
  title: 'AlayaRenderer-Flash: Generative World Renderer at the Speed of Play'
  arxiv: '2607.18703'
  date: '2026-07-15'
  lane: 代码世界模型
  branch: 神经渲染器
  one_liner: 把物理引擎的 G-buffer 渲成照片，单卡 31 FPS
  mechanism: 接收引擎逐帧导出的 albedo/depth/metallic/normal/roughness 五通道，Wan 2.1 蒸馏到 4 步并
    chunk 级自回归流式，历史三级压缩、首帧 latent 常驻当外观锚
  tags:
  - G-buffer条件
  - 4步蒸馏
  training: 需训
