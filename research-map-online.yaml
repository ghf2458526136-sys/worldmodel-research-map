  explain: 想象你给一个摄像师施工图：红球要绕蓝柱一圈，最后停在门左侧；画面拍得再漂亮，若球穿墙或位置错了，也算失败。PROWBench要解决的正是这个麻烦：视频模型常能生成逼真的运动，却未必听懂程序对布局、轨迹和物体关系的精确指令。它把代码、深度图和语义图等程序化条件——也就是用结构化信息描述场景与动作——交给模型，再逐项检查生成视频是否按规定呈现。这样做管用，是因为它不只问画面像不像，而是把可验证的空间、时间和关系约束拿来对照，能区分“看起来真实”和“真正照程序执行”。论文目前没有给出具体数值，重点是建立这套评测标准。
  detail:
    position: 这篇工作解决视频模型是否忠实执行程序化世界规则并渲染对应事件的问题，而不只是生成逼真的画面。它重点评估模型对布局、轨迹、物体关系、时间线和交互后果的视觉实现是否符合程序记录。
    io: 输入包括程序化构造的场景、实体行为、交互规则、时间戳事件、摄像机视角，以及代码、深度或语义图等条件信号。输出包括生成视频与程序执行记录之间的对齐评估，主要由
      Logic-Render Alignment 和 Interaction Success Rate 等指标表示。
    steps:
    - 通过可执行程序构造场景、实体状态、行为控制和时间戳事件，以获得明确且可回放的世界记录。
    - 记录包括摄像机视野外事件在内的完整实体状态与事件轨迹，以避免仅依据单一画面判断程序是否被执行。
    - 从同一份世界记录渲染同步的多视角视频和 proxy representations，例如 coarse 3D 与 bounding boxes，作为可控的评测对象。
    - 将视频模型在程序化条件下生成的结果与记录中的布局、轨迹、物体关系及事件后果进行对照，以评估实体控制和 long-horizon memory。
