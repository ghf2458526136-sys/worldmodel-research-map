  one_liner: 消失-重现范式专考遮挡期间的变化
  mechanism: 目标先经历物理过程、离开视野、再回来时必须呈更新后的状态；360段有真值片段，四个诊断支柱，自动指标加VQA，专抓"遮挡期静止场景"测不出的记忆。
  tags:
