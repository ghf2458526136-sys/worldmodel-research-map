  explain: 让刚出厂的机器人直接上街采集极端险情数据，就像让新手直接开上高速撞车试错，成本和代价都太高。Cosmos针对物理人工智能（即控制机器人在真实世界行动的算法），解决极端训练数据极度匮乏的麻烦。它做了一套世界基础模型——也就是能预测物理环境下一秒怎么变的通用模拟器，专注于高质量仿真与训练数据生成，而非实时交互。这招管用在于，它能在虚拟空间批量制造符合现实物理规律的训练场景，让算法不用撞坏实体硬件，就能低成本提前刷满应对危险的经验。
  detail:
    position: Cosmos 面向物理 AI，定位为世界基础模型。其重点是训练数据与仿真，而非流式交互生成。
    io: 输入、输出及条件信号的具体形式摘要未给。已知其面向物理 AI 的训练数据与仿真用途。
    steps:
