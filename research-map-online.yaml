  note: 2026-10-20 首次提交；引擎+编程 agent+渲染器三段式，属于 code world model 那条符号状态路线的最新工业实现。
  explain: 就像拍电影时由替身演员走位、后期画师套上逼真皮囊一样，过去让生成模型同时硬算物理规则和画图，画面容易穿模且极卡。这篇论文的做法是引擎管状态和规则，视频模型只管画。它用编程助手把玩家想法转成代码，轻量引擎负责硬碰硬的物理规则并生成低模代理帧——即粗糙的简易骨架图；视频模型再以四帧一块去噪，把骨架翻译成写实画面。这招管用在于卸下了算物理的负担，让模型专注于画面，在单卡5090上做到了480p、60帧的实时交互。
  key: true
  detail:
    position: 这篇工作面向从可控视频生成走向真正可玩的游戏世界，解决视觉生成缺少持久世界状态和可执行游戏规则的问题。它将游戏执行与画面生成分离，让引擎负责状态和规则，视频模型负责视觉呈现。
    io: 输入包括玩家的自然语言创作或修改意图，以及游戏引擎渲染的低模代理画面；多模态 coding agent 将意图转为游戏代码和动态场景描述。输出是由引擎规则驱动、视觉细节由视频模型生成的可交互游戏画面，生成时还以动态
      captions 和 memory references 作为条件信号。
    steps:
    - 轻量游戏引擎根据游戏代码维护世界状态并执行交互规则，以保证玩法变化由可执行机制控制。
    - 多模态 coding agent 将玩家的自然语言想法转成游戏代码和动态场景描述，以支持场景与玩法的创建和修改。
    - 引擎把当前状态渲染为低模代理画面，并提供动态 captions 和 memory references，以向视觉生成持续传递场景信息。
    - 自回归视频模型将低模代理画面转换为细节更丰富的视觉画面，并按四帧一块、每块一到两步去噪生成，以支持低延迟连续交互。
    formulas: []
    train: 训练时使用对齐的低模与高保真视频对训练 renderer，并将其蒸馏为因果生成器。推理时按四帧一块生成，每块采用一到两步去噪，并结合针对性的推理优化；摘要报告在单张
      NVIDIA RTX5090 上达到 480p、60 FPS 和 112ms 按键到显示延迟，单步生成的稳定吞吐为 83 FPS，峰值显存为 18.2GiB。
    diff: 与直接生成可控视频的做法不同，Matrix-Game 4.0 将持久状态和规则执行交给轻量游戏引擎，将视觉细化交给视频模型。低模代理画面、动态场景描述和记忆参考共同为视觉生成提供持续条件。
    limits: 已报告的推理成本包括单张 RTX5090 上 18.2GiB 峰值显存和 112ms 按键到显示延迟；摘要未明确说明其他局限。
    has_abstract: true
- id: codewm-brain
  title: 'Code World Model: Coding Agent as World Brain'
  arxiv: '2608.25927'
  date: '2026-08-26'
  lane: 代码世界模型
  branch: 代码定状态
  one_liner: coding agent 维护世界状态，视频模型只画
  mechanism: agent 写可执行代码维护实体位置与规则，compiler 把状态烘成 336×192 深度加语义 ID 代理视频，微调过的 MiniMax-H3
    按代理出 1344×768 画面
  tags:
  - 深度语义代理
  - 代码管状态
  training: 需训
  status: 精读
  key_numbers:
  - proxy 336×192
  - 目标 1344×768/24fps
  - 124 帧窗 34 重叠
  - 8×H800 3534 步
  - LoRA 596M
  links:
  - https://arxiv.org/abs/2608.25927
  - https://github.com/buaacyw/code-world-model
  note: 组会主线论文；proxy 是深度+语义 ID，不是 Blender 白模
  venue: ''
  self_measured: []
  media:
  - https://huggingface.co/datasets/NTU-yiwen/code-world-model-project-page-videos/resolve/main/project_page_final/teaser/code_world_model_full_demo.mp4
  - https://huggingface.co/datasets/NTU-yiwen/code-world-model-project-page-videos/resolve/main/project_page_final/control_world/undersea-airplane.mp4
  parent: null
  link_strength: ''
  precision: day
  explain: 想象一个游戏场景：小球撞墙后反弹，树木不会因镜头切换就换位置。普通视频模型常把世界当连续画面，难以长期记住物体、规则和因果。Code World
    Model 让编码智能体充当世界大脑：它用可执行代码维护实体位置、状态与运动规则；编译器再把这些状态渲染成336×192的代理视频，其中附带深度和语义ID，表示物体远近及身份。微调后的MiniMax-H3视频模型像画师，根据代理视频生成1344×768、24帧每秒的真实画面。训练采用124帧窗口、34帧重叠，在8张H800上跑3534步，LoRA只更新5.96亿参数。这样，逻辑由代码精确记忆，外观由模型自由生成，既减少时空漂移，也能保持可控的世界演化。
  detail:
    position: 这篇工作试图解决主要从视觉结果学习环境变化的视频 world models 难以掌握底层规则、维持持久状态并支持连贯开放演化的问题。它将世界演化交给
      coding agent，将视觉呈现交给 video model。
    io: 输入包括当前世界状态与事件，coding agent 据此生成可执行代码来更新实体状态并应用规则。输出是由 proxy video 条件化生成的高保真视频画面，proxy
      video 编码逐帧的时空约束。
    steps:
    - coding agent 根据事件和已有状态推理后果并生成可执行代码，以便按规则持续更新世界状态。
    - 将更新后的实体状态编译为 336×192 的深度与语义 ID 代理视频，以显式表达逐帧时空约束。
    - 将代理视频作为条件输入微调过的 MiniMax-H3，使其把结构化约束转化为视觉观测。
    - 通过 gameplay 与真实世界视频的数据管线构造对齐的 proxy-observation pairs，为代理条件下的视觉生成提供训练数据。
    formulas:
    - tex: S_{t+1}=F_{c_t}(S_t,e_t)
      caption: 标准写法，非原文；表示 coding agent 根据当前世界状态 S_t 和事件 e_t 生成代码 c_t，并据此更新实体状态。
    - tex: \hat{I}_{t+1}\sim p_{\theta}(I\mid P_{t+1})
      caption: 标准写法，非原文；表示视频模型以编译得到的代理视频 P_{t+1} 为条件生成视觉观测 \hat{I}_{t+1}。
    train: 训练阶段构造对齐的 proxy-observation pairs，并在 paired gameplay data 上微调 MiniMax-H3。推理阶段由
      coding agent 更新世界状态，编译器生成代理视频，再由 MiniMax-H3 按代理生成 1344×768 画面。摘要未给出其他训练细节。
    diff: 不同于主要从视觉观测中学习环境动力学的做法，该框架用可执行代码显式维护持久世界状态并处理规则一致的演化。video model 不负责决定世界如何变化，而是根据
      proxy video 进行视觉实现。
    limits: 未见明确说明
    has_abstract: true
- id: videococo
  title: 'VideoCoCo: Code-as-CoT for Physically-Consistent Video Generation'
  arxiv: '2607.27380'
  date: '2026-07-29'
  lane: 代码世界模型
  branch: 代码定状态
  one_liner: 代码当过程级思维链，仿真出 draft 再渲染
  mechanism: coding agent 写 Blender 程序，仿真引擎执行出确定性时空 draft，视频编辑模型按 draft 做高保真重绘
  tags:
  - Blender程序
  - 仿真draft
  training: 需训
  status: 速读
  key_numbers:
  - VideoCoCo-3K
  - PhyGenBench 0.475→0.558
  - VBench-2.0 52.18→77.88
  links:
  - https://arxiv.org/abs/2607.27380
  note: 白模路线代表；训练硬件论文未给
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象一个球从桌边滚落：普通视频生成可能让它突然变轻、穿过桌面，或落地后弹向奇怪的方向。VideoCoCo要解决的，正是画面好看却不懂物理、前后动作对不上的麻烦。它让编程智能体先写出三维场景程序，再由仿真引擎运行，得到物体运动确定的草稿视频；随后，视频编辑模型照着草稿重绘，让画面更真实。代码在这里充当过程级思维链，也就是把生成步骤明确写出来，而不是只靠模型猜测下一帧。仿真先管住运动规律，重绘再补足视觉细节，因此兼顾物理一致性与画面质量。论文还构建了
    VideoCoCo-3K 数据集；在 PhyGenBench 上得分从 0.475 升至 0.558，在 VBench-2.0 上从 52.18 升至 77.88。
  detail:
    position: 该方法针对 text-to-video 模型难以从压缩文本提示中推断物理一致的时序演化这一问题。它将场景过程显式写成可执行的 Blender
      代码，再由视频生成模型将仿真结果转化为高保真视频。
    io: 输入是文本提示，输出是经视频编辑模型重绘的生成视频。中间条件信号包括 coding agent 生成的 Blender 程序及其执行得到的时空 draft，编辑阶段还使用指令。
    steps:
    - 根据文本提示由 coding agent 编写 Blender 程序，显式描述场景与时间演化，以将隐式推理转化为可执行过程。
    - 在仿真引擎中执行程序，生成确定性的时空 draft，以提供完整且可控的动态过程。
    - 将 draft 与指令输入视频编辑模型进行 draft-conditioned editing，以在保留过程结构的基础上生成高保真视频。
    - 构建 VideoCoCo-3K 的 draft、指令与目标视频三元组，以适配视频编辑模型处理模拟 draft。
    formulas: []
