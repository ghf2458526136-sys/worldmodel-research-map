- id: infinite-rope
  title: 'Infinity-RoPE: Action-Controllable Infinite Video Generation Emerges From
    Autoregressive Self-Rollout'
  date: '2025-11-25'
  lane: 位置时间寻址
  branch: 重排位置
  training: 免训
  status: 速读
  one_liner: 时间轴改成移动局部系，破RoPE长度上限
  mechanism: 新块按基模型最大帧距相对旋转、旧块反向旋转，消掉固定时间位置；KV Flush只留sink与末帧。
  tags:
  - 相对位置
  - 无限rollout
  - 转场控制
  key_numbers:
  - 摘要未给具体数值，仅称 VBench 总分稳定超过先前 AR 模型
  - 三个组件全为推理期改动，无额外训练
  media: []
  links:
  - https://arxiv.org/abs/2511.20649
  note: 纯位置编号手术（相对化+反向旋转+断点），不引入任何检索或学习模块，是「重排位置」分支最标准的样本；与 MemRoPE 的区别是 MemRoPE 靠演化记忆
    token 携带远期信息，这里靠坐标系本身移动。
  arxiv: '2511.20649'
  explain: 想象一台摄影机边走边拍：每生成一小段视频，就接着上一段继续拍，还要听从“向左转”或“挥手”等动作指令。普通自回归模型逐帧续写时，旋转位置编码（RoPE，用角度表示帧与帧的相对位置）会随时间越积越长，超过训练时的长度上限，画面便容易抖动、遗忘或失控。Infinity-RoPE把时间轴改成移动的局部坐标：新视频块按基模型能处理的最大帧距做相对旋转，旧块则反向旋转，把不断增长的绝对时间抵消掉。它还使用KV
    Flush，即清理注意力缓存，只保留开头的“锚点帧”和最新一帧，既保留全局参照，又避免记忆无限膨胀。三项改动都发生在推理阶段，无需额外训练，却能稳定生成无限长、可控动作的视频，VBench总分超过以往自回归模型。
  detail:
    position: 论文针对自回归视频扩散模型的固定时间位置编码限制、长程生成中动作提示响应迟缓，以及单次生成流难以实现不连续镜头切换的问题。提出无需训练的推理框架，以支持超出基模型时间位置上限的连续生成、细粒度动作控制和多镜头切换。
    io: 输入是自回归视频扩散模型、文本提示及生成过程中提供的动作或场景切换控制信号，生成时还使用已有 latent 与 KV cache。输出是可持续延长的视频生成流，并可响应新的控制提示及执行镜头切换；具体输入格式摘要未给。
    steps:
    - 将新生成的 latent 块相对于基模型最大帧距进行 RoPE 旋转，并将已有块反向旋转以保持相对时间几何，从而摆脱固定时间位置上限。
    - 基于更新后的时间编码进行自回归生成，逐块扩展视频，使生成能够延伸至基模型原有时间位置范围之外。
    - 需要提高新提示的响应速度时执行 KV Flush，仅保留 global sink 与最后生成的 latent 帧，以减少历史缓存对当前控制的影响。
    - 需要场景跳转时使用 RoPE Cut，在时间 RoPE 坐标中引入受控不连续性，以便在同一生成流中实现镜头切换。
    formulas:
    - tex: \tilde{z}_i=\begin{cases}R(\Delta_{\max})z_i,&z_i\text{ belongs to the
        new block},\\R(-\Delta_{\max})z_i,&z_i\text{ belongs to an existing block},\end{cases}
      caption: Infinity-RoPE 的位置重编码：新块按基模型最大帧距旋转，已有块反向旋转。
    - tex: \mathcal{K}_{\mathrm{flush}}=\mathcal{K}_{\mathrm{sink}}\cup\mathcal{K}_{\mathrm{last}}
      caption: KV Flush：清除历史缓存，仅保留 global sink 与最后生成的 latent 帧。
    train: 这是 training-free 的 inference-time 框架，不需要额外训练。推理时组合使用 Block-Relativistic
      RoPE、KV Flush 与 RoPE Cut；其余模型配置和具体推理参数摘要未给。
    diff: 不同于受基模型固定 3D-RoPE 时间位置范围约束的生成方式，Block-Relativistic RoPE 通过移动局部参考系调整新旧块的相对时间编码。框架还通过
      KV Flush 提升提示响应，并通过 RoPE Cut 支持单次生成流中的不连续场景切换。
    limits: 未见明确说明
    has_abstract: true
- id: deep-forcing
  title: 'Deep Forcing: Training-Free Long Video Generation with Deep Sink and Participative
    Compression'
  date: '2025-12-04'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 免训
  status: 速读
  one_liner: 窗口一半给sink，并把sink相位对齐当下
  mechanism: 滑窗一半配额留给持久sink token并把其时间RoPE相位重对齐当下；另一半按近期注意力重要性剪KV。
  tags:
  - 深sink
  - RoPE相位对齐
  - 免训KV管理
  key_numbers:
  - 12x 外推（5s 训练 → 60s+ 生成）
  - 保持实时生成速度
  - 动态度显著优于 RollingForcing
  media: []
  links:
  - https://arxiv.org/abs/2512.05081
  note: 明确说「照搬 StreamingLLM 式 sink 会导致保真度下降与运动停滞」，正是锚 sink 分支的自我修正节点；同时做 sink 数量（Deep）与
    sink 相位（RoPE 重对齐）两件事，所以和 anchor-forcing 有重叠但更早、更纯粹地讲 sink 配额。
  arxiv: '2512.05081'
  explain: 想象摄像机沿着小路持续拍摄：模型只学过5秒，却要稳定生成60秒以上；若不断滚动新画面，旧信息被挤出，人物身份、镜头运动和场景布局就会漂移，这正是长视频生成的麻烦。Deep
    Forcing把窗口一分为二：一半名额长期保留持久性“汇聚 token”，它们像记忆锚点，负责吸收注意力、维持生成稳定；同时把这些 token 的时间旋转位置编码（用时间相位表示位置）重新对齐到当前时刻，避免记忆因时间错位失效。另一半名额则根据近期注意力的重要性剪掉不关键的键值缓存，也就是模型保存的历史信息。这样既保住全局连续性，又把计算集中在眼前最有用的内容上，不增加训练，仍保持实时速度，实现约12倍外推，动态稳定性明显优于RollingForcing。
  detail:
    position: 该方法针对自回归视频扩散在长时生成中出现的时间重复、漂移和运动减速，以及直接使用 attention sink 导致的画质下降与运动停滞。它通过免训练的
      KV cache 管理，稳定长程上下文并减少历史误差累积。
    io: 输入为自回归视频扩散过程中的当前生成状态与滑动窗口内的 KV cache，输出为持续生成的视频帧及更新后的 cache。条件信号包括视频生成过程原有的条件；摘要未说明其具体形式。
    steps:
    - 将滑动窗口的一半配额分配给持久 sink token，为长时生成保留稳定的全局上下文。
    - 把 sink token 的 temporal RoPE 相位重对齐到当前时间线，避免其位置编码与持续推进的生成时间脱节。
    - 对窗口另一半中的历史 KV 按近期注意力参与重要性进行筛选，保留仍参与近期注意力的 token。
    - 丢弃冗余或已退化的历史 KV，减少误差累积，并继续自回归生成后续视频帧。
    formulas:
    - tex: K_{s}^{\mathrm{aligned}}=R(\tau_{\mathrm{now}})R(\tau_s)^{-1}K_s
      caption: 将持久 sink token 的时间 RoPE 相位重对齐到当前时间；标准写法，非原文
    - tex: I_i=\sum_{q\in\mathcal{Q}_{\mathrm{recent}}}\sum_h A_{q,i}^{(h)},\qquad
        \mathcal{K}_{\mathrm{keep}}=\operatorname{TopK}_{i\in\mathcal{K}_{\mathrm{hist}}}(I_i)
      caption: 按近期注意力参与度给历史 KV 打分并筛选保留项；标准写法，非原文
    train: 无需 fine-tuning，属于 training-free 方法；推理时在自回归视频生成过程中实施 Deep Sink 与 Participative
      Compression 管理 KV cache，并保持实时生成。其他训练流程和关键设置摘要未给。
    diff: 不同于直接套用 StreamingLLM-style attention sinks，Deep Sink 将半个滑窗配额留给持久 sink，并将其
      temporal RoPE 相位重对齐到当前时间线。Participative Compression 则按近期注意力参与情况剪除 KV，而非仅依赖固定窗口截断；全程无需微调。
    limits: 摘要未见明确说明计算与显存代价、适用模型范围及失败情形。
    has_abstract: true
- id: rolling-sink
  title: 'Rolling Sink: Bridging Limited-Horizon Training and Open-Ended Testing in
    Autoregressive Video Diffusion'
  date: '2026-02-08'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 免训
  status: 速读
  one_liner: 把推理期缓存拉回训练内的稳定行为
  mechanism: 固定预算内恢复低漂移内容、滑动时间索引与演化语义，加一段近期上下文；以cache-behavior mismatch立论。
  tags:
  - 缓存域偏移
  - 滑动时间索引
  - 推理期策略
  key_numbers:
  - 吞吐变化约 0.56%
  - 1/5 分钟 rollout 上 VBench-Long 平均排名最佳
  - 30 分钟 rollout = 360x 训练时长
  - 显存恒定
  media: []
  links:
  - https://arxiv.org/abs/2602.07775
  - https://rolling-sink.github.io/
  note: 作者自承 sink 与 temporal re-indexing 都是已有机制，其贡献是「不匹配」这一诊断 + 联合有界缓存策略 + Rolling
    Semantics 调度。属于位置时间寻址的原因是把时间索引当可调度对象（滑动而非单调增长）。
  arxiv: '2602.07775'
  explain: 想象一台摄像机边走边拍：它每次只看眼前几秒，却要连续拍上半小时。训练时，模型只学短片段；测试时却要不断把自己生成的内容塞回缓存，越滚越久，画面容易漂移、人物和场景逐渐失真。这篇论文把问题归因于缓存行为不匹配，即训练时见到的缓存状态与推理时真实经历的状态不同。它在固定显存预算内，恢复漂移较小的内容，滑动时间索引，让语义随视频演化，再补入一段近期上下文，使训练主动模拟长时间推理。这样模型学会如何处理不断变旧、变化的缓存，因而更稳定。实验中吞吐仅变化约0.56%；在1分钟和5分钟
    rollout（连续生成过程）上，VBench-Long平均排名最佳；即使测试长度达到训练时长的360倍，也能生成30分钟视频，显存保持恒定。
  detail:
    position: 论文针对 Self Forcing 系列自回归视频扩散模型在超出训练片段长度后质量退化的问题，将其归因于训练与开放式推理时缓存行为不匹配。Rolling
      Sink 在推理时调整缓存策略，使缓存行为更接近训练范围内的稳定状态。
    io: 输入是自回归视频扩散模型及其逐块生成过程，后续块依赖先前生成块形成的缓存；输出是可持续滚动生成的视频块。模型原有条件信号未在摘要中具体说明，已知的上下文信号是此前生成的视频块。
    steps:
    - 在模型固定缓存预算内设计联合缓存策略，以缓解训练内缓存与开放式推理缓存之间的行为偏移。
    - 保留低漂移内容并滑动时间索引，使缓存尽量维持训练范围内稳定的内容与时间行为。
    - 采用 Rolling Semantics schedule 处理随生成推进而变化的语义，避免缓存内容僵化。
    - 在缓存中保留少量近期上下文，使新生成的视频块仍能利用最近的运动与内容信息。
    formulas:
    - tex: \mathcal{C}_t=\operatorname{TopK}_{i\in\mathcal{C}_{t-1}\cup\mathcal{B}_t}\!\left(-\delta_i^{(t)}\right)\;\cup\;\mathcal{B}_t^{\mathrm{recent}},\qquad
        \delta_i^{(t)}=\left\|\mathbf{h}_i^{(t)}-\mathbf{h}_i^{(t-1)}\right\|_2,\qquad
        |\mathcal{C}_t|\le M
      caption: 在固定缓存预算内选择低漂移内容并保留一段近期上下文；标准写法，非原文
    - tex: \operatorname{Attn}_t=\operatorname{softmax}\!\left(\frac{\mathbf{Q}_t[\mathbf{K}_{\mathcal{C}_t}]^{\top}}{\sqrt
        d}+\mathbf{B}(\tilde{\tau}_{\mathcal{C}_t})\right)\mathbf{V}_{\mathcal{C}_t},\qquad
        \tilde{\tau}_i=\tau_i-\Delta_t
      caption: 对滚动缓存执行注意力，并通过滑动时间索引与随生成推进的语义位置保持缓存行为稳定；标准写法，非原文
    train: Rolling Sink 是 training-free 的推理期缓存策略，不改变模型训练流程。实验使用在 5 秒视频上训练的 Self Forcing
      和 Causal Forcing 基础模型；在相同推理设置下评估 1 分钟和 5 分钟生成，并展示 30 分钟定性生成。其余具体缓存参数与设置摘要未给。
    diff: 论文的核心不是提出 attention sink 或 temporal re-indexing 这些已有机制，而是以 cache-behavior
      mismatch 解释长时生成退化，并将相关机制与 Rolling Semantics schedule 组合成固定预算内的联合缓存策略。
    limits: 摘要报告吞吐量变化约为 0.56%，GPU 内存保持恒定。验证覆盖 1 分钟和 5 分钟评测，并展示 30 分钟定性结果；作者明确不声称任意时长都能保证质量。
    has_abstract: true
- id: lol
  title: 'LoL: Longer than Longer, Scaling Video Generation to Hour'
  date: '2026-01-23'
  lane: 位置时间寻址
  branch: 重排位置
  training: 免训
  status: 速读
  one_liner: 多头RoPE抖动打散sink崩塌
  mechanism: 诊断sink-collapse源于RoPE周期与多头同质化，推理期给各头加不同RoPE抖动，打散头间同质化。
  tags:
  - RoPE抖动
  - sink崩塌
  - 免训
  key_numbers:
  - 连续生成 12 小时视频
  - 推理期改动，无训练
  media: []
  links:
  - https://arxiv.org/abs/2601.16914
  note: 少见地把失败机理归到「RoPE 周期性 × 多头」而不是容量，属于位置编码本身的手术；和 worldtrace 的区别是它不改锚点集合，只改各头的频率相位。
  arxiv: '2601.16914'
  explain: 想象摄像机不停拍一条街：几分钟后画面糊成一团，人物和镜头不断重复，继续生成只会更坏。LoL解决的正是视频世界模型长时间生成时的 sink-collapse：注意力逐渐挤到少数位置，画面失去变化和连贯性。作者发现，旋转位置编码（RoPE，把位置信息写进注意力计算）有周期性，多头注意力里的各个头又越来越相似，长序列下便容易同步塌缩。于是他们不改训练，只在推理时给不同注意力头加入不同强度的RoPE抖动，让各头的周期和关注位置错开。头间不再同步，注意力就不易挤向同一个汇点，模型能持续利用更丰富的历史信息，减少重复和崩坏，连续生成最长可达12小时视频。
  detail:
    position: 这篇论文解决自回归长视频生成中的长期一致性下降与 sink-collapse 问题，即生成内容反复回到 sink frame，造成场景突变和循环运动。核心目标是在保持生成质量的同时，实现实时、流式和近似无限长度的视频生成。
    io: 输入是自回归视频生成过程中的历史视频上下文、sink frames 与 RoPE 位置编码。输出是持续生成的视频帧序列，并通过多头 RoPE jitter
      缓解长时间生成中的内容回退与周期性崩塌。
    steps:
    - 在长视频自回归生成中引入 sink frames 以维持注意力稳定性，但识别其可能导致内容反复回到 sink frame 的 sink-collapse。
    - 分析 RoPE 的周期结构与 multi-head attention 的头间同质化之间的冲突，将其作为 sink-collapse 的主要来源。
    - 在推理阶段为不同 attention head 注入不同的 RoPE jitter，打散各头对位置关系的同步响应。
    - 利用被打散的头间注意力模式继续进行流式自回归生成，从而抑制场景重置与循环运动并减缓长期质量衰减。
    - 在无需额外训练的条件下评估实时、流式和长时长生成能力，包括最长达 12 小时的连续视频生成。
    formulas:
    - tex: \widetilde{p}_{t,h}=p_t+\delta_{t,h},\qquad \operatorname{Attn}_h(Q,K,V)=\operatorname{softmax}\!\left(\frac{\operatorname{RoPE}(Q_h,\widetilde{p}_{q,h})\operatorname{RoPE}(K_h,\widetilde{p}_{k,h})^{\top}}{\sqrt{d_h}}\right)V_h
      caption: 标准写法，非原文：为不同注意力头注入独立的 RoPE 位置抖动，并据此计算注意力聚合，以打散头间同步的位置响应。
    train: 该方法是 training-free 方法，在推理阶段对不同 attention head 施加多头 RoPE jitter，不需要额外训练。摘要未给出
      jitter 的具体形式、幅度、调度方式、模型配置或完整推理设置。
    diff: 相较于依赖 attention sink frames 缓解性能衰减的已有方法，该方法进一步针对 sink frames 引发的 sink-collapse
      进行处理。相较于改变模型训练的方案，它通过推理期的 multi-head RoPE jitter 打散头间同质化，并支持实时、流式和长时长生成。
    limits: 摘要未报告额外计算开销、jitter 超参数敏感性、适用模型范围或失败案例。方法主要缓解 sink-collapse，长期生成中的全部质量衰减是否都能消除仍未明确说明。
    has_abstract: true
- id: flex
  title: 'Train Short, Inference Long: Training-free Horizon Extension for Autoregressive
    Video Generation'
  date: '2026-02-15'
  lane: 位置时间寻址
  branch: 重排位置
  training: 免训
  status: 速读
  one_liner: 频域调制RoPE，短训长推
  mechanism: 对欠训低频分量插值、高频外推以保多尺度判别性；配反相噪声采样与仅推理期sink锚定全局结构。
  tags:
  - 频域重参数
  - RoPE插值外推
  - 即插即用
  key_numbers:
  - 6x 外推（30s）超过 SOTA
  - 12x（60s）追平长视频微调基线
  - 把 LongLive 推到 4 分钟
  media: []
  links:
  - https://arxiv.org/abs/2602.14027
  - https://ga-lee.github.io/FLEX_demo
  note: 把「位置外推失败」归因为 3D 位置嵌入的谱偏置，直接改 RoPE 各频段行为，是重排位置分支里唯一走频域解释的；与 infinite-rope 的差异是它不移动参考系，只重加权频段。
  arxiv: '2602.14027'
  explain: 想象一台只练过拍摄 5 秒短片的摄像机，却要连续拍完 1 分钟：画面可能越拍越糊，人物和场景也会漂移。这篇论文解决的正是自回归视频模型“短训长推”的失稳麻烦：不重新微调模型，而是在推理时改造
    RoPE——一种把位置信息注入注意力、让模型知道帧序的编码。作者按频率拆解位置变化，对训练不足的低频部分做插值，让长期结构延续；对高频部分做外推，保留动作和纹理的多尺度辨别力。再配合反相噪声采样，减少逐帧误差累积，并用只在推理期加入的
    sink 锚定全局结构，防止场景越生成越偏。结果是，短训练模型可外推 6 倍生成 30 秒视频，超过现有最佳方法；外推 12 倍生成 60 秒，追平专门训练的长视频基线，还把
    LongLive 推到 4 分钟。
  detail:
    position: 这篇论文针对自回归视频扩散模型在生成长度超过训练视野时误差累积、时间质量显著退化的问题。它提出无需训练的推理期框架 FLEX，以改善长时视频的时间稳定性和动态表现。
    io: 输入是现有自回归视频扩散模型的常规推理输入与条件信号，具体条件形式摘要未给。输出是超出模型训练视野的长视频。
    steps:
    - 在推理时对 3D positional embeddings 中的 RoPE 频率进行 Frequency-aware RoPE Modulation，对欠训练的低频分量插值、对高频分量外推，以适应更长时间范围并保留多尺度时间判别性。
    - 在噪声采样中加入 Antiphase Noise Sampling，注入高频动态先验，以缓解缺少动态先验导致的长视频运动退化。
    - 加入仅推理期的 Inference-only Attention Sink，为生成过程提供全局结构锚点，以帮助长时生成维持整体一致性。
    - 将上述改动作为 plug-and-play 组件接入现有推理流程，生成超出训练时长的视频，无需对模型进行训练或微调。
    formulas:
    - tex: \theta_{t,j}^{\mathrm{FLEX}}=\begin{cases}\theta_{t,j}^{\mathrm{train}}/s_j,&j\in\mathcal{L},\\
        s_j\theta_{t,j}^{\mathrm{train}},&j\in\mathcal{H},\end{cases}
      caption: 频率感知 RoPE 调制：对低频分量插值、对高频分量外推；标准写法，非原文
    - tex: \widetilde{\epsilon}_t=\epsilon_t+\lambda\bigl(\epsilon_t-\epsilon_{t-1}\bigr)
      caption: 反相噪声采样的差分高频动态先验；标准写法，非原文
    train: FLEX 是 training-free 的推理期方法，不需要额外训练。推理时调制 RoPE 频率，并结合 Antiphase Noise Sampling
      与 Inference-only Attention Sink；摘要未给具体参数设置和实现细节。
    diff: 不同于通过长视频微调扩展生成视野，FLEX 在推理阶段直接调整位置频率处理、噪声采样和注意力锚定。其核心是按频率区别处理 RoPE 分量，并与动态先验和全局结构约束配合。
    limits: 未见明确说明
    has_abstract: true
- id: anchor-forcing
  title: 'Anchor Forcing: Anchor Memory and Tri-Region RoPE for Interactive Streaming
    Video Diffusion'
  date: '2026-03-12'
  lane: 位置时间寻址
  branch: 重排位置
  training: 需训
  status: 速读
  one_liner: 三区RoPE加锚缓存，治换prompt掉画质
  mechanism: KV存进anchor cache，换prompt时热启动re-cache；三区RoPE各给参考原点，再蒸馏回预训练有界区间。
  tags:
  - 锚缓存
  - 三区RoPE
  - 换prompt交互
  key_numbers:
  - 摘要未给具体数值，仅称感知质量与运动指标优于流式基线
  - 需要 RoPE 重对齐蒸馏
  media: []
  links:
  - https://arxiv.org/abs/2603.13405
  - https://github.com/vivoCameraResearch/Anchor-Forcing
  note: 同时踩「锚」与「重排位置」两条，但主矛盾是无界时间索引 vs 预训练有界 RoPE → 判重排位置；与 grounded-forcing 的双参考
    RoPE 注入是同期同族，区别是它把分区与 prompt 切换绑定。
  arxiv: '2603.13405'
  explain: 想象你正看着一段直播生成的视频：女孩原本在海边奔跑，你把提示词改成雨夜街头，场景虽立刻变化，画面却突然变糊，动作也抖起来。麻烦在于，流式视频扩散模型只保留短暂上下文，换提示词后旧画面的视觉记忆难以接上。Anchor
    Forcing把历史注意力中的键值信息存进锚缓存，改词时用它热启动并重新缓存，让新内容接着旧记忆生成。它再用三区旋转位置编码（RoPE，一种让模型感知时空顺序的坐标方式），给参考、当前生成和过渡区域分别设原点；通过蒸馏把新位置关系压回预训练模型熟悉的范围。这样既减少位置错乱，又保持运动连贯，感知质量和运动指标都优于流式基线。
  detail:
    position: 这篇工作研究交互式长视频生成中切换 prompt 后画质下降，以及长时间生成时运动逐渐减弱的问题。它提出 Anchor Forcing，通过改进缓存维护和
      RoPE 位置编码来保留语义线索、近期视觉线索与运动先验。
    io: 输入是用于流式视频扩散生成的 prompt，以及按时间推进的视频生成状态；交互过程中可以切换 prompt。输出是响应 prompt 切换并持续生成的长视频，条件信号包括当前
      prompt、anchor cache 中的 KV 状态和近期 latent 线索。
    steps:
    - 生成过程中将 KV states 存入 anchor caches，以保留可供后续生成使用的语义上下文。
    - 发生 prompt 切换时，从 anchor caches 热启动 re-cache，减少切换边界处语义上下文与近期 latent 线索的丢失。
    - 对流式时间位置采用 tri-region RoPE，并为不同区域设置参考原点，以协调持续增长的时间索引与预训练模型的有界 RoPE 区间。
    - 通过 RoPE re-alignment distillation 对齐位置编码分布，以更好保留预训练运动先验和长程运动表现。
    - 继续进行流式视频生成，并在交互设置下评估感知质量与运动指标。
    formulas:
    - tex: \mathbf{H}_t=\operatorname{softmax}\!\left(\frac{\mathbf{Q}_t[\mathbf{K}_t;\mathbf{K}_{A}]^{\top}}{\sqrt{d}}\right)[\mathbf{V}_t;\mathbf{V}_{A}],\qquad
        (\mathbf{K}_{A},\mathbf{V}_{A})\leftarrow\operatorname{ReCache}(\mathbf{K}_{A},\mathbf{V}_{A};\,\text{prompt
        switch})
      caption: 利用 anchor cache 参与注意力聚合，并在 prompt 切换时热启动缓存重构；标准写法，非原文
    - tex: \tilde{p}(p)=o_r+\frac{p-b_r}{s_r},\quad p\in\mathcal{R}_r,\ r\in\{1,2,3\},\qquad
        \mathcal{L}_{\mathrm{RoPE}}=\sum_{p}\left\|\operatorname{RoPE}(\mathbf{x}_p,\tilde{p}(p))-\operatorname{RoPE}(\mathbf{x}_p,\operatorname{clip}(p,0,M))\right\|_2^2
      caption: 将三类时间区域分别映射到带参考原点的有界位置区间，并通过蒸馏对齐预训练 RoPE 分布；标准写法，非原文
    train: 训练阶段使用 RoPE re-alignment distillation，使流式时间位置与预训练 backbone 的有界 RoPE 区间相协调。推理阶段在生成中维护
      anchor caches，并在 prompt 切换时以其 KV states 热启动 re-cache。蒸馏配置、缓存大小及其他关键设置摘要未给。
    diff: 已有流式方法通常在每次 prompt 切换时重新维护 rolling KV cache，难以同时保留语义上下文与近期 latent 线索；Anchor
      Forcing 改用 anchor-guided re-cache。它还以 tri-region RoPE 和 RoPE re-alignment distillation
      应对无界时间索引造成的位置分布偏移。
    limits: 摘要未见明确说明具体计算与存储开销、适用范围或失败情形。
    has_abstract: true
- id: packforcing
  title: 'PackForcing: Short Video Training Suffices for Long Video Sampling and Long
    Context Inference'
  date: '2026-03-26'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 需训
  status: 速读
  one_liner: 三段KV缓存，丢块后补RoPE相位
  mechanism: KV分sink全分辨率、mid走3D卷积+低分辨率VAE重编码32x并top-k选、recent全分辨率；补位置缺口。
  tags:
  - 三段KV
  - 时空压缩
  - 位置缺口补齐
  key_numbers:
  - 24x 外推（5s→120s）
  - KV 仅 4GB
  - 2 分钟 832x480 @16FPS 单卡 H200
  - 时间一致性 26.07 / 动态度 56.25
  media: []
  links:
  - https://arxiv.org/abs/2603.25730
  - https://github.com/ShandaAI/PackForcing
  note: 结构上是 sink+recent 的扩容版（多了会丢块的 mid 区），所以落锚 sink；真正的位置手术是丢块后的 RoPE 相位补洞，这点和 rolling-sink
    的滑动索引互补。
  arxiv: '2603.25730'
  explain: 想象摄像机连续拍两分钟：若每帧记忆都留下，显存很快塞满；若删掉旧记忆，画面又容易忘事、跳变。PackForcing解决短视频训练难以支持长视频生成和长上下文推理的问题。它把注意力缓存（保存过往画面特征的记忆）分三段：开头帧与最近帧保留高清；中间帧经三维卷积和低分辨率变分自编码器压缩32倍，再挑重要片段留下。删帧造成的位置空缺，则补上旋转位置编码的相位，避免时间错乱。这样既保住开头与眼前细节，又用关键中段维持连贯。实验可将5秒训练外推到120秒，缓存仅4GB；单张H200能生成两分钟、832×480、每秒16帧视频，时间一致性26.07、动态度56.25。
  detail:
    position: 针对自回归视频扩散模型生成长视频时 KV-cache 随时间线性增长、内容重复和误差累积的问题，PackForcing 通过分层压缩与筛选历史上下文来控制缓存规模并维持长程一致性。
    io: 输入为自回归视频生成过程中的历史帧及当前生成上下文，输出为持续生成的视频帧。具体条件信号摘要未给。
    steps:
    - 将历史上下文划分为 sink、mid 和 recent 三类，以分别保留全局锚点、压缩中段历史和维护近期连贯性。
    - 对 sink 和 recent 保留全分辨率 token，以维持全局语义锚点与局部时间连贯性。
    - 对 mid token 使用融合 progressive 3D convolutions 与低分辨率 VAE 重编码的双分支网络压缩，以减少时空 token
      数量。
    - 对压缩后的 mid token 动态执行 top-k 选择，以在缓存规模受限时保留重要历史信息。
    - 对丢弃 token 后产生的位置间隔使用 continuous Temporal RoPE Adjustment 重新对齐，以减少位置错位对时间建模的影响。
    formulas:
    - tex: \mathcal{K}_t=\mathcal{K}_{\mathrm{sink}}\cup\operatorname{TopK}_k\!\left(\mathcal{C}_{32}(\mathcal{K}_{\mathrm{mid}});s\right)\cup\mathcal{K}_{\mathrm{recent}},\quad
        \mathcal{V}_t=\mathcal{V}_{\mathrm{sink}}\cup\operatorname{TopK}_k\!\left(\mathcal{C}_{32}(\mathcal{V}_{\mathrm{mid}});s\right)\cup\mathcal{V}_{\mathrm{recent}}
      caption: 标准写法，非原文：对 mid 历史进行 32 倍压缩并按重要性分数 s 选取 top-k，同时保留 sink 与 recent 的全分辨率
        KV。
    train: 摘要称模型可零样本运行，也可仅用 5 秒视频片段训练；未给出训练目标、优化器或其他训练设置。推理时采用三段 KV-cache 与动态 mid-token
      选择，摘要报告可在单张 H200 GPU 上生成 2 分钟、832×480、16 FPS 视频，KV-cache 为 4 GB。
    diff: 相较于不区分历史重要性或仅做统一缓存压缩的做法，PackForcing 将上下文分为 sink、mid、recent，并针对中段历史压缩与筛选，同时通过
      Temporal RoPE Adjustment 处理丢块带来的位置缺口。该设计使短视频监督也能支持长视频采样与长上下文推理。
    limits: 摘要未见明确说明方法在不同视频内容、分辨率或硬件条件下的局限，也未提供压缩质量与计算开销的详细分析。
    has_abstract: true
- id: dysink
  title: 'DySink: Dynamic Frame Sinks for Autoregressive Long Video Generation'
  date: '2026-05-20'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 免训
  status: 速读
  one_liner: sink帧不固定，按视觉相关度动态换
  mechanism: 维护紧凑记忆库按当前状态检索相关历史帧作动态sink；加门过滤头间共识过高结果防崩塌。
  tags:
  - 动态sink
  - 检索式锚点
  - sink异常门
  key_numbers:
  - 50–100 秒视频上时间质量最优（对比 AR 基线）
  - 文本对齐与单帧质量保持竞争力
  media: []
  links:
  - https://arxiv.org/abs/2605.21028
  - https://github.com/yebo0216best/DySink
  note: 混合体：选择靠内容检索，但作用点是「谁占据 sink 槽位」，即位置配额分配，故放位置时间寻址的锚 sink；若你的分类更看重检索手段，可移入内容学习寻址的外部检索库。
  arxiv: '2605.21028'
  explain: 想象摄像机边走边拍一场长达一分钟的追车戏：如果始终盯着开场那几帧，后面的画面就会越来越像，甚至陷入重复。自回归视频生成也有类似麻烦：模型逐帧生成时，历史信息不断累积，长视频容易时间漂移、细节崩塌。DySink把用于稳定后续生成的参考画面称为“sink帧”，但不再固定它们，而是维护一个紧凑记忆库，根据当前画面状态检索最相关的历史帧，动态更换sink。它还加入门过滤器，抑制不同注意力头给出过度一致的结果，避免模型被单一模式锁死。这样既保留了真正有用的上下文，又减少无关旧画面的干扰，因此在50到100秒视频上，时间连贯性优于自回归基线，同时文本对齐和单帧画质仍具竞争力。
  detail:
    position: 这篇论文针对自回归长视频生成中固定保留早期 sink 帧、却丢弃可能更相关的中间历史的问题。它提出 DySink，按当前视觉状态动态选择历史帧作为
      sink，并过滤可能导致 sink collapse 的检索结果。
    io: 输入是自回归视频生成过程中的当前视觉状态和紧凑记忆库中的历史帧，输出是用于生成的动态 frame sinks。条件信号包括当前视觉状态与历史帧的视觉相关度，以及检索结果中的头间注意力共识程度。
    steps:
    - 维护紧凑的历史帧记忆库，以便在有限缓存下保留可供后续检索的上下文。
    - 根据当前视觉状态检索视觉相关的历史帧，将其选作动态 frame sinks，以适应内容随时间发生的变化。
    - 检查检索上下文是否出现过高的头间共识，并通过 sink anomaly gate 过滤异常结果，以降低 sink collapse 风险。
    - 将筛选后的动态 sinks 与局部窗口上下文用于自回归生成，以兼顾短期连续性和长程信息。
    formulas:
    - tex: s_i=\frac{q_t^{\top}m_i}{\lVert q_t\rVert_2\lVert m_i\rVert_2},\qquad \mathcal{R}_t=\operatorname{TopK}_{i\in\mathcal{M}}(s_i)
      caption: 按当前视觉状态与记忆帧的余弦相似度检索相关历史帧；标准写法，非原文
    - tex: C(\mathcal{R}_t)=\frac{2}{H(H-1)}\sum_{h<h'}\operatorname{sim}(a_h,a_{h'}),\qquad
        g_t=\mathbb{1}[C(\mathcal{R}_t)<\tau]
      caption: 以注意力头间共识度构造异常门控，高共识时过滤检索结果以降低 sink collapse 风险；标准写法，非原文
    train: 摘要未给训练流程和具体推理设置。摘要说明推理时采用紧凑记忆库、相关帧检索和 sink anomaly gate；实验评估了 50 至 100
      秒视频。
    diff: 传统做法固定保留早期帧作为长程 sink，DySink 则依据当前视觉状态动态检索历史帧。它还加入 sink anomaly gate，过滤头间共识过高的检索上下文。
    limits: 摘要未见明确说明计算与存储代价，也未说明方法在不同任务、模型或视频长度上的适用边界。
    has_abstract: true
- id: fadem
  title: 'FadeMem: Distance-Aware Memory Consolidation for Autoregressive Video Diffusion'
  date: '2026-06-09'
  lane: 位置时间寻址
  branch: 距离分层
  training: 免训
  status: 速读
  one_liner: 近密远疏，按时间距离幂律合并KV
  mechanism: 新历史细粒度插入，旧相邻条目按幂律时间分配逐步合并，单缓存内形成近密远疏层级，不改架构。
  tags:
  - 幂律时间分配
  - KV合并
  - 有界缓存
  key_numbers:
  - 同预算下支持多分钟到小时级生成
  - 匹配 KV 预算时降低峰值显存
  media: []
  links:
  - https://arxiv.org/abs/2606.10671
  note: 新建分支「距离分层」：它反对给历史各部分分配固定角色（sink/窗口），改由时间距离决定分辨率与合并度，既非锚点集合也非 RoPE 手术，但与两者同属「用时间坐标决定可读性」。若不想新建分支，最接近锚
    sink。
  arxiv: '2606.10671'
  explain: 想象摄像机一直拍下去，桌上却只有一本固定厚度的日记：新画面不断写入，旧画面若全留着，记忆很快塞满；若随手删，又会忘掉故事。视频扩散模型生成长视频时也有这个麻烦：它要缓存过去的信息，供后续画面参考，这些缓存叫键值缓存，长度会随时间增长。FadeMem像整理日记一样，新历史细致记下，旧的相邻条目则按与当前时刻的距离，依幂律逐步合并。于是同一份缓存里，近处记录密、远处记录疏，且无需改动模型架构。它管用，是因为刚发生的动作通常更需要细节，久远内容则可用更粗略的摘要维持连贯。同等缓存预算下，它支持生成数分钟到数小时的视频，并降低峰值显存。
  detail:
    position: FadeMem 解决自回归视频生成中历史 KV cache 随视频长度增长、难以在固定缓存预算下保留长程信息的问题。它按时间距离组织并合并历史
      KV，以兼顾近处细节与远处场景结构和身份信息。
    io: 输入是自回归视频生成过程中产生的历史 KV blocks，以及新生成的历史条目；输出是在固定缓存预算内更新后的分层 KV memory，供后续生成使用。摘要未说明具体条件信号。
    steps:
    - 将新产生的历史以细粒度条目插入缓存，保留近期内容的细节，因为近处信息仍有较高时序相关性。
    - 根据条目间的时间距离安排缓存层级，使近处条目更密、远处条目更疏，因为细节与场景结构的时间衰减速度不同。
    - 按幂律时间分配逐步合并较旧的相邻条目，压缩远程历史并控制缓存规模，同时尽量保留长期有用的信息。
    formulas:
    - tex: \widetilde{K}_{a:b}=\frac{\sum_{i=a}^{b}w_iK_i}{\sum_{i=a}^{b}w_i},\qquad
        \widetilde{V}_{a:b}=\frac{\sum_{i=a}^{b}w_iV_i}{\sum_{i=a}^{b}w_i}
      caption: 标准写法，非原文：将相邻的历史 KV 条目按权重合并，以压缩远程历史并保留其平均信息
    - tex: \Delta(t)=c\,(t+\epsilon)^{\alpha},\qquad \text{merge adjacent entries
        when their temporal spacing reaches }\Delta(t)
      caption: 标准写法，非原文：用幂律增长的合并间隔构造近密远疏的缓存层级
    train: 推理时在自回归生成过程中更新和合并 KV memory，不需改动模型架构。摘要提到轻量适配可进一步增强运动动态与视觉保真度，但训练流程和关键设置未给。
    diff: 不同于 local window、sink tokens 或压缩记忆状态等通常为历史不同部分分配固定角色的方法，FadeMem 在单一缓存内依据时间距离渐进合并历史条目。其时间分配遵循幂律，使缓存呈现近密远疏的层级结构。
    limits: 未见明确说明
    has_abstract: true
- id: moc
  title: Mixture of Contexts for Long Video Generation
  date: '2025-08-28'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 长视频当内部检索，query自选chunk
  mechanism: 可学稀疏路由：每个query挑少数信息量大的历史chunk，加caption与局部窗必选锚，因果约束禁闭环。
  tags:
  - 稀疏路由
  - chunk检索
  - 近线性扩展
  key_numbers:
  - 摘要未给具体数值，称可保身份/动作/场景达分钟级
  - 效率随检索近线性
  media: []
  links:
  - https://arxiv.org/abs/2508.21058
  note: 这条泳道的理论源头之一：把「记忆」重述为 query 到 chunk 的内部检索并让它可学，与 LongLive-RAG 的外部库路线形成对照（MoC
    无外部存储、路由在注意力里）。
  arxiv: '2508.21058'
  explain: 想象模型要接着拍一段一分钟的追逐戏：主角的外套、街道布局和动作节奏都得记住，但把前面每一帧都塞回模型，既昂贵又容易被无关画面干扰。它把已经生成的长视频当作内部检索库。当前要生成的内容会形成查询，也就是向历史寻找所需信息的问题；可学习的稀疏路由会为每个查询挑出少数最有用的历史片段。描述全局语义的字幕信息和紧邻当前画面的局部窗口，则被固定为必选锚点，保证人物身份与近处动作不断裂；因果约束还禁止读取未来，避免信息泄漏和循环依赖。这样，模型只看相关记忆而非整段历史，既能维持分钟级视频中的人物、动作和场景一致性，也让计算量随检索规模近似线性增长。
  detail:
    position: 这篇工作将长视频生成中的长期记忆问题重新表述为模型内部的信息检索问题。它提出 Mixture of Contexts，旨在降低长序列 self-attention
      的计算与内存开销，同时保留跨长时间范围的身份、动作和场景一致性。
    io: 输入是生成过程中的 query、caption 和可供检索的历史视频上下文，输出是长视频内容。caption 与局部时间窗口作为必选条件信号，query
      还会因果地检索少量历史 chunk。
    steps:
    - 将长视频历史划分为 chunks，使模型能以片段为单位检索远距离上下文，而不必对全部历史执行密集 attention。
    - 根据每个 query 学习路由并选择少量有信息量的历史 chunks，把计算集中到可能影响当前生成的内容上。
    - 将 caption 和局部窗口作为必选锚点加入检索结果，以保留文本条件和邻近时间上下文。
    - 施加因果路由约束，避免检索未来内容或形成 loop closures，从而支持按时间顺序生成。
    - 随着数据扩展逐步稀疏化路由，使模型在减少计算的同时学习检索显著历史并维持长程一致性。
    formulas:
    - tex: \mathcal{I}(q_t)=\mathcal{A}_{\mathrm{cap}}\cup\mathcal{A}_{\mathrm{local}}(t)\cup\operatorname{TopK}_{\,c_i<t}\left(\frac{q_t^{\top}k_i}{\sqrt{d}}\right),\qquad
        r_{t,i}=\frac{q_t^{\top}k_i}{\sqrt{d}}
      caption: 标准写法，非原文：基于 query–chunk 相似度的稀疏历史检索，并加入 caption、局部窗口锚点及因果约束。
    - tex: o_t=\operatorname{softmax}\left(\frac{q_tK_{\mathcal{I}(q_t)}^{\top}}{\sqrt{d}}\right)V_{\mathcal{I}(q_t)}
      caption: 标准写法，非原文：仅在检索到的历史 chunks 与必选锚点上执行注意力聚合，以降低长序列 attention 的计算与内存开销。
    train: 训练时扩展数据规模并逐步稀疏化路由。推理时由 query 动态检索少量历史 chunks，并结合 caption 与局部窗口生成；具体训练目标、路由实现细节及推理设置摘要未给。
    diff: 不同于对长序列执行密集 self-attention 的做法，MoC 将上下文访问作为可学习的稀疏检索与路由问题。每个 query 动态选择历史
      chunks，同时保留 caption、局部窗口锚点并施加因果约束。
    limits: 摘要指出密集 self-attention 的二次计算成本会使长序列的内存与计算难以承受，但未见明确说明 MoC 的具体适用边界、失败模式或其他局限。
    has_abstract: true
- id: omnimem
  title: 'OmniMem: Scalable and Adaptive Memory Retrieval for Long Video Generation'
  date: '2026-05-28'
  lane: 内容学习寻址
  branch: 外部检索库
  training: 推理期技巧
  status: 速读
  one_liner: 在历史KV上做全范围稀疏检索
  mechanism: 对历史KV做稀疏块检索：自适应窗排除把局部窗剔出候选，query共享选择降开销，各头散取非连续块。
  tags:
  - 稀疏KV检索
  - 全范围记忆
  - 显存可控
  key_numbers:
  - 动态度 +52.3%
  - 显存占用与强基线相当
  media: []
  links:
  - https://arxiv.org/abs/2605.30519
  note: 明确以「截断/隐式压缩都丢失显式可查历史」立论，把历史 KV 当可检索外部库；与 MosaicChunk 的区别是它不重组压缩块，而是保留原始 KV
    块做稀疏选择。
  arxiv: '2605.30519'
  explain: 想象模型在拍一部长镜头：它既要记住眼前几帧，也要从几分钟前的动作里找回一件道具。视频越长，历史键值缓存（KV，保存过往画面特征的记忆）越大，逐项读取会拖慢生成、占用显存，固定局部窗口又容易漏掉远处线索。OmniMem对全部历史KV做稀疏块检索：先用自适应窗口排除已被局部覆盖的区域，避免重复搜索；再让相近查询共享候选选择，减少计算；最后允许不同注意力头各自抽取不连续的关键块。这样既保留近处细节，又能跳着找远处相关内容，用较少访问换来更长的记忆范围。实验中动态度提升52.3%，显存占用仍与强基线相当，说明它兼顾了长视频生成的效率与连贯性。
  detail:
    position: OmniMem 解决长视频自回归生成中历史 KV cache 持续增长、反复访问成本高，以及截断或隐式压缩会丢失与当前查询相关的历史细节的问题。它在完整历史范围内进行稀疏
      KV 检索，以保留对相关历史信息的显式访问。
    io: 输入是当前查询以及已生成视频块形成的历史 KV cache，当前查询作为检索信号。输出是供注意力计算使用的稀疏历史 KV 块，并用于后续视频块生成。
    steps:
    - 根据当前查询确定历史 KV 块的选择，并在可用长程历史足够时排除局部窗口候选，以减少局部偏置并将稀疏预算留给长程信息。
    - 采用 Query-Shared KV Selection 共享跨查询的选择结果，以降低不同查询选择差异带来的访问开销。
    - 各注意力头按自身选择模式散取非连续 KV 块，避免将不同头的选择扩展成庞大的统一 KV 缓冲区。
    - 将检索到的历史 KV 用于当前块的注意力计算，支持自回归视频生成继续扩展。
    formulas:
    - tex: \mathcal{C}_t=\{b:\ b\notin\mathcal{W}_t\},\qquad \mathcal{S}_t=\operatorname{TopK}_{b\in\mathcal{C}_t}\,s(Q_t,K_b)
      caption: 自适应排除局部窗口后，按查询与历史 KV 块的相关性选择稀疏历史块；标准写法，非原文
    - tex: \operatorname{Attn}_h(Q_t)=\operatorname{softmax}\!\left(\frac{Q_tK_{\mathcal{S}_t,h}^{\top}}{\sqrt{d_h}}\right)V_{\mathcal{S}_t,h}
      caption: 各注意力头从选中的非连续历史 KV 块中读取信息并计算当前注意力；标准写法，非原文
    train: 摘要未给训练流程或训练设置。推理时对自回归生成过程中累积的历史 KV cache 执行稀疏检索，并将检索结果用于后续视频块生成；关键参数设置摘要未给。
    diff: 相较于截断 KV cache 或将其压缩为隐式记忆，OmniMem 保留对完整历史 KV 的显式稀疏访问。它通过 Adaptive Window
      Exclusion、Query-Shared KV Selection 和 Per-Head Scattered KV Access 分别应对局部偏置与
      Union Explosion。
    limits: 稀疏检索仍需访问历史 KV，具体计算开销及其随视频长度的变化摘要未给；实验称内存使用与基线相当，但未见明确说明其他局限。
    has_abstract: true
- id: memlearner
  title: 'MemLearner: Learning to Query Context memory for Video World Models'
  date: '2026-06-30'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 用query token学会问上下文
  mechanism: 以query token桥接上下文与待预测token，让生成模型自身视觉先验承担检索；配遮挡/动态数据集。
  tags:
  - 可学检索
  - query token
  - 世界模型记忆
  key_numbers:
  - 摘要未给具体数值，称在遮挡与动态场景显著优于先前世界模型
  media: []
  links:
  - https://arxiv.org/abs/2606.31734
  note: 直接对标「规则式上下文帧检索在遮挡/动态物体下不泛化」，是学习路由分支对 LongLive-RAG 式固定检索的正面替代；注意它面向 action-conditioned
    世界模型而非纯 T2V。
  arxiv: '2606.31734'
  explain: 想象你在看一段街景视频：汽车被大树挡住几帧后，模型还得判断它会从哪里出现。麻烦在于，传统视频世界模型常把很长的历史画面一股脑送进生成器，既难找到真正有用的线索，也容易被遮挡和剧烈运动干扰。MemLearner让模型学会用查询令牌（query
    token，一小段专门用来提问上下文的表示）主动读取记忆。它把这些令牌放在历史上下文与待预测视频令牌之间，由生成模型已有的视觉先验决定该问什么、从哪里取信息，而不是依赖单独的检索模块。这样，模型能抓住目标的外观、运动和遮挡前后的关系，再生成未来画面。作者还用遮挡和动态场景数据集检验这一能力，结果显示它在两类困难环境中都显著优于先前世界模型。
  detail:
    position: MemLearner 解决 Video World Models 在长时生成中因缺乏记忆而出现的场景不一致问题，尤其关注场景遮挡和动态物体带来的上下文检索困难。它学习如何查询历史上下文，以改善未来视频预测中的场景记忆。
    io: 输入包括历史视频帧和用户动作等条件信号，模型输出未来视频状态。query token 用于从上下文中提取与预测相关的信息，并桥接上下文 token
      与待预测 token。
    steps:
    - 收集包含场景遮挡和动态物体的长视频数据，并结合相机位姿标注及未标注真实视频进行训练，为学习上下文查询提供数据基础。
    - 在预测过程中引入 query token，使其面向历史上下文进行查询，以适应场景遮挡和动态变化下的记忆需求。
    - 利用视频生成模型自身的视觉先验，将查询得到的上下文信息与待预测 token 联系起来，从而生成更一致的未来视频状态。
    - 采用面向训练和推理的高效策略使用该查询机制，以改善长时生成中的场景一致性和记忆表现。
    formulas:
    - tex: A_{q\leftarrow h}=\operatorname{softmax}\!\left(\frac{Q_qK_h^{\top}}{\sqrt{d}}\right),\qquad
        \widetilde{H}=A_{q\leftarrow h}V_h
      caption: 标准写法，非原文：query token 对历史上下文进行注意力检索并聚合记忆信息。
    - tex: \widehat{Z}=\operatorname{softmax}\!\left(\frac{Q_zK_{\widetilde{H}}^{\top}}{\sqrt{d}}\right)V_{\widetilde{H}}
      caption: 标准写法，非原文：将检索得到的上下文记忆与待预测视频 token 关联，用于生成更一致的未来状态。
    train: 训练使用带相机位姿标注的渲染视频与未标注真实世界视频，并采用多数据集训练策略。摘要提到高效训练与推理策略，但未说明具体目标函数、数据规模或实现细节。
    diff: 已有方法主要使用规则式上下文帧检索，难以适应场景遮挡和动态物体。MemLearner 通过学习 query token 来查询上下文，并利用视频生成模型自身的预训练视觉先验，而非从头训练额外模块。
    limits: 未见明确说明
    has_abstract: true
- id: slotmemory
  title: 'SlotMemory: Object-Centric KV Memory for Streaming Long-Video Generation'
  date: '2026-05-29'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 按是什么而非何时组织KV槽
  mechanism: 把KV流形拆成离散可复用语义槽，用槽作路由地址存取KV token，实现实体级持久与prompt感知检索。
  tags:
  - 语义槽
  - 实体持久
  - KV寻址
  key_numbers:
  - 60 秒交互叙事质量分 81.61
  - 动态一致性相对提升 22.8%
  - Wan2.1-T2V-1.3B 骨干
  media:
  - https://tj12323.github.io/SlotMemory/static/videos/60s-1.mp4
  - https://tj12323.github.io/SlotMemory/static/videos/60s-2.mp4
  links:
  - https://arxiv.org/abs/2605.31033
  - https://tj12323.github.io/SlotMemory/
  note: 摘要自述把记忆抽象从「何时」转到「是什么」，即显式反对时间坐标寻址 → 落内容学习寻址；但「槽位作为地址」也可读成实体挂载，若你按实现归位置时间寻址亦说得通，故
    confidence 降为 medium。同月还有一篇 SlotMem（2607.15772，角色可寻址内部记忆），机制更偏角色 slot 写入/读取，我未重复收录以免同类堆叠。
  arxiv: '2605.31033'
  explain: 想象镜头连续拍一只红伞：走过几条街、隔了很久再出现，它仍该是同一把伞。长视频生成却常把记忆按时间堆进缓存，越拍越难检索，还容易让物体变样、前后动作对不上。SlotMemory把键值记忆（模型用来存取信息的内部缓存）按“是什么”而非“何时发生”整理：把相似内容归入可复用的语义槽，再用槽作地址存取对应片段，并依据提示词检索。这样，物体能跨镜头保留特征，相关记忆也更容易被找回。在Wan2.1-T2V-1.3B上，60秒交互叙事质量得分为81.61，动态一致性相对提升22.8%。
  detail:
    position: 论文针对 streaming video generation 中以原始帧、片段或未聚类 token 组织历史记忆，导致实体离开画面或
      prompt 切换时身份漂移、语义不一致的问题。它提出以语义对象为中心组织 KV memory，支持长时程实体持久性与按 prompt 检索。
    io: 输入是 streaming video generation 的生成上下文、历史 KV token 与 prompt；输出是连续生成的视频内容。prompt
      可在生成过程中切换，历史记忆用于在后续生成中维持实体与语义一致性。
    steps:
    - 从 transformer 的 KV 表示中提取可复用的语义结构，将记忆组织目标从事件发生的时间转向所表示的内容，以减少仅按时间存储带来的实体关联断裂。
    - 把 KV manifold 分解为离散语义槽，使相似或相关的表示能够通过共享槽位进行组织。
    - 将语义槽作为 routing address，索引并存储高保真 KV token，以便实体离开画面后仍可保留其相关记忆。
    - 生成后续视频时依据语义槽检索历史 KV，并结合当前 prompt 选择相关记忆，以支持跨时间和 prompt 转换的语义一致性。
    formulas:
    - tex: a_{ij}=\operatorname{softmax}_{j}\!\left(-\frac{\lVert z_i-c_j\rVert_2^2}{\tau}\right)
      caption: 将 KV 表示 z_i 按与语义槽中心 c_j 的距离分配到槽位；标准写法，非原文
    - tex: r_j=\operatorname{softmax}_{j}\!\left(\frac{q(p)^{\mathsf T}e_j}{\sqrt{d}}\right),\qquad
        \hat{v}=\sum_j r_j\,\operatorname{Attn}\!\left(q,\mathcal{M}_j\right)
      caption: 依据当前 prompt p 对语义槽打分，并聚合对应槽中存储的 KV 记忆；标准写法，非原文
    train: 摘要未给训练目标、训练数据与具体训练流程。推理时采用 streaming video generation，并通过语义槽索引和检索历史 KV；摘要报告在
      Wan2.1-T2V-1.3B backbone 上评估 60 秒 interactive narratives，质量分数为 81.61，dynamic
      consistency 相对最强既有 streaming baseline 提升 22.8%。
    diff: 既有方法通常按时间组织历史内容，例如存储原始帧、片段或未聚类 token；SlotMemory 改为按语义对象组织 KV，并以离散槽位作为检索地址。其核心区别是强调语义结构与实体级记忆，而非单纯增加原始时间上下文容量。
    limits: 摘要未明确说明计算与存储开销、槽位构造细节、适用场景边界或局限。
    has_abstract: true
- id: tethercache
  title: 'TetherCache: Stabilizing Autoregressive Long-Form Video Generation with
    Gated Recall and Trusted Alignment'
  date: '2026-06-11'
  lane: 内容学习寻址
  branch: 学习路由
  training: 免训
  status: 速读
  one_liner: 门控召回远帧，再对齐回可信分布
  mechanism: 缓存分sink/memory/recent；GRAB用注意力相关度乘时间多样性选远帧，TAME把召回token统计对齐可信分布。
  tags:
  - 门控召回
  - 记忆编辑
  - 免训插拔
  key_numbers:
  - 240s 生成质量漂移 7.84 → 1.33
  - 30s/60s/240s 均优于 Self-Forcing 基线
  media: []
  links:
  - https://arxiv.org/abs/2606.13035
  note: 召回打分是「注意力相关度 × 时间多样性」的显式评分而非学习路由网络，严格说介于规则与学习之间；我按「按内容打分取历史」归学习路由，若你要求纯学习策略可降级为不入库。它的独特处是同时处理「取错」和「取到但已被污染」。
  arxiv: '2606.13035'
  explain: 想象摄像机不停拍一段四分钟的视频：生成得越久，画面越容易偏离开头，人物和场景慢慢变样。TetherCache要解决的正是这种长视频的质量漂移。它把过去的画面分成固定锚点、记忆片段和近期片段，既留住开头的重要信息，也保留眼前变化。生成新画面时，GRAB会从远处挑选值得回看的帧：既看它们与当前内容是否相关，也避免只挑时间上挤在一起的画面。随后，TAME把这些回忆信息调整到模型更可靠的分布，减少旧画面带来的干扰。一个负责选对回忆，一个负责让回忆用得稳，因此能减缓越生成越跑偏。实验中，生成240秒视频的质量漂移从7.84降至1.33；在30秒、60秒和240秒时，效果也都优于Self-Forcing基线。
  detail:
    position: 这篇论文解决自回归视频扩展到长时生成时的历史缓存受限和误差累积问题，后者会造成视觉伪影、质量下降与时间漂移。TetherCache 旨在固定缓存预算下稳定长视频生成。
    io: 输入是自回归视频扩散生成过程中已有的历史帧特征与当前生成上下文，输出是经缓存管理和记忆编辑后用于后续生成的上下文。条件信号包括注意力相关度、帧的时间多样性，以及可信上下文的统计分布。
    steps:
    - 将缓存划分为 sink、memory 和 recent 区域，以便在预算受限时分别保留锚点、长程信息和近期上下文。
    - 用 GRAB 综合注意力相关度与时间多样性，从历史帧中选择远程记忆，以保留有用且覆盖时间范围较广的信息。
    - 将选出的记忆帧作为召回内容，并通过 TAME 轻量编辑其 token，使统计特征对齐可信上下文分布，以减轻漂移历史特征的污染。
    - 将整理后的缓存上下文用于后续自回归视频扩散生成，以降低长时生成中的质量退化和时间漂移。
    formulas:
    - tex: s_i=\operatorname{Rel}(i)\cdot\operatorname{Div}(i),\qquad \operatorname{Rel}(i)=\frac{1}{|\mathcal{Q}|}\sum_{q\in\mathcal{Q}}\operatorname{Attn}(q,i),\qquad
        \operatorname{Div}(i)=\min_{j\in\mathcal{M}}\lvert t_i-t_j\rvert
      caption: GRAB 的远程记忆检索打分：结合历史帧的注意力相关度与相对已选记忆的时间多样性；标准写法，非原文
    - tex: \widetilde{h}_i=\gamma\odot\frac{h_i-\mu_{\mathrm{mem}}}{\sigma_{\mathrm{mem}}+\epsilon}\odot\sigma_{\mathrm{trust}}+\mu_{\mathrm{trust}}
      caption: TAME 的可信上下文统计对齐：将召回 token 的均值和方差对齐到可信上下文分布；标准写法，非原文
    train: TetherCache 是 training-free、plug-and-play 的缓存管理策略，建立在 Self-Forcing 上；通过
      GRAB 和 TAME 在推理时管理缓存与编辑召回记忆。摘要未给出具体推理参数或实现设置。
    diff: 相较于仅依赖近期上下文或直接复用历史特征的做法，TetherCache 在固定缓存预算下同时进行带注意力与时间多样性权衡的远帧召回，以及召回 token
      的可信分布对齐。它不通过训练新模型来处理漂移。
    limits: 仍受固定缓存预算约束，无法保留完整历史；摘要未见明确说明额外计算代价、适用边界或其他局限。
    has_abstract: true
- id: layerrecall
  title: 'LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency
    in Video Generation'
  date: '2026-08-28'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 先判哪层要记忆，只往那层注KV
  mechanism: 以当前帧为条件的层选择路由，检索历史K/V只注入记忆敏感层；用跨时域预测匹配监督该路由。
  tags:
  - 层选择路由
  - KV注入位置
  - 预测空间监督
  key_numbers:
  - 100 条多镜头 prompt
  - MemoBench / MovieBench 综合最佳，VBench-Long 不掉
  - 推理开销可忽略
  media: []
  links:
  - https://arxiv.org/abs/2608.28460
  note: 关键论点「访问到 ≠ 用得上」，把检索拆成 what（取什么）与 where（注入哪层）两问；这是本泳道里唯一把「路由目的地」当一等公民的，与 MemLearner
    只学 query 形成互补。
  arxiv: '2608.28460'
  explain: 想象镜头从客厅切到厨房，人物又走回来：长视频生成常会忘掉衣着、位置等细节，前后画面接不上。LayerRecall像个分拣员，不把所有历史都塞回模型，而是看当前帧，判断哪些网络层最需要记忆，再只向这些层注入历史的键和值（KV，即注意力计算用来读取信息的缓存）。它还用跨时段预测匹配来训练路由：让模型学会哪些层的记忆有助于保持后续画面一致。这样既留住关键线索，也避免无关历史干扰。论文在100条多镜头提示词及MemoBench、MovieBench综合评测中表现最佳，VBench-Long成绩不降，推理开销也几乎可忽略。
  detail:
    position: LayerRecall 解决长视频分块生成时，近期上下文缓存会遗忘远处历史线索、导致重复出现的主体或属性不一致的问题。它不仅检索历史信息，还决定在哪些
      DiT 层使用这些信息。
    io: 输入包括当前生成状态、近期上下文和可检索的历史 K/V 状态；输出是结合历史线索生成的视频块。当前状态作为路由条件，用于选择记忆敏感层并检索相关历史。
    steps:
    - 根据当前生成状态判断哪些 backbone 层对记忆敏感，以适配不同层对当前、近期和远距离上下文的偏好。
    - 依据当前状态从历史中检索相关 K/V 状态，以找回再次出现的主体、物体、场景或属性线索。
    - 仅将检索到的 K/V 注入选定的记忆敏感层，并让其他层保留局部注意力，以增强长程一致性而不干扰局部连续性。
    - 训练时用 Cross-Horizon Prediction Matching 让有长上下文的参考预测监督受限记忆路由器，以减少对高质量长视频和显式记忆分配标签的依赖。
    formulas:
    - tex: \tilde{h}_{t}^{(\ell)}=h_{t}^{(\ell)}+g_{t}^{(\ell)}\,\operatorname{Attn}\!\left(Q_{t}^{(\ell)},K_{\mathcal{R}_t}^{(\ell)},V_{\mathcal{R}_t}^{(\ell)}\right),\qquad
        g_{t}^{(\ell)}=\sigma\!\left(f_{\ell}(s_t)\right)
      caption: 标准写法，非原文；表示根据当前生成状态选择记忆敏感层，并仅在这些层注入检索到的历史 K/V。
    - tex: \mathcal{L}_{\mathrm{CHPM}}=\sum_{t,\ell}\left\|\hat{y}_{t,\ell}^{\mathrm{router}}-\operatorname{sg}\!\left(\hat{y}_{t,\ell}^{\mathrm{long}}\right)\right\|_2^2
      caption: 标准写法，非原文；跨时域预测匹配损失，用长上下文参考预测监督受限记忆路由器。
    train: 训练时，Cross-Horizon Prediction Matching 使用 privileged long-context reference
      在预测空间监督 bounded-memory router；具体损失形式和训练设置摘要未给。推理时按当前状态选择记忆敏感层，检索历史 K/V 并仅注入这些层，其他层继续处理局部上下文。
    diff: 相比仅提供非局部历史访问的记忆机制，LayerRecall 同时决定检索什么历史信息以及在哪些层使用它。它还通过跨时域预测匹配训练路由器，而非依赖显式记忆分配标签。
    limits: 摘要称推理开销可忽略，但未见明确说明其他代价与局限。
    has_abstract: true
- id: weave-forcing
  title: 'Weave Forcing: Compositional Memory Routing for Interactive Long Video Generation'
  date: '2026-10-02'
  lane: 内容学习寻址
  branch: 学习路由
  training: 免训
  status: 速读
  one_liner: LLM拆prompt，按角色背景分路取记忆
  mechanism: LLM语义槽路由把prompt拆成角色与背景各选参考；对比注意力图做掩码编织只露出相关KV；自适应RoPE。
  tags:
  - 组合式路由
  - 掩码记忆编织
  - 免训
  key_numbers:
  - 摘要未给具体数值，称跨镜头主体/背景一致性提升且画质不降
  media: []
  links:
  - https://arxiv.org/abs/2610.03510
  note: 针对「整段 prompt 检索会忽略各组分不同参考需求」，把检索粒度从镜头级下到组分级（角色/背景），是 MosaicChunk 之后检索粒度细化的代表；末尾那段覆盖率自适应
    RoPE 说明它仍需位置侧兜底。
  arxiv: '2610.03510'
  explain: 想象你在拍一段可互动的长镜头：同一只猫穿过厨房、花园和雨夜街道，观众随时改一句提示词，猫不能变脸，场景也不能串台。长视频生成的麻烦正是如此：模型要从很长的历史记忆里同时维持角色和背景，容易拿错信息，导致主体漂移、环境混乱或画质下降。Weave
    Forcing先让大语言模型（LLM，负责理解文字的模型）把提示词拆成“角色、背景”等语义槽，再为每个槽选择对应参考记忆。接着用对比注意力图定位真正相关的记忆区域，生成掩码，把无关的键值（KV，即注意力读取的记忆内容）挡住，只编织需要的信息；自适应旋转位置编码（RoPE，让模型感知时空位置）再随镜头变化调整位置关系。这样不同内容各走各的记忆通道，减少互相污染，既保持跨镜头的角色与环境连续性，也不牺牲画质。
  detail:
    position: Weave Forcing 解决交互式长视频生成中跨镜头复用角色与背景记忆的问题，尤其针对新镜头需要组合不同历史镜头元素的情况。它旨在避免整段提示词检索遗漏组件需求，以及混合全部历史记忆引入无关内容。
    io: 输入是当前用户提示词与历史镜头压缩后的 KV 记忆，输出是具有跨镜头角色和背景一致性的当前视频镜头。条件信号包括 LLM 提取的角色与背景语义槽、为各槽选出的历史参考、语义掩码，以及参考覆盖程度。
    steps:
    - 用 LLM 将当前提示词拆成角色和背景语义槽，并分别选择匹配的历史参考，以满足不同组件各自的记忆需求。
    - 根据语义槽构造对比注意力图并生成精细语义掩码，以定位历史记忆中与当前组件相关的内容。
    - 通过 masked memory weaving 从压缩历史 KV 记忆中选择性开放相关 token，以引导当前镜头生成并抑制无关视觉内容。
    - 根据参考对当前内容的覆盖程度调整 temporal offsets 和记忆保留，以减轻不完整参考靠近当前生成时产生的视觉伪影。
    formulas:
    - tex: \mathbf{Y}=\operatorname{softmax}\!\left(\frac{\mathbf{Q}\mathbf{K}_{\mathrm{mem}}^{\top}}{\sqrt{d}}+\log(\mathbf{M}+\varepsilon)\right)\mathbf{V}_{\mathrm{mem}},\qquad
        \mathbf{M}=\mathbb{1}\!\left[\mathbf{A}_{\mathrm{cmp}}\geq\tau\right]
      caption: 标准写法，非原文：基于语义槽对比注意力图构造掩码，并对压缩历史 KV 进行 masked memory weaving，只聚合与当前角色或背景组件相关的记忆
        token。
    - tex: \widetilde{\mathbf{K}}_{t}=\operatorname{RoPE}\!\left(\mathbf{K}_{t},\,t+\Delta_{t}\right),\qquad
        \Delta_{t}=\Delta_{\max}(1-c_{t}),\qquad g_{t}=\sigma\!\left(\alpha(c_{t}-\tau_{c})\right)
      caption: 标准写法，非原文：根据历史参考对当前内容的覆盖度 c_t 自适应调整 temporal offset，并通过门控 g_t 调节记忆保留强度。
    train: 该框架为 training-free。推理时依次进行语义槽路由、历史参考选择、掩码记忆编织和 coverage adaptive RoPE 调整，再生成当前镜头；具体模型设置与参数摘要未给。
    diff: 不同于整段提示词检索，Weave Forcing 按角色和背景语义槽分别选择历史参考。它还通过掩码选择性访问压缩 KV 记忆，并按参考覆盖程度调整
      RoPE 与记忆保留，而不是直接合并全部历史记忆。
    limits: 未见明确说明
    has_abstract: true
- id: reel
  title: 'REEL: Learning to Retrieve, Evaluate, and Evolve Visual Memory for Any Long-Horizon
    Multi-Shot Video Generation'
  date: '2026-10-12'
  lane: 内容学习寻址
  branch: 外部检索库
  training: 需训
  status: 速读
  one_liner: 训一个跨生成器的记忆策略
  mechanism: 统一工具接口下用SFT+GRPO训记忆规划器，学检索参考、补缺失证据、更新记忆；适配器转各家条件输入。
  tags:
  - 记忆策略智能体
  - GRPO
  - 跨生成器
  key_numbers:
  - ST-Bench 跨镜头一致性 +15.1%（JoyAI-Echo 1.5）/ +20.7%（MiniMax H3）
  - REEL-Bench Core-100 +2.41 / +8.32
  - REEL-SFT-4k + REEL-RL-1k 两个数据集
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2610.16632
  note: 把记忆管理从「生成器内部机制」抽成外挂可训练策略，与理解模型管理分支的 agent 化路线同源；与 LongLive-RAG 的区别是它不只检索，还能补拍缺失证据并回写记忆，且对黑盒生成器通用。
  arxiv: '2610.16632'
  explain: 想象拍一部几十镜头的电影：主角换个镜头就变脸、换衣服，场景也接不上。问题在于视频生成器会忘记前文，固定检索又常找不到真正有用的参考。REEL训练一个记忆规划器：它判断当前镜头缺什么，检索相关画面，主动补充缺失证据，再把结果写回记忆。训练先用监督微调（SFT，模仿示范），再用群体相对策略优化（GRPO，按生成效果奖励更好的规划）；适配器把统一接口的记忆转换成不同生成器的条件输入。于是学到的是可迁移的记忆管理，而非某个模型的技巧。ST-Bench一致性在JoyAI-Echo
    1.5、MiniMax H3上提升15.1%、20.7%；REEL-Bench Core-100提升2.41、8.32，使用REEL-SFT-4k和REEL-RL-1k数据集。
  detail:
    position: REEL 解决长视频多镜头生成中的跨镜头视觉一致性问题，重点是让记忆策略不依赖特定生成器，同时支持用户控制。
    io: 输入包括用户文本请求、已有持久视觉记忆，以及可能按时间提供的参考图像；输出是检索、生成或更新视觉证据的计划，经适配器转为后端生成器支持的条件输入，以指导视频镜头生成。
    steps:
    - 通过统一工具接口接收请求和当前记忆，使规划器能以一致方式操作不同后端的视觉证据。
    - 规划器检索相关参考；若证据缺失，则创建所需视觉证据，以支持镜头生成与跨镜头一致性。
    - 规划器根据生成结果更新持久记忆，使后续镜头能利用此前积累的证据。
    - 后端专用适配器将证据计划转换为各生成器支持的条件输入，再由生成器生成镜头。
    formulas:
    - tex: \mathcal{J}_{\mathrm{GRPO}}(\theta)=\mathbb{E}\!\left[\frac{1}{G}\sum_{i=1}^{G}\min\!\left(r_i(\theta)\hat
        A_i,\operatorname{clip}\big(r_i(\theta),1-\epsilon,1+\epsilon\big)\hat A_i\right)-\beta
        D_{\mathrm{KL}}\!\left(\pi_{\theta}\|\pi_{\mathrm{ref}}\right)\right],\quad
        r_i(\theta)=\frac{\pi_{\theta}(o_i\mid x)}{\pi_{\mathrm{old}}(o_i\mid x)}
      caption: 标准写法，非原文；GRPO 规划器策略优化目标，适用于训练记忆规划器
    train: 训练分为三阶段：先用 REEL-SFT-4k 进行 supervised fine-tuning，再用 REEL-RL-1k 进行 single-shot
      GRPO，最后进行 multi-shot GRPO。多镜头阶段在连续镜头间传递策略生成的记忆，使后续结果能够影响前序参考选择和记忆更新。推理时由 REEL
      规划证据操作，再由适配器转换为目标生成器的条件输入；具体优化目标与推理细节摘要未给。
    diff: 已有代表性多镜头系统通常将记忆绑定到特定生成器接口，或依赖预定义的 agent 工作流。REEL 则独立训练面向跨镜头目标的通用记忆策略，并通过适配器支持不同黑盒生成器。
    limits: 摘要未见明确说明计算代价、数据构建成本或适用范围限制。
    has_abstract: true
- id: gear
  title: Geometry as Address (GEAR)
  date: '2026-09-28'
  lane: 几何位姿寻址
  branch: 位姿视锥
  training: 训练
  status: 待精读
  one_liner: 几何只负责寻址，注意力决定取什么
  mechanism: 历史不融成全局 3D 只留帧 latent；每帧几何建 token 级对应，GCA 把命中特征注入目标 patch，octree 剔遮挡伪对应。
  tags:
  - 令牌寻址
  - 位姿对应
  - 遮挡剔除
  key_numbers:
  - 分钟级视频生成
  - 摘要未给帧数/指标
  media:
  - https://zju3dv.github.io/geometry-as-address/material/Motivation/motivation.mp4
  - https://zju3dv.github.io/geometry-as-address/material/Methods/vis_method.mp4
  links:
  - https://arxiv.org/abs/2609.34722
  - https://zju3dv.github.io/geometry-as-address/
  note: 主线最直接对标：camera trajectory 条件 + 可回溯空间记忆，且明确反对把几何当"解释"、只当"地址"，正好避开全局融合误差累积（与我们主线假设同构）。建议优先精读。
  arxiv: '2609.34722'
  explain: 想象镜头绕着一张桌子转：生成新画面时，模型得记住旧镜头里桌上的杯子，却不能把所有历史画面硬揉成一张庞大的三维地图。GEAR要解决的正是长视频里记忆难保存、遮挡又容易认错的问题。它把每帧压成潜在表示，也就是精简的画面记忆；再用几何信息为新旧画面中的小块内容配对。几何引导注意力（GCA）是一种按需取信息的机制：几何只指出可能对应的位置，模型再决定取哪些特征，注入当前画面对应区域。八叉树则像层层划分空间的格子，用来剔除被遮挡造成的假配对。这种分工避免了维护完整三维世界的负担，也让模型能借用真正相关的旧信息，支持分钟级视频生成。摘要未提供帧数或量化指标。
  detail:
    position: GEAR 解决长时程、受相机轨迹控制的视频生成中，历史内容难以高效检索以及全局 3D 记忆融合会累积几何误差的问题。其核心是让几何提供视觉记忆的读取地址，由注意力决定恢复哪些内容。
    io: 输入为历史帧 latent、每帧几何信息和目标视角下的噪声视频 patch，输出为符合相机控制且能与历史内容保持一致的视频。相机轨迹提供目标视角条件，几何对应关系与可见性证据用于引导历史特征检索。
    steps:
    - 将历史观察保留为各帧 latent，而不融合成持久全局 3D 表示，以避免融合过程中的误差累积。
    - 利用各帧几何信息建立历史帧与目标视图之间的 token 级对应，以确定目标 patch 应读取的历史位置。
    - 通过 Invisible Octree 累积可见性证据并排除几何上看似匹配但实际被遮挡的对应，以减少错误检索。
    - 在去噪过程中用 Geometric Correspondence Attention 将匹配的历史特征选择性注入目标 patch，以恢复相关视觉内容并保持跨视角一致性。
    formulas:
    - tex: \mathbf{y}_p=\mathbf{x}_p+\sum_{(i,u)\in\mathcal{C}(p)}\operatorname{softmax}_{(i,u)\in\mathcal{C}(p)}\!\left(\frac{(W_Q\mathbf{x}_p)^\top(W_K\mathbf{h}_{i,u})}{\sqrt{d}}\right)W_V\mathbf{h}_{i,u}
      caption: 标准写法，非原文：GCA 根据查询 patch 与几何对应的历史 token 的注意力分数，选择性聚合历史特征；\(\mathcal{C}(p)\)
        表示通过可见性筛选的对应集合。
    train: 摘要未给训练数据、损失函数或训练设置。推理时在去噪目标 patch 的过程中，依据几何对应检索历史特征，并由 Invisible Octree
      过滤遮挡对应；具体采样与关键参数摘要未给。
    diff: 与隐式搜索历史上下文的方法相比，GEAR 用几何显式建立 token 级读取地址。与将历史重建并融合进持久全局 3D 记忆的方法相比，它保留帧
      latent，仅用逐帧几何路由注意力，从而避免全局融合造成的持续误差累积。
    limits: 未见明确说明
    has_abstract: true
- id: lyra2
  title: Lyra 2.0 - Explorable Generative 3D Worlds
  date: '2026-04-14'
  lane: 几何位姿寻址
  branch: 位姿视锥
  training: 训练
  status: 速读
  one_liner: 逐帧几何仅做信息路由，治空间遗忘
  mechanism: 维护逐帧 3D 几何只用于检索相关历史帧并与目标视角建稠密对应，外观交给生成先验；另用自增强劣质历史训练纠时间漂移，再微调前馈重建出 3D。
  tags:
  - 信息路由
  - 漂移纠正
  - 大场景重访
  key_numbers:
  - 长轨迹+位置重访
  - 摘要未给具体数值
  media: []
  links:
  - https://arxiv.org/abs/2604.13036
  - https://research.nvidia.com/labs/sil/projects/lyra2/
  note: 与 GEAR 同期且思路同构（几何只管 routing、外观交给生成先验），是工业侧独立验证；区别在 Lyra 2.0 用自增强历史专治 temporal
    drifting，GEAR 用 octree 治遮挡伪对应。
  arxiv: '2604.13036'
  explain: 想象你让模型在一座房子里边走边拍：走远再回到厨房，它可能把门窗位置记错，画面接不上，这就是长视频生成中的空间遗忘。Lyra 2.0不让几何负责画得逼真，而把每帧的三维结构当作地图索引：按当前视角找回相关旧帧，再建立稠密对应，也就是逐处匹配新旧画面的位置；外观则交给生成先验补全。它还用自增强得到的劣质历史片段训练模型纠正时间漂移，并微调前馈重建模块恢复三维。这样，几何帮模型找对看过哪里，生成模型专心画好细节，因此更能在长轨迹中重访地点并保持空间一致。论文摘要未给出具体指标。
  detail:
    position: 本文要解决长视角轨迹下生成式 3D 场景构建中的空间遗忘与时间漂移问题，使生成视频在大范围探索和地点重访时仍保持 3D 一致性。目标是进一步从长程生成视频中恢复可实时渲染和仿真的
      3D 场景。
    io: 输入为场景探索过程中的目标相机视角序列及生成历史，目标相机视角作为条件信号。输出为长程、具 3D 一致性的生成视频，并通过前馈重建模型恢复 3D 场景。
    steps:
    - 为生成历史中的各帧维护 3D 几何，以便在目标视角到来时定位相关历史信息。
    - 依据几何检索相关历史帧，并建立历史帧与目标视角之间的稠密对应，以缓解重访区域时因空间遗忘造成的结构幻觉。
    - 将检索和对应结果用于信息路由，而由生成先验合成目标视角的外观，避免把几何表示当作外观生成来源。
    - 使用模型自身生成且带有退化的历史进行自增强训练，使模型学会纠正累积误差而非延续时间漂移。
    - 用长程生成视频微调前馈 3D 重建模型，以恢复适用于实时渲染和仿真的场景几何与表示。
    formulas:
    - tex: s_i(q)=\frac{1}{|\mathcal{P}_i|}\sum_{\mathbf{X}\in\mathcal{P}_i}\mathbf{1}\!\left[\pi_q(\mathbf{X})\in\Omega_q\right]
      caption: 依据历史帧几何与目标视锥的投影重叠度进行检索的标准写法，非原文
    - tex: \mathcal{L}_{\mathrm{self}}=-\mathbb{E}_{(H,V),\,\widetilde{H}\sim\mathcal{D}(H)}\left[\log
        p_\theta(V\mid\widetilde{H},q)\right]
      caption: 用退化历史训练模型生成目标视角、以纠正时间漂移的标准写法，非原文
    train: 训练时使用自增强历史，让模型接触自身退化输出并学习纠正时间漂移；再用长程生成视频微调前馈重建模型。推理时按目标相机视角检索相关历史帧并建立稠密对应，由生成先验合成外观；具体网络结构、损失函数和训练设置摘要未给。
    diff: 不同于仅依赖有限时间上下文的长视频生成方法，Lyra 2.0 用逐帧 3D 几何检索历史信息并建立稠密对应，但不以几何直接决定外观。它还通过自增强历史训练模型纠正自身输出中的漂移，并将长程视频用于微调前馈
      3D 重建。
    limits: 未见明确说明
    has_abstract: true
- id: ucm
  title: UCM - Unified Modeling of Camera Control and Memory
  date: '2026-02-26'
  lane: 几何位姿寻址
  branch: 位姿视锥
  training: 训练
  status: 速读
  one_liner: 位姿编码扭曲统一相机控制与记忆
  mechanism: 时间感知位置编码按目标位姿 warp 历史帧特征，把重访取历史与相机控制并到同一条件通道；双流 DiT 降开销，点云渲染造重访数据。
  tags:
  - 编码扭曲
  - 相机控制
  - 双流DiT
  key_numbers:
  - 50万+单目视频
  media:
  - https://humanaigc.github.io/ucm-webpage/video/demo/0001_gen.mp4
  - https://humanaigc.github.io/ucm-webpage/video/demo/0002_gen.mp4
  links:
  - https://arxiv.org/abs/2602.22960
  - https://humanaigc.github.io/ucm-webpage/
  note: 与 VMem/SMART 路线对照：不重建显式几何，把位姿差异写进位置编码做 warp，属"位姿视锥"分支的轻量解。
  arxiv: '2602.22960'
  explain: 想象镜头绕屋一圈后回到门口：模型既要按要求转动镜头，又得记得门口原来的样子，常常顾此失彼。UCM把相机控制和历史记忆放进同一条条件通道：位姿，也就是相机的位置与朝向，会用时间感知的位置编码来扭曲历史画面特征，让模型按当前视角取回对应记忆。这样，转镜头和认旧景不再是两套互不相干的任务。双流扩散变换器让这套处理更省计算；点云渲染则从三维场景生成重访画面，补足训练数据。模型还利用50万多段单目视频学习，让控制更稳、重访更连贯。
  detail:
    position: UCM 解决视频生成世界模型重访场景时长期内容不一致，以及难以按用户输入精确控制相机的问题。它通过统一建模历史记忆与相机控制，面向高保真交互式视频生成。
    io: 输入包括单目视频、历史帧特征和目标相机位姿等条件信号，输出为受相机控制且保持场景一致的生成视频。摘要未给出完整输入格式及具体条件编码方式。
    steps:
    - 利用点云渲染模拟对场景的再次访问，并据此整理训练数据，以构造包含重访情况的监督样本。
    - 将历史帧特征与目标相机位姿作为生成条件，使模型能够利用已有场景内容并响应相机控制。
    - 按目标位姿对时间感知位置编码进行 warp，将重访时的历史信息与相机控制合入同一条件通道，以建立空间对应关系。
    - 通过双流 Diffusion Transformer 处理条件与生成过程，以降低计算开销并生成高保真视频。
    formulas:
    - tex: \widetilde{\mathbf F}_{\mathrm{hist}}=\mathcal W(\mathbf F_{\mathrm{hist}};\mathbf
        T_{\mathrm{hist}},\mathbf T_{\mathrm{target}}),\qquad \mathbf C=\operatorname{Concat}(\widetilde{\mathbf
        F}_{\mathrm{hist}},\mathbf E_{\mathrm{pose}}(\mathbf T_{\mathrm{target}}))
      caption: 标准写法，非原文：按目标相机位姿 warp 历史特征，并与目标位姿编码合并为生成条件。
    train: 训练数据由点云渲染模拟场景重访的策略构造，覆盖超过 500K 个单目视频。模型采用双流 Diffusion Transformer。推理时以历史帧信息和目标相机位姿为条件生成视频；优化器、损失函数、训练细节及推理参数摘要未给。
    diff: 不同于依赖显式 3D 重建、在无界场景中灵活性受限的方法，UCM 以时间感知位置编码 warp 建立历史帧与目标位姿的对应。不同于仅直接复用先前生成帧而缺少显式空间对应的方法，它将长期记忆与精确相机控制统一到同一条件通道。
    limits: 摘要指出相关既有路线存在灵活性、细粒度结构保持或可控性方面的困难，但未见对 UCM 自身代价与局限的明确说明。
    has_abstract: true
- id: anchorweave
  title: AnchorWeave
  date: '2026-02-16'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 训练
  status: 速读
  one_liner: 弃全局融合，改检索多块局部几何
  mechanism: 单块全局记忆必然把位姿/深度误差融成噪声几何；改为按目标轨迹做覆盖率驱动的局部记忆检索，再用多锚编织控制器在生成中调和对齐误差。
  tags:
  - 局部记忆
  - 覆盖率检索
  - 多锚融合
  key_numbers:
  - ECCV 2026
  media:
  - https://zhangyuejoslin.github.io/images/anchorweaver_teaser.mp4
  - https://zunwang1.github.io/AnchorWeave/long_videos/alley.mp4
  links:
  - https://arxiv.org/abs/2602.14941
  - https://zunwang1.github.io/AnchorWeave
  note: 直接给"全局 3D 融合会累积跨视角不对齐"的反证，可作为我们放弃持久全局表示的依据之一。
  arxiv: '2602.14941'
  explain: 想象摄像机沿着街道前进：若把所有旧画面硬压进一张地图，位置和远近估错一点，街景就会糊成彼此打架的几何。AnchorWeave要解决的，正是视频生成时记忆越多、场景结构反而越不可靠的问题。它不再做一份包打天下的全局记忆，而是沿着目标镜头轨迹，挑出能覆盖当前视野的局部记忆块；“覆盖率驱动”就是优先取能补足眼前区域的信息。生成时，多锚编织控制器再把这些记忆块当作多个参照点，逐步调和它们的位置对齐误差。这样既不必让一处错误污染整张场景，也能让不同画面共享的结构彼此衔接。论文发表于ECCV
    2026。
  detail:
    position: AnchorWeave 解决 camera-controllable video generation 在长时间跨度下难以保持空间世界一致性的问题。它避免将多视角几何融合成可能含噪的全局记忆，转而使用多个局部几何记忆并在生成时协调它们。
    io: 输入包括历史视频形成的局部几何记忆和目标相机轨迹，输出为受相机控制的视频。生成时的条件信号包括按目标轨迹检索的局部记忆，以及多锚编织控制器对这些记忆的整合结果。
    steps:
    - 从历史多视角信息构建多个局部几何记忆，而不将它们融合为单一全局场景，以避免位姿和深度误差累积成噪声几何。
    - 根据目标相机轨迹进行覆盖率驱动的局部记忆检索，以选出与生成路径相关的记忆。
    - 将检索到的多个局部记忆交给多锚编织控制器，以在生成过程中调和不同视角间的几何不一致。
    - 依据这些局部几何条件生成受相机控制的视频，以改善长时段场景一致性并维持视觉质量。
    formulas:
    - tex: C(M_i,\tau)=\frac{1}{T}\sum_{t=1}^{T}\mathbf{1}\left[\mathrm{vis}(M_i,t)\right],\qquad
        \mathcal{R}(\tau)=\operatorname{TopK}_{M_i} C(M_i,\tau)
      caption: 按目标相机轨迹计算局部记忆覆盖率并检索 Top-K；标准写法，非原文
    - tex: \alpha_{t,i}=\operatorname{softmax}_{i}\!\left(\frac{q_t^{\top}k_i}{\sqrt{d}}+\lambda
        C(M_i,\tau)\right),\qquad z_t=\sum_{M_i\in\mathcal{R}(\tau)}\alpha_{t,i}v_i
      caption: 生成时按内容相关性与轨迹覆盖率加权协调多个局部锚点；标准写法，非原文
    train: 摘要未给训练流程、推理细节或关键设置。
    diff: 已有 memory-based 方法通常从融合后的全局 3D 场景渲染 anchor videos，再以其条件化生成；AnchorWeave 改为检索多个局部几何记忆，并通过多锚控制器在生成时协调它们。
    limits: 未见明确说明
    has_abstract: true
- id: worldstereo
  title: WorldStereo
  date: '2026-03-02'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 微调
  status: 速读
  one_liner: 增量点云+空间立体记忆双模块
  mechanism: 全局几何记忆用增量更新点云注入粗结构先验并锁相机；空间立体记忆用 3D 对应约束注意力感受野，从记忆库取细粒度细节，生成结果可直接重建 3D。
  tags:
  - 增量点云
  - 立体记忆
  - 可重建
  key_numbers:
  - 透视/全景图输入
  - 摘要未给帧数
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2603.02049
  note: 走"生成即可重建"路线，与 GEN3C 同族但记忆拆成粗点云+细立体两级；training=微调为摘要"基于蒸馏 VDM 主干、无需联合训练"的推断。
  arxiv: '2603.02049'
  explain: 想象镜头沿着房间缓缓前进：门的位置不能忽左忽右，墙上的纹理也不能每转一次就变样。视频世界模型常会丢失这种空间连续性，画面看着连贯，重建成三维时却可能对不上。WorldStereo把透视图或全景图输入后，分别维护两种记忆：全局几何记忆用增量点云，也就是逐步累积的三维点，保存场景轮廓并约束相机位置；空间立体记忆则用三维对应关系限制注意力，让模型从记忆库取回细节。前者稳住大结构，后者补足局部纹理，因此生成画面既更一致，也能直接重建为三维场景。
  detail:
    position: WorldStereo 旨在解决 Video Diffusion Models 生成视频难以精确控制相机、且不同视角内容不一致，因而难以重建一致
      3D 场景的问题。它通过几何记忆模块连接相机引导视频生成与 3D 重建。
    io: 输入可从透视图像或全景图像开始，并以相机轨迹作为控制信号。输出是在相机控制下生成的多视角一致视频，可用于高质量 3D 场景重建。
    steps:
    - 根据输入图像和相机轨迹建立全局几何记忆，并增量更新点云，以提供粗结构先验并精确控制相机。
    - 将点云等几何信息用于生成过程，减少视角变化时场景结构与内容的不一致。
    - 通过空间立体记忆中的 3D 对应关系约束注意力感受野，使模型从记忆库检索细粒度细节。
    - 生成受相机轨迹控制且多视角一致的视频，并据此进行 3D 重建。
    formulas:
    - tex: \mathcal{P}_t=\operatorname{Fuse}\!\left(\mathcal{P}_{t-1},\operatorname{BackProj}(I_t,\mathbf{T}_t,D_t)\right)
      caption: 标准写法，非原文：利用当前图像、相机位姿与深度反投影结果增量更新全局几何记忆中的点云。
    - tex: \mathbf{A}_{ij}=\operatorname{softmax}_j\!\left(\frac{\mathbf{q}_i\mathbf{k}_j^{\top}}{\sqrt{d}}+\log\mathbf{1}\!\left[\lVert\mathbf{x}_i-\mathbf{x}_j\rVert<\epsilon\right]\right),\qquad
        \mathbf{y}_i=\sum_j\mathbf{A}_{ij}\mathbf{v}_j
      caption: 标准写法，非原文：利用记忆中三维对应点约束注意力感受野，并从空间立体记忆检索细粒度特征。
    train: 摘要称 WorldStereo 采用 flexible control branch，利用经过 distribution matching distillation
      的 VDM backbone，无需 joint training。具体训练数据、损失函数及推理参数摘要未给。
    diff: 相较于缺少几何记忆、难以保证跨视角一致性的生成方法，WorldStereo 同时使用增量点云进行全局几何控制，并用 3D 对应关系约束空间立体记忆中的注意力。其控制分支可利用蒸馏后的
      VDM backbone，无需联合训练。
    limits: 未见明确说明
    has_abstract: true
- id: evoworld
  title: EvoWorld
  date: '2025-10-01'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 训练
  status: 速读
  one_liner: 全景生成+演进式显式3D记忆
  mechanism: 先出帧，再用前馈即插即用 transformer 增量演进 3D 重建，把重建几何重投影到目标视角作条件；建含闭环检测的长程基准。
  tags:
  - 全景生成
  - 演进重建
  - 闭环检测
  key_numbers:
  - 单张全景图输入
  - 含闭环检测的评测集
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2510.01183
  - https://github.com/JiahaoPlus/EvoWorld
  note: 有开源代码与闭环评测，可作几何泳道"重访一致性"实验参照。
  arxiv: '2510.01183'
  explain: 想象你站在一间屋子的中央，先拍下一张全景图，再让镜头一路转动。只靠逐帧生成，墙角和门的位置可能慢慢跑偏，走回原处时，房间也未必还像原来。EvoWorld从单张全景图出发，先生成新画面，再用前馈式即插即用变换器逐步更新三维重建，也就是场景的空间几何记忆；随后把记忆投影到下一视角，作为生成条件。这样每一帧都能借用已有的空间信息，减少长视频里的几何漂移。论文还建立了长程评测集，加入闭环检测，即判断镜头是否回到曾经到过的位置，用来检验模型能否认出并保持场景一致。
  detail:
    position: EvoWorld 解决从单张全景图出发进行长时程环境探索时，生成视频容易出现空间不一致的问题。它将全景视频生成与不断演进的显式 3D 记忆结合，以维持跨视角和长轨迹的场景一致性。
    io: 输入是一张全景图，输出是面向未来视角的全景视频帧。生成过程使用细粒度视角控制，并以演进式 3D 重建的几何重投影作为空间条件信号。
    steps:
    - 以输入全景图为起点，使用带细粒度视角控制的视频生成器生成未来帧，为后续探索提供视频内容。
    - 根据生成的帧，使用前馈 plug-and-play transformer 增量演进场景的 3D 重建，以维护随探索更新的显式空间记忆。
    - 将演进式 3D 重建的几何投影到目标视角，形成空间条件并用于合成后续未来帧，以提升视觉真实感和几何一致性。
    - 在合成新帧后继续更新 3D 记忆，使其支持长轨迹探索及闭环场景的一致性评估。
    formulas:
    - tex: \hat{V}_{t+1:t+K}=G_{\theta}\!\left(V_{0:t},\,\Pi(M_t,\,\mathcal{C}_{t+1:t+K})\right)
      caption: 利用当前显式 3D 记忆投影得到的空间条件，生成目标视角下的未来视频帧；标准写法，非原文
    - tex: M_{t+1}=\operatorname{Update}\!\left(M_t,\operatorname{Lift}\!\left(\hat{V}_{t+1:t+K},D_{t+1:t+K},\mathcal{C}_{t+1:t+K}\right)\right)
      caption: 将生成帧及其深度信息反投影到世界坐标并增量更新显式 3D 记忆；标准写法，非原文
    train: 摘要未给训练流程、损失函数或关键训练设置。推理时先生成未来帧，再演进 3D 重建，并将重建几何重投影为后续视频合成的条件信号。
    diff: 区别于仅合成视频的既有方法，EvoWorld 将演进式显式 3D 重建作为视频生成的空间引导，并通过几何重投影为目标视角提供空间线索。论文还提出覆盖合成户外环境、Habitat
      室内场景和真实场景的长程探索基准，强调闭环检测与空间连贯性。
    limits: 未见明确说明
    has_abstract: true
- id: geo-context
  title: Geometry-as-context
  date: '2026-02-25'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 训练
  status: 速读
  one_liner: 3D几何当上下文训进生成器
  mechanism: 自回归相机控制生成器交替估计当前视角几何、重建并渲染新视角图；训练时把几何图与 RGB 混编成序列并随机丢弃几何，推理只出 RGB，另加相机门控注意力。
  tags:
  - 几何上下文
  - 相机门控
  - 往返轨迹
  key_numbers:
  - CVPR 2026
  - 往返（forth-and-back）轨迹
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2602.21929
  note: 把几何当"中间上下文 token"而非外部库，是显式几何库与上下文两条路的缝合；已验证往返轨迹场景。
  arxiv: '2602.21929'
  explain: 想象镜头绕桌上的茶壶转一圈，转回原位时壶嘴却变了方向，桌面纹理也对不上；视频生成器常难既听懂相机怎么动，又让场景在新视角下保持一致。Geometry-as-context把三维几何——描述物体位置与形状的空间线索——当作生成上下文：模型随相机移动，交替估计当前视角的几何，再据此重建、渲染新视角图像。训练时，它把几何图和RGB图像（红、绿、蓝三色画面）混成序列，并随机拿掉几何，让模型学会借助几何、又不依赖显式几何；推理时只生成图像。相机门控注意力会按镜头运动筛选信息。空间结构因此能约束外观变化，减少视角漂移。论文发表于CVPR
    2026，并用镜头先离开、再返回的往返轨迹检验模型能否认出同一场景。
  detail:
    position: 本文研究沿相机轨迹生成与三维场景一致的视频，目标是减少已有方法因中间结果错误、非可微流程及模型分离而累积的误差。核心思路是将场景几何作为生成过程中的上下文。
    io: 输入是文本上下文和相机轨迹，模型在生成过程中还使用当前视角的几何信息。输出包括用于三维重建的几何估计，以及由场景渲染并修复的新视角 RGB 图像；推理时目标是生成
      RGB 图像。
    steps:
    - 根据当前视角和相机条件估计重建所需的几何，以便构建场景的三维表示。
    - 利用估计的几何重建三维场景，并按相机轨迹模拟新视角图像，以获得符合目标视角的场景内容。
    - 恢复渲染得到的新视角图像，减轻渲染结果与生成图像之间的差异。
    - 将几何估计和新视角图像生成作为自回归循环中的交替任务，并通过 camera gated attention 强化模型对相机位姿的利用。
    formulas:
    - tex: G_t = f_{\mathrm{geo}}(I_{<t}, c_{\le t}),\quad \tilde I_t = \mathcal{R}(G_{\le
        t}, c_t),\quad I_t = f_{\mathrm{rgb}}(\tilde I_t, c_t)
      caption: 标准写法，非原文；表示自回归生成中交替估计几何、按当前相机位姿渲染新视角并生成 RGB 图像。
    train: 训练时以文本上下文指定生成几何图像或 RGB 图像，并将文本、图像与几何交错组成序列；训练中随机丢弃几何上下文，使模型推理时能够只生成 RGB。推理时使用自回归相机控制生成器，迭代估计当前视角几何并模拟、恢复新视角图像。摘要未给具体损失函数或训练配置。
    diff: 不同于依赖外部记忆的生成方法，也不同于迭代进行三维重建与修复的流程，本文在同一个自回归相机控制生成框架中交替处理几何估计和新视角生成。它通过几何上下文和
      camera gated attention 提升场景一致性与相机控制能力。
    limits: 未见明确说明
    has_abstract: true
- id: gim-world
  title: 'GIM-World: Geometry-Aware Implicit Memory for Video World Models'
  date: '2026-06-01'
  lane: 几何位姿寻址
  branch: 位姿视锥
  training: 训练
  status: 速读
  one_liner: 隐式记忆令牌可被相机位姿查询
  mechanism: 轻量 transformer 把变长历史压成定长记忆令牌；训练时用相机可查询几何头从冻结基础模型蒸馏 3D 结构进令牌，信息引导剪枝控编码成本，教师推理时丢弃。
  tags:
  - 隐式记忆
  - 相机查询
  - 几何蒸馏
  key_numbers:
  - MIND 基准
  - 摘要未给具体数值
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2606.02436
  - https://gim-world.github.io/
  note: 折中路线：记忆是隐式定长令牌，但被显式约束成可被位姿查询——正是"参数化"与"几何"两泳道的交叉点。
  arxiv: '2606.02436'
  explain: 机器人走进房间，转身后还要知道桌子在身后，而不只是记得画面。视频世界模型把漫长历史压缩成有限状态，普通压缩容易丢掉物体间的空间关系，令新视角预测失准。GIM-World用轻量Transformer（一种整合序列信息的网络）把变长历史压成定长记忆令牌；训练时，几何头按相机位姿（位置与朝向）查询令牌，并让它们模仿参数固定的基础模型提供的三维结构。信息引导剪枝优先保留有用内容，降低编码成本；推理时，教师模型可以丢弃，不增加额外负担。这样，记忆既紧凑，又能按视角找回几何线索。论文在MIND基准上评测，摘要未给具体数值。
  detail:
    position: 这篇工作解决视频 world model 在长时序 rollout 中，历史观测离开上下文窗口后难以保留场景信息的问题。它重点让压缩后的隐式记忆保留跨视角
      3D 几何，从而提升长期几何与视觉一致性。
    io: 输入是变长的视频历史，记忆可由相机位姿查询几何信息。输出是固定大小的 memory tokens，供视频 world model 在长时序生成中使用；摘要未说明其他条件信号。
    steps:
    - 将变长历史输入轻量 transformer encoder，压缩为固定大小的 memory tokens，以控制记忆表示的规模。
    - 训练时使用 camera-queryable geometry head，从冻结 foundation model 蒸馏 3D 场景结构到记忆令牌，以增强跨视角几何信息。
    - 随历史增长应用 information-guided pruning，筛除信息贡献较低的内容，以控制编码成本。
    - 推理时移除 geometry teacher，保留轻量记忆模块供 world model 使用，以降低部署负担。
    formulas:
    - tex: M_t = \operatorname{Enc}_{\theta}(H_{\le t}) \in \mathbb{R}^{K \times d}
      caption: 将变长历史压缩为固定数量的记忆令牌；标准写法，非原文
    - tex: \mathcal{L}_{\mathrm{geo}} = \mathbb{E}_{c}\!\left[\left\|G_{\phi}(M_t,c)-G_{\mathrm{teacher}}(H_{\le
        t},c)\right\|_2^2\right]
      caption: 以相机查询几何头匹配冻结基础模型提供的几何监督；标准写法，非原文
    train: 训练时由轻量 transformer 将历史压缩为固定大小令牌，并通过 camera-queryable geometry head 将冻结
      foundation model 提供的 3D 结构蒸馏进记忆；information-guided pruning 用于限制历史增长时的编码成本。推理时丢弃
      geometry teacher。摘要未给具体损失函数、训练数据设置或超参数。
    diff: 相比显式保存帧或在线 3D 重建的记忆方式，它采用紧凑的隐式记忆，避免直接依赖启发式检索或重建结果。相比既有隐式记忆，它显式约束令牌编码跨视角场景几何，并使几何信息可由相机位姿查询。
    limits: 摘要未见明确说明方法局限；训练阶段需要冻结 foundation model 和几何头，具体计算代价未给出。
    has_abstract: true
- id: infinite-world
  title: Infinite-World
  date: '2026-02-02'
  lane: 几何位姿寻址
  branch: 容量管理
  training: 训练
  status: 速读
  one_liner: 无位姿层级压缩记忆撑到千帧
  mechanism: 层级无位姿记忆压缩器递归把历史 latent 蒸馏进固定预算并与主干联合优化；动作标签做三态离散化抗噪声位姿；再用 30 分钟重访密集集微调激活闭环。
  tags:
  - 无位姿
  - 固定预算
  - 层级压缩
  key_numbers:
  - 1000+ 帧
  - 30 分钟重访微调集
  media:
  - https://rq-wu.github.io/projects/infinite-world/assets/videos/teaser.mp4
  - https://rq-wu.github.io/projects/infinite-world/assets/videos/82_A_street_in_a_fantasy_city_whe_button.mp4
  links:
  - https://arxiv.org/abs/2602.02393
  note: 明确回避显式几何先验（真实视频位姿噪声大），用固定预算压缩替代 3D 库，是容量管理分支的强基线。
  arxiv: '2602.02393'
  explain: 想象你边走边拍一段很长的探险录像：走过的地方越来越多，脑子却不能无限扩容；若忘了先前场景，回头时就认不出路。Infinite-World 要解决的正是视频世界模型记忆有限、难以持续生成并重访场景的麻烦。它用层级记忆压缩器，把过去的潜在表示——模型内部对画面的精简编码——一层层蒸馏进固定容量的记忆，并与生成主干一起训练。记忆不依赖精确位姿，也就是相机的位置与朝向；动作标签则被简化成三种状态，减少位姿噪声带来的误导。这样，模型能省下记忆空间，又不必依赖不可靠的坐标。再用包含密集重访的30分钟数据微调，让模型练习回到旧场景、接上先前经历，最终把生成延伸到1000帧以上。
  detail:
    position: Infinite-World 解决真实复杂环境视频中的长时视觉记忆与交互一致性问题，目标是在超过 1000 帧的序列中保持视觉连贯。它针对真实视频位姿估计噪声和视角重访稀少导致的训练困难，避免依赖显式几何先验。
    io: 输入为真实环境视频及连续运动信息，模型将历史视频编码为 latent，并利用动作信号作为条件生成后续视觉内容。输出为可交互的未来视觉帧；动作条件经不确定性感知标注后离散化。
    steps:
    - 将历史视频编码为 latent，并由 Hierarchical Pose-free Memory Compressor 递归压缩历史 latent 到固定预算，以控制长序列记忆成本。
    - 将压缩记忆与生成主干联合优化，使模型能够依据远距离历史生成内容，同时不依赖显式几何先验。
    - 对连续运动进行不确定性感知的三态动作标注，降低噪声轨迹对确定性动作空间的污染，以提升动作响应学习的鲁棒性。
    - 使用紧凑的 30 分钟重访密集数据集进行微调，以激活模型的长程闭环能力。
    formulas:
    - tex: M_t = \mathcal{C}_{\theta}(M_{t-1}, Z_t), \qquad M_t \in \mathbb{R}^{B
        \times d}
      caption: 历史 latent 的递归压缩与固定预算记忆更新；标准写法，非原文
    - tex: a_t = \begin{cases} -1, & \Delta_t < -\tau \\ 0, & |\Delta_t| \leq \tau
        \\ +1, & \Delta_t > \tau \end{cases}
      caption: 基于阈值将运动变化离散为三态动作标签；标准写法，非原文
    train: 训练时将记忆压缩器与生成主干联合优化，并以不确定性感知的三态动作标签利用原始视频数据；之后使用 30 分钟重访密集数据集微调。推理时通过固定预算的层级记忆支持长程生成，具体推理算法和其他训练设置摘要未给。
    diff: 不同于依赖干净合成数据、准确位姿或显式几何先验的做法，Infinite-World 面向含噪真实视频，通过无位姿层级记忆压缩和三态动作标注处理长程记忆与动作监督问题。它还用重访密集微调激活闭环能力。
    limits: 摘要未见明确说明具体计算代价、适用范围限制或失败情形；固定预算记忆压缩旨在限制计算成本，但摘要未给出预算大小或开销数据。
    has_abstract: true
- id: decmem
  title: DecMem
  date: '2026-05-29'
  lane: 几何位姿寻址
  branch: 容量管理
  training: 训练
  status: 速读
  one_liner: 稀疏全局+锚定局部解耦记忆
  mechanism: 指出朴素可学习记忆的两病（算力、注意力弥散），拆成稀疏全局记忆做细粒度历史访问与锚定局部记忆稳外推，超显式 3D 与粗帧级隐式两类基线。
  tags:
  - 解耦记忆
  - 注意力弥散
  - 稀疏全局
  key_numbers:
  - 分钟级长视频
  media: []
  links:
  - https://arxiv.org/abs/2605.31336
  - https://jeffreyyzh.github.io/DecMem-Page
  note: 其"注意力弥散"分析可直接引用来论证为何纯注意力式历史路由在长程会退化。
  arxiv: '2605.31336'
  explain: 想象模型要续写一段几分钟的视频：既得翻遍漫长历史找细节，又不能让旧信息挤成一团，导致未来画面漂移。朴素的可学习记忆把两件事都压在一起，既耗算力，也容易让注意力分散。DecMem把记忆拆成两种：稀疏全局记忆像索引，按需访问细粒度历史；锚定局部记忆像眼前的参照物，稳住后续画面的外推。两者分工后，模型既能回看关键细节，又不丢当前变化的方向，因此更适合生成分钟级长视频。论文还在两类基线上验证：直接表示三维场景的显式方法，以及用粗略帧级特征记忆的隐式方法。
  detail:
    position: 本文针对长时程视频生成中细粒度时空一致性难以维持的问题，提出 DecMem，以支持分钟级、可控且一致的世界生成。
    io: 输入为用于生成的历史视频信息及控制条件，具体输入形式和条件信号类型摘要未给出；输出为具有长时程时空一致性的视频。
    steps:
    - 分析朴素可学习记忆在长时程外推中的计算低效与注意力弥散问题，为记忆结构解耦提供依据。
    - 构建 Sparse Global Memory，以稀疏方式访问全局历史，兼顾历史信息的细粒度检索与计算效率。
    - 构建 Anchored Local Memory，通过锚定局部记忆稳定外推并维持生成质量。
    - 在视频生成中结合两类记忆，以支持长时程的可控生成与时空一致性。
    formulas:
    - tex: \operatorname{SGM}(q_t)=\sum_{i\in\operatorname{TopK}(s_{t,i})}\frac{\exp(s_{t,i})}{\sum_{j\in\operatorname{TopK}(s_{t,j})}\exp(s_{t,j})}\,v_i,\qquad
        s_{t,i}=\frac{q_t^{\top}k_i}{\sqrt{d}}
      caption: 稀疏全局记忆的 Top-K 检索与注意力聚合；标准写法，非原文
    - tex: \operatorname{ALM}(q_t)=\operatorname{Attn}\!\left(q_t,\,[K_{a};K_{t-w:t-1}],\,[V_{a};V_{t-w:t-1}]\right)
      caption: 锚定局部记忆结合锚点与近期窗口进行局部注意力；标准写法，非原文
    train: 摘要未给出训练流程、推理流程及关键设置。
    diff: DecMem 将记忆解耦为 Sparse Global Memory 和 Anchored Local Memory，分别面向高效访问全局历史与稳定高质量外推。相较显式
      3D 记忆和粗帧级隐式建模，也针对朴素可学习记忆的计算低效与注意力弥散进行设计。
    limits: 摘要未见明确说明 DecMem 的代价与局限。
    has_abstract: true
- id: memory-forcing
  title: Memory Forcing
  date: '2025-10-03'
  lane: 几何位姿寻址
  branch: 容量管理
  training: 训练
  status: 速读
  one_liner: 几何索引空间记忆+训练课程
  mechanism: 点→帧检索把当前可见点映射回源帧取历史，增量维护显式 3D cache；混合训练让探索靠时序记忆、重访靠空间记忆，链式前向训练扩大位姿变化。
  tags:
  - 点帧检索
  - 3D缓存
  - 训练课程
  key_numbers:
  - Minecraft 场景
  - 摘要未给帧数
  media: []
  links:
  - https://arxiv.org/abs/2510.03198
  note: 少见的"训练课程 + 记忆分工"设计，解释了空间记忆在探索段反而拖累生成质量这一现象，对我们做混合策略有参考。
  arxiv: '2510.03198'
  explain: 想象你在 Minecraft 里绕过一座山，又从另一侧走回村庄：如果模型忘了先前看见的房屋位置，重访时画面就可能对不上。Memory Forcing要解决的正是长视频生成中的空间遗忘，让世界在探索和回头时保持连贯。它把看见过的场景存进可增量更新的三维记忆库；几何索引就是按空间位置查找记忆。当前画面中的点能映射回它曾出现的源帧，模型便可取回那段历史。训练时，探索阶段主要依靠连续画面记忆，重访阶段则练习调用空间记忆；链式前向训练还逐步拉大视角变化。这样模型既能接续眼前运动，也能认出旧地方。论文在
    Minecraft 场景中测试，摘要未给出帧数。
  detail:
    position: Memory Forcing 解决自回归视频扩散模型在长序列游戏生成中难以同时保持新场景生成质量与重访区域空间一致性的问题。它通过几何索引的空间记忆及配套训练策略，让模型在探索与重访时利用不同记忆。
    io: 输入包括当前可见内容与历史信息，历史信息可来自有限上下文中的时序记忆和几何索引的空间记忆；输出为自回归生成的视频内容。具体控制信号及其表示方式摘要未给。
    steps:
    - 从生成过程中的观测增量构建并更新显式 3D cache，为后续重访提供空间信息。
    - 将当前可见点映射到其源帧，并检索对应历史帧，使模型能获取与当前视野相关的记忆。
    - 通过 Hybrid Training 设置探索和重访等不同 gameplay regimes，引导模型探索时依赖时序记忆、重访时结合空间记忆。
    - 通过 Chained Forward Training 进行模型 rollout，使链式预测产生更大的位姿变化，从而训练模型利用空间记忆维持一致性。
    - 在自回归生成中结合当前上下文与检索到的空间记忆，并持续更新 3D cache，以支持长序列生成。
    formulas:
    - tex: \mathcal{R}_t=\operatorname{TopK}_{(\mathbf{X}_i,\,f_i)\in\mathcal{C}_{t-1}}\left(-\lVert\mathbf{X}_t-\mathbf{X}_i\rVert_2^2\right),\qquad
        \widetilde{\mathbf{h}}_t=\operatorname{Attn}\!\left(Q(\mathbf{h}_t),K(\mathcal{R}_t),V(\mathcal{R}_t)\right)
      caption: 根据当前可见 3D 点从显式空间记忆中检索相关源帧，并通过注意力聚合历史记忆；标准写法，非原文
    - tex: \mathcal{C}_t=\mathcal{C}_{t-1}\cup\left\{\left(\mathbf{X}_{t,k},\,f_t,\,\mathbf{z}_{t,k}\right)\right\}_{k\in\mathcal{V}_t},\qquad
        \mathbf{X}_{t,k}=\Pi^{-1}\!\left(\mathbf{u}_{t,k},d_{t,k};\,\mathbf{T}_t\right)
      caption: 由当前观测的增量深度与位姿反投影得到世界坐标，并持续更新显式 3D cache；标准写法，非原文
    train: 训练包括 Hybrid Training 和 Chained Forward Training：前者让模型适应探索与重访时不同的记忆使用方式，后者将模型
      rollout 接入自回归训练，并利用链式预测形成更大的位姿变化。推理时通过 Point-to-Frame Retrieval 检索历史，并通过 Incremental
      3D Reconstruction 维护和更新显式 3D cache。具体损失函数、训练数据、超参数及推理设置摘要未给。
    diff: 相较于仅依赖时序记忆的方法，Memory Forcing 使用几何索引的空间记忆增强重访时的一致性；相较于直接加入空间记忆的做法，它通过 Hybrid
      Training 区分探索与重访，并用 Chained Forward Training 鼓励模型在位姿变化时有效利用空间记忆。
    limits: 摘要指出空间记忆可能使模型过度依赖不足的空间上下文，从而损害新场景生成质量；Hybrid Training 用于应对这一权衡。具体计算开销、适用边界及其他局限未见明确说明。
    has_abstract: true
- id: spatial-ttt
  title: Spatial-TTT
  date: '2026-03-12'
  lane: 参数化记忆
  branch: 测试时训练
  training: 训练+测试时训练
  status: 速读
  one_liner: fast weights 组织空间证据
  mechanism: 用 TTT 更新部分参数承载长程空间证据；大块更新并行+滑窗注意力；3D 时空卷积做空间预测，稠密 3D 描述数据引导写入。
  tags:
  - 快权记忆
  - 大块更新
  - 空间预测
  key_numbers:
  - 视频空间基准SOTA
  - 摘要未给具体数值
  media: []
  links:
  - https://arxiv.org/abs/2603.12255
  - https://liuff19.github.io/Spatial-TTT
  note: 参数化记忆泳道里最贴"空间结构化写入"的一篇；关键问题是条目间的空间组织方式（3D 卷积 + 稠密描述监督）。
  arxiv: '2603.12255'
  explain: 想象机器人看着一段长视频：杯子被人拿起、移到桌角，模型得记住它的位置，才能判断接下来会怎样。普通方法难以留住远处画面的空间线索，若反复处理全部历史，计算又很费。Spatial-TTT用“快速权重”存证据：一部分模型参数会随视频输入更新，像一本可改写的记事本。它把大块更新并行处理，再用滑动窗口注意力聚焦近期画面；三维时空卷积从连续画面中预测空间变化，稠密三维描述数据则帮助挑选该写入的线索。这样既能保留长程空间信息，也能控制计算量，在视频空间基准上达到当前最佳表现；摘要未给出具体分数。
  detail:
    position: Spatial-TTT 解决长视频流中如何持续选择、组织并保留 3D 空间证据的问题，目标是提升长时程视频空间理解能力。其重点不是单纯扩大上下文窗口，而是让模型通过
      test-time training 持续更新部分参数。
    io: 输入是连续的视频帧；模型输出用于空间理解的空间证据或预测，具体任务输出形式摘要未说明。稠密 3D 空间描述用于引导空间信息写入，摘要未说明推理时是否需要额外条件信号。
    steps:
    - 将视频帧送入混合架构，并通过滑动窗口注意力处理局部时序信息，以控制长视频处理开销。
    - 按大块并行更新 TTT 层中的 fast weights，使其逐步承载和组织跨较长时间范围的空间证据。
    - 在 TTT 层加入基于 3D 时空卷积的空间预测机制，促使模型学习帧间几何对应关系与时间连续性。
    - 利用稠密 3D 空间描述数据引导 fast weights 的更新，使全局 3D 空间信号得到结构化记忆。
    formulas:
    - tex: W_{t+1}^{\mathrm{fast}}=W_t^{\mathrm{fast}}-\eta\nabla_{W_t^{\mathrm{fast}}}\mathcal{L}_{\mathrm{3D}}\!\left(\operatorname{Conv3D}(X_{t-k:t};W_t^{\mathrm{fast}}),\,Y_{t-k:t}^{\mathrm{3D}}\right)
      caption: 标准写法，非原文：通过 3D 时空预测损失在测试时递归更新 fast weights，使其持续写入长程空间证据。
    - tex: \mathcal{L}_{\mathrm{3D}}=\frac{1}{|\Omega|}\sum_{(x,y,z)\in\Omega}\left\|\hat{S}_{t}(x,y,z)-S_{t}^{\mathrm{3D}}(x,y,z)\right\|_{2}^{2}
      caption: 标准写法，非原文：利用稠密 3D 空间描述监督时空卷积预测结果，约束帧间几何对应关系与时间连续性。
    train: 摘要说明构建了稠密 3D 空间描述数据，用于引导模型更新 fast weights；未给出训练目标、优化细节或关键超参数。推理时面向视频流处理，采用滑动窗口注意力与大块并行
      TTT 更新；具体更新频率和推理设置摘要未给。
    diff: 相较于仅依赖更长上下文窗口的做法，Spatial-TTT 通过 test-time training 更新部分参数来保留长程空间证据。它还结合大块并行更新、滑动窗口注意力、3D
      时空空间预测机制及稠密 3D 描述数据来组织空间信息。
    limits: 摘要未见明确说明计算与显存代价、长时间运行时 fast weights 的管理方式，以及稠密 3D 描述数据的构建成本。
    has_abstract: true
- id: loger
  title: LoGeR
  date: '2026-03-03'
  lane: 参数化记忆
  branch: 测试时训练
  training: 训练
  status: 速读
  one_liner: 参数化TTT锚全局坐标防漂移
  mechanism: 分块处理，块内用双向先验；跨块靠混合记忆——参数化 TTT 记忆锚定全局坐标系防尺度漂移，滑窗注意力保未压缩上下文做高精对齐。
  tags:
  - TTT记忆
  - 坐标锚定
  - 混合记忆
  key_numbers:
  - 128帧训练→数千帧推理
  - KITTI ATE -74%
  - 19k 帧序列
  media:
  - https://LoGeR-project.github.io/files/loger_teaser_vid.mp4
  - https://LoGeR-project.github.io/files/loger_teaser_vid_lowres.mp4
  links:
  - https://arxiv.org/abs/2603.03269
  note: 3D 重建而非视频生成，但"参数化记忆负责全局锚、滑窗负责局部精度"的分工可直接搬到长视频记忆设计。
  arxiv: '2603.03269'
  explain: 想象一台摄像机沿着很长的走廊前进：每一步位置只差一点，走到尽头却可能把尺度和方向都估偏。长视频模型也有这类麻烦，逐段预测会累积误差，短视频训练又难以支撑数千帧推理。LoGeR把视频切成小块，在每块内部利用前后画面共同判断运动；块与块之间则混合两种记忆：参数化的测试时训练记忆像地图基准，持续锚定全局坐标、抑制尺度漂移；滑动窗口注意力保留最近、未压缩的画面，帮助精细对齐。一个管整体，一个管细节，因此模型可用128帧训练、推理数千帧；在KITTI数据集上，估计轨迹与真实轨迹的误差降低74%，还处理了19,000帧序列。
  detail:
    position: LoGeR 旨在解决 feedforward 几何基础模型处理分钟级长视频时，二次注意力复杂度或循环设计有效记忆有限所造成的扩展瓶颈。目标是在无需后处理优化的情况下，实现长序列稠密
      3D 重建，并保持跨片段的全局一致性。
    io: 输入是按时间顺序的视频流，摘要未说明其他条件信号。输出是视频序列的稠密 3D 重建结果，要求在长时间跨度上保持全局坐标与尺度一致。
    steps:
    - 将视频流切分为多个 chunk，以分块方式处理长序列，避免直接对整段视频进行高开销的全局注意力计算。
    - 在每个 chunk 内利用强双向先验进行重建，以获得高保真的局部几何推理结果。
    - 跨 chunk 使用参数化 Test-Time Training 记忆锚定全局坐标系，以抑制尺度漂移。
    - 同时使用 Sliding Window Attention 保留未压缩的邻近上下文，以提高相邻 chunk 间的对齐精度。
    - 结合局部重建与混合记忆逐块处理后续视频，使模型能将训练于短序列的能力推广到更长推理序列。
    formulas:
    - tex: \theta_t=\theta_{t-1}-\eta\nabla_{\theta}\mathcal{L}_{\mathrm{TTT}}(\theta_{t-1};x_t)
      caption: 参数化测试时记忆的梯度更新；标准写法，非原文
    - tex: \operatorname{Attn}(q_i,K,V)=\operatorname{softmax}\!\left(\frac{q_iK_{\mathcal{N}(i)}^{\top}}{\sqrt{d_k}}\right)V_{\mathcal{N}(i)},\quad
        \mathcal{N}(i)=\{j:|i-j|\le w\}
      caption: 滑动窗口注意力聚合邻近上下文；标准写法，非原文
    train: 模型在长度为 128 帧的序列上训练；推理时可泛化到数千帧。摘要未给出训练损失、优化器、批量大小或具体推理设置。评测包括标准基准和重新利用的
      VBR 数据集，后者包含最长 19k 帧的序列。
    diff: 相较于依赖全局注意力或有限循环记忆的既有方法，LoGeR 以分块处理结合参数化 TTT 记忆和非参数化 Sliding Window Attention，分别维护全局坐标稳定性与局部精细对齐。摘要报告其在
      KITTI 上的 ATE 相较先前 feedforward 方法降低超过 74%。
    limits: 摘要未见明确说明计算、显存或运行时间代价，也未说明在不同场景或数据分布下的局限。
    has_abstract: true
- id: mem3r
  title: Mem3R
  date: '2026-04-08'
  lane: 参数化记忆
  branch: 测试时训练
  training: 训练
  status: 速读
  one_liner: 跟踪用fast-weight，建图用显式状态
  mechanism: 相机跟踪用 MLP 形式的 fast-weight 记忆经 TTT 在线更新，几何建图用显式定长 token 状态，把跟踪与建图解耦，缓解压缩记忆的漂移与遗忘。
  tags:
  - 跟踪建图解耦
  - 定长状态
  - 显存恒定
  key_numbers:
  - 793M→644M 参数
  - ATE -39%
  - 500-1000 帧
  media:
  - https://lck666666.github.io/Mem3R/static/videos/mem3r_video2.mp4
  - https://lck666666.github.io/Mem3R/static/videos/stanford_arch_fixed.mp4
  links:
  - https://arxiv.org/abs/2604.07279
  - https://lck666666.github.io/Mem3R/
  note: 给出"哪类信息适合写权重（位姿）、哪类适合显式存（几何）"的直接证据，对我们的记忆分工很有说服力。
  arxiv: '2604.07279'
  explain: 想象机器人在陌生楼道里边走边画地图：走得越久，越容易忘记先前看过什么，位置也会慢慢偏掉。Mem3R要解决的正是长视频中的定位漂移和记忆遗忘。它把两件事分开做：相机跟踪靠快速权重记忆，也就是能随新画面在线调整的轻量网络；几何建图则保留固定长度的显式状态，直接存下场景结构。在线调整采用测试时训练（TTT），让记忆随着视频更新。这样，跟踪能灵活适应新画面，地图又不必挤进易压缩、易遗忘的记忆里，两者互相牵制的问题因此减轻。论文报告，模型参数从7.93亿降到6.44亿，绝对轨迹误差降低39%，并能处理500到1000帧的视频。
  detail:
    position: Mem3R 解决长视觉流中的流式 3D 感知问题，重点缓解循环模型在长序列中因压缩记忆容量有限而产生的相机漂移与时间遗忘。它通过将相机跟踪与几何建图分开处理，提升长序列上的时间一致性。
    io: 输入是连续视觉帧，输出包括相机跟踪结果与几何重建表示；摘要未提及额外条件信号。
    steps:
    - 接收连续视觉帧并进行流式处理，以支持长序列上的增量 3D 感知。
    - 用轻量 MLP 形式的 fast-weight memory 跟踪相机，并通过 Test-Time Training 在线更新，以改善跟踪的时间一致性。
    - 用显式的定长 token 状态维护几何建图信息，以保留地图表示并控制状态规模。
    - 将跟踪记忆与建图状态分开更新，以缓解漂移累积和长期遗忘。
    formulas:
    - tex: \theta_t=\theta_{t-1}-\eta\nabla_{\theta}\mathcal{L}_{\mathrm{TTT}}\!\left(f_{\theta_{t-1}}(x_t),x_t\right)
      caption: 标准写法，非原文：利用当前帧的测试时训练损失在线更新相机跟踪 MLP 的 fast weights。
    - tex: M_t=\operatorname{Update}(M_{t-1},z_t),\qquad |M_t|=K
      caption: 标准写法，非原文：将当前帧特征写入定长几何地图 token 状态，状态规模保持为 K。
    train: 摘要称 fast-weight MLP 在推理时通过 Test-Time Training 在线更新；未提供训练流程、损失函数或其他关键训练设置。
    diff: 相较于 CUT3R，Mem3R 将相机跟踪的隐式 fast-weight memory 与几何建图的显式定长 token 状态解耦。摘要称其长序列表现更好，模型参数量从
      793M 降至 644M，并可结合 TTT3R 等状态更新策略。
    limits: 摘要未见明确说明具体局限；模型采用固定大小状态，并报告保持恒定 GPU 内存使用量和相近推理吞吐。
    has_abstract: true
- id: mit3
  title: MIT^3 - Memory Internalization via Test-Time Training
  date: '2026-10-17'
  lane: 参数化记忆
  branch: 写权重
  training: 测试时训练
  status: 速读
  one_liner: 把整段长视频写进每视频适配参数
  mechanism: 因果追踪测每层对视频问答的因果记忆效用，据此选写入位置；视觉记忆蒸馏让纯文本记忆复现相关片段引起的表示变化，实现无视频输入问答。
