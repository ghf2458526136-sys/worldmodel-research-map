  note: 报告只给到月份 2025-10，未给提交日；training=免训依 §11『VMem（插件）』与矩阵『免训插件』。
  tags:
  - Surfel索引
  - 渲染投票
  explain: 想象你在大房子里到处拍照，现在要从新角度作画，最头疼的就是从成百上千张旧照片里找出哪几张拍到了眼前的桌角。VMem解决的就是检索参考视角太慢的麻烦。它的招数是把索引直接贴在三维表面：在场景中铺设叫面元（带朝向的微小圆盘）的单元，记下看过它的历史帧号。查询时把视野内的面元投影到虚拟低清屏幕上，让每个像素投票选出得票最高的前几个视图。这招管用在于把全局盲搜变成了局部的几何投票，直接排除视线遮挡，不用遍历无关历史，换来约12倍提速。
  key: true
  detail:
    position: VMem 解决视频生成器在交互式探索环境时难以长期保持场景一致性的问题。它用几何索引检索相关历史视图，避免依赖不断累积误差的三维重建或过短的上下文窗口。
    io: 输入包括已存储的历史视图及其 surfel 几何信息，以及生成新视图时的相机位姿条件。输出是筛选出的相关历史视图，供视频生成器生成与场景一致的新视图。
    steps:
    - 从历史视图中提取 surfel，并记录其位置、法线、半径及观测到它的帧号，以建立基于三维表面的记忆索引。
    - 根据待生成视图的相机位姿，将相关 surfel 投影到虚拟低分辨率屏幕，以估计它们对当前视角的关联。
    - 对屏幕像素上的帧号进行直方图投票并选出 top-K 历史视图，以集中检索与当前视角最相关的记忆。
    - 将检索到的历史视图作为生成上下文，以较低的上下文计算成本生成新视图并维持场景连贯性。
    formulas:
    - tex: \mathbf{u}_s=\Pi\!\left(T_{cw}\mathbf{p}_s\right),\qquad H(k)=\sum_{\mathbf{u}\in\Omega}\sum_{s:\,\mathbf{u}_s=\mathbf{u}}\mathbf{1}[k\in
        I_s]
      caption: 将 surfel 投影到虚拟屏幕，并按其观测帧号对屏幕像素进行直方图投票；标准写法，非原文
    - tex: \mathcal{K}=\operatorname{TopK}_{k}\,H(k)
      caption: 按投票分数选取最相关的 top-K 历史视图；标准写法，非原文
    train: 训练流程与关键设置摘要未给。推理时依据相机位姿进行 surfel 投影和逐像素帧号直方图投票，检索 top-K 历史视图作为生成上下文。
    diff: 与逐步外绘二维视图并累积重建三维几何的做法不同，VMem 直接以 surfel 建立历史视图的几何索引。与使用短上下文窗口的视频生成器不同，它按当前视角检索相关历史视图，并避免将全部历史视图都作为上下文。
    limits: 摘要指出使用全部历史视图作为上下文计算成本较高，VMem 通过相关视图检索降低成本；未见明确说明其他局限。
    has_abstract: true
