  self_measured:
  - 35s
  media:
  - https://research.nvidia.com/labs/sil/projects/WorldTrace/videos/appendix/worldtrace-landmark/aba/1/ours.mp4
  - https://research.nvidia.com/labs/sil/projects/WorldTrace/videos/appendix/worldtrace-field/ours.mp4
  links:
  - https://arxiv.org/abs/2608.07408
  note: 只给到月份 2026-08；同论文自带基准 LoopBench/LoopMem（TempSSIM、PAC）未单列条目；§3.0 称 demos/WorldTrace
    共 9 段，报告只点名 3 个文件。
  tags:
  - 槽位重编号
  - Field分组均值
  - Landmark原帧
  explain: 就像在图书馆查旧档案，资料本身没坏，但页码太大超出了目录索引，导致管理员根本查不到。这篇论文发现模型处理三千帧长视频时，记忆失效的首因不是特征内容坏了，而是位置编码也就是标记时间先后的门牌号失效越界。它的招数是只重写位置不改内容：在槽位也就是缓存格里，为历史分配模型见过的虚拟门牌号；同时用Field保存淘汰帧均值作为背景概要，用Landmark按余弦阈值留住关键原帧。这招管用在于把越界地址拉回了安全区间，既不破坏原始特征，又能让模型稳稳认出长期记忆。
  key: true
  detail:
    position: WorldTrace 解决交互式视频世界模型在长时序 rollout 中无法可靠检索早期视觉记忆的问题。它将失效归因于 RoPE 时间位置超出训练分布造成的地址失效，并在不改写记忆内容的前提下为压缩槽分配分布内虚拟位置。
    io: 输入是交互式视频生成过程中产生的帧及其 KV cache，输出是可供后续生成检索的压缩视觉记忆。条件信号包括模型注意力范围内的槽序号，以及 Landmark
      方法用于检测场景转变的余弦相似度阈值；摘要未说明其他条件信号。
    steps:
    - 从 KV cache 中保留当前注意力范围内的内容，并为压缩记忆槽按槽序号分配分布内虚拟位置，以避免长时序 RoPE 地址偏移超出训练范围。
    - 对被淘汰帧的 key 做分组均值，形成 WorldTrace-Field 记忆，以压缩历史并维持时间连贯性。
    - 检测场景转变，并按余弦相似度阈值选择需要保存的原帧，形成 WorldTrace-Landmark 记忆，以支持离开后重访场景时的情节回忆。
    - 在后续 rollout 中通过可寻址的压缩 cache 检索相关视觉记忆，支持长时序生成中的视觉持续性。
    formulas:
    - tex: t_s=q-(L_{\mathrm{attn}}-1-s)
      caption: 按压缩槽序号 s 为记忆槽分配分布内虚拟位置，其中 q 和注意力范围参数 L_{\mathrm{attn}} 的具体定义摘要未给。
    train: WorldTrace 是 training-free 框架，无需重新训练。推理时在生成过程中维护并压缩 KV cache，为记忆槽分配虚拟位置；Field
      采用被淘汰帧 key 的分组均值，Landmark 在检测到场景转变时存储原帧。其他推理设置摘要未给。
    diff: 与直接延长 RoPE 时间位置或在已旋转的 RoPE 空间中压缩 cache 的做法不同，WorldTrace 将记忆槽重新映射到分布内虚拟位置，并避免把位置相位不兼容的内容直接平均。它还分别提供面向时间连贯性的
      Field 和面向场景重访的 Landmark。
    limits: 摘要未见明确说明计算与存储代价、阈值选择方式及适用模型范围。
    has_abstract: true
- id: r2m-bench
  title: R2M-Bench
  date: '2026-08-01'
  precision: month
  arxiv: '2608.27328'
  venue: ''
  lane: 评测基准
  branch: ''
  parent: null
  link_strength: null
  training: 不适用
  status: 速读
  one_liner: 300 实例跨 7 模型的回访基准，指标 NMR
  mechanism: 不涉及记忆机制；用同 rollout 校准的 NMR 衡量回溯，覆盖 300 实例、7 个模型。
  key_numbers:
  - 300 实例
  - 7 模型
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2608.27328
  note: 报告只在 §5.1 表格给了一行，无日期。
  tags:
  - 同rollout校准
  - NMR指标
  explain: 就像我们出门发现忘带钥匙得折返回家拿一样，智能体做任务时也常常需要走回头路，但大家一直没有一把尺子来测它们回头折返的能力。这篇文章做了一个叫
    R2M-Bench 的评测基准，覆盖了 300 个任务实例和 7 个模型。它用模型同一次完整执行（也就是 rollout）进行校准，提出了衡量回溯水平的归一化指标
    NMR。这招管用在于它完全不涉及额外的记忆机制，而是拿同轨迹自身当对照排除了干扰，公平看清了不同模型在面对复杂环境时自主折返的真实水平。
  detail:
    position: R2M-Bench 解决回访帧相似度可能被误读为记忆能力的问题，因为相似也可能来自 rollout 变化很少。它用同一 rollout
      内的对照估计一般时间稳定性，从而衡量回访特有的一致性。
    io: 输入为参考场景及其 leave-and-return 轨迹帧，评测对象是生成这些轨迹的 action-conditioned video world
      models。输出包括外观保真度、场景与物体身份、局部几何、持久状态等维度的回访一致性分数，以及 MemoryGain 和 NMR；动作是轨迹的条件信号。
    steps:
    - 对 rollout 检测离开后返回的时刻，确定每个回访帧对，以形成待评测的回访样本。
    - 在同一 rollout 中为回访帧对选取 gap-matched non-revisit pair，估计一般时间稳定性，避免把缓慢变化误当作回访记忆。
    - 再选取 short-range pair 估计短时一致性，为后续归一化提供短时到时间基线的动态范围。
    - 比较回访对与两类对照对，计算 MemoryGain 和 NMR，以分离回访优势与一般时间稳定性。
    - 在多个评测维度上汇总分数，并用于比较模型表现及其与人类一致性判断的相关性。
    formulas:
    - tex: \mathrm{MG}=S_{\mathrm{revisit}}-S_{\mathrm{baseline}}
      caption: MemoryGain，表示回访一致性相对 gap-matched 时间基线的一致性优势。
    - tex: \mathrm{NMR}=\frac{S_{\mathrm{revisit}}-S_{\mathrm{baseline}}}{S_{\mathrm{short}}-S_{\mathrm{baseline}}}
      caption: Normalized Memory Ratio，将回访优势按短时一致性与时间基线之间的动态范围归一化。
    train: 这是评测基准，不是摘要所述的模型训练方法。摘要未给训练流程与具体推理设置；摘要说明该基准评测 7 个 action-conditioned video
      world models。
    diff: 与依赖绝对回访相似度的做法不同，R2M-Bench 同时使用同一 rollout 内的 gap-matched non-revisit pair
      和 short-range pair 作相对校准。摘要报告这种校准降低了分数与生成运动之间的相关性，减轻慢动作带来的捷径影响。
    limits: 摘要未明确说明检测回访、构造配对和各评测维度打分的具体实现细节；相对校准依赖同一 rollout 中可用的有效对照样本。
    has_abstract: true
- id: octworld
  title: OctWorld
  date: '2026-09-01'
  precision: month
  arxiv: '2609.03919'
  venue: ''
  lane: 几何位姿寻址
  branch: 显式几何库
  parent: vmem
  link_strength: dashed
  training: 需训
  status: 速读
  one_liner: L4 显式几何缓存类长视频世界模型
  mechanism: 报告只把它列入 L4 显式几何缓存（与 GEN3C、spmem 同类），未述读写细节；该类依赖深度估计。
  key_numbers: []
  self_measured: []
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2609.03919
  note: 仅摘要级【摘】，引用前须核对；只给到月份 2026-09；training=需训为按 L4 类推断。
  tags:
  - 显式几何缓存
  - 深度依赖
  explain: 就像你在虚拟房间里漫步，一回头却发现身后的门变形甚至消失了，长视频世界模型在漫游生成时常有前后空间错乱的麻烦。OctWorld 用的招数是显式几何缓存，也就是通过深度估计——估算物体离镜头有多远——把看过的三维结构像建档一样实实在在地存起来。这招管用，是因为它不再单靠模型去硬背模糊的二维画面，而是用真实的三维几何做底子；后续镜头不管怎么兜圈子回头，画面都能对照存好的空间骨架来画，场景自然不会变形穿帮。
  detail:
    position: OctWorld 面向长距离、广视角的相机路径生成，解决生成场景在回访已见区域时难以保持空间一致性的问题。它通过持久化 3D 几何记忆，支持从单张图像自回归生成可探索的场景视频。
    io: 输入为单张图像和用户指定的相机轨迹，生成沿轨迹展开的视频。相机轨迹是条件信号；生成过程还使用视觉观测及其对应的深度图构建和更新 3D 记忆。
    steps:
    - 以单张图像为起点，按照用户指定的相机轨迹逐步生成视觉观测，以形成沿路径延展的场景视频。
    - 为生成的视觉观测获取对应深度图，并将观测与深度信息用于构建场景的几何和外观记忆。
    - 将新观测通过 TSDF fusion 融合到动态稀疏八叉树 OctMap 中，以渐进扩展全局 3D 表示。
    - 根据图像证据自适应调整八叉树空间分辨率，以在不同场景尺度下保留细节并控制记忆开销。
    - 在后续生成中利用持久化的空间记忆应对已生成区域的回访，以提升长程视频的空间一致性。
    formulas:
    - tex: D_t(v)=\frac{W_{t-1}(v)D_{t-1}(v)+w_t(v)d_t(v)}{W_{t-1}(v)+w_t(v)},\qquad
        W_t(v)=W_{t-1}(v)+w_t(v)
      caption: 标准写法，非原文：利用新观测的有符号距离 d_t(v) 对体素 v 的 TSDF 几何记忆进行加权融合。
    - tex: \operatorname{split}(v)=\mathbf{1}\!\left[\operatorname{Var}_{x\in v}\bigl(d(x)\bigr)>\tau_{\mathrm{geom}}\
        \lor\ \operatorname{Var}_{x\in v}\bigl(I(x)\bigr)>\tau_{\mathrm{app}}\right]
      caption: 标准写法，非原文：依据局部几何或外观证据的变化，自适应细分八叉树节点以保留细节并控制记忆开销。
    train: 摘要未给出训练流程、损失函数或关键训练设置。推理时从单张图像出发，沿用户指定的相机轨迹进行稳定自回归生成，并渐进更新 OctMap；具体记忆读写细节摘要未给。
    diff: 关键差别是使用 TSDF fusion 与空间分辨率自适应的动态稀疏八叉树构建持久化 3D 记忆，而非点式缓存或固定分辨率 TSDF 体。摘要报告该设计在长程空间一致性和记忆开销方面有优势。
    limits: 该类显式几何缓存依赖深度估计，深度误差可能影响几何记忆；摘要未明确说明深度获取方式、计算代价及其他局限。
    has_abstract: true
- id: solarwm
  title: SolarWM
  date: '2026-09-01'
  precision: month
  arxiv: '2609.02886'
  venue: ''
  lane: 训练侧
  branch: 三段训练
  parent: null
  link_strength: null
  training: 需训
  status: 速读
  one_liner: 三段式训练把 5s 训练推到 60min 长程
  mechanism: 只讲训练流程：双向适应→teacher-forced 自回归→DMD 蒸馏；相机条件用 fused-PRoPE，记忆结构未描述。
  key_numbers:
  - 5B–33B
  - 5s
  - 60min
  - 1.43M clips
  - 约 25TB
  self_measured: []
  media:
  - https://junchao-cs.github.io/SolarWM-Web/assets/icons/easy.png
  links:
  - https://arxiv.org/abs/2609.02886
  note: §2 表列为可跑模型、§3.6 又归训练侧，lane 按 §3.6 填；报告只给到月份 2026-09。
  tags:
  - 三段式训练
  - fused-PRoPE
  explain: 就像教新手开车，如果平时只练五秒起步，直接让他上一小时高速，车子很快就会失控撞墙。以前模型在 1.43M clips、约 25TB 数据上只练
    5 秒，推到长程就会彻底崩溃。SolarWM 在 5B 到 33B 规模上提出三段式训练：先做双向适应，即让前后帧互相参考打底；再做教师强制自回归，也就是拿真实画面纠偏学预测；最后用
    DMD 蒸馏，即把慢速去噪压缩为一步出图的加速法，结合融合位置编码输入相机位姿。这种阶梯式进阶彻底控制了误差累积，稳稳把 5 秒短片推到了 60 分钟长程。
  detail:
    position: SolarWM 解决异构数据集与不同视频生成骨干难以统一处理的问题，目标是构建可复现、可扩展的交互式视频世界模型基础。其核心是统一数据处理与训练接口，并让模型保留各自骨干的原生表示和目标。
    io: 输入包括视频观察、metric camera geometry 与 captions 等数据，推理时以视频观察和相机条件驱动生成。输出是支持交互的因果视频模型，可进行分钟到小时级的长程
      rollout。
    steps:
    - 将 10 个数据集的片段整理为帧对齐的统一数据契约，纳入视觉观察、metric camera geometry、captions、质量元数据、筛选决策和数据来源，以统一异构监督。
    - 通过可重配置的数据引擎解耦各数据源处理与训练混合，并使用共享相机条件接口接入不同视频骨干，以支持一致的数据构建和比较。
    - 对骨干进行双向适应，并以 fused-PRoPE 提供相机条件，使模型适配世界模型任务并保留原生表示与训练目标。
    - 进行 teacher-forced 自回归初始化，把模型训练为因果生成形式，为交互式 rollout 做准备。
    - 使用 distribution matching distillation 蒸馏模型，使仅在 5s 序列上训练的模型支持分钟到小时级长程生成。
    formulas:
    - tex: \nabla_\theta L_{\mathrm{DMD}}=\mathbb{E}_{c,z,t}\!\left[w(t)\bigl(s_{\mathrm{student}}(x_t,t,c)-s_{\mathrm{target}}(x_t,t,c)\bigr)\nabla_\theta
        x_\theta\right]
      caption: 分布匹配蒸馏的标准梯度写法，非原文；以学生分布与目标分布的 score 差异更新生成器
    train: 训练采用三阶段流程：双向适应、teacher-forced 自回归初始化、distribution matching distillation。统一相机条件、训练和推理接口下实例化了
      4 个 5B–33B 模型，基于 Wan2.2、LTX-2.5 和 MiniMax-H3，并保留各骨干的原生表示与目标。模型在 5s 序列上训练后，可进行分钟到小时级
      rollout；更具体的训练超参数与推理设置摘要未给。
    diff: 相较于直接混合异构数据或为每个模型单独实现训练流程，SolarWM 使用统一的数据契约和共享接口，同时保留不同骨干的原生表示与目标。它还以三阶段训练流程将短序列训练扩展到长程因果生成。
    limits: 摘要未报告训练与推理的计算成本、各模型效果差异或长程 rollout 的具体质量指标；记忆结构也未描述。
    has_abstract: true
- id: honeycomb
  title: Honeycomb
  date: '2026-09-01'
  precision: month
  arxiv: '2609.37690'
  venue: ''
  lane: 训练侧
  branch: 恒定上下文
  parent: null
  link_strength: null
  training: 需训
  status: 速读
  one_liner: 恒定容量槽位＋显式锚点的代表
  mechanism: 报告只在 L3『恒定槽位』与趋势 4『恒定容量+显式锚点』两处点名，未述寻址键与读写细节。
  key_numbers: []
  self_measured: []
  media:
  - https://jackswl.github.io/honeycomb/resources/revisit/living_honeycomb.mp4
  - https://jackswl.github.io/honeycomb/resources/revisit/living_spatia.mp4
  links:
  - https://arxiv.org/abs/2609.37690
  note: 摘要级；lane 无报告依据（L3 表头写『按位置或几何寻址』），存疑；只给到月份 2026-09。
  tags:
  - 恒定槽位
  - 显式锚点
  explain: 这就像把随手乱堆的杂物箱，换成了一排贴着固定门牌的储物柜。模型处理长内容时，记忆往往会随文本变长而无休止膨胀，导致资源吃紧且难以定位。Honeycomb
    的做法是采用恒定容量槽位和显式锚点。这里的恒定容量槽位，指不论输入多长都大小固定的记忆格子；显式锚点则像是在序列里立起清晰可见的参照标桩。这招之所以管用，在于锁死槽位容量能把内存开销控制在确定边界内，而明确的锚点给模型提供了可靠的对照坐标，防止信息在压缩中丢失相对位置。
  detail:
    position: Honeycomb 解决长时视频生成中场景记忆随生成过程不断增长、难以维持固定存储开销的问题。它用固定大小的 HexMemory 保存空间与时空特征，以支持后续生成时对场景的持续记忆和重访一致性。
    io: 输入是当前新生成的视频 chunk 和已有的 HexMemory；输出是更新后的 HexMemory，以及 reader 检索出的 latents，用于条件化后续视频生成。摘要未说明其他条件信号。
    steps:
    - Feed-forward writer 只处理当前新 chunk，将其映射为新的 plane 特征，以避免反复处理完整历史。
    - 当空间覆盖范围或时间范围扩展时，对已有 planes 进行 warp 并保持其维度不变，以在固定容量内对齐记忆。
    - 将 warp 后的旧 planes 与新特征进行 confidence-weighted pooling，并通过 learned residual correction
      融合信息，以更新记忆。
    - Reader 从更新后的 HexMemory 检索 latents，作为条件信号输入后续视频生成，以维持场景一致性。
    formulas:
    - tex: \widetilde{M}_t=\frac{c_o\odot\mathcal{W}(M_{t-1})+c_n\odot F_t}{c_o+c_n+\varepsilon},\qquad
        M_t=\widetilde{M}_t+R_\theta\!\left(\widetilde{M}_t,\mathcal{W}(M_{t-1}),F_t\right)
      caption: 标准写法，非原文：以置信度加权融合 warp 后的旧记忆与当前 chunk 特征，再经 learned residual correction
        更新固定容量记忆。
    train: 摘要未给训练流程与关键设置。推理时，writer 处理新 chunk 并更新 HexMemory，reader 从记忆中检索 latents
      以条件化后续生成。
    diff: 相较于累积 RGB observations 或 latent features 的空间记忆，HexMemory 用固定大小的低秩表示存储特征，由六个空间与时空
      planes 组成，存储量在生成期间保持恒定。它还通过 warp、confidence-weighted pooling 和 learned residual
      correction 融合新旧记忆；摘要未说明寻址键或显式锚点的具体实现。
    limits: 摘要未见明确说明具体代价与局限；记忆更新依赖对已有 planes 的 warp 和融合，但其误差影响与适用边界未给出。
    has_abstract: true
- id: mosaichunk
  title: MosaiChunk
  date: '2026-10-01'
  precision: month
  arxiv: '2610.02153'
  venue: ''
  lane: 内容学习寻址
  branch: 学习路由
  parent: longlive-rag
  link_strength: dotted
  training: 免训
  status: 精读
  one_liner: 学习路由器挑时空块 KV 拼成马赛克上下文
  mechanism: 历史切成时空小块各留 KV，生成时由轻量路由器判断需要哪几块并拼接；推理主干完全冻结。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.02153
  note: training=免训指主干冻结、仅训路由器；矩阵将其放在『几何/位姿』行并标『学习路由』，寻址实际由学习路由器决定，lane 存疑；自带 RememBench
    未单列；只给到月份 2026-10。
  tags:
  - 时空块KV
  - 学习路由器
  explain: 就像看监控抓小偷，我们不用把几十个小时的录像全倒进脑子，只要挑出关键的几个画面拼在一起看。这篇论文解决的具体麻烦，正是大模型处理长视频时，保留所有历史会让显存直接撑爆。它用的招数是把历史切成许多时空小块，各自保留KV，也就是模型算好的记忆缓存；生成回答时，由一个轻量路由器，即专门负责筛选的小网络，判断需要哪几块并拼成马赛克上下文。这招管用在于推理主干完全冻结，既不用重新训练也不破坏原有能力，只把最核心的信息精准拼接起来，大幅减轻了显存负担。
  detail:
    position: MosaiChunk 解决长时程自回归视频生成中，历史内容超出有限上下文后，物体或场景再次出现时细节难以保持的问题。它通过检索历史视觉信息提升重访内容的一致性。
    io: 输入包括当前生成所需的文本提示或相机条件，以及历史时空块保存的 KV；输出是延续生成的视频。生成器利用路由器选出的历史 KV，且推理时生成器保持冻结。
    steps:
    - 将历史视频划分为空间与时间上的小块并保存各块的 KV，以便后续访问细粒度历史视觉信息。
    - 轻量路由器根据当前生成需求，从历史块中选择要保留的 KV，并遵守固定的活动记忆预算，以控制可用上下文规模。
    - 将选中的非连续历史 KV 拼接成时空马赛克上下文，并与当前生成条件一起输入冻结的视频生成器，以延续视频并恢复相关细节。
    formulas:
    - tex: \mathcal{S}_t=\operatorname{TopK}_{\mathcal{I}\subseteq\{1,\ldots,N\},\,\sum_{i\in\mathcal{I}}c_i\le
        B}\sum_{i\in\mathcal{I}}s(q_t,h_i)
      caption: 在固定活动记忆预算下选择历史块；标准写法，非原文
    - tex: (K_t^{\mathrm{mos}},V_t^{\mathrm{mos}})=\operatorname{Concat}_{i\in\mathcal{S}_t}(K_i,V_i)
      caption: 将选中的历史块 KV 拼接为时空马赛克上下文；标准写法，非原文
    train: 训练时保持视频生成器冻结，仅学习轻量路由器来决定固定活动记忆预算下纳入马赛克的历史区块。推理时选择历史 KV 并拼接后交给冻结生成器；具体训练目标、优化细节及预算数值摘要未给。
    diff: 不同于滑动窗口只保留近期上下文，也不同于整块检索，MosaiChunk 可从不连续的历史时空区块中选择 KV 并组合成马赛克。它不微调生成器，而是学习轻量路由器，并在匹配记忆预算下评估重访一致性。
    limits: 需要保存历史区块的 KV，并进行路由选择与拼接；其具体存储和计算代价、路由器局限及其他限制未见明确说明。
    has_abstract: true
- id: smi
  title: SMI
  date: '2026-10-01'
  precision: month
  arxiv: '2610.02521'
  venue: ''
  lane: 内容学习寻址
  branch: 理解模型管理
  parent: longlive-rag
  link_strength: dotted
  training: 免训
  status: 精读
  one_liner: 多模态大模型管记忆的增删与检索
  mechanism: 四个原子操作串成管理流程：空间聚类、簇内稀疏化、动作感知检索、可靠性过滤；生成器一行代码不改。
  key_numbers:
  - 四个原子操作
  self_measured: []
  media:
  - https://spatial-memory-intelligence.github.io/assets/teaser.png
  links:
  - https://arxiv.org/abs/2610.02521
  note: 只给到月份 2026-10；报告提醒每次管理都要调用大模型，开销与延迟高。
  tags:
  - 四原子操作
  - 大模型管记忆
  explain: 想象机器人把沿途拍的照片全塞进抽屉，翻找时不仅头疼还经常拿错。SMI解决的就是多模态大模型面对海量连续画面时，记忆臃肿且难以调用的麻烦。它的做法是完全不改生成器代码，用一套管理流程串联四个原子操作，也就是不可分割的基础动作：按位置归拢画面的空间聚类、同堆剔除重复的簇内稀疏化、结合当前行为翻找的动作感知检索，以及排除杂质的可靠性过滤。它管用是因为从源头挤干了画面水分，找记忆时又有动作意图带路，不用动原模型就能轻松提取干净高效的经验。
  detail:
    position: SMI 解决长视频 world model 中记忆序列变长、结构复杂后，长程空间上下文难以管理的问题。它用多模态理解模型系统化管理空间记忆，以提升生成稳定性和空间一致性。
    io: 输入是历史记忆序列及当前用户动作，动作作为检索相关记忆的条件信号。输出是经过管理的记忆，供原有生成器使用；生成器本身无需修改。
    steps:
    - 按空间关系对记忆进行空间聚类，将相关内容组织成簇，以形成更有结构的空间上下文。
    - 在每个簇内进行稀疏化，减少冗余记忆，以控制记忆规模。
    - 依据当前动作进行动作感知检索，选取与后续生成相关的记忆，以保留任务所需上下文。
    - 进行可靠性过滤，筛除不可靠记忆，以降低其对生成稳定性和空间一致性的影响。
    formulas:
    - tex: s(m_i,a_t)=\operatorname{sim}\bigl(f_m(m_i),f_a(a_t)\bigr),\qquad \mathcal{M}_t^{\mathrm{ret}}=\operatorname{TopK}_{m_i\in\mathcal{M}}s(m_i,a_t)
      caption: 动作感知记忆检索的标准写法，非原文
    - tex: \mathcal{M}_t^{\mathrm{keep}}=\{m_i\in\mathcal{M}_t^{\mathrm{ret}}:r(m_i)\geq\tau\}
      caption: 基于可靠性分数阈值过滤记忆的标准写法，非原文
    train: 摘要未给出训练流程与关键设置。推理时由多模态理解模型执行记忆管理，再将管理后的记忆交给原有生成器；生成器无需修改。
    diff: 不同于未系统化处理长程空间记忆的做法，SMI 将空间聚类、簇内稀疏化、动作感知检索和可靠性过滤整合为记忆管理流程。它把多模态理解模型用于记忆管理，而不改动生成器。
    limits: 未见明确说明
    has_abstract: true
- id: smart
  title: SMART
  date: '2026-10-01'
  precision: month
  arxiv: '2610.19257'
  venue: ''
  lane: 几何位姿寻址
  branch: 位姿视锥
  parent: vmem
  link_strength: dotted
  training: 需训
  status: 精读
  one_liner: 按空间槽召回：写用观测相机，读用渲染相机
  mechanism: 槽位数固定；写入按观测相机定归属、读取按当前渲染相机定取哪些槽；每份记忆附置信度，由 DiT 决定信多少。
  key_numbers:
  - 256 帧
  self_measured:
  - 帧 418
  - 52.25s
  - 79.6s
  - 100.7s
  - 95s
  - 39.05dB
  - 34.53dB
  - 28.67dB
  - 帧 240
  - 19.37dB
  - 16.60dB
  - 14.73dB
  - 188s
  - 54.6s 1024×256
  - 226s 1024×256
  media:
  - https://eren-cetin.github.io/SMART/static/videos/memory_maze/L0401_ep000001/gt.mp4
  - https://eren-cetin.github.io/SMART/static/videos/memory_maze/L0401_ep000001/ours.mp4
  - https://eren-cetin.github.io/SMART/static/videos/memory_maze/L0401_ep000001/dfot.mp4
  - https://eren-cetin.github.io/SMART/static/videos/memory_maze/L0401_ep000001/causal.mp4
  - https://eren-cetin.github.io/SMART/static/videos/minecraft/cc_0000088/ours.mp4
  links:
  - https://arxiv.org/abs/2610.19257
  note: 所有 PSNR 都是报告作者在官方 demo 视频上自算，非论文指标（报告明确禁止当论文表格引用）；只给到月份 2026-10。
  tags:
  - 观测相机写
  - 渲染相机读
  - 置信度门控
  explain: 想象你在大房子里边走边拍，如果把沿途画面按时间硬塞在一起，生成长达256帧视频时模型就会把位置记混。SMART要解决的就是漫游时空间记忆混乱的麻烦。它的招数是按固定槽位存记忆，也就是把场景划成几个固定的虚拟储物格；写入时按当时的观测相机机位存进对应格子里，生成时按当前渲染相机位置定向翻找，且每条记忆都带置信度，由负责生成画面的DiT扩散网络决定采信多少。这招管用是因为它打破了死板的时间顺序，让调取记忆直接锁定空间位置，转回原处就能精准对齐。
  key: true
  detail:
    position: SMART 解决长时视频生成中的记忆矛盾：记忆需要容量有界以支持持续生成，又要能在相机重返旧地点时找回相关观察。它用空间寻址的槽位记忆实现位置相关的召回，而不依赖记忆新旧。
    io: 输入包括观察到的视频内容及其观测相机信息，以及生成时的渲染相机信息；输出是由 chunk-causal diffusion transformer
      生成的视频内容。观测相机用于写入寻址，渲染相机用于读取寻址，读取结果及其置信度作为生成条件。
    steps:
    - 将记忆组织为固定数量的槽位并以递归方式更新，使存储容量保持有界。
    - 依据观测相机为新观察选择写入槽位，使记忆归属与观察到的空间区域相关。
    - 依据当前渲染相机查询相关槽位，使召回取决于视角间的空间关系而非时间间隔。
    - 为读取到的记忆估计置信度，并将内容与置信度提供给生成模型，使模型能够判断何时信任记忆。
    - 由 chunk-causal diffusion transformer 结合检索内容和自身生成先验生成视频块，使记忆不足以支持的位置仍可由模型生成。
    formulas:
    - tex: a_k(q)=\frac{\exp\!\left(-\|p(q)-\mu_k\|_2^2/(2\sigma^2)\right)}{\sum_{j=1}^{K}\exp\!\left(-\|p(q)-\mu_j\|_2^2/(2\sigma^2)\right)},\qquad
        \widetilde M(q)=\sum_{k=1}^{K}a_k(q)M_k
      caption: 按当前相机位置对固定槽位进行空间寻址并聚合记忆；标准写法，非原文
    train: 摘要未给训练目标、训练数据细节或具体训练流程。推理时按渲染相机读取记忆，将检索内容及置信度交给 chunk-causal diffusion
      transformer；摘要称其在长轨迹上可超出训练时长保持高保真召回，并保持常数记忆与每步开销。
    diff: 相比基于重建的记忆，SMART 不构建显式 3D 表示，也不维护持续增长的缓存。相比固定大小的递归记忆，其召回由相机所指向的空间区域寻址，而不是随时间推移衰减。
    limits: 摘要未见明确说明具体局限；其方案依赖观测相机与渲染相机信息来寻址记忆。
    has_abstract: true
- id: velox
  title: Velox
  date: '2026-10-01'
  precision: month
  arxiv: '2610.22311'
  venue: ''
  lane: 几何位姿寻址
  branch: 位姿视锥
  parent: null
  link_strength: null
  training: 免训
  status: 精读
  one_liner: 视锥 slab 裁注意力，只算几何重叠的历史
  mechanism: 把当前相机视锥切成若干几何 slab，用它们判断哪些历史片段有空间交集；命中的才进注意力，其余跳过。
  key_numbers:
  - 0.15 分（WBench 精度损失）
  - 约 4.36 倍（chunk 48 注意力加速）
  - 约 2.43 倍（整体去噪加速）
  self_measured: []
  media:
  - https://media.velox-world.com/velox/videos/thumbs/clip_01.jpg
  links:
  - https://arxiv.org/abs/2610.22311
  note: 只给到月份 2026-10；报告称官方交互 demo 无 mp4 可下载。
  tags:
  - 视锥slab
  - 几何重叠筛选
  explain: 想象你拿着相机在房间转圈拍摄，如果每生成新的一帧，都要把身后看不见的旧画面翻出来算一遍关联，计算量会直接卡死。Velox解决的就是这种冗余开销。它把相机的视锥——也就是镜头能看到的锥形视野空间——横切成若干被称为slab的几何薄层，用它们判断哪些历史片段在三维里存在空间交集。只有交集命中的内容才进入注意力计算，其余全部跳过。因为视线外的死角本就无需交互，这种几何裁切在chunk
    48下让注意力加速约4.36倍，整体去噪加速约2.43倍，而WBench精度仅损失0.15分。
  detail:
    position: Velox 解决 chunked video diffusion 在长时交互生成中因 KV cache 随 rollout 增长而导致注意力和生成逐渐变慢的问题。它根据流式几何关系选择历史上下文，以减少需要计算的注意力。
    io: 输入包括当前视频块的相机视锥、历史块及模型为各层得到的 block importance。输出是供注意力计算使用的历史 block 路由；相机几何与深度提供条件信号。
    steps:
    - 将历史块表示为带深度区间的 camera frustum slabs，以建立历史内容的空间范围。
    - 通过 recency-priority multiwarp 获取当前块的深度，用于判断当前视锥区域与历史 slabs 的对应关系。
    - 对几何覆盖充分的区域，利用 frustum slab overlap 软调节各层的模型派生 block importance，以保留空间相关的历史上下文。
    - 对几何未覆盖的区域，沿用模型派生的路由而不加入几何偏置，避免缺少几何对应时强行筛选。
    - 按固定 token-block 粒度执行路由，使筛选结果适配 FlashAttention 风格的分块执行，并减少随 rollout 增长的注意力计算。
    formulas:
    - tex: O_{ij}=\frac{\operatorname{Vol}(C_i\cap H_j)}{\operatorname{Vol}(C_i)}
      caption: 标准写法，非原文：计算当前视锥 slab \(C_i\) 与历史 slab \(H_j\) 的归一化空间重叠度。
    - tex: \tilde{s}_{\ell j}=s_{\ell j}+\lambda\,\mathbf{1}[i]\;O_{ij},\qquad \mathcal{R}_{\ell}=\operatorname{TopK}_{j}(\tilde{s}_{\ell
        j})
      caption: 标准写法，非原文：用几何重叠度软调节模型派生的重要性分数，并按分数选择历史块；无几何覆盖时不加几何偏置。
    train: Velox 是 training-free 方法，无需训练。推理时异步构建 frustum slabs，并与 denoising 在同一张 H200
      上并行；摘要报告在 chunk 48 时 attention 加速 4.36 倍、denoising 加速 2.43 倍。
    diff: 不同于让后续块持续读取不断增长的 KV cache，Velox 使用 frustum slab 几何对应关系进行 region-level context
      selection，并以软方式调节模型派生的重要性。几何未覆盖区域仍使用原有模型路由，不施加几何偏置。
    limits: 摘要未见明确说明方法的局限或额外代价。
    has_abstract: true
- id: hla-wm
  title: HLA-WM
  date: '2026-10-01'
  precision: month
  arxiv: '2610.05739'
  venue: ''
  lane: 几何位姿寻址
  branch: 位姿视锥
  parent: null
  link_strength: null
  training: 需训
  status: 精读
  one_liner: 混合线性注意力 + 几何引导的分块检索历史
  mechanism: GDN 类线性注意力承担长序列大部分计算，softmax 只留精确交互；历史按空间关系分块，只取相关块进上下文。
  key_numbers:
  - 旋转误差 −28.5%
  - 记忆开销 1/12
  - 60s 1280×704@16fps
  self_measured:
  - PSNR +0.74dB
  media:
  - https://caesarhhh.github.io/hla-wm/videos/ar_refiner_hard80_game_style_005_f472_f708_ours.mp4
  - https://caesarhhh.github.io/hla-wm/videos/ar_refiner_hard80_game_style_005_f472_f708_baseline.mp4
  links:
  - https://arxiv.org/abs/2610.05739
  note: 数字是相对其自身基线，报告强调不可跨论文横比；只给到月份 2026-10。
  tags:
  - 线性注意力
  - 几何分块检索
  explain: 想象自动驾驶车在街区兜风，想根据几十秒前的旧画面预测未来，把所有看过的帧全塞给模型会直接撑爆显卡。HLA-WM 专门解决这种长序列下世界模型算力吃紧的麻烦。它用了混合注意力，也就是让省显存的线性计算挑大梁，只把精密计算留给关键局部；再配合几何分块检索，按真实空间位置把历史画面打包，只挑眼前相关的块放进内存。这招甩掉了无用画面的死记硬背，把记忆开销砍到十二分之一，旋转误差降低28.5%，稳稳撑住一分钟高清长序列。
  detail:
    position: HLA-WM 旨在缓解 Gated DeltaNet 在长时间视频生成中对遥远但相关场景的渐进式遗忘，同时保留线性注意力的低内存优势。它通过几何引导的历史分块检索，补充固定大小
      recurrent state 难以长期保留特定场景信息的问题。
    io: 输入是自回归视频生成过程中的历史信息、当前查询以及相机几何信息。输出是按当前查询重组的 recurrent state，供生成器用于后续视频生成与场景回访。
    steps:
    - 利用 Gated DeltaNet 处理长序列的大部分信息，并将历史按块整理，以避免完整保存不断增长的 KV cache。
    - 依据相机几何关系从历史块中检索与当前场景相关的内容，以找回可能被后续状态更新削弱的远距信息。
    - 缓存 Gated DeltaNet 的分块仿射转移摘要，以紧凑形式保留各历史块对状态转移的影响。
    - 根据当前查询重组检索块的转移摘要，计算 query-specific recurrent state，并用于后续视频生成。
    formulas:
    - tex: \mathcal{R}_t=\operatorname{TopK}_{c}\,s\!\left(g_t,g_c\right)
      caption: 按当前场景与历史块的几何关系检索相关块；标准写法，非原文
    - tex: S_t^{(c)}=A_cS_{t-1}^{(c)}+b_c,\qquad S_t^{\mathrm{ret}}=\left(\prod_{c\in\mathcal{R}_t}
        A_c\right)S_0+\sum_{c\in\mathcal{R}_t}\left(\prod_{j>c}A_j\right)b_c
      caption: 以仿射转移摘要重组检索块，得到 query-specific recurrent state；标准写法，非原文
    train: HLA-WM 是 training-free 方法，无需额外训练。推理时缓存分块转移摘要，按相机几何检索相关历史块并重组 recurrent
      state；摘要未给出更具体的实现设置。
    diff: 相较于完整保留生成历史的 softmax attention，HLA-WM 用紧凑的分块摘要和选择性检索降低历史状态内存开销；相较于仅依赖固定大小
      Gated DeltaNet state 的线性注意力，它能按几何关系重新访问相关历史。摘要报告在 60 秒上下文下，历史状态内存相较完整 KV caching
      减少 12 倍，推理吞吐最多下降 1.6%。
    limits: 推理吞吐最多下降 1.6%。摘要未见对几何检索适用条件、失败情形或其他局限的明确说明。
    has_abstract: true
- id: l2r
  title: L2R
  date: '2026-10-01'
  precision: month
  arxiv: '2610.11444'
  venue: ''
  lane: 几何位姿寻址
  branch: 位姿视锥
  parent: longlive-rag
  link_strength: dotted
  training: 需训
  status: 精读
  one_liner: 把检索学进模型，靠 3D 重可见性触发
  mechanism: 历史存在模型持久状态里；相机条件门决定取什么，3D 重可见性信号决定何时取，平时不做检索。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.11444
  note: 矩阵标注『3D 重可见性触发 → 偏几何』，lane 在内容/学习与几何/位姿之间存疑；只给到月份 2026-10。
  tags:
  - 重可见性触发
  - 模型内检索
  explain: 就像在陌生大楼里巡逻，如果每走一步都把之前的巡检录像翻看一遍，脑子早晚卡死，但不翻又容易认不出走回了原地。L2R 解决的就是空间感知建模时，频繁翻看历史太耗算力、扔掉历史又容易遗忘的麻烦。它把走过的历史存在模型内部的持久状态里，平时完全不检索；只有收到
    3D 重可见性——也就是镜头重新拍到曾去过的位置这一信号时才触发查阅，再由相机条件门——一个按当前视角挑记忆的开关——决定提取哪些内容。这样省去了每一步多余的计算开销，又能在故地重游时把关键记忆精准补齐。
  detail:
    position: L2R 解决视频 world model 在长时程生成中容易发生场景漂移、重访区域时难以保持一致的问题。它把历史内容检索纳入模型自身的生成过程，而不是依赖外部
      memory system。
    io: 输入是已有场景上下文与 camera trajectory，输出是与相机轨迹相对应的可探索场景视频。相机信号用于决定检索什么，3D re-visibility
      信号用于训练检索触发器决定何时检索；摘要称生成时不需要额外的 3D 条件。
    steps:
    - 将历史上下文保存在模型的 persistent internal state 中，使其成为生成过程内部可访问的记忆。
    - 根据当前 camera trajectory，通过 camera-conditioned retrieval gate 从内部状态中选择相关历史信息，以确定检索什么。
    - 使用由 3D re-visibility 信号监督的 retrieval trigger 判断先前观察到的内容是否重新进入当前视野，以确定何时检索。
    - 触发时将选出的历史信息纳入视频生成；未触发时保留现有上下文，从而减少不必要的检索并改善重访区域的一致性。
    formulas:
    - tex: \alpha_{t,i}=\operatorname{softmax}_i\!\left(\frac{q(c_t)^{\top}k(m_i)}{\sqrt{d}}\right),\qquad
        r_t=\sum_i\alpha_{t,i}v(m_i)
      caption: 相机条件检索：根据当前相机轨迹对持久状态中的历史记忆打分并聚合；标准写法，非原文
    - tex: z_t=\mathbb{1}[s_{\mathrm{rev}}(c_t,\mathcal{H}_{<t})>\tau],\qquad h_t^{\mathrm{ctx}}=z_t
        r_t+(1-z_t)h_{t-1}^{\mathrm{ctx}}
      caption: 由 3D 重可见性信号触发检索，并在未触发时保留现有上下文；标准写法，非原文
    train: 摘要说明使用 3D re-visibility signal 监督 retrieval trigger，并以 camera-conditioned
      retrieval gate 控制历史信息选择；未提供具体损失函数、训练数据、优化设置或训练与推理的完整流程细节。摘要称方法不需要外部 memory bank，生成时也不需要额外的
      3D 条件。
    diff: 已有方法通常在模型外部设置 memory system，显式检索先前观察到的内容；L2R 则利用模型的 persistent internal
      state，并将检索的时机与内容选择纳入模型生成过程。这样无需单独的外部检索通路或 memory bank。
    limits: 摘要未见明确说明计算代价、内部状态容量限制或适用范围等局限。
    has_abstract: true
- id: world-t3
  title: World-T3
  date: '2026-10-01'
  precision: month
  arxiv: '2610.17434'
  venue: ''
  lane: 参数化记忆
  branch: ''
  parent: null
  link_strength: null
  training: 需训
  status: 精读
  one_liner: 把世界状态写进快权重，按位姿直接取特征
  mechanism: 测试时训练：用递归最小二乘持续更新一小部分快权重，单步常数开销；读取按当前相机位姿从快权重取场景特征，不看历史帧。
  key_numbers:
  - 1280×704
  - 20.6FPS（B200）
  - PSNR 13.52→18.31dB
  - 旋转误差 3.344°→1.075°
  self_measured: []
  media:
  - https://arxiv.org/icons/licenses/by-4.0.png
  links:
  - https://arxiv.org/abs/2610.17434
  note: 报告指出摘要未说明 PSNR 基线是哪个配置，引用须注明；只给到月份 2026-10；站点资产 404，无演示。
  tags:
  - 快权重TTT
  - 位姿取特征
  explain: 就像机器人逛房间，如果走一步就得翻一遍所有旧照片，时间一长就会卡死。World-T3解决的就是频繁回看历史帧导致计算爆炸的麻烦。它在测试时训练中引入像速记便签一样能临时改动的快权重，用递归最小二乘持续更新这一小撮参数把场景存进去；读取时按当前相机位姿直接从快权重取特征，不再依赖历史帧。由于单步开销恒定，在B200上跑1280×704能达20.6帧，PSNR从13.52提至18.31分贝，旋转误差也由3.344度压到1.075度。
  detail:
    position: World-T3 解决长时程视频生成中，模型离开当前上下文后难以记住已观察场景、导致再次访问时画面不一致的问题。它将过去观察整合进测试时更新的快权重记忆，并按相机位姿读取场景特征。
    io: 输入是用于生成视频的条件，以及相机位姿信号；模型输出随相机运动变化的视频帧。生成时用新观察更新记忆，并依据当前相机位姿从记忆中读取特征。
    steps:
    - 从当前观察中提取视觉特征，并与相机位姿关联，为后续按位姿检索提供索引。
    - 用递归最小二乘规则在线更新一小部分快权重，将新特征吸收到记忆中，以持续整合已观察场景。
    - 根据当前相机位姿从快权重状态读取场景特征，而不依赖历史帧作为检索上下文，以支持长时程重访一致性。
    - 将自回归模型通过 dual-teacher distribution matching 蒸馏为 few-step generator，以加快交互式视频生成。
    formulas:
    - tex: K_t=\frac{P_{t-1}x_t}{\lambda+x_t^{\top}P_{t-1}x_t},\qquad W_t=W_{t-1}+(y_t-W_{t-1}x_t)K_t^{\top},\qquad
        P_t=\lambda^{-1}\left(P_{t-1}-K_tx_t^{\top}P_{t-1}\right)
      caption: 递归最小二乘在线更新快权重记忆；标准写法，非原文
    - tex: \alpha_i(p_t)=\frac{\exp\!\left(q(p_t)^{\top}k_i/\sqrt d\right)}{\sum_j\exp\!\left(q(p_t)^{\top}k_j/\sqrt
        d\right)},\qquad z_t=\sum_i\alpha_i(p_t)v_i
      caption: 根据当前相机位姿检索并聚合快权重中的场景特征；标准写法，非原文
    train: 记忆在测试时通过递归最小二乘规则在线更新；摘要称模型还通过 dual-teacher distribution matching 将自回归模型蒸馏为
      few-step generator。递归最小二乘的具体形式、训练数据、教师设置及其他训练细节摘要未给。
    diff: 已有自回归方法往往隐式依靠生成模型自身保留历史信息，可能出现超出活动上下文后的空间记忆衰减。World-T3 将观察写入快权重，并按相机位姿读取特征，使存储与每步计算不随生成时长增长。
    limits: 生成依赖相机位姿条件；摘要未见明确说明其余代价与局限，也未给出记忆更新和蒸馏的具体设置。
    has_abstract: true
- id: pwm
  title: PWM
  date: '2026-10-01'
  precision: unknown
  arxiv: '2609.10540'
  venue: ''
  lane: 代码世界模型
  branch: 代码定状态
  parent: code-world-model
  link_strength: dotted
  training: 不适用
  status: 速读
  one_liner: 状态执行器+确定性编译器的程序化世界模型
  mechanism: 状态执行器 + 确定性编译器（3D OBB）+ 渲染器 + VLM 写规范；状态显式可存档，渲染仍黑箱。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2609.10540
  note: 报告未给 arXiv 号、作者与日期，只有 §6 一行。
  tags:
  - 状态执行器
  - 确定性编译
  explain: 想象你在脑海里模拟玩沙盒游戏，如果全凭直觉凭空脑补画面，多想几步箱子就会变形甚至凭空消失。以前的世界模型也是如此，直接靠神经网络预测图像很容易逻辑崩塌，且中途状态根本没法保存。PWM把预测拆开，先让视觉语言模型写规则并由执行器更新物理数据，再用确定性编译器——也就是一套把逻辑状态严格转成三维带方向立体框的程序——排好空间关系，最后交给渲染器画图。它管用是因为把物理状态彻底变透明了，随时能精准存档，把死板的逻辑交给代码锁死，不再由黑箱瞎猜。
  detail:
    position: PWM 旨在解决视频世界模型难以长期维持持久世界状态、执行可编程规则的问题。它将世界状态演化与视觉观测生成分离，使规则执行和实体控制不依赖视频生成器隐式记忆状态。
    io: 输入包括自然语言指令和目标 camera trajectory，输出是按程序规则持续更新的世界状态及其渲染视频。状态增强的 3D OBB 与相机轨迹被编译为像素对齐的时空条件信号，供预训练
      video model 使用。
    steps:
    - 由 agent 将自然语言指令转成可执行程序，明确实体状态和状态转移规则，以便将用户意图落实为可执行机制。
    - 由轻量状态执行器运行程序并更新显式全局世界状态，保留离屏实体和非视觉属性，以支持持久状态与规则一致性。
    - 将实体状态编码为状态增强的 3D OBB，并结合目标 camera trajectory 确定性编译为像素对齐的时空条件信号，以连接结构化状态与视觉生成。
    - 将时空条件信号输入预训练 video model 作为生成渲染器，产生与当前世界状态相对应的视频观测。
    formulas:
    - tex: S_{t+1}=\operatorname{Exec}(P,S_t),\qquad S_t=\{s_i^t\}_{i=1}^{N}
      caption: 标准写法，非原文：由自然语言指令生成的可执行程序 P 驱动显式世界状态 S_t 递归更新。
    - tex: C_t=\operatorname{Compile}\!\left(\{\operatorname{OBB}(s_i^t)\}_{i=1}^{N},\,\tau^{\mathrm{cam}}_{t:t+T}\right),\qquad
        \hat{V}_{t:t+T}=R_{\theta}\!\left(C_t\right)
      caption: 标准写法，非原文：将实体状态编码的 3D OBB 与目标相机轨迹确定性编译为时空条件信号，再由视频渲染器生成视觉观测。
    train: 推理流程包括将自然语言转为程序、执行状态更新、编译 OBB 与相机轨迹得到条件信号，再由预训练 video model 渲染。摘要未给出模型训练数据、优化目标或关键训练设置。
    diff: 不同于依赖生成模型隐式维持状态的交互式视频世界模型，PWM 显式执行并持久保存全局状态，再通过确定性编译器将状态转为视觉条件。它支持对单个实体的直接控制及预设游戏机制，但视觉渲染仍由生成模型完成。
    limits: 摘要未见明确的计算代价或局限说明；视觉渲染仍由预训练 video model 生成，不能据摘要认定渲染过程本身可解释或确定。
    has_abstract: true
- id: worldmembench
  title: WorldMemBench
  date: '2026-10-01'
  precision: month
  arxiv: '2610.19063'
  venue: ''
  lane: 评测基准
  branch: ''
  parent: null
  link_strength: null
  training: 不适用
  status: 精读
  one_liner: 静态保持与动态演化必须分开报的回访基准
  mechanism: 不涉及记忆机制；260 例分静态 200/动态 60，四类轨迹（含多次回访）分别测外观几何与离屏事件演化。
  key_numbers:
  - 260 例
  - 静态 200
  - 动态 60
  - 四类轨迹
  self_measured: []
  media: []
  links:
  - https://arxiv.org/html/2610.19063
  note: 报告只给到月份 2026-10，且仅给 html 链接。
  tags:
  - 静动分测
  - 多次回访
  explain: 比如你走出厨房转一圈再回来，桌上的杯子必须原封不动，但灶台上的水可能已经烧开了。以往的评测常把这两类情况混在一块算总分，分不清模型到底哪项不行。这篇工作做了专门测模型回头看能力的评测基准，它不提出记忆算法，而是设计了包含四类轨迹的260个测试例，明确拆分成保持原貌的200个静态场景与发生变化的60个动态场景。这一招之所以灵，是因为它把物体的外观几何与视线之外的离屏事件演化拆开评分，一眼就能看清模型究竟是记不住东西，还是推测不出不在场时的变化。
  detail:
    position: WorldMemBench 旨在评估视频世界模型能否在镜头离开后保持已观察内容，并让世界状态随时间连贯演化。它将静态内容保持与动态事件演化分开测量，诊断模型的世界记忆能力。
    io: 输入是模型生成的视频及基准提供的场景、镜头离开与回访轨迹；条件信号包括初始参考内容和动态事件的预期状态转移。输出是静态与动态记忆评估结果，并报告视频质量和镜头跟随准确度作为补充诊断。
    steps:
    - 构建 260 个测试案例，分为静态记忆 200 例和动态记忆 60 例，以覆盖内容保持和事件演化两类能力。
    - 为案例设置四类轨迹，包括受控镜头离开与多次回访，以检验模型在内容不可见期间及重复回访后的记忆表现。
    - 静态案例将回访内容与固定的初始参考进行比较，分别评估人物身份与外观、物体外观与几何、环境内容与几何。
    - 动态案例依据离屏事件的预期状态转移评估事件进展与状态持续性，检验世界是否按历史连贯演化。
    - 汇总外观、几何及事件特定评估，并辅以视频质量和镜头跟随准确度，比较模型表现并分析记忆失效。
    formulas: []
    train: 摘要未给训练流程与训练设置；该工作描述的是评测基准。摘要未给具体推理设置。
    diff: 该基准不把世界记忆压缩成单一指标，而是区分静态内容保持与动态状态演化，并对两者采用不同参照进行评估。多次回访还可揭示首次回访之后出现的记忆退化。
    limits: 未见明确说明
    has_abstract: true
