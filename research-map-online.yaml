  explain: 就像让人回想两分钟前视频里的一把钥匙，时间太久脑子装不下容易忘。这篇论文要解决长视频里久远信息记不住的麻烦，做法是把历史画面实时存入外部库，需要时根据画面内容直接翻找，而不是按时间死板翻看。为了找得准，他们用了一种叫WTD损失的训练规则，用来教模型认本质变化而非表面长相，让换了角度的同一物体被认出、长相接近的不同物体被区分。整个流程在120s长度下额外开销约490毫秒，其中编码约480毫秒、检索仅约10毫秒，高效调出了关键记忆。
  detail:
    position: LongLive-RAG 解决自回归视频扩散进行长视频生成时，滑动窗口中的误差会沿生成轨迹累积并导致身份漂移的问题。它将已生成的 latent
      历史作为可检索记忆，让生成过程能够利用非局部上下文。
    io: 输入是当前生成块的 query embedding 和此前生成的 latent 历史，输出是自回归生成的后续视频块。生成块以检索到的相关历史 latent
      作为条件信号，而不只依赖最近窗口。
    steps:
    - 将此前生成的 latent 写入动态历史库，以便后续生成能够访问已离开当前窗口的内容。
    - 为当前待生成块构造 query embedding，并在历史库中按内容检索相关 latent，以获得非局部上下文。
    - 将检索到的历史 latent 用作当前块生成的条件，降低对可能已累积误差的近期窗口的单一依赖。
    - 训练检索表征时使用 Window Temporal Delta Loss，抑制局部冗余相似性并鼓励 embedding 捕捉有意义的时间变化。
    formulas:
    - tex: \mathcal{I}_t=\operatorname{TopK}_{i\in\mathcal{M}_t}\,\frac{q_t^{\top}k_i}{\|q_t\|\,\|k_i\|}
      caption: 按当前块的 query embedding 与历史库键向量的余弦相似度检索 Top-K 历史 latent；标准写法，非原文
    train: 摘要提到使用 Window Temporal Delta Loss 训练检索表征，但未提供训练数据、损失具体形式或关键训练设置。推理时逐块生成，将已生成
      latent 保存在动态历史库中，并在每个新块生成前检索相关历史 latent；检索增加的开销相对生成较小。
    diff: 已有方法常用 sliding-window attention，只基于近期窗口继续生成；LongLive-RAG 将自生成 latent 历史变为可按内容检索的记忆，并用检索结果提供非局部上下文。摘要称其为开放式自回归长视频生成中首个将自生成
      latent 历史建模为内容寻址检索记忆的方法。
    limits: 检索会带来额外开销，摘要称其相对生成较小，但未给出具体量化。其他局限未见明确说明。
    has_abstract: true
