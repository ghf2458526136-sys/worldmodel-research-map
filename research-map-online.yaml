  note: 长视频理解而非生成，泳道归属为"写权重"范式的边界案例；但"写哪里（哪层）+ 怎么写（蒸馏表示变化）"两个问题对 World-T3 类工作是直接补强。
  arxiv: '2610.26910'
  explain: 想象看完一部长片，合上屏幕后还要回答某个小细节：普通模型得反复翻找视频，片段太长时容易漏掉线索。MIT³让模型针对每段视频做一次测试时训练，把整段视频的信息写进专属参数。它先用因果追踪——观察改变某层记忆会怎样影响回答——找出最值得存信息的位置；再用视觉记忆蒸馏，把视频片段带来的表示变化转成纯文本记忆。这样，模型不必再看视频，也能凭这份记忆回答问题。关键在于它不是平均记住所有画面，而是把对回答真正有用的线索写进合适的层。
  detail:
    position: MIT^3 解决长视频问答中每次提问都需重新编码视频或检索视觉证据的问题。它将单个视频内化为紧凑的、视频专属的适配参数，使模型之后可在不输入视频的情况下回答问题。
    io: 输入是待适配的长视频，以及用于适配的紧凑多尺度监督和相关视频片段。输出是该视频专属的自适应参数；推理时输入文本问题，由模型在无视频输入的条件下生成答案。
    steps:
    - 对视频构建紧凑多尺度监督，以较少的合成样本提供视频问答适配信号。
    - 通过因果追踪测量各模型层对视频问答的因果记忆效用，以确定哪些层适合写入该视频知识。
    - 针对选定层进行视频专属适配，将视频知识写入紧凑的自适应参数。
    - 进行视觉记忆蒸馏，使纯文本记忆复现相关视频片段引起的表示变化，以保留文本监督未能直接表达的视觉证据。
    - 推理时仅提供文本问题并使用适配参数生成答案，从而无需再次输入视频。
    formulas:
    - tex: U_l=\mathbb{E}_{(v,q,a)}\left[\log p(a\mid q;\theta,\,h_l\leftarrow h_l^{\mathrm{video}})-\log
        p(a\mid q;\theta,\,h_l\leftarrow h_l^{\mathrm{base}})\right]
      caption: 标准写法，非原文：通过比较第 l 层注入视频记忆表征与基线表征时的答案对数概率，衡量该层的因果记忆效用。
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{(v,q)}\left\|\Delta h_{\mathrm{text}}(q)-\Delta
        h_{\mathrm{video}}(v,q)\right\|_2^2
      caption: 标准写法，非原文：蒸馏损失，使纯文本记忆引起的表示变化 \Delta h_{\mathrm{text}} 逼近相关视频片段引起的表示变化
        \Delta h_{\mathrm{video}}。
    train: 训练按视频进行适配，使用紧凑多尺度监督、因果追踪选层和视觉记忆蒸馏；推理时以视频专属适配参数支持纯文本问答。优化目标、具体损失、模型配置及其他训练细节摘要未给。
    diff: 已有参数化视频记忆方法主要依赖合成文本，并采用固定的适配配置。MIT^3 根据视频问答中的因果记忆效用选择写入层，并通过视觉记忆蒸馏保留视频片段对表示的影响。
    limits: 摘要未见明确说明额外计算代价、适用边界或失败情形；方法需针对每个视频进行适配。
    has_abstract: true
- id: rad
  title: Recurrent Autoregressive Diffusion (RAD)
  date: '2025-11-17'
  lane: 参数化记忆
  branch: 递归状态
  training: 训练
  status: 速读
  one_liner: DiT 层内插 LSTM 当全局记忆
  mechanism: 每个 DiT 层注意力后接 LSTM 递归块做记忆更新与取回，重叠滑窗全注意力保局部细节，训练推理无 gap；LSTM 表现约等于 TTT/Mamba2。
  tags:
  - 递归状态
  - 固定预算
  - 滑窗
  key_numbers:
  - Memory Maze / Minecraft
  - LSTM≈TTT≈Mamba2
  media:
  - https://yeyutaihan.github.io/recurrent-autoregressive-diffusion/videos/chunk_mamba/000000.mp4
  - https://yeyutaihan.github.io/recurrent-autoregressive-diffusion/videos/chunk_ttt/000000.mp4
  links:
  - https://arxiv.org/abs/2511.12940
  note: 便宜的参数化记忆基线——若 LSTM 状态已够，复杂的 TTT 写入未必划算，是我们做消融时的下限对照。
  arxiv: '2511.12940'
  explain: 想象镜头在迷宫里不断前进：转过几个弯后，模型若忘了入口在哪，就很难生成连贯的后续画面。RAD要解决的正是视频越长、记忆越容易丢的问题。它在DiT（一种逐步生成图像的网络）的每层注意力后加入LSTM（一种能反复写入和读取信息的记忆模块），边生成边更新全局记忆；同时用彼此重叠的滑动窗口处理邻近画面，保住局部细节。这样，远处的经历靠记忆传递，眼前的内容靠注意力衔接，训练和推理也无需留下间隙。在Memory
    Maze和Minecraft任务中，LSTM方案表现与TTT、Mamba2这两种记忆方法大致相当。
  detail:
    position: RAD 面向超长视频自回归生成，解决滑动窗口之外的历史信息难以保留和检索，进而造成遗忘与时空不一致的问题。它在固定记忆预算下结合全局历史记忆与局部细节建模。
    io: 输入输出是视频生成所需的具体张量形式及条件信号，摘要未给。方法用于自回归视频生成，并通过重叠滑动窗口处理局部视频内容、通过递归记忆利用历史信息。
    steps:
    - 将视频生成建模为自回归过程，并以重叠滑动窗口组织局部内容，使相邻窗口保留重叠区域。
    - 在 DiT 每层的 attention 后接入 LSTM 递归块，对历史信息进行记忆更新与取回，以支持窗口之外的长期依赖。
    - 对重叠窗口使用 full attention，保留窗口内及相邻窗口衔接处的时空细节。
    - 结合递归全局记忆与局部 attention 生成后续视频内容，避免训练与推理流程不一致。
    formulas:
    - tex: \begin{aligned} i_t&=\sigma(W_i x_t+U_i h_{t-1}+b_i),\quad f_t=\sigma(W_f
        x_t+U_f h_{t-1}+b_f),\\ o_t&=\sigma(W_o x_t+U_o h_{t-1}+b_o),\quad \tilde
        c_t=\tanh(W_c x_t+U_c h_{t-1}+b_c),\\ c_t&=f_t\odot c_{t-1}+i_t\odot\tilde
        c_t,\quad h_t=o_t\odot\tanh(c_t)\end{aligned}
      caption: LSTM 递归记忆的更新与取回；标准写法，非原文
    train: 摘要称该框架没有训练与推理 gap，但未说明训练数据处理、损失函数、优化设置或具体训练和推理步骤；相关细节摘要未给。
    diff: 相较于仅用滑动窗口 attention 的方法，RAD 在每个 DiT 层的 attention 后加入 LSTM，以固定记忆预算保留和检索长期历史。相较于已有
      diffusion-RNN 方法，它结合重叠窗口上的 full attention，并称可避免训练与推理 gap；LSTM 表现与 TTT、Mamba2
      等 RNN 块相当。
    limits: 摘要未见明确说明方法的局限或计算代价。
    has_abstract: true
- id: onstm
  title: Online Neural Space Time Memory (NSTM)
  date: '2026-07-16'
  lane: 参数化记忆
  branch: 测试时训练
  training: 测试时训练
  status: 速读
  one_liner: TTT 记忆更新与应用频率解耦
  mechanism: 视频内容高度冗余，故记忆按周期更新、逐帧施加，跨视角注意力管形变；加辅助 Memory Loss 强制内化历史、权重缓存正则防灾难漂移。
  tags:
  - 更新解耦
  - 权重缓存
  - 动态场景
  key_numbers:
  - 分钟级记忆持久
  - 摊销实时速度
  media:
  - https://nst-mem.github.io/videos/hero_combined.mp4
  links:
  - https://arxiv.org/abs/2607.15271
  - https://nst-mem.github.io
  note: 动态新视角合成为任务，不直接是长视频世界模型；但"更新频率 vs 施加频率"解耦是 TTT 记忆落地的关键工程点，泳道归属存疑故标 low。
  arxiv: '2607.15271'
  explain: 想象一台摄像机连续拍摄一间屋子：画面每秒变化，但桌椅位置大多没变。若模型每帧都重建记忆，既耗时又容易忘掉远处的过去；若不更新，又跟不上物体移动。在线神经时空记忆让记忆更新与使用分开：用测试时训练（TTT）按周期吸收新内容，却逐帧调用记忆。视频冗余让较少更新也能覆盖多数新信息，跨视角注意力则帮助模型对齐不同画面中的形变。辅助记忆损失促使模型把历史写进记忆，权重缓存正则则限制更新幅度，避免学新内容时破坏旧知识。实验显示，它能让记忆保持分钟级，并以摊销后的实时速度处理视频。
  detail:
    position: 这篇工作解决动态场景在线新视角合成中的长时记忆与实时计算之间的矛盾。它希望在遮挡区域暂时不可见时仍能利用历史信息重建，同时降低逐帧更新记忆的开销。
    io: 输入是多视角流式视频，输出是在线新视角合成结果。当前帧与历史记忆用于逐帧应用记忆，目标视角等具体条件信号摘要未给。
    steps:
    - 接收多视角流式视频并维护场景记忆，以便为后续帧保留历史信息。
    - 逐帧将记忆应用于当前内容，并通过 cross-view attention 处理先前记忆状态与当前帧之间的形变。
    - 利用视频内容冗余，按周期而非逐帧执行基于 Test-Time Training 的记忆更新，以减少计算开销。
    - 加入辅助 Memory Loss，促使模型持续内化场景历史，从而支持对暂时遮挡区域的重建。
    - 采用 Memory Caching 约束活动权重，降低长上下文中的灾难性漂移。
    formulas:
    - tex: \theta_m^{(t+1)}=\theta_m^{(t)}-\eta\nabla_{\theta_m}\left(\mathcal{L}_{\mathrm{recon}}+\lambda\mathcal{L}_{\mathrm{mem}}+\gamma\lVert\theta_m-\theta_{\mathrm{cache}}\rVert_2^2\right)
      caption: 标准写法，非原文：周期性测试时训练更新记忆，并用历史记忆损失与缓存权重约束减少漂移。
    - tex: \operatorname{Attn}(Q,K,V)=\operatorname{softmax}\!\left(\frac{QK^{\top}}{\sqrt{d}}\right)V
      caption: 标准写法，非原文：跨视角注意力聚合当前帧与先前记忆的信息，以处理视角变化和形变。
    train: 摘要未给具体训练流程、周期设置或损失函数形式。推理时逐帧应用记忆，并周期性执行记忆更新；摘要称其在分钟级记忆持续能力下达到摊销实时速度。
    diff: 标准 Test-Time Training 模型通常每帧都进行基于梯度的记忆更新；本文将记忆更新与记忆应用解耦，改为周期更新、逐帧应用。另以 Memory
      Loss 和 Memory Caching 增强历史内化并抑制权重漂移。
    limits: 摘要指出记忆更新开销高且长上下文中可能不稳定，但提出的方法未消除周期更新本身的计算成本。具体适用边界与局限未见明确说明。
    has_abstract: true
- id: zo3t
  title: Zo3T
  date: '2025-09-08'
  lane: 参数化记忆
  branch: 测试时训练
  training: 免训
  status: 速读
  one_liner: 测试时LoRA让视频贴合相机轨迹
  mechanism: 3D 感知运动投影用推断深度推透视正确仿射，去噪中动态注入并优化临时 LoRA 适配被操纵 latent，区域特征一致性损失约束，配 guidance
    场校正。
  tags:
  - 临时LoRA
  - 轨迹控制
  - 零样本
  key_numbers:
  - 零样本
  - 摘要未给指标
  media: []
  links:
  - https://arxiv.org/abs/2509.06723
  note: 单段轨迹控制的 I2V，无长程历史回溯；收进来只因它是"位姿条件 × 测试时训练"最早的一批样本，可作方法拼装参考。
  arxiv: '2509.06723'
  explain: 想象让一段视频里的镜头沿着弯曲轨迹绕过桌上的茶杯：普通视频生成模型可能让镜头动了，杯子却变形、漂移，或前后画面接不上。Zo3T要解决的正是相机运动与场景运动难以协调的问题。它先根据模型推断的深度，把相机轨迹投影成符合透视的画面变换；再在逐步去噪生成视频时，把变换动态施加到潜在表示，也就是压缩后的画面特征上。与此同时，它临时优化低秩适配器（LoRA，一种轻量的模型参数补丁），让生成内容贴合变换后的表示，并用区域特征一致性损失约束同一物体别在镜头运动中走样。最后，指导场会修正生成方向。这样既能跟随指定镜头运动，也尽量保住场景结构；方法无需额外训练，但摘要未给出量化指标。
  detail:
    position: Zo3T 解决图像到视频生成中，生成视频难以准确遵循用户指定运动轨迹的问题。它针对忽略 3D 透视和操纵 latent 与网络噪声预测不匹配所导致的不真实运动及生成失真。
    io: 输入是待生成视频的图像和用户指定的运动轨迹，输出是遵循该轨迹的视频。条件信号包括从场景推断的深度以及轨迹约束。
    steps:
    - 推断场景深度，并据此为目标区域计算考虑透视的仿射变换，使轨迹运动更符合 3D 几何。
    - 在去噪过程中按轨迹操纵 latent，并动态注入临时 LoRA 适配器，使网络表示能够适应操纵后的 latent。
    - 使用区域特征一致性损失联合约束 latent 与 LoRA 更新，以推动目标区域遵循运动轨迹并保持生成保真度。
    - 通过一步前瞻优化条件 guidance field，校正去噪演化路径，使生成过程更有效地朝目标轨迹推进。
    formulas:
    - tex: \mathbf{p}'=\pi\!\left(\mathbf{K}\left(\mathbf{K}^{-1}\tilde{\mathbf{p}}+\frac{\Delta\mathbf{X}}{D(\mathbf{p})}\right)\right)
      caption: 标准写法，非原文：利用估计深度将图像点反投影到 3D、施加运动并重新投影，以体现透视的运动映射。
    - tex: \min_{\{\mathbf{z}_t\},\{\Delta\theta_t\}}\sum_t\left\|\phi_R\!\left(\mathcal{D}(\mathbf{z}_t;\theta+\Delta\theta_t)\right)-\mathcal{W}_{A_t}\!\left[\phi_R\!\left(\mathcal{D}(\mathbf{z}_t;\theta+\Delta\theta_t)\right)\right]\right\|_2^2
      caption: 标准写法，非原文：区域特征一致性目标，联合优化去噪 latent 与临时 LoRA 参数，使目标区域特征符合轨迹对应的变换。
    train: 这是 zero-shot test-time-training 框架，不依赖针对稀缺标注数据进行预先微调；推理时在去噪过程中与 latent
      状态共同优化临时 LoRA。区域特征一致性损失和 guidance 场的一步前瞻校正用于约束生成；具体优化器、步数及其他关键设置摘要未给。
    diff: 相比依赖稀缺标注数据进行计算密集型微调的方法，Zo3T 在测试时动态优化临时 LoRA。相比仅在 latent 空间控制轨迹的零样本方法，它结合深度感知的透视投影、网络适配和
      guidance 场校正，以缓解运动不真实及 latent 与噪声预测失配。
    limits: 摘要未见明确说明。
    has_abstract: true
- id: comoe
  title: Composition of Memory Experts
  date: '2026-05-12'
  lane: 参数化记忆
  branch: 专家组合
  training: 训练+测试时微调
  status: 速读
  one_liner: 短期/长期/空间三记忆专家组合
  mechanism: 用对比式 product-of-experts 组合异构记忆：短期专家抓局部动态，长期专家经轻量测试时微调把情节历史写进外部扩散权重，空间专家保几何一致。
  tags:
  - 专家组合
  - 测试时微调
  - 情节记忆
  key_numbers:
  - ICLR 2026
  media: []
  links:
  - https://arxiv.org/abs/2605.18813
  note: 面向机器人/规划的扩散世界模型，无项目页；机制描述取自摘要，未读正文，故 low。亮点是把"写进权重的情节记忆"当成可组合的一个专家而非唯一记忆。
  arxiv: '2605.18813'
  explain: 想象镜头跟着一个人穿过房间：刚才移开的椅子不能突然复位，门的位置也不能漂移。视频世界模型要预测后续画面，却常难同时记住眼前动作、较早发生的事和场景几何。《Composition
    of Memory Experts》把记忆拆成三位专家：短期专家捕捉局部动态，长期专家通过轻量的测试时微调，把情节历史写入外部扩散模型的权重；空间专家则维持几何一致。它用对比式“专家乘积”组合这些记忆——可理解为让不同专家的判断相互约束、共同支持合理预测。这样，模型既能跟上动作，又不易忘掉旧事或弄乱空间。论文发表于
    ICLR 2026。
  detail:
    position: 这篇论文要解决世界模型中的记忆权衡：Transformer 保留局部细节但注意力开销随上下文增长，循环与状态空间模型更高效却可能损失历史细节。论文组合不同记忆专家，以提升长上下文下未来预测与过去观测的一致性。
    io: 输入是过去的观测，输出是与这些观测一致的未来预测。条件信号包括历史观测；摘要未说明空间专家使用的具体条件输入。
    steps:
    - 从历史观测提取短期信息，由短期记忆专家捕捉细粒度局部动态，以保留近期变化。
    - 对历史情节进行轻量测试时微调，将长期记忆写入外部扩散权重，以支持对过去观测的回忆。
    - 由空间长期记忆专家约束几何与空间一致性，以减少预测中的空间不连贯。
    - 通过对比式 product-of-experts 组合三类专家的作用，以整合互补记忆并生成一致的未来预测。
    formulas:
    - tex: p(y\mid x)=\frac{1}{Z(x)}\,p_{\mathrm{short}}(y\mid x)\,p_{\mathrm{long}}(y\mid
        x)\,p_{\mathrm{space}}(y\mid x)
      caption: 标准写法，非原文：以 product-of-experts 形式组合短期、长期与空间记忆专家的预测。
    train: 摘要未给出完整训练流程、损失函数或推理设置；摘要提到长期记忆通过轻量测试时微调写入外部扩散权重。
    diff: 不同于依赖单一架构承担全部记忆功能的方法，本文以对比式 product-of-experts 组合异构记忆模型。其设计同时覆盖局部动态、情节历史回忆和空间一致性，目标是在扩展上下文时避免二次注意力开销。
    limits: 摘要未见明确说明具体计算代价、测试时微调开销及方法局限。
    has_abstract: true
- id: alayaworld
  title: 'AlayaWorld: Interactive Long-Horizon World Modeling — Full Technical Report
    (v1.1)'
  date: '2026-08-13'
  lane: 框架层
  branch: 闭源产品
  training: 需训
  status: 速读
  one_liner: 流式3D点缓存替掉深度扭曲记忆
  mechanism: 骨架不动，空间记忆换成流式3D点缓存重渲染；视觉条件改走同一因果VAE潜空间，记忆窗口在像素域对齐，硬dropout直接删记忆token，视角全交重渲染条件。
  tags:
  - 流式点云缓存
  - 条件生成对齐
  - 块级自回归
  key_numbers:
  - v1.1 六项改动
  - 记忆不再靠深度扭曲
  media: []
  links:
  - https://arxiv.org/abs/2608.13492
  note: 摘要只写相对上一版的改动、未给指标；上一版未单独收录，本条以 v1.1 技术报告为准。闭源判断依据其为企业技术报告，权重是否公开未见说明。
  arxiv: '2608.13492'
  explain: 想象摄像机绕着一张桌子转：若只凭旧画面的深度把记忆“扭”到新视角，桌脚和杯子容易错位，镜头走远了，细节也会丢。AlayaWorld要解决的正是长时间生成视频时，场景记忆失真、视角变化难以应对的问题。它保留原有骨架，把空间记忆改成持续更新的三维点缓存：每个点记录场景位置与外观，换视角时再从点缓存重渲染画面。视觉条件和生成过程改用同一套因果变分自编码器潜空间，也就是把画面压成可逐步预测的表示；记忆窗口则在像素域对齐，删除记忆时直接丢掉对应的记忆标记。这样，模型不必把旧画面硬扭成新画面，而能按新视角重新看场景，减少几何错位，让长程互动更稳定。v1.1报告包含六项改动，核心转变是记忆不再依赖深度扭曲。
  detail:
    position: 本文针对交互式长时程世界建模中条件信号与生成视频在潜空间表示和时间结构上不匹配的问题进行改进。目标是让空间记忆和视角条件更贴近模型生成的视频。
    io: 输入包括用于生成的视频条件、流式空间记忆及视角信息；输出为分块自回归生成的视频。视觉条件通过因果 VAE 潜变量提供，视角控制由重渲染后的空间条件提供。
    steps:
    - 将深度扭曲式空间记忆替换为流式 3D 点缓存，并据此重渲染空间条件，以更直接地提供空间记忆。
    - 把静态帧图像条件改为运动感知的潜变量条件，并用因果 VAE 编码，使条件表示与生成视频的潜空间一致。
    - 将重渲染的空间记忆因果编码为连续序列，并在像素域对齐 temporal-memory 窗口，以匹配生成视频的时间结构。
    - 使用 hard memory dropout 直接移除记忆 token，以避免通过将 token 置零来模拟记忆缺失。
    - 统一训练与推理时的 VAE 编码、解码协议，并移除 camera AdaLN 分支，使视角控制完全由重渲染的空间条件承担。
    formulas:
    - tex: \mathcal{P}_t=\mathcal{P}_{t-1}\cup\operatorname{BackProject}(I_t,D_t,\pi_t),\qquad
        S_t=\mathcal{R}(\mathcal{P}_t,\pi_t),\qquad M_{t:t+L-1}=E_{\mathrm{cVAE}}(S_{t:t+L-1}),\quad
        z_{t:t+L-1}=E_{\mathrm{cVAE}}(V_{t:t+L-1})
      caption: 标准写法，非原文：流式3D点缓存更新、视角重渲染，以及空间记忆与生成视频在同一因果VAE潜空间和时间窗口中的对齐
    - tex: \widetilde{M}=(M_i)_{i\in\mathcal{I}},\qquad \mathcal{I}=\{i:b_i=1\},\qquad
        b_i\sim\operatorname{Bernoulli}(1-p)
      caption: 标准写法，非原文：hard memory dropout，通过直接移除被丢弃的记忆token而非将其置零
    train: 骨干架构、分块自回归生成方案和训练数据保持不变；训练与推理统一 VAE 编码和解码协议。其余训练细节和关键超参数摘要未给。
    diff: 相较于先前版本，空间记忆由深度扭曲改为流式 3D 点缓存重渲染，视觉条件也改为与生成视频共享因果 VAE 潜空间并匹配时间结构。视角控制不再依赖
      camera AdaLN 分支，而完全由重渲染的空间条件提供。
    limits: 摘要未见明确说明计算代价、点缓存维护开销或方法局限。
    has_abstract: true
- id: waypoint-15
  title: 'Waypoint-1.5: A Real-Time Video World Model for Consumer Hardware'
  date: '2026-09-29'
  lane: 框架层
  branch: 闭源产品
  training: 需训
  status: 速读
  one_liner: 10万小时游戏数据练键鼠全控实时模型
  mechanism: 用10万小时、跨数百款游戏的控对齐视频预训练扩散世界模型，条件含整键盘加鼠标输入；区分渲染FPS/潜空间FPS/控制率三档指标，两档分辨率覆盖消费级显卡。
  tags:
  - 键鼠全控
  - 消费级实时
  - 数据管线
  key_numbers:
  - 10万小时
  - 数百款游戏
  - 两档分辨率
  media: []
  links:
  - https://arxiv.org/abs/2609.37107
  note: 摘要明确写数据管线/架构/训练/运行时四件套，但未给具体延迟与FPS数值，只给"以延迟与吞吐评交互性"，故 key_numbers 只留可核实的规模数。
  arxiv: '2609.37107'
  explain: 想象你在陌生游戏里按下方向键、转动鼠标，画面立刻随操作变化。让模型也做到这一点，难点不只是生成视频，还要理解整套键鼠输入，并跟上实时节奏。Waypoint-1.5用十万小时、数百款游戏的“操作—画面”配对数据，训练扩散世界模型：它根据当前画面和动作，生成接下来的画面。跨游戏的大量样本帮助模型学到更通用的动作与视觉规律，键盘和鼠标作为输入条件，则让玩家能直接控制生成的世界。论文分别报告画面渲染帧率、模型内部潜空间的帧率和控制更新率，避免把不同速度混为一谈；还提供两档分辨率，让实时运行覆盖消费级显卡。它要缩小的，正是模型会生成、却难连续操控或实时运行的落差。
  detail:
    position: 这篇工作研究如何在消费级硬件上实现可交互的实时视频生成。核心问题是让扩散世界模型在响应密集键盘和鼠标控制的同时满足低延迟与高吞吐要求。
    io: 输入是用户的完整键盘和鼠标控制信号，模型还以游戏视频数据中对齐的控制信息作为学习依据。输出是随用户操作变化的可玩视频。
    steps:
    - 收集跨数百款游戏、总计 10 万小时且与控制信号对齐的视频数据，为学习多样游戏动态及其控制响应提供训练基础。
    - 用这些数据预训练扩散世界模型，并将完整键盘和鼠标输入作为条件，使生成视频能够响应用户控制。
    - 提供两个分辨率版本并在消费级硬件上运行，以适配不同硬件条件下的实时生成需求。
    - 分别考察渲染 FPS、潜空间 FPS 和控制率，并评估延迟与吞吐量，以刻画模型的实时交互能力。
    formulas: []
    train: 摘要说明模型在 10 万小时、跨数百款游戏且控制对齐的视频数据上预训练，并提供两个分辨率版本。摘要提到会介绍数据管线、架构、训练方法和运行时系统，但未给出具体模型结构、优化目标、训练超参数或推理设置。推理时依据键盘和鼠标输入生成可交互视频，并以延迟和吞吐量评估交互性能。
    diff: 不同于通常侧重生成视频的通用 video diffusion model，Waypoint 1.5 面向需要持续响应密集用户控制的 interactive
      world model。它明确区分渲染 FPS、潜空间 FPS 和控制率，并针对消费级硬件提供两档分辨率。
    limits: 摘要强调实时交互受延迟、吞吐量和硬件条件约束，但未提供具体性能数值或适用硬件范围；其他代价与局限未见明确说明。
    has_abstract: true
- id: state-world-models
  title: 'State World Models: Execute the Rules, Generate the Pixels'
  date: '2026-10-19'
  lane: 框架层
  branch: 符号状态
  training: 免训
  status: 速读
  one_liner: 状态机执行规则，视频模型只管渲染
  mechanism: 玩家动作先被编译成事件写入隐藏状态机，再由可编辑3D场景的预览片提供空间与相机引导，冻结的视频模型只负责渲染；配WorldState-Bench的50对反事实孪生。
  tags:
  - 状态机外置
  - 反事实孪生
  - 规则遵循
  key_numbers:
  - 32%→64%→92%
  - 50对孪生
  - 11个视频后端
  media: []
  links:
  - https://arxiv.org/abs/2610.26811
  note: 同一冻结 MiniMax-H3 只靠 harness 把"该结局命中率"从32%提到92%，是"规则-渲染分离"最硬的因果证据；harness 本身免训。
  arxiv: '2610.26811'
  explain: 想象玩家推开一扇门，门后本该是走廊，视频却可能把它变成窗外，还让角色忽然瞬移。视频世界模型的麻烦正在于：画面好看，却常记不住规则和状态。论文把玩家动作先编译成事件，写进隐藏状态机——一种记录世界当前状态并按规则更新的系统；再用可编辑三维场景的预览片提示空间布局和镜头，最后让冻结的视频模型只负责生成画面。规则由状态机掌管，模型便不必一边猜逻辑、一边画像素，因此更稳定。作者用含50对反事实孪生场景的WorldState-Bench检验：孪生场景只改一个条件，用来查模型是否按规则改变结果。报告数字从32%升至64%、再到92%，方案也接入11个视频后端，显示这套分工并不依赖单一模型。
  detail:
    position: 这篇工作解决视频模型在当前画面看不到隐藏状态时，难以持续遵守规则并生成正确动作结果的问题。它将世界状态演化与视频渲染分开，让状态机执行规则，视频模型负责呈现结果。
    io: 输入包括用户动作、当前隐藏世界状态及规则，以及可编辑 3D 场景提供的预览片段。输出是符合规则的事件状态和对应生成视频，并将生成片段用于更新下一轮世界状态。
    steps:
    - 接收玩家动作并结合当前状态与规则解析动作，因为动作结果可能取决于画面中不可见的信息。
    - 将动作编译为事件并写入隐藏状态机，以显式执行规则并得到演化后的世界状态。
    - 从可编辑 3D 场景生成预览片段，提供空间布局与相机运动引导，约束视频生成的呈现。
    - 把事件编译成指令交给冻结的视频模型渲染，使视频模型专注生成画面而非推断规则。
    - 利用生成片段更新下一轮世界状态，以支持后续连续交互。
    formulas: []
    train: 摘要未给训练流程。推理时，Stateful Harness 根据用户动作和隐藏状态执行规则，将结果事件编译为指令，并结合可编辑 3D 场景的预览片段引导冻结的视频模型渲染；生成片段随后用于更新世界状态。评测使用包含
      50 对反事实孪生的 WorldState-Bench；摘要报告规则提示下最佳视频后端的成对正确率为 32%，MiniMax-H3 在指定结局后为 64%，完整
      harness 使用同一冻结模型达到 92%。
    diff: 已有方法通常让视频模型从单张图像生成动作条件视频，侧重场景导航，但未必能处理依赖隐藏状态的规则。本文将规则执行与像素渲染拆开，由状态机决定事件结果，再由冻结视频模型生成画面。
    limits: 未见明确说明
    has_abstract: true
- id: mass
  title: 'MASS: Multiplayer World Models with Authoritative Shared State'
  date: '2026-08-06'
  lane: 框架层
  branch: 符号状态
  training: 需训
  status: 速读
  one_liner: 权威共享状态撑千人在线世界模型
  mechanism: 学到的Logic Engine把联合动作推进成全局权威typed状态、作唯一循环记忆；Rendering Engine再由该状态按需为任意相机生成独立且一致的视图，全程无手写转移函数。
  tags:
  - 权威状态
  - 多玩家并发
  - 按需新视角
  key_numbers:
  - 1024并发玩家
  - 10000递归步
  - Snake多人基准
  media: []
  links:
  - https://arxiv.org/abs/2608.06257
  note: 目前唯一把"多玩家状态一致性"做成一级指标的框架；评测只在多人Snake上，泛化到3D场景未验。
  arxiv: '2608.06257'
  explain: 想象一座千人同游的蛇形世界：每个人看到的镜头不同，蛇却必须共享同一张地图，否则转弯、碰撞都会对不上。MASS要解决的正是多人视频世界模型的难题：既要让许多玩家同时行动，又要让各自画面彼此一致。它让学到的逻辑引擎把所有人的联合动作推进为一份全局权威状态，也就是记录世界中物体与关系的结构化数据；这份状态是唯一的循环记忆。渲染引擎再按需从中生成任意相机视角，不必让每个视角各自猜世界怎么变。由于状态集中更新、画面从同一来源生成，模型能减少视角冲突；整个过程不靠人工编写转移规则。论文在多人贪吃蛇基准中展示了1024名玩家并发、连续递归10000步的能力。
  detail:
    position: 这篇工作解决多人世界模型将世界状态与视角相关视觉表示纠缠，导致重复计算、不同视角不一致和扩展性差的问题。它用权威共享状态将世界动态与视图渲染分离。
    io: 输入是玩家的联合动作，以及生成视图时请求的相机条件。输出是推进后的全局 typed state，以及基于该状态按需生成的对应视图。
    steps:
    - Logic Engine 接收联合动作并推进全局 typed state，使多人世界动态由共享状态统一表示。
    - 将全局 typed state 作为唯一循环记忆和同步依据，避免各视角分别维护相互偏离的世界状态。
    - Rendering Engine 根据共享状态和请求的相机条件生成视图，使不同玩家视角能够独立生成且保持一致。
    formulas:
    - tex: s_{t+1}=\mathrm{LogicEngine}\!\left(s_t,a_t^{1:N}\right)
      caption: 标准写法，非原文；Logic Engine 根据全局权威状态和所有玩家的联合动作更新共享状态。
    - tex: x_t^i=\mathrm{RenderingEngine}\!\left(s_t,c_t^i\right)
      caption: 标准写法，非原文；Rendering Engine 根据共享状态和玩家 i 的相机条件生成该玩家的视图。
    train: 摘要未给训练流程、损失函数或关键训练设置。推理时由 Logic Engine 根据联合动作递归推进权威共享状态，再由 Rendering Engine
      按需生成视图；摘要报告其在匹配的多人 Snake 基准上推进了 1,024 名并发玩家、持续 10,000 个循环步骤。
    diff: 已有多视角方法容易将状态与视角相关视觉表示绑定；MASS 将共享的世界状态推进与相机条件化的视图渲染分开。其 Logic Engine 学习状态转移，不依赖手写转移函数，并以权威状态作为唯一循环记忆。
    limits: 未见明确说明
    has_abstract: true
