  mechanism: 喂给模型的上下文体积恒定，历史按帧重要性打包压缩；另配反漂移采样抑制误差累积。
  key_numbers:
  - 13B
  - 6GB 显存
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2504.12626
  note: 报告只给到月份 2025-04；lane 依矩阵『重要性打包』归内容/学习，报告未述具体检索键。
  tags:
  - 重要性打包
  - 反漂移采样
  explain: 长视频生成就像用一本页数固定的笔记本去记长途旅行，画面越堆越多，显存随时会爆。这篇论文解决的就是长视频生成中历史帧越积越多、显存吃不消的麻烦。它的做法是把上下文，也就是模型每次能参考的历史信息总量锁死，按照重要性把旧帧打包压缩，时间越久远压得越狠；同时搭配反漂移采样，即一种抑制误差累积、防止画面越来越变形的纠偏方法。这招管用是因为远景历史只要保留粗略轮廓就能稳住连贯性，省下算力留给近处细节，最终实现了把
    13B 模型塞进 6GB 显存里流畅运行。
