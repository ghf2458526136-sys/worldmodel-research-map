  one_liner: sink+窗口的分层缓存骨架起点
  mechanism: 报告只写『sink+窗口』：保留开头若干 sink token 加最近窗口，作为后续所有流式框架的分层缓存底座。
  key_numbers:
  - '2023'
  self_measured: []
  media: []
  links: []
  note: 报告只给年份 2023，无 arXiv 号；training=免训为推断，报告未述其训练需求。
  tags:
  - Sink驻留
  - 滑动窗口
  explain: 想象你跟人连聊几天几夜，脑袋记不下，聊到后面不仅忘事还会发疯胡话。2023年提出的StreamingLLM解决的就是大模型做无限流式输入时显存撑爆、输出崩溃的麻烦。它的招数是在保存历史计算记忆的缓存里，只保留最开头的几个汇元即sink
    token，再加上最近的一段窗口。这招管用是因为模型在算注意力时，总会把多余的关注度倾泻在开头的词里充当泄洪池；只要留住它们来稳定全局注意力分布，再配合近期的上下文，模型不用重新训练就能无限流畅地聊下去。
